<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NAND to Everything</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=VT323&display=swap" rel="stylesheet">
<style>
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  main{flex:1;display:flex;min-height:0}
  #side{width:300px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px}
  #levels .act{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--dim);margin:10px 0 4px}
  #levels .lv{display:flex;justify-content:space-between;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:14px}
  #levels .lv:hover{background:var(--panel2)}
  #levels .lv.cur{background:var(--panel2);outline:1px solid var(--accent)}
  #levels .lv.locked{opacity:.35;cursor:default}
  #levels .stars{color:var(--accent);font-size:12px}
  #stage{flex:1;position:relative;min-width:0}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #delBtn{display:none} #delBtn.on{display:inline-block}
  #brief h2{margin:0 0 6px;font-size:18px}
  #brief p{margin:6px 0;font-size:14px;line-height:1.45}
  #palette{display:flex;flex-wrap:wrap;gap:6px}
  #palette button{font-size:12px;padding:4px 8px}
  #result{font-size:13px;line-height:1.5}
  #result .fail{color:var(--bad)} #result .ok{color:var(--good)}
  table.tt{border-collapse:collapse;font-size:12px;font-family:ui-monospace,monospace}
  table.tt td,table.tt th{border:1px solid var(--line);padding:2px 6px;text-align:center}
  .hud{position:absolute;top:10px;left:10px;display:flex;gap:8px;align-items:center}
  .hud .pill{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px}
  .help{position:absolute;bottom:10px;left:10px;font-size:12px;color:var(--dim)}
  /* software view */
  #soft{display:none;flex:1;min-width:0;padding:14px;gap:14px;overflow:auto}
  #soft.on{display:flex}
  #code{width:340px;height:calc(100vh - 140px);font-family:ui-monospace,monospace;font-size:13px;line-height:1.5;resize:none;tab-size:4}
  .regs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;font-family:ui-monospace,monospace}
  .regs div{background:var(--panel2);border-radius:6px;padding:6px;text-align:center}
  #mem{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;font-family:ui-monospace,monospace;font-size:11px}
  #mem div{background:var(--panel2);text-align:center;padding:2px;border-radius:3px}
  #mem div.pc{outline:1px solid var(--accent)}
  #disp{display:grid;grid-template-columns:repeat(8,18px);gap:2px}
  #disp div{width:18px;height:18px;background:#222;border-radius:2px}
  #disp div.on{background:var(--good)}
  .tape{font-family:ui-monospace,monospace;font-size:13px;word-break:break-all}
  #isa{font-size:12px;font-family:ui-monospace,monospace;line-height:1.6;white-space:pre}
  #result .next{margin-top:8px}
  canvas.hist{display:block;width:100%;height:70px;margin:4px 0;background:#f8f4e6;border:1px solid #9d9479}
  @media (max-width:760px){
    body{height:auto;min-height:100vh;overflow:auto}
    main{flex-direction:column}
    #side{width:auto;border-right:0;border-bottom:1px solid var(--line);order:2}
    #stage{flex:none;height:64vh;order:1}
    #soft{flex-direction:column;order:1}
    #code{width:100%;min-height:260px}
    .topbar{flex-wrap:wrap}
    .help{display:none}
  }
</style>
<style id="bench">
  /* World: a 1970s hobbyist's breadboard. Green solder mask, copper, silkscreen, black DIP packages; the side panel is a datasheet. */
  :root{--bg:#0b3a23;--panel:#f1ecdc;--panel2:#e4dcc4;--ink:#1b1a15;--dim:#5f5a49;--line:#b6ad93;--accent:#b8642a;--good:#1d6e35;--bad:#b3261e;
    font-family:"IBM Plex Mono",ui-monospace,monospace}
  body{background:#0b3a23 radial-gradient(circle at 12px 12px,#c98a4b 0 2px,#0a2a19 2.2px 3.2px,transparent 3.4px) 0 0/24px 24px;color:var(--ink)}
  .topbar{background:linear-gradient(#11563a,#0d4630);border-bottom:3px solid #c98a4b;color:#ecebdf;box-shadow:0 2px 0 #062014}
  .topbar h1{font-family:"IBM Plex Mono",monospace;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:#ecebdf}
  .topbar .home,.topbar .dim{color:#cfe3cf}
  button{font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#1b1a15;
    background:linear-gradient(#f4efdf,#d6ccb0);border:1px solid #5e5641;border-radius:3px;box-shadow:0 3px 0 #5e5641,inset 0 1px 0 #fff8;padding:6px 11px;transition:transform .05s,box-shadow .05s}
  button:hover:not(:disabled){border-color:#1b1a15}
  button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #5e5641}
  button:focus-visible{outline:2px dashed #b8642a;outline-offset:3px}
  button.primary{background:radial-gradient(circle at 40% 30%,#e85a4c,#b3261e 70%);color:#fff7ec;border-color:#5c0f0a;box-shadow:0 3px 0 #5c0f0a,inset 0 1px 0 #ffb3a8aa;font-weight:700}
  #side{background:#f1ecdc repeating-linear-gradient(0deg,transparent 0 23px,rgba(60,90,60,.08) 23px 24px);border-right:6px solid #062014;box-shadow:inset -8px 0 18px -12px #0005}
  #brief h2{font-family:"IBM Plex Mono",monospace;font-size:15px;text-transform:uppercase;letter-spacing:.08em;background:#1b1a15;color:#f1ecdc;padding:6px 8px;margin:0 0 8px}
  #brief p{font-size:13px;line-height:1.5}
  #brief b{background:#e4dcc4;padding:0 2px}
  details summary{color:#8a4a1e}
  #palette{gap:12px 8px;padding:6px 2px}
  #palette button{position:relative;background:#17171a;color:#ecebdf;border:0;border-radius:2px;box-shadow:0 3px 0 #000;font-weight:700;padding:7px 10px;margin:5px 0;text-transform:none}
  #palette button::before,#palette button::after{content:"";position:absolute;left:5px;right:5px;height:5px;background:repeating-linear-gradient(90deg,#c9cbc4 0 4px,transparent 4px 9px)}
  #palette button::before{top:-5px} #palette button::after{bottom:-5px}
  #palette button:active{transform:translateY(1px)}
  #levels .act{font-weight:700;color:#1b1a15;border-bottom:2px solid #1b1a15;letter-spacing:.12em;margin:14px 0 2px;padding-bottom:2px}
  #levels .lv{border-radius:0;font-size:13px;padding:3px 4px;background:linear-gradient(90deg,transparent 0 0) ;border-bottom:1px dotted #9d9479}
  #levels .lv:hover{background:#e4dcc4}
  #levels .lv.cur{background:#1b1a15;color:#f1ecdc;outline:0}
  #levels .lv.cur .stars{color:#f0b25a}
  #levels .stars{color:#8a4a1e;letter-spacing:1px}
  table.tt{font-family:"IBM Plex Mono",monospace;border:2px solid #1b1a15}
  table.tt th{background:#1b1a15;color:#f1ecdc;border-color:#1b1a15} table.tt td{border-color:#9d9479}
  #result{font-size:12.5px}
  #result .fail{color:#b3261e;font-weight:600} #result .ok{color:#1d6e35;font-weight:600}
  #scope{display:block;width:100%;height:120px;border:7px solid #2a2a2a;border-radius:10px;box-shadow:inset 0 0 20px #000,0 0 0 1px #000,0 3px 0 #000;margin:4px 0 8px;background:#061109}
  .hud .pill{background:rgba(6,32,20,.75);border:1px solid #ecebdf;border-radius:0;color:#ecebdf;font-size:12px;letter-spacing:.06em}
  @media (max-width:760px), (max-height:520px){ .hud button,#palette button{min-height:36px;min-width:40px} #stage .help{display:none} }
  @media (max-width:760px), (max-height:520px){ #side > :nth-child(2){order:1} #side > :nth-child(3){order:2} #result{order:3} #brief{order:4} #levels{order:5} }
  .help{color:#cfe3cf;font-size:11px;letter-spacing:.02em;background:rgba(6,32,20,.6);padding:3px 6px}
  #delBtn{box-shadow:0 3px 0 #5e5641}
  .modal-bg{background:rgba(3,18,10,.72)}
  .modal{background:#f1ecdc repeating-linear-gradient(0deg,transparent 0 23px,rgba(60,90,60,.07) 23px 24px);color:#1b1a15;border:2px solid #1b1a15;border-radius:2px;box-shadow:10px 10px 0 rgba(0,0,0,.45);font-family:"IBM Plex Mono",monospace;font-size:14px}
  .modal h2{font-size:17px;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid #1b1a15;padding-bottom:6px}
  .modal input{background:#fff;color:#1b1a15;border:2px solid #1b1a15;border-radius:0;font-family:VT323,monospace;font-size:26px}
  .toast{background:#faf6ea;color:#1b1a15;border:1px dashed #5e5641;border-radius:0;font-family:"IBM Plex Mono",monospace;font-size:13px;box-shadow:4px 4px 0 rgba(0,0,0,.35)}
  /* software view: a CRT terminal and a front panel */
  #soft{background:#16130e radial-gradient(ellipse at 50% 0,#2a241a,#0f0d09);color:#e9e2cc}
  #soft .dim{color:#a89f84}
  #code{background:#071008;color:#8dffaa;font-family:VT323,monospace;font-size:20px;line-height:1.15;border:12px solid #2d2a25;border-radius:14px;box-shadow:inset 0 0 30px #000,0 0 0 2px #000;text-shadow:0 0 6px #4dff7a88;caret-color:#8dffaa}
  .regs div{background:#120604;color:#ff4a32;font-family:VT323,monospace;font-size:26px;border-radius:2px;box-shadow:inset 0 0 10px #000;text-shadow:0 0 6px #ff4a32}
  .regs div .dim{font-family:"IBM Plex Mono",monospace;font-size:10px;color:#a89f84;text-shadow:none}
  #mem div{background:#1d1a14;color:#d9cfae;border-radius:0;font-family:VT323,monospace;font-size:15px}
  #disp{background:#111;padding:6px;border:3px solid #333}
  #disp div{background:#3a0d08;border-radius:50%}
  #disp div.on{background:radial-gradient(circle at 40% 35%,#ffd0c4,#ff3b2a 50%,#a5140b);box-shadow:0 0 8px #ff3b2a}
  .tape{font-family:VT323,monospace;font-size:20px;color:#ffd27a}
  #softResult{color:#e9e2cc}
  #isa{font-family:"IBM Plex Mono",monospace}
  #cpuBoard .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  #cpuBoard .chips span{background:#17171a;color:#8c8c86;padding:6px 8px;font-size:12px;border:1px solid #000;box-shadow:inset 0 -3px 0 #000}
  #cpuBoard .chips span.lit{color:#fff1d0;box-shadow:0 0 12px #ffd27a,inset 0 -3px 0 #000;border-color:#ffd27a}
</style>

<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>NAND to Everything</h1><span class="spacer"></span><span class="dim small" id="total"></span><button id="resetBtn">Reset level</button></div>
<main>
  <div id="side">
    <div id="brief"></div>
    <div><div class="dim small" style="margin-bottom:6px">Parts (tap to add)</div><div id="palette"></div></div>
    <div class="row"><button class="primary" id="testBtn">▶ Run tests</button></div>
    <div id="result"></div>
    <div id="levels"></div>
  </div>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud"><span class="pill" id="gatePill">0 NAND</span><span class="pill" id="parPill"></span><button id="fitBtn" title="Fit the whole board on screen">Fit</button><button id="delBtn" title="Delete the selected part or wire">🗑 Delete</button></div>
    <div class="help">Drag from a port to a port to wire · click an input pin to toggle it · drag empty space to pan · scroll to zoom · right-click a part or wire to delete</div>
  </div>

    <div style="flex:1;display:flex;flex-direction:column;gap:12px;min-width:280px">
      <div class="row"><button class="primary" id="runBtn">▶ Run tests</button><button id="stepBtn">Step</button><button id="playBtn">Run once</button><button id="isaBtn">Instruction set</button></div>

      <div class="regs" id="regs"></div>

        <div><div class="dim small">Display (RAM 56–63)</div><div id="disp"></div></div>
        <div style="flex:1"><div class="dim small">RAM</div><div id="mem"></div></div>

      <div id="softResult"></div>
    </div>
  </div>
</main>

<script>
// ======================= Chip behaviours =======================
const M8 = 255;
const bit = (v,i)=> (v>>i)&1;
const B = (x)=> x?1:0;
// Each chip type: ins/outs = [[label,width]], fn(inVals,state)->outVals, gates() NAND cost
const TYPES = {};
function def(name, ins, outs, fn, gates){ TYPES[name] = {name, ins, outs, fn, gates}; }
const best = () => SAVE.best;
def('NAND', [['a',1],['b',1]], [['out',1]], ([a,b])=>[B(!(a&&b))], ()=>1);
// Free helpers (bus utilities)
def('SPLIT', [['in',8]], [0,1,2,3,4,5,6,7].map(i=>['b'+i,1]), ([v])=>[0,1,2,3,4,5,6,7].map(i=>bit(v,i)), ()=>0);
def('JOIN', [0,1,2,3,4,5,6,7].map(i=>['b'+i,1]), [['out',8]], (b)=>[b.reduce((s,x,i)=>s|(x<<i),0)], ()=>0);
def('HIGH', [], [['1',1]], ()=>[1], ()=>0);
def('LOW', [], [['0',1]], ()=>[0], ()=>0);

// ======================= Levels =======================
// Reference behaviours double as the black-box chip once a level is solved.
const L = [];
function lvl(o){ L.push(o); }
const edge = (st, clk)=>{ const e = clk && !st.pc; st.pc = clk; return e; };

lvl({id:'NOT',act:1,ins:[['a',1]],outs:[['out',1]],par:1,fn:([a])=>[B(!a)],
  desc:'Everything you will ever build starts with one gate: <b>NAND</b> (not-and). Its output is 0 only when both inputs are 1.<br><br>Build <b>NOT</b>: output the opposite of the input.'});
lvl({id:'AND',act:1,ins:[['a',1],['b',1]],outs:[['out',1]],par:2,fn:([a,b])=>[a&b],
  desc:'Output 1 only when both inputs are 1. Your NOT chip is in the parts list now.'});
lvl({id:'OR',act:1,ins:[['a',1],['b',1]],outs:[['out',1]],par:3,fn:([a,b])=>[a|b],
  desc:'Output 1 when either input is 1. Hint: De Morgan says a OR b = NOT(NOT a AND NOT b).'});
lvl({id:'NOR',act:1,ins:[['a',1],['b',1]],outs:[['out',1]],par:4,fn:([a,b])=>[B(!(a|b))],
  desc:'NOT OR: 1 only when both inputs are 0.'});
lvl({id:'XOR',act:1,ins:[['a',1],['b',1]],outs:[['out',1]],par:4,fn:([a,b])=>[a^b],
  desc:'Exclusive OR: 1 when the inputs differ. It can be done in 4 NANDs, which is hard to find. Try it.'});
lvl({id:'XNOR',act:1,ins:[['a',1],['b',1]],outs:[['out',1]],par:5,fn:([a,b])=>[B(!(a^b))],
  desc:'1 when the inputs are equal.'});
lvl({id:'MUX',act:1,ins:[['s',1],['a',1],['b',1]],outs:[['out',1]],par:4,fn:([s,a,b])=>[s?b:a],
  desc:'Multiplexer: a switch. If <b>s</b>=0 output <b>a</b>, otherwise output <b>b</b>. This is how a computer chooses.'});
lvl({id:'DEMUX',act:1,ins:[['s',1],['d',1]],outs:[['c0',1],['c1',1]],par:4,fn:([s,d])=>[s?0:d, s?d:0],
  desc:'Send <b>d</b> to <b>c0</b> when s=0, or to <b>c1</b> when s=1. The other output is 0.'});

lvl({id:'HALF ADD',act:2,ins:[['a',1],['b',1]],outs:[['sum',1],['carry',1]],par:5,fn:([a,b])=>[a^b,a&b],
  desc:'Add two bits. 1+1 = 10 in binary, so sum=0 and carry=1.'});
lvl({id:'FULL ADD',act:2,ins:[['a',1],['b',1],['c',1]],outs:[['sum',1],['carry',1]],par:9,fn:([a,b,c])=>{const t=a+b+c;return [t&1,t>>1];},
  desc:'Add three bits (a, b, and a carry coming in from the column to the right).'});
lvl({id:'ADD4',act:2,ins:[['a0',1],['a1',1],['a2',1],['a3',1],['b0',1],['b1',1],['b2',1],['b3',1],['cin',1]],outs:[['s0',1],['s1',1],['s2',1],['s3',1],['cout',1]],par:36,
  fn:(v)=>{const a=v[0]|v[1]<<1|v[2]<<2|v[3]<<3, b=v[4]|v[5]<<1|v[6]<<2|v[7]<<3; const t=a+b+v[8]; return [bit(t,0),bit(t,1),bit(t,2),bit(t,3),bit(t,4)];},
  desc:'A 4-bit adder: chain full adders so each carry ripples into the next column. Bit 0 is the least significant.'});
lvl({id:'ADD8',act:2,ins:[['a',8],['b',8],['cin',1]],outs:[['sum',8],['cout',1]],par:72,bus:true,fn:([a,b,c])=>{const t=a+b+c;return [t&M8,t>>8];},
  desc:'<b>Buses.</b> Grey ribbon cables now carry 8 bits at once. You also get <b>SPLIT</b> and <b>JOIN</b> (free), <b>HIGH</b>/<b>LOW</b> constants, and 8-bit versions of your gates (NOT8, AND8, OR8, XOR8, MUX8). Click a bus input pin to type a number.<br><br>Build an 8-bit adder.'});
lvl({id:'INC8',act:2,ins:[['a',8]],outs:[['out',8]],par:40,bus:true,fn:([a])=>[(a+1)&M8],
  desc:'Add 1, wrapping 255 → 0. You can do it with ADD8 and a constant, but a chain of half adders is much cheaper.'});
lvl({id:'SUB8',act:2,ins:[['a',8],['b',8]],outs:[['out',8]],par:80,bus:true,fn:([a,b])=>[(a-b)&M8],
  desc:'a − b. The trick computers use is two\'s complement: a − b = a + NOT(b) + 1.'});
lvl({id:'ZERO8',act:2,ins:[['a',8]],outs:[['zero',1]],par:22,bus:true,fn:([a])=>[B(a===0)],
  desc:'Output 1 when all 8 bits are 0. The CPU uses this to decide whether to jump.'});
lvl({id:'ALU',act:2,ins:[['op1',1],['op0',1],['a',8],['b',8]],outs:[['out',8],['zero',1]],par:230,bus:true,
  fn:([o1,o0,a,b])=>{const r=[(a+b)&M8,(a-b)&M8,a&b,a|b][o1*2+o0];return [r,B(r===0)];},
  desc:'The Arithmetic Logic Unit is the CPU\'s calculator. op = 00 → a+b, 01 → a−b, 10 → a AND b, 11 → a OR b. Also output <b>zero</b> when the result is 0.'});

lvl({id:'SR LATCH',act:3,ins:[['set',1],['reset',1]],outs:[['q',1],['nq',1]],par:4,seq:'sr',
  fn:([s,r],st)=>{ if(st.q===undefined) st.q=0; if(s) st.q=1; else if(r) st.q=0; return [st.q,B(!st.q)]; },
  desc:'<b>Memory.</b> Wire gates in a loop and they can hold a value. set=1 makes q=1; reset=1 makes q=0; with both at 0, q keeps its value. (Both 1 at once is never tested.) nq is always the opposite of q.'});
lvl({id:'D LATCH',act:3,ins:[['d',1],['en',1]],outs:[['q',1]],par:4,seq:'dl',
  fn:([d,e],st)=>{ if(st.q===undefined) st.q=0; if(e) st.q=d; return [st.q]; },
  desc:'While <b>en</b>=1, q follows d. When en=0, q remembers the last value.'});
lvl({id:'DFF',act:3,ins:[['d',1],['clk',1]],outs:[['q',1]],par:9,gold:6,seq:'clk',
  fn:([d,c],st)=>{ if(st.q===undefined) st.q=0; if(edge(st,c)) st.q=d; return [st.q]; },
  desc:'Data flip-flop: q only changes at the moment <b>clk</b> goes 0 → 1, when it grabs d. Hint: two D latches, one open while the clock is low and one while it is high.'});
lvl({id:'REG',act:3,ins:[['d',1],['load',1],['clk',1]],outs:[['q',1]],par:13,gold:10,seq:'clk',
  fn:([d,l,c],st)=>{ if(st.q===undefined) st.q=0; if(edge(st,c)&&l) st.q=d; return [st.q]; },
  desc:'A 1-bit register: on the clock edge, store d only if <b>load</b>=1. Otherwise keep the old value. Solving this unlocks REG8.'});
lvl({id:'DEC2',act:3,ins:[['s1',1],['s0',1]],outs:[['d0',1],['d1',1],['d2',1],['d3',1]],par:10,
  fn:([a,b])=>{const n=a*2+b;return [0,1,2,3].map(i=>B(i===n));},
  desc:'Decoder: turn a 2-bit number into 4 lines where exactly one is 1. It picks which memory cell to write.'});
lvl({id:'COUNTER',act:3,ins:[['ld',1],['d',8],['clk',1]],outs:[['q',8]],par:144,bus:true,seq:'clk',
  fn:([l,d,c],st)=>{ if(st.q===undefined) st.q=0; if(edge(st,c)) st.q = l? d : (st.q+1)&M8; return [st.q]; },
  desc:'On each clock edge: if <b>ld</b>, q becomes d; otherwise q goes up by 1. This will become the program counter.'});
lvl({id:'RAM4',act:3,ins:[['a1',1],['a0',1],['st',1],['d',8],['clk',1]],outs:[['q',8]],par:530,gold:434,bus:true,seq:'clk',
  fn:([a1,a0,s,d,c],st)=>{ if(!st.m) st.m=[0,0,0,0]; const a=a1*2+a0; if(edge(st,c)&&s) st.m[a]=d; return [st.m[a]]; },
  desc:'Four bytes of RAM. q always shows the byte at the address. On a clock edge with <b>st</b>=1, write d there. This one is big; take your time. Notice the cost: every stored bit needs its own flip-flop, which is why memory was the most expensive part of early computers.'});

// Hints, shown on request (folded away so they never spoil a level by accident)
const HINTS = {
  NOT:'Wire the same input into both legs of one NAND.',
  OR:'NOT each input, then NAND the two results.',
  XOR:'Start with n = NAND(a,b). Then NAND(a,n) and NAND(b,n) each go 1 in different cases. NAND those two together.',
  MUX:'Make "a and not s" and "b and s", then OR them.',
  'FULL ADD':'Two half adders: add a+b, then add c to that sum. Either half adder can produce a carry, so OR the carries.',
  ADD4:'Four full adders in a row. Each carry out goes into the next adder\'s c.',
  ADD8:'SPLIT both buses into bits, run eight full adders (or two ADD4s), JOIN the sums back into a bus.',
  INC8:'A half adder adds 1 to a bit and passes a carry. Start the chain with HIGH as the carry.',
  SUB8:'ADD8 with b through NOT8 and cin tied to HIGH.',
  ZERO8:'OR all eight bits together, then NOT the result.',
  ALU:'Build all four results side by side, then use MUX8s to pick one. op0 chooses within a pair, op1 chooses the pair. Feed the result into ZERO8.',
  'SR LATCH':'Two NANDs, each one\'s output feeding the other\'s input. They want active-low set/reset, so put a NOT on each input.',
  'D LATCH':'Feed d and en into a NAND, then NAND that with en again. Those two signals drive a NAND SR latch.',
  DFF:'Master latch enabled by NOT clk, slave latch enabled by clk. The slave copies the master the moment clk rises, while the master stops listening. (Gold, 6 NANDs, is the classic edge-triggered design: three cross-coupled pairs.)',
  REG:'A MUX in front of a DFF: when load is 0, feed q back into d.',
  DEC2:'Each output is an AND of s1 or NOT s1 with s0 or NOT s0.',
  COUNTER:'REG8 with load tied HIGH. Its d is a MUX8 choosing between INC8(q) and d.',
  RAM4:'Four REG8s. DEC2 picks which one gets load (AND each line with st). Two layers of MUX8 pick which q to show.',
  COND:'Bit 7 of x is "negative". ZERO8 gives "zero". Positive is neither of those.',
  DECODE:'Write each output as a sum of opcode patterns. Note wr is "not (o2 and o1)", and the low ALU bits match o1,o0 except for mov (100), which forces 11.',
  PC:'Like COUNTER, but a MUX8 picks addr when j, and another forces 0 when rst (an unwired MUX8 input reads 0).',
};

const BUS_OF = {NOT:'NOT8',AND:'AND8',OR:'OR8',XOR:'XOR8',MUX:'MUX8',REG:'REG8'};
function registerChips(){ if (typeof board!=='undefined') board=null;
  for (const l of L) if (SAVE.best[l.id]!=null) def(l.id, l.ins, l.outs, l.fn, ()=>SAVE.best[l.id]);
  const busOn = SAVE.best['ADD8']!=null || L[SAVE.cur]?.bus;
  if (SAVE.best.NOT!=null) def('NOT8',[['a',8]],[['out',8]],([a])=>[(~a)&M8],()=>8*SAVE.best.NOT);
  if (SAVE.best.AND!=null) def('AND8',[['a',8],['b',8]],[['out',8]],([a,b])=>[a&b],()=>8*SAVE.best.AND);
  if (SAVE.best.OR!=null)  def('OR8',[['a',8],['b',8]],[['out',8]],([a,b])=>[a|b],()=>8*SAVE.best.OR);
  if (SAVE.best.XOR!=null) def('XOR8',[['a',8],['b',8]],[['out',8]],([a,b])=>[a^b],()=>8*SAVE.best.XOR);
  if (SAVE.best.MUX!=null) def('MUX8',[['s',1],['a',8],['b',8]],[['out',8]],([s,a,b])=>[s?b:a],()=>8*SAVE.best.MUX);
  if (SAVE.best.REG!=null) def('REG8',[['d',8],['load',1],['clk',1]],[['q',8]],([d,l,c],st)=>{ if(st.q===undefined) st.q=0; if(edge(st,c)&&l) st.q=d; return [st.q]; },()=>8*SAVE.best.REG);
  return busOn;
}
function paletteFor(i){

function compSize(c){ const t=TYPES[c.type]||{ins:[],outs:[]}; const n=Math.max(t.ins.length,t.outs.length,1); return {w: c.type.length>5?96:78, h: n*18+14}; }
function portPos(ref, dir){ // ref: [id, idx]

  return {x: c.x + (dir==='out'? s.w : 0), y: c.y + 16 + idx*18};
}
function pinY(i,n){ const span = Math.max(n*46, 200); return 40 + (span/(n))*(i+0.5); }

  if (id==='out') return lv().outs[idx][1];

}

// ======================= Simulation =======================
let unstable=false;
function settle(){
  vals ||= {}; unstable=false;
  lv().ins.forEach((p,i)=> vals['in:'+i] = inVals[i]);
  const src = {}; for (const w of circ.wires) src[w.to[0]+':'+w.to[1]] = w.from[0]+':'+w.from[1];
  for (let iter=0; iter<400; iter++){
    let changed=false;
    for (const c of circ.comps){
      const t = TYPES[c.type]; if(!t) continue;
      const ins = t.ins.map((p,i)=> vals[src[c.id+':'+i]] ?? 0);
      const st = simState[c.id] ||= {};
      const out = t.fn(ins, st);
      out.forEach((v,i)=>{ const k=c.id+':'+i; if (vals[k]!==v){ vals[k]=v; changed=true; } });
    }
    if(!changed) return src;
    if (iter===399) unstable=true;
  }
  return src;
}
function outputs(){
  const src = {}; for (const w of circ.wires) src[w.to[0]+':'+w.to[1]] = w.from[0]+':'+w.from[1];
  return lv().outs.map((p,i)=> vals[src['out:'+i]] ?? 0);
}
function gateCount(){ return circ.comps.reduce((s,c)=> s + (TYPES[c.type]? TYPES[c.type].gates() : 0), 0); }

// ======================= Tests =======================
function genTests(l){
  const r = RH.rng(l.id.length*7919+13);
  const steps = [];
  const totalBits = l.ins.reduce((s,p)=>s+p[1],0);
  if (!l.seq){
    if (totalBits<=10){
      for (let m=0;m<(1<<totalBits);m++){ let k=0; steps.push(l.ins.map(p=>{const v=(m>>k)&((1<<p[1])-1);k+=p[1];return v;})); }
    } else {
      const edges=[0,1,127,128,254,255];
      for (let i=0;i<70;i++) steps.push(l.ins.map(p=> p[1]===1? r.int(2) : (i<12? r.pick(edges) : r.int(256))));
    }
    return steps.map(s=>({inp:s,check:true}));
  }
  const out=[];
  if (l.seq==='sr'){
    out.push({inp:[0,1],check:false},{inp:[0,0],check:true});
    for (let i=0;i<30;i++){ const m=r.int(3); out.push({inp: m===0?[1,0]:m===1?[0,1]:[0,0], check:true}); }
    return out;
  }
  if (l.seq==='dl'){
    out.push({inp:[0,1],check:false},{inp:[0,0],check:true});
    for (let i=0;i<30;i++){ out.push({inp:[r.int(2), r.int(2)], check:true}); }
    return out;
  }
  // clocked: each cycle = set inputs with clk=0, then raise clk only
  const ci = l.ins.findIndex(p=>p[0]==='clk');
  const rand = ()=> l.ins.map((p,i)=> i===ci?0 : p[1]===1? r.int(2) : r.int(256));
  // warm-up: first cycle force deterministic load/reset so unknown power-on state does not matter
  let first = rand();
  if (l.id==='REG'||l.id==='RAM4') { first = rand(); }
  const loadIdx = l.ins.findIndex(p=>['load','ld','rst','st'].includes(p[0]));
  const cycles=[];
  const nCycles = l.id==='RAM4'? 50 : 36;
  if (l.id==='RAM4'){ for (let a=0;a<4;a++){ cycles.push([a>>1,a&1,1,r.int(256),0]); } }
  else if (loadIdx>=0){ const f=rand(); f[loadIdx]=1; cycles.push(f); }
  else cycles.push(rand());
  for (let i=0;i<nCycles;i++){
    const v = rand();
    if (l.id==='COUNTER' && r()<0.7) v[0]=0;
    if (l.id==='PC'){ if (r()<0.85) v[0]=0; }
    cycles.push(v);
  }
  const warm = l.id==='RAM4'? 4 : 1;
  // Each cycle: inputs settle with clk low, clk rises, then the other inputs change while clk is still high
  // (an edge-triggered part must ignore that), then clk falls. Only one thing changes per step.
  cycles.forEach((v,k)=>{ out.push({inp:v, check:k>=warm}); const hi=[...v]; hi[ci]=1; out.push({inp:hi, check:k>=warm});
    const g=rand(); g[ci]=1; out.push({inp:g, check:k>=warm}); const lo=[...g]; lo[ci]=0; out.push({inp:lo, check:k>=warm}); });
  return out;
}
function runTests(){
  const l = lv(); const tests = genTests(l);
  simState = {}; vals = {}; const refSt = {};
  const rows=[]; let fail=null; const trace=[];
  for (const t of tests){
    inVals = t.inp.slice(); settle();
    if (unstable){ fail = {t, msg:'Your circuit never settles: it is oscillating. A loop of gates is fighting itself.'}; break; }
    const got = outputs(); const exp = l.fn(t.inp, refSt); trace.push({inp:t.inp, got, exp, check:t.check});
    if (t.check && got.some((g,i)=>g!==exp[i])){ fail = {t, got, exp}; break; }
    if (rows.length<8) rows.push({t,got,exp});
  }
  inVals = l.ins.map(()=>0); simState={}; vals={}; settle(); draw();
  const res = document.getElementById('result');
  if (fail){
    if (fail.msg){ res.innerHTML = `<div class="fail">✗ ${fail.msg}</div>`; SND.fail(); FX.shake(.3); return; }
    res.innerHTML = `<canvas id="scope"></canvas><div class="fail">✗ Failed on test ${tests.indexOf(fail.t)+1} of ${tests.length}</div>`+ttTable(l,[{t:fail.t,got:fail.got,exp:fail.exp}],true);
    drawScope(l, trace, trace.length-1);
    // replay to failing state so the player can see it
    simState = {}; vals = {}; const idx = tests.indexOf(fail.t); for (let k=0;k<=idx;k++){ inVals = tests[k].inp.slice(); settle(); } draw();
    return;
  }
  if (l.lab){ drawScope(l, trace, -1); return labResult(l); }
  const g = gateCount(); const prev = SAVE.best[l.id];
  if (prev==null || g < prev) SAVE.best[l.id] = g;
  saveCircuit(); registerChips();
  const st = stars(l.id);
  res.innerHTML = `<canvas id="scope"></canvas><div class="ok">✓ All ${tests.length} tests passed with ${g} NAND${g===1?'':'s'}. ${'★'.repeat(st)}${'☆'.repeat(3-st)}</div>`+
    (g<goldOf(l)? `<div class="ok">You beat the gold count of ${goldOf(l)}.</div>` : g>goldOf(l)? `<div class="dim">${g<=l.par? `Par met. Gold is ${goldOf(l)} NAND: open up your chips and share gates between them.` : `Par is ${l.par}, gold ${goldOf(l)}. Can you get it lower?`}</div>`:'')+
    (SAVE.cur+1<L.length? `<button class="primary next" id="nextBtn">Next: ${L[SAVE.cur+1].id} →</button>` : '');
  const nb=document.getElementById('nextBtn'); if (nb) nb.onclick=()=>{ showCircuit(SAVE.cur+1); toStage(); };
  drawScope(l, trace, -1); startPackaging(l.id, g);
  if (prev==null){
    RH.toast(`<b>${l.id}</b> added to your parts.`);
    if (l.id==='PC') setTimeout(cpuCutscene, 600);
  }
  renderLevels(); renderPalette(); updateHud();
}
// ★★★ needs the gold count (a hand-optimised design, below what plugging earlier chips together gives), ★★ par, ★ any working circuit
const goldOf=(l)=> l.gold ?? l.par;
function stars(id){ const l=L.find(x=>x.id===id); const g=SAVE.best[id]; if(g==null) return 0; return g<=goldOf(l)?3 : g<=l.par?2 : 1; }
function ttTable(l, rows, showExp){
  const fmtv=(v,w)=> w===1? v : v;
  let h='<table class="tt"><tr>'+l.ins.map(p=>`<th>${p[0]}</th>`).join('')+l.outs.map(p=>`<th>${p[0]}${showExp?' exp/got':''}</th>`).join('')+'</tr>';
  for (const r of rows) h += '<tr>'+r.t.inp.map((v,i)=>`<td>${fmtv(v,l.ins[i][1])}</td>`).join('')+r.exp.map((v,i)=>`<td style="${showExp&&r.got[i]!==v?'color:var(--bad)':''}">${v}${showExp?' / '+r.got[i]:''}</td>`).join('')+'</tr>';
  return h+'</table>';
}

// ======================= Oscilloscope: the test run as a phosphor trace =======================
let scopeAnim=0;
function drawScope(l, trace, failIdx){
  const cvs=document.getElementById('scope'); if (!cvs) return;
  const chans=[...l.ins.map((p,i)=>({n:p[0],w:p[1],get:(s)=>s.inp[i]})), ...l.outs.map((p,i)=>({n:p[0],w:p[1],out:true,get:(s)=>s.got[i],exp:(s)=>s.exp[i]}))];
  const N=Math.min(48, trace.length); const start = failIdx>=0? Math.max(0, failIdx-N+1) : 0; const win=trace.slice(start, start+N);

  for (let i=0;i<l.ins.length;i++) consider(W_IN, pinY(i,l.ins.length), {ref:['in',i],dir:'out'});
  for (let i=0;i<l.outs.length;i++) consider(W_OUT, pinY(i,l.outs.length), {ref:['out',i],dir:'in'});

sub r, x       r = r - x      ALU op 01

    else if (f1===((~f0)&full)) { const F=build(f0); const a=nand(X,F,(~(varTT(v,n)&f0))&full); const p=nand(X,a,0), q=nand(F,a,0); o=nand(p,q,t); }
    else { const a=nand(X, build(f1), 0), b=nand(NOT(X), build(f0), 0); o=nand(a,b,t); }
    memo.set(t,o); return o; };
  const out=build(tt); wires.push({from:out.ref, to:['out',0]});
  return {comps, wires, gates:comps.filter(c=>c.type==='NAND').length, delay:out.d}; }
// The population a design is ranked against: every variable order plus randomised splits
function population(chip){ const pop=[]; const perms=(a)=> a.length<=1? [a] : a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));
  for (const p of perms([...Array(chip.n).keys()])) { const s=synth(chip.n, chip.tt, p); pop.push({g:s.gates, d:s.delay}); }
  const r=RH.rng('pop:'+chip.tt); for (let k=0;k<30;k++){ const s=synth(chip.n, chip.tt, (m)=>r.int(m)); pop.push({g:s.gates, d:s.delay}); }
  return pop; }
function circuitDelay(){ // longest NAND path from any input to the output
  const src={}; for (const w of circ.wires) src[w.to[0]+':'+w.to[1]]=w.from; const memo={}; const depth=(ref,seen=new Set())=>{ if (!ref || ref[0]==='in') return 0; const k=ref.join(':'); if (k in memo) return memo[k]; if (seen.has(k)) return 99; seen.add(k);
    const c=circ.comps.find(x=>x.id===ref[0]); if (!c) return 0; const t=TYPES[c.type]; let d=0; t.ins.forEach((p,i)=>{ d=Math.max(d, depth(src[c.id+':'+i], seen)); }); return memo[k]= d + (c.type==='NAND'? 1 : c.type==='HIGH'||c.type==='LOW'? 0 : (t.gates? t.gates() : 1)); };
  return depth(src['out:0']); }
function makeLabLevel(seed){ const ch=genChip(seed); const names='abcd';
  return {id:'LAB:'+seed, lab:true, seed:String(seed), chip:ch, act:6, ins:[...Array(ch.n)].map((_,i)=>[names[i],1]), outs:[['out',1]], par:Infinity,
    fn:(v)=>{ let m=0; v.forEach((x,i)=>m|=x<<i); return [(ch.tt>>m)&1]; },
    desc:`Mystery chip <b>${seed}</b>. Build anything that matches the truth table, using NAND gates (and HIGH/LOW). Every working design passes; then you see how it ranks on <b>gates</b> and on <b>delay</b> (the longest chain of NANDs a signal passes through). Fewer gates usually means more delay: choose which to chase.`}; }
function labUnlocked(){ return SAVE.best.DEMUX!=null; }
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function showLab(seed){ seed=String(seed); labOn=true; labLevel=makeLabLevel(seed); softOn=false; document.getElementById('soft').classList.remove('on'); document.getElementById('stage').style.display='';
  document.getElementById('testBtn').style.display=''; document.getElementById('resetBtn').style.display='';
  try { history.replaceState(null,'','#chip='+encodeURIComponent(seed)); } catch(e){}
  loadCircuit(); updDel(); renderBrief(); renderPalette(); renderLevels(); updateHud(); document.getElementById('result').innerHTML=''; resize(); }
function labResult(l){ const g=gateCount(), d=circuitDelay(); const pop=population(l.chip); const rec=SAVE.lab[l.seed]||{};
  rec.g=Math.min(rec.g??1e9,g); rec.d=Math.min(rec.d??1e9,d); SAVE.lab[l.seed]=rec;
  const ks=Object.keys(SAVE.lab); if (ks.length>60) for (const k of ks.slice(0,ks.length-60)) delete SAVE.lab[k];
  for (const k of Object.keys(SAVE.circuits)) if (k.startsWith('LAB:') && !SAVE.lab[k.slice(4)] && k!==l.id) delete SAVE.circuits[k];
  const minG=Math.min(...pop.map(p=>p.g)), minD=Math.min(...pop.map(p=>p.d));
  const medal=(x,best)=> x<best? 'beats every synthesised design' : x===best? 'matches the best synthesised design' : `${Math.round(pop.filter(p=>p.g>x||p.d>x).length/pop.length*100)}%`;
  const res=document.getElementById('result');
  res.innerHTML=`<div class="ok">✓ Works. ${g} NAND gates, delay ${d}.</div><canvas id="histG" class="hist"></canvas><canvas id="histD" class="hist"></canvas>
    <div class="small">${g<minG? '🥇 Fewer gates than any synthesised design.' : g===minG? 'Gates: level with the best synthesised design.' : `Gates: the best synthesised design uses ${minG}.`}<br>${d<minD? '🥇 Faster than any synthesised design.' : d===minD? 'Delay: level with the fastest synthesised design.' : `Delay: the fastest synthesised design has ${minD}.`}<br>Your best on this chip: ${rec.g} gates, delay ${rec.d}.</div>
    <div class="row" style="margin-top:6px"><button id="labNew">Another chip →</button><button id="labShare">Copy link</button></div>`;
  drawHist('histG', pop.map(p=>p.g), g, 'gates'); drawHist('histD', pop.map(p=>p.d), d, 'delay');
  document.getElementById('labNew').onclick=()=>showLab(Math.floor(Math.random()*1e6));
  document.getElementById('labShare').onclick=()=>{ try{ navigator.clipboard.writeText(location.href.split('#')[0]+'#chip='+l.seed); RH.toast('Link copied'); }catch(e){} };
  saveCircuit(); persist(); renderLevels(); SND.pass(); startPackaging('CHIP '+l.seed, g);
  return {g, d, pop}; }
function drawHist(id, xs, you, label){ const c=document.getElementById(id); if (!c) return; const W=c.clientWidth||260, H=70, d=Math.min(2,devicePixelRatio||1); c.width=W*d; c.height=H*d; const g=c.getContext('2d'); g.setTransform(d,0,0,d,0,0);
  const lo=Math.min(...xs, you), hi=Math.max(...xs, you); const bins=hi-lo+1; const counts=new Array(bins).fill(0); xs.forEach(x=>counts[x-lo]++); const mx=Math.max(...counts);
  g.fillStyle='#1b1a15'; g.font='11px "IBM Plex Mono", monospace'; g.fillText(label+': synthesised designs', 2, 11);
  const bw=(W-8)/bins; counts.forEach((n,i)=>{ const h=n/mx*(H-28); g.fillStyle='#8a8578'; g.fillRect(4+i*bw, H-14-h, Math.max(1,bw-2), h); });
  const x=4+(you-lo)*bw+bw/2; g.fillStyle='#b3261e'; g.fillRect(x-1.5, 14, 3, H-28); g.fillText('you '+you, Math.min(W-50, x+4), 24); g.fillStyle='#1b1a15'; g.fillText(lo, 4, H-2); g.textAlign='right'; g.fillText(hi, W-4, H-2); }

// ======================= Boot =======================
registerChips();
if (!unlocked(SAVE.cur)) SAVE.cur=0;
requestAnimationFrame(animLoop);
{ const mh=location.hash.match(/chip=([\w-]{1,24})/); if (mh && labUnlocked()) showLab(decodeURIComponent(mh[1])); else showCircuit(SAVE.cur); }
if (!SAVE.seenIntro){ SAVE.seenIntro=1; persist(); RH.modal(`<h2>🔌 NAND to Everything</h2><p>You have one gate. Over 35 levels you'll build logic, arithmetic, memory and a processor out of it, then write programs that run on the CPU you built.</p><p>Each solved chip goes into your parts list for later levels. Fewer NAND gates means more stars.</p><p class="dim">Progress saves automatically.</p>`,[{label:'Start building'}]); }
