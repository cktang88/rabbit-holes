<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruin</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;overflow:hidden;background:#07080d;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;color:#eee8dc}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block}
  .chip{position:fixed;background:rgba(20,22,32,.62);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 14px 40px -16px rgba(0,0,0,.7)}
  #hud{top:16px;left:16px;padding:14px 18px;width:360px}
  #hud .home{color:#8f8a80;font-size:12px;text-decoration:none}
  #hud h1{margin:4px 0;font-size:22px;letter-spacing:-.02em}
  #story{font-size:14px;line-height:1.5;color:#c8c2b6}
  #story b{color:#ffd27a}
  #ctrl{margin-top:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
  #ctrl label{display:flex;justify-content:space-between;color:#aaa396}
  #ctrl input[type=range]{width:100%;accent-color:#ffd27a}
  .btn{border:0;background:#ffd27a;color:#1a1205;font:inherit;font-weight:700;border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .08s,filter .15s}
  .btn:active{transform:scale(.95)} .btn.ghost{background:rgba(255,255,255,.08);color:#eee8dc;font-weight:500}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  #stats{top:16px;right:16px;padding:14px 18px;width:250px;font-family:"JetBrains Mono",monospace}
  .stat{display:flex;justify-content:space-between;align-items:baseline;margin:4px 0}
  .stat b{font-size:26px}
  .mean{color:#ffd27a} .median{color:#6fe3ff} .broke{color:#ff7a7a}
  .stat span{font-size:12px;color:#8f8a80;font-family:"Space Grotesk",sans-serif}
  #chapters{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px}
  .ch{border:0;background:rgba(255,255,255,.06);color:#eee8dc;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .ch.cur{background:#ffd27a;color:#1a1205;font-weight:700}
  .ch.lock{opacity:.3;pointer-events:none}
  .ch.done::after{content:' ✓'}
  #goal{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,210,122,.08);border:1px solid rgba(255,210,122,.25);font-size:13px;line-height:1.45}
  #goal.ok{background:rgba(95,211,141,.1);border-color:rgba(95,211,141,.5)}
  #toast{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;font-size:46px;font-weight:700;letter-spacing:-.03em;pointer-events:none;transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1);text-align:center;text-shadow:0 6px 40px rgba(0,0,0,.6)}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast small{display:block;font-size:16px;font-weight:400;color:#c8c2b6;margin-top:8px}
  @media (max-width:860px){#hud{width:calc(100vw - 32px);max-height:46vh;overflow:auto}#stats{top:auto;bottom:76px;right:8px;width:200px;padding:8px 12px}.stat b{font-size:18px}#chapters{max-width:calc(100vw - 16px);overflow-x:auto}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip"><a class="home" href="../index.html">← Rabbit Holes</a><h1 id="title"></h1><div id="story"></div><div id="ctrl"></div><div id="goal"></div></div>
<div id="stats" class="chip"></div>
<div id="chapters" class="chip"></div>
<div id="toast"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
// ================= the games =================
// Each round every player's wealth is multiplied by a random factor. log-wealth is stored so a huge range fits on screen.
const CH = [
  { n: 'The Coin', players: 1, rounds: 60, f: 1, manual: 1,
    story: 'A generous casino: each flip, heads grows your wealth by <b>50%</b> and tails shrinks it by <b>40%</b>. On average you gain 5% per flip. That\'s a great bet. Isn\'t it?',
    goal: 'Flip the coin 40 times.', test: S => S.t >= 40 },
  { n: 'A Thousand Players', players: 1000, rounds: 100, f: 1, guess: 1,
    story: 'Now a thousand people play the same game for 100 flips. The <b class="mean">gold</b> line is the <b>average</b> wealth. The <b class="median">blue</b> line is the <b>typical</b> person (the median).',
    goal: 'Before you run it, guess what share of the players will end up <b>poorer</b> than they started. You need to be within 10 points.', test: S => S.t >= 100 && S.guessed && Math.abs(S.guess - S.belowPct) <= 10 },
  { n: 'Bet Less', players: 1000, rounds: 200, f: 1, slider: 'f',
    story: 'The average is carried by a few astronomically lucky people. Almost everyone else goes broke, because a 50% gain doesn\'t undo a 40% loss: 1.5 × 0.6 = 0.9. What if you only bet <b>part</b> of your wealth each flip?',
    goal: 'Choose a bet size that makes the <b>typical</b> player grow fastest. Reach a growth rate of at least 0.55% per flip.', test: S => S.g >= .0055 && S.t >= 200 },
  { n: 'Pool Together', players: 1200, rounds: 200, f: 1, slider: 'pool',
    story: 'Back to betting everything, but now players form groups and <b>share</b> their winnings equally after each flip. Cooperation smooths out the losses.',
    goal: 'Find the <b>smallest</b> group in which the typical member grows richer, then run 200 flips.', test: S => S.t >= 200 && S.g > 0 && S.pool <= 3 },
  { n: 'Shannon\'s Demon', players: 1000, rounds: 120, mode: 'rebal', slider: 'q',
    story: 'A wild stock <b>doubles or halves</b> each round. On its own it goes nowhere: the typical holder stays flat. Claude Shannon noticed that if you keep part of your money in cash and <b>rebalance</b> every round, you profit from the volatility itself.',
    goal: 'Choose how much to hold in the stock to make the typical portfolio grow fastest: at least 5.5% per round.', test: S => S.g >= .055 && S.t >= 120 },
  { n: 'The Martingale', players: 1000, rounds: 300, mode: 'marti', slider: 'limit',
    story: 'The oldest "sure thing": bet $1 on a fair coin, and <b>double your bet</b> after every loss. Each win recovers all your losses plus $1. The catch is the table limit.',
    goal: 'Try at least <b>two</b> table limits and run 300 rounds. Watch the average stay at $100 while the shape of the crowd changes.', test: S => S.t >= 300 && S.martiChecked >= 2 },
];

// ================= state =================
const SAVE = RH.load('ruin', { done: {}, cur: 0 });
const persist = () => { RH.save('ruin', SAVE); RH.progress('ruin', Object.keys(SAVE.done).length / CH.length); };
let C, P, W, logs, t, running = false, params = {}, S = {}, coin = { phase: 0, face: 1, flipping: false }, guess = 50, guessed = false;
const $ = id => document.getElementById(id);

function setup(i) {
  SAVE.cur = i; persist(); C = CH[i]; t = 0; running = false; guessed = false;
  params = { f: C.f ?? 1, pool: 1, q: 1, limit: 64, ...(params._keep && params._ch === i ? params : {}) };
  reset(); renderUI(); clearTrails();
}
function reset() {
  P = C.players; W = new Float64Array(P).fill(C.mode === 'marti' ? 100 : 1); logs = Array.from({ length: P }, () => [Math.log10(W[0])]);
  t = 0; martiBet = new Float64Array(P).fill(1); S = stats(); clearTrails();
}
let martiBet;
function roundOnce(forceHeads) {
  const N = P, g = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const h = forceHeads ?? Math.random() < .5;
    if (C.mode === 'rebal') g[i] = W[i] * ((1 - params.q) + params.q * (h ? 2 : .5));
    else if (C.mode === 'marti') {
      if (W[i] <= 0) { g[i] = 0; continue; }
      const bet = Math.min(martiBet[i], W[i]);
      g[i] = W[i] + (h ? bet : -bet);
      martiBet[i] = h ? 1 : Math.min(params.limit, martiBet[i] * 2);
    } else g[i] = W[i] * (1 + params.f * (h ? .5 : -.4));
  }
  if (params.pool > 1 && !C.mode) for (let i = 0; i + params.pool <= N; i += params.pool) { let m = 0; for (let j = 0; j < params.pool; j++) m += g[i + j]; m /= params.pool; for (let j = 0; j < params.pool; j++) g[i + j] = m; }
  W = g; t++;
  for (let i = 0; i < N; i++) logs[i].push(Math.log10(Math.max(1e-12, W[i])));
  S = stats(); drawRound();
}
function stats() {
  const a = [...W].sort((x, y) => x - y), n = a.length, start = C.mode === 'marti' ? 100 : 1;
  const mean = a.reduce((x, y) => x + y, 0) / n, median = n % 2 ? a[n >> 1] : (a[n / 2 - 1] + a[n / 2]) / 2;
  const below = a.filter(x => x < start).length / n, broke = a.filter(x => x < start * .01).length / n;
  // the typical growth rate per round, computed exactly from the rule (not from noisy samples)
  let g = 0;
  if (C.mode === 'rebal') g = .5 * Math.log(1 + params.q) + .5 * Math.log(1 - params.q / 2);
  else if (!C.mode && params.pool > 1) { // exact: average of n independent outcomes, binomial over the number of heads
    const n = params.pool; let c = 1; for (let k = 0; k <= n; k++) { if (k) c = c * (n - k + 1) / k; g += c / 2 ** n * Math.log((k * 1.5 + (n - k) * .6) / n); } }
  else if (!C.mode) g = .5 * Math.log(1 + .5 * params.f) + .5 * Math.log(1 - .4 * params.f);
  return { t, mean, median, below, belowPct: below * 100, broke, g, guess, guessed, pool: params.pool, martiChecked: params.martiChecked };
}

// ================= drawing =================
const cv = $('cv'), g = cv.getContext('2d'), trail = document.createElement('canvas'), tg = trail.getContext('2d');
let Wd = 1, Hd = 1, dpr = 1, yLo = -4, yHi = 4, area = { x: 0, y: 0, w: 1, h: 1 };
function resize() { dpr = FX.fit(cv); Wd = cv.width; Hd = cv.height; trail.width = Wd; trail.height = Hd; const wide = innerWidth > 860; area = { x: (wide ? 450 : 60) * dpr, y: 40 * dpr, w: Wd - (wide ? 450 + 300 : 90) * dpr, h: Hd - (wide ? 130 : 330) * dpr }; redrawTrails(); }
addEventListener('resize', resize);
function yRange() { if (C.manual) return [-3, 2]; if (C.mode === 'marti') return [0, 3.3]; if (C.mode === 'rebal') return [-3, 6]; return C.slider === 'pool' ? [-6, 6] : [-6, 4]; }
const X = r => area.x + area.w * r / Math.max(1, C.rounds), Y = l => { const [lo, hi] = yRange(); return area.y + area.h * (1 - (Math.max(lo, Math.min(hi, l)) - lo) / (hi - lo)); };
function clearTrails() { tg.clearRect(0, 0, Wd, Hd); }
function hueFor(l) { const [lo, hi] = yRange(), x = (l - lo) / (hi - lo); return `hsla(${200 + x * 160},90%,${50 + x * 15}%,`; }
function drawRound() { // add this round's segments to the persistent trail layer
  if (C.manual) return;
  tg.globalCompositeOperation = 'lighter';
  const a = Math.min(.35, 12 / P), r = t;
  tg.lineWidth = 1.2 * dpr;
  for (let i = 0; i < P; i++) { const L = logs[i], l0 = L[r - 1], l1 = L[r]; tg.strokeStyle = hueFor(l1) + a + ')'; tg.beginPath(); tg.moveTo(X(r - 1), Y(l0)); tg.lineTo(X(r), Y(l1)); tg.stroke(); }
  tg.globalCompositeOperation = 'source-over';
}
function redrawTrails() { clearTrails(); if (!logs || C.manual) return; const keep = t; for (let r = 1; r <= keep; r++) { const save = t; t = r; drawRound(); t = save; } }
let meanHist = [], medHist = [];
function frame(now) {
  requestAnimationFrame(frame);
  g.setTransform(1, 0, 0, 1, 0, 0);
  const bg = g.createRadialGradient(Wd * .55, Hd * .45, 0, Wd * .55, Hd * .45, Math.max(Wd, Hd) * .75); bg.addColorStop(0, '#12131d'); bg.addColorStop(1, '#05060a'); g.fillStyle = bg; g.fillRect(0, 0, Wd, Hd);
  const [sx, sy] = FX.shakeOffset(10 * dpr); g.translate(sx, sy);
  // axes: powers of ten
  const [lo, hi] = yRange(); g.font = `${12 * dpr}px JetBrains Mono`; g.textAlign = 'right'; g.textBaseline = 'middle';
  for (let p = Math.ceil(lo); p <= hi; p++) {
    const y = Y(p), base = C.mode === 'marti' ? 1 : 1; g.strokeStyle = p === (C.mode === 'marti' ? 2 : 0) ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.06)'; g.lineWidth = dpr; g.beginPath(); g.moveTo(area.x, y); g.lineTo(area.x + area.w, y); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.4)'; g.fillText(fmtW(Math.pow(10, p)), area.x - 8 * dpr, y);
  }
  g.textAlign = 'left'; g.fillStyle = 'rgba(255,255,255,.3)'; g.fillText(`round ${t} / ${C.rounds}`, area.x, area.y + area.h + 18 * dpr);
  if (C.manual) drawCoin(now);
  else {
    g.drawImage(trail, 0, 0);
    // mean and median lines (stored history)
    const line = (hist, col, w) => { if (hist.length < 2) return; g.strokeStyle = col; g.lineWidth = w * dpr; g.shadowColor = col; g.shadowBlur = 14 * dpr; g.beginPath(); hist.forEach((l, r) => r ? g.lineTo(X(r), Y(l)) : g.moveTo(X(r), Y(l))); g.stroke(); g.shadowBlur = 0; };
    line(meanHist, '#ffd27a', 3); line(medHist, '#6fe3ff', 3);
    // final-wealth histogram on the right edge
    if (t > 0) {
      const bins = new Array(48).fill(0); for (let i = 0; i < P; i++) { const l = logs[i][t], b = Math.floor((Math.max(lo, Math.min(hi - 1e-6, l)) - lo) / (hi - lo) * 48); bins[b]++; }
      const mx = Math.max(...bins); for (let b = 0; b < 48; b++) { const y1 = area.y + area.h * (1 - (b + 1) / 48), h = area.h / 48 - 1; const w = bins[b] / mx * 70 * dpr; g.fillStyle = hueFor(lo + (b + .5) / 48 * (hi - lo)) + '.8)'; g.fillRect(area.x + area.w + 12 * dpr, y1, w, h); }
    }
  }
  if (running && !C.manual) { stepAcc += 1; if (stepAcc >= (P > 500 ? 2 : 1)) { stepAcc = 0; advance(); } }
  particles.update(1 / 60); particles.draw(g);
  updateStats();
}
let stepAcc = 0;
const particles = FX.particles();
function advance() {
  if (t >= C.rounds) { running = false; renderUI(); check(); return; }
  roundOnce(); meanHist.push(Math.log10(Math.max(1e-12, S.mean))); medHist.push(Math.log10(Math.max(1e-12, S.median)));
  if (t % 10 === 0) FX.sfx('tick');
  if (t >= C.rounds) { running = false; FX.sfx('chime', 4); renderUI(); check(); }
}
const fmtW = v => { if (C?.mode === 'marti') return '$' + (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : v.toFixed(0)); if (v >= 1e6) return v.toExponential(0).replace('e+', 'e') + '×'; if (v >= 1) return (+v.toPrecision(3)) + '×'; if (v >= .001) return (+v.toPrecision(2)) + '×'; return v.toExponential(0).replace('e-', 'e-') + '×'; };

// ================= the coin (chapter 1) =================
let manualHist = [0];
function drawCoin(now) {
  const cx = area.x + area.w * .8, cy = area.y + area.h * .25, R = Math.min(area.w, area.h) * .11;
  // wealth path for the single player
  g.strokeStyle = '#6fe3ff'; g.lineWidth = 3 * dpr; g.shadowColor = '#6fe3ff'; g.shadowBlur = 16 * dpr; g.beginPath();
  manualHist.forEach((l, r) => { const x = X(r), y = Y(l); r ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke(); g.shadowBlur = 0;
  // coin
  if (coin.flipping) { coin.phase += .35; if (coin.phase > Math.PI * 6) { coin.flipping = false; coin.phase = 0; landCoin(); } }
  const sy = Math.cos(coin.phase), face = coin.flipping ? (sy > 0 ? coin.face : 1 - coin.face) : coin.face;
  const lift = coin.flipping ? Math.sin(coin.phase / 6) * 60 * dpr : 0;
  g.save(); g.translate(cx, cy - lift); g.scale(1, Math.max(.06, Math.abs(sy)));
  const grd = g.createLinearGradient(-R, -R, R, R); grd.addColorStop(0, face ? '#ffe6a3' : '#d9d9e8'); grd.addColorStop(1, face ? '#c8901f' : '#7b7f99');
  g.fillStyle = grd; g.beginPath(); g.arc(0, 0, R, 0, 7); g.fill(); g.strokeStyle = 'rgba(0,0,0,.3)'; g.lineWidth = 4 * dpr; g.beginPath(); g.arc(0, 0, R * .82, 0, 7); g.stroke();
  g.fillStyle = 'rgba(40,24,0,.75)'; g.font = `700 ${R * .5}px Space Grotesk`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(face ? '+50%' : '−40%', 0, 0);
  g.restore();
  g.fillStyle = 'rgba(255,255,255,.55)'; g.font = `${14 * dpr}px Space Grotesk`; g.textAlign = 'center'; g.fillText(coin.flipping ? '' : 'click the coin, or press space', cx, cy + R + 30 * dpr);
}
function flip() { if (coin.flipping || !C.manual || t >= C.rounds) return; coin.flipping = true; coin.face = Math.random() < .5 ? 1 : 0; FX.sfx('whoosh'); }
function landCoin() {
  roundOnce(coin.face === 1); manualHist.push(Math.log10(W[0]));
  const cx = area.x + area.w * .8, cy = area.y + area.h * .25;
  if (coin.face) { FX.sfx('coin'); particles.burst(cx, cy, { n: 40, color: ['#ffd27a', '#fff3c4'], speed: 380 * dpr, life: .8 }); }
  else { FX.sfx('fail'); FX.shake(.25); particles.burst(cx, cy, { n: 20, color: ['#ff7a7a', '#a04545'], speed: 240 * dpr, life: .6, gravity: 500 * dpr }); }
  check();
}
cv.addEventListener('pointerdown', () => flip());
addEventListener('keydown', e => { if (e.code === 'Space' && C.manual) { e.preventDefault(); flip(); } });

// ================= UI =================
function updateStats() {
  if (!S) return;
  let h = `<div class="stat"><span>round</span><b>${t}</b></div>`;
  if (C.manual) h += `<div class="stat"><span>your wealth</span><b class="median">${fmtW(W[0])}</b></div><div class="stat"><span>expected (average) wealth</span><b class="mean">${fmtW(Math.pow(1.05, t) * (C.mode === 'marti' ? 100 : 1))}</b></div>`;
  else {
    h += `<div class="stat"><span>average</span><b class="mean">${fmtW(S.mean)}</b></div><div class="stat"><span>typical (median)</span><b class="median">${fmtW(S.median)}</b></div><div class="stat"><span>poorer than at start</span><b class="broke">${(S.below * 100).toFixed(0)}%</b></div>`;
    if (C.slider === 'f' || C.slider === 'q' || C.slider === 'pool') h += `<div class="stat"><span>typical growth / round</span><b style="color:${S.g > 0 ? '#5fd38d' : '#ff7a7a'}">${(S.g * 100).toFixed(2)}%</b></div>`;
  }
  $('stats').innerHTML = h;
}
function renderUI() {
  $('title').textContent = C.n; $('story').innerHTML = C.story;
  let c = '';
  if (C.guess && !guessed) c += `<label>Your guess: <b id="gv">${guess}%</b> end up poorer</label><input type="range" id="gs" min="0" max="100" value="${guess}"><button class="btn" id="lock">Lock in my guess</button>`;
  if (C.slider === 'f') c += `<label>Bet <b id="fv">${Math.round(params.f * 100)}%</b> of your wealth each flip</label><input type="range" id="sl" min="1" max="100" value="${Math.round(params.f * 100)}">`;
  if (C.slider === 'pool') c += `<label>Group size: <b id="fv">${params.pool}</b> ${params.pool === 1 ? '(alone)' : 'people share'}</label><input type="range" id="sl" min="1" max="10" value="${params.pool}">`;
  if (C.slider === 'q') c += `<label>Keep <b id="fv">${Math.round(params.q * 100)}%</b> in the stock, rebalance every round</label><input type="range" id="sl" min="0" max="100" value="${Math.round(params.q * 100)}">`;
  if (C.slider === 'limit') c += `<label>Table limit: <b id="fv">$${params.limit}</b></label><input type="range" id="sl" min="2" max="10" value="${Math.log2(params.limit)}">`;
  if (!C.manual && (!C.guess || guessed)) c += `<div class="row"><button class="btn" id="run">${running ? '⏸ Pause' : t >= C.rounds ? '↺ Run again' : t ? '▶ Resume' : '▶ Run ' + C.rounds + ' rounds'}</button><button class="btn ghost" id="rst">Reset</button></div>`;
  if (C.manual) c += `<div class="row"><button class="btn" id="flipB">🪙 Flip</button><button class="btn ghost" id="auto">Flip 10×</button><button class="btn ghost" id="rst">Reset</button></div>`;
  $('ctrl').innerHTML = c;
  const sl = $('sl');
  if (sl) sl.oninput = () => {
    if (C.slider === 'f') params.f = sl.value / 100; if (C.slider === 'pool') params.pool = +sl.value; if (C.slider === 'q') params.q = sl.value / 100; if (C.slider === 'limit') { params.limit = 2 ** sl.value; params.martiChecked = (params.martiChecked || 0) + 1; }
    $('fv').textContent = C.slider === 'f' || C.slider === 'q' ? Math.round(sl.value) + '%' : C.slider === 'limit' ? '$' + params.limit : params.pool + (params.pool === 1 ? ' (alone)' : ' people share');
    S = stats(); FX.sfx('tick'); running = false; meanHist = []; medHist = []; reset(); renderGoal();
  };
  if ($('gs')) $('gs').oninput = () => { guess = +$('gs').value; $('gv').textContent = guess + '%'; };
  if ($('lock')) $('lock').onclick = () => { guessed = true; FX.sfx('place'); renderUI(); };
  if ($('run')) $('run').onclick = () => { if (t >= C.rounds) { meanHist = []; medHist = []; reset(); } running = !running; FX.sfx('click'); renderUI(); };
  if ($('rst')) $('rst').onclick = () => { running = false; meanHist = []; medHist = []; manualHist = [0]; reset(); FX.sfx('pop'); renderUI(); };
  if ($('flipB')) $('flipB').onclick = flip;
  if ($('auto')) $('auto').onclick = async () => { for (let i = 0; i < 10 && t < C.rounds; i++) { flip(); await new Promise(r => setTimeout(r, 650)); } };
  const maxOpen = (() => { let m = 0; while (m < CH.length - 1 && SAVE.done[m]) m++; return m; })();
  $('chapters').innerHTML = CH.map((ch, i) => `<button class="ch ${i === SAVE.cur ? 'cur' : ''} ${i > maxOpen && !SAVE.done[i] ? 'lock' : ''} ${SAVE.done[i] ? 'done' : ''}" data-i="${i}">${i + 1}. ${ch.n}</button>`).join('');
  $('chapters').querySelectorAll('.ch').forEach(b => b.onclick = () => { FX.sfx('click'); meanHist = []; medHist = []; manualHist = [0]; setup(+b.dataset.i); });
  renderGoal();
}
function renderGoal() { const ok = SAVE.done[SAVE.cur]; $('goal').className = ok ? 'ok' : ''; $('goal').innerHTML = (ok ? '✓ ' : '🎯 ') + C.goal + (C.guess && guessed && t >= C.rounds ? `<br><br>You guessed <b>${guess}%</b>. Actually: <b>${S.belowPct.toFixed(0)}%</b>.` : ''); }
function check() {
  S = stats();
  if (!SAVE.done[SAVE.cur] && C.test(S)) {
    SAVE.done[SAVE.cur] = 1; persist(); FX.sfx('win'); FX.shake(.3);
    particles.burst(Wd / 2, Hd / 2, { n: 140, color: ['#ffd27a', '#6fe3ff', '#ffffff'], speed: 520 * dpr, life: 1.1 });
    toast('✓ ' + C.n, LESSON[SAVE.cur]);
    renderUI();
  } else renderGoal();
}
const LESSON = [
  'Your wealth is a product of factors, so what matters is the typical factor, √(1.5 × 0.6) ≈ 0.95. You shrink 5% per flip, even though the average grows.',
  'The average and the typical player diverge forever. This is "non-ergodicity": what happens to the crowd is not what happens to you.',
  'The Kelly bet maximises how fast you typically grow. Betting more raises the average but ruins most people who take it.',
  'Pooling turns many losing games into one winning one. That\'s one theory of why cooperation, insurance and families exist.',
  'Rebalancing harvests volatility: a stock that goes nowhere still feeds a growing portfolio.',
  'Every martingale ends in ruin given time. The expected value is exactly zero at every table limit; the strategy just turns many small wins into one large loss.',
];
function toast(big, small, ms = 6000) { const el = $('toast'); el.innerHTML = big + (small ? `<small style="max-width:560px;margin:8px auto 0">${small}</small>` : ''); el.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => el.classList.remove('on'), ms); }

setup(Math.min(SAVE.cur || 0, CH.length - 1)); resize(); requestAnimationFrame(frame);
window.__ruin = { CH, setup, roundOnce, stats: () => stats(), params: () => params, run: () => { running = true; }, set guess(v) { guess = v; guessed = true; }, get t() { return t; } };
</script>
