<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ruin</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;overflow:hidden;background:#07080d;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;color:#eee8dc}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:manipulation}
  .chip{position:fixed;background:rgba(20,22,32,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.08);border-radius:16px;box-shadow:0 14px 40px -16px rgba(0,0,0,.7)}
  #hud{top:16px;left:16px;padding:14px 18px;width:360px;box-sizing:border-box;max-height:calc(100vh - 100px);overflow:auto}
  #hud .home{color:#8f8a80;font-size:12px;text-decoration:none}
  #hud h1{margin:4px 0;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
  #storyT{display:none;margin-left:auto;border:0;background:rgba(255,255,255,.08);color:#eee8dc;border-radius:50%;width:26px;height:26px;font:inherit;font-size:14px;cursor:pointer}
  #story{font-size:14px;line-height:1.5;color:#c8c2b6}
  #story b{color:#ffd27a}
  #ctrl{margin-top:12px;display:flex;flex-direction:column;gap:10px;font-size:13px}
  #ctrl label{display:flex;justify-content:space-between;color:#aaa396}
  #ctrl input[type=range]{width:100%;accent-color:#ffd27a}
  .btn{border:0;background:#ffd27a;color:#1a1205;font:inherit;font-weight:700;border-radius:12px;padding:10px 14px;cursor:pointer;transition:transform .08s,filter .15s}
  .btn:active{transform:scale(.95)} .btn.ghost{background:rgba(255,255,255,.08);color:#eee8dc;font-weight:500}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  #stats{top:16px;right:16px;padding:12px 16px;width:220px;box-sizing:border-box;font-family:"JetBrains Mono",monospace}
  .stat{display:flex;justify-content:space-between;align-items:baseline;margin:3px 0;gap:8px}
  .stat b{font-size:22px}
  .mean{color:#ffd27a} .median{color:#6fe3ff} .broke{color:#ff7a7a}
  .stat span{font-size:12px;color:#8f8a80;font-family:"Space Grotesk",sans-serif}
  #chapters{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:8px;max-width:calc(100vw - 32px);overflow-x:auto;box-sizing:border-box}
  .ch{border:0;background:rgba(255,255,255,.06);color:#eee8dc;border-radius:10px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .ch.cur{background:#ffd27a;color:#1a1205;font-weight:700}
  .ch.lock{opacity:.3;pointer-events:none}
  .ch.done::after{content:' ✓'}
  #goal{margin-top:12px;padding:10px 12px;border-radius:12px;background:rgba(255,210,122,.08);border:1px solid rgba(255,210,122,.25);font-size:13px;line-height:1.45}
  #goal.ok{background:rgba(95,211,141,.1);border-color:rgba(95,211,141,.5)}
  #goal .log{margin-top:8px;font-family:"JetBrains Mono",monospace;font-size:12px;color:#c8c2b6}
  #goal .log div{display:flex;justify-content:space-between;gap:8px}
  .pos{color:#5fd38d} .neg{color:#ff7a7a}
  #toast{position:fixed;top:42%;left:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;font-size:40px;font-weight:700;letter-spacing:-.03em;pointer-events:none;transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1);text-align:center;background:rgba(10,11,18,.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,210,122,.25);border-radius:18px;padding:18px 26px;width:max-content;max-width:min(600px,calc(100vw - 40px));box-sizing:border-box;box-shadow:0 20px 60px -20px #000;z-index:10}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast small{display:block;font-size:16px;font-weight:400;letter-spacing:0;color:#d6d0c4;margin-top:8px;line-height:1.45}
  @media (max-width:860px){
    #hud{top:8px;left:8px;right:8px;width:auto;padding:10px 14px;max-height:none;overflow:visible}
    #hud h1{font-size:18px;margin:2px 0}
    #storyT{display:block}
    #story{display:none;font-size:13px}
    body.story #story{display:block}
    #ctrl{margin-top:8px;gap:8px}
    .btn{padding:8px 12px}
    #goal{margin-top:8px;padding:8px 10px;font-size:12px}
    #stats{top:auto;bottom:64px;left:8px;right:8px;width:auto;padding:6px 10px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
    .stat{flex-direction:column;align-items:flex-start;gap:0;margin:0}
    .stat b{font-size:15px} .stat span{font-size:10px}
    #chapters{bottom:8px;max-width:calc(100vw - 16px);padding:6px}
    #toast{font-size:28px;padding:14px 18px}
    #toast small{font-size:14px}
  }
  /* landscape phones: the panel sits beside the chart instead of over it */
  @media (max-height:520px) and (min-aspect-ratio:4/3){
    #cv{left:300px;width:calc(100% - 300px)}
    #hud{top:0;left:0;bottom:0;right:auto;width:300px;border-radius:0;overflow:auto;padding:8px 12px}
    #stats{top:6px;right:6px;left:auto;bottom:auto;width:auto;max-width:calc(100vw - 320px);padding:4px 10px}
    #chapters{bottom:6px;left:auto;right:6px;transform:none;max-width:calc(100vw - 312px)}
  }
  @media (pointer:coarse){.ch,.btn{min-height:40px}#storyT{width:36px;height:36px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip"><a class="home" href="../index.html">← Rabbit Holes</a><h1><span id="title"></span><button id="storyT" aria-label="Show the story">?</button></h1><div id="story"></div><div id="ctrl"></div><div id="goal"></div></div>
<div id="stats" class="chip"></div>
<div id="chapters" class="chip"></div>
<div id="toast"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
// ================= the games =================
// Each round every player's wealth is multiplied by a random factor. log-wealth is stored so a huge range fits on screen.
const CH = [
  { n: 'The Coin', players: 1, rounds: 60, f: 1, manual: 1,
    story: 'A generous casino: each flip, heads grows your wealth by <b>50%</b> and tails shrinks it by <b>40%</b>. On average you gain 5% per flip. That\'s a great bet. Isn\'t it?',
    goal: 'Flip the coin 40 times.', test: S => S.t >= 40 },
  { n: 'A Thousand Players', players: 1000, rounds: 100, f: 1, guess: 1,
    story: 'Now a thousand people play the same game for 100 flips. The <b class="mean">gold</b> line is the <b>average</b> wealth. The <b class="median">blue</b> line is the <b>typical</b> person (the median).',
    goal: 'Before you run it, guess what share of the players will end up <b>poorer</b> than they started. You need to be within 10 points.', test: S => S.t >= 100 && S.guessed && Math.abs(S.guess - S.belowPct) <= 10 },
  { n: 'Bet Less', players: 1000, rounds: 200, f: 1, slider: 'f', unit: 'flip',
    story: 'The average is carried by a few astronomically lucky people. Almost everyone else goes broke, because a 50% gain doesn\'t undo a 40% loss: 1.5 × 0.6 = 0.9. What if you only bet <b>part</b> of your wealth each flip?',
    goal: 'Choose a bet size, run 200 flips, and see how fast the <b>typical</b> player grows. Find a bet that reaches at least <b>0.55% per flip</b>. The growth rate is only revealed after each run.', test: S => S.g >= .0055 && S.t >= 200 },
  { n: 'Pool Together', players: 1200, rounds: 200, f: 1, slider: 'pool', unit: 'flip',
    story: 'Back to betting everything, but now players form groups and <b>share</b> their winnings equally after each flip. Cooperation smooths out the losses.',
    goal: 'Find the <b>smallest</b> group in which the typical member grows richer, and prove it with a 200-flip run.', test: S => S.t >= 200 && S.g > 0 && S.pool <= 3 },
  { n: 'Shannon\'s Demon', players: 1000, rounds: 120, mode: 'rebal', slider: 'q', unit: 'round',
    story: 'A wild stock <b>doubles or halves</b> each round. On its own it goes nowhere: the typical holder stays flat. Claude Shannon noticed that if you keep part of your money in cash and <b>rebalance</b> every round, you profit from the volatility itself.',
    goal: 'Choose how much to hold in the stock and run it. Find a mix where the typical portfolio grows at least <b>5.5% per round</b>.', test: S => S.g >= .055 && S.t >= 120 },
  { n: 'The Martingale', players: 1000, rounds: 300, mode: 'marti', slider: 'limit',
    story: 'The oldest "sure thing": bet $1 on a fair coin, and <b>double your bet</b> after every loss. Each win recovers all your losses plus $1. The catch is the table limit.',
    goal: 'Run the full 300 rounds at <b>two different</b> table limits. Watch the average stay at $100 while the shape of the crowd changes.', test: S => S.t >= 300 && S.martiChecked >= 2 },
];

// ================= state =================
// a corrupted or hand-edited save must not crash the page or unlock chapters out of range
function cleanSave(raw) {
  const s = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {}, done = {};
  if (s.done && typeof s.done === 'object') for (const k in s.done) if (/^\d+$/.test(k) && +k < CH.length && s.done[k]) done[k] = 1;
  return { done, cur: Number.isInteger(s.cur) && s.cur >= 0 && s.cur < CH.length ? s.cur : 0 };
}
const SAVE = cleanSave(RH.load('ruin', null));
const persist = () => { RH.save('ruin', SAVE); RH.progress('ruin', Object.keys(SAVE.done).length / CH.length); };
let C, P, W, Wn, srt, logs, t, running = false, params = {}, S = {}, coin = { phase: 0, face: 1, flipping: false }, guess = 50, guessed = false;
let martiBet, martiDone = new Set(), runLog = [], autoTok = 0, autoOn = false;
const $ = id => document.getElementById(id);
const startW = () => C.mode === 'marti' ? 100 : 1;

function setup(i) {
  SAVE.cur = i; persist(); C = CH[i]; running = false; guessed = false; autoTok++; autoOn = false;
  coin.flipping = false; coin.phase = 0; // a coin still in the air must not land in the next chapter
  params = { f: C.f ?? 1, pool: 1, q: 1, limit: 64 }; martiDone = new Set(); runLog = []; manualHist = [0];
  cacheColours(); reset();
  // on phones the story folds away; open it the first time a chapter is played
  document.body.classList.toggle('story', innerWidth <= 860 && !SAVE.done[i]);
  renderUI();
}
function reset() {
  P = C.players; W = new Float64Array(P).fill(startW()); Wn = new Float64Array(P); srt = new Float64Array(P);
  logs = new Float32Array(P * (C.rounds + 1)); logs.fill(Math.log10(startW()), 0, P); // logs[r * P + i] = log10 wealth of player i after round r
  t = 0; acc = 0; martiBet = new Float64Array(P).fill(1); S = stats();
  // history starts at round 0, so the mean/median lines line up with the trails
  meanHist = [Math.log10(startW())]; medHist = [Math.log10(startW())];
  clearTrails(); dirty = true;
}
function roundOnce(forceHeads) {
  const N = P, g = Wn;
  for (let i = 0; i < N; i++) {
    const h = forceHeads ?? Math.random() < .5;
    if (C.mode === 'rebal') g[i] = W[i] * ((1 - params.q) + params.q * (h ? 2 : .5));
    else if (C.mode === 'marti') {
      if (W[i] <= 0) { g[i] = 0; continue; }
      const bet = Math.min(martiBet[i], W[i]);
      g[i] = W[i] + (h ? bet : -bet);
      martiBet[i] = h ? 1 : Math.min(params.limit, martiBet[i] * 2);
    } else g[i] = W[i] * (1 + params.f * (h ? .5 : -.4));
  }
  if (params.pool > 1 && !C.mode) for (let i = 0; i + params.pool <= N; i += params.pool) { let m = 0; for (let j = 0; j < params.pool; j++) m += g[i + j]; m /= params.pool; for (let j = 0; j < params.pool; j++) g[i + j] = m; }
  Wn = W; W = g; t++;
  const o = t * P; for (let i = 0; i < N; i++) logs[o + i] = Math.log10(Math.max(1e-12, W[i]));
  S = stats(); drawRound(t); dirty = true;
}
// the typical growth rate per round, computed exactly from the rule (not from noisy samples)
function growth() {
  let g = 0;
  if (C.mode === 'rebal') g = .5 * Math.log(1 + params.q) + .5 * Math.log(1 - params.q / 2);
  else if (!C.mode && params.pool > 1) { // exact: average of n independent outcomes, binomial over the number of heads
    const n = params.pool; let c = 1; for (let k = 0; k <= n; k++) { if (k) c = c * (n - k + 1) / k; g += c / 2 ** n * Math.log((k * 1.5 + (n - k) * .6) / n); } }
  else if (!C.mode) g = .5 * Math.log(1 + .5 * params.f) + .5 * Math.log(1 - .4 * params.f);
  return g;
}
function stats() {
  srt.set(W); srt.sort(); const a = srt, n = a.length, start = startW();
  let sum = 0, below = 0, broke = 0; for (let i = 0; i < n; i++) { sum += a[i]; if (a[i] < start) below++; if (a[i] < start * .01) broke++; }
  const median = n % 2 ? a[n >> 1] : (a[n / 2 - 1] + a[n / 2]) / 2;
  return { t, mean: sum / n, median, below: below / n, belowPct: below / n * 100, broke: broke / n, g: growth(), guess, guessed, pool: params.pool, martiChecked: martiDone.size };
}

// ================= drawing =================
const cv = $('cv'), g = cv.getContext('2d'), trail = document.createElement('canvas'), tg = trail.getContext('2d'), scratch = document.createElement('canvas');
let Wd = 1, Hd = 1, dpr = 1, area = { x: 0, y: 0, w: 1, h: 1 }, bgGrad = null, dirty = true;
function computeArea() {
  const cr = cv.getBoundingClientRect(), side = innerWidth > innerHeight && innerHeight <= 520 && innerWidth > 600;
  if (side) { const st = $('stats').getBoundingClientRect(), chs = $('chapters').getBoundingClientRect(); // landscape phone: the canvas already starts right of the panel
    return { x: 50 * dpr, y: (st.bottom - cr.top + 14) * dpr, w: Math.max(40, cr.width - 50 - 70) * dpr, h: Math.max(40, chs.top - st.bottom - 40) * dpr }; }
  const wide = innerWidth > 860, hud = $('hud').getBoundingClientRect(), st = $('stats').getBoundingClientRect(), chs = $('chapters').getBoundingClientRect();
  let x0, x1, y0, y1;
  // keep the chart (and the histogram to its right) clear of every panel
  if (wide) { x0 = hud.right + 64; x1 = st.left - 100; y0 = 40; y1 = chs.top - 34; }
  else { x0 = 54; x1 = innerWidth - 76; y0 = hud.bottom + 18; y1 = st.top - 26; }
  return { x: x0 * dpr, y: y0 * dpr, w: Math.max(40, x1 - x0) * dpr, h: Math.max(40, y1 - y0) * dpr };
}
function layout() {
  const oldW = trail.width, oldH = trail.height, old = area;
  dpr = FX.fit(cv, 1.5); Wd = cv.width; Hd = cv.height;
  const na = computeArea();
  if (Wd === oldW && Hd === oldH && na.x === old.x && na.y === old.y && na.w === old.w && na.h === old.h) return;
  // keep the trails by rescaling the existing bitmap: replaying 300k segments on every resize froze the page
  scratch.width = oldW; scratch.height = oldH; scratch.getContext('2d').drawImage(trail, 0, 0);
  trail.width = Wd; trail.height = Hd; area = na;
  if (t > 0 && !C.manual && old.w > 1) tg.drawImage(scratch, old.x, old.y - 2, old.w, old.h + 4, area.x, area.y - 2 * area.h / old.h, area.w, area.h + 4 * area.h / old.h);
  scratch.width = scratch.height = 1;
  bgGrad = g.createRadialGradient(Wd * .55, Hd * .45, 0, Wd * .55, Hd * .45, Math.max(Wd, Hd) * .75); bgGrad.addColorStop(0, '#12131d'); bgGrad.addColorStop(1, '#05060a');
  dirty = true;
}
function yRange() { if (C.manual) return [-3, 2]; if (C.mode === 'marti') return [0, 3.3]; if (C.mode === 'rebal') return [-3, 6]; return C.slider === 'pool' ? [-6, 6] : [-6, 4]; }
const X = r => area.x + area.w * r / Math.max(1, C.rounds), Y = l => { const [lo, hi] = yRange(); return area.y + area.h * (1 - (Math.max(lo, Math.min(hi, l)) - lo) / (hi - lo)); };
function clearTrails() { tg.clearRect(0, 0, trail.width, trail.height); }
function hueFor(l) { const [lo, hi] = yRange(), x = (l - lo) / (hi - lo); return `hsla(${200 + x * 160},90%,${50 + x * 15}%,`; }
// colours are bucketed and cached, so drawing a round allocates nothing and changes stroke colour ~32 times instead of once per player
const NBK = 32, BK_COL = [], HB_COL = [], bk = new Uint8Array(1200), bkCount = new Int32Array(NBK + 1), bkIdx = new Int32Array(1200), bins = new Int32Array(48);
function cacheColours() { const [lo, hi] = yRange(), a = Math.min(.35, 12 / C.players); for (let b = 0; b < NBK; b++) BK_COL[b] = hueFor(lo + (b + .5) / NBK * (hi - lo)) + a + ')'; for (let b = 0; b < 48; b++) HB_COL[b] = hueFor(lo + (b + .5) / 48 * (hi - lo)) + '.8)'; }
function drawRound(r) { // add round r's segments to the persistent trail layer
  if (C.manual) return;
  const [lo, hi] = yRange(), o0 = (r - 1) * P, o1 = r * P, x0 = X(r - 1), x1 = X(r);
  bkCount.fill(0);
  for (let i = 0; i < P; i++) { const b = Math.max(0, Math.min(NBK - 1, (logs[o1 + i] - lo) / (hi - lo) * NBK | 0)); bk[i] = b; bkCount[b + 1]++; }
  for (let b = 1; b <= NBK; b++) bkCount[b] += bkCount[b - 1];
  for (let i = 0; i < P; i++) bkIdx[bkCount[bk[i]]++] = i;
  tg.globalCompositeOperation = 'lighter'; tg.lineWidth = 1.2 * dpr;
  for (let b = 0, s = 0; b < NBK; b++) {
    const e = bkCount[b]; if (e === s) continue;
    // one stroke per player keeps the additive glow where paths overlap (that density is the picture); colour is set once per bucket
    tg.strokeStyle = BK_COL[b];
    for (let j = s; j < e; j++) { const i = bkIdx[j]; tg.beginPath(); tg.moveTo(x0, Y(logs[o0 + i])); tg.lineTo(x1, Y(logs[o1 + i])); tg.stroke(); }
    s = e;
  }
  tg.globalCompositeOperation = 'source-over';
}
let meanHist = [0], medHist = [0], acc = 0, lastNow = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.1, (now - (lastNow || now)) / 1000); lastNow = now;
  if (document.hidden) return;
  if (running && !C.manual) { // a fixed number of rounds per second, whatever the frame rate
    acc += dt * 60; let n = 0; // 60 rounds a second: a 300-round run is a 5-second watch, not a 10-second wait
    while (acc >= 1 && running && n < 4) { acc -= 1; advance(); n++; }
    if (n === 4) acc = 0;
  }
  if (coin.flipping) { coin.phase += dt * (autoOn ? 42 : 21); /* auto-flips spin twice as fast: the point is the trend, not the wait */ dirty = true; if (coin.phase > Math.PI * 6) { coin.flipping = false; coin.phase = 0; landCoin(); } }
  const [sx, sy] = FX.shakeOffset(10 * dpr);
  // nothing moving: leave the last frame on screen
  if (!dirty && !particles.list.length && !sx && !sy) return;
  dirty = false;
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = bgGrad; g.fillRect(0, 0, Wd, Hd);
  g.translate(sx, sy);
  // axes: powers of ten
  const [lo, hi] = yRange(); g.font = `${(innerWidth > 860 ? 12 : 10) * dpr}px JetBrains Mono`; g.textAlign = 'right'; g.textBaseline = 'middle'; g.lineWidth = dpr;
  for (let p = Math.ceil(lo); p <= hi; p++) {
    const y = Y(p); g.strokeStyle = p === (C.mode === 'marti' ? 2 : 0) ? 'rgba(255,255,255,.35)' : 'rgba(255,255,255,.06)'; g.beginPath(); g.moveTo(area.x, y); g.lineTo(area.x + area.w, y); g.stroke();
    g.fillStyle = 'rgba(255,255,255,.4)'; g.fillText(fmtW(Math.pow(10, p)), area.x - 6 * dpr, y);
  }
  g.textAlign = 'left'; g.fillStyle = 'rgba(255,255,255,.3)'; g.fillText(`round ${t} / ${C.rounds}`, area.x, area.y + area.h + 16 * dpr);
  if (C.manual) drawCoin();
  else {
    g.drawImage(trail, 0, 0);
    // mean and median lines (a wide faint stroke under a thin bright one, instead of an expensive shadow blur)
    const line = (hist, col) => { if (hist.length < 2) return; g.beginPath(); for (let r = 0; r < hist.length; r++) r ? g.lineTo(X(r), Y(hist[r])) : g.moveTo(X(r), Y(hist[r])); g.strokeStyle = col; g.globalAlpha = .18; g.lineWidth = 9 * dpr; g.stroke(); g.globalAlpha = 1; g.lineWidth = 3 * dpr; g.stroke(); };
    g.lineJoin = 'round'; line(meanHist, '#ffd27a'); line(medHist, '#6fe3ff');
    // wealth histogram at the right edge of the chart
    if (t > 0) {
      bins.fill(0); const o = t * P; for (let i = 0; i < P; i++) { const l = logs[o + i]; bins[Math.floor((Math.max(lo, Math.min(hi - 1e-6, l)) - lo) / (hi - lo) * 48)]++; }
      let mx = 1; for (let b = 0; b < 48; b++) mx = Math.max(mx, bins[b]);
      for (let b = 0; b < 48; b++) { if (!bins[b]) continue; const y1 = area.y + area.h * (1 - (b + 1) / 48), h = area.h / 48 - 1; g.fillStyle = HB_COL[b]; g.fillRect(area.x + area.w + 10 * dpr, y1, bins[b] / mx * 60 * dpr, h); }
    }
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  particles.update(dt); particles.draw(g);
}
const particles = FX.particles(400);
function advance() {
  if (t >= C.rounds) { finish(); return; }
  roundOnce(); meanHist.push(Math.log10(Math.max(1e-12, S.mean))); medHist.push(Math.log10(Math.max(1e-12, S.median)));
  if (t % 10 === 0) { FX.sfx('tick'); updateStats(); }
  if (t >= C.rounds) { FX.sfx('chime', 4); finish(); }
}
function finish() {
  running = false;
  if (C.mode === 'marti') martiDone.add(params.limit);
  if (C.slider && C.slider !== 'limit') runLog.unshift({ label: sliderText(), g: S.g });
  if (C.mode === 'marti') runLog.unshift({ label: `limit $${params.limit}`, broke: S.below });
  runLog = runLog.slice(0, 5);

// gradients in unit-coin space, scaled with the coin (created once)

async function autoFlip(n = 10) {

// the chart sits on the canvas; only taps near the coin flip it (so the panels above stay usable)

addEventListener('keydown', e => { if (e.code === 'Space' && C.manual && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); flip(); } });

// ================= UI =================
let statsHTML = '';
function updateStats() {

  let h = `<div class="stat"><span>round</span><b>${t}</b></div>`;
  if (C.manual) h += `<div class="stat"><span>your wealth</span><b class="median">${fmtW(W[0])}</b></div><div class="stat"><span>expected (average)</span><b class="mean">${fmtW(Math.pow(1.05, t))}</b></div>`;
  else {
    h += `<div class="stat"><span>average</span><b class="mean">${fmtW(S.mean)}</b></div><div class="stat"><span>typical (median)</span><b class="median">${fmtW(S.median)}</b></div><div class="stat"><span>poorer than at start</span><b class="broke">${(S.below * 100).toFixed(0)}%</b></div>`;

function sliderText() {

  if (C.slider === 'limit') c += `<label>Table limit: <b id="fv">$${params.limit}</b></label><input type="range" id="sl" min="2" max="10" value="${Math.log2(params.limit)}">`;

  const auto = autoOn;
  if (C.manual) c += `<div class="row"><button class="btn" id="flipB">🪙 Flip</button><button class="btn ghost" id="auto" ${auto ? 'disabled' : ''}>${auto ? 'Flipping…' : 'Flip 10×'}</button><button class="btn ghost" id="rst">Reset</button></div>`;
  $('ctrl').innerHTML = c;

  if ($('lock')) $('lock').onclick = () => { guessed = true; FX.sfx('place'); renderUI(); };
  if ($('again')) $('again').onclick = () => { guessed = false; running = false; reset(); FX.sfx('pop'); renderUI(); };
  if ($('run')) $('run').onclick = () => { if (t >= C.rounds) reset(); running = !running; FX.sfx('click'); renderUI(); };
  if ($('rst')) $('rst').onclick = () => { running = false; autoTok++; autoOn = false; manualHist = [0]; coin.flipping = false; coin.phase = 0; reset(); FX.sfx('pop'); renderUI(); };
