<style>

  html,body{height:100%;overflow:hidden;font-family:"Courier Prime","Courier New",monospace;color:var(--ink);

  #report .stars{display:block;font:400 26px "Special Elite";color:var(--red);letter-spacing:.2em;margin-top:6px}
  @media (max-width:860px){
    #levels{display:none} #lvsel{display:block}

</style>
