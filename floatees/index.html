  html,body{height:100%;overflow:hidden;font-family:"Courier Prime","Courier New",monospace;color:var(--ink);

  #story{font-size:13.5px;line-height:1.5;color:#3a2e1e}
  #story b{color:#000;background:linear-gradient(transparent 60%,rgba(255,214,0,.45) 60%)}
  #goal{margin-top:10px;padding:8px 0 0;border-top:1px solid rgba(168,50,30,.5);font-size:13px;line-height:1.45}

  /* buttons are typewriter keys: round black caps in a chrome ring */
  .b{border:2px solid #b8bcc0;background:radial-gradient(circle at 50% 35%,#4a4a4a,#141414 70%);color:#f2ead6;font:700 12px "Courier Prime",monospace;border-radius:999px;padding:6px 12px;cursor:pointer;box-shadow:0 0 0 1px #3a3a3a,0 3px 0 #2a2a2a,0 4px 6px rgba(0,0,0,.5);text-transform:uppercase;letter-spacing:.04em;transition:transform .05s}

  .b:disabled{opacity:.45;cursor:default}
  .b:focus-visible,select:focus-visible,.lv:focus-visible{outline:2px dashed var(--red);outline-offset:3px}
  /* the voyages: a logbook with index tabs */
  #levels{top:16px;right:16px;padding:12px 12px 10px;width:236px;background:var(--grain),linear-gradient(#24364f,#172538);color:#e8dfc8;border:1px solid #0d1622}
  #levels h4{margin:0 4px 8px;font:400 15px "Special Elite",monospace;letter-spacing:.12em;color:#e8c98a;text-transform:uppercase;border-bottom:1px solid rgba(232,201,138,.4);padding-bottom:6px}
  .lv{padding:5px 8px;margin-bottom:3px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;background:linear-gradient(90deg,var(--card),var(--card2));color:var(--ink);border-radius:0 3px 3px 0;box-shadow:0 1px 2px rgba(0,0,0,.4);border-left:4px solid #8a7a5a}
  .lv:hover{transform:translateX(-3px)} .lv.cur{border-left-color:var(--red);transform:translateX(-6px)} .lv.lock{opacity:.35;pointer-events:none}
  .lv span:last-child{color:var(--red)}
  /* the control strip: a brass plate with typewriter keys */
  #ctrl{bottom:16px;left:50%;transform:translateX(-50%);padding:9px 12px;display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);
    background:var(--grain),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 1px,transparent 1px 5px),linear-gradient(#d9b467,#a67e32 55%,#86621f);border:1px solid #5a4014}
  #ctrl .sep{width:1px;height:24px;background:rgba(60,40,10,.4)}
  #clock{font:700 15px "Courier Prime",monospace;padding:2px 10px;color:#f6e7b8;background:#1b140b;border-radius:2px;box-shadow:inset 0 2px 4px #000;font-variant-numeric:tabular-nums}
  #ctrl .hint{font-size:12px;color:#2c1e08;padding:0 4px;font-style:italic}
  /* the tally is a typed field report */
  #tally{bottom:16px;right:16px;padding:12px 14px;width:244px;font-size:12.5px;line-height:1.55;background:var(--grain),repeating-linear-gradient(transparent 0 19px,rgba(31,53,80,.14) 19px 20px),linear-gradient(#f5efde,#e9dfc4)}
  #tally .r{display:flex;justify-content:space-between;gap:6px} #tally .r span{overflow:hidden;white-space:nowrap}

  #tally .hd{font:400 12px "Special Elite";letter-spacing:.1em;color:var(--navy);margin:4px 0 2px;text-transform:uppercase}
