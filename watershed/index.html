<style>

  .chip{position:fixed;background:rgba(18,26,36,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12);border-radius:16px;color:#f4efe6;box-shadow:0 10px 30px -10px rgba(0,0,0,.45)}

  .tool{width:62px;height:62px;border-radius:12px;border:1px solid transparent;background:rgba(255,255,255,.06);color:#f4efe6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:22px;cursor:pointer;transition:transform .08s,background .15s,border-color .15s;padding:0}

<body>
<canvas id="gl"></canvas>
<div id="top" class="chip"><div class="row"><a class="home" href="../index.html">← Rabbit Holes</a><span><button id="lvBtn">☰ Levels</button> <button class="mini" id="mini" title="Collapse">–</button></span></div><div class="t">💧 <span id="lvName">Watershed</span></div><div id="goal"></div><div class="bar"><div id="prog"></div></div></div>
<div id="levels" class="chip"></div>
<div id="tools" class="chip"></div>
<div id="speed" class="chip"><button data-s="0">⏸</button><button data-s="1" class="on">1×</button><button data-s="3">3×</button><button data-s="8">8×</button><button id="restart" title="Restart this landscape">↺</button><button id="mute" title="Sound">🔊</button></div>

<script type="importmap">{"imports":{"three":"../shared/vendor/three/build/three.module.min.js","three/addons/":"../shared/vendor/three/addons/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================= terrain & simulation =================
const N = 160, NN = N * N;
const B = new Float32Array(NN), ROCK = new Float32Array(NN), D = new Float32Array(NN);
let SED = new Float32Array(NN), SED2 = new Float32Array(NN);
const FL = new Float32Array(NN), FR = new Float32Array(NN), FT = new Float32Array(NN), FB = new Float32Array(NN);
const NOERODE = new Uint8Array(NN), NOSCULPT = new Uint8Array(NN), U = new Float32Array(NN), V = new Float32Array(NN), DEP = new Float32Array(NN), B0 = new Float32Array(NN), SEA = new Uint8Array(NN), HARD = new Float32Array(NN);
const RAISED = new Float32Array(NN); // how much the player has piled onto each cell (for the reservoir's dam)
let seaLevel = 0;
const G = 9.81, DT = .05;
const VS = 1.7; // vertical exaggeration for rendering only
const K = { capacity: .55, erode: .25, deposit: .3, evap: .00012, rockHard: .12, dmax: .6 };

// seeded value noise + fbm
function noise2(seed) {
  const r = RH.rng(seed), P = new Uint8Array(512), perm = r.shuffle([...Array(256).keys()]); for (let i = 0; i < 512; i++) P[i] = perm[i & 255];
  const grad = (h, x, y) => { const a = h / 256 * Math.PI * 2; return Math.cos(a) * x + Math.sin(a) * y; };
  const fade = t => t * t * t * (t * (t * 6 - 15) + 10);
  return (x, y) => { const X = Math.floor(x) & 255, Y = Math.floor(y) & 255, xf = x - Math.floor(x), yf = y - Math.floor(y), u = fade(xf), v = fade(yf);
    const aa = P[P[X] + Y], ab = P[P[X] + Y + 1], ba = P[P[X + 1] + Y], bb = P[P[X + 1] + Y + 1];
    const x1 = grad(aa, xf, yf) + u * (grad(ba, xf - 1, yf) - grad(aa, xf, yf)), x2 = grad(ab, xf, yf - 1) + u * (grad(bb, xf - 1, yf - 1) - grad(ab, xf, yf - 1));
    return x1 + v * (x2 - x1); };
}
function fbm(n, x, y, oct = 5) { let s = 0, a = 1, f = 1, t = 0; for (let o = 0; o < oct; o++) { s += a * n(x * f, y * f); t += a; a *= .5; f *= 2; } return s / t; }
const sm = (a, b, x) => { const t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); };

// ================= levels =================
// Each level builds its terrain via gen(x, y) -> [surface height, bedrock height], plus markers, a goal and a camera preset.
// cam: { el: elevation°, az: azimuth°, d: distance, t: [x, y, z] target }
const CAM0 = { el: 31, az: -15, d: 250, t: [0, 12, 6] };
const LV = [
  { n: 'First Spring', tools: { spring: 1 }, sea: 4, minSpringH: 22,
    goal: 'Place a <b>spring</b> high on the mountain and let it find its way to the <b>sea</b>.', hint: 'Pick the spring tool, then click on the high slopes at the back.',
    gen: (x, y, n) => { const h = 34 * Math.pow(1 - y, 1.4) + 3 * fbm(n, x * 3, y * 3) + 2; return [h, h - 2.5]; },
    test: S => S.seaIn > 1, prog: S => S.seaIn },
  { n: 'Canyon', tools: { spring: 2 }, sea: 3,
    goal: 'A plateau of layered rock. Let rivers cut a <b>canyon 5 m deep</b> into the strata.', hint: 'Springs near the plateau edge cut fastest. Try 3× speed.',
    gen: (x, y, n) => { const pl = sm(.75, .55, y) * 22 + 4 + 3 * fbm(n, x * 4, y * 4); return [pl + .6, pl - .4]; },
    test: S => S.maxCut >= 5, prog: S => S.maxCut / 5 },
  { n: 'Mountain Lake', tools: { rain: 1 }, sea: 0, cam: { el: 66, az: -8, d: 290, t: [0, 8, 6] }, brushR: { rain: 12 }, rimLock: [.33, .5],
    goal: 'Fill the high basin with rain until it holds a <b>lake</b> of 400 m² that is at least 1 m deep.', hint: 'Hold the rain tool over the middle of the basin.',
    gen: (x, y, n) => { const r = Math.hypot(x - .5, y - .5); const h = 18 + 22 * sm(.18, .42, r) - 6 * sm(.25, 0, r) + 4 * fbm(n, x * 4, y * 4); return [h, h - 3]; },
    test: S => S.lakeArea >= 400, prog: S => S.lakeArea / 400 },
  { n: 'The Falls', tools: { spring: 1 }, sea: 3, cam: { el: 34, az: -32, d: 235, t: [0, 10, 4] },
    goal: 'Hard caprock sits on soft stone. Rivers undercut it and the edge retreats upstream as a cliff. Make a <b>waterfall at least 4 m high</b> that has <b>cut back 6 m</b> into the upper shelf.', hint: 'Put the spring on the upper shelf, then speed time up.',
    gen: (x, y, n) => { const step = sm(.52, .5, y) * 9 + sm(.3, .05, y) * 8; const h = 6 + step + 2 * fbm(n, x * 3, y * 3) + (1 - y) * 4; return [h, h - .3]; }, hardBand: [12, 15],
    test: S => S.fall >= 4, prog: S => Math.min(S.fallH / 4, 1) * .4 + Math.min(S.retreat / 6, 1) * .6 },
  { n: 'Delta', tools: { spring: 2, rain: 1 }, sea: 6, springQ: 1.3, cam: { el: 36, az: -12, d: 245, t: [0, 10, 14] },
    goal: 'Rivers carry sand. Where they slow down at the sea, it settles into a <b>delta</b>. Deposit 25 m³ of sediment in the sea.', hint: 'Soft soil erodes easily. Rain on the hills sends more sand downstream.',
    gen: (x, y, n) => { const h = 26 * Math.pow(1 - y, 1.2) + 5 * fbm(n, x * 3, y * 3) + 1; return [h + 3.5, h - 2]; },
    test: S => S.seaDep >= 25, prog: S => S.seaDep / 25 },
  { n: 'Save the Village', tools: { raise: 1, dig: 1 }, sea: 3, storm: 1, raiseBudget: 2000, digBudget: 2000, cam: { el: 40, az: -12, d: 215, t: [0, 8, 14] },
    goal: 'A storm is about to break over the hills. Build levees or dig channels so <b>no house floods</b>, through the storm and until the water has drained away. You can\'t build on the village itself.', hint: 'Raise ground to wall water off. Dig to give it somewhere else to go.',
    gen: (x, y, n) => { const ax = .5 + .06 * Math.sin(y * 5); const v = Math.abs(x - ax); const h = 4 + 16 * Math.pow(1 - y, 1.2) * (.45 + v * 1.4) + 3 * v + 1.2 * fbm(n, x * 3, y * 3); return [h, h - 3]; },
    houses: [[.6, .64], [.63, .7], [.57, .76]], stormFor: 150, calmFor: 60, stormRain: .015,
    test: S => S.calmT >= 60 && S.dryHouses === S.nHouses, fail: S => S.wetHouse, prog: S => S.simT / 210 },
  { n: 'Irrigation', tools: { dig: 1 }, sea: 3, digBudget: 900, cam: { el: 44, az: -8, d: 225, t: [0, 8, 8] },
    goal: 'The fields sit on benches just above the river, bone dry. Dig canals so <b>all four fields</b> get water at once.', hint: 'Water can\'t flow uphill. Start each canal upstream, where the river is higher than the field. [ and ] change the brush size.',
    gen: (x, y, n) => { const v = Math.abs(x - .5); const h = 4 + 18 * (1 - y) + 1.3 * sm(.015, .06, v) + 11 * sm(.2, .38, v) + .5 * fbm(n, x * 4, y * 4); return [h, h - 3]; },
    fields: [[.38, .45], [.62, .55], [.38, .7], [.62, .8]], springAt: [.5, .06], springQ: 2.5,
    test: S => S.fieldsWet === 4, prog: S => S.fieldsWet / 4 },
  { n: 'Through the Ridge', tools: { dig: 1 }, sea: 3, digBudget: 160, springAt: [.62, .1],
    goal: 'A ridge dams the valley, and the sea lies beyond it. Use a little digging to get the river <b>through</b> to the sea.', hint: 'Dig a notch where the river meets the ridge. Running water will deepen it for you.',
    gen: (x, y, n) => { const ridge = 9 * Math.exp(-Math.pow((y - .56) / .05, 2)) * (1 - .45 * Math.exp(-Math.pow((x - .62) / .1, 2))); const valley = y < .56 ? 7 * Math.min(1, Math.abs(x - .62) * 2.2) : 0; const h = .8 + 18 * sm(.52, 0, y) + valley + ridge + 1.2 * fbm(n, x * 3, y * 3) + (1 - y) * 6; return [h, h - 2.5]; },
    test: S => S.seaIn > 1, prog: S => S.seaIn },
  { n: 'Reservoir', tools: { raise: 1, spring: 1 }, sea: 3, raiseBudget: 260,
    goal: 'Build a <b>dam</b> across the gorge and hold a reservoir of 400 m³ behind it.', hint: 'Raise a wall across the narrowest point, below the spring.',
    gen: (x, y, n) => { const g = Math.abs(x - .5); const h = 5 + 22 * sm(.03, .2, g) + 18 * sm(.7, 0, y) + 2 * fbm(n, x * 4, y * 4); return [h, h - 2]; },
    test: S => S.reservoir >= 400, prog: S => S.reservoir / 400 },
  { n: 'Sandbox', tools: { rain: 1, spring: 9, raise: 1, dig: 1 }, sea: 5, free: 1,
    goal: 'No goal. Sculpt mountains, start storms and watch a million years of erosion in a minute.', hint: 'Try 8× speed with rain over high ground.',
    gen: (x, y, n) => { const h = 30 * fbm(n, x * 2, y * 2, 6) + 18 * Math.pow(1 - y, 1.5) + 8; return [h, h - 2.2]; },
    test: () => false, prog: () => 0 },
];

// ================= state =================
const SAVE = RH.load('watershed', { done: {}, cur: 0, intro: 0 });
const persist = () => { RH.save('watershed', SAVE); RH.progress('watershed', Object.keys(SAVE.done).length / (LV.length - 1)); };
let L = null, cur = 0, tool = 'view', springs = [], houses = [], fields = [], budget = {}, stat = {}, won = false, failed = false, undo = [];
const FALL_ROW0 = []; // per column: the row of the original cliff edge (The Falls)
const BRUSH_DEF = { rain: 7, raise: 7, dig: 7 }, brushR = {};

function buildLevel(i) {
  cur = i; SAVE.cur = i; persist(); L = LV[i]; won = false; failed = false; springs = []; simT = 0; seaInWindow.length = 0; seaInflowStep = 0; stepped = false; undo = [];
  NOERODE.fill(0); NOSCULPT.fill(0); RAISED.fill(0); budget = { dig: L.digBudget ?? Infinity, raise: L.raiseBudget ?? Infinity };
  Object.assign(brushR, BRUSH_DEF, L.brushR || {});
  const n = noise2('ws' + i);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const k = y * N + x, [h, r] = L.gen(x / (N - 1), y / (N - 1), n);
    B[k] = h; ROCK[k] = Math.min(r, h); HARD[k] = 1;
    if (L.hardBand && r > L.hardBand[0] && r < L.hardBand[1]) HARD[k] = .12;
    if (L.rimLock) { const rr = Math.hypot(x / (N - 1) - .5, y / (N - 1) - .5); if (rr > L.rimLock[0] && rr < L.rimLock[1]) NOERODE[k] = 1; } // the basin rim is solid granite
  }
  D.fill(0); SED.fill(0); SED2.fill(0); FL.fill(0); FR.fill(0); FT.fill(0); FB.fill(0); U.fill(0); V.fill(0); DEP.fill(0);
  B0.set(B);
  seaLevel = L.sea; SEA.fill(0);
  // the sea: cells below sea level connected to the bottom edge
  const q = []; for (let x = 0; x < N; x++) { const k = (N - 1) * N + x; if (B[k] < seaLevel) { SEA[k] = 1; q.push(k); } }
  while (q.length) { const k = q.pop(), x = k % N, y = (k / N) | 0; for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const nx = x + dx, ny = y + dy; if (nx < 0 || ny < 0 || nx >= N || ny >= N) continue; const j = ny * N + nx; if (!SEA[j] && B[j] < seaLevel) { SEA[j] = 1; q.push(j); } } }
  houses = (L.houses || []).map(([x, y]) => (Math.round(y * (N - 1)) * N + Math.round(x * (N - 1))));
  for (const k of houses) { const hx = k % N, hy = (k / N) | 0; for (let dy = -5; dy <= 5; dy++) for (let dx = -5; dx <= 5; dx++) if (dx * dx + dy * dy <= 25) NOSCULPT[(hy + dy) * N + hx + dx] = 1; }
  fields = (L.fields || []).map(([x, y]) => (Math.round(y * (N - 1)) * N + Math.round(x * (N - 1))));
  if (L.springAt) springs.push({ k: Math.round(L.springAt[1] * (N - 1)) * N + Math.round(L.springAt[0] * (N - 1)), fixed: 1, q: L.springQ || 1 });
  // The Falls: remember where the original cliff edge is in each column (steepest drop)
  FALL_ROW0.length = 0; if (L.hardBand) for (let x = 0; x < N; x++) { let best = 0, row = 0; for (let y = 2; y < N - 3; y++) { const dd = B[y * N + x] - B[(y + 3) * N + x]; if (dd > best) { best = dd; row = y; } } FALL_ROW0[x] = row; }
  stat = {}; buildMarkers(); renderUI(); updateGeometry(true);
  $('lvName').textContent = L.n; $('goal').innerHTML = L.goal; $('hint').textContent = L.hint; $('hint').style.opacity = 1;
  $('toast').classList.remove('on'); $('levels').classList.remove('open');
  const first = Object.keys(L.tools)[0]; setTool(first);
  frameCam();
}

// ================= erosion step (virtual pipe model, Mei et al. 2007) =================
// Hot loops are written flat (no closures, no per-cell allocations, no Math.hypot) since they run 120-1000x a second.
let simT = 0;
function step(rainAll) {
  const dt = DT, gdt = G * dt, n1 = N - 1;
  simT += dt; stepped = true; simSteps++;
  // sources
  for (let i = 0; i < springs.length; i++) { const s = springs[i], a = 5 / 9 * dt * (s.q || 1); for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) D[s.k + dy * N + dx] += a; }
  if (rainAll) { const a = .012 * dt * rainAll; for (let k = 0; k < NN; k++) D[k] += a; }
  if (L.storm && simT < L.stormFor) { const ymax = (N * .42) | 0, a = (L.stormRain || .012) * dt; for (let k = 0; k < ymax * N; k++) D[k] += a; } // the storm breaks over the hills
  if (brush.active && tool === 'rain') { const r = brush.r, cx = brush.x, cy = brush.y, y0 = Math.max(1, (cy - r) | 0), y1 = Math.min(N - 2, cy + r), x0 = Math.max(1, (cx - r) | 0), x1 = Math.min(N - 2, cx + r);
    for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { const dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy); if (d < r) { const w = 1 - d / r; D[y * N + x] += .25 * w * Math.sqrt(w) * dt; } } }
  flux(dt, gdt, n1);
  seaInflowStep = waterStep(dt, n1);
  advect(dt);
  thermal();
}
function flux(dt, gdt, n1) {
  const B_ = B, D_ = D, FL_ = FL, FR_ = FR, FT_ = FT, FB_ = FB, N_ = N;
  for (let y = 0; y < N_; y++) {
    const row = y * N_;
    for (let x = 0; x < N_; x++) {
      const k = row + x, dk = D_[k];
      if (dk === 0) { FL_[k] = FR_[k] = FT_[k] = FB_[k] = 0; continue; } // dry cells can't send water anywhere
      const h = B_[k] + dk;
      let l = 0, r = 0, t = 0, b = 0;
      if (x > 0) { l = FL_[k] + gdt * (h - B_[k - 1] - D_[k - 1]); if (l < 0) l = 0; }

  for (let i = 0; i < RAINN; i++) {
    let y = rainPos[i * 3 + 1] - (40 + rainVel[i]) * dt;

    if (y < (B[gi] + D[gi]) * VS || rainVel[i] === 0) {
      const a = Math.random() * Math.PI * 2, r = Math.sqrt(Math.random()) * radius;
      rainPos[i * 3] = cx + Math.cos(a) * r; rainPos[i * 3 + 2] = cz + Math.sin(a) * r; y = 70 + Math.random() * 50; rainVel[i] = 10 + Math.random() * 20;
    }

}

// ================= input =================
const brush = { active: false, x: 0, y: 0, get r() { return brushR[tool] || 7; } };
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(), rp = new THREE.Vector3();
function hHere(x, z) { const gx = Math.max(0, Math.min(N - 1.001, x + N / 2)), gz = Math.max(0, Math.min(N - 1.001, z + N / 2)), x0 = gx | 0, z0 = gz | 0, fx = gx - x0, fz = gz - z0, k = z0 * N + x0; return (B[k] * (1 - fx) + B[k + 1] * fx) * (1 - fz) + (B[k + N] * (1 - fx) + B[k + N + 1] * fx) * fz; }
function pickGround(e) {

function msg(text, ms = 1800) { const m = $('msg'); m.textContent = text; m.classList.add('on'); clearTimeout(msg.h); msg.h = setTimeout(() => m.classList.remove('on'), ms); }

  if (L.minSpringH && B[k] < L.minSpringH) { FX.sfx('fail'); msg(`Too low (${B[k].toFixed(0)} m). Springs here need ground above ${L.minSpringH} m.`); return false; }
  let moved = false;
  if (springs.filter(s => !s.fixed).length >= max) { const old = springs.findIndex(s => !s.fixed); const m = markerMeshes.find(mm => mm.userData.spring && mm.userData.k === springs[old].k); scene.remove(m); markerMeshes.splice(markerMeshes.indexOf(m), 1); springs.splice(old, 1); moved = true; }

canvas.addEventListener('pointerdown', e => {
  $('levels').classList.remove('open');
  if (e.button !== 0 || tool === 'view') return;
  const g = pickGround(e); if (!g) return;
  $('hint').style.opacity = 0;
  if (tool === 'spring') { placeSpring(g[0], g[1]); return; }
  if (tool === 'raise' || tool === 'dig') { undo.push({ B: B.slice(), ROCK: ROCK.slice(), RAISED: RAISED.slice(), budget: { ...budget } }); if (undo.length > 12) undo.shift(); renderUndo(); }
  brush.active = true; brush.x = g[0]; brush.y = g[1]; hover.on = true; hover.x = g[0]; hover.y = g[1]; canvas.setPointerCapture(e.pointerId);
  if (tool === 'rain') FX.sfx('whoosh');

let lastPick = 0;
canvas.addEventListener('pointermove', e => {
  if (!brush.active && (tool === 'view' || tool === 'spring')) return;
  const now = performance.now(); if (!brush.active && now - lastPick < 30) return; lastPick = now; // hover picking is throttled
  const g = pickGround(e); hover.on = !!g; if (g) { hover.x = g[0]; hover.y = g[1]; if (brush.active) { brush.x = g[0]; brush.y = g[1]; } }
});
canvas.addEventListener('pointerleave', () => { if (!brush.active) hover.on = false; });
addEventListener('pointerup', () => { brush.active = false; });
function sculpt(dt) {
  if (!brush.active || (tool !== 'raise' && tool !== 'dig')) return false;
  const rate = 6 * dt, r = brush.r, cx = brush.x, cy = brush.y, raise = tool === 'raise'; let used = 0, left = budget[tool];
  for (let y = Math.max(1, (cy - r) | 0); y <= Math.min(N - 2, cy + r); y++) for (let x = Math.max(1, (cx - r) | 0); x <= Math.min(N - 2, cx + r); x++) {

  return used > 0;
}

// ================= UI =================
const TOOLS = { view: ['🎥', 'Look'], rain: ['🌧️', 'Rain'], spring: ['⛲', 'Spring'], raise: ['⛰️', 'Raise'], dig: ['⛏️', 'Dig'] };
function setTool(t) { tool = t; controls.mouseButtons.LEFT = t === 'view' ? THREE.MOUSE.ROTATE : null; controls.touches.ONE = t === 'view' ? THREE.TOUCH.ROTATE : null; renderUI(); }
function renderUI() {
  const brushy = tool === 'rain' || tool === 'raise' || tool === 'dig';
  $('tools').innerHTML = Object.entries(TOOLS).filter(([k]) => k === 'view' || L.tools[k]).map(([k, [ic, n]]) => {
    let badge = '';
    if (k === 'spring') { const left = L.tools.spring - springs.filter(s => !s.fixed).length; badge = `<i class="n">${left}</i>`; if (left <= 0) n = 'Move'; }
    if ((k === 'dig' || k === 'raise') && isFinite(budget[k])) badge = `<i class="n" data-b="${k}">${Math.max(0, budget[k]) | 0}</i>`;
    return `<button class="tool ${tool === k ? 'on' : ''}" data-t="${k}" title="${k === 'spring' ? 'Place a spring. When none are left, clicking moves your oldest one.' : n}">${badge}${ic}<span>${n}</span></button>`;
  }).join('')
    + (brushy ? `<div class="bsz" title="Brush size ( [ and ] )"><button data-bs="1">+</button><span id="bsv">${brush.r}</span><button data-bs="-1">−</button></div>` : '')
    + (L.tools.raise || L.tools.dig ? `<button class="tool" id="undo" title="Undo last stroke (Ctrl+Z)">↶<span>Undo</span></button>` : '');
  $('tools').querySelectorAll('.tool[data-t]').forEach(b => b.onpointerdown = () => { FX.sfx('click'); setTool(b.dataset.t); });
  $('tools').querySelectorAll('[data-bs]').forEach(b => b.onpointerdown = e => { e.preventDefault(); setBrush(+b.dataset.bs); });
  if ($('undo')) $('undo').onpointerdown = doUndo;
  renderUndo();
  $('levels').innerHTML = '<h4>Landscapes</h4>' + LV.map((l, i) => `<div class="lv ${i === cur ? 'cur' : ''} ${i > 0 && !SAVE.done[i - 1] && !SAVE.done[i] && i !== LV.length - 1 && !(i <= maxOpen()) ? 'lock' : ''}" data-i="${i}"><span>${l.n}</span><span>${SAVE.done[i] ? '✓' : ''}</span></div>`).join('');
  $('levels').querySelectorAll('.lv').forEach(el => el.onclick = () => { FX.sfx('click'); buildLevel(+el.dataset.i); });
  $('lvBtn').textContent = `☰ ${cur + 1}/${LV.length}`;
}
function setBrush(d) { if (!brushR[tool]) return; brushR[tool] = Math.max(3, Math.min(16, brushR[tool] + d)); if ($('bsv')) $('bsv').textContent = brushR[tool]; FX.sfx('tick'); }
function renderUndo() { const u = $('undo'); if (u) u.disabled = !undo.length; }
function doUndo() { const s = undo.pop(); if (!s) return; B.set(s.B); ROCK.set(s.ROCK); RAISED.set(s.RAISED); Object.assign(budget, s.budget); FX.sfx('pop'); renderBudget(); renderUndo(); geomDirty = true; }
const maxOpen = () => { let m = 0; while (m < LV.length - 1 && SAVE.done[m]) m++; return m; };
function renderBudget() { document.querySelectorAll('[data-b]').forEach(el => el.textContent = Math.max(0, budget[el.dataset.b]) | 0); }
let speed = 1;
document.querySelectorAll('#speed [data-s]').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('#speed [data-s]').forEach(x => x.classList.toggle('on', x === b)); FX.sfx('click'); });
$('mute').onclick = () => { FX.setMuted(!FX.muted); $('mute').textContent = FX.muted ? '🔇' : '🔊'; };
$('mute').textContent = FX.muted ? '🔇' : '🔊';
$('restart').onclick = () => { FX.sfx('click'); buildLevel(cur); };
$('mini').onclick = () => { const m = $('top').classList.toggle('min'); $('mini').textContent = m ? '+' : '–'; };
$('lvBtn').onclick = e => { e.stopPropagation(); FX.sfx('click'); $('levels').classList.toggle('open'); };
addEventListener('keydown', e => {
  if (e.key === '[') setBrush(-1); else if (e.key === ']') setBrush(1);
  else if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); doUndo(); }
});

function toast(big, small, ms = 2600) { const t = $('toast'); t.innerHTML = big + (small ? `<small>${small}</small>` : ''); t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms); }
// camera: per-level preset, pulled back and steepened on portrait screens so the whole landscape fits
function frameCam() {
  const c = L.cam || CAM0, a = camera.aspect, refA = 1.45;
  let d = c.d, el = c.el;
  if (a < refA) { const f = refA / a; d *= Math.pow(f, .8); el = Math.min(72, el + 22 * Math.min(1, (f - 1) / 1.5)); }
  const e = el * Math.PI / 180, z = c.az * Math.PI / 180;
  controls.target.set(...c.t);
  camera.position.set(c.t[0] + d * Math.cos(e) * Math.sin(z), c.t[1] + d * Math.sin(e), c.t[2] + d * Math.cos(e) * Math.cos(z));

// keep the landscape centred in the space the panels leave free
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  const hud = $('top').getBoundingClientRect(), lv = $('levels').getBoundingClientRect();
  const shiftX = w > 900 ? Math.round((hud.right - (lv.width ? w - lv.left : 0)) / 2) : 0;
  const shiftY = w <= 760 ? Math.round((hud.bottom - (h - $('speed').getBoundingClientRect().top)) / 2) : 0;
  camera.setViewOffset(w, h, -shiftX, -shiftY, w, h);

addEventListener('resize', resize);

// ================= main loop =================

  // geometry upload is the main per-frame cost; at high sim speeds refresh every other frame
  if (simSteps !== drawnSteps) geomDirty = true;
  if (geomDirty && (n <= 6 || frameN % 2 === 0)) { updateGeometry(); geomDirty = false; drawnSteps = simSteps; }

  controls.update(); camera.position.x += sx * .2; camera.position.y += sy * .2;

  camera.position.x -= sx * .2; camera.position.y -= sy * .2;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } });
function win() {
  won = true; SAVE.done[cur] = 1; persist(); FX.sfx('win'); FX.shake(.35);

buildLevel(Math.min(SAVE.cur ?? 0, LV.length - 1));
resize();
raf = requestAnimationFrame(loop);
if (!SAVE.intro) { SAVE.intro = 1; persist(); }
const tv = new THREE.Vector3();
window.__ws = { LV, buildLevel: i => buildLevel(i), stat: () => stat, get springs() { return springs; }, addSpring: k => { const s = { k, q: L.springQ || 1 }; springs.push(s); addSpringMesh(s); }, placeSpring, measure: () => { measure(); return stat; }, SEA, B0, ROCK, RAISED, NOSCULPT, step, B, D, N, setSpeed: s => speed = s, updateGeometry, get budget() { return budget; }, get won() { return won; }, get failed() { return failed; },
  toScreen: (gx, gy) => { const k = Math.round(gy) * N + Math.round(gx); tv.set(gx - N / 2, B[k] * VS, gy - N / 2).project(camera); return [(tv.x + 1) / 2 * innerWidth, (1 - tv.y) / 2 * innerHeight]; },
  get stepCost() { return stepCost; }, get sis() { return seaInflowStep; }, get win() { return seaInWindow.slice(); }, setTool, get brushR() { return brushR; } };
