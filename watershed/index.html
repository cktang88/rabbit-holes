  $('levels').innerHTML = '<h4>Survey sites</h4>' + SC.map((l, i) => { const m = SAVE.medals[i] || 0;
    return `<div class="lv ${i === cur ? 'cur' : ''} ${i > maxOpen() && i !== SC.length - 1 ? 'lock' : ''}" data-i="${i}" tabindex="0"><span>${l.n}<small>${l.place}</small></span><span class="medals">${l.free ? '' : '●'.repeat(m) + '○'.repeat(3 - m)}</span></div>`; }).join('');
  $('levels').querySelectorAll('.lv').forEach(el => el.onclick = () => { if (el.classList.contains('lock')) return; snd.key(); buildLevel(+el.dataset.i); });
  $('lvBtn').textContent = `Sites ${cur + 1}/${SC.length}`;
}
// a site opens once the one before has at least one medal; the sandbox is always open
const maxOpen = () => { let m = 0; while (m < SC.length - 2 && SAVE.medals[m]) m++; return m; };
function renderScore() {
  const W = L.want || {}, S = stat, rows = [];
  const row = (label, v, t, ok) => rows.push(`<tr class="${ok == null ? '' : ok ? 'good' : 'bad'}"><td>${label}</td><td class="v">${v}</td><td class="t">${t}</td><td class="ok">${ok == null ? '' : ok ? '✓' : '✗'}</td></tr>`);
  if (L.tools.farm) row('Harvest (bu)', S.harvest.toLocaleString('en') + (lastYield ? ` <small>+${lastYield}</small>` : ''), W.harvest != null ? '≥ ' + W.harvest.toLocaleString('en') : '', W.harvest != null ? S.ok.harvest : null);
  towns.forEach((t, j) => row(t.n + ' floods', t.floods, W.floods != null ? '≤ ' + W.floods : '', W.floods != null ? t.floods <= W.floods : null));
  if (L.dam) row('Reservoir capacity', S.capPct.toFixed(0) + '%', W.cap != null ? '≥ ' + W.cap + '%' : '', W.cap != null ? S.ok.cap : null);
  if (L.tools.raise && (W.power != null || L.free)) row('Power (GWh)', S.power, W.power != null ? '≥ ' + W.power : '', W.power != null ? S.ok.power : null);
  if (L.coastY) row('Delta land', S.deltaPct.toFixed(0) + '%', W.delta != null ? '≥ ' + W.delta + '%' : '', W.delta != null ? S.ok.delta : null);
  $('score').innerHTML = rows.join('');
}
function renderYears() {
  const Y = L.free ? Math.max(20, year + 5) : L.years, from = L.free ? Math.max(0, year - 15) : 0, cells = [];
  for (let y = from; y < from + Math.min(Y, 30); y++) { const s = L.storm(y), h = history[y]; cells.push(`<i class="s${s} ${y < year ? 'past' : ''} ${h && h.fl.length ? 'fl' : ''} ${y === year ? 'now' : ''}" title="Year ${y + 1}${s >= 3 ? ': great flood' : s >= 2 ? ': flood year' : ''}"></i>`); }
  $('years').innerHTML = cells.join('');
  $('yr0').textContent = 'Year ' + (from + 1); $('yrNow').textContent = over ? 'Done' : year ? `Year ${year + 1}` : 'Planning'; $('yr1').textContent = L.free ? '' : 'Year ' + L.years;
}
function setBrush(d) { brushR[tool] = Math.max(2, Math.min(16, (brushR[tool] || 6) + d)); if ($('bsv')) $('bsv').textContent = brushR[tool]; snd.key(); }
function renderUndo() { const u = $('undo'); if (u) u.disabled = !undo.length || over; }
function doUndo() { const s = undo.pop(); if (!s || over) return; B.set(s.B); ROCK.set(s.ROCK); RAISED.set(s.RAISED); USE.set(s.USE); FH.set(s.FH); FDEP.set(s.FDEP); Object.assign(budget, s.budget); rebuildFarms(); snd.plaster(); renderBudget(); renderUndo(); geomDirty = true; }
function renderBudget() { document.querySelectorAll('[data-b]').forEach(el => el.textContent = fmtB(el.dataset.b)); }
let speed = 0;
function setSpeed(s) { if (over && s) return; speed = s; document.querySelectorAll('#speed [data-s]').forEach(x => x.classList.toggle('on', +x.dataset.s === s)); $('go').textContent = s ? '▶ Running' : year ? '▶ Resume' : '▶ Run'; }
document.querySelectorAll('#speed [data-s]').forEach(b => b.onclick = () => { setSpeed(+b.dataset.s); snd.key(); if (speed) { document.body.classList.add('playing'); $('hint').style.opacity = 0; } });
$('mute').onclick = () => { FX.setMuted(!FX.muted); $('mute').style.opacity = FX.muted ? .4 : 1; };
$('mute').style.opacity = FX.muted ? .4 : 1;
$('restart').onclick = () => { snd.key(); buildLevel(cur); };
$('briefBtn').onclick = e => { e.stopPropagation(); const on = document.body.classList.toggle('brief'); $('briefBtn').setAttribute('aria-expanded', on); snd.key(); resize(); };
$('lvBtn').onclick = e => { e.stopPropagation(); snd.key(); $('levels').classList.toggle('open'); };
addEventListener('keydown', e => {
  if (e.key === '[') setBrush(-1); else if (e.key === ']') setBrush(1);
  else if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); doUndo(); }
  else if (e.key === ' ' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); setSpeed(speed ? 0 : 1); }
});
// camera: per-site preset, pulled back and steepened on portrait screens so the whole model fits
function frameCam() {
  const c = L.cam || CAM0, a = camera.aspect, refA = 1.45;
  let d = c.d, el = c.el;
  if (a < refA) { const f = refA / a; d *= Math.pow(f, .8); el = Math.min(72, el + 22 * Math.min(1, (f - 1) / 1.5)); }
  const e = el * Math.PI / 180, z = c.az * Math.PI / 180;
  controls.target.set(...c.t);
  camera.position.set(c.t[0] + d * Math.cos(e) * Math.sin(z), c.t[1] + d * Math.sin(e), c.t[2] + d * Math.cos(e) * Math.cos(z));
  controls.maxDistance = Math.max(330, d * 1.4);
  controls.update();
}
// keep the model centred in the space the clipboard and the trays leave free
function resize() {
  const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h;
  const hud = $('board').getBoundingClientRect(), lv = $('levels').getBoundingClientRect(), side = w > 900 || (w > h && h <= 520);
  const shiftX = side ? Math.round((hud.right - (lv.width && w > 900 ? w - lv.left : 0)) / 2) : 0;
  const shiftY = !side ? Math.round((hud.bottom - (h - $('speed').getBoundingClientRect().top)) / 2) : 0;
  camera.setViewOffset(w, h, -shiftX, -shiftY, w, h);
  camera.updateProjectionMatrix();
  if (L) frameCam();
}
addEventListener('resize', resize);
new ResizeObserver(() => resize()).observe($('board'));

// ================= the signature moment: the studio lights go golden and the model turns =================
let glow = 0, spin = 0;
function celebrate(n) { glow = 1; spin = n >= 2 ? 1 : .5; FX.shake(.2); }

// ================= main loop =================
// Fixed timestep: 120 sim steps per second at 1×, independent of display refresh. Steps per frame are capped
// adaptively by measured step cost, so a slow device runs the sim slower instead of dropping frames.
const STEP_RATE = 120, FRAME_BUDGET_MS = MOBILE ? 7 : 9;
let last = performance.now(), acc = 0, stepCost = 1.5, frameN = 0, geomDirty = true, raf = 0;
const warm = new THREE.Color('#ffb35c'), cool = new THREE.Color('#fff1dc');
function loop(now) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(.1, (now - last) / 1000); last = now; frameN++;
  if (!over && sculpt(dt)) geomDirty = true;
  let n = 0;
  if (speed > 0 && !over) {
    acc += dt * STEP_RATE * speed;
    const maxSteps = Math.max(1, Math.floor(FRAME_BUDGET_MS / stepCost));
    n = Math.min(Math.floor(acc), maxSteps); acc -= n; if (acc > maxSteps) acc = 0; // drop backlog rather than spiral
    if (n) { const t0 = performance.now(); for (let i = 0; i < n && !over; i++) step(); stepCost += ((performance.now() - t0) / n - stepCost) * .1; geomDirty = true; }
    if (frameN % 15 === 0) { measure(); renderScore(); }
  }
  const storm = speed > 0 && !over && stormNow() > 0;
  updateRain(dt, 0, -N / 2 + N * L.stormY / 2, Math.max(40, N * L.stormY * .6), storm);
  if (simSteps !== drawnSteps) geomDirty = true;
  if (geomDirty && (n <= 6 || frameN % 2 === 0)) { updateGeometry(); geomDirty = false; drawnSteps = simSteps; }
  updateRing();
  // the celebration: warm light that fades, and a slow turn of the model
  if (glow > 0) { glow = Math.max(0, glow - dt * .12); sun.color.copy(cool).lerp(warm, Math.min(1, glow * 1.5)); }
  if (spin > 0) { spin = Math.max(0, spin - dt * .1); controls.autoRotate = spin > 0; controls.autoRotateSpeed = 3 * spin; } else controls.autoRotate = false;
  const [sx, sy] = FX.shakeOffset(1.2);
  controls.update(); camera.position.x += sx * .2; camera.position.y += sy * .2;
  renderer.render(scene, camera);
  camera.position.x -= sx * .2; camera.position.y -= sy * .2;
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } });

buildLevel(Math.min(SAVE.cur ?? 0, SC.length - 1));
resize();
raf = requestAnimationFrame(loop);
if (!SAVE.intro) { SAVE.intro = 1; persist(); }
const tv = new THREE.Vector3();
// ================= debug / test handle =================
window.__ws = { SC, LV: SC, buildLevel: i => buildLevel(i), stat: () => stat, measure: () => measure(), step, B, D, N, SEA, B0, ROCK, RAISED, NOSCULPT, USE, get springs() { return springs; },
  setSpeed: s => setSpeed(s), get speed() { return speed; }, cleanSave, K, get SED() { return SED; }, brush, get simT() { return simT; }, get year() { return year; }, get over() { return over; },
  parts: { flux: () => flux(DT, G * DT, N - 1), waterStep: () => waterStep(DT, N - 1), thermal: () => { thermalTick = 2; thermal(); }, advect: () => advect(DT) },
  get budget() { return budget; }, setTool, get brushR() { return brushR; }, doUndo, get undoN() { return undo.length; }, reservoirVolume, deltaLand, capacity, get towns() { return towns; },
  toScreen: (gx, gy) => { const k = Math.round(gy) * N + Math.round(gx); tv.set(gx - N / 2, B[k] * VS, gy - N / 2).project(camera); return [(tv.x + 1) / 2 * innerWidth, (1 - tv.y) / 2 * innerHeight]; },
  // a stroke exactly as the UI does it (the real sculpt()/paint() at 60 fps), moving at v cells/s along pts
  stroke: (t, pts, v = 25) => { setTool(t); pushUndo(); brush.active = true; const dt = 1 / 60;
    for (let i = 0; i < pts.length - 1; i++) { const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], n = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / v / dt)); for (let f = 0; f <= n; f++) { brush.x = x0 + (x1 - x0) * f / n; brush.y = y0 + (y1 - y0) * f / n; sculpt(dt); } }
    if (pts.length === 1) { brush.x = pts[0][0]; brush.y = pts[0][1]; sculpt(dt); }
    brush.active = false; return budget[t]; },
  // run whole years headless (what the game loop does, without drawing)
  runYears: n => { for (let i = 0; i < n * YEAR_STEPS && !over; i++) step(); return measure(); },
  get stepCost() { return stepCost; } };

</script>
