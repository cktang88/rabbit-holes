<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Watershed</title>
<meta name="description" content="Lift, soften and harden the ground, let three million years of rain carve it, and make rivers steal each other's headwaters until the water drains where the survey asks.">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  /* Powell's survey of the Plateau Province, 1875: an engraved, hand-tinted plate on rag paper,
     a field notebook beside it, and a cigar box of geological agents. */
  :root{--paper:#efe5cb;--paper2:#e4d6b3;--ink:#3b2a1a;--ink2:#6b5640;--water:#2f5d7c;--red:#9c2f1f;--ochre:#b5802f;--memo:#f6efdb}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#d9cba6;color:var(--ink);font-family:"IM Fell English",Georgia,serif;-webkit-tap-highlight-color:transparent}
  button{font-family:"IM Fell English SC","IM Fell English",Georgia,serif;cursor:pointer;color:var(--ink)}
  button:focus-visible{outline:3px solid var(--water);outline-offset:2px}
  #app{position:fixed;inset:0;display:grid;grid-template-columns:330px 1fr;grid-template-rows:1fr auto;grid-template-areas:"memo map" "memo tray"}
  #memo{grid-area:memo;position:relative;z-index:2;margin:14px 0 14px 14px;padding:14px 16px;overflow:auto;
    background:radial-gradient(130% 90% at 20% 0%,rgba(255,255,255,.5),transparent 60%),repeating-linear-gradient(0deg,transparent 0 25px,rgba(47,93,124,.1) 25px 26px),var(--memo);
    border:1px solid #c9b88f;box-shadow:inset 18px 0 18px -16px rgba(80,50,20,.35),3px 10px 22px -12px rgba(50,30,10,.6)}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .home{color:var(--ink2);font-size:14px;text-decoration:none}
  .plateNo{font:15px "IM Fell English SC";letter-spacing:.12em;color:var(--red)}
  h1{margin:6px 0 2px;font:400 30px/1 "IM Fell English SC";letter-spacing:.02em}
  #story{font-size:16px;line-height:1.35;margin:6px 0 8px}
  #goal{font-size:16px;line-height:1.3;padding:6px 9px;border:1.5px solid var(--ink);background:rgba(255,255,255,.35)}
  #goal b{color:var(--red);font-weight:400}
  #goal.met{border-color:var(--water);background:rgba(47,93,124,.12)}
  #clock{margin-top:9px}
  #clock .bar{height:10px;border:1.5px solid var(--ink);position:relative;background:repeating-linear-gradient(90deg,transparent 0 9.5%,rgba(59,42,26,.35) 9.5% 10%)}
  #clock .bar div{position:absolute;left:0;top:0;bottom:0;background:var(--ochre)}
  #clock .bar i{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--water)}
  #clock .lbl{display:flex;justify-content:space-between;font-size:14px;color:var(--ink2);margin-top:2px}
  #score{margin-top:8px;font-size:15px;line-height:1.35}
  #score b{font-weight:400;color:var(--red)}
  #notes{margin-top:8px;font-size:14px;line-height:1.3;color:var(--ink2)}
  .mbtn{border:1.5px solid var(--ink);background:var(--memo);font-size:15px;padding:3px 10px;min-height:32px}
  #more{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
  #mapWrap{grid-area:map;position:relative;overflow:hidden;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #mapWrap{background:#d8c7a2}
  #labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2}
  .tag{position:absolute;left:0;top:0;white-space:nowrap;font:15px "IM Fell English",Georgia,serif;color:#2a1d10;text-shadow:0 0 3px #f6efdb,0 0 3px #f6efdb,0 0 6px #f6efdb;will-change:transform}
  .tag.sea{font:15px "IM Fell English SC",Georgia,serif;letter-spacing:.08em;color:#173a52}
  .tag.sea.tgt{color:#9c2f1f}.tag.sea b{font-weight:400;color:#9c2f1f}
  .tag.town{font-size:16px;padding:1px 7px 2px;background:rgba(246,239,219,.86);border:1px solid #3b2a1a;text-shadow:none}
  .tag.town i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0;background:#9c2f1f}
  .tag.town i.ok{background:#2f5d7c}
  .tag[class*=ag-],.tag.feat{font-size:13px;font-style:italic;color:#3b2a1a}
  #engr{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font:20px "IM Fell English";color:#3b2a1a;background:rgba(216,199,162,.6);z-index:3}
  #engr.on{display:flex}
  #slip{position:absolute;left:50%;top:14px;transform:translateX(-50%) rotate(-.5deg);width:min(390px,calc(100% - 24px));display:none;padding:12px 16px;z-index:4;
    background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(47,93,124,.1) 23px 24px),#fbf6e6;border:1px solid #c9b88f;box-shadow:2px 14px 26px -12px rgba(50,30,10,.65)}
  #slip.on{display:block}
  #slip h2{margin:0;font:400 24px/1.1 "IM Fell English SC"}
  #slip p{margin:6px 0 0;font-size:16px;line-height:1.35}
  #slip .note{margin-top:8px;padding:6px 9px;border:1.5px dashed var(--red);font-size:15px}
  #slip .note b{font:400 16px "IM Fell English SC";color:var(--red);display:block}
  #slip .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
  .go{border:2px solid var(--ink);background:var(--ink);color:var(--memo);font-size:18px;padding:5px 14px;min-height:40px}
  .go.ghost{background:var(--memo);color:var(--ink)}
  #seal{position:absolute;left:20px;bottom:20px;width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;font:15px/1 "IM Fell English SC";color:#f6e7d2;
    background:radial-gradient(circle at 35% 30%,#c0473a,#8d2318 60%,#6e170f);box-shadow:0 3px 6px rgba(0,0,0,.4),inset 0 -4px 8px rgba(0,0,0,.3);opacity:0;transform:scale(2.4) rotate(-20deg);pointer-events:none;z-index:3}
  #seal.on{animation:seal .5s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes seal{to{opacity:.95;transform:scale(1) rotate(-12deg)}}
  #tray{grid-area:tray;position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0 14px 14px;min-height:76px;
    background:linear-gradient(#7b5232,#5a3a22);border:1px solid #2e1c0f;box-shadow:0 8px 18px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15)}
  #hand{display:flex;gap:8px;flex:1;min-width:0}
  .ag{position:relative;flex:0 1 112px;min-width:0;min-height:56px;border:1.5px solid #2e1c0f;background:linear-gradient(#f6efdb,#e2d3ae);box-shadow:0 3px 0 #2e1c0f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 6px;touch-action:none;user-select:none;-webkit-user-select:none}
  .ag canvas{width:34px;height:24px}
  .ag span{font:14px/1 "IM Fell English SC";white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ag i{position:absolute;top:-7px;right:-7px;font:13px/20px Georgia;font-style:normal;min-width:20px;height:20px;text-align:center;background:var(--ink);color:#fff;border-radius:10px}
  .ag.armed{background:linear-gradient(#ffe3b5,#e9b56b);border-color:var(--red)}
  .ag.dead{opacity:.45}
  .ag.pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 3px 0 #2e1c0f,0 0 0 5px rgba(233,181,107,.7)}}
  #side{display:flex;gap:6px;align-items:center}
  #runBtn{border:2px solid #2e1c0f;background:linear-gradient(#ffe3b5,#e9b56b);font-size:19px;padding:6px 14px;min-height:46px;box-shadow:0 3px 0 #2e1c0f}
  #resetBtn{border:1.5px solid #2e1c0f;background:#e8dcbd;font-size:15px;padding:4px 9px;min-height:40px}
  #ghost{position:fixed;z-index:20;pointer-events:none;display:none;transform:translate(-50%,-90%)}
  #ghost.on{display:block}
  .modal-bg{position:fixed;inset:0;background:rgba(40,25,10,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:12px}
  .modal{width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto;padding:16px 18px;background:var(--memo);border:1px solid #a98f5d;box-shadow:2px 14px 30px -12px rgba(0,0,0,.6);font-size:16px;line-height:1.35}
  .modal h2{margin:0 0 8px;font:400 24px "IM Fell English SC"}
  .modal .pl{display:flex;justify-content:space-between;gap:8px;align-items:center;width:100%;text-align:left;border:1px solid #c9b88f;border-left:5px solid #c9b88f;background:#fbf6e6;padding:6px 10px;margin:0 0 5px;font:16px "IM Fell English";min-height:40px}
  .modal .pl.done{border-left-color:var(--water)}
  .modal .pl.lock{opacity:.45}
  .modal .pl small{color:var(--ink2);font-size:14px}
  .modal .card{border:1px solid #c9b88f;border-left:5px solid var(--red);padding:6px 10px;margin:0 0 5px;background:#fbf6e6}
  .modal .card.unk{border-left-color:#c9b88f;opacity:.7;border-style:dashed}
  .modal .card b{font:400 17px "IM Fell English SC"}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
  .modal .row button{border:2px solid var(--ink);background:var(--memo);font-size:16px;padding:4px 12px;min-height:38px}
  .modal .row button.primary{background:var(--ink);color:var(--memo)}
  .modal pre{white-space:pre-wrap;background:#fbf6e6;padding:8px;border:1px solid #c9b88f;font:14px/1.3 ui-monospace,monospace}
  .toast-wrap{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:var(--ink);color:var(--memo);padding:7px 14px;font:16px "IM Fell English";box-shadow:0 6px 14px -6px rgba(0,0,0,.5);max-width:90vw;text-align:center}
  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"memo" "map" "tray"}
    #memo{margin:6px 6px 0;padding:8px 11px;max-height:40vh}
    h1{font-size:22px;margin:2px 0}
    #story{font-size:14px;margin:3px 0 5px}
    #goal{font-size:14px;padding:4px 7px}
    #clock{margin-top:5px}#score,#notes{font-size:13px;margin-top:4px}
    #more{margin-top:5px}
    #tray{margin:0 6px 6px;padding:7px 8px;gap:7px;min-height:70px}
    .ag{min-height:52px;flex-basis:84px}.ag span{font-size:13px}
    #runBtn{font-size:16px;padding:5px 10px}
    .toast-wrap{bottom:96px}
    body.running #story{display:none}
  }
  @media (max-height:520px){
    #app{grid-template-columns:270px 1fr;grid-template-rows:1fr auto;grid-template-areas:"memo map" "memo tray"}
    #memo{margin:6px 0 6px 6px;max-height:none}
    #tray{min-height:58px;padding:5px 8px;margin:0 6px 6px}
    .ag{min-height:44px}.ag canvas{height:18px}
  }
</style>
</head>
<body>
<div id="app">
  <section id="memo">
    <div class="hrow"><a class="home" href="../index.html">← Rabbit Holes</a><span class="plateNo" id="plateNo"></span></div>
    <h1 id="title">Watershed</h1>
    <div id="story"></div>
    <div id="goal"></div>
    <div id="clock"><div class="bar" id="clockBar"><div id="clockFill"></div></div><div class="lbl"><span id="clockT">0 years</span><span id="clockEnd"></span></div></div>
    <div id="score"></div>
    <div id="notes"></div>
    <div id="more"><button class="mbtn" id="platesBtn">Plates</button><button class="mbtn" id="notesBtn">Field notes</button><button class="mbtn" id="shareBtn">Share</button></div>
  </section>
  <div id="mapWrap" data-play>
    <canvas id="cv" aria-label="Survey plate: drag geological agents onto the land"></canvas>
    <div id="slip" role="status"></div>
    <div id="seal"></div><div id="engr">The survey is moulding the relief…</div>
  </div>
  <div id="tray">
    <div id="hand"></div>
    <div id="side"><button id="resetBtn" title="Back to the start, agents kept">↺</button><button id="runBtn">Let it rain ▸</button></div>
  </div>
</div>
<div id="ghost"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
// ENGINE START
// Watershed engine: a landscape that erodes by the stream-power law (Braun & Willett's implicit scheme),
// with uplift, hillslope creep, lakes that fill, and seas as base level. Pure logic, deterministic.
const WS = (() => {
  'use strict';
  const W = 54, H = 36, N = W * H;
  const M = .5, DT = 1, D = .012; let KF = .04; const UB = .018; let FALL = 2;          // area exponent, step (10 kyr), creep
  const SQ2 = Math.SQRT2;
  const DX = [1, -1, 0, 0, 1, 1, -1, -1], DY = [0, 0, 1, -1, 1, -1, 1, -1], DL = [1, 1, 1, 1, SQ2, SQ2, SQ2, SQ2];
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) { let a = typeof seed === 'string' ? hash(seed) : seed >>> 0;
    const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    f.int = n => Math.floor(f() * n); return f; }
  // smooth value noise
  function noise(seed) { const R = rng(seed), G = 17, v = new Float64Array(G * G); for (let i = 0; i < v.length; i++) v[i] = R();
    const s = t => t * t * (3 - 2 * t);
    return (x, y) => { x = ((x % 16) + 16) % 16; y = ((y % 16) + 16) % 16; const x0 = x | 0, y0 = y | 0, fx = s(x - x0), fy = s(y - y0), a = v[y0 * G + x0], b = v[y0 * G + x0 + 1], c = v[(y0 + 1) * G + x0], d = v[(y0 + 1) * G + x0 + 1]; return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy; }; }
  function fbm(n, x, y, o = 4) { let s = 0, a = 1, f = 1, t = 0; for (let i = 0; i < o; i++) { s += a * n(x * f, y * f); t += a; a *= .5; f *= 2; } return s / t; }

  // ---------- heap for priority flood ----------
  function Heap(n) { const k = new Float64Array(n + 1), v = new Int32Array(n + 1); let len = 0;
    return { push(key, val) { let i = ++len; while (i > 1 && k[i >> 1] > key) { k[i] = k[i >> 1]; v[i] = v[i >> 1]; i >>= 1; } k[i] = key; v[i] = val; },
      pop() { const out = v[1], lk = k[len], lv = v[len--]; let i = 1; for (;;) { let c = i * 2; if (c > len) break; if (c < len && k[c + 1] < k[c]) c++; if (k[c] >= lk) break; k[i] = k[c]; v[i] = v[c]; i = c; } k[i] = lk; v[i] = lv; return out; },
      get size() { return len; }, clear() { len = 0; } }; }

  // ---------- a world ----------
  // sea[i] = outlet id + 1 for sea cells (fixed at base level), 0 for land
  function makeWorld(o) {
    const w = { z: new Float64Array(N), K: new Float64Array(N).fill(1), U: new Float64Array(N), sea: new Uint8Array(N), base: [], names: [], t: 0,
      zf: new Float64Array(N), rcv: new Int32Array(N), ord: new Int32Array(N), A: new Float64Array(N), lab: new Uint8Array(N), heap: Heap(N), seen: new Uint8Array(N), z0: null, Amax: new Float64Array(N) };
    return Object.assign(w, o || {});
  }
  const idx = (x, y) => y * W + x;
  function route(w) {
    const { z, zf, rcv, ord, A, lab, sea, heap, seen } = w; heap.clear(); seen.fill(0); let n = 0;
    for (let i = 0; i < N; i++) if (sea[i]) { zf[i] = w.base[sea[i] - 1]; heap.push(zf[i], i); seen[i] = 1; rcv[i] = i; }
    while (heap.size) { const i = heap.pop(); ord[n++] = i; const x = i % W, y = (i / W) | 0;
      for (let d = 0; d < 8; d++) { const nx = x + DX[d], ny = y + DY[d]; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const j = ny * W + nx; if (seen[j]) continue; seen[j] = 1;
        zf[j] = Math.max(z[j], zf[i] + 1e-4 * DL[d]); heap.push(zf[j], j); } }
    w.nOrd = n;
    // receivers: steepest descent on the filled surface
    for (let q = 0; q < n; q++) { const i = ord[q]; if (sea[i]) continue; const x = i % W, y = (i / W) | 0; let best = -1, bs = 0;
      for (let d = 0; d < 8; d++) { const nx = x + DX[d], ny = y + DY[d]; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const j = ny * W + nx; const s = (zf[i] - zf[j]) / DL[d]; if (s > bs) { bs = s; best = j; } }
      rcv[i] = best < 0 ? i : best; }
    for (let i = 0; i < N; i++) A[i] = w.rain ? w.rain[i] : 1;
    for (let q = n - 1; q >= 0; q--) { const i = ord[q]; if (rcv[i] !== i) A[rcv[i]] += A[i]; }
    for (let q = 0; q < n; q++) { const i = ord[q]; lab[i] = sea[i] ? sea[i] : lab[rcv[i]]; }
  }
  function step(w) {
    const { z, K, U, sea, rcv, ord, A, zf } = w;
    for (let i = 0; i < N; i++) if (!sea[i]) z[i] += U[i] * DT;
    route(w);
    for (let q = 0; q < w.nOrd; q++) { const i = ord[q]; if (sea[i]) { z[i] = w.base[sea[i] - 1]; continue; } const r = rcv[i];
      if (zf[i] > z[i] + 1e-6) { z[i] += Math.min(zf[i] - z[i], .1 + .005 * A[i]); continue; } // lakes fill with sediment
      if (z[i] <= z[r]) continue;
      const dx = Math.abs((i % W) - (r % W)) + Math.abs(((i / W) | 0) - ((r / W) | 0)) > 1 ? SQ2 : 1;
      const F = K[i] * KF * DT * Math.sqrt(A[i]) / dx;
      z[i] = (z[i] + F * z[r]) / (1 + F); }
    // creep
    const nz = w._nz || (w._nz = new Float64Array(N));
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const i = y * W + x; if (sea[i]) { nz[i] = z[i]; continue; }
      let s = 0, c = 0; if (x > 0) { s += z[i - 1]; c++; } if (x < W - 1) { s += z[i + 1]; c++; } if (y > 0) { s += z[i - W]; c++; } if (y < H - 1) { s += z[i + W]; c++; }
      nz[i] = z[i] + D * DT * (s - c * z[i]); }
    z.set(nz);
    for (let i = 0; i < N; i++) if (A[i] > w.Amax[i]) w.Amax[i] = A[i];
    w.t++;
  }

  // ================= the survey: plates, agents, goals =================
  // a sea is a stretch of the map edge: side W/E/N/S, from..to as fractions
  function edgeCells(side, a, b) { const out = []; const L = side === 'W' || side === 'E' ? H : W;
    for (let k = Math.round(a * (L - 1)); k <= Math.round(b * (L - 1)); k++) out.push(side === 'W' ? idx(0, k) : side === 'E' ? idx(W - 1, k) : side === 'N' ? idx(k, 0) : idx(k, H - 1)); return out; }
  function genWorld(P) {
    const w = makeWorld(); const nz = noise('ws:' + P.seed);
    P.seas.forEach((s, si) => { for (const i of edgeCells(s.side, s.a, s.b)) w.sea[i] = si + 1; w.base.push(0); });
    const dist = P.seas.map((s, si) => { const d = new Float64Array(N).fill(1e9), Q = []; for (let i = 0; i < N; i++) if (w.sea[i] === si + 1) { d[i] = 0; Q.push(i); }
      for (let q = 0; q < Q.length; q++) { const i = Q[q], x = i % W, y = (i / W) | 0; for (let k = 0; k < 4; k++) { const nx = x + DX[k], ny = y + DY[k]; if (nx < 0 || ny < 0 || nx >= W || ny >= H) continue; const j = ny * W + nx; if (d[j] > d[i] + 1) { d[j] = d[i] + 1; Q.push(j); } } } return d; });
    for (let i = 0; i < N; i++) if (!w.sea[i]) { const x = i % W, y = (i / W) | 0; let m = 1e9; P.seas.forEach((s, si) => { m = Math.min(m, dist[si][i] * (s.g || .25)); }); const e = Math.min(x, y, W - 1 - x, H - 1 - y), rim = Math.max(0, 1 - e / 9);
      w.z[i] = m + 4 * fbm(nz, x / 5, y / 5) + 5 * rim * rim; w.U[i] = UB * (1 + 1.2 * rim * rim); }
    for (let s = 0; s < (P.pre || 400); s++) step(w);
    // imposed geology for the plate: rock bands and rising ground
    for (const f of P.feats || []) for (let i = 0; i < N; i++) { const x = i % W, y = (i / W) | 0, a = featAmt(f, x, y); if (a <= 0) continue;
      if (f.t === 'shale') w.K[i] *= 1 + 3 * a; if (f.t === 'hard') w.K[i] *= 1 - .8 * a; if (f.t === 'rise') w.U[i] += (f.v || .09) * a; }
