<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>First Contact</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  /* First Contact: a radio observatory at 3 a.m. Fanfold green-bar printout, amber CRT, a corkboard lexicon. */
  :root{--sig:#ffb000;--ink:#22281f;--paper:#f4f5ec;--bar:#d9ead2;--amber:#ffb000;--amber2:#ff8a00;--crt:#120b02;--cork:#a8784a;
    --bg:#05070a;--panel:#14120e;--panel2:#1f1b14;--line:#3a3326;--dim:#9c8c6c;--accent:#ffb000;--good:#2f7a3a;--bad:#b3261e;
    font-family:"Courier Prime","Courier New",monospace}
  html,body{background:var(--bg)}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#e9dcc0;
    background:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent),radial-gradient(1px 1px at 72% 8%,#fffa 50%,transparent),radial-gradient(1.5px 1.5px at 40% 60%,#fff6 50%,transparent),radial-gradient(1px 1px at 88% 44%,#fff7 50%,transparent),radial-gradient(1px 1px at 22% 82%,#fff5 50%,transparent),radial-gradient(ellipse at 50% 120%,#1b2a3a,#05070a 60%)}
  button{font-family:"VT323",monospace;font-size:19px;line-height:1;letter-spacing:.04em;background:linear-gradient(#3a3428,#24201a);color:#e8d9b4;border:1px solid #000;border-radius:3px;padding:5px 12px;box-shadow:inset 0 1px 0 #ffffff22,0 2px 0 #000;cursor:pointer;text-transform:uppercase}
  button:hover:not(:disabled){color:var(--amber);border-color:#000}
  button:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 1px 0 #ffffff22,0 1px 0 #000}
  button:disabled{opacity:.45}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.primary{background:radial-gradient(circle at 50% 35%,#e3473a,#9b1d14 70%);color:#fff2e0;border-color:#3a0a06;font-weight:400;text-shadow:0 0 6px #ff9a8a}
  input{font-family:"Courier Prime",monospace;background:transparent;color:var(--ink);border:0;border-bottom:1px dotted #8a8a7a;border-radius:0}
  /* console */
  .topbar{background:linear-gradient(#2b2a27,#171614);border-bottom:2px solid #000;box-shadow:inset 0 -1px 0 #ffffff14,0 3px 12px #000c;gap:10px}
  .topbar h1{font-family:"VT323",monospace;font-size:28px;font-weight:400;color:var(--amber);text-shadow:0 0 8px #ff9a0088;letter-spacing:.06em}
  .topbar .home,.topbar .rh-like{color:#b9a77f;font-family:"Courier Prime",monospace}
  #species{font-family:"VT323",monospace!important;font-size:20px!important;color:var(--amber)!important;background:var(--crt);padding:2px 8px;border:1px solid #000;box-shadow:inset 0 0 8px #000,0 0 6px #ff9a0033;text-shadow:0 0 6px #ff9a00aa}
  #chapters{display:flex;gap:5px}
  #chapters button{padding:3px 8px;font-size:18px;min-width:30px;background:radial-gradient(circle at 50% 40%,#4a4030,#221d15);color:#7d6c4c;border-radius:50%/40%}
  #chapters #ctBack{border-radius:4px;color:#e8d9b4;background:linear-gradient(#3a3428,#24201a);min-width:0;padding:3px 10px}
  #chapters button.done{color:#8fd08a;text-shadow:0 0 5px #6f6}
  #chapters button.cur{background:radial-gradient(circle at 50% 40%,#ffcf6a,#c97a00);color:#2a1600;box-shadow:0 0 10px #ffb000aa,inset 0 1px 0 #fff8}
  main{flex:1;display:flex;min-height:0}
  /* fanfold printout */
  #feed{flex:1;overflow:auto;padding:18px 20px 40px;min-width:0}
  .sheet{max-width:940px;margin:0 auto;padding:16px 58px 30px;color:var(--ink);position:relative;
    background:radial-gradient(circle at 16px 12px,#05070a 5px,#c9c9bb 5.5px,transparent 6.5px) 0 0/100% 24px repeat-y,radial-gradient(circle at calc(100% - 16px) 12px,#05070a 5px,#c9c9bb 5.5px,transparent 6.5px) 0 0/100% 24px repeat-y,
      linear-gradient(90deg,var(--paper) 0 32px,transparent 32px calc(100% - 32px),var(--paper) 0),
      repeating-linear-gradient(var(--paper) 0 48px,var(--bar) 48px 96px);
    box-shadow:0 10px 40px #000,inset 33px 0 0 -32px #9a9a8a,inset -33px 0 0 -32px #9a9a8a}
  .sheet::before,.sheet::after{content:"";position:absolute;left:32px;right:32px;height:0;border-top:1px dashed #8a8a7a88}
  .sheet::before{top:0}.sheet::after{bottom:0}
  .chapterHead{display:flex;align-items:baseline;gap:12px;margin:6px 0 6px;flex-wrap:wrap;justify-content:space-between}
  .chapterHead h2{margin:0;font-size:30px;font-weight:400;color:#1d3a1f;font-family:"VT323",monospace;letter-spacing:.05em}
  .chapterHead .stamp{font-family:"VT323",monospace;font-size:18px;color:#6a6a5a}
  .intro{font-size:15px;color:#41463c;margin:0 0 14px}
  .tx{display:flex;gap:16px;align-items:center;padding:8px 0;border-bottom:1px dotted #8a9a8044}
  .tx.printing{animation:print .32s steps(7,end) both;animation-delay:calc(var(--i)*120ms)}
  @keyframes print{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  .tx .pic,.qpic{flex:0 0 auto;width:170px;height:110px;background:var(--crt);border-radius:10px/14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:3px solid #2c2820;box-shadow:inset 0 0 18px #000,0 1px 0 #fff8}
  .tx .pic svg,.qpic svg{width:100%;height:100%;filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 2px #ff9a00)}
  .tx .pic::after,.qpic::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 2px,#0006 2px 3px),radial-gradient(ellipse,transparent 60%,#0008);pointer-events:none}
  .qpic{margin-bottom:8px}
  .tx .num{font-family:"VT323",monospace;color:#6a7a64;font-size:18px;width:30px}
  .sentence{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
  .g{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:2px;padding:2px;min-width:36px}
  .g:hover{background:#ffd76a55}
  .g svg{width:40px;height:40px}
  .g svg path.dbase,.nbRow svg path.dbase{stroke-dasharray:none;stroke-width:3.2;stroke-linecap:butt;stroke:#8a2a10}
  .g svg path,.g svg circle{stroke:var(--ink);stroke-dasharray:0 3.1;stroke-linecap:round;stroke-width:2.8}
  .g .gl{font-family:"Courier Prime",monospace;font-size:10px;color:#2a4fa0;max-width:68px;text-align:center;line-height:1.1;min-height:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}
  .g.kn .gl{color:#1d5a24;font-style:normal;font-weight:700}
  .g.flash{animation:flash .5s ease-out}
  @keyframes flash{0%{background:#ffb000;box-shadow:0 0 12px #ffb000}100%{background:transparent}}
  .g.hl{background:#ffd76a88;outline:1px solid #a07000}
  #chapters button{position:relative}
  #chapters .cs{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font-size:9px;font-style:normal;color:var(--amber);letter-spacing:-1px;white-space:nowrap}
  .sheet.decoded .chapterHead h2::after{content:" DECODED";color:var(--bad);border:2px solid var(--bad);padding:0 6px;margin-left:8px;font-size:22px;display:inline-block;transform:rotate(-4deg);animation:stampIn .4s ease-out both .2s}
  @keyframes stampIn{from{transform:scale(2.4) rotate(-12deg);opacity:0}}
  /* reply form */
  .qs{margin-top:22px;border-top:2px dashed #7a8a74;padding-top:12px}
  .qs h3{font-family:"VT323",monospace;font-weight:400;font-size:26px;margin:0 0 10px;color:#1d3a1f}
  .q{background:#fffbea;border:1px solid #b9b49a;padding:12px 14px;margin-bottom:12px;box-shadow:2px 3px 0 #0002}
  .chart{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0}
  .chart button{display:flex;flex-direction:column;align-items:center;min-width:44px;min-height:44px;padding:2px 4px;font-size:17px;background:linear-gradient(#fffbe9,#efe4bf);color:var(--ink);text-transform:none;box-shadow:0 2px 0 #b9a56a}
  .chart button span{display:flex}
  .chart svg{width:16px;height:16px}
  .chart svg path,.chart svg circle{stroke:var(--ink);stroke-dasharray:0 3.1;stroke-linecap:round;stroke-width:2.8}
  .chart svg path.dbase{stroke-dasharray:none;stroke:#8a2a10}
  .chartNote{margin:0 0 6px;color:#5a5a4a}
  .q.opt{border-style:dashed;background:#fdf7e2}
  .q.done{background:#eef6e6;border-color:#8ab087}
  .q .prompt{margin-bottom:10px;line-height:1.5;color:var(--ink)}
  .compose{min-height:48px;padding:4px 10px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;
    background:radial-gradient(circle,#05070a99 2px,transparent 2.5px) 0 50%/12px 12px repeat-x,linear-gradient(#f3e6b8,#e9d79d);border-top:1px solid #b9a56a;border-bottom:1px solid #b9a56a}
  .compose .g{background:#f8eecb}
  .hintTxt{font-size:12px;color:#7d7050;font-style:italic;background:#f3e6b8;padding:0 6px}
  .ctl{margin-top:8px}
  .palette{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;max-height:168px;overflow:auto;padding:8px;background:linear-gradient(#3b3830,#25231e);border-radius:6px;box-shadow:inset 0 2px 6px #000}
  .palette .key{min-width:0;padding:2px;background:linear-gradient(#efe9d8,#cfc6ad);border:1px solid #1a1814;border-radius:4px;box-shadow:0 3px 0 #6e6754,0 4px 0 #000;text-transform:none}
  .palette .key:active{transform:translateY(2px);box-shadow:0 1px 0 #6e6754}
  .palette .key svg{width:34px;height:34px}
  .fb{margin-top:8px;font-size:14px;font-family:"Courier Prime",monospace}
  .fb.bad{color:var(--bad)} .fb.good{color:var(--good);font-family:"VT323",monospace;font-size:20px}
  .next{text-align:center;margin:22px 0 6px}
  .next button{font-size:24px;padding:10px 20px}
  /* corkboard lexicon */
  #nb{width:340px;display:flex;flex-direction:column;min-height:0;border-left:6px solid #5a3e22;
    background:radial-gradient(#6b4a2a 1px,transparent 1.5px) 0 0/7px 7px,radial-gradient(#d0a070 1px,transparent 1.5px) 3px 4px/9px 9px,linear-gradient(#b8875a,#9c6c42)}
  #nb > div:not(#nbTools):not(#nbList){background:#fffdf0;margin:12px 12px 4px;padding:10px 12px!important;color:var(--ink);box-shadow:2px 3px 6px #0006;transform:rotate(-.8deg);font-size:13px}
  #nb > div:not(#nbTools):not(#nbList) b{font-family:"VT323",monospace;font-size:22px;font-weight:400}
  #nb .dim{color:#5a5a4a!important}
  #nbList{flex:1;overflow:auto;padding:8px 14px 20px}
  .nbRow{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;margin:7px 0;position:relative;color:var(--ink);transform:rotate(var(--r,0deg));
    background:linear-gradient(#fffef6 0 0) 0 0/100% 8px no-repeat,repeating-linear-gradient(#fffef6 0 17px,#9ec3e6 17px 18px),#fffef6;border-top:2px solid #e0606088;box-shadow:1px 2px 4px #0006}
  .nbRow::before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#b3261e);box-shadow:0 2px 2px #0007}
  .nbRow.kn{background:linear-gradient(#f2fbe9 0 0),#f2fbe9;border-top-color:#2f7a3a}
  .nbRow svg{width:30px;height:30px;flex:0 0 auto;cursor:pointer}
  .nbRow svg path,.nbRow svg circle{stroke:var(--ink);stroke-dasharray:0 3.1;stroke-linecap:round;stroke-width:2.8}
  .nbRow input{flex:1;min-width:0;font-size:14px;font-family:"Courier Prime",monospace;color:#2a4fa0;font-style:italic}
  .nbRow .conf{width:30px;padding:2px;font-size:18px;background:none;border:0;box-shadow:none;color:#555;font-family:"Courier Prime",monospace}
  .nbRow.hl{box-shadow:0 0 0 3px var(--amber),1px 2px 4px #0006}
  .nbRow .seti{font-size:11px;color:#a05a00}
  .nbRow .no{font-family:"VT323",monospace;font-size:16px;color:#fff;background:#b3261e;padding:0 5px;transform:rotate(3deg)}
  .nbRow.bad{border-top-color:#b3261e}
  .g.bad .gl{color:#b3261e;text-decoration:line-through}
  .nbRow .ok{font-family:"VT323",monospace;font-size:16px;color:#fff;background:#2f7a3a;padding:0 5px;transform:rotate(-3deg)}
  .static{display:none}
  /* goal bar and coach */
  .goal{position:sticky;top:0;z-index:4;max-width:940px;margin:0 auto 10px;padding:8px 12px;background:var(--crt);color:#ffd37a;border:2px solid #2c2820;border-radius:6px;font-family:"Courier Prime",monospace;font-size:15px;line-height:1.45;box-shadow:0 0 14px #ff9a0033,0 4px 12px #000a}
  .goal b{color:#fff1c8} .goal .dim{color:#b99a5a!important;font-size:13px}
  .goal .gl0{font-family:"VT323",monospace;font-size:18px;color:var(--crt);background:var(--amber);padding:0 6px;margin-right:4px;border-radius:2px}
  .goal .prog{display:inline-block;margin-left:6px;color:#8fd08a}
  .goal button{margin-top:8px}
  .goal .jump{margin:4px 0 0 6px;padding:3px 10px;font-size:17px;vertical-align:middle}
  .strip{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .strip .mini{background:var(--paper);color:var(--ink);padding:6px;border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:4px;width:128px}
  .strip .pic{width:116px;height:75px;background:var(--crt);border-radius:6px;overflow:hidden}
  .strip .pic svg{width:100%;height:100%;filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.15)}
  .strip i{font-size:11px;color:#41463c;text-align:center}
  .tx.coach,.q.coach{outline:3px solid var(--amber);outline-offset:3px;border-radius:6px;animation:pulse 1.6s ease-in-out infinite}
  .nbRow.coach{box-shadow:0 0 0 3px var(--amber),1px 2px 4px #0006}
  @keyframes pulse{50%{outline-color:#ffb00055}}
  @media (prefers-reduced-motion:reduce){.tx.coach,.q.coach{animation:none}}
  @media (max-width:760px),(max-height:500px){.toast{font-size:16px;padding:6px 10px}.goal{font-size:13px;padding:6px 8px;line-height:1.35}.goal .dim{display:none}.goal .gl0{font-size:15px}.strip .mini{width:84px}.strip .pic{width:76px;height:50px}}
  .modal .lede{font-size:18px;font-weight:700}
  .modal .annot{display:flex;align-items:center;gap:10px;background:#fffdf0;padding:10px;border:1px dashed #8a9a80;margin:8px 0}
  .modal .annot .pic{width:150px;height:97px;background:var(--crt);border-radius:8px;overflow:hidden;flex:0 0 auto}
  .modal .annot .pic svg{width:100%;height:100%;filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.15)}
  .modal .annot .arr{font-size:12px;text-align:center;color:#8a2a10;line-height:1.2}
  .modal .annot .arr span{font-size:20px}
  /* shared toast and modal as CRT and printout */
  .toast{font-family:"VT323",monospace;font-size:20px;background:var(--crt);color:var(--amber);border:2px solid #2c2820;border-radius:6px;text-shadow:0 0 6px #ff9a00;box-shadow:0 0 18px #ff9a0033,0 6px 20px #000}
  .modal-bg{background:#000c}
  .modal{background:repeating-linear-gradient(var(--paper) 0 48px,var(--bar) 48px 96px);color:var(--ink);border:0;border-radius:0;box-shadow:0 20px 60px #000;font-family:"Courier Prime",monospace}
  .modal .modal-actions{background:#f4f5ec!important}
  .modal h2{font-family:"VT323",monospace;font-weight:400;font-size:34px;color:#1d3a1f}
  .modal .dim{color:#555}
  #lexBtn,#nbTools,#scrim{display:none}
  /* phones: the printout fills the screen; the lexicon corkboard slides in from the right */
  @media (max-width:760px),(max-height:500px){
    body{height:100vh;height:100dvh;overflow:hidden}
    .topbar{flex-wrap:wrap;padding:4px 8px;gap:6px}
    .topbar h1{font-size:22px}
    #species,#glossBtn,#newBtn{display:none}
    #lexBtn{display:inline-block}
    #chapters{order:5;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;gap:4px}
    #chapters button{min-width:36px;min-height:34px;flex:0 0 auto}
    main{flex-direction:column}
    #feed{padding:8px 4px 30px;overflow:auto;flex:1;min-height:0}
    .sheet{padding:14px 30px 24px}
    #nb{display:none;position:fixed;right:0;top:0;bottom:0;width:min(360px,88vw);z-index:60;border-left:6px solid #5a3e22;box-shadow:-10px 0 30px #000}
    body.lex #nb{display:flex}
    body.lex #scrim{display:block;position:fixed;inset:0;background:#000a;z-index:55}
    #nbTools{display:flex;gap:6px;padding:10px 12px 0}
    #nbTools button{flex:1;min-height:38px}
    .tx{flex-wrap:wrap}
    .tx .pic{width:100%;max-width:200px;height:auto;aspect-ratio:17/11}
    .ctl button{min-height:40px;min-width:48px}
    .palette .key svg{width:32px;height:32px}
    .palette{max-height:190px}
  }
  @media (max-height:500px) and (min-width:600px){
    .topbar{flex-wrap:nowrap;gap:5px}
    .topbar .home,.topbar .rh-like{font-size:12px;white-space:nowrap}
    #chapters{order:0;flex:0 1 auto;gap:3px}
    #chapters button{min-width:31px;padding:2px 4px}
    .topbar button{padding:4px 8px;font-size:17px}
    .topbar h1{font-size:17px;white-space:nowrap}
    .chapterHead h2{font-size:24px}
  }
  @media (pointer:coarse){.palette .key{min-width:44px;min-height:44px}#chapters button{min-height:40px}}

  /* open channel */
  .ex{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;padding:6px 8px;margin:6px 0;background:#fffdf3;border-left:3px solid #b9a56a}
  .ex .who{font-family:"VT323",monospace;font-size:17px;color:#6a6a5a}.ex .who.them{color:#8a2a10}
  .ex .yr{grid-column:2;font-size:11px;color:#8a8a7a;text-align:right}
  .ex.fresh{animation:flash .6s ease-out}
  .dossier{display:grid;gap:6px}
  .dos{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#fffbea;border:1px solid #b9b49a;padding:8px 10px;color:var(--ink)}
  .dos .dq{flex:1 1 200px}.dos input{width:70px;font-size:18px;border-bottom:2px solid #8a8a7a;text-align:center}
  .dos.ok{background:#eef6e6;border-color:#8ab087}.dos .dv{font-family:"VT323",monospace;font-size:24px;color:var(--good)}
  .dos.no{border-color:var(--bad)}
  .score .big{font-size:34px;color:#a07000;letter-spacing:4px}.score{color:var(--ink)}
  .codex{display:flex;flex-wrap:wrap;gap:5px}.codex span{padding:3px 7px;border:1px dashed #8a8a7a;font-size:13px;color:#8a8a7a}.codex span.on{border-style:solid;color:var(--ink);background:#fffbea}
  @media (max-width:760px),(max-height:500px){.dos input{font-size:16px;min-height:38px}.dos button{min-height:38px}.ex{grid-template-columns:1fr}.ex .yr{grid-column:1}}
</style>

<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>FIRST CONTACT</h1><div id="chapters"></div><span class="spacer"></span><span class="dim small" id="species"></span><button id="glossBtn">Gloss: on</button><button id="hintBtn">SETI hint</button><button id="newBtn">New signal</button><button id="ctBtn" hidden>Open channel</button><button id="lexBtn" aria-label="Open the lexicon">Lexicon</button></div>
<main>
  <div id="feed" data-play></div>
  <div id="scrim"></div>
  <div id="nb">
    <div id="nbTools"><button id="nbClose" aria-label="Close the lexicon">Close</button><button id="nbGloss">Gloss</button><button id="nbNew">New signal</button></div>
    <div style="padding:12px 12px 6px"><b>LEXICON</b><div class="dim small">Click any glyph to see every place it appears. Pencil your guess on its card; your notes print under the glyphs. When they acknowledge a reply, the symbols you used are confirmed in green.<br>Confidence: ? guess · ~ likely · ✓ sure</div></div>
    <div id="nbList"></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
// ===================== Sound: teletype, keys, radio =====================
const SFX = {
  key: () => FX.tone({ f: 1900 + Math.random()*300, f2: 700, type: 'square', dur: .025, vol: .05 }),
  tick: () => { FX.tone({ noise: 1, f: 3500, q: 4, dur: .018, vol: .06 }); },
  send: () => [0, .09, .18].forEach((d, i) => FX.tone({ f: 1200 + i * 200, type: 'sine', dur: .07, vol: .08, delay: d })),
  static: () => { FX.tone({ noise: 1, f: 1600, q: .3, dur: .45, vol: .09 }); FX.tone({ f: 180, f2: 120, type: 'sawtooth', dur: .3, vol: .04 }); },
  chord: () => [523, 659, 784, 1047].forEach((f, i) => FX.tone({ f, type: 'triangle', dur: .9, vol: .06, delay: i * .06 })),
};
// one message at a time: a new one replaces the last instead of stacking over the printout
const say = (m, ms) => { document.querySelectorAll('.toast').forEach(t => t.remove()); RH.toast(m, ms); };
const sfx = n => { try { if (typeof FX !== 'undefined') SFX[n](); } catch (e) {} };

let S = null;

// old or corrupted saves: keep what is well-formed, default the rest
function cleanSave(raw){
  const d = fresh(); d.decoded = 0; if (!raw || typeof raw!=='object' || Array.isArray(raw)) return d;
  const obj = v => v && typeof v==='object' && !Array.isArray(v);
  if (Number.isInteger(raw.seed)) d.seed = raw.seed;
  for (const k of ['notes','conf','seti','solved','hints','known','bad','miss','evid']) if (obj(raw[k])) d[k] = raw[k];
  if (Number.isInteger(raw.tut) && raw.tut>=0) d.tut = raw.tut;
  for (const k of Object.keys(d.notes)) if (typeof d.notes[k]!=='string') delete d.notes[k];

  if (Number.isInteger(raw.decoded) && raw.decoded>0) d.decoded = raw.decoded;

// ===================== Language generation =====================
let LANG;
function buildLanguage(seed, first){
  const r = RH.rng(seed);
  let base = r.pick([3,4,5,6,7,8,9,12]);
  if (first) base = [8,10,12][RH.hashStr('base'+seed)%3]; // a newcomer's first signal: a big base, like our own
  const hand = {3:[1,3],4:[2,2],5:[1,5],6:[2,3],7:[1,7],8:[4,2],9:[3,3],10:[2,5],12:[4,3]}[base];
  const lang = {
    base, arms: hand[0], fingers: hand[1],
    littleEndian: r() < 0.35 && !first,
    order: r.pick(['SVO','SOV','VSO','VOS','OSV']),
    numAfter: r() < 0.6,
    tenseFinal: r() < 0.6,
    eyes: r.pick([1,3,4,5]),
    legs: r.pick([3,4,6]),
    planets: 5 + r.int(5), home: 0, moons: 2 + r.int(3), oldHome: 0,
    name: '', glyph: {},
  };
  // more grammar, from its own stream so the glyph shapes above stay stable for a seed
  const r2 = RH.rng(seed+':grammar');
  lang.plural = r2.pick(['marker','redup','none']);  // a plural word, the noun said twice, or no plural at all
  lang.neg = r2.pick(['before','after','final']);     // NOT before the verb, after it, or at the end of the clause
  lang.qPos = r2.pick(['initial','final']);           // the question marker opens or closes the sentence
  lang.module = r2() < .5 ? 'matter' : 'shapes';       // transmission 3: chemistry or geometry
  lang.home = 3 + r.int(lang.planets-3);              // they live now on this planet
  lang.oldHome = Math.max(1, lang.home - 1 - r.int(2)); // and used to live here
  const syl=['ka','zu','th','vor','ee','ix','qa','lun','sh','oro','ny','ae','tk','mi','rr'];
  lang.name = (r.pick(syl)+r.pick(syl)+r.pick(syl)).replace(/^./,c=>c.toUpperCase());
  // concepts
  const words = ['PLUS','MINUS','TIMES','EQUALS','YES','NO','IS','H','HE','C','N','O','WATER','AND','STAR','PLANET','MOON','HAVE','LIVE','WE','YOU','PL',
    'HEAD','EYE','ARM','FINGER','LEG','PAST','NOT','BIG','SMALL','HOT','COLD','GO','SEE','SEND','SIGNAL','Q','HOWMANY','SHAPE','SIDE'];
  const used = new Set();
  const mk = (isDigit)=>{
    for (let tries=0; tries<500; tries++){
      const pts=[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]];
      const segs=[]; const n = isDigit? 1+r.int(3) : 2+r.int(3);
      for (let k=0;k<n;k++){ const a=r.int(9); let b=r.int(9); if (a===b) continue; const s=[a,b].sort().join('-'); if(!segs.includes(s)) segs.push(s); }
      const dot = !isDigit && r()<0.3 ? r.int(9) : -1;
      const key = (isDigit?'D':'W')+segs.sort().join(',')+'|'+dot;
      if (segs.length===0 || used.has(key)) continue;
      used.add(key); return {segs:segs.map(s=>s.split('-').map(Number).map(i=>pts[i])), dot: dot>=0?pts[dot]:null, digit:isDigit};
    }
  };
  for (let d=0; d<base; d++) lang.glyph['D'+d] = mk(true);
  for (const w of words) lang.glyph[w] = mk(false);
  return lang;
}
function glyphSVG(id){
  const g = LANG.glyph[id]; const P=([x,y])=>[7+x*10, 6+y*10];
  let d=''; for (const [a,b] of g.segs){ const [x1,y1]=P(a),[x2,y2]=P(b); d+=`M${x1} ${y1}L${x2} ${y2}`; }
  const base = g.digit ? '<path class="dbase" d="M3 31.5L31 31.5"/>' : '';
  let c = g.dot? `<circle cx="${P(g.dot)[0]}" cy="${P(g.dot)[1]}" r="3" fill="none" stroke-width="2"/>` : '';
  return `<svg viewBox="0 0 34 34"><path d="${d}" fill="none" stroke-width="2.4" stroke-linecap="round"/>${base}${c}</svg>`;
}

// ===================== Grammar =====================
function num(n){ const b=LANG.base; const ds=[]; do { ds.unshift('D'+(n%b)); n=Math.floor(n/b); } while(n>0); return LANG.littleEndian? ds.reverse() : ds; }
function np(noun, n){ // noun phrase with optional number
  if (n===undefined) return [noun];
  const pl = (typeof n==='number' && n>1) ? ({marker:['PL'], redup:[noun], none:[]})[LANG.plural||'marker'] : [];
  const numW = n==='?' ? ['HOWMANY'] : num(n);
  return LANG.numAfter ? [noun, ...pl, ...numW] : [...numW, noun, ...pl];
}
const ord = (noun, n) => LANG.numAfter ? [noun, ...num(n)] : [...num(n), noun]; // "planet 3": a name, never plural
function clause({s, v, o, neg, past, q}){ // s, o are arrays (phrases)
  const ng = LANG.neg||'before', vp = neg && ng==='before'? ['NOT', v] : neg && ng==='after'? [v, 'NOT'] : [v];
  o = o||[]; let w;
  switch (LANG.order){ case 'SVO': w=[...s,...vp,...o]; break; case 'SOV': w=[...s,...o,...vp]; break; case 'VOS': w=[...vp,...o,...s]; break; case 'OSV': w=[...o,...s,...vp]; break; default: w=[...vp,...s,...o]; }
  if (neg && ng==='final') w = [...w, 'NOT'];
  if (past) w = LANG.tenseFinal? [...w,'PAST'] : ['PAST',...w];
  if (q) w = LANG.qPos==='final'? [...w, 'Q'] : ['Q', ...w];
  return w;
}

    for (let i=0;i<u;i++) s+=`<circle cx="${(x0+(i%gc)*sp+sp*.05).toFixed(1)}" cy="${(y0+Math.floor(i/gc)*sp+sp*.05).toFixed(1)}" r="${(sp*0.3).toFixed(1)}" fill="#e8e6df"/>`; });

// ===================== Chapters =====================
function buildChapters(){

    tx.splice(0,0,T(picDots(0), num(0)));

    const pickNew = (lo, hi, not) => { const c=[]; for (let n=lo;n<=hi;n++) if (!shown.has(n) && n!==not) c.push(n); return c[r.int(c.length)]; };
    const v1 = pickNew(b+4, b*3) ?? pickNew(b*2+2, b*4), v2 = pickNew(b*2+2, b*3, v1) ?? pickNew(b*3+1, b*5, v1); // on the counting chart (up to 3 bundles)
    C.push({title:'COUNTING', intro:'The first transmission repeats every 41 minutes. Each frame is a picture followed by symbols.', tx, qs:[
      {type:'compose', prompt:`Reply with the number of dots.`, pic:picDots(v1), ans:num(v1), n:v1},
      {type:'compose', prompt:`And this one.`, pic:picDots(v2), ans:num(v2), n:v2},
      {type:'compose', prompt:'Transmit the smallest number that needs <i>two</i> of their symbols.', ans:num(b)},
    ]}); }
  // 2 Arithmetic: one idea at a time, every early sum drawn as dots so it can be checked by counting
  { const tx=[]; const eq=(a,op,c,d,ok)=>[...num(a),op,...num(c),'EQUALS',...num(d), ok?'YES':'NO'];

    tx.push(T(picSum(2,2), eq(2,'PLUS',2,5,0)));                                                       // a wrong one: the picture shows 4
    tx.push(T(picSum(b-1,1), eq(b-1,'PLUS',1,b,1)), T(picSum(b-1,2), eq(b-1,'PLUS',2,b+1,1)));       // carrying into a second symbol

  L.eyes = 1+r.int(big?11:5); L.legs = 2+r.int(big?13:6);
  L.planets = 5+r.int(big?9:5); L.home = 2+r.int(L.planets-1); L.oldHome = Math.max(1, L.home-1);
  L.moonsOf = Array.from({length:L.planets+1},(_,k)=>k? r.int(big?14:6) : 0); L.moons = L.moonsOf[L.home];
  L.dist = 4+r.int(60);
  const avail = CT_ORDER.slice(0, Math.min(8, 2+d)), n = d<2?2 : d<4?3 : d<7?4 : 5, pool=[...avail], items=[];
  while (items.length<n && pool.length) items.push(pool.splice(r.int(pool.length),1)[0]);
  items.sort((a,b)=>CT_ORDER.indexOf(a)-CT_ORDER.indexOf(b));
  const val = {eyes:L.eyes, legs:L.legs, arms:L.arms, planets:L.planets, home:L.home, moons:L.moons, ftot:L.base, fpa:L.fingers};
  return withLang(L, ()=>{
    const T=(pic,words)=>({pic,words}), b=L.base, tx=[];
    for (let k=0;k<=b+2;k++) tx.push(T(picDots(k), num(k)));
    tx.push(T(picDots(2*b+1), num(2*b+1)));
    tx.push(T(picSignal(), clause({s:['WE'], v:'SEND', o:['SIGNAL']})));
    const need = new Set(items.map(i=>({eyes:'EYE',legs:'LEG',arms:'ARM',ftot:'FINGER',fpa:'FINGER'})[i]).filter(Boolean));
    if (items.includes('fpa')) need.add('ARM');
    const H = d<=2 ? 'FINGER' : r.pick(['EYE','ARM','LEG','FINGER'].filter(w=>w!=='FINGER'||need.has('FINGER')||r()<.5));
    const human = w => w==='FINGER'?10 : w==='HEAD'?1 : 2;
    const stm = ['HEAD', ...['EYE','ARM','LEG','FINGER'].filter(w=>w!==H && (need.has(w) || d<=2 && w!=='FINGER'))];
    if (stm.length<3) stm.push(['EYE','ARM','LEG'].find(w=>w!==H && !stm.includes(w)));
    for (const w of stm) tx.push(T(picHuman(w), clause({s:['YOU'], v:'HAVE', o:np(w, human(w))})));
    if (items.includes('fpa')) tx.push(T(picHuman('FINGER'), clause({s:['ARM'], v:'HAVE', o:np('FINGER',5)})));
    if (items.includes('planets')) tx.push(T(picSystem(8,0,0,{earth:true}), clause({s:['STAR'], v:'HAVE', o:np('PLANET',8)})));
    if (items.includes('home') || items.includes('moons')) tx.push(T(picSystem(8,3,0,{earth:true}), clause({s:['YOU'], v:'LIVE', o:ord('PLANET',3)})));
    if (items.includes('moons')) tx.push(T(picSystem(8,3,1,{earth:true}), clause({s:ord('PLANET',3), v:'HAVE', o:np('MOON',1)})));
    const hs = {pic:picHuman(H), noun:H, words:clause({s:['YOU'], v:'HAVE', o:np(H,'?'), q:1}), ans:clause({s:['WE'], v:'HAVE', o:np(H, human(H))})};
    const par = 1 + items.reduce((s,i)=> s + (i==='ftot'?0 : i==='fpa'? (items.includes('arms')?0:1) : i==='moons'? (items.includes('home')?1:2) : 1), 0);
    return {seed, d, L, items, val, tx, hs, par, name:L.name};
  });
}
// every sentence they can understand, built from their grammar: key = the glyph string, value = what it means
function ctIndex(L){
  return withLang(L, ()=>{ const M=new Map(), add=(f,ws)=>{ const k=ws.join(' '); if (!M.has(k)) M.set(k,f); };
    const subs=[['YOU',['YOU']],['WE',['WE']],['ARM',['ARM']],['STAR',['STAR']]]; for (let k=0;k<=14;k++) subs.push(['P'+k, ord('PLANET',k)]);
    const ns=['?']; for (let n=0;n<=40;n++) ns.push(n);
    for (const q of [1,0]) for (const past of [0,1]) for (const neg of [0,1]) for (const [sk,s] of subs){
      for (const noun of ['HEAD','EYE','ARM','FINGER','LEG','PLANET','MOON']) for (const n of ns) add({s:sk,v:'HAVE',noun,n,neg,past,q}, clause({s, v:'HAVE', o:np(noun,n), neg, past, q}));
      for (const n of ns.slice(0,16)) add({s:sk,v:'LIVE',n,neg,past,q}, clause({s, v:'LIVE', o:n==='?'? np('PLANET','?') : ord('PLANET',n), neg, past, q}));
    }
    return M; });
}
// their reply to what you sent: a true answer, YES/NO, or a lone question mark when they cannot parse it or do not know
function ctReply(C, ws){
  const f = C.idx.get(ws.join(' ')), W=C.L; if (!f) return {kind:'huh', words:['Q']};
  let val, subj;
  if (f.v==='HAVE'){
    if (f.s==='YOU'){ val={HEAD:1,EYE:W.eyes,ARM:W.arms,LEG:W.legs,FINGER:W.base}[f.noun]; subj=['WE']; }
    else if (f.s==='ARM' && f.noun==='FINGER'){ val=W.fingers; subj=['ARM']; }
    else if (f.s==='STAR' && f.noun==='PLANET'){ val=W.planets; subj=['STAR']; }
    else if (f.s[0]==='P' && f.noun==='MOON'){ const k=+f.s.slice(1); if (k>=1 && k<=W.planets){ val=W.moonsOf[k]; subj=withLang(W,()=>ord('PLANET',k)); } }
  } else if (f.v==='LIVE' && f.s==='YOU'){ val = f.past? W.oldHome : W.home; subj=['WE']; }
  if (val==null) return {kind:'huh', words:['Q'], f};
  if (f.n==='?') return {kind:'answer', f, val, words:withLang(W,()=>clause({s:subj, v:f.v, o:f.v==='LIVE'? ord('PLANET',val) : np(f.noun,val), past:f.past}))};
  const truth = (val===f.n) !== !!f.neg; return {kind:truth?'yes':'no', f, val, words:[truth?'YES':'NO']};
}
// the right question for a dossier item (for the SETI draft hint and the test bots)
function ctQuestion(C, item){
  const W=C.L, f={eyes:['YOU','HAVE','EYE'], legs:['YOU','HAVE','LEG'], arms:['YOU','HAVE','ARM'], ftot:['YOU','HAVE','FINGER'], fpa:['ARM','HAVE','FINGER'], planets:['STAR','HAVE','PLANET'], home:['YOU','LIVE'], moons:['P','HAVE','MOON']}[item];
  return withLang(W, ()=>{ const s = f[0]==='P'? ord('PLANET',W.home) : [f[0]];
    return clause({s, v:f[1], o: f[1]==='LIVE'? np('PLANET','?') : np(f[2],'?'), q:1}); });
}
function ctSeen(){
  const set=[]; const addAll=ws=>{ for (const w of ws) if (!set.includes(w)) set.push(w); };
  for (const t of CT.tx) addAll(t.words); addAll(CT.hs.words); if (S.hs) addAll(CT.hs.ans);
  for (const e of S.log) addAll(e.r);
  const isD = w=>/^D\d+$/.test(w);
  return [...set.filter(isD).sort((a,b)=>a.slice(1)-b.slice(1)), ...set.filter(w=>!isD(w))];
}
const ctSaveNow = () => { RH.save('fcx', X); if (CAMP) RH.save('fc', CAMP); };
function ctEnter(seed, dd){
  if (MODE==='camp') CAMP=S;
  const d = dd || ctLevel(seed);
  if (!X.cur || X.cur.seed!==seed) X.cur = {seed, d, notes:{}, conf:{}, seti:{}, known:{}, bad:{}, gloss:true, log:[], hs:0, hsT:0, dos:{}, t:0, hints:0, done:0};
  CT = genContact(seed, X.cur.d); CT.idx = ctIndex(CT.L);
  MODE='ct'; S=X.cur; LANG=CT.L; seen=ctSeen(); printed=-1; for (const o of [drafts]) for (const k in o) delete o[k];
  try { history.replaceState(null,'','#contact='+seed+(seed[0]==='r'?':'+X.cur.d:'')); } catch(e){}

}
function ctLeave(){ if (MODE!=='ct') return; MODE='camp'; S=CAMP; CAMP=null; CT=null; document.body.classList.remove('ctMode'); try { history.replaceState(null,'',location.pathname); } catch(e){} printed=-1; boot(); }
const ctStars = () => S.t<=CT.par ? 3 : S.t<=CT.par+2 ? 2 : 1;
const CODEX_F = L => ({['base '+L.base]:1, ['order '+L.order]:1, [L.littleEndian?'smallest digit first':'biggest digit first']:1, [({marker:'plural word',redup:'plural by saying it twice',none:'no plural'})[L.plural]]:1, [L.numAfter?'number after noun':'number before noun']:1, [L.qPos==='final'?'question mark last':'question mark first']:1});

function ctFinish(){
  if (S.done) return; S.done=1; const st=ctStars();
  const prev = X.best[S.seed]; if (prev==null || S.t<prev) X.best[S.seed]=S.t;
  const keys=Object.keys(X.best); if (keys.length>60) delete X.best[keys.find(k=>k!==S.seed)];
  if (S.seed==='L'+X.n) X.n++;
  const fresh = Object.keys(CODEX_F(CT.L)).filter(k=>!X.codex[k]); fresh.forEach(k=>X.codex[k]=1);
  ctSaveNow(); sfx('chord'); render();
  setTimeout(()=>say(`DOSSIER COMPLETE. ${S.t} round trips (par ${CT.par}) ${'★'.repeat(st)}${'☆'.repeat(3-st)}${fresh.length?` · First found by you: ${fresh.join(', ')}`:''}`, 6000), 300);
}
// one transmission on the open channel: costs a round trip, logs their reply, confirms the symbols of anything they understood
function ctSend(ws){
  if (!S.hs || S.done || !ws.length) return null;
  const rep = ctReply(CT, ws); S.t++; S.log.push({s:[...ws], r:rep.words});
  if (rep.kind!=='huh') confirmWords(ws);
  ctSaveNow(); return rep;
}
function ctHandshake(ws){
  if (S.hs || !ws.length) return {ok:!!S.hs};
  S.t++; S.hsT++; const a=CT.hs.ans;
  if (a.length===ws.length && a.every((w,j)=>w===ws[j])){ S.hs=1; confirmWords(a); ctSaveNow(); return {ok:true}; }
  ctSaveNow(); return {ok:false, right:a.filter((w,j)=>w===ws[j]).length};
}
function ctFile(item, v){
  if (!S.hs || S.done || S.dos[item]===CT.val[item] || !CT.items.includes(item)) return null;
  if (v===CT.val[item]){ S.dos[item]=v; ctSaveNow(); if (CT.items.every(i=>S.dos[i]===CT.val[i])) ctFinish(); return true; }
  S.t++; ctSaveNow(); return false;
}
function ctHint(){
  if (!S.hs) return say(`SETI: the last frame is their question about you. It is shaped like the frames before it, with two new symbols: one where the number goes, one extra. To them "you" are the humans, so answer the way they talk about themselves in frame ${pad3(CT.tx.length-1)}.`, 9000);
  const open = CT.items.find(i=>S.dos[i]!==CT.val[i]); if (!open) return;
  const q = open;
  S.hints++; S.t++; drafts.ct = ctQuestion(CT, q); ctSaveNow(); render();
  say(`SETI drafted a question for you (costs a round trip). Transmit it and read their answer.`, 5000);
}
function ctMenu(){
  const lv=X.n, today=ctToday(), b=X.best[today], cur=X.cur&&!X.cur.done?X.cur:null;

  return RH.modal(`<h2>OPEN CHANNEL</h2><p>Each contact is a new species. They teach you their numbers and say a little about you; then <b>you ask the questions</b>, in their grammar, and fill in a dossier about them.</p>
    <p>Every transmission is a round trip at the speed of light: the fewer you need, the better. A garbled question gets back a lone question mark.</p>
    <p class="dim">Ladder contact ${lv} introduces: ${CT_RUNG(ctLevel('L'+lv)).join(', ')}. Today's signal is the same for everyone.</p>`, [{label:'Close', value:0}, ...btn])
    .then(v=>{ if (v==='resume') ctEnter(cur.seed); else if (v==='daily') ctEnter(today); else if (v==='ladder') ctEnter('L'+lv); else if (v==='rand') ctEnter('r'+(1+Math.floor(Math.random()*1e8))); else if (v==='codex') ctCodex(); });
}
function ctCodex(){
  const n=CODEX_ALL.filter(k=>X.codex[k]).length;
  return RH.modal(`<h2>CODEX</h2><p>Grammars you have met, across every contact (${n} of ${CODEX_ALL.length}). The ladder brings in new ones.</p><div class="codex">${CODEX_ALL.map(k=>`<span class="${X.codex[k]?'on':''}">${X.codex[k]?k:'?'.repeat(Math.min(8,k.length))}</span>`).join('')}</div>`, [{label:'Close'}]);
}
function renderCT(){
  const C=CT; seen=ctSeen(); const fresh=printed!=='ct'; printed='ct';
  document.getElementById('chapters').innerHTML = `<button id="ctBack" aria-label="Back to the campaign">◂ Campaign</button>`;
  document.getElementById('ctBack').onclick=ctLeave; document.getElementById('ctBtn').hidden=false;
  document.getElementById('species').textContent = `CONTACT ${S.seed[0]==='d'?'DAILY '+S.seed.slice(1):S.seed[0]==='L'?'LADDER '+S.seed.slice(1):S.seed.toUpperCase()}`;
  const filed=C.items.filter(i=>S.dos[i]===C.val[i]).length, yrs=2*C.L.dist;

    : S.done ? `<b>Dossier complete:</b> ${S.t} round trips (par ${C.par}) ${'★'.repeat(ctStars())}${'☆'.repeat(3-ctStars())}. ${S.t*yrs} years of waiting, at the speed of light.`
    : `<b>Channel open.</b> Fill the dossier (${filed} of ${C.items.length}): ask them, in their grammar, shaped like their own question. A lone question mark back means they did not understand. <span class="prog">${S.t} round trips · par ${C.par}</span>`;

    S.log.forEach((e,k)=>{ h += `<div class="ex" data-ex="${k}"><div class="who">YOU ▸</div>${sentenceHTML(e.s)}<div class="who them">◂ THEY</div>${sentenceHTML(e.r)}<div class="yr">+${yrs} yrs</div></div>`; });
