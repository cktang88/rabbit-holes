<!DOCTYPE html>
<html lang="en">

<style>
  /* First Contact: a radio observatory at 3 a.m. Fanfold green-bar printout, amber CRT, a corkboard lexicon. */
  :root{--sig:#ffb000;--ink:#22281f;--paper:#f4f5ec;--bar:#d9ead2;--amber:#ffb000;--amber2:#ff8a00;--crt:#120b02;--cork:#a8784a;
    --bg:#05070a;--panel:#14120e;--panel2:#1f1b14;--line:#3a3326;--dim:#9c8c6c;--accent:#ffb000;--good:#2f7a3a;--bad:#b3261e;
    font-family:"Courier Prime","Courier New",monospace}
  html,body{background:var(--bg)}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#e9dcc0;
    background:radial-gradient(1px 1px at 12% 18%,#fff8 50%,transparent),radial-gradient(1px 1px at 72% 8%,#fffa 50%,transparent),radial-gradient(1.5px 1.5px at 40% 60%,#fff6 50%,transparent),radial-gradient(1px 1px at 88% 44%,#fff7 50%,transparent),radial-gradient(1px 1px at 22% 82%,#fff5 50%,transparent),radial-gradient(ellipse at 50% 120%,#1b2a3a,#05070a 60%)}
  button{font-family:"VT323",monospace;font-size:19px;line-height:1;letter-spacing:.04em;background:linear-gradient(#3a3428,#24201a);color:#e8d9b4;border:1px solid #000;border-radius:3px;padding:5px 12px;box-shadow:inset 0 1px 0 #ffffff22,0 2px 0 #000;cursor:pointer;text-transform:uppercase}
  button:hover:not(:disabled){color:var(--amber);border-color:#000}
  button:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 1px 0 #ffffff22,0 1px 0 #000}
  button:disabled{opacity:.45}
  button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
  button.primary{background:radial-gradient(circle at 50% 35%,#e3473a,#9b1d14 70%);color:#fff2e0;border-color:#3a0a06;font-weight:400;text-shadow:0 0 6px #ff9a8a}
  input{font-family:"Courier Prime",monospace;background:transparent;color:var(--ink);border:0;border-bottom:1px dotted #8a8a7a;border-radius:0}
  /* console */
  .topbar{background:linear-gradient(#2b2a27,#171614);border-bottom:2px solid #000;box-shadow:inset 0 -1px 0 #ffffff14,0 3px 12px #000c;gap:10px}
  .topbar h1{font-family:"VT323",monospace;font-size:28px;font-weight:400;color:var(--amber);text-shadow:0 0 8px #ff9a0088;letter-spacing:.06em}
  .topbar .home,.topbar .rh-like{color:#b9a77f;font-family:"Courier Prime",monospace}
  #species{font-family:"VT323",monospace!important;font-size:20px!important;color:var(--amber)!important;background:var(--crt);padding:2px 8px;border:1px solid #000;box-shadow:inset 0 0 8px #000,0 0 6px #ff9a0033;text-shadow:0 0 6px #ff9a00aa}
  #chapters{display:flex;gap:5px}
  #chapters button{padding:3px 8px;font-size:18px;min-width:30px;background:radial-gradient(circle at 50% 40%,#4a4030,#221d15);color:#7d6c4c;border-radius:50%/40%}
  #chapters button.done{color:#8fd08a;text-shadow:0 0 5px #6f6}
  #chapters button.cur{background:radial-gradient(circle at 50% 40%,#ffcf6a,#c97a00);color:#2a1600;box-shadow:0 0 10px #ffb000aa,inset 0 1px 0 #fff8}
  main{flex:1;display:flex;min-height:0}
  /* fanfold printout */
  #feed{flex:1;overflow:auto;padding:18px 20px 40px;min-width:0}
  .sheet{max-width:940px;margin:0 auto;padding:16px 58px 30px;color:var(--ink);position:relative;
    background:radial-gradient(circle at 16px 12px,#05070a 5px,#c9c9bb 5.5px,transparent 6.5px) 0 0/100% 24px repeat-y,radial-gradient(circle at calc(100% - 16px) 12px,#05070a 5px,#c9c9bb 5.5px,transparent 6.5px) 0 0/100% 24px repeat-y,
      linear-gradient(90deg,var(--paper) 0 32px,transparent 32px calc(100% - 32px),var(--paper) 0),
      repeating-linear-gradient(var(--paper) 0 48px,var(--bar) 48px 96px);
    box-shadow:0 10px 40px #000,inset 33px 0 0 -32px #9a9a8a,inset -33px 0 0 -32px #9a9a8a}
  .sheet::before,.sheet::after{content:"";position:absolute;left:32px;right:32px;height:0;border-top:1px dashed #8a8a7a88}
  .sheet::before{top:0}.sheet::after{bottom:0}
  .chapterHead{display:flex;align-items:baseline;gap:12px;margin:6px 0 6px;flex-wrap:wrap;justify-content:space-between}
  .chapterHead h2{margin:0;font-size:30px;font-weight:400;color:#1d3a1f;font-family:"VT323",monospace;letter-spacing:.05em}
  .chapterHead .stamp{font-family:"VT323",monospace;font-size:18px;color:#6a6a5a}
  .intro{font-size:15px;color:#41463c;margin:0 0 14px}
  .tx{display:flex;gap:16px;align-items:center;padding:8px 0;border-bottom:1px dotted #8a9a8044}
  .tx.printing{animation:print .32s steps(7,end) both;animation-delay:calc(var(--i)*120ms)}
  @keyframes print{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
  .tx .pic,.qpic{flex:0 0 auto;width:170px;height:110px;background:var(--crt);border-radius:10px/14px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;border:3px solid #2c2820;box-shadow:inset 0 0 18px #000,0 1px 0 #fff8}
  .tx .pic svg,.qpic svg{width:100%;height:100%;filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.15) drop-shadow(0 0 2px #ff9a00)}
  .tx .pic::after,.qpic::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(#0000 0 2px,#0006 2px 3px),radial-gradient(ellipse,transparent 60%,#0008);pointer-events:none}
  .qpic{margin-bottom:8px}
  .tx .num{font-family:"VT323",monospace;color:#6a7a64;font-size:18px;width:30px}
  .sentence{display:flex;flex-wrap:wrap;gap:4px;align-items:flex-start}
  .g{display:inline-flex;flex-direction:column;align-items:center;cursor:pointer;border-radius:2px;padding:2px;min-width:36px}
  .g:hover{background:#ffd76a55}
  .g svg{width:34px;height:34px}
  .g svg path,.g svg circle{stroke:var(--ink);stroke-dasharray:0 3.1;stroke-linecap:round;stroke-width:2.8}
  .g .gl{font-family:"Courier Prime",monospace;font-size:10px;color:#2a4fa0;max-width:68px;text-align:center;line-height:1.1;min-height:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:italic}

  .sheet.decoded .chapterHead h2::after{content:" DECODED";color:var(--bad);border:2px solid var(--bad);padding:0 6px;margin-left:8px;font-size:22px;display:inline-block;transform:rotate(-4deg);animation:stampIn .4s ease-out both .2s}
  @keyframes stampIn{from{transform:scale(2.4) rotate(-12deg);opacity:0}}
  /* reply form */

  .compose{min-height:48px;padding:4px 10px;display:flex;flex-wrap:wrap;gap:2px;align-items:center;
    background:radial-gradient(circle,#05070a99 2px,transparent 2.5px) 0 50%/12px 12px repeat-x,linear-gradient(#f3e6b8,#e9d79d);border-top:1px solid #b9a56a;border-bottom:1px solid #b9a56a}
  .compose .g{background:#f8eecb}
  .hintTxt{font-size:12px;color:#7d7050;font-style:italic;background:#f3e6b8;padding:0 6px}
  .ctl{margin-top:8px}

  .palette .key{min-width:0;padding:2px;background:linear-gradient(#efe9d8,#cfc6ad);border:1px solid #1a1814;border-radius:4px;box-shadow:0 3px 0 #6e6754,0 4px 0 #000;text-transform:none}
  .palette .key:active{transform:translateY(2px);box-shadow:0 1px 0 #6e6754}
  .palette .key svg{width:28px;height:28px}
  .fb{margin-top:8px;font-size:14px;font-family:"Courier Prime",monospace}
  .fb.bad{color:var(--bad)} .fb.good{color:var(--good);font-family:"VT323",monospace;font-size:20px}
  .next{text-align:center;margin:22px 0 6px}
  .next button{font-size:24px;padding:10px 20px}
  /* corkboard lexicon */
  #nb{width:340px;display:flex;flex-direction:column;min-height:0;border-left:6px solid #5a3e22;
    background:radial-gradient(#6b4a2a 1px,transparent 1.5px) 0 0/7px 7px,radial-gradient(#d0a070 1px,transparent 1.5px) 3px 4px/9px 9px,linear-gradient(#b8875a,#9c6c42)}
  #nb > div:not(#nbTools):not(#nbList){background:#fffdf0;margin:12px 12px 4px;padding:10px 12px!important;color:var(--ink);box-shadow:2px 3px 6px #0006;transform:rotate(-.8deg);font-size:13px}
  #nb > div:not(#nbTools):not(#nbList) b{font-family:"VT323",monospace;font-size:22px;font-weight:400}
  #nb .dim{color:#5a5a4a!important}
  #nbList{flex:1;overflow:auto;padding:8px 14px 20px}
  .nbRow{display:flex;align-items:center;gap:6px;padding:6px 8px 6px 10px;margin:7px 0;position:relative;color:var(--ink);transform:rotate(var(--r,0deg));
    background:linear-gradient(#fffef6 0 0) 0 0/100% 8px no-repeat,repeating-linear-gradient(#fffef6 0 17px,#9ec3e6 17px 18px),#fffef6;border-top:2px solid #e0606088;box-shadow:1px 2px 4px #0006}
  .nbRow::before{content:"";position:absolute;top:-6px;left:50%;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#b3261e);box-shadow:0 2px 2px #0007}
  .nbRow.kn{background:linear-gradient(#f2fbe9 0 0),#f2fbe9;border-top-color:#2f7a3a}
  .nbRow svg{width:30px;height:30px;flex:0 0 auto;cursor:pointer}
  .nbRow svg path,.nbRow svg circle{stroke:var(--ink);stroke-dasharray:0 3.1;stroke-linecap:round;stroke-width:2.8}
  .nbRow input{flex:1;min-width:0;font-size:14px;font-family:"Courier Prime",monospace;color:#2a4fa0;font-style:italic}
  .nbRow .conf{width:30px;padding:2px;font-size:18px;background:none;border:0;box-shadow:none;color:#555;font-family:"Courier Prime",monospace}
  .nbRow.hl{box-shadow:0 0 0 3px var(--amber),1px 2px 4px #0006}
  .nbRow .seti{font-size:11px;color:#a05a00}
  .nbRow .ok{font-family:"VT323",monospace;font-size:16px;color:#fff;background:#2f7a3a;padding:0 5px;transform:rotate(-3deg)}
  .static{display:none}
  /* shared toast and modal as CRT and printout */
  .toast{font-family:"VT323",monospace;font-size:20px;background:var(--crt);color:var(--amber);border:2px solid #2c2820;border-radius:6px;text-shadow:0 0 6px #ff9a00;box-shadow:0 0 18px #ff9a0033,0 6px 20px #000}
  .modal-bg{background:#000c}
  .modal{background:repeating-linear-gradient(var(--paper) 0 48px,var(--bar) 48px 96px);color:var(--ink);border:0;border-radius:0;box-shadow:0 20px 60px #000;font-family:"Courier Prime",monospace}
  .modal h2{font-family:"VT323",monospace;font-weight:400;font-size:34px;color:#1d3a1f}
  .modal .dim{color:#555}
  #lexBtn,#nbTools,#scrim{display:none}
  /* phones: the printout fills the screen; the lexicon corkboard slides in from the right */
  @media (max-width:760px),(max-height:500px){
    body{height:100vh;height:100dvh;overflow:hidden}
    .topbar{flex-wrap:wrap;padding:4px 8px;gap:6px}
    .topbar h1{font-size:22px}
    #species,#glossBtn,#newBtn{display:none}
    #lexBtn{display:inline-block}
    #chapters{order:5;flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;gap:4px}
    #chapters button{min-width:36px;min-height:34px;flex:0 0 auto}
    main{flex-direction:column}
    #feed{padding:8px 4px 30px;overflow:auto;flex:1;min-height:0}
    .sheet{padding:14px 30px 24px}
    #nb{display:none;position:fixed;right:0;top:0;bottom:0;width:min(360px,88vw);z-index:60;border-left:6px solid #5a3e22;box-shadow:-10px 0 30px #000}
    body.lex #nb{display:flex}
    body.lex #scrim{display:block;position:fixed;inset:0;background:#000a;z-index:55}
    #nbTools{display:flex;gap:6px;padding:10px 12px 0}
    #nbTools button{flex:1;min-height:38px}
    .tx{flex-wrap:wrap}
    .tx .pic{width:100%;max-width:200px;height:auto;aspect-ratio:17/11}
    .ctl button{min-height:40px;min-width:48px}
    .palette .key svg{width:32px;height:32px}
    .palette{max-height:190px}
  }
  @media (max-height:500px) and (min-width:600px){
    .topbar{flex-wrap:nowrap;gap:5px}
    .topbar .home,.topbar .rh-like{font-size:12px;white-space:nowrap}
    #chapters{order:0;flex:0 1 auto;gap:3px}
    #chapters button{min-width:31px;padding:2px 4px}
    .topbar button{padding:4px 8px;font-size:17px}
    .topbar h1{font-size:17px;white-space:nowrap}
    .chapterHead h2{font-size:24px}
  }
  @media (pointer:coarse){.palette .key{min-width:44px;min-height:44px}#chapters button{min-height:40px}}
</style>

<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>FIRST CONTACT</h1><div id="chapters"></div><span class="spacer"></span><span class="dim small" id="species"></span><button id="glossBtn">Gloss: on</button><button id="hintBtn">SETI hint</button><button id="newBtn">New signal</button><button id="lexBtn" aria-label="Open the lexicon">Lexicon</button></div>
<main>
  <div id="feed" data-play></div>
  <div id="scrim"></div>
  <div id="nb">
    <div id="nbTools"><button id="nbClose" aria-label="Close the lexicon">Close</button><button id="nbGloss">Gloss</button><button id="nbNew">New signal</button></div>
    <div style="padding:12px 12px 6px"><b>LEXICON</b><div class="dim small">Click any glyph to see every place it appears. Pencil your guess on its card; your notes print under the glyphs. When they acknowledge a reply, the symbols you used are confirmed in green.<br>Confidence: ? guess · ~ likely · ✓ sure</div></div>
    <div id="nbList"></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
// ===================== Sound: teletype, keys, radio =====================
const SFX = {
  key: () => FX.tone({ f: 1900 + Math.random()*300, f2: 700, type: 'square', dur: .025, vol: .05 }),
  tick: () => { FX.tone({ noise: 1, f: 3500, q: 4, dur: .018, vol: .06 }); },
  send: () => [0, .09, .18].forEach((d, i) => FX.tone({ f: 1200 + i * 200, type: 'sine', dur: .07, vol: .08, delay: d })),
  static: () => { FX.tone({ noise: 1, f: 1600, q: .3, dur: .45, vol: .09 }); FX.tone({ f: 180, f2: 120, type: 'sawtooth', dur: .3, vol: .04 }); },
  chord: () => [523, 659, 784, 1047].forEach((f, i) => FX.tone({ f, type: 'triangle', dur: .9, vol: .06, delay: i * .06 })),
};
const sfx = n => { try { if (typeof FX !== 'undefined') SFX[n](); } catch (e) {} };
// a teletype rattling out n lines of printout
function chatter(n){ try { if (typeof FX === 'undefined') return; for (let k=0;k<Math.min(n,14);k++) for (let j=0;j<5;j++) FX.tone({ noise: 1, f: 2600 + Math.random()*1800, q: 5, dur: .02, vol: .045, delay: k*.12 + j*.022 }); } catch (e) {} }

// ===================== Save / seed =====================
let S = null;
function fresh(){ return {seed: Math.floor(Math.random()*1e9), notes:{}, conf:{}, seti:{}, solved:{}, known:{}, chapter:0, hints:{}, gloss:true, decoded: (S&&S.decoded)||0}; }
// old or corrupted saves: keep what is well-formed, default the rest
function cleanSave(raw){
  const d = fresh(); d.decoded = 0; if (!raw || typeof raw!=='object' || Array.isArray(raw)) return d;
  const obj = v => v && typeof v==='object' && !Array.isArray(v);
  if (Number.isInteger(raw.seed)) d.seed = raw.seed;
  for (const k of ['notes','conf','seti','solved','hints','known']) if (obj(raw[k])) d[k] = raw[k];
  for (const k of Object.keys(d.notes)) if (typeof d.notes[k]!=='string') delete d.notes[k];
  if (Number.isInteger(raw.chapter) && raw.chapter>=0) d.chapter = raw.chapter;
  if (typeof raw.gloss==='boolean') d.gloss = raw.gloss;
  if (Number.isInteger(raw.decoded) && raw.decoded>0) d.decoded = raw.decoded;
  if (raw.intro) d.intro = 1; if (raw.ended) d.ended = 1;
  return d;
}
S = cleanSave(RH.load('fc', null));
const persist = ()=>{ RH.save('fc', S); RH.progress('first-contact', (S.decoded? 1 : Object.keys(S.solved).length / TOTALQ)); };
let TOTALQ = 1;

// ===================== Language generation =====================
let LANG;
function buildLanguage(seed){
  const r = RH.rng(seed);
  const base = r.pick([5,6,7,8,12]);
  const hand = {5:[1,5],6:[2,3],7:[1,7],8:[4,2],12:[4,3]}[base];
  const lang = {
    base, arms: hand[0], fingers: hand[1],
    littleEndian: r() < 0.35,
    order: r.pick(['SVO','SOV','VSO']),
    numAfter: r() < 0.6,
    tenseFinal: r() < 0.6,
    eyes: r.pick([1,3,4,5]),
    legs: r.pick([3,4,6]),
    planets: 5 + r.int(5), home: 0, moons: 2 + r.int(3), oldHome: 0,
    name: '', glyph: {},
  };
  lang.home = 3 + r.int(lang.planets-3);              // they live now on this planet
  lang.oldHome = Math.max(1, lang.home - 1 - r.int(2)); // and used to live here
  const syl=['ka','zu','th','vor','ee','ix','qa','lun','sh','oro','ny','ae','tk','mi','rr'];
  lang.name = (r.pick(syl)+r.pick(syl)+r.pick(syl)).replace(/^./,c=>c.toUpperCase());
  // concepts
  const words = ['PLUS','MINUS','TIMES','EQUALS','YES','NO','IS','H','HE','C','N','O','WATER','AND','STAR','PLANET','MOON','HAVE','LIVE','WE','YOU','PL',
    'HEAD','EYE','ARM','FINGER','LEG','PAST','NOT','BIG','SMALL','HOT','COLD','GO','SEE','SEND','SIGNAL','Q','HOWMANY'];
  const used = new Set();
  const mk = (isDigit)=>{
    for (let tries=0; tries<500; tries++){
      const pts=[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]];
      const segs=[]; const n = isDigit? 1+r.int(3) : 2+r.int(3);
      for (let k=0;k<n;k++){ const a=r.int(9); let b=r.int(9); if (a===b) continue; const s=[a,b].sort().join('-'); if(!segs.includes(s)) segs.push(s); }
      const dot = !isDigit && r()<0.3 ? r.int(9) : -1;
      const key = (isDigit?'D':'W')+segs.sort().join(',')+'|'+dot;
      if (segs.length===0 || used.has(key)) continue;
      used.add(key); return {segs:segs.map(s=>s.split('-').map(Number).map(i=>pts[i])), dot: dot>=0?pts[dot]:null, digit:isDigit};
    }
  };
  for (let d=0; d<base; d++) lang.glyph['D'+d] = mk(true);
  for (const w of words) lang.glyph[w] = mk(false);
  return lang;
}
function glyphSVG(id){
  const g = LANG.glyph[id]; const P=([x,y])=>[7+x*10, 6+y*10];
  let d=''; for (const [a,b] of g.segs){ const [x1,y1]=P(a),[x2,y2]=P(b); d+=`M${x1} ${y1}L${x2} ${y2}`; }
  if (g.digit) d += 'M4 31L30 31';
  let c = g.dot? `<circle cx="${P(g.dot)[0]}" cy="${P(g.dot)[1]}" r="3" fill="none" stroke-width="2"/>` : '';
  return `<svg viewBox="0 0 34 34"><path d="${d}" fill="none" stroke-width="2.4" stroke-linecap="round"/>${c}</svg>`;
}

// ===================== Grammar =====================
function num(n){ const b=LANG.base; const ds=[]; do { ds.unshift('D'+(n%b)); n=Math.floor(n/b); } while(n>0); return LANG.littleEndian? ds.reverse() : ds; }
function np(noun, n){ // noun phrase with optional number
  if (n===undefined) return [noun];
  const pl = (typeof n==='number' && n>1) ? ['PL'] : [];
  const numW = n==='?' ? ['HOWMANY'] : num(n);
  return LANG.numAfter ? [noun, ...pl, ...numW] : [...numW, noun, ...pl];
}
function clause({s, v, o, neg, past, q}){ // s, o are arrays (phrases)
  const vp = neg? ['NOT', v] : [v];
  let w;
  switch (LANG.order){ case 'SVO': w=[...s,...vp,...(o||[])]; break; case 'SOV': w=[...s,...(o||[]),...vp]; break; default: w=[...vp,...s,...(o||[])]; }
  if (past) w = LANG.tenseFinal? [...w,'PAST'] : ['PAST',...w];
  if (q) w = ['Q', ...w];
  return w;
}

// ===================== Pictures =====================
const svg = (inner, vb='0 0 170 110') => `<svg viewBox="${vb}">${inner}</svg>`;
function picDots(n, cols){ cols = cols || Math.min(10, Math.max(4, Math.ceil(Math.sqrt(n*1.6)))); let s=''; const rows=Math.ceil(n/cols);
  const sp=Math.min(14, 150/cols, 90/Math.max(rows,1)); const ox=85-(Math.min(n,cols)-1)*sp/2, oy=55-(rows-1)*sp/2;
  for (let i=0;i<n;i++) s+=`<circle cx="${ox+(i%cols)*sp}" cy="${oy+Math.floor(i/cols)*sp}" r="${sp*0.3}" fill="#e8e6df"/>`;
  if (n===0) s=`<rect x="55" y="25" width="60" height="60" fill="none" stroke="#333" stroke-dasharray="4 4"/>`;
  return svg(s); }
function picSum(a,b){ let s=''; const dot=(x,y)=>`<circle cx="${x}" cy="${y}" r="3.5" fill="#e8e6df"/>`;
  const grp=(n,x0)=>{ let t=''; for(let i=0;i<n;i++) t+=dot(x0+(i%3)*9, 30+Math.floor(i/3)*9); return t; };
  s+=grp(a,12)+`<text x="50" y="60" fill="#7cf0c8" font-size="18">+</text>`+grp(b,68)+`<text x="104" y="60" fill="#7cf0c8" font-size="18">→</text>`+grp(a+b,128);
  return svg(s); }
function picAtom(p){ let s=`<circle cx="85" cy="55" r="40" fill="none" stroke="#2a4a5a"/>`; if(p>2) s+=`<circle cx="85" cy="55" r="24" fill="none" stroke="#2a4a5a"/>`;
  for (let i=0;i<p;i++){ const a=i*2.4; const rr=Math.sqrt(i)*3.2; s+=`<circle cx="${85+Math.cos(a)*rr}" cy="${55+Math.sin(a)*rr}" r="3.6" fill="#ff7a59"/>`; }
  for (let i=0;i<p;i++){ const inner = i<2; const R = (p>2&&inner)?24:40; const k = inner? i : i-2; const tot = inner? Math.min(p,2) : p-2; const a=k/tot*Math.PI*2 + (inner?0.4:0); s+=`<circle cx="${85+Math.cos(a)*R}" cy="${55+Math.sin(a)*R}" r="2.6" fill="#6aa8ff"/>`; }
  return svg(s); }
function picWater(){ return svg(`<circle cx="85" cy="58" r="16" fill="#ff7a59"/><circle cx="60" cy="38" r="10" fill="#e8e6df"/><circle cx="110" cy="38" r="10" fill="#e8e6df"/><line x1="70" y1="44" x2="76" y2="50" stroke="#aaa" stroke-width="3"/><line x1="100" y1="44" x2="94" y2="50" stroke="#aaa" stroke-width="3"/>`); }
function picSystem(P, home, moons, opts={}){
  let s=`<circle cx="-14" cy="55" r="${opts.bigStar?44:30}" fill="${opts.bigStar?'#ff6a3a':'#ffd36a'}"/>`;
  const gap = 140/(P+0.5);
  for (let i=1;i<=P;i++){ const x=24+i*gap, r=3+((i*7)%5); const hot = opts.hot===i; const blue = opts.earth&&i===3;
    s+=`<circle cx="${x}" cy="55" r="${r}" fill="${hot?'#ff5a3a':blue?'#4a9aff':'#a8b0c0'}"/>`;
    if (i===home) { s+=`<circle cx="${x}" cy="55" r="${r+6}" fill="none" stroke="#7cf0c8" stroke-width="1.5"/>`; for(let m=0;m<moons;m++) s+=`<circle cx="${x+Math.cos(m*2.1)*(r+12)}" cy="${55+Math.sin(m*2.1)*(r+12)}" r="1.8" fill="#ccc"/>`; }
    if (opts.arrow && i===opts.arrow[0]){ const x2=24+opts.arrow[1]*gap; s+=`<path d="M${x} 40 Q ${(x+x2)/2} 15 ${x2} 40" fill="none" stroke="#7cf0c8" stroke-width="1.5" marker-end="url(#ah)"/>`; }
  }
  s = `<defs><marker id="ah" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6z" fill="#7cf0c8"/></marker></defs>`+s;
  return svg(s);
}
function picAlien(hl){
  const L=LANG; let s='';
  const hc = (k)=> hl===k? '#7cf0c8' : '#9aa6b8';
  s+=`<ellipse cx="85" cy="58" rx="16" ry="22" fill="#2c3644" stroke="${hc('body')}"/>`;
  s+=`<circle cx="85" cy="24" r="13" fill="#2c3644" stroke="${hc('HEAD')}" stroke-width="${hl==='HEAD'?2:1}"/>`;
  for (let i=0;i<L.eyes;i++){ const x=85+(i-(L.eyes-1)/2)*6; s+=`<circle cx="${x}" cy="22" r="2.2" fill="${hl==='EYE'?'#7cf0c8':'#fff'}"/>`; }
  for (let i=0;i<L.arms;i++){ const side=i%2?1:-1, row=Math.floor(i/2); const y=46+row*12; const x2=85+side*44;
    s+=`<line x1="${85+side*12}" y1="${y}" x2="${x2}" y2="${y-8}" stroke="${hc('ARM')}" stroke-width="${hl==='ARM'?3:2}"/>`;
    for (let f=0;f<L.fingers;f++){ const a=-1.2+(f/(Math.max(L.fingers-1,1)))*1.2; s+=`<line x1="${x2}" y1="${y-8}" x2="${x2+side*Math.cos(a)*9}" y2="${y-8+Math.sin(a)*9}" stroke="${hl==='FINGER'?'#ffb547':'#9aa6b8'}" stroke-width="1.5"/>`; } }
  for (let i=0;i<L.legs;i++){ const x=85+(i-(L.legs-1)/2)*9; s+=`<line x1="${x}" y1="76" x2="${x+(i-(L.legs-1)/2)*4}" y2="104" stroke="${hc('LEG')}" stroke-width="${hl==='LEG'?3:2}"/>`; }
  return svg(s);
}
function picHuman(hl){
  const c=(k)=>hl===k?'#ffb547':'#d8c8a8'; let s='';
  s+=`<circle cx="85" cy="20" r="11" fill="none" stroke="${c('HEAD')}" stroke-width="2"/><circle cx="81" cy="18" r="1.6" fill="${hl==='EYE'?'#ffb547':'#d8c8a8'}"/><circle cx="89" cy="18" r="1.6" fill="${hl==='EYE'?'#ffb547':'#d8c8a8'}"/>`;
  s+=`<line x1="85" y1="31" x2="85" y2="70" stroke="#d8c8a8" stroke-width="2"/>`;
  s+=`<line x1="85" y1="40" x2="62" y2="58" stroke="${c('ARM')}" stroke-width="2"/><line x1="85" y1="40" x2="108" y2="58" stroke="${c('ARM')}" stroke-width="2"/>`;
  for (const [x,side] of [[62,-1],[108,1]]) for (let f=0;f<5;f++){ const a=0.3+f*0.35; s+=`<line x1="${x}" y1="58" x2="${x+side*Math.cos(a)*7}" y2="${58+Math.sin(a)*7}" stroke="${hl==='FINGER'?'#ffb547':'#d8c8a8'}" stroke-width="1.2"/>`; }
  s+=`<line x1="85" y1="70" x2="72" y2="102" stroke="${c('LEG')}" stroke-width="2"/><line x1="85" y1="70" x2="98" y2="102" stroke="${c('LEG')}" stroke-width="2"/>`;
  s+=`<text x="6" y="104" font-size="8" fill="#556">(the image of us they received)</text>`;
  return svg(s);
}
function picTime(before, after, which){ // before/after: inner svg strings drawn in 70x90 frames
  const f=(inner,x,on)=>`<g transform="translate(${x},10)"><rect width="70" height="90" rx="6" fill="#0a0e14" stroke="${on?'#7cf0c8':'#222'}" stroke-width="${on?2:1}"/>${inner}</g>`;
  return svg(f(before,6,which===0)+`<text x="80" y="60" fill="#556" font-size="14">→</text>`+f(after,94,which===1)+`<text x="6" y="8" font-size="7" fill="#556">long ago</text><text x="94" y="8" font-size="7" fill="#556">now</text>`);
}
const starIn=(big)=>`<circle cx="35" cy="45" r="${big?28:10}" fill="${big?'#ff6a3a':'#ffd36a'}"/>`;
const planetIn=(hot)=>`<circle cx="35" cy="45" r="18" fill="${hot?'#ff5a3a':'#7aa0c8'}"/>${hot?'<path d="M20 20q5-8 10 0q5-8 10 0" stroke="#ff5a3a" fill="none"/>':''}`;
function picSignal(){ return svg(`<circle cx="30" cy="55" r="10" fill="#a8b0c0" stroke="#7cf0c8"/>`+[20,34,48,62].map(r=>`<path d="M${30+r} ${55-r*0.7} A ${r} ${r} 0 0 1 ${30+r} ${55+r*0.7}" fill="none" stroke="#7cf0c8" opacity="${1-r/80}"/>`).join('')+`<circle cx="148" cy="55" r="8" fill="#4a9aff"/>`); }
function picSee(){ return svg(`<ellipse cx="45" cy="55" rx="22" ry="12" fill="none" stroke="#7cf0c8" stroke-width="2"/><circle cx="45" cy="55" r="6" fill="#7cf0c8"/><line x1="70" y1="55" x2="130" y2="55" stroke="#7cf0c8" stroke-dasharray="3 4"/><circle cx="145" cy="55" r="9" fill="#4a9aff"/>`); }

// ===================== Chapters =====================
function buildChapters(){
  const L=LANG, r=RH.rng(S.seed+77), b=L.base;
  const T=(pic, words)=>({pic, words});
  const C=[];
  // 1 Counting
  { const tx=[]; for (let n=1;n<=b+3;n++) tx.push(T(picDots(n), num(n)));
    tx.splice(0,0,T(picDots(0), num(0)));
    for (const n of [b*2, b*2+1, b*3-1]) tx.push(T(picDots(n), num(n)));
    const v1 = b*2+2+r.int(b-2), v2 = b*3+1+r.int(b-1);
    C.push({title:'COUNTING', intro:'The first transmission repeats every 41 minutes. Each frame is a picture followed by symbols.', tx, qs:[
      {type:'compose', prompt:`Reply with the number of dots.`, pic:picDots(v1), ans:num(v1)},
      {type:'compose', prompt:`And this one.`, pic:picDots(v2), ans:num(v2)},
      {type:'compose', prompt:'Transmit the smallest number that needs <i>two</i> of their symbols.', ans:num(b)},
    ]}); }
  // 2 Arithmetic
  { const tx=[]; const eq=(a,op,c,d,ok)=>[...num(a),op,...num(c),'EQUALS',...num(d), ok?'YES':'NO'];
    tx.push(T(picSum(1,2), eq(1,'PLUS',2,3,1)), T(picSum(2,2), eq(2,'PLUS',2,4,1)), T(picSum(3,1), eq(3,'PLUS',1,4,1)));
    tx.push(T(picSum(2,2), eq(2,'PLUS',2,5,0)));
    for (let k=0;k<3;k++){ const a=2+r.int(b*2), c=1+r.int(b*2); tx.push(T(null, eq(a,'PLUS',c,a+c,1))); }
    for (let k=0;k<3;k++){ const a=b+r.int(b*2), c=1+r.int(b-1); tx.push(T(null, eq(a,'MINUS',c,a-c,1))); }
    for (let k=0;k<3;k++){ const a=2+r.int(b), c=2+r.int(4); tx.push(T(null, eq(a,'TIMES',c,a*c,1))); }
    const fa=3+r.int(b), fc=2+r.int(3); tx.push(T(null, eq(fa,'TIMES',fc,fa*fc+1,0)));
    const qa=b+2+r.int(b*2), qc=b+1+r.int(b*2); const ma=4+r.int(4), mc=3+r.int(4);
    C.push({title:'ARITHMETIC', intro:'The second signal uses the same number symbols, with some new ones between them.', tx, qs:[
      {type:'compose', prompt:'Complete their equation:', words:[...num(qa),'PLUS',...num(qc),'EQUALS'], ans:num(qa+qc)},
      {type:'compose', prompt:'Complete their equation:', words:[...num(ma),'TIMES',...num(mc),'EQUALS'], ans:num(ma*mc)},
      {type:'compose', prompt:'Is this statement true? Answer the way they would.', words:[...num(ma+1),'MINUS',...num(2),'EQUALS',...num(ma-2)], ans:['NO']},
    ]}); }
  // 3 Matter
  { const els=[['H',1],['HE',2],['C',6],['N',7],['O',8]]; const tx=[];
    for (const [e,p] of els) tx.push(T(picAtom(p), clause({s:[e], v:'IS', o:num(p)})));
    tx.push(T(picWater(), clause({s:['WATER'], v:'IS', o:[...np('H',2),'AND',...np('O',1)]})));
    const qe = r.pick(els.slice(2));
    C.push({title:'MATTER', intro:'Pictures of atoms: red is protons, blue is electrons. They are naming chemistry.', tx, qs:[
      {type:'compose', prompt:'Which element is this? Answer with their word.', pic:picAtom(qe[1]), ans:[qe[0]]},
      {type:'compose', prompt:'One symbol links each element to its number, the way we would write "=". Transmit it on its own.', ans:['IS']},
      {type:'compose', prompt:'Say "helium is 2".', ans:clause({s:['HE'], v:'IS', o:num(2)})},
    ]}); }
  // 4 Home
  { const tx=[];
    tx.push(T(picSystem(L.planets,0,0), clause({s:['STAR'], v:'HAVE', o:np('PLANET', L.planets)})));
    tx.push(T(picSystem(L.planets,L.home,0), clause({s:['WE'], v:'LIVE', o:np('PLANET', L.home).filter(w=>w!=='PL')})));
    tx.push(T(picSystem(L.planets,L.home,L.moons), clause({s:np('PLANET',L.home).filter(w=>w!=='PL'), v:'HAVE', o:np('MOON',L.moons)})));
    tx.push(T(picSystem(8,3,1,{earth:true}), clause({s:['YOU'], v:'LIVE', o:np('PLANET',3).filter(w=>w!=='PL')})));
    tx.push(T(picSystem(8,0,0,{earth:true}), clause({s:['STAR'], v:'HAVE', o:np('PLANET',8)})));
    C.push({title:'HOME', intro:'Now diagrams of star systems: theirs, and one that looks a lot like ours.', tx, qs:[
      {type:'compose', prompt:'Which symbol do the senders use for <i>themselves</i>? Transmit it on its own.', ans:['WE']},
      {type:'compose', prompt:`How many planets orbit <i>their</i> star? Answer with a number.`, ans:num(L.planets)},
      {type:'compose', prompt:`Tell them: "planet 3 has 1 moon" (that's Earth).`, ans:clause({s:np('PLANET',3).filter(w=>w!=='PL'), v:'HAVE', o:np('MOON',1)})},
    ]}); }
  // 5 Bodies
  { const tx=[];
    tx.push(T(picAlien('HEAD'), clause({s:['WE'], v:'HAVE', o:np('HEAD',1)})));
    tx.push(T(picAlien('EYE'), clause({s:['WE'], v:'HAVE', o:np('EYE',L.eyes)})));
    tx.push(T(picAlien('ARM'), clause({s:['WE'], v:'HAVE', o:np('ARM',L.arms)})));
    tx.push(T(picAlien('LEG'), clause({s:['WE'], v:'HAVE', o:np('LEG',L.legs)})));
    tx.push(T(picAlien('FINGER'), clause({s:['ARM'], v:'HAVE', o:np('FINGER',L.fingers)})));
    tx.push(T(picAlien('FINGER'), clause({s:['WE'], v:'HAVE', o:np('FINGER',b)})));
    tx.push(T(picHuman('EYE'), clause({s:['YOU'], v:'HAVE', o:np('EYE',2)})));
    tx.push(T(picHuman('ARM'), clause({s:['YOU'], v:'HAVE', o:np('ARM',2)})));
    C.push({title:'BODIES', intro:'They are describing themselves. The last frames show a figure that looks like us.', tx, qs:[
      {type:'compose', prompt:'How many fingers do they have altogether? Answer in their numbers. (Does it remind you of anything?)', ans:num(b)},
      {type:'compose', prompt:'Tell them how many fingers <i>you</i> (humans) have. Careful: from your side, who is "we"?', ans:clause({s:['WE'], v:'HAVE', o:np('FINGER',10)})},
      {type:'compose', prompt:'Tell them humans have 2 legs.', ans:clause({s:['WE'], v:'HAVE', o:np('LEG',2)})},
    ]}); }
  // 6 Time
  { const tx=[];
    tx.push(T(picTime(starIn(0),starIn(1),0), clause({s:['STAR'], v:'IS', o:['SMALL'], past:1})));
    tx.push(T(picTime(starIn(0),starIn(1),1), clause({s:['STAR'], v:'IS', o:['BIG']})));
    tx.push(T(picTime(starIn(0),starIn(1),1), clause({s:['STAR'], v:'IS', o:['SMALL'], neg:1})));
    tx.push(T(picTime(planetIn(0),planetIn(1),0), clause({s:np('PLANET',L.oldHome).filter(w=>w!=='PL'), v:'IS', o:['COLD'], past:1})));
    tx.push(T(picTime(planetIn(0),planetIn(1),1), clause({s:np('PLANET',L.oldHome).filter(w=>w!=='PL'), v:'IS', o:['HOT']})));
    tx.push(T(picTime(planetIn(0),planetIn(1),1), clause({s:np('PLANET',L.oldHome).filter(w=>w!=='PL'), v:'IS', o:['COLD'], neg:1})));
    C.push({title:'TIME', intro:'Two-panel images, before and after. The outlined panel is the one each sentence describes.', tx, qs:[
      {type:'compose', prompt:'Say: "the star was not hot".', ans:clause({s:['STAR'], v:'IS', o:['HOT'], neg:1, past:1})},
      {type:'compose', prompt:'Say: "the star was big".', ans:clause({s:['STAR'], v:'IS', o:['BIG'], past:1})},
      {type:'compose', prompt:`Say: "planet ${L.oldHome} is not cold".`, ans:clause({s:np('PLANET',L.oldHome).filter(w=>w!=='PL'), v:'IS', o:['COLD'], neg:1})},
    ]}); }
  // 7 History
  { const tx=[]; const P=(n)=>np('PLANET',n).filter(w=>w!=='PL');
    tx.push(T(picSystem(L.planets,L.oldHome,0), clause({s:['WE'], v:'LIVE', o:P(L.oldHome), past:1})));
    tx.push(T(picTime(starIn(0),starIn(1),1), clause({s:['STAR'], v:'IS', o:['BIG']})));
    tx.push(T(picSystem(L.planets,0,0,{bigStar:1,hot:L.oldHome}), clause({s:P(L.oldHome), v:'IS', o:['HOT']})));
    tx.push(T(picSystem(L.planets,0,0,{arrow:[L.oldHome,L.home]}), clause({s:['WE'], v:'GO', o:P(L.home), past:1})));
    tx.push(T(picSystem(L.planets,L.home,L.moons), clause({s:['WE'], v:'LIVE', o:P(L.home)})));
    tx.push(T(picSee(), clause({s:['WE'], v:'SEE', o:['YOU'], past:1})));
    tx.push(T(picSignal(), clause({s:['WE'], v:'SEND', o:['SIGNAL']})));
    C.push({title:'HISTORY', intro:'A longer message. It reads like a story.', tx, qs:[
      {type:'compose', prompt:`Why did they leave planet ${L.oldHome}? Transmit the one symbol that explains it.`, ans:['BIG'], alt:[['HOT']]},
      {type:'compose', prompt:'Which symbol turns "we see you" into "we saw you"? Transmit it on its own.', ans:['PAST']},
      {type:'compose', prompt:'Reply: "we see you". (Remember: "we" is you, the humans, now.)', ans:clause({s:['WE'], v:'SEE', o:['YOU']})},
    ]}); }
  // 8 Dialogue
  { const tx=[]; const P=(n)=>np('PLANET',n).filter(w=>w!=='PL');
    tx.push(T(picAlien('ARM'), clause({s:['WE'], v:'HAVE', o:np('ARM','?'), q:1})));
    tx.push(T(picAlien('ARM'), clause({s:['WE'], v:'HAVE', o:np('ARM',L.arms)})));
    tx.push(T(picAlien('LEG'), clause({s:['WE'], v:'HAVE', o:np('LEG','?'), q:1})));
    tx.push(T(picAlien('LEG'), clause({s:['WE'], v:'HAVE', o:np('LEG',L.legs)})));
    tx.push(T(picHuman('EYE'), clause({s:['YOU'], v:'HAVE', o:np('EYE','?'), q:1})));
    C.push({title:'DIALOGUE', intro:'They are asking questions now and waiting for answers.', tx, qs:[
      {type:'compose', prompt:'They ask:', words:clause({s:['YOU'], v:'HAVE', o:np('EYE','?'), q:1}), ans:clause({s:['WE'], v:'HAVE', o:np('EYE',2)})},
      {type:'compose', prompt:'They ask:', words:clause({s:['YOU'], v:'LIVE', o:np('PLANET','?'), q:1}), ans:clause({s:['WE'], v:'LIVE', o:P(3)})},
      {type:'compose', prompt:'They ask:', words:clause({s:['YOU'], v:'SEE', o:['WE'], q:1}), ans:['YES']},
      {type:'compose', prompt:'Last question. They ask:', words:clause({s:['YOU'], v:'SEND', o:['SIGNAL'], q:1}), ans:clause({s:['WE'], v:'SEND', o:['SIGNAL']}), final:true, alt:[['YES']]},
    ]}); }
  return C;
}
function gl(id){ return `<span class="g" data-w="${id}" style="vertical-align:middle">${glyphSVG(id)}</span>`; }
function glSeq(ws){ return `<span class="sentence" style="display:inline-flex">${ws.map(w=>gl(w)).join('')}</span>`; }

// ===================== Rendering =====================
let CH, seen; const drafts = {}; // compose boxes survive re-renders (hint, gloss toggle, other replies)
// A wrong transmission jams the channel; each further miss on the same question jams it longer, so trying every symbol is slow.
const LOCKOUT = 1500, LOCK_MAX = 9000; const misses = {}; const lockUntil = {};
const lockFor = id => Math.min(LOCK_MAX, LOCKOUT * (misses[id] || 0));
const known = w => S.known && S.known[w] ? meaningOf(w) : '';
const meaningOf = w => /^D\d+$/.test(w) ? w.slice(1) : MEANING[w];
const glossOf = w => S.notes[w] || S.seti[w] || known(w) || '';
function sentenceHTML(ws, cls=''){
  return `<div class="sentence ${cls}">`+ws.map(w=>`<span class="g ${S.known&&S.known[w]?'kn':''}" data-w="${w}">${glyphSVG(w)}<span class="gl">${S.gloss? esc(glossOf(w)) : ''}</span></span>`).join('')+`</div>`;
}
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function chapterUnlocked(i){ return i===0 || CH[i-1].qs.every((q,k)=>S.solved[(i-1)+':'+k]); }
function seenUpTo(i){ const set=[]; for (let c=0;c<=i;c++){ for (const t of CH[c].tx) for (const w of t.words) if(!set.includes(w)) set.push(w); for (const q of CH[c].qs) for (const w of (q.words||[])) if(!set.includes(w)) set.push(w); }
  // digits first, in numeric order, so the palette is usable; words keep their order of first appearance
  const isD = w=>/^D\d+$/.test(w);
  return [...set.filter(isD).sort((a,b)=>a.slice(1)-b.slice(1)), ...set.filter(w=>!isD(w))]; }
let printed = -1; // the chapter whose printout has already rolled off the teletype
function render(){
  const i=S.chapter, ch=CH[i];
  seen = seenUpTo(i);
  const fresh = printed!==i; printed = i;
  document.getElementById('chapters').innerHTML = CH.map((c,k)=>`<button data-c="${k}" class="${k===i?'cur':''} ${CH[k].qs.every((q,j)=>S.solved[k+':'+j])?'done':''}" ${chapterUnlocked(k)?'':'disabled'} aria-label="Transmission ${k+1}">${k+1}</button>`).join('');
  document.querySelectorAll('#chapters button').forEach(b=>b.onclick=()=>{ S.chapter=+b.dataset.c; persist(); sfx('key'); render(); });
  document.getElementById('species').textContent = `SIGNAL ${String(S.seed).slice(0,4)}-${String(S.seed).slice(4,7)}${S.decoded? ` · ${S.decoded} DECODED`:''}`;
  let h = `<div class="sheet"><div class="chapterHead"><h2>TRANSMISSION ${String(i+1).padStart(2,'0')} : ${ch.title}</h2><span class="stamp">${new Date(Date.UTC(2031,2,4+i*9,3,7+i*4)).toISOString().slice(0,16).replace('T',' ')} UT</span></div><p class="intro">${ch.intro}</p>`;
  ch.tx.forEach((t,k)=>{ h += `<div class="tx ${fresh?'printing':''}" style="--i:${k}"><div class="num">${String(k+1).padStart(3,'0')}</div>${t.pic? `<div class="pic">${t.pic}</div>`:''}${sentenceHTML(t.words)}</div>`; });
  h += `<div class="qs"><h3>REPLY</h3>`;
  ch.qs.forEach((q,k)=>{ const id=i+':'+k; const done=S.solved[id];
    h += `<div class="q ${done?'done':''}" data-q="${k}"><div class="prompt">${q.prompt}</div>`;
    if (q.pic) h += `<div class="pic qpic">${q.pic}</div>`;
    if (q.words) h += sentenceHTML(q.words)+'<div style="height:8px"></div>';
    if (done) h += `<div class="fb good">ACK RECEIVED ${sentenceHTML(q.ans)}</div>`;
    else h += `<div class="compose" data-compose aria-label="Your reply"></div><div class="row ctl"><button data-back aria-label="Delete last symbol">⌫</button><button data-clear>Clear</button><span class="spacer" style="flex:1"></span><button class="primary" data-send>Transmit</button></div><div class="palette" role="group" aria-label="Glyph keyboard">${seen.map(w=>`<button class="g key" data-pw="${w}" title="${esc(glossOf(w))}" aria-label="${esc(glossOf(w)||'glyph')}">${glyphSVG(w)}</button>`).join('')}</div><div class="fb"></div>`;
    h += `</div>`; });
  h += `</div>`;
  if (ch.qs.every((q,k)=>S.solved[i+':'+k]) && i<CH.length-1) h += `<div class="next"><button class="primary" id="nextCh">Receive transmission ${i+2}</button></div>`;
  h += `</div>`;
  const feed=document.getElementById('feed'); feed.innerHTML=h;
  if (fresh) chatter(ch.tx.length);
  document.getElementById('nextCh')?.addEventListener('click',()=>{ S.chapter++; persist(); render(); feed.scrollTop=0; scrollTo(0,0); });
  // wiring
  feed.querySelectorAll('.g[data-w]').forEach(el=> el.onclick=()=>focusGlyph(el.dataset.w));
  feed.querySelectorAll('.q').forEach(qel=>{
    const k=+qel.dataset.q, q=ch.qs[k], id=i+':'+k; if (S.solved[id]) return;
    const fb=qel.querySelector('.fb'), send=qel.querySelector('[data-send]');
    const comp=(drafts[id] ||= []); const box=qel.querySelector('[data-compose]');
    const draw=()=>{ box.innerHTML = comp.map(w=>`<span class="g">${glyphSVG(w)}</span>`).join('') || '<span class="hintTxt">type with the glyph keys below</span>'; };
    draw();
    const jam=()=>{ const left=(lockUntil[id]||0)-Date.now(); if (left>0){ send.disabled=true; send.textContent=`Jammed ${Math.ceil(left/1000)}s`; setTimeout(()=>{ if (send.isConnected) jam(); }, Math.min(250,left)); } else { send.disabled=false; send.textContent='Transmit'; } };
    jam();
    qel.querySelectorAll('[data-pw]').forEach(p=> p.onclick=()=>{ comp.push(p.dataset.pw); sfx('key'); draw(); });
    qel.querySelector('[data-back]').onclick=()=>{ comp.pop(); sfx('key'); draw(); };
    qel.querySelector('[data-clear]').onclick=()=>{ comp.length=0; draw(); };
    send.onclick=()=>{
      if (Date.now()<(lockUntil[id]||0) || !comp.length) return;
      const ok = (a)=> a.length===comp.length && a.every((w,j)=>w===comp[j]);
      if (ok(q.ans) || (q.alt||[]).some(ok)){ sfx('send'); solve(id, q.final); return; }
      misses[id]=(misses[id]||0)+1; lockUntil[id]=Date.now()+lockFor(id); sfx('static');
      const right = q.ans.filter((w,j)=>w===comp[j]).length; fb.className='fb bad';
      fb.textContent = `NO ACK. ${right} of ${q.ans.length} symbol${q.ans.length>1?'s':''} in the right place${comp.length!==q.ans.length? ` (they expect ${q.ans.length>comp.length?'more':'fewer'})`:''}. Channel jammed ${Math.round(lockFor(id)/1000)}s.`;
      jam();
    };
  });
  renderNotebook();
}
const allSolved = ()=> CH.every((c,i)=>c.qs.every((q,k)=>S.solved[i+':'+k]));
// Every acknowledged reply confirms the symbols it used: their cards on the corkboard get the meaning typed in.
function confirmWords(ws){ S.known ||= {}; const fresh=ws.filter(w=>!S.known[w]); fresh.forEach(w=>S.known[w]=1); return fresh; }
function solve(id, final){ if (S.solved[id]) return; S.solved[id]=1; delete drafts[id];
  const [ci,k]=id.split(':').map(Number), q=CH[ci].qs[k]; const newly=confirmWords(q.ans);
  persist(); RH.toast(`ACK. Reply received.${newly.length?` ${newly.length} symbol${newly.length>1?'s':''} confirmed.`:''}`); render();
  const chDone = CH[S.chapter].qs.every((q,k)=>S.solved[S.chapter+':'+k]);
  if (chDone) { const words=[...new Set(CH[S.chapter].tx.flatMap(t=>t.words))]; confirmWords(words); persist(); setTimeout(()=>rosetta(), 400); }
  if (allSolved() && !S.ended){ S.ended=1; persist(); setTimeout(ending, chDone? 2600 : 500); }
  else if (final) setTimeout(()=>RH.toast('They are waiting for the rest of your replies to this transmission.'),700);
  else if (chDone) setTimeout(()=>RH.toast(`TRANSMISSION ${S.chapter+1} DECODED.`),700);
}
// signature moment: the Rosetta sweep. Every glyph on the printout gets its meaning typed under it, one after another.
function rosetta(){
  const els=[...document.querySelectorAll('#feed .tx .g[data-w]')]; if (!els.length) return;
  document.querySelector('#feed .sheet')?.classList.add('decoded');
  els.forEach((el,n)=>setTimeout(()=>{ const gl=el.querySelector('.gl'); if (gl && S.gloss) gl.textContent=glossOf(el.dataset.w); el.classList.add('kn','flash'); if (n%3===0) sfx('tick'); }, n*45));
  setTimeout(()=>{ sfx('chord'); renderNotebook(); }, els.length*45+100);
}
async function ending(){
  S.decoded = (S.decoded||0)+1; persist();
  const L=LANG;
  await RH.modal(`<h2>Contact.</h2><p>Forty-one years from now, the <b>${L.name}</b> on planet ${L.home} of their star will receive your reply.</p>
  <p>What you worked out:</p><ul style="line-height:1.6">
  <li>They count in <b>base ${L.base}</b>: ${L.arms} arm${L.arms>1?'s':''} × ${L.fingers} fingers${L.littleEndian?', and they write the <b>smallest digit first</b>':''}.</li>
  <li>Word order is <b>${L.order}</b>. Numbers go ${L.numAfter?'after':'before'} the noun, and the past marker goes at the ${L.tenseFinal?'end':'start'} of the sentence.</li>
  <li>They have ${L.eyes} eye${L.eyes>1?'s':''} and ${L.legs} legs, and they moved from planet ${L.oldHome} when their star swelled.</li></ul>
  <p class="dim">Every new signal is a different species with a different grammar, number base and history. Want to decode another?</p>`, [{label:'Stay here',value:0},{label:'Receive a new signal',value:1}]).then(v=>{ if(v) newSignal(true); });
}
const phone=()=>matchMedia('(max-width:760px),(max-height:500px)').matches;
const lex=(open)=>document.body.classList.toggle('lex',open);
document.getElementById('lexBtn').onclick=()=>lex(true);
document.getElementById('nbClose').onclick=()=>lex(false);
document.getElementById('scrim').onclick=()=>lex(false);
document.getElementById('nbGloss').onclick=()=>document.getElementById('glossBtn').click();
document.getElementById('nbNew').onclick=()=>{ lex(false); document.getElementById('newBtn').click(); };
function focusGlyph(w){
  if (phone()) lex(true); // on a phone the lexicon is a drawer: tapping a glyph opens it at that card
  document.querySelectorAll('.g.hl,.nbRow.hl').forEach(e=>e.classList.remove('hl'));
  document.querySelectorAll(`#feed .g[data-w="${w}"]`).forEach(e=>e.classList.add('hl'));
  const row=document.querySelector(`.nbRow[data-w="${w}"]`); if(row){ row.classList.add('hl'); row.scrollIntoView({block:'nearest'}); if (!matchMedia('(pointer:coarse)').matches) row.querySelector('input').focus(); }
}
function renderNotebook(){
  const confs=['?','~','✓'];
  const order=seen; S.conf ||= {};
  document.getElementById('nbList').innerHTML = order.map((w,n)=>`<div class="nbRow ${S.known&&S.known[w]?'kn':''}" data-w="${w}" style="--r:${((n*37)%7-3)*.5}deg">${glyphSVG(w)}<input value="${esc(S.notes[w]||'')}" placeholder="${S.seti[w]||known(w)? '' : 'meaning?'}" aria-label="Your meaning for this glyph"><button class="conf" aria-label="Confidence">${confs[S.conf[w]||0]}</button>${S.seti[w]?`<span class="seti" title="SETI hint">${esc(S.seti[w])}</span>`:''}${known(w)?`<span class="ok" title="Confirmed by their acknowledgement">${esc(known(w))}</span>`:''}</div>`).join('');
  document.querySelectorAll('.nbRow').forEach(row=>{ const w=row.dataset.w;
    row.querySelector('svg').onclick=()=>focusGlyph(w);
    const inp=row.querySelector('input');
    inp.oninput=()=>{ S.notes[w]=inp.value; persist(); document.querySelectorAll(`#feed .g[data-w="${w}"] .gl`).forEach(e=>e.textContent=S.gloss?glossOf(w):''); };
    inp.onfocus=()=>{ document.querySelectorAll('#feed .g.hl').forEach(e=>e.classList.remove('hl')); document.querySelectorAll(`#feed .g[data-w="${w}"]`).forEach(e=>e.classList.add('hl')); };
    row.querySelector('.conf').onclick=(e)=>{ S.conf[w]=((S.conf[w]||0)+1)%3; e.target.textContent=confs[S.conf[w]]; persist(); };
  });
}
const MEANING = {PLUS:'plus',MINUS:'minus',TIMES:'times',EQUALS:'equals',YES:'yes / true',NO:'no / false',IS:'is',H:'hydrogen',HE:'helium',C:'carbon',N:'nitrogen',O:'oxygen',WATER:'water',AND:'and',STAR:'star',PLANET:'planet',MOON:'moon',HAVE:'have',LIVE:'live (on)',WE:'we',YOU:'you',PL:'(plural)',HEAD:'head',EYE:'eye',ARM:'arm',FINGER:'finger',LEG:'leg',PAST:'(past tense)',NOT:'not',BIG:'big',SMALL:'small',HOT:'hot',COLD:'cold',GO:'go',SEE:'see',SEND:'send',SIGNAL:'signal',Q:'(question)',HOWMANY:'how many?'};
document.getElementById('hintBtn').onclick=()=>{
  const i=S.chapter; const used=S.hints[i]||0;
  if (used>=3) return RH.toast('The SETI team has no more ideas for this transmission. (3 hints per transmission.)');
  const cand = seen.filter(w=>!S.seti[w] && !(S.conf[w]===2) && !(S.known&&S.known[w]));
  if (!cand.length) return RH.toast('Nothing left to hint.');
  // prefer words from the current chapter
  const cur = new Set(CH[i].tx.flatMap(t=>t.words)); const pool = cand.filter(w=>cur.has(w)); const w = (pool.length?pool:cand)[Math.floor(Math.random()*(pool.length||cand.length))];
  S.seti[w] = w[0]==='D' && /^D\d+$/.test(w) ? `digit ${w.slice(1)}` : MEANING[w]; S.hints[i]=used+1; persist(); render(); focusGlyph(w);
  RH.toast(`SETI team: "We're fairly sure this one means <b>${S.seti[w]}</b>." (${2-used} left)`);
};
document.getElementById('glossBtn').onclick=()=>{ S.gloss=!S.gloss; document.getElementById('glossBtn').textContent='Gloss: '+(S.gloss?'on':'off'); persist(); render(); };
document.getElementById('newBtn').onclick=async()=>{ if (await RH.modal('<h2>New signal?</h2><p>A different species with a new language. Your notebook for this signal will be cleared.</p>',[{label:'Cancel',value:0},{label:'Tune in',value:1}])) newSignal(); };
function newSignal(){ const d=S.decoded; S=fresh(); S.decoded=d; S.intro=1; for (const o of [drafts,misses,lockUntil]) for (const k in o) delete o[k]; printed=-1; persist(); boot(); }
function boot(){
  LANG = buildLanguage(S.seed); CH = buildChapters(); TOTALQ = CH.reduce((s,c)=>s+c.qs.length,0);
  if (!CH[S.chapter] || !chapterUnlocked(S.chapter)) S.chapter=0;
  document.getElementById('glossBtn').textContent='Gloss: '+(S.gloss?'on':'off');
  render();
}
boot();
window.__fc = { get S(){ return S; }, get LANG(){ return LANG; }, get CH(){ return CH; }, buildLanguage, num, np, clause, cleanSave, seenUpTo, chapterUnlocked, allSolved, solve, render, newSignal, LOCKOUT, lockFor, misses, meaningOf };
if (!S.intro){ S.intro=1; persist(); RH.modal(`<h2>FIRST CONTACT</h2><p>A narrow-band signal is coming from a star 41 light-years away. It's structured. Someone made it.</p><p>You have no dictionary. You have pictures, patterns and a notebook. Work out what the symbols mean, then answer them <b>in their language</b>.</p><p class="dim">Eight transmissions. Every new signal is a different species with a different language.</p>`,[{label:'Start listening'}]); }
</script>
