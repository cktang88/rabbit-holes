<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rabbit Holes — ten deep experiments</title>
<link rel="stylesheet" href="shared/common.css">
<style>
  body{min-height:100%}
  header{max-width:1000px;margin:0 auto;padding:56px 20px 20px}
  header h1{font-size:46px;margin:0;letter-spacing:-.02em}
  header p{color:var(--dim);font-size:18px;max-width:640px}
  .grid{max-width:1000px;margin:0 auto;padding:10px 20px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .card{display:block;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .card .em{font-size:34px}
  .card h2{margin:8px 0 4px;font-size:20px}
  .card p{margin:0;color:var(--dim);font-size:14px;line-height:1.45}
  .card .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
  .card .pct{position:absolute;top:14px;right:16px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<header>
  <h1>Rabbit Holes</h1>
  <p>Ten experiments built to swallow an afternoon. No accounts. Everything saves in your browser, so you can leave and come back.</p>
</header>
<div class="grid" id="grid"></div>
<header style="padding-top:0"><h2 style="margin:0;font-size:24px">Round 2</h2><p style="font-size:15px;margin-top:6px">More holes, dug after the first ten.</p></header>
<div class="grid" id="grid2"></div>
<script src="shared/common.js"></script>
<script>
const X = [
  ['nand','🔌','NAND to Everything','You get one logic gate. Build a computer out of it, then write programs for the CPU you built.'],
  ['first-contact','📡','First Contact','A signal arrives from 41 light-years away. Decode a language no human has seen; every save is a different alien species.'],
  ['rule-hunter','🦠','Rule Hunter','There are 262,144 Life-like universes. Explore them as a naturalist, catching the creatures that live in each.'],
  ['universe-seed','🌌','Universe Seed','Start as the Big Bang and run until heat death. Then rewrite the constants of physics and see what grows.'],
  ['slingshot','🛰️','Slingshot','One probe, almost no fuel, real Newtonian gravity. Thread gravity assists through 40 star systems.'],
  ['rumor','🗣️','Rumor','A town of strangers with friends, rivals and grudges. Whisper one lie and watch it change as it spreads.'],
  ['ant-mind','🐜','Ant Mind','You aren\'t an ant. You\'re the scent. Steer a whole colony by painting pheromones.'],
  ['mapmaker','🧭','Mapmaker of Lost Islands','It\'s 1680. Sail into fog and draw the coastline yourself. Sailors will trust your map with their lives.'],
  ['caravan','🐫','Caravan','Silk Road trading where information is the real currency. Every price you know is already out of date.'],
  ['fold','🧬','Fold','Proteins are tiny origami machines. Fold chains by hand and try to match what supercomputers found.'],
];
const X2 = [
  ['vault','🔐','The Vault','Thirty-six vaults locked by real historical ciphers, from Caesar to reused Soviet one-time pads. Break them with the analyst\'s tools.'],
  ['hypothesis','⚗️','Hypothesis','A machine accepts some rows of shapes and rejects others. Run experiments, form a theory, and stake your reputation on eight predictions. Sixty hidden laws.'],
  ['escapement','⚙️','Escapement','Cut gears to build a clock, then a calendar, then an orrery that keeps pace with the planets. It ends with the Antikythera mechanism.'],
  ['parish','⛪','Parish','A century of baptisms, marriages and burials in a simulated village. Descendants write to you. Trace their ancestors through misspelt names, dead infants\' names reused, and a clerk who abbreviated everything.'],
  ['temperament','🎹','Temperament','Twelve notes, and the intervals between them can never all be pure. Tune a keyboard by ear, from Pythagoras\' wolf to Bach\'s well-tempered clavier, then invent temperaments for composers.'],
  ['opticks','🔦','Opticks','Mirrors, prisms and lenses on an optical bench with real refraction and dispersion. Split sunlight like Newton, build telescopes, then cancel chromatic aberration with a doublet.'],
];
const prog = RH.load('hub', {});
const card = ([id,em,t,d]) => {
  const p = prog[id] || 0;
  return `<a class="card" href="${id}/index.html"><span class="em">${em}</span>${p ? `<span class="pct">${Math.round(p*100)}%</span>` : ''}<h2>${t}</h2><p>${d}</p><div class="bar" style="width:${p*100}%"></div></a>`;
};
document.getElementById('grid2').innerHTML = X2.map(card).join('');
document.getElementById('grid').innerHTML = X.map(([id,em,t,d]) => {
  const p = prog[id] || 0;
  return `<a class="card" href="${id}/index.html"><span class="em">${em}</span>${p ? `<span class="pct">${Math.round(p*100)}%</span>` : ''}<h2>${t}</h2><p>${d}</p><div class="bar" style="width:${p*100}%"></div></a>`;
}).join('');
</script>
</body>
</html>
