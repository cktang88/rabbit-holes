<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Chladni</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;overflow:hidden;background:#0c0a08;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;color:#f6efe2}

  .chip{position:fixed;background:rgba(28,22,16,.9);border:1px solid rgba(255,220,160,.12);border-radius:18px;box-shadow:0 16px 40px -18px rgba(0,0,0,.8)}

  #hud .home{color:#a8957a;font-size:12px;text-decoration:none}
  #hud h1{font-family:Fraunces,Georgia,serif;margin:4px 0;font-size:28px;display:flex;align-items:center;gap:8px}
  #storyT{display:none;margin-left:auto;font-size:12px;padding:4px 9px}
  #story{font-size:14px;line-height:1.5;color:#d9ccb5}
  #story b{color:#ffd27a}
  .tabs{display:flex;gap:4px;margin-top:10px;flex-wrap:wrap}
  .b{border:0;background:rgba(255,255,255,.07);color:#f6efe2;font:inherit;font-size:13px;border-radius:9px;padding:7px 11px;cursor:pointer}
  .b.on{background:#ffd27a;color:#2a1c05;font-weight:700}

<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip"><a class="home" href="../index.html">← Rabbit Holes</a><h1>〰️ Chladni <button class="b" id="storyT" aria-expanded="false">About</button></h1><div id="story"></div>
  <div class="tabs" id="plates"></div><div class="tabs"><span id="modes" style="display:contents"></span><button class="b mob" id="bookT">📖 Book</button></div><canvas id="target" width="200" height="200"></canvas><div id="goal"></div></div>

</div>

<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
// ================= plate physics (idealised) =================
// Each plate has vibration modes. A mode shape Z(x,y) says how far each point moves. Sand is thrown off
// the parts that move and comes to rest on the NODAL LINES (where Z = 0): the Chladni figure.
// Driving at frequency f excites every mode k with a resonance response 1/|1 − (f/fk)² + i f/(Q fk)|.
const Q = 60, FMIN = 40, FMAX = 4200;
function besselJ(n, x) { let s = 0, t = Math.pow(x / 2, n); for (let k = 1; k <= n; k++) t /= k; for (let k = 0; k < 40; k++) { s += t; t *= -(x * x / 4) / ((k + 1) * (k + 1 + n)); } return s; }

const PLATES = {

}
// circle: J_n(k r) cos(nθ), k = m-th zero of J_n' (free edge). n nodal diameters; J_n has (m−1) zeros inside for n ≥ 1, m for n = 0
for (let n = 0; n <= 5; n++) for (let m = 1; m <= 3; m++) { const k = besselZeroDeriv(n, m), rings = n === 0 ? m : m - 1; PLATES.circle.modes.push({ id: `c${n}${m}`, name: `${plural(n, 'line')}, ${plural(rings, 'ring')}`, f: 20 * k * k, z: (x, y) => { const X = x * 2 - 1, Y = y * 2 - 1, r = Math.hypot(X, Y); return r > 1 ? 0 : besselJ(n, k * r) * Math.cos(n * Math.atan2(Y, X)); } }); }

for (let n = 0; n <= 9; n++) for (let m = 0; m <= 4; m++) { if (n + m < 2) continue; PLATES.rect.modes.push({ id: `r${n}${m}`, name: `(${n},${m})`, f: 32 * (n * n + 4 * m * m) * (1 + .023 * n + .009 * m), z: (x, y) => Math.cos(n * Math.PI * x) * Math.cos(m * Math.PI * y) }); }

Object.values(PLATES).forEach(p => { p.modes.sort((a, b) => a.f - b.f); const keep = []; for (const md of p.modes) if (md.f > FMIN * 1.1 && md.f < FMAX * .92 && (!keep.length || md.f / keep[keep.length - 1].f > 1.022)) keep.push(md); p.modes = keep; p.fields = new Array(keep.length).fill(null); });
const sliderToF = v => FMIN * Math.pow(FMAX / FMIN, v / 1000), fToSlider = f => Math.log(f / FMIN) / Math.log(FMAX / FMIN) * 1000;
const insideP = (pl, x, y) => pl !== 'circle' || (x * 2 - 1) ** 2 + (y * 2 - 1) ** 2 < .97;

// ================= state =================
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
const SAVE = obj(RH.load('chladni', {})); // tolerate corrupted / hand-edited saves
// migrate: figures used to be stored as PNG data URLs (~1 MB); now just ids. Target index is per plate.
SAVE.got = obj(SAVE.got); for (const k in SAVE.got) SAVE.got[k] = 1;
SAVE.solved = obj(SAVE.solved); SAVE.mode = SAVE.mode === 'match' ? 'match' : 'explore';
if (typeof SAVE.tgt !== 'object' || !SAVE.tgt || Array.isArray(SAVE.tgt)) SAVE.tgt = { [PLATES[SAVE.plate] ? SAVE.plate : 'square']: +SAVE.tgt || 0 };

const TOTAL = Object.values(PLATES).reduce((a, p) => a + p.modes.length, 0);
const persist = () => { RH.save('chladni', SAVE); RH.progress('chladni', Object.values(PLATES).reduce((a, p) => a + p.modes.filter(m => SAVE.got[m.id]).length, 0) / TOTAL); };
persist();
let plate = PLATES[SAVE.plate] ? SAVE.plate : 'square', freq = sliderToF(300), holdT = 0, holdF = 0, dirty = true;
const focus = { k: 0, strength: 0, thr: .16 };

// ================= sand =================
const NS = 26000, GRID = 160, JK = .07;
const sx = new Float32Array(NS), sy = new Float32Array(NS);
const AMP = new Float32Array(GRID * GRID), WT = new Float64Array(64), cF = [], cW = new Float64Array(64);
function sprinkle(quiet) { for (let i = 0; i < NS; i++) { let x, y; do { x = Math.random(); y = Math.random(); } while (!insideP(plate, x, y)); sx[i] = x; sy[i] = y; } if (!quiet) FX.sfx('whoosh'); }
// each mode's shape sampled once on the sand grid (lazily, per plate), normalised to max |Z| = 1
function field(k) {
  const P = PLATES[plate]; if (P.fields[k]) return P.fields[k];
  const md = P.modes[k], f = new Float32Array(GRID * GRID); let mx = 0;
  for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) { const x = (i + .5) / GRID, y = (j + .5) / GRID, v = insideP(plate, x, y) ? md.z(x, y) : 0; f[j * GRID + i] = v; if (Math.abs(v) > mx) mx = Math.abs(v); }

}
function computeResponse() {
  dirty = false;
  const P = PLATES[plate], M = P.modes.length; let top = 0, tw = 0;
  for (let k = 0; k < M; k++) { const r = freq / P.modes[k].f, w = 1 / Math.hypot(1 - r * r, r / Q); WT[k] = w; if (w > tw) { tw = w; top = k; } }

  focus.k = top; focus.strength = Math.min(1, Math.max(0, (tw - 1) / 25));
  // the vibration field is dominated by the nearest resonance; blend its neighbours for smooth morphing
  let n = 0; for (let k = 0; k < M; k++) if (WT[k] > .2 * tw) { cF[n] = field(k); cW[n] = WT[k] / tw; n++; }
  const N = GRID * GRID;
  if (n === 1) { const f = cF[0]; for (let i = 0; i < N; i++) AMP[i] = Math.abs(f[i]); }
  else for (let i = 0; i < N; i++) { let z = 0; for (let c = 0; c < n; c++) z += cW[c] * cF[c][i]; AMP[i] = Math.abs(z); }
  // what "settled" means for THIS field: mean |Z| under uniform sand (U) vs the stationary sand density
  // ∝ 1/jump² (E). Recorded once the grains have gone 70% of the way from U to E.
  const str = .02 + focus.strength * .9; let U = 0, cnt = 0, en = 0, ed = 0;
  for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) { if (!insideP(plate, (i + .5) / GRID, (j + .5) / GRID)) continue; const a = AMP[j * GRID + i], D = a * str * JK + .0006, rho = 1 / (D * D); U += a; cnt++; en += a * rho; ed += rho; }
  U /= cnt; const E = en / ed; focus.thr = E + .3 * (U - E);
}
function shake(steps) {
  const str = .02 + focus.strength * .9, circ = plate === 'circle';
  for (let s = 0; s < steps; s++) for (let i = 0; i < NS; i++) {
    const x = sx[i], y = sy[i], gi = Math.min(GRID - 1, x * GRID | 0), gj = Math.min(GRID - 1, y * GRID | 0);
    const jump = AMP[gj * GRID + gi] * str * JK + .0006; // grains on moving metal get thrown; grains on nodal lines sit still
    const nx = x + (Math.random() - .5) * jump, ny = y + (Math.random() - .5) * jump;
    if (nx < 0 || nx > 1 || ny < 0 || ny > 1) continue;
    if (circ) { const dx = nx * 2 - 1, dy = ny * 2 - 1; if (dx * dx + dy * dy >= .97) continue; }
    sx[i] = nx; sy[i] = ny;
  }
}

// ================= rendering =================
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
let W = 1, H = 1, dpr = 1, plateBox = { x: 0, y: 0, s: 1 };
const SZ = 700, sandC = document.createElement('canvas'), sg = sandC.getContext('2d');
sandC.width = sandC.height = SZ;
const sandImg = sg.createImageData(SZ, SZ), sand32 = new Uint32Array(sandImg.data.buffer), CNT = new Uint8Array(SZ * SZ);
let touched = new Int32Array(NS * 4), nTouched = 0;
// glow: the sand downsampled twice (700 → 350 → 175) and stretched back up, instead of a per-frame filter: blur()
const halfC = document.createElement('canvas'), hg = halfC.getContext('2d'), glowC = document.createElement('canvas'), gg = glowC.getContext('2d');
halfC.width = halfC.height = SZ / 2; glowC.width = glowC.height = SZ / 4;
// colour of a pixel hit by 1, 2, 3+ grains (each grain adds rgba(150,138,112,190), saturating), as little-endian RGBA
const rgba = (r, gr, b, a) => ((a << 24) | (b << 16) | (gr << 8) | r) >>> 0;
const LUT = [0, rgba(150, 138, 112, 190), rgba(255, 255, 224, 255), rgba(255, 255, 255, 255)];
// static layers (background, brass plate + its soft shadow) are baked on resize / plate change
const bgC = document.createElement('canvas'), bgg = bgC.getContext('2d'), plC = document.createElement('canvas'), plg = plC.getContext('2d');
let plPad = 0;
function bake() {
  bgC.width = W; bgC.height = H;
  const bg = bgg.createRadialGradient(W / 2, H * .4, 0, W / 2, H * .4, Math.max(W, H) * .8); bg.addColorStop(0, '#2a2018'); bg.addColorStop(1, '#090705'); bgg.fillStyle = bg; bgg.fillRect(0, 0, W, H);
  const s = plateBox.s, h = plate === 'rect' ? s / 2 : s; plPad = 70 * dpr;
  plC.width = Math.ceil(s + plPad * 2); plC.height = Math.ceil(h + plPad * 2);
  plg.setTransform(1, 0, 0, 1, plPad, plPad);

  const gr = plg.createLinearGradient(0, 0, s, h); gr.addColorStop(0, '#3a2a16'); gr.addColorStop(.5, '#5a4223'); gr.addColorStop(1, '#2e2112');
  plg.fillStyle = gr; plg.beginPath(); if (plate === 'circle') plg.arc(s / 2, s / 2, s / 2, 0, 7); else plg.roundRect(0, 0, s, h, 8 * dpr); plg.fill();
}
const narrow = () => innerWidth <= 900;
function layout() {
  dpr = FX.fit(cv, 1.5); W = cv.width; H = cv.height;
  const hud = $('hud').getBoundingClientRect(), dial = $('dial').getBoundingClientRect(), hf = plate === 'rect' ? .5 : 1;
  let l, r, t, b;
  if (narrow()) { l = 10; r = innerWidth - 10; t = hud.bottom + 8; b = dial.top - 8; }
  else { const book = $('book').getBoundingClientRect(); l = hud.right + 16; r = (book.width ? book.left : innerWidth) - 16; t = 24; b = dial.top - 20; }
  const s = Math.max(60, Math.min(r - l, (b - t) / hf, 680)), y = t + Math.max(0, (b - t - s * hf) / 2) - (plate === 'rect' ? s / 4 : 0);

  bake();
}
addEventListener('resize', layout);
function rasterSand() {
  const ph = plate === 'rect' ? SZ / 2 : SZ;
  for (let i = 0; i < nTouched; i++) { const o = touched[i]; sand32[o] = 0; CNT[o] = 0; } // clear only last frame's pixels
  nTouched = 0;
  for (let i = 0; i < NS; i++) {
    const px = Math.min(SZ - 2, sx[i] * (SZ - 1) | 0), py = Math.min(ph - 2, sy[i] * (ph - 1) | 0), o = py * SZ + px;
    if (CNT[o]++ === 0) touched[nTouched++] = o; if (CNT[o + 1]++ === 0) touched[nTouched++] = o + 1;
    if (CNT[o + SZ]++ === 0) touched[nTouched++] = o + SZ; if (CNT[o + SZ + 1]++ === 0) touched[nTouched++] = o + SZ + 1;
  }
  for (let i = 0; i < nTouched; i++) { const o = touched[i], c = CNT[o]; sand32[o] = LUT[c > 3 ? 3 : c]; }
  sg.putImageData(sandImg, 0, 0, 0, 0, SZ, ph);
  hg.clearRect(0, 0, SZ / 2, SZ / 2); hg.drawImage(sandC, 0, 0, SZ, ph, 0, 0, SZ / 2, ph / 2);
  gg.clearRect(0, 0, SZ / 4, SZ / 4); gg.drawImage(halfC, 0, 0, SZ / 2, ph / 2, 0, 0, SZ / 4, ph / 4);
}
function draw(now) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  g.drawImage(bgC, 0, 0);
  const { x, y, s } = plateBox, wob = focus.strength * 1.5 * dpr * Math.sin(now / 9);
  const rect = plate === 'rect', h = rect ? s / 2 : s, yy = rect ? y + s / 4 : y, ph = rect ? SZ / 2 : SZ;
  g.drawImage(plC, x + wob - plPad, yy - plPad);
  rasterSand();
  g.imageSmoothingEnabled = true; g.drawImage(sandC, 0, 0, SZ, ph, x + wob, yy, s, h);
  g.globalCompositeOperation = 'lighter'; g.globalAlpha = .35; g.drawImage(glowC, 0, 0, SZ / 4, ph / 4, x + wob, yy, s, h); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  // the bow / driver at the centre
  g.fillStyle = '#1a120a'; g.beginPath(); g.arc(x + wob + s / 2, yy + h / 2, 6 * dpr, 0, 7); g.fill();
  particles.update(1 / 60); particles.draw(g);

const particles = FX.particles();
// a clean ideal picture of a mode's nodal lines (targets and the book's thumbnails)
function modeImage(pl, md, size, c) {
  c = c || document.createElement('canvas'); c.width = c.height = size; const cg = c.getContext('2d'), im = cg.createImageData(size, size), hh = pl === 'rect' ? size / 2 : size, off = pl === 'rect' ? size / 4 : 0;
  for (let j = 0; j < hh; j++) for (let i = 0; i < size; i++) { const x = (i + .5) / size, y = (j + .5) / hh, o = ((j + off) * size + i) * 4; if (!insideP(pl, x, y)) continue; const z = Math.abs(md.z(x, y)) / (md.zmax ||= zmax(md)), v = z < .04 ? 1 : z < .08 ? .4 : 0; im.data[o] = 60 + 190 * v; im.data[o + 1] = 45 + 180 * v; im.data[o + 2] = 28 + 150 * v; im.data[o + 3] = 255; }

function zmax(md) { let m = 0; for (let j = 0; j < 40; j++) for (let i = 0; i < 40; i++) m = Math.max(m, Math.abs(md.z((i + .5) / 40, (j + .5) / 40))); return m || 1; }
const thumbs = new Map(); // id → data URL, rendered on demand, never saved
const thumb = (pl, md) => { if (!thumbs.has(md.id)) thumbs.set(md.id, modeImage(pl, md, 64).toDataURL()); return thumbs.get(md.id); };

// ================= audio =================
let ac = null, osc = null, gain = null, soundOn = false;
function startSound() {
  ac ||= new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume();
  osc = ac.createOscillator(); osc.type = 'sine'; osc.frequency.value = freq; gain = ac.createGain(); gain.gain.value = 0;
  const flt = ac.createBiquadFilter(); flt.type = 'lowpass'; flt.frequency.value = 5000; osc.connect(gain).connect(flt).connect(ac.destination); osc.start(); osc.flt = flt;
}
function stopSound() { if (!osc) return; const o = osc, gn = gain; gn.gain.setTargetAtTime(0, ac.currentTime, .03); o.stop(ac.currentTime + .2); o.onended = () => { o.disconnect(); gn.disconnect(); o.flt.disconnect(); }; osc = gain = null; }
let lastSnd = -1;
function updateSound() { if (!osc) return; const v = document.hidden ? 0 : .025 + .1 * focus.strength; if (Math.abs(v - lastSnd) < .002 && osc.frequency.value === freq) return; lastSnd = v; osc.frequency.setTargetAtTime(freq, ac.currentTime, .02); gain.gain.setTargetAtTime(v, ac.currentTime, .05); }

// ================= modes: explore / match =================
const targetsOf = pl => PLATES[pl].modes.filter((_, i) => i % 2 === 0).slice(0, 10);
const tgtIdx = () => { const n = targetsOf(plate).length, v = Math.floor(+SAVE.tgt[plate]); return v >= 0 && v < n ? v : 0; };
// the current target is the first unsolved one at or after the stored index (null when all are matched)
function curTarget() { const T = targetsOf(plate); for (let d = 0; d < T.length; d++) { const t = T[(tgtIdx() + d) % T.length]; if (!SAVE.solved[t.id]) return t; } return null; }
function advanceTarget() { const T = targetsOf(plate), t = curTarget(); if (t) SAVE.tgt[plate] = (T.indexOf(t) + 1) % T.length; }
function renderUI() {
  const P = PLATES[plate];
  $('story').innerHTML = SAVE.mode === 'explore'
    ? 'In 1787 Ernst Chladni bowed sand-covered metal plates and drew these figures, and Napoleon paid him to explain them. <b>Sweep the frequency.</b> At each <b>resonance</b> the plate sings and the sand runs to the lines that stay still.'
    : 'Find the frequency that draws the <b>target figure</b>. Patterns get more intricate as the pitch rises.';
  $('plates').innerHTML = Object.entries(PLATES).map(([k, p]) => `<button class="b ${k === plate ? 'on' : ''}" data-p="${k}">${p.n}</button>`).join('');
  $('modes').innerHTML = `<button class="b ${SAVE.mode === 'explore' ? 'on' : ''}" data-m="explore">Collect figures</button><button class="b ${SAVE.mode === 'match' ? 'on' : ''}" data-m="match">Match the figure</button>`;
  $('plates').querySelectorAll('[data-p]').forEach(b => b.onclick = () => setPlate(b.dataset.p));
  $('modes').querySelectorAll('[data-m]').forEach(b => b.onclick = () => { SAVE.mode = b.dataset.m; holdT = 0; persist(); FX.sfx('click'); renderUI(); });
  const got = P.modes.filter(md => SAVE.got[md.id]).length, t = SAVE.mode === 'match' ? curTarget() : null;
  if (SAVE.mode === 'explore') { $('goal').innerHTML = `📖 <b>${got}</b> of ${P.modes.length} figures on this plate collected. Hold a resonance until the sand settles to record it.`; $('target').style.display = 'none'; }
  else {
    const T = targetsOf(plate), solved = T.filter(x => SAVE.solved[x.id]).length;
    if (!t) { $('target').style.display = 'none'; $('goal').innerHTML = `🏆 <b>All matched!</b> You found all ${T.length} target figures on the ${P.n.toLowerCase()}. Try another plate.`; }
    else {
      modeImage(plate, t, 200, $('target')); $('target').style.display = 'block';
      $('goal').innerHTML = `🎯 Target ${T.indexOf(t) + 1} of ${T.length} (${solved} solved). Sweep until your sand matches this figure.<br><button class="b" id="skip">Skip target →</button>`;
      $('skip').onclick = () => { advanceTarget(); holdT = 0; persist(); FX.sfx('click'); renderUI(); };
    }
  }
  $('book').innerHTML = `<h4>Chladni's book · ${P.n} · ${got}/${P.modes.length}<span class="mob" style="float:right">✕</span></h4><div class="pg">${P.modes.map(md => `<div class="${SAVE.got[md.id] ? 'got' : ''} ${md === t ? 'tg' : ''}" title="${SAVE.got[md.id] ? md.name + ' · ' + Math.round(md.f) + ' Hz' : md === t ? 'target' : 'undiscovered'}">${SAVE.got[md.id] ? `<img alt="" src="${thumb(plate, md)}">` : '?'}</div>`).join('')}</div>`;
  layout();
}
function setPlate(p) { if (!PLATES[p]) return; plate = p; SAVE.plate = p; holdT = 0; persist(); sprinkle(); FX.sfx('click'); renderUI(); computeResponse(); }
// slider input only marks the response dirty: it is recomputed at most once per animation frame
$('slider').oninput = () => { freq = sliderToF(+$('slider').value); dirty = true; };
addEventListener('keydown', e => { if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && e.target.tagName !== 'INPUT') { const v = +$('slider').value + (e.key === 'ArrowRight' ? 1 : -1) * (e.shiftKey ? 10 : 1); $('slider').value = v; $('slider').oninput(); e.preventDefault(); } });
$('snd').onclick = () => { soundOn = !soundOn; $('snd').textContent = soundOn ? '🔊 Sound on' : '🔇 Sound off'; $('snd').setAttribute('aria-pressed', soundOn); lastSnd = -1; if (soundOn) startSound(); else stopSound(); };
$('sprinkle').onclick = () => { sprinkle(); holdT = 0; };
$('storyT').onclick = () => { const on = $('hud').classList.toggle('story'); $('storyT').setAttribute('aria-expanded', on); $('storyT').textContent = on ? 'Hide' : 'About'; layout(); };
$('bookT').onclick = () => { $('book').classList.toggle('open'); FX.sfx('click'); };
$('book').onclick = () => narrow() && $('book').classList.remove('open');
function toast(big, small, ms = 3000) { const t = $('toast'); t.innerHTML = big + (small ? `<small>${small}</small>` : ''); t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms); }

// ================= loop =================
let last = performance.now(), shownF = -1, shownS = -1, raf = 0;
const HOLD_TOL = .015; let shownL = '';
function record(md) {
  const cx = plateBox.x + plateBox.s / 2, cy = plateBox.y + plateBox.s / 2;
  if (SAVE.mode === 'explore') {
    if (SAVE.got[md.id]) return;
    SAVE.got[md.id] = 1; persist(); FX.sfx('chime', Object.keys(SAVE.got).length); FX.shake(.15);
    particles.burst(cx, cy, { n: 70, color: ['#ffd27a', '#fff2cf'], speed: 360 * dpr, life: 1 });
    toast('New figure', `${PLATES[plate].n}: ${md.name}, ${Math.round(md.f)} Hz`); renderUI();
  } else {
    const t = curTarget(); if (!t) return;
    if (md === t) {
      SAVE.solved[t.id] = 1; SAVE.got[md.id] = 1; advanceTarget(); persist(); FX.sfx('win'); FX.shake(.25);
      particles.burst(cx, cy, { n: 120, color: ['#ffd27a', '#fff2cf', '#ff8a5c'], speed: 420 * dpr, life: 1.1 });
      const done = !curTarget(); toast(done ? '🏆 All matched!' : '✓ Matched', done ? `Every target on the ${PLATES[plate].n.toLowerCase()}.` : `${Math.round(md.f)} Hz. Next figure…`, done ? 4000 : 3000); renderUI();
    } else if (!SAVE.solved[md.id]) { FX.sfx('fail'); toast('Not that one', `That's ${md.name}. The target sings <b>${t.f > md.f ? 'higher' : 'lower'}</b>: sweep ${t.f > md.f ? 'right →' : '← left'}.`, 2600); }
  }
}
function frame(now) {
  raf = requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (dirty) computeResponse();
  shake(Math.max(1, Math.min(8, Math.round(dt * 180)))); // ~180 sand steps per second, whatever the frame rate
  const fr = Math.round(freq); if (fr !== shownF) { shownF = fr; $('freq').firstChild.nodeValue = fr; }
  const st = Math.round(focus.strength * 100); if (st !== shownS) { shownS = st; $('meter').firstChild.style.transform = `scaleX(${st / 100})`; }
  updateSound();
  // record once the sand has really settled on the nodal lines (average shaking where the grains sit, judged
  // against this field's own uniform vs settled levels), or after a long steady hold right on the resonance
  let settle = 0; for (let i = 0; i < 1500; i++) { const k = (Math.random() * NS) | 0, gi = Math.min(GRID - 1, sx[k] * GRID | 0), gj = Math.min(GRID - 1, sy[k] * GRID | 0); settle += AMP[gj * GRID + gi]; } settle /= 1500;
  // a figure only counts when the dial is HELD near the resonance: drifting more than ±1.5% restarts the clock,
  // so sweeping slowly past a resonance never records it
  if (holdT > 0 && Math.abs(Math.log(freq / holdF)) > HOLD_TOL) holdT = 0;
  if (focus.strength > .55) { if (holdT === 0) holdF = freq; holdT += dt; } else holdT = 0;
  const lbl = holdT > .3 ? 'hold steady…' : 'resonance'; if (lbl !== shownL) { shownL = lbl; $('resLbl').textContent = lbl; $('resLbl').style.color = holdT > .3 ? '#ffd27a' : ''; } // feedback that holding is working
  if ((holdT > 2 && settle < focus.thr) || (holdT > 3.5 && focus.strength > .9)) { holdT = -3; record(PLATES[plate].modes[focus.k]); }
  draw(now);
}
// no work at all while the tab is hidden
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; updateSound(); } else if (!raf) { last = performance.now(); raf = requestAnimationFrame(frame); } });
$('slider').value = fToSlider(freq);
sprinkle(true); renderUI(); computeResponse();
raf = requestAnimationFrame(frame);
window.__ch = { PLATES, setFreq: f => { freq = f; $('slider').value = fToSlider(f); computeResponse(); }, setPlate, focus: () => focus, SAVE, get plate() { return plate; }, curTarget, targetsOf, get holdT() { return holdT; }, record, HOLD_TOL };
</script>
