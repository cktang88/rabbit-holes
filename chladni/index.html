<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chladni: Sand Score</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  /* Chladni's workshop, Wittenberg 1787: laid paper and iron-gall ink, a brass plate on a walnut bench. */
  :root{--ink:#2b1d10;--ink2:#5b4630;--paper:#efe3c6;--brass:#c9a25a;--brass2:#7b5a24;--rosin:#a8541e;--line:#8a6d3f;

  html,body{height:100%;overflow:hidden;background:#1a110a;font-family:"Cormorant Garamond",Georgia,serif;color:var(--ink)}
  body{display:flex;flex-direction:column}

  #cv{position:absolute;inset:0;width:100%;height:100%;display:block}
  #panel{width:360px;overflow:auto;padding:10px 12px 14px;border-left:2px solid #120b05;

  .b{border:1px solid #5a4018;background:linear-gradient(#e6c47c,#b18636 55%,#94701f);color:#2a1a06;font:600 16px "Cormorant Garamond",Georgia,serif;border-radius:2px;padding:4px 11px;cursor:pointer;

  .b.big{font-size:19px;padding:4px 16px}

  .clist .ch{font:400 15px "IM Fell English SC",serif;color:var(--ink2);margin-top:6px}

<body>
<div class="top"><a class="home" href="../index.html">← Rabbit Holes</a><h1>Chladni <i>· a score for sand</i></h1><span class="sp"></span><button class="b" id="listBtn">Commissions</button><button class="b" id="helpBtn" aria-label="How to play">?</button></div>
<main>
  <section id="stage" data-play><div id="view"><canvas id="cv"></canvas></div></section>
  <aside id="panel">
    <div id="comm"><canvas id="tgt" width="192" height="192" title="Hold to lay the target over the plate"></canvas><div style="min-width:0"><h2 id="cTitle"></h2><div id="cText"></div><div id="meter"></div></div></div>
    <div class="lbl"><span>Your score</span><span class="note" id="scoreNote"></span></div>
    <div id="score"></div>
    <div class="row" id="ctl"><button class="b big" id="playBtn">▶ Play</button><button class="b" id="clearBtn">Clear</button><span id="tools" class="row"></span><span class="sp" style="flex:1"></span><button class="b" id="nextBtn" style="display:none">Next ▶</button></div>
    <div class="lbl"><span>Notes of this plate</span><span class="note">tap to add · each pushes sand its own way</span></div>
    <div id="pal"></div>
  </aside>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script>
'use strict';
// ================= Sand Score =================
// A bowed plate moves sand: grains are thrown off the parts that move and drift down the slope of the vibration's
// energy (u²) until they rest on the nodal lines, where u = 0. Here you do not hunt for figures; you WRITE A SCORE:
// a short sequence of notes, each a mode of the plate held for a length of time. While a note sounds the sand flows
// along that mode's field, and it stops where it is when the note ends, so order and length both matter: C then E is
// not E then C. A commission shows a picture in sand; compose the score that draws it. Later the finger (which turns
// twin modes and silences others) and the drill and saw (new plate shapes, new modes, new fields) rewrite the vocabulary.
const G = 64, NS = 2400, BEAT_STEPS = 24, BEAT_MS = 300, KDRIFT = .004, KJIT = .03, VMAX = .018, MG = 16;
const DURS = [.25, .5, 1, 2], DUR_TXT = { .25: '¼', .5: '½', 1: '1', 2: '2' };
const NOTE_N = ['C', 'C♯', 'D', 'D♯', 'E', 'F', 'F♯', 'G', 'G♯', 'A', 'A♯', 'B'];
const noteName = f => { const n = Math.round(12 * Math.log2(f / 440)) + 69; return NOTE_N[n % 12] + (Math.floor(n / 12) - 1); };

// ---------- plates ----------
const inPoly = (P, x, y) => { let c = false; for (let i = 0, j = P.length - 1; i < P.length; j = i++) { const [xi, yi] = P[i], [xj, yj] = P[j]; if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) c = !c; } return c; };
const circ = (cx, cy, r, ry = r, n = 40) => Array.from({ length: n }, (_, i) => [cx + r * Math.cos(i / n * 2 * Math.PI), cy + ry * Math.sin(i / n * 2 * Math.PI)]);
const SHAPES = {
  square: { n: 'Square', polys: [[[0, 0], [1, 0], [1, 1], [0, 1]]] },
  circle: { n: 'Round', polys: [circ(.5, .5, .5)] },
  guitar: { n: 'Guitar', polys: [circ(.5, .29, .27, .22, 32), circ(.5, .69, .33, .27, 32), [[.33, .35], [.67, .35], [.67, .6], [.33, .6]]] },
  bell: { n: 'Bell', polys: [[[.36, .04], [.64, .04], [.72, .42], [.98, .96], [.02, .96], [.28, .42]]] },
  star: { n: 'Star', polys: [Array.from({ length: 10 }, (_, i) => { const r = i % 2 ? .24 : .5, a = i / 10 * 2 * Math.PI - Math.PI / 2; return [.5 + r * Math.cos(a), .53 + r * Math.sin(a)]; })] },
};
// the square plate, exactly: the classic cos·cos families (Chladni / Rayleigh), twins (n,m) and (m,n) split by a hair
const SQ = [];
for (let n = 0; n <= 4; n++) for (let m = n + 1; m <= 5; m++) for (const s of [1, -1]) {
  if (n === 0 && m === 1 && s === 1) continue;
  SQ.push({ id: `${n}${m}${s > 0 ? '+' : '-'}`, n, m, s, pair: `${n}${m}`, f: 46 * (n * n + m * m) * (s > 0 ? 1.012 : 1) * (1 + .021 * n + .004 * m),
    z: (x, y) => Math.cos(n * Math.PI * x) * Math.cos(m * Math.PI * y) + s * Math.cos(m * Math.PI * x) * Math.cos(n * Math.PI * y) });
}
SQ.sort((a, b) => a.f - b.f);
// any other outline (or a drilled square): the free-edge modes of the shape on a 32×32 grid, K u = λ M u with K the grid's
// stiffness between neighbours (a membrane-like stand-in for true plate bending: right nodal-line families, approximate pitches), Lanczos + QL
const DG = 32;
function tqli(d, e, m, z) {
  for (let i = 1; i < m; i++) e[i - 1] = e[i]; e[m - 1] = 0;
  for (let l = 0; l < m; l++) { let iter = 0, mm;
    do { for (mm = l; mm < m - 1; mm++) { const dd = Math.abs(d[mm]) + Math.abs(d[mm + 1]); if (Math.abs(e[mm]) <= 1e-12 * dd) break; }
      if (mm !== l) { if (iter++ > 60) break; let g = (d[l + 1] - d[l]) / (2 * e[l]), r = Math.hypot(g, 1); g = d[mm] - d[l] + e[l] / (g + (g >= 0 ? Math.abs(r) : -Math.abs(r))); let s = 1, c = 1, p = 0, i;
        for (i = mm - 1; i >= l; i--) { let f = s * e[i]; const b = c * e[i]; r = Math.hypot(f, g); e[i + 1] = r; if (r === 0) { d[i + 1] -= p; e[mm] = 0; break; } s = f / r; c = g / r; g = d[i + 1] - p; r = (d[i] - g) * s + 2 * c * b; p = s * r; d[i + 1] = g + p; g = c * r - b;
          for (let k = 0; k < m; k++) { f = z[k * m + i + 1]; z[k * m + i + 1] = s * z[k * m + i] + c * f; z[k * m + i] = c * z[k * m + i] - s * f; } }
        if (r === 0 && i >= l) continue; d[l] -= p; e[l] = g; e[mm] = 0; } } while (mm !== l); }
}
function solve(mask, nModes) {
  const idx = new Int32Array(DG * DG).fill(-1), cells = []; for (let c = 0; c < DG * DG; c++) if (mask[c]) { idx[c] = cells.length; cells.push(c); }
  const n = cells.length; if (n < 8) return [];
  const hh = c => 1 + .003 * Math.sin(c * 12.9898) * Math.cos(c * 4.1414); // a real plate is never perfectly even: twins split
  const isq = new Float64Array(n); for (let a = 0; a < n; a++) isq[a] = 1 / Math.sqrt(hh(cells[a]));
  const nb = []; for (let a = 0; a < n; a++) { const c = cells[a], i = c % DG, j = (c / DG) | 0, L = []; for (const [di, dj] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const ii = i + di, jj = j + dj; if (ii < 0 || jj < 0 || ii >= DG || jj >= DG) continue; const c2 = jj * DG + ii; if (!mask[c2]) continue; L.push([idx[c2], (hh(c) ** 3 + hh(c2) ** 3) / 2]); } nb.push(L); }
  const Av = (v, out) => { for (let a = 0; a < n; a++) { let s = 0; const va = v[a] * isq[a]; for (const [b, w] of nb[a]) s += w * (va - v[b] * isq[b]); out[a] = s * isq[a]; } };
  const m = Math.min(n, 140), Q = [], al = new Float64Array(m), be = new Float64Array(m + 1); let q = new Float64Array(n), r = new Float64Array(n);
  let rs = 12345; for (let a = 0; a < n; a++) { rs = (rs * 16807) % 2147483647; q[a] = rs / 2147483647 - .5; } let nq = 0; for (let a = 0; a < n; a++) nq += q[a] * q[a]; nq = Math.sqrt(nq); for (let a = 0; a < n; a++) q[a] /= nq;
  let mm = m;
  for (let k = 0; k < m; k++) { Q.push(q); Av(q, r); let a0 = 0; for (let a = 0; a < n; a++) a0 += q[a] * r[a]; al[k] = a0;
    for (const qq of Q) { let dp = 0; for (let a = 0; a < n; a++) dp += qq[a] * r[a]; for (let a = 0; a < n; a++) r[a] -= dp * qq[a]; }
    let b = 0; for (let a = 0; a < n; a++) b += r[a] * r[a]; b = Math.sqrt(b); be[k + 1] = b; if (b < 1e-10) { mm = k + 1; break; }
    q = new Float64Array(n); for (let a = 0; a < n; a++) q[a] = r[a] / b; r = new Float64Array(n); }
  const d = al.slice(0, mm), e = new Float64Array(mm); for (let k = 1; k < mm; k++) e[k] = be[k]; const z = new Float64Array(mm * mm); for (let k = 0; k < mm; k++) z[k * mm + k] = 1;
  tqli(d, e, mm, z);
  const order = Array.from({ length: mm }, (_, k) => k).sort((a, b) => d[a] - d[b]), modes = [];
  for (const k of order) { if (d[k] < 1e-6) continue;
    const u = new Float32Array(DG * DG); let mx = 0;
    for (let a = 0; a < n; a++) { let s = 0; for (let j2 = 0; j2 < mm; j2++) s += Q[j2][a] * z[j2 * mm + k]; const v = s * isq[a]; u[cells[a]] = v; if (Math.abs(v) > mx) mx = Math.abs(v); }
    for (let c = 0; c < u.length; c++) u[c] /= mx || 1;
    modes.push({ lam: d[k], u }); if (modes.length >= nModes) break; }
  return modes;
}
// a plate = outline + drilled holes. Its masks on the field grid, and its modes (each sampled on G×G, max |u| = 1)
const PLATES = {};
const plateKey = (shape, holes) => shape + (holes && holes.length ? ':' + holes.map(h => h.map(v => v.toFixed(3)).join(',')).join(';') : '');
const HOLE_R = .07;
function plateOf(shape, holes = []) {
  const key = plateKey(shape, holes); if (PLATES[key]) return PLATES[key];
  const S = SHAPES[shape], inside = (x, y) => S.polys.some(P => inPoly(P, x, y)), holed = (x, y) => holes.some(([hx, hy]) => (x - hx) ** 2 + (y - hy) ** 2 < HOLE_R * HOLE_R);
  const outline = new Uint8Array(G * G), mask = new Uint8Array(G * G);
  for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) { const x = (i + .5) / G, y = (j + .5) / G; if (inside(x, y)) { outline[j * G + i] = 1; if (!holed(x, y)) mask[j * G + i] = 1; } }
  let modes;
  if (shape === 'square' && !holes.length) modes = SQ.slice(0, 14).map(md => { const u = new Float32Array(G * G); let mx = 0; for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) { const v = md.z((i + .5) / G, (j + .5) / G); u[j * G + i] = v; mx = Math.max(mx, Math.abs(v)); } for (let c = 0; c < u.length; c++) u[c] /= mx; return { id: md.id, f: md.f, pair: md.pair, u }; });
  else {
    const dm = new Uint8Array(DG * DG); for (let j = 0; j < DG; j++) for (let i = 0; i < DG; i++) { const x = (i + .5) / DG, y = (j + .5) / DG; if (inside(x, y) && !holed(x, y)) dm[j * DG + i] = 1; }
    const sol = solve(dm, 14), lam0 = sol[0]?.lam || 1;
    modes = sol.map((s, k) => { const u = new Float32Array(G * G); let mx = 0;
      for (let j = 0; j < G; j++) for (let i = 0; i < G; i++) { if (!mask[j * G + i]) continue; const gx = (i + .5) / G * DG - .5, gy = (j + .5) / G * DG - .5, i0 = Math.max(0, Math.min(DG - 2, Math.floor(gx))), j0 = Math.max(0, Math.min(DG - 2, Math.floor(gy))), fx = Math.min(1, Math.max(0, gx - i0)), fy = Math.min(1, Math.max(0, gy - j0));
        const at = (a, b) => s.u[b * DG + a]; const v = (at(i0, j0) * (1 - fx) + at(i0 + 1, j0) * fx) * (1 - fy) + (at(i0, j0 + 1) * (1 - fx) + at(i0 + 1, j0 + 1) * fx) * fy; u[j * G + i] = v; mx = Math.max(mx, Math.abs(v)); }
      for (let c = 0; c < u.length; c++) u[c] /= mx || 1; return { id: 'm' + k, f: s.lam / lam0, lam: s.lam, u }; });
    modes.forEach((md, k) => { const nx = modes[k + 1], pv = modes[k - 1]; if (nx && nx.lam / md.lam < 1.03) md.pair = nx.pair = 'p' + k; else if (!md.pair && pv && md.lam / pv.lam < 1.03) md.pair = pv.pair = 'p' + (k - 1); });
  }
  // what you hear: each mode's pitch, squeezed into a singable range (the order of the notes is the plate's own)
  const f0 = modes[0]?.f || 1; modes.forEach(md => { md.hz = 130 * Math.pow(md.f / f0, .55); });
  return (PLATES[key] = { key, shape, holes, outline, mask, modes });
}
// ---------- fields: the slope a mode gives the sand. With a finger on the plate, twin modes mix so the finger sits on a nodal
// line (the figure turns to put a line through it), and a mode that moves a lot under the finger is choked dead. ----------
const FIELDS = {};
function fieldOf(pl, k, finger) {
  const key = pl.key + '|' + k + '|' + (finger ? finger.map(v => v.toFixed(3)).join(',') : ''); if (FIELDS[key]) return FIELDS[key];
  const md = pl.modes[k], at = (u, x, y) => u[Math.min(G - 1, Math.max(0, Math.floor(y * G))) * G + Math.min(G - 1, Math.max(0, Math.floor(x * G)))];
  let u = md.u, dead = false;
  if (finger) {
    const tw = md.pair && pl.modes.find((m2, j) => j !== k && m2.pair === md.pair);
    if (tw) { const a = at(md.u, ...finger), b = at(tw.u, ...finger), n = Math.hypot(a, b); if (n > .02) { u = new Float32Array(G * G); let mx = 0; for (let c = 0; c < u.length; c++) { u[c] = (b * md.u[c] - a * tw.u[c]) / n; mx = Math.max(mx, Math.abs(u[c])); } for (let c = 0; c < u.length; c++) u[c] /= mx || 1; } }
    else if (Math.abs(at(md.u, ...finger)) > .3) dead = true;
  }
  const P = new Float32Array(G * G), gx = new Float32Array(G * G), gy = new Float32Array(G * G), mask = pl.mask;
