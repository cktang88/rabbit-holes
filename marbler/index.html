<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Marbler</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+SC:wght@600&display=swap" rel="stylesheet">
<style>
  /* An Istanbul marbler's workshop at dusk: a walnut trough of size under a brass lamp, inks in porcelain cups. */
  :root{--paper:#efe4cc;--ink:#231812;--ink2:#6b5440;--red:#8e2a1c;--brass:#c79a4a;--brass2:#7b5a24}
  html,body{height:100%;margin:0;overflow:hidden;background:#140d09}
  body{font-family:"Cormorant Garamond",Georgia,serif;color:var(--paper);display:flex;flex-direction:column;height:100dvh}
  header{display:flex;align-items:center;gap:10px;padding:6px 12px;position:relative;z-index:3;background:linear-gradient(#1d130dee,#1d130d00)}
  header a.home{color:#cdb48e;text-decoration:none;font-size:15px}
  h1{font:600 27px/1 "Cormorant SC",serif;margin:0;color:#e9c987;letter-spacing:.08em;text-shadow:0 1px 0 #000}
  .sp{flex:1}
  button{font:600 16px "Cormorant Garamond",serif;color:var(--ink);background:linear-gradient(#f3e8cf,#d9c49b);border:1px solid #6d4f25;border-radius:3px;padding:5px 12px;min-height:36px;cursor:pointer;box-shadow:0 2px 0 #3d2a12,inset 0 1px 0 #fff9}
  button:active{transform:translateY(1px)} button:disabled{opacity:.45}
  button.lay{background:linear-gradient(#a33a26,#6e1d10);color:#fbeedb;border-color:#3e0f06}
  #card{margin:0 12px 6px;padding:6px 10px;display:flex;gap:10px;align-items:center;color:var(--ink);background:linear-gradient(#f4ead4,#e5d3ad);border:1px solid #6d4f25;box-shadow:0 4px 14px #000a;font-size:16px;line-height:1.2;position:relative;z-index:3}
  #card .n{font:600 20px "Cormorant SC",serif;color:var(--red);white-space:nowrap}
  #card .t{flex:1;min-width:0}
  #card .t small{display:block;color:var(--ink2);font-style:italic;font-size:13.5px}
  #peek{flex:none;display:flex;flex-direction:column;align-items:stretch;padding:3px;gap:2px;min-height:0;background:linear-gradient(#3a271a,#24170e);border:1px solid #120a05;border-radius:4px;cursor:pointer;touch-action:none;box-shadow:0 2px 0 #000}
  #peek:hover{filter:brightness(1.15)} #peek[aria-pressed="true"]{background:linear-gradient(#c79a3c,#8a6420);box-shadow:0 0 0 2px #f3d27a,0 0 14px #f3c35a}
  #peekL{font:600 13px/1.1 "Cormorant Garamond",serif;color:#f3e2bd;text-align:center;letter-spacing:.03em} #peek[aria-pressed="true"] #peekL{color:#2a1a08}
  #thumb{width:84px;height:56px;display:block;border:1px solid #6d4f25;box-shadow:inset 0 0 6px #0005;image-rendering:auto;pointer-events:none}
  #peekBanner{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;padding:6px 14px;background:#f3d27aee;color:#2a1a08;font:600 16px "Cormorant Garamond",serif;border-radius:3px;box-shadow:0 3px 10px #000a;pointer-events:none;display:none;white-space:nowrap}
  #meter{font-size:13.5px;color:var(--ink2);text-align:right;white-space:nowrap;flex:none} #meter b{font-size:19px;color:var(--ink);display:block}
  #stage{flex:1;min-height:0;position:relative}
  #gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #hint{position:absolute;left:50%;top:82%;transform:translate(-50%,-50%);font:italic 600 22px "Cormorant Garamond",serif;color:#f6e7c8;text-shadow:0 1px 3px #000,0 0 12px #000;pointer-events:none;transition:opacity .6s}
  #tools{display:flex;align-items:center;gap:6px;justify-content:center;padding:6px 8px 10px;flex:none;position:relative;z-index:3;flex-wrap:wrap}
  .cup{width:34px;height:34px;border-radius:50%;padding:0;min-height:0;border:2px solid #2a1a10;box-shadow:inset 0 -4px 6px #0006,inset 0 3px 4px #fff5,0 2px 0 #000;flex:none}
  .cup.on{outline:2px solid #e9c987;outline-offset:2px}
  .tool{width:46px;height:42px;padding:0;min-height:0;display:flex;align-items:center;justify-content:center;flex:none;background:linear-gradient(#3a271a,#24170e);border-color:#120a05;box-shadow:inset 0 1px 0 #fff2,0 2px 0 #000}
  .tool svg{width:30px;height:30px;stroke:#e6cf9c;fill:none;stroke-width:1.6;stroke-linecap:round}
  .tool.on{background:linear-gradient(#7b5a24,#4a3410);box-shadow:inset 0 0 0 1px #e9c987}
  .tool.locked{opacity:.25;pointer-events:none}
  .div{width:1px;height:30px;background:#5a4128;margin:0 3px}
  #book{position:fixed;inset:0;z-index:50;background:#000b;display:none;align-items:center;justify-content:center}
  #book.on{display:flex}
  #leaf{width:min(860px,96vw);max-height:92dvh;overflow:auto;color:var(--ink);padding:14px 20px 20px;background:linear-gradient(#f4ead4,#e2cfa6);border:1px solid #6d4f25;box-shadow:0 20px 60px #000;box-sizing:border-box;font-size:17px}
  #leaf h2{font:600 30px "Cormorant SC",serif;color:var(--red);margin:0}
  #tabs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0} #tabs button{font-size:15px;padding:3px 10px;min-height:32px} #tabs button.on{background:linear-gradient(#a33a26,#6e1d10);color:#fbeedb}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
  .com{background:#fffaf0aa;border:1px solid #8a6a3a;padding:6px;text-align:left;font-weight:500;min-height:0;box-shadow:none;color:var(--ink);display:flex;flex-direction:column;gap:4px}
  .com canvas{width:100%;aspect-ratio:3/2;border:1px solid #8a6a3a} .com b{font:600 17px "Cormorant SC",serif;color:var(--red)} .com small{color:var(--ink2);font-style:italic}
  .com.done{border-color:#3f6a3c;background:#e8efdc} .com:disabled{opacity:.5}
  .note{font-style:italic;color:var(--ink2)}
  .hist{display:flex;align-items:flex-end;gap:3px;height:60px;border-bottom:1px solid #6d4f25;margin-top:6px}
  .hist i{flex:1;background:#b39467;min-height:2px} .hist i.me{background:var(--red)}
  .hl{display:flex;justify-content:space-between;font-size:13px;color:var(--ink2);font-style:italic}
  textarea{width:100%;box-sizing:border-box;height:70px;font:12px monospace;background:#fffaf0;border:1px solid #8a6a3a}
  .modal{background:linear-gradient(#f4ead4,#e2cfa6);color:var(--ink);border:1px solid #6d4f25;border-radius:2px;font:17px/1.4 "Cormorant Garamond",serif}
  .modal h2{font:600 30px "Cormorant SC",serif;color:var(--red)} .modal .modal-actions{background:#e5d4ad}
  .toast-wrap{bottom:96px;top:auto} .toast{background:#f4ead4;color:var(--ink);border:1px solid #6d4f25;border-radius:2px;font:16px "Cormorant Garamond",serif}
  @media (max-width:640px){
    header{padding:4px 8px;gap:6px} h1{font-size:20px} header a.home{font-size:0} header a.home::before{content:"←";font-size:20px} .rh-like{display:none} header button{padding:4px 9px;font-size:15px}
    #card{margin:0 6px 4px;font-size:14px;gap:8px;padding:5px 8px} #card .n{font-size:16px} #card .t small{display:none} #thumb{width:66px;height:44px} #peekL{font-size:12px}
    #tools{gap:4px;padding:4px 4px 8px} .cup{width:30px;height:30px} .tool{width:40px;height:38px} .tool svg{width:26px;height:26px} .div{display:none}
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../index.html">← Rabbit Holes</a>
  <h1>Marbler</h1>
  <span class="sp"></span>
  <button id="layBtn" class="lay">Lay the paper</button>
  <button id="bookBtn">Book</button>
</header>
<div id="card"><button id="peek" title="Show the pattern in the bath (tap again to go back)" aria-pressed="false"><canvas id="thumb" width="168" height="112"></canvas><span id="peekL">👁 Compare</span></button><div class="t"><span class="n" id="cN"></span> <span id="cT"></span><small id="cE"></small></div><div id="meter"></div></div>
<div id="stage" data-play><div id="peekBanner">The pattern to match · tap “Back to bath” to return</div><canvas id="gl" aria-label="The marbling bath"></canvas><div id="hint">tap the bath</div></div>
<div id="tools" role="toolbar" aria-label="Inks and tools"></div>
<div id="book" role="dialog" aria-label="The book"><div id="leaf"></div></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script src="marble.js"></script>
<script>
'use strict';
const {TW,TH,MAXOPS,INKS,BATH,TOOLS,COMMISSIONS}=MB;
const FRAME=46;   // the walnut rim, in bath units
const $=(id)=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
// optical density of a pigment: Beer–Lambert, so overlapping and bleeding inks mix subtractively, as real pigments do
const dens=(rgb)=>rgb.map(c=>-Math.log(Math.max(.02,c)));

// ======================= WebGL2 =======================
const cv=$('gl'); const NOGL=/[?&]nogl\b/.test(location.search);
// some browsers refuse WebGL2 (graphics acceleration off, a blocklisted GPU, a lost context): retry plainly, then fall back to drawing on the CPU
const gl= NOGL? null : (cv.getContext('webgl2',{antialias:false, alpha:false, premultipliedAlpha:false, preserveDrawingBuffer:true}) || cv.getContext('webgl2'));
const C2= gl? null : cv.getContext('2d');
const FLOAT_RT=!!(gl && gl.getExtension('EXT_color_buffer_float'));
function sh(type, src){ const s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); if (!gl.getShaderParameter(s,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)+'\n'+src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n')); return s; }
function prog(vs, fs){ const p=gl.createProgram(); gl.attachShader(p,sh(gl.VERTEX_SHADER,vs)); gl.attachShader(p,sh(gl.FRAGMENT_SHADER,fs)); gl.linkProgram(p); if (!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p)); const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS); for (let i=0;i<n;i++){ const a=gl.getActiveUniform(p,i); u[a.name.replace(/\[0\]$/,'')]=gl.getUniformLocation(p,a.name); } return {p,u}; }
const VS_QUAD=`#version 300 es
in vec2 aP; void main(){ gl_Position=vec4(aP,0.,1.); }`;
// ---- the ink pass: every pixel is traced back through every move to the drop it came from ----
const FS_INK=`#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
uniform sampler2D uOps; uniform int uN; uniform float uT; uniform vec3 uInk[10]; uniform vec3 uBath;
uniform vec4 uView; uniform vec2 uJit; uniform float uRot;
out vec4 o;
const float PI=3.141592653589793;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y); }
void main(){
  vec2 fc=gl_FragCoord.xy+uJit;
  vec2 p=vec2((fc.x-uView.x)/uView.z, (uView.w-fc.y)/uView.z); if (uRot>.5) p=vec2(p.y, ${TH}.-p.x);
  if (p.x<-8.||p.y<-8.||p.x>${TW+8}.||p.y>${TH+8}.){ o=vec4(uBath,1.); return; }
  int found=-1; float rim=0.;
  for (int i=uN-1;i>=0;i--){
    vec4 a=texelFetch(uOps,ivec2(2*i,0),0); vec4 b=texelFetch(uOps,ivec2(2*i+1,0),0);
    float t=(i==uN-1)?uT:1.0; int ty=int(a.x+.5);
    if (ty==0){ vec2 d=p-a.yz; float L2=dot(d,d); float r=a.w*sqrt(t); if (L2<r*r){ found=int(b.x+.5); rim=sqrt(L2)/r; break; } p=a.yz+d*sqrt(1.-r*r/L2); }
    else if (ty<=3){ float al=ty==1?${TOOLS.stylus.alpha}.:ty==2?${TOOLS.comb.alpha}.:${TOOLS.rake.alpha}.; float la=ty==1?${TOOLS.stylus.lambda}.:ty==2?${TOOLS.comb.lambda}.:${TOOLS.rake.lambda}.; float sp=ty==2?${TOOLS.comb.spacing}.:ty==3?${TOOLS.rake.spacing}.:0.;
      float ang=a.w*PI/12., ac=mod(a.w,12.)*PI/12.; vec2 M=vec2(cos(ang),sin(ang)); vec2 Nc=vec2(-sin(ac),cos(ac));
      float d=dot(p-a.yz,Nc); if (sp>0.) d=d-sp*floor(d/sp+.5); d=abs(d); p-=M*(al*t*la/(d+la)); }
    else if (ty==4){ float ang=a.w*PI/12., ac=mod(a.w,12.)*PI/12.; vec2 M=vec2(cos(ang),sin(ang)); vec2 Nc=vec2(-sin(ac),cos(ac));
      float d=dot(p-a.yz,Nc); p-=M*(${TOOLS.wave.amp}.*t*sin(2.*PI*d/${TOOLS.wave.wavelength}.)); }
    else if (ty==6){ float ac=mod(a.w,12.)*PI/12.; vec2 Nc=vec2(-sin(ac),cos(ac)); float d=dot(p-a.yz,Nc), h=b.x*t; if (abs(d)<h){ found=int(b.y+.5); rim=abs(d)/h; break; } p-=Nc*sign(d)*h; }
    else { vec2 d=p-a.yz; float r=length(d); float th=-a.w*${TOOLS.swirl.alpha}*t*${TOOLS.swirl.lambda}./(r+${TOOLS.swirl.lambda}.); float c=cos(th), s=sin(th); p=a.yz+vec2(d.x*c-d.y*s, d.x*s+d.y*c); }
  }
  vec3 D = found<0 ? uBath : uInk[found];
  // pigment does not sit evenly: it granulates, and gathers at the rim of a drop. Both ride along with the flow.
  float fi=float(found);
  float g=noise(p*.17+fi*13.1)*.6+noise(p*.6+fi*3.7)*.32+noise(p*1.7)*.08;
  // and where two inks meet, the ox-gall leaves a fine dark vein
  float m=clamp(.5+(g-.5)*.8+(found<0? 0. : .22*smoothstep(.5,.92,rim)+.45*smoothstep(.93,.995,rim)-.08),0.,1.);
  o=vec4(D*0.25,m);
}`;
// ---- the bath, lit: walnut trough, size with a glossy skin, a meniscus at the rim, caustics, a lamp and a window ----
const FS_BATH=`#version 300 es
precision highp float; precision highp sampler2D;
uniform sampler2D uInk; uniform vec2 uRes; uniform vec4 uView; uniform float uRot; uniform float uTime; uniform float uPeel; uniform float uPeelOn; uniform float uScale;
out vec4 o;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),mix(hash(i+vec2(0,1)),hash(i+1.),f.x),f.y); }
float fbm(vec2 p){ float s=0., a=.5; for (int i=0;i<5;i++){ s+=a*noise(p); p=p*2.03+vec2(1.7,9.2); a*=.5; } return s; }
float sdBox(vec2 p, vec2 b, float r){ vec2 q=abs(p)-b+r; return length(max(q,0.))+min(max(q.x,q.y),0.)-r; }
vec3 D(vec2 uv){ vec4 t=texture(uInk,uv); return t.rgb*4.*(.74+.52*t.a); }
vec2 W(vec2 fc){ vec2 d=vec2((fc.x-uView.x)/uView.z, (uView.w-fc.y)/uView.z); return uRot>.5? vec2(d.y, ${TH}.-d.x) : d; }
// a caustic net: light focused by the slow ripples of the size onto the tray floor
float caustic(vec2 p, float t){ float c=0.; vec2 q=p; for (int i=0;i<3;i++){ q+=vec2(sin(q.y*1.7+t*.6),cos(q.x*1.5-t*.5))*.45; c+=pow(abs(sin(q.x)*sin(q.y)),.5); q*=1.8; } return c/3.; }
// the room, as the glossy skin reflects it: a tall window with mullions, warm dusk walls, the lamp
vec3 env(vec3 r){ vec2 e=r.xy/max(.2,r.z); vec3 wall=mix(vec3(.10,.07,.05),vec3(.25,.18,.12),smoothstep(-1.,1.,e.y));
  vec2 w=e-vec2(-.55,-.62); float win=smoothstep(.09,-.05,sdBox(w,vec2(.34,.48),.06)); float mull=smoothstep(.03,.0,min(abs(w.x),abs(w.y+.1)))*win;
  vec3 sky=mix(vec3(1.9,1.6,1.2),vec3(1.1,1.3,1.6),smoothstep(-.4,.5,w.y))*2.2;
  vec3 lamp=vec3(1.,.82,.55)*exp(-dot(e-vec2(.62,-.55),e-vec2(.62,-.55))*40.)*2.5;
  return mix(wall, sky, win*(1.-mull*.85))+lamp; }
vec3 tonemap(vec3 x){ x*=1.05; return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.); }
void main(){
  vec2 fc=gl_FragCoord.xy, uv=fc/uRes; vec2 w=W(fc); vec2 q=w-vec2(${TW/2}.,${TH/2}.);
  float px=1./uView.z;   // one screen pixel, in bath units
  float sIn=sdBox(q,vec2(${TW/2}.,${TH/2}.),3.), sOut=sdBox(q,vec2(${TW/2+FRAME}.,${TH/2+FRAME}.),14.);
  vec3 col;
  vec3 L=normalize(vec3(.45,-.55,.7));     // the brass lamp, upper right
  if (sOut>0.){ // the work table: oxblood leather under the lamp
    float n=fbm(w*.03)*.6+fbm(w*.18)*.4; col=vec3(.12,.045,.03)*(.7+.6*n);
    col*=.55+.9*exp(-dot(q,q)/(900.*900.));
    col*=1.-.65*exp(-max(sOut,0.)/30.)*smoothstep(-5.,30.,sOut);   // the trough's shadow
  } else if (sIn>0.){ // the walnut rim, bevelled
    bool side=abs(q.x)/${TW/2+FRAME}.>abs(q.y)/${TH/2+FRAME}.;
    vec2 g= side? w.yx : w.xy; float grain=fbm(vec2(g.x*.02, g.y*.5))*.7+fbm(vec2(g.x*.05,g.y*2.))*.3;
    float rings=sin(g.y*.9+grain*9.)*.5+.5;
    col=mix(vec3(.17,.09,.05),vec3(.36,.21,.11),grain)*(0.8+.25*rings);
    float tIn=sIn, tOut=-sOut; float bev=smoothstep(0.,10.,tIn)*smoothstep(0.,10.,tOut);
    vec2 gd=normalize(q+.001); vec3 nn=normalize(vec3(gd*(tIn<10.?-.9:(tOut<10.?.9:0.))*(1.-bev),1.));
    col*= .55+.6*max(dot(nn,L),0.); col+=pow(max(dot(reflect(-L,nn),vec3(0,0,1)),0.),40.)*.25*vec3(1.,.85,.6);
    // brass corner caps
    vec2 cq=abs(q)-vec2(${TW/2+FRAME/2}.,${TH/2+FRAME/2}.); float cap=length(cq);
    if (cap<16.){ vec3 cn=normalize(vec3(cq/16.,.6)); col=vec3(.62,.45,.18)*(.4+.8*max(dot(cn,L),0.))+pow(max(dot(reflect(-L,cn),vec3(0,0,1)),0.),30.)*vec3(1.,.9,.6); }
    col*=1.-.5*smoothstep(4.,0.,tIn);   // the inner lip is in shadow
  } else { // the bath
    float e=-sIn;    // distance to the wall
    // the meniscus: size climbs the walnut a few units, tilting the skin
    float men=exp(-e/7.);
    vec2 wallN=normalize(q/vec2(${TW/2}.,${TH/2}.)+1e-4);
    // slow ripples of the thick size
    float t=uTime*.35; vec2 rp=w*.035;
    float h1=fbm(rp+vec2(t,-t*.7)), h2=fbm(rp*1.7-vec2(t*.6,t));
    vec2 rip=vec2(h1-fbm(rp+vec2(t,-t*.7)+vec2(.03,0.)), h2-fbm(rp*1.7-vec2(t*.6,t)+vec2(0.,.03)))*1.8;
    // refraction near the rim pulls the ink image toward the wall
    vec2 duv=(-wallN*men*3.5*px + rip*.6*px)/uRes*uView.z;
    vec2 s=uv+duv; float tx=1./uRes.x, ty=1./uRes.y;
    // a breath of bleed: inks feather into their neighbours, mixing as pigments do (densities add)
    vec3 d0=D(s), d1=D(s+vec2(tx,0)), d2=D(s-vec2(tx,0)), d3=D(s+vec2(0,ty)), d4=D(s-vec2(0,ty));
    vec3 dd=d0*.44+(d1+d2+d3+d4)*.14;
    if (uPeelOn>.5) col*=1.;
    if (uPeelOn>.5 && w.x<uPeel) dd=mix(vec3(${BATH.map(c=>(-Math.log(c)).toFixed(3)).join(',')}), dd, .1);   // the paper took the ink
    vec3 R=exp(-dd);
    // the ink film is a hair thicker than the size: edges between inks catch the light
    vec3 gx=d1-d2, gy=d3-d4; vec2 film=vec2(gx.r+gx.g+gx.b, gy.r+gy.g+gy.b)*.06;
    vec3 n=normalize(vec3(rip*.35 - film + wallN*men*1.6, 1.));
    float bare=smoothstep(.25,.05,length(dd-vec3(${BATH.map(c=>(-Math.log(c)).toFixed(3)).join(',')})));
    // the floor of the tray glows faintly through the size: a caustic shimmer
    float ca=caustic(w*.045+rip*2., uTime*.8);
    vec3 lit=R*(.82+.22*max(dot(n,L),0.)) * vec3(1.03,.98,.9);
    lit*=1.+(ca-.55)*(.05+.07*bare);
    // the glossy skin: Fresnel reflection of the room, and the lamp's highlight
    vec3 V=normalize(vec3(-q*.0016,1.)); vec3 r=reflect(-V,n);
    float fr=.035+.965*pow(1.-max(dot(n,V),0.),5.);
    vec3 refl=env(r); col=lit*(1.-fr)+refl*fr*2.;
    col+=pow(max(dot(reflect(-L,n),V),0.),180.)*vec3(1.,.86,.62)*1.3;

const dropR=(g)=>{ const cover=COM.judge==='cover'; return Math.round(Math.min(cover? 90 : 64, (cover? 22 : 10)+ (performance.now()-g.t0)/1000*(cover? 70 : 38))); };
// while a drop is held it grows; while a line tool is dragged, its line is shown
function liveGesture(){ if (!gesture) return; if (tool==='drop' && gesture.op){ gesture.op[3]=dropR(gesture); dirty=true; } }
setInterval(liveGesture, 33);
// tool preview: a thin brass line drawn in a 2D overlay
const ov=document.createElement('canvas'); ov.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none'; $('stage').appendChild(ov); const oc=ov.getContext('2d');
function drawOverlay(){ requestAnimationFrame(drawOverlay); const d=Math.min(2,devicePixelRatio||1), w=ov.clientWidth*d, h=ov.clientHeight*d; if (ov.width!==w||ov.height!==h){ ov.width=w; ov.height=h; } oc.setTransform(1,0,0,1,0,0); oc.clearRect(0,0,w,h);
  if (!gesture || tool==='drop') return; const g=gesture; oc.setTransform(d*cam.k,0,0,d*cam.k,d*cam.x,d*cam.y); if (ROT) oc.transform(0,1,-1,0,TH,0);
  oc.save(); oc.beginPath(); oc.rect(0,0,TW,TH); oc.clip(); oc.lineWidth=1.4/cam.k; oc.strokeStyle='rgba(255,236,190,.85)'; oc.shadowColor='rgba(0,0,0,.5)'; oc.shadowBlur=3;
  if (tool==='swirl'){ for (const r of [20,45,80]){ oc.beginPath(); oc.arc(MB.snapPos(g.x0),MB.snapPos(g.y0),r,0,7); oc.stroke(); } }
  else if (Math.hypot(g.x-g.x0,g.y-g.y0)>6){ const op=MB.strokeFromDrag(tool,g.x0,g.y0,g.x,g.y), a=MB.ANG(op[3]), m=[Math.cos(a),Math.sin(a)], n=[-Math.sin(MB.ANG(op[3]%12)),Math.cos(MB.ANG(op[3]%12))];
    const sp=tool==='comb'? TOOLS.comb.spacing : tool==='rake'? TOOLS.rake.spacing : 0; const offs= sp? Array.from({length:Math.ceil(800/sp)},(_,i)=>(i-Math.floor(400/sp))*sp) : [0];
    oc.setLineDash(tool==='wave'? [6/cam.k,4/cam.k] : []);
    for (const o of offs){ const px=op[1]+n[0]*o, py=op[2]+n[1]*o; oc.beginPath(); oc.moveTo(px-m[0]*900,py-m[1]*900); oc.lineTo(px+m[0]*900,py+m[1]*900); oc.stroke(); }
    oc.setLineDash([]); oc.fillStyle='rgba(255,236,190,.95)'; const ax=op[1]+m[0]*40, ay=op[2]+m[1]*40; oc.beginPath(); oc.moveTo(ax+m[0]*12,ay+m[1]*12); oc.lineTo(ax-m[1]*7,ay+m[0]*7); oc.lineTo(ax+m[1]*7,ay-m[0]*7); oc.fill(); }
  oc.restore(); }
requestAnimationFrame(drawOverlay);

// ======================= UI =======================
const ICON={band:'<path d="M3 15h24" stroke-width="4"/><path d="M3 9h24M3 21h24" stroke-width="1"/>', drop:'<circle cx="15" cy="17" r="7"/><circle cx="15" cy="17" r="3.5"/>', stylus:'<path d="M15 3v24"/><path d="M12 22l3 5 3-5"/>', comb:'<path d="M4 6h22"/><path d="M6 6v18M10 6v18M14 6v18M18 6v18M22 6v18M26 6v18"/>',
  rake:'<path d="M4 6h22"/><path d="M6 6v19M15 6v19M24 6v19"/>', wave:'<path d="M3 15c3-7 6-7 8 0s5 7 8 0 5-7 8 0"/>', swirl:'<path d="M15 15m-2 0a2 2 0 1 0 4 0a5 5 0 1 0-10 0a8 8 0 1 0 16 0a11 11 0 1 0-22 0"/>', undo:'<path d="M9 9l-5 5 5 5"/><path d="M4 14h13a8 8 0 0 1 0 16"/>', reset:'<path d="M24 9a10 10 0 1 0 2 8"/><path d="M25 3v7h-7"/>'};
function renderTools(){ const u=COM.tools, inks=COM.inks;
  $('tools').innerHTML= inks.map(k=>`<button class="cup ${k===ink?'on':''}" data-ink="${k}" style="background:radial-gradient(circle at 35% 30%,${rgbCss(INKS[k][1],1.25)},${rgbCss(INKS[k][1],.8)})" title="${INKS[k][0]}" aria-label="${INKS[k][0]} ink"></button>`).join('')
   +'<span class="div"></span>'+['drop','band','stylus','rake','comb','wave','swirl'].filter(t=>u.includes(t)).map(t=>`<button class="tool ${t===tool?'on':''}" data-tool="${t}" title="${TOOLS[t].n}: ${TOOLS[t].d}" aria-label="${TOOLS[t].n}"><svg viewBox="0 0 30 30">${ICON[t]}</svg></button>`).join('')
   +`<span class="div"></span><button class="tool" id="undoBtn" title="Undo" aria-label="Undo"><svg viewBox="0 0 30 30">${ICON.undo}</svg></button><button class="tool" id="resetBtn" title="Start over: clear the bath (undo brings it back)" aria-label="Start over"><svg viewBox="0 0 30 30">${ICON.reset}</svg></button>`; }
const rgbCss=(c,k)=>`rgb(${c.map(v=>Math.round(Math.min(1,v*k)*255)).join(',')})`;
$('tools').addEventListener('click', e=>{ const b=e.target.closest('button'); if (!b) return; if (b.id==='undoBtn') return undo(); if (b.id==='resetBtn') return reset(); if (b.dataset.ink){ ink=+b.dataset.ink; tool='drop'; } if (b.dataset.tool) tool=b.dataset.tool; renderTools(); FX.sfx('tick'); });
function renderCard(){ $('cN').textContent=COM.n; $('cT').textContent=COM.t; $('cE').textContent=COM.era||'';
  const best=SAVE.best[COM.id]; $('meter').innerHTML= COM.free? `${strokes()} moves` : `<b>${likeness==null?'–':Math.round(likeness*100)+'%'}</b>${COM.judge==='cover'? `covered of ${Math.round(COM.need*100)}% · ${strokes()} drops` : `alike · ${strokes()} strokes`}${best!=null?`<br>best ${best}`:''}`;
  $('peek').style.display= (COM.free || !COM.recipe && !COM.target)? 'none' : ''; }
// the pattern to match, drawn on the CPU from the same maths
function drawThumb(){ const c=$('thumb'), g=c.getContext('2d'); if (COM.free) return; const w=c.width, h=c.height, img=g.createImageData(w,h), T=MB.targetOps(COM);
  for (let j=0;j<h;j++) for (let i=0;i<w;i++){ const k=MB.inkAt(T,(i+.5)*TW/w,(j+.5)*TH/h), col=k<0? BATH : INKS[k][1], o=4*(j*w+i); img.data[o]=col[0]*255; img.data[o+1]=col[1]*255; img.data[o+2]=col[2]*255; img.data[o+3]=255; }
  g.putImageData(img,0,0); }
// Compare: a tap toggles the pattern into the bath; a long press peeks only while held
let peekT0=0, peekWas=false;
function setPeek(on){ holding=on; dirty=true; $('peek').setAttribute('aria-pressed', on); $('peekL').textContent= on? '✕ Back to bath' : '👁 Compare'; $('peekBanner').style.display= on? 'block':'none'; }
$('peek').addEventListener('pointerdown', e=>{ peekT0=performance.now(); peekWas=holding; if (!holding) setPeek(true); e.preventDefault(); });
for (const ev of ['pointerup','pointercancel']) $('peek').addEventListener(ev, ()=>{ if (!peekT0) return; const long=performance.now()-peekT0>450; peekT0=0; if (long || peekWas) setPeek(false); });
$('peek').addEventListener('keydown', e=>{ if (e.key==='Enter'||e.key===' '){ e.preventDefault(); setPeek(!holding); } });

// ======================= Laying the paper =======================
$('layBtn').onclick=()=>lay();
function lay(){ if (peel) return; if (!gl) return afterPeel();
  // print the whole tray at a fixed resolution, eight samples a pixel
  // one sample now, the other seven over the next frames (all of them at once stalls a phone's GPU for a second)
  uploadOps(ops); inkPass(printFB, PRINT_VIEW, ops.length, 1, 0, false); dirty=true;
  peel={t0:performance.now(), k:1, ops:ops.slice()}; FX.tone({noise:1,f:400,q:.4,dur:.6,vol:.08,attack:.2}); setTimeout(()=>FX.tone({noise:1,f:2400,q:.8,dur:1.4,vol:.05,attack:.4}),900); }
function afterPeel(){ const res= COM.free? null : MB.judge(COM, ops, targetCache), n=strokes(); let html, first=false;
  const code=MB.encode(COM.id, ops); SAVE.sheets.push(code); SAVE.sheets=SAVE.sheets.slice(-40);
  if (res){ const ok=res.ok; if (ok){ first=!passed(COM.id); SAVE.done[COM.id]=Math.max(SAVE.done[COM.id]||0, res.score); if (SAVE.best[COM.id]==null || n<SAVE.best[COM.id]) SAVE.best[COM.id]=n; if (COM.daily) SAVE.daily[COM.id.slice(6)]=`${Math.round(res.score*100)}% in ${n}`; }
    html=`<h2>${ok? 'A fine sheet' : 'Not quite the pattern'}</h2><p>${Math.round(res.score*100)}% alike in <b>${n}</b> strokes${ok?'':` (it needs ${Math.round(COM.need*100)}%)`}.</p>${ok? histHTML(COM,n) : `<p class="note">Hold the little picture on the card to see the pattern over your bath. Undo walks back one move at a time.</p>`}${first&&nextUnlock()? `<p class="note">${nextUnlock()}</p>`:''}`; }
  else html=`<h2>Your sheet</h2><p>${n} moves. It is in your portfolio, and a link carries it exactly.</p>`;
  persist(); renderCard();
  RH.modal(html,[{label:'Back to the bath'},{label:'Copy link'}].concat(res&&res.ok&&!COM.daily? [{label:'Next commission'}] : [])).then(l=>{ peel=null; dirty=true;
    if (l==='Copy link'){ try{ navigator.clipboard.writeText(shareText(res,n)); }catch(_){} RH.toast('Copied: a link to this exact sheet.'); }
    if (l==='Next commission'){ const i=COMMISSIONS.indexOf(COM); if (i<COMMISSIONS.length-1) open(COMMISSIONS[i+1]); } }); }
function nextUnlock(){ const i=COMMISSIONS.indexOf(COM), nx=COMMISSIONS[i+1]; if (!nx) return 'That was the last commission in the book. The free bath and the daily sheet remain.'; const nt=nx.tools.filter(t=>!COM.tools.includes(t)); return nt.length? `New tool in the box: the ${TOOLS[nt[0]].n.toLowerCase()}.` : `Next: ${nx.n}.`; }
// the workshop's estimate of how many strokes other marblers take for a pattern (synthetic: the master's count, and a spread above it)
function histOf(c){ if (!c.recipe) return null; const k=c.recipe.length, r=MB.rng('hist:'+c.id), h=[]; for (let s=k; s<=k+9; s++){ const base=Math.exp(-Math.pow(s-k-2.2,2)/6)*100+ (s===k? 18:0); h.push([s, Math.round(base*(.8+.4*r()))]); } return h; }
function histHTML(c,n){ const h=histOf(c); if (!h) return ''; const max=Math.max(...h.map(x=>x[1])); return `<p class="note" style="margin:6px 0 0">Strokes other marblers took for this paper (the workshop's estimate):</p><div class="hist">${h.map(([s,v])=>`<i class="${s===Math.min(n,h[h.length-1][0])?'me':''}" style="height:${Math.max(4,v/max*100)}%" title="${s} strokes"></i>`).join('')}</div><div class="hl"><span>${h[0][0]} strokes (the master)</span><span>${h[h.length-1][0]}+</span></div>`; }
function shareText(res,n){ return `Marbler · ${COM.daily? 'daily '+COM.id.slice(6) : COM.n}${res? ` · ${Math.round(res.score*100)}% in ${n} strokes`:''}\n${location.origin+location.pathname}#s=${MB.encode(COM.id, ops)}`; }

// ======================= The Book =======================
let tab='com';
$('bookBtn').onclick=()=>{ $('book').classList.add('on'); drawBook(); }; $('book').addEventListener('click', e=>{ if (e.target.id==='book') $('book').classList.remove('on'); });
function drawBook(){ let h=`<div style="display:flex;align-items:center"><h2 style="flex:1">The Marbler's Book</h2><button data-x="close">Close</button></div><div id="tabs">${[['com','Commissions'],['daily','Daily sheet'],['free','Free bath'],['folio','Portfolio'],['save','Save']].map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</div>`;
  if (tab==='com'){ h+=`<p class="note">Historic papers to reproduce. The bath is slow and thick: every stroke can be pulled back exactly.</p><div class="grid">`+COMMISSIONS.map((c,i)=>`<button class="com ${passed(c.id)?'done':''}" data-c="${c.id}" ${comOpen(i)?'':'disabled'}><canvas width="150" height="100" data-thumb="${comOpen(i)?c.id:''}"></canvas><b>${comOpen(i)? c.n : '· · ·'}</b><small>${comOpen(i)? c.era : 'not yet'}${SAVE.best[c.id]!=null? ' · best '+SAVE.best[c.id]+' strokes':''}</small></button>`).join('')+'</div>'; }
  else if (tab==='daily'){ const k=today(); h+=`<p class="note">One paper a day, the same everywhere. Match it in as few strokes as you can.</p><p>Today: <b>${SAVE.daily[k]||'not yet'}</b></p><p><button data-daily="${k}">Open today's sheet</button></p>`; }
  else if (tab==='free'){ h+=`<p class="note">Your own ground, your own pattern: every ink and tool you have earned.</p><p><button data-free="1">Open the free bath</button></p>`; }
  else if (tab==='folio'){ h+= SAVE.sheets.length? `<p class="note">Your last ${SAVE.sheets.length} sheets. Each is a link that rebuilds it exactly.</p><div class="grid">`+SAVE.sheets.slice().reverse().map((s,i)=>`<button class="com" data-sheet="${s}"><canvas width="150" height="100" data-sheetthumb="${s}"></canvas><small>${(MB.decode(s)||{}).id||''}</small></button>`).join('')+'</div>' : '<p class="note">No sheets yet. Lay the paper on a bath.</p>'; }
  else h+=`<p class="note">Your book lives in this browser. Copy this text somewhere safe; paste it back to restore it.</p><textarea id="saveTxt">${btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))))}</textarea><p><button data-x="copy">Copy</button> <button data-x="restore">Restore</button> <span class="note" id="saveOut"></span></p>`;
  $('leaf').innerHTML=h;
  $('leaf').querySelectorAll('canvas[data-thumb]').forEach(c=>{ const cm=COMMISSIONS.find(x=>x.id===c.dataset.thumb); if (cm) cpuDraw(c, MB.targetOps(cm)); });
  $('leaf').querySelectorAll('canvas[data-sheetthumb]').forEach(c=>{ const m=MB.decode(c.dataset.sheetthumb); if (m) cpuDraw(c, m.ops); }); }
function cpuDraw(c, T){ const g=c.getContext('2d'), w=c.width, h=c.height, img=g.createImageData(w,h); for (let j=0;j<h;j++) for (let i=0;i<w;i++){ const k=MB.inkAt(T,(i+.5)*TW/w,(j+.5)*TH/h), col=k<0? BATH : INKS[k][1], o=4*(j*w+i); img.data[o]=col[0]*255; img.data[o+1]=col[1]*255; img.data[o+2]=col[2]*255; img.data[o+3]=255; } g.putImageData(img,0,0); }
$('leaf').addEventListener('click', e=>{ const b=e.target.closest('button'); if (!b) return; const close=()=>$('book').classList.remove('on');
  if (b.dataset.x==='close') return close(); if (b.dataset.tab){ tab=b.dataset.tab; return drawBook(); }
  if (b.dataset.c){ open(COMMISSIONS.find(c=>c.id===b.dataset.c)); return close(); }
  if (b.dataset.daily){ open(MB.daily(b.dataset.daily)); return close(); }
  if (b.dataset.free){ open(freeBath()); return close(); }
  if (b.dataset.sheet){ const m=MB.decode(b.dataset.sheet); if (m){ openShared(m); close(); } return; }
  if (b.dataset.x==='copy'){ try{ navigator.clipboard.writeText($('saveTxt').value); }catch(_){} $('saveOut').textContent='Copied.'; }
  if (b.dataset.x==='restore'){ try{ SAVE=cleanSave(JSON.parse(decodeURIComponent(escape(atob($('saveTxt').value.trim()))))); persist(); $('saveOut').textContent='Restored.'; }catch(_){ $('saveOut').textContent='That is not a saved book.'; } } });
// a link: the sheet's commission and every move
function comById(id){ return COMMISSIONS.find(c=>c.id===id) || (/^daily:\d{4}-\d\d-\d\d$/.test(id)? MB.daily(id.slice(6)) : id==='free'? freeBath() : null); }
function openShared(m){ const c=comById(m.id)||freeBath(); const g=c.ground.length; const same= m.ops.length>=g && JSON.stringify(m.ops.slice(0,g))===JSON.stringify(c.ground);
  if (same) open(c, m.ops.slice(g)); else { open(freeBath()); ops=m.ops.slice(); dirty=true; renderCard(); setHash(); } }
let hashT=0; function setHash(){ clearTimeout(hashT); hashT=setTimeout(()=>{ try{ history.replaceState(null,'',location.pathname+'#s='+MB.encode(COM.id, ops)); }catch(_){} }, 300); }

// ======================= Start =======================
(function boot(){
  if (!gl){ cv.style.imageRendering='auto'; if (!NOGL) RH.toast('Your browser turned down WebGL2, so the bath is drawn the simple way. For the full bath, switch on graphics acceleration (chrome://settings/system) and check chrome://gpu.', 9000); }
  else { try{ initGL(); } catch(e){ console.error(e); $('hint').textContent='The bath could not be lit: '+e.message.split('\n')[0]; } }
  const h=location.hash.slice(1); let done=false;
  if (h.startsWith('s=')){ const m=MB.decode(h.slice(2)); if (m){ openShared(m); done=true; } }
  if (!done){ const i=COMMISSIONS.findIndex((c,i)=>!passed(c.id)&&comOpen(i)); open(COMMISSIONS[Math.max(0,i)]); }
  requestAnimationFrame(()=>{ cam.fit(false); requestAnimationFrame(frame); });
})();
window.__mb={ MB, get ops(){ return ops; }, set ops(v){ ops=v; dirty=true; measure(); }, get COM(){ return COM; }, get SAVE(){ return SAVE; }, get likeness(){ return likeness; }, get anim(){ return anim; }, get peel(){ return peel; }, get tool(){ return tool; }, set tool(v){ tool=v; renderTools(); },
  cam, toW, get ROT(){ return ROT; }, open, push, undo, lay, afterPeel, cleanSave, comOpen, unlocked, freeBath, comById, openShared, gl, inkPass, uploadOps, get inkFB(){ return inkFB; }, printFB:()=>printFB, frameNow:(t)=>step(t), get dprScale(){ return dprScale; }, set dprScale(v){ dprScale=v; }, settle:()=>{ anim=null; dirty=true; }, get paused(){ return paused; }, set paused(v){ paused=v; }, renderNow:(n=1,t)=>{ for (let i=0;i<n;i++) step(t??performance.now()); gl.finish(); } };
</script>
