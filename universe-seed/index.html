<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universe Seed</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#000}
  main{flex:1;display:flex;min-height:0}
  #sky{flex:1;position:relative;min-width:0;cursor:pointer}
  #sky canvas{position:absolute;inset:0;width:100%;height:100%}
  #eraBox{position:absolute;top:14px;left:18px;pointer-events:none;max-width:60%}
  #eraBox .t{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ffb547}
  #eraBox .n{font-size:26px;font-weight:700;text-shadow:0 2px 12px #000}
  #eraBox .f{font-size:14px;color:#c9c4b8;max-width:520px;text-shadow:0 1px 6px #000;margin-top:4px}
  #clock{position:absolute;bottom:12px;left:18px;font-size:12px;color:#8a8f9c;pointer-events:none}
  #side{width:400px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px 4px;color:var(--dim);font-size:13px}
  .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--accent)}
  .pane{flex:1;overflow:auto;padding:10px;display:none}
  .pane.on{display:block}
  .res{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .res .r{color:var(--dim)} .res .v{text-align:right;font-weight:600} .res .ps{text-align:right;color:var(--dim);font-size:12px}
  .gen{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--panel2)}
  .gen .nm{font-weight:600;font-size:13px} .gen .d{font-size:11px;color:var(--dim)}
  .gen button{white-space:nowrap;font-size:12px;min-width:96px}
  .tierH{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:12px 0 5px}
  .locked{font-size:12px;color:var(--bad);padding:6px 8px;border:1px dashed #5a2a2a;border-radius:8px;margin-bottom:6px}
  .codex{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cx{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;background:var(--panel2);min-height:64px}
  .cx.got{border-color:#6b5a2a}
  .cx b{display:block;font-size:13px;margin-bottom:2px}
  .cx.no b{color:#444}
  .const{margin-bottom:12px}
  .const .opts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .const .opts button{font-size:12px;padding:3px 8px}
  .const .opts button.on{background:var(--accent);color:#1a1205}
  .endBtn{width:100%;margin-top:10px}
  @media (max-width:760px){
    body{height:auto;min-height:100vh;overflow:auto}
    main{flex-direction:column}
    #sky{flex:none;height:56vh}
    #side{width:auto;border-left:0;border-top:1px solid var(--line);min-height:70vh}
    #eraBox{max-width:92%} #eraBox .n{font-size:20px} #eraBox .f{font-size:12px}
    .topbar{flex-wrap:wrap}
  }
</style>

  .gen{background:transparent;border:0;border-bottom:1px solid #e6c36a22;border-radius:0;padding:6px 2px}
  .gen .nm{font-size:17px;font-weight:600;color:#ece3c8} .gen .d{font-size:13px;color:#a49b84;font-style:italic}

<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>Universe Seed</h1><span class="spacer"></span><span class="small dim" id="meta"></span></div>
<main>
  <div id="sky" data-play><canvas id="cv"></canvas>
    <div id="eraBox"><div class="t" id="eraT"></div><div class="n" id="eraN"></div><div class="f" id="eraF"></div></div>
    <button id="skipBtn">Skip to the end ›</button>
    <div id="why"></div>
    <div id="ribbon"></div>
  </div>
  <div id="side">
    <div class="stats" id="stats"></div>
    <div class="tabs"><button data-t="laws" class="on">Laws</button><button data-t="hist">History</button><button data-t="chal">Challenges</button><button data-t="atlas">Atlas</button></div>
    <div class="pane on" id="p-laws"></div>
    <div class="pane" id="p-hist"></div>
    <div class="pane" id="p-chal"></div>
    <div class="pane" id="p-atlas"></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
// ===================== The laws =====================
// Six constants, each with our value marked. Every option is available from the first universe.
const LAWS = [
  {k:'G', n:'Gravity', short:'Gravity', d:'How strongly everything pulls on everything else.', def:2,
    up:'Stronger: gas clumps fast, stars burn hot and die young. Too strong and stars crush into black holes.', down:'Weaker: clumping is slow, stars are cool and long-lived. Too weak and gas never ignites.',
    opts:[['0.1×',0.1,'Gas clouds never squeeze hard enough to light a star.'],['0.3×',0.3,'Stars are dim and patient: a sun lives about 100 billion years.'],['1×',1,'A sun lives about 10 billion years.'],['3×',3,'Stars are hot and short-lived: a sun lives about 1 billion years.'],['10×',10,'Every star collapses straight into a black hole.']]},
  {k:'L', n:'Dark energy Λ', short:'Dark energy', d:'A push built into empty space that makes the universe expand faster and faster.', def:2,
    up:'More: space flies apart before gas can gather into galaxies.', down:'Less: galaxies cluster freely. Negative: space eventually falls back in (a "big crunch").',
    opts:[['−1 (pulls)',-1,'Space slows, stops and falls back in: the universe ends in a crunch.'],['0',0,'Nothing pushes galaxies apart; they cluster tightly.'],['0.7 (ours)',0.7,'A gentle push that only wins after galaxies have formed.'],['3',3,'Galaxies only form where matter is dense.'],['10',10,'Space flies apart too fast for any galaxy to form.']]},
  {k:'a', n:'Fine-structure constant α', short:'α', d:'How strongly electric charges attract: the glue of atoms, chemistry and starlight.', def:1,
    up:'Stronger (1/80): bonds are sticky and chemistry is quick. Much stronger (1/40): atoms hold electrons too tightly to share.', down:'Weaker (1/300): atoms are fragile and chemistry slow.',
    opts:[['1/300',300,'Atoms are fragile; chemistry crawls, so life needs far longer.'],['1/137 (ours)',137,'Atoms bond and share electrons easily.'],['1/80',80,'Sticky bonds: chemistry runs fast, life starts sooner.'],['1/40',40,'Electrons are held too tightly to share: no complex molecules.']]},
  {k:'s', n:'Strong force', short:'Strong force', d:'The glue that holds protons and neutrons together in the nucleus.', def:1,
    up:'Stronger: protons stick to each other and hydrogen (the fuel of stars and water) burns away.', down:'Weaker: protons and neutrons cannot stick, so stars never fuse.',
    opts:[['0.9×',0.9,'A proton and a neutron cannot stick: no fusion, ever.'],['1× (ours)',1,'75% of matter stays hydrogen; stars burn it slowly.'],['1.05×',1.05,'Two protons can stick: most hydrogen burns away in minutes.'],['1.2×',1.2,'Every proton pairs off: no hydrogen, no water.']]},
  {k:'m', n:'Matter excess', short:'Matter', d:'How much matter was left over after matter and antimatter annihilated at the start.', def:1,
    up:'More: a crowded universe; galaxies form easily, even against dark energy.', down:'Less: a thin universe; gas struggles to gather.',
    opts:[['10⁻¹²',-12,'A hundred times less matter: thin gas that struggles to gather.'],['10⁻¹⁰ (ours)',-10,'One particle of matter survived per ten billion photons.'],['10⁻⁸',-8,'A hundred times more matter: a crowded universe.']]},
  {k:'D', n:'Space dimensions', short:'Space', d:'How many directions there are to move in.', def:1,
    up:'Four: gravity fades so fast with distance that no orbit is stable.', down:'Two: orbits work, but a creature with a gut would fall apart.',
    opts:[['2',2,'Flatland: stars and planets, but no complex bodies.'],['3 (ours)',3,'Stable orbits and room for plumbing.'],['4',4,'No stable orbits: planets spiral in or fly off.']]},
];
const OURS = Object.fromEntries(LAWS.map(l=>[l.k,l.def]));
const val = (c,k)=> LAWS.find(l=>l.k===k).opts[c[k]][1];
const changed = (c)=> LAWS.filter(l=>c[l.k]!==l.def).length;
const lawTag = (c,k)=>{ const l=LAWS.find(x=>x.k===k); return `${l.short} ${l.opts[c[k]][0].replace(/ \(.*\)/,'')}`; };
const lawStr = (c)=> LAWS.filter(l=>c[l.k]!==l.def).map(l=>`${l.n.split(' ')[0]} ${l.opts[c[l.k]][0]}`).join(' · ') || 'our laws';

// ===================== The history a set of laws allows =====================
// Each link in the causal chain is ok, weakened, or broken, with the physical reason.
// Numbers are order-of-magnitude scalings, not a cosmological code, but every link points the way the real argument does.
const STAGES = ['Baryogenesis','Nucleosynthesis','Recombination','Galaxies','First stars','Carbon','Planets','Life','Minds'];
const fmtT = (gyr)=> gyr>=1? `${gyr<10? gyr.toFixed(1) : Math.round(gyr)} billion years` : gyr>=1e-3? `${Math.round(gyr*1000)} million years` : `${Math.round(gyr*1e6)} thousand years`;
function simulate(c){
  const G=val(c,'G'), L=val(c,'L'), ainv=val(c,'a'), s=val(c,'s'), m=val(c,'m'), D=val(c,'D');
  const r = 137/ainv;                       // α relative to ours
  const rho = Math.pow(10, m+10);           // baryon density relative to ours
  const out = {stages:[], v:{}};
  // each link: status, the physics (why), a plain cause → effect line (plain), and the law that decided it (law)
  const st=(status, why, plain, law)=>{ out.stages.push({name:STAGES[out.stages.length], status, why, plain, law: law||null}); return status!=='broken'; };
  const v=out.v; const tag=(k)=> lawTag(c,k);
  // 1. Baryogenesis

function draw(){
  const now=performance.now(); const k=Math.max(0,stageAt(now)); const show = sel>=0? sel : k;
  const o=run? run.o : null;
  if (o){ const age=run.done||sel>=0? 1 : ((now-run.t0)%STEP_MS)/STEP_MS; let s=show; if (o.stages[s].status==='none') s=o.stages.findIndex(x=>x.status==='broken');
    drawScene(Math.max(0,s), o, age, now);
    if (!run.done && sel<0 && age<.35){ ctx.globalAlpha=1-age/.35; ctx.textAlign='center'; ctx.fillStyle=o.stages[s].status==='broken'? '#ffb3a6' : GOLD; ctx.shadowColor='#000'; ctx.shadowBlur=12; ctx.font=`300 ${Math.min(56,W/9)}px "Cormorant Garamond", serif`; ctx.fillText(STAGES[s], W/2, H*.5); ctx.shadowBlur=0; ctx.globalAlpha=1; }
  } else { // before the first bang: a quiet, unlit void
    ctx.fillStyle='#03041a'; ctx.fillRect(0,0,W,H); for (let i=0;i<60;i++){ const x=(i*97+now*0.006*(1+i%5))%W, y=(i*53+now*0.004*(1+i%7))%H; ctx.fillStyle=`rgba(255,240,210,${0.05+0.04*Math.sin(now/900+i)})`; ctx.beginPath(); ctx.arc(x,y,1+i%3,0,7); ctx.fill(); }
    label(W/2, H*.5, 'nothing yet: choose the laws, then press Bang', '#c8bd9c', 18);
  }
  drawPreviews(now);
  document.getElementById('skipBtn').classList.toggle('on', !!run && !run.done);
  requestAnimationFrame(draw);
}
const SND={ gong(v=1){ FX.tone({f:98,type:'sine',dur:3,vol:.22*v,attack:.01}); FX.tone({f:196.5,type:'sine',dur:2.2,vol:.08*v}); FX.tone({f:293,type:'sine',dur:1.4,vol:.04*v}); },
  stage(s){ if (s==='broken') { FX.tone({f:110,f2:70,type:'sine',dur:1.6,vol:.2}); FX.tone({f:116,type:'triangle',dur:1.2,vol:.05}); } else FX.tone({f:s==='ok'?784:659,type:'sine',dur:.9,vol:.07}); },
  chord(){ [523,659,784,1047].forEach((f,i)=>FX.tone({f,type:'sine',dur:1.4,vol:.07,delay:i*.12})); },

function renderRibbon(){

  el.innerHTML = STAGES.map((n,i)=>{ const s=run && i<=k? run.o.stages[i].status : ''; return `<button data-i="${i}" class="${s} ${i===(sel>=0?sel:k)?'cur':''}" title="${n}">${i+1}<span> ${n}</span></button>`; }).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=(e)=>{ e.stopPropagation(); const i=+b.dataset.i; if (!run || (!run.done && i>run.idx)) return; sel = sel===i? -1 : i; renderRibbon(); renderEra(); });
  const w=document.getElementById('why'); const i = sel>=0? sel : k; const st = run && i>=0? run.o.stages[i] : null;
  w.className = st && st.status==='broken'? 'broken' : ''; w.innerHTML = st && st.status!=='none'? `<b>${st.name}.</b> ${st.plain}` : run? '' : 'Set the laws on the right, then press <b>Bang</b>.';
}
function renderEra(){

  document.getElementById('eraN').textContent = run? lawStr(run.c) : 'Choose the laws of physics';

// Measurements come from the last universe you actually ran, never from the laws you are about to try.
function renderStats(){

  const o=run.o, v=o.v;

  for (const l of LAWS){ const cur=l.opts[M.consts[l.k]];
    h+=`<div class="law" data-law="${l.k}"><div class="lhead"><canvas class="prev" width="96" height="60" data-prev="${l.k}"></canvas><div><div class="nm">${l.n}</div><div class="d">${l.d}</div></div></div>
      <div class="ud"><span>▲ ${l.up}</span><span>▼ ${l.down}</span></div>
      <div class="opts">${l.opts.map((o,j)=>`<button data-k="${l.k}" data-j="${j}" class="${M.consts[l.k]===j?'on':''} ${j===l.def?'ours':''} ${tut&&l.k==='G'&&j===1&&M.consts.G!==1?'pulse':''}">${o[0]}</button>`).join('')}</div>

function cmpText(l,j){ const ours=l.opts[l.def], o=l.opts[j]; return j===l.def? `<b>In our universe (${ours[0].replace(/ \(.*\)/,'')}):</b> ${ours[2]}` : `<b>In our universe (${ours[0].replace(/ \(.*\)/,'')}):</b> ${ours[2]}<br><b>At ${o[0]}:</b> ${o[2]}`; }
// Tiny live previews: what each law does, drawn for the setting currently chosen.
function drawPreviews(now){
  for (const c of document.querySelectorAll('canvas.prev')){ const k=c.dataset.prev, g=c.getContext('2d'), w=96, h=60, l=LAWS.find(x=>x.k===k), v=l.opts[M.consts[k]][1], t=now/1000;
    g.fillStyle='#070a24'; g.fillRect(0,0,w,h); g.fillStyle=GOLD; g.strokeStyle=GOLD;
    if (k==='G'){ // two clumps fall together; stronger gravity, faster
      const per=Math.max(.6, 4/Math.sqrt(v)), ph=(t%per)/per; const sep=v<=0.1? 34 : 34*(1-ph*ph); for (const sx of [-1,1]){ for (let i=0;i<7;i++){ g.beginPath(); g.arc(w/2+sx*sep+Math.cos(i*2.4+sx)*5, h/2+Math.sin(i*2.4)*5, 1.6,0,7); g.fill(); } }
      if (v>=10 && ph>.8){ g.fillStyle='#000'; g.beginPath(); g.arc(w/2,h/2,6,0,7); g.fill(); g.strokeStyle='#e6c36a'; g.beginPath(); g.arc(w/2,h/2,8,0,7); g.stroke(); } }
    else if (k==='L'){ // dots drift apart (push) or fall together (pull)
      const sp = v===-1? -1 : v*0.6; const ph=(t%4)/4; for (let i=0;i<12;i++){ const a=i*0.52, r0=10+(i%3)*5; const r = Math.max(2, r0*(1+sp*ph*1.8)); g.beginPath(); g.arc(w/2+Math.cos(a)*r, h/2+Math.sin(a)*r*.6, 1.6,0,7); g.fill(); } }
    else if (k==='a'){ // electron orbit: tighter when α is stronger
      const R=Math.max(5, 22*Math.pow(v/137,.5)); g.fillStyle='#ff8a6a'; g.beginPath(); g.arc(w/2,h/2,3,0,7); g.fill(); g.strokeStyle='rgba(230,195,106,.4)'; g.beginPath(); g.ellipse(w/2,h/2,R,R*.6,0,0,7); g.stroke(); g.fillStyle='#9fd0ff'; g.beginPath(); g.arc(w/2+Math.cos(t*3)*R, h/2+Math.sin(t*3)*R*.6, 2.2,0,7); g.fill(); }
    else if (k==='s'){ // proton + neutron: fly apart (weak), stick (ours), two protons stick (strong)
      const ph=(t%2.5)/2.5; const bound=v>=1; const pp=v>=1.05; const d = bound? 4.5 : 4.5+ph*24; g.fillStyle='#ff8a6a'; g.beginPath(); g.arc(w/2-d,h/2,4,0,7); g.fill(); g.fillStyle= pp? '#ff8a6a' : '#cfc7b0'; g.beginPath(); g.arc(w/2+d,h/2,4,0,7); g.fill();
      g.fillStyle='#c8bd9c'; g.font='9px serif'; g.textAlign='center'; g.fillText(pp? 'p + p stick' : bound? 'p + n stick' : 'p, n fly apart', w/2, h-4); }
    else if (k==='m'){ const n= v===-12? 4 : v===-10? 18 : 60; for (let i=0;i<n;i++){ const x=(i*37+t*6*(i%3+1))%w, y=(i*23)%h; g.fillRect(x,y,1.6,1.6); } }
    else if (k==='D'){ g.fillStyle='#ffd27a'; g.beginPath(); g.arc(w/2,h/2,4,0,7); g.fill();
      if (v===3){ g.strokeStyle='rgba(230,195,106,.35)'; g.beginPath(); g.ellipse(w/2,h/2,26,14,0,0,7); g.stroke(); g.fillStyle='#9fd0ff'; g.beginPath(); g.arc(w/2+Math.cos(t*1.5)*26, h/2+Math.sin(t*1.5)*14, 2.5,0,7); g.fill(); }
      else if (v===4){ const ph=(t%3)/3, R=28*(1-ph); g.fillStyle='#9fd0ff'; g.beginPath(); g.arc(w/2+Math.cos(t*4)*R, h/2+Math.sin(t*4)*R*.55, 2.5,0,7); g.fill(); }
      else { g.strokeStyle='rgba(230,195,106,.35)'; g.beginPath(); g.moveTo(8,h/2); g.lineTo(w-8,h/2); g.stroke(); g.fillStyle='#9fd0ff'; g.beginPath(); g.arc(w/2+Math.cos(t*1.5)*30, h/2, 2.5,0,7); g.fill(); } }
  }

  document.getElementById('p-atlas').innerHTML = M.atlas.length? `<p class="small dim">The last universes you made, and where each one broke.</p>`+M.atlas.map(a=>`<div class="atlas"><b>Universe ${a.n}</b> <span class="laws">${lawStr(a.c)}</span><div class="mini">${a.s.map(s=>`<i class="${s}"></i>`).join('')}</div>${a.broke? `<span class="dim">Broke at ${a.broke}</span>` : '<span>Reached minds.</span>'}</div>`).join('') : '<p class="dim">No universes yet. Set the laws and press Bang.</p>';
}
function renderAll(){ renderLaws(); renderStats(); renderChal(); renderAtlas(); renderHistory(); renderEra(); }
function showTab(t){ document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.t===t)); document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+t)); }
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{ document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id==='p-'+b.dataset.t)); });
document.getElementById('skipBtn').onclick=(e)=>{ e.stopPropagation(); finishRun(); };

window.__us={ renderRibbon, MIN_CHANGES, ALL_COMBOS, starsFor, LAWS, STAGES, CHAL, OURS, simulate, changed, val, bang, finishRun, renderAll, cleanConsts, persist, get M(){ return M; }, get run(){ return run; }, set sel(v){ sel=v; } };
resize(); window.addEventListener('resize', resize); renderAll(); requestAnimationFrame(draw);
setInterval(()=>{ if (run && !run.done) renderRibbon(); }, 250);
if (!M.intro){ M.intro=1; persist(); RH.modal(`<h2>Universe Seed</h2><p>Six numbers decide what a universe can become: the strength of gravity, dark energy, the fine-structure constant, the strong force, how much matter survived the Big Bang, and how many dimensions space has.</p><p>Set them, then press <b>Bang</b>. The universe runs its history link by link: nucleosynthesis, galaxies, stars, carbon, planets, life, minds. When a link breaks, you'll see the physics that broke it.</p><p>The <b>Challenges</b> ask for strange universes. Most need two laws turned together.</p>`,[{label:'Choose the laws'}]); }
