<style>

  .modal .modal-actions{background:#0b0f30!important;background-color:#0b0f30!important}

    #front{grid-template-columns:1fr 1fr;gap:5px;padding:6px 8px}

    .card .ln{font-size:13px}
    .pane{flex:none;min-height:40vh}
    #act{position:sticky;bottom:0;z-index:3;background:#0b0f30;border-top:1px solid #e6c36a55;padding-top:6px;box-shadow:0 -6px 14px #0009}

  }
  @media (max-height:520px) and (min-width:600px){ #side{width:360px;overflow:auto} .pane{flex:none;min-height:200px} #cap .f{display:none} }

<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>Universe Seed</h1><span class="spacer"></span><span id="meta"></span><button id="helpBtn" aria-label="What is this?">?</button></div>
<main>
  <div id="sky" data-play><canvas id="cv"></canvas>
    <div id="cap"><div class="t" id="capT"></div><div class="n" id="capN"></div><div class="f" id="capF"></div></div>

</main>

<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script>
'use strict';
const LAWS = [
  {k:'G', n:'Gravity', short:'Gravity', d:'How strongly everything pulls on everything else.', def:2,
    up:'Stronger: gas clumps fast, stars burn hot and die young. Too strong and stars crush into black holes.', down:'Weaker: clumping is slow, stars are cool and long-lived. Too weak and gas never ignites.',
    opts:[['0.1×',0.1,'Gas clouds never squeeze hard enough to light a star.'],['0.3×',0.3,'Stars are dim and patient: a sun lives about 100 billion years.'],['1×',1,'A sun lives about 10 billion years.'],['3×',3,'Stars are hot and short-lived: a sun lives about 1 billion years.'],['10×',10,'Every star collapses straight into a black hole.']]},
  {k:'L', n:'Dark energy Λ', short:'Dark energy', d:'A push built into empty space that makes the universe expand faster and faster.', def:2,
    up:'More: space flies apart before gas can gather into galaxies.', down:'Less: galaxies cluster freely. Negative: space eventually falls back in (a "big crunch").',
    opts:[['−1 (pulls)',-1,'Space slows, stops and falls back in: the universe ends in a crunch.'],['0',0,'Nothing pushes galaxies apart; they cluster tightly.'],['0.7 (ours)',0.7,'A gentle push that only wins after galaxies have formed.'],['3',3,'Galaxies only form where matter is dense.'],['10',10,'Space flies apart too fast for any galaxy to form.']]},
  {k:'a', n:'Fine-structure constant α', short:'α', d:'How strongly electric charges attract: the glue of atoms, chemistry and starlight.', def:1,
    up:'Stronger (1/80): bonds are sticky and chemistry is quick. Much stronger (1/40): atoms hold electrons too tightly to share.', down:'Weaker (1/300): atoms are fragile and chemistry slow.',
    opts:[['1/300',300,'Atoms are fragile; chemistry crawls, so life needs far longer.'],['1/137 (ours)',137,'Atoms bond and share electrons easily.'],['1/80',80,'Sticky bonds: chemistry runs fast, life starts sooner.'],['1/40',40,'Electrons are held too tightly to share: no complex molecules.']]},
  {k:'s', n:'Strong force', short:'Strong force', d:'The glue that holds protons and neutrons together in the nucleus.', def:1,
    up:'Stronger: protons stick to each other and hydrogen (the fuel of stars and water) burns away.', down:'Weaker: protons and neutrons cannot stick, so stars never fuse.',
    opts:[['0.9×',0.9,'A proton and a neutron cannot stick: no fusion, ever.'],['1× (ours)',1,'75% of matter stays hydrogen; stars burn it slowly.'],['1.05×',1.05,'Two protons can stick: most hydrogen burns away in minutes.'],['1.2×',1.2,'Every proton pairs off: no hydrogen, no water.']]},
  {k:'m', n:'Matter excess', short:'Matter', d:'How much matter was left over after matter and antimatter annihilated at the start.', def:1,
    up:'More: a crowded universe; galaxies form easily, even against dark energy.', down:'Less: a thin universe; gas struggles to gather.',
    opts:[['10⁻¹²',-12,'A hundred times less matter: thin gas that struggles to gather.'],['10⁻¹⁰ (ours)',-10,'One particle of matter survived per ten billion photons.'],['10⁻⁸',-8,'A hundred times more matter: a crowded universe.']]},
  {k:'D', n:'Space dimensions', short:'Space', d:'How many directions there are to move in.', def:1,
    up:'Four: gravity fades so fast with distance that no orbit is stable.', down:'Two: orbits work, but a creature with a gut would fall apart.',
    opts:[['2',2,'Flatland: stars and planets, but no complex bodies.'],['3 (ours)',3,'Stable orbits and room for plumbing.'],['4',4,'No stable orbits: planets spiral in or fly off.']]},
];
const OURS = Object.fromEntries(LAWS.map(l=>[l.k,l.def]));
const val = (c,k)=> LAWS.find(l=>l.k===k).opts[c[k]][1];
const changed = (c)=> LAWS.filter(l=>c[l.k]!==l.def).length;
const lawTag = (c,k)=>{ const l=LAWS.find(x=>x.k===k); return `${l.short} ${l.opts[c[k]][0].replace(/ \(.*\)/,'')}`; };
const lawStr = (c)=> LAWS.filter(l=>c[l.k]!==l.def).map(l=>`${l.n.split(' ')[0]} ${l.opts[c[l.k]][0]}`).join(' · ') || 'our laws';

// ===================== The history a set of laws allows =====================
// Each link in the causal chain is ok, weakened, or broken, with the physical reason.
// Numbers are order-of-magnitude scalings, not a cosmological code, but every link points the way the real argument does.
const STAGES = ['Baryogenesis','Nucleosynthesis','Recombination','Galaxies','First stars','Carbon','Planets','Life','Minds'];
const fmtT = (gyr)=> gyr>=1? `${gyr<10? gyr.toFixed(1) : Math.round(gyr)} billion years` : gyr>=1e-3? `${Math.round(gyr*1000)} million years` : `${Math.round(gyr*1e6)} thousand years`;
function simulate(c){
  const G=val(c,'G'), L=val(c,'L'), ainv=val(c,'a'), s=val(c,'s'), m=val(c,'m'), D=val(c,'D');
  const r = 137/ainv;                       // α relative to ours
  const rho = Math.pow(10, m+10);           // baryon density relative to ours
  const out = {stages:[], v:{}};
  // each link: status, the physics (why), a plain cause → effect line (plain), and the law that decided it (law)
  const st=(status, why, plain, law)=>{ out.stages.push({name:STAGES[out.stages.length], status, why, plain, law: law||null}); return status!=='broken'; };
  const v=out.v; const tag=(k)=> lawTag(c,k);
  // 1. Baryogenesis
  st(m===-12?'weak':'ok', m===-12? 'Only one baryon per 10¹² photons survived annihilation: a thin, dilute universe.' : m===-8? 'A hundred times more matter than ours survived: a crowded universe.' : 'One baryon per 10¹⁰ photons survived, as in ours.',
    m===-12? `${tag('m')} → almost all matter annihilates → a thin universe` : m===-8? `${tag('m')} → much more matter is left over → a crowded universe` : 'Matter and antimatter annihilate → a little matter is left over, as in ours', m!==-10? 'm':null);
  // 2. Big Bang nucleosynthesis: the deuterium bottleneck
  v.fusion = s!==0.9; v.X = s===0.9? 1 : s===1? .75 : s===1.05? .25 : 0; // hydrogen fraction left after the first minutes
  if (s===0.9) st('weak','Deuterium is unbound, so the first step of fusion never happens. The universe stays pure hydrogen, and no star will ever fuse it.', `${tag('s')} → a proton and neutron can't stick → no fusion, ever`, 's');
  else if (s===1.05) st('weak','Two protons can stick (the diproton), so hydrogen burns straight to helium in the first minutes. Only a quarter of it is left.', `${tag('s')} → two protons stick → most hydrogen burns away in minutes`, 's');
  else if (s===1.2) st('weak','Every proton paired off in the first minutes. There is no hydrogen left: no water, no slow-burning stars.', `${tag('s')} → every proton pairs off → no hydrogen left`, 's');
  else st('ok','Three minutes in, the deuterium bottleneck breaks: 75% hydrogen, 25% helium.', 'Protons and neutrons fuse in the first minutes → 75% hydrogen, 25% helium');
  // 3. Recombination: binding energy ∝ α², so the temperature (and time) at which light decouples moves
  v.tRec = 380e3 * Math.pow(r,-3) / 1e9;
  st('ok', `Electrons settle onto nuclei after ${fmtT(v.tRec)}, and light travels freely for the first time.`+(ainv===40? ' Atoms are bound twelve times tighter than ours.' : ainv===300? ' Atoms are loosely bound and easily broken.' : ''),
    ainv!==137? `${tag('a')} → electrons grab nuclei ${ainv<137?'earlier':'later'}, at ${fmtT(v.tRec)} → atoms form, light flies free` : `Electrons grab nuclei at ${fmtT(v.tRec)} → atoms form, light flies free`, ainv!==137?'a':null);
  // 4. Structure: gravity and matter must win before dark energy takes over (Weinberg's bound)
  v.S = Math.log10(G) + 0.5*(m+10);
  const need = L<=0? -1.6 : L===0.7? -0.6 : L===3? 0.3 : 0.9;
  v.crunch = L===-1? 14/Math.sqrt(G)/Math.pow(rho,.25) : Infinity;
  v.galaxies = v.S>=need? Math.max(1,Math.round(100*Math.pow(10, v.S-need-0.6) * (L===0? 2 : 1))) : 0;  // ours = 100
  const galLaw = L>=3? 'L' : G<1? 'G' : m===-12? 'm' : L!==0.7? 'L' : null;
  if (!v.galaxies) return st('broken', L>=3? 'Dark energy pushes space apart before gravity can gather anything as big as a galaxy.' : 'Gravity is too weak, and matter too thin, for clouds to fall together before space spreads them out.',
    L>=3? `${tag('L')} → space flies apart faster than gas can gather → no galaxies` : `${tag(galLaw||'G')} → gas is too thin and weakly pulled to gather → no galaxies`, galLaw||'G'), finish(out,c);
  st(v.S-need<0.3? 'weak':'ok', `${v.galaxies>=1000? Math.round(v.galaxies/100)/10+' thousand' : v.galaxies} galaxies where ours has a hundred`+(L===-1? `, but space will fall back in after ${fmtT(v.crunch)}.` : L===0? ', clustered tightly with no dark energy to pull them apart.' : '.'),
    (galLaw? tag(galLaw)+' → ' : 'Gravity gathers the gas → ')+`${v.galaxies>=1000? Math.round(v.galaxies/100)/10+' thousand' : v.galaxies} galaxies for every 100 in ours`+(L===-1? `; space will collapse at ${fmtT(v.crunch)}` : ''), galLaw);
  // 5. Stars
  if (G<=0.1) return st('broken','Gravity is too weak to squeeze gas hot enough to ignite. No star ever shines.', `${tag('G')} → gas clouds never get hot enough → no stars`, 'G'), finish(out,c);
  if (G>=10) { v.stars=1; return st('broken','Every star collapses straight into a black hole before it can fuse anything heavy.', `${tag('G')} → every star crushes itself → only black holes`, 'G'), finish(out,c); }
  v.tau = 10 * Math.pow(G,-2) * r * (s===1.05? .3 : 1) * (s===1.2? .1 : 1);
  v.stars = 1; const starLaw = G!==1? 'G' : s!==1? 's' : ainv!==137? 'a' : null;
  if (!v.fusion){ v.tau = 0.05; st('weak','Stars form but cannot fuse hydrogen. They glow dimly from contraction for a few tens of millions of years.', `${tag('s')} → stars can't fuse → they glow dimly and fade`, 's'); }
  else st(v.tau<2? 'weak':'ok', `Stars ignite. A sun-like star burns for ${fmtT(v.tau)}`+(G>1? ': gravity makes them hot and short-lived.' : G<1? ': weak gravity makes them cool and patient.' : '.'),
    (starLaw? tag(starLaw)+' → ' : 'Gas clouds collapse and ignite → ')+`a sun-like star lives ${fmtT(v.tau)}`+(starLaw? ` (ours: 10 billion years)` : ''), starLaw);
  // 6. Carbon (Hoyle resonance)
  const reson = (s===1? 1 : s===1.05? .3 : 0) * (ainv===137? 1 : ainv===80? .4 : ainv===300? .5 : 0);
  v.carbon = v.fusion? reson : 0; const cLaw = s!==1? 's' : ainv!==137? 'a' : null;
  if (!v.carbon) return st('broken', !v.fusion? 'No fusion, so no helium burning and no carbon. The universe stays hydrogen gas and dim stars.' : s===1.2? 'With no hydrogen to burn first, stars race through helium and the Hoyle resonance is missed: almost no carbon.' : 'The Hoyle resonance in carbon-12 misses its mark: helium never fuses to carbon.',
    `${tag(cLaw||'s')} → helium can't fuse into carbon → no carbon, so no planets or life to come`, cLaw||'s'), finish(out,c);
  st(v.carbon<1? 'weak':'ok', v.carbon<1? `The Hoyle resonance is slightly off. Stars make only ${Math.round(v.carbon*100)}% of our carbon.` : 'Three helium nuclei meet at the Hoyle resonance and make carbon. Supernovae scatter it.',
    v.carbon<1? `${tag(cLaw)} → the carbon-making resonance is off → ${Math.round(v.carbon*100)}% of our carbon` : 'Old stars fuse helium into carbon and explode → carbon spreads through space', v.carbon<1? cLaw : null);
  // 7. Planets
  if (D===4) return st('broken','In four dimensions gravity falls off as 1/r³, and no orbit is stable. Every planet spirals in or drifts away.', `${tag('D')} → gravity fades as 1/r³ → no stable orbits, no planets`, 'D'), finish(out,c);
  if (v.crunch < 1) return st('broken',`Space falls back in after ${fmtT(v.crunch)}, before rocky worlds can cool.`, `${tag('L')} → space collapses at ${fmtT(v.crunch)} → no time to build planets`, 'L'), finish(out,c);
  v.planets = Math.round(v.galaxies * v.carbon * (m===-12? .3 : m===-8? 2 : 1));
