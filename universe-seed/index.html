<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Universe Seed</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#000}
  main{flex:1;display:flex;min-height:0}
  #sky{flex:1;position:relative;min-width:0;cursor:pointer}
  #sky canvas{position:absolute;inset:0;width:100%;height:100%}
  #eraBox{position:absolute;top:14px;left:18px;pointer-events:none;max-width:60%}
  #eraBox .t{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#ffb547}
  #eraBox .n{font-size:26px;font-weight:700;text-shadow:0 2px 12px #000}
  #eraBox .f{font-size:14px;color:#c9c4b8;max-width:520px;text-shadow:0 1px 6px #000;margin-top:4px}
  #clock{position:absolute;bottom:12px;left:18px;font-size:12px;color:#8a8f9c;pointer-events:none}
  #side{width:400px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .tabs{display:flex;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px 4px;color:var(--dim);font-size:13px}
  .tabs button.on{color:var(--ink);box-shadow:inset 0 -2px var(--accent)}
  .pane{flex:1;overflow:auto;padding:10px;display:none}
  .pane.on{display:block}
  .res{display:grid;grid-template-columns:1fr auto auto;gap:2px 10px;font-size:13px;padding:8px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
  .res .r{color:var(--dim)} .res .v{text-align:right;font-weight:600} .res .ps{text-align:right;color:var(--dim);font-size:12px}
  .gen{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:5px;background:var(--panel2)}
  .gen .nm{font-weight:600;font-size:13px} .gen .d{font-size:11px;color:var(--dim)}
  .gen button{white-space:nowrap;font-size:12px;min-width:96px}
  .tierH{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:12px 0 5px}
  .locked{font-size:12px;color:var(--bad);padding:6px 8px;border:1px dashed #5a2a2a;border-radius:8px;margin-bottom:6px}
  .codex{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .cx{border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px;background:var(--panel2);min-height:64px}
  .cx.got{border-color:#6b5a2a}
  .cx b{display:block;font-size:13px;margin-bottom:2px}
  .cx.no b{color:#444}
  .const{margin-bottom:12px}
  .const .opts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
  .const .opts button{font-size:12px;padding:3px 8px}
  .const .opts button.on{background:var(--accent);color:#1a1205}
  .endBtn{width:100%;margin-top:10px}
  @media (max-width:760px){
    body{height:auto;min-height:100vh;overflow:auto}
    main{flex-direction:column}
    #sky{flex:none;height:56vh}
    #side{width:auto;border-left:0;border-top:1px solid var(--line);min-height:70vh}
    #eraBox{max-width:92%} #eraBox .n{font-size:20px} #eraBox .f{font-size:12px}
    .topbar{flex-wrap:wrap}
  }
</style>
<style id="cosmos">

  :root{--bg:#070a24;--panel:#0d1238;--panel2:#141a4a;--ink:#ece3c8;--dim:#a49b84;--line:#3a3570;--accent:#e6c36a;--good:#bfe39a;--bad:#ff9a8a;font-family:"Cormorant Garamond",Georgia,serif}
  body{background:#05071c;color:var(--ink);font-size:17px}

  #side{background:#0b0f30 radial-gradient(ellipse at 20% 0%,#1d2366,transparent 60%),radial-gradient(ellipse at 90% 100%,#2a1550,transparent 60%);border-left:1px solid #e6c36a55}

  .gen{background:transparent;border:0;border-bottom:1px solid #e6c36a22;border-radius:0;padding:6px 2px}
  .gen .nm{font-size:17px;font-weight:600;color:#ece3c8} .gen .d{font-size:13px;color:#a49b84;font-style:italic}
  .locked{border:1px dashed #ff9a8a66;color:#ffb3a6;border-radius:0;font-style:italic}

  #eraBox .t{color:#e6c36a;letter-spacing:.3em;font-family:"Cormorant Garamond",serif}
  #eraBox .n{font-family:"Cormorant Garamond",serif;font-weight:300;font-size:40px;color:#f6e3a1;text-shadow:0 2px 18px #000}

<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>Universe Seed</h1><span class="spacer"></span><span class="small dim" id="meta"></span></div>
<main>
  <div id="sky" data-play><canvas id="cv"></canvas>
    <div id="eraBox"><div class="t" id="eraT"></div><div class="n" id="eraN"></div><div class="f" id="eraF"></div></div>
    <button id="skipBtn">Skip to the end ›</button>
    <div id="why"></div>
    <div id="ribbon"></div>
  </div>
  <div id="side">
    <div class="stats" id="stats"></div>
    <div class="tabs"><button data-t="laws" class="on">Laws</button><button data-t="chal">Challenges</button><button data-t="atlas">Atlas</button></div>
    <div class="pane on" id="p-laws"></div>
    <div class="pane" id="p-chal"></div>
    <div class="pane" id="p-atlas"></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
// ===================== The laws =====================
// Six constants, each with our value marked. Every option is available from the first universe.
const LAWS = [
  {k:'G', n:'Gravity', d:'Strength of gravity compared with ours.', opts:[['0.1×',0.1],['0.3×',0.3],['1×',1],['3×',3],['10×',10]], def:2},
  {k:'L', n:'Dark energy Λ', d:'Pushes space apart. Negative values pull it back together.', opts:[['−1 (pulls)',-1],['0',0],['0.7 (ours)',0.7],['3',3],['10',10]], def:2},
  {k:'a', n:'Fine-structure constant α', d:'How strongly light grips charge: atoms, chemistry, starlight.', opts:[['1/300',300],['1/137 (ours)',137],['1/80',80],['1/40',40]], def:1},
  {k:'s', n:'Strong force', d:'The glue in atomic nuclei.', opts:[['0.9×',0.9],['1× (ours)',1],['1.05×',1.05],['1.2×',1.2]], def:1},
  {k:'m', n:'Matter excess', d:'How much matter survived annihilation with antimatter.', opts:[['10⁻¹²',-12],['10⁻¹⁰ (ours)',-10],['10⁻⁸',-8]], def:1},
  {k:'D', n:'Space dimensions', d:'How many directions there are to move in.', opts:[['2',2],['3 (ours)',3],['4',4]], def:1},
];
const OURS = Object.fromEntries(LAWS.map(l=>[l.k,l.def]));
const val = (c,k)=> LAWS.find(l=>l.k===k).opts[c[k]][1];
const changed = (c)=> LAWS.filter(l=>c[l.k]!==l.def).length;
const lawStr = (c)=> LAWS.filter(l=>c[l.k]!==l.def).map(l=>`${l.n.split(' ')[0]} ${l.opts[c[l.k]][0]}`).join(' · ') || 'our laws';

// ===================== The history a set of laws allows =====================
// Each link in the causal chain is ok, weakened, or broken, with the physical reason.
// Numbers are order-of-magnitude scalings, not a cosmological code, but every link points the way the real argument does.
const STAGES = ['Baryogenesis','Nucleosynthesis','Recombination','Galaxies','First stars','Carbon','Planets','Life','Minds'];
const fmtT = (gyr)=> gyr>=1? `${gyr<10? gyr.toFixed(1) : Math.round(gyr)} billion years` : gyr>=1e-3? `${Math.round(gyr*1000)} million years` : `${Math.round(gyr*1e6)} thousand years`;
function simulate(c){
  const G=val(c,'G'), L=val(c,'L'), ainv=val(c,'a'), s=val(c,'s'), m=val(c,'m'), D=val(c,'D');
  const r = 137/ainv;                       // α relative to ours
  const rho = Math.pow(10, m+10);           // baryon density relative to ours
  const out = {stages:[], v:{}}; const st=(status, why, extra)=>{ out.stages.push({name:STAGES[out.stages.length], status, why, ...(extra||{})}); return status!=='broken'; };
  const v=out.v;
  // 1. Baryogenesis
  st(m===-12?'weak':'ok', m===-12? 'Only one baryon per 10¹² photons survived annihilation: a thin, dilute universe.' : m===-8? 'A hundred times more matter than ours survived: a crowded universe.' : 'One baryon per 10¹⁰ photons survived, as in ours.');
  // 2. Big Bang nucleosynthesis: the deuterium bottleneck
  v.fusion = s!==0.9; v.X = s===0.9? 1 : s===1? .75 : s===1.05? .25 : 0; // hydrogen fraction left after the first minutes
  if (s===0.9) st('weak','Deuterium is unbound, so the first step of fusion never happens. The universe stays pure hydrogen, and no star will ever fuse it.');
  else if (s===1.05) st('weak','Two protons can stick (the diproton), so hydrogen burns straight to helium in the first minutes. Only a quarter of it is left.');
  else if (s===1.2) st('weak','Every proton paired off in the first minutes. There is no hydrogen left: no water, no slow-burning stars.');
  else st('ok','Three minutes in, the deuterium bottleneck breaks: 75% hydrogen, 25% helium.');
  // 3. Recombination: binding energy ∝ α², so the temperature (and time) at which light decouples moves
  v.tRec = 380e3 * Math.pow(r,-3) / 1e9; // Gyr, since t ∝ T^-1.5 in a matter era and T_rec ∝ α²
  st('ok', `Electrons settle onto nuclei after ${fmtT(v.tRec)}, and light travels freely for the first time.`+(ainv===40? ' Atoms are bound twelve times tighter than ours.' : ainv===300? ' Atoms are loosely bound and easily broken.' : ''));
  // 4. Structure: gravity and matter must win before dark energy takes over (Weinberg's bound)
  v.S = Math.log10(G) + 0.5*(m+10);
  const need = L<=0? -1.6 : L===0.7? -0.6 : L===3? 0.3 : 0.9;
  v.crunch = L===-1? 14/Math.sqrt(G)/Math.pow(rho,.25) : Infinity;   // Gyr until the recollapse
  v.galaxies = v.S>=need? Math.max(1,Math.round(100*Math.pow(10, v.S-need-0.6) * (L===0? 2 : 1))) : 0;  // ours = 100
  if (!v.galaxies) return st('broken', L>=3? 'Dark energy pushes space apart before gravity can gather anything as big as a galaxy.' : 'Gravity is too weak, and matter too thin, for clouds to fall together before space spreads them out.'), finish(out,c);
  st(v.S-need<0.3? 'weak':'ok', `${v.galaxies>=1000? Math.round(v.galaxies/100)/10+' thousand' : v.galaxies} galaxies where ours has a hundred`+(L===-1? `, but space will fall back in after ${fmtT(v.crunch)}.` : L===0? ', clustered tightly with no dark energy to pull them apart.' : '.'));
  // 5. Stars: the gas must heat enough to ignite; lifetime ∝ G^-2 (L ∝ G⁴M³), longer when light is trapped more (α)
  if (G<=0.1) return st('broken','Gravity is too weak to squeeze gas hot enough to ignite. No star ever shines.'), finish(out,c);
  if (G>=10) { v.stars=1; v.life_t=0; return st('broken','Every star collapses straight into a black hole before it can fuse anything heavy.'), finish(out,c); }
  v.tau = 10 * Math.pow(G,-2) * r * (s===1.05? .3 : 1) * (s===1.2? .1 : 1);   // Gyr, a sun-like star's lifetime
  v.stars = 1;
  if (!v.fusion){ v.tau = 0.05; st('weak','Stars form but cannot fuse hydrogen. They glow dimly from contraction for a few tens of millions of years.'); }
  else st(v.tau<2? 'weak':'ok', `Stars ignite. A sun-like star burns for ${fmtT(v.tau)}`+(G>1? ': gravity makes them hot and short-lived.' : G<1? ': weak gravity makes them cool and patient.' : '.'));
  // 6. Carbon: needs fusion, and the triple-alpha (Hoyle) resonance sits where α and the strong force put it
  const reson = (s===1? 1 : s===1.05? .3 : 0) * (ainv===137? 1 : ainv===80? .4 : ainv===300? .5 : 0);
  v.carbon = v.fusion? reson : 0;
  if (!v.carbon) return st('broken', !v.fusion? 'No fusion, so no helium burning and no carbon. The universe stays hydrogen gas and dim stars.' : s===1.2? 'With no hydrogen to burn first, stars race through helium and the Hoyle resonance is missed: almost no carbon.' : 'The Hoyle resonance in carbon-12 misses its mark: helium never fuses to carbon.'), finish(out,c);

// ===================== Challenges =====================
// Each asks for a kind of universe. Most need two or more laws turned together, with trade-offs.
const ok = (o,name)=>{ const s=o.stages[STAGES.indexOf(name)]; return s.status==='ok'||s.status==='weak'; };
const CHAL = [

  {id:'darkminds', n:'Minds against dark energy', d:'Minds with dark energy at 3.', t:(o,c)=>val(c,'L')===3 && ok(o,'Minds')},

// The fewest laws you must change for each challenge, found by trying all 3,600 combinations once.
const ALL_COMBOS=(()=>{ const out=[]; const rec=(i,cur)=>{ if (i===LAWS.length){ out.push({...cur}); return; } for (let j=0;j<LAWS[i].opts.length;j++){ cur[LAWS[i].k]=j; rec(i+1,cur); } }; rec(0,{}); return out; })();

// Stars: ★ met · ★★ within one law of the most elegant answer · ★★★ the most elegant answer within 3 attempts of taking the challenge on

// ===================== State =====================
const isObj=(o)=>o&&typeof o==='object'&&!Array.isArray(o);

let M = RH.load('us2', null); if (!isObj(M)) M={};
M.consts=cleanConsts(M.consts); if (!isObj(M.chal)) M.chal={}; for (const k of Object.keys(M.chal)) { const v=M.chal[k]; if (!CHAL.some(c=>c.id===k) || !isObj(v) || !Number.isInteger(v.n) || !Number.isInteger(v.st)) delete M.chal[k]; }

const ERA_INK=[ ['#fff1c2','#f0a43a','#5a1f08'], ['#ff9ad5','#9c2a7a','#2a0626'], ['#9fd0ff','#2a4f9c','#050b26'], ['#e0c8ff','#4a2a8a','#08051c'],
  ['#ffe3a0','#3b3f9e','#050720'], ['#ffb080','#a8331c','#16060a'], ['#a8f0e0','#1f6e78','#03141a'], ['#b8f5a0','#2f7a3a','#04140a'], ['#ffe08a','#b07a1a','#120a02'] ];
const GOLD='#e6c36a';
const reduceMotion = typeof matchMedia==='function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
const cv=document.getElementById('cv'), ctx=cv.getContext('2d'); let W=0,H=0, bgStars=[];
function resize(){ const r=cv.getBoundingClientRect(); W=r.width; H=r.height; const d=Math.min(2,devicePixelRatio||1); cv.width=Math.max(1,W*d|0); cv.height=Math.max(1,H*d|0); ctx.setTransform(d,0,0,d,0,0);

let neb={};
function paintNebula(era, dark){
  const c=document.createElement('canvas'); const w=Math.max(64,W|0), h=Math.max(64,H|0); c.width=w; c.height=h; const g=c.getContext('2d'); const [hi,mid,lo]=ERA_INK[era]; const R=RH.rng(era*7919+3);

const nebulaFor=(era,dark)=> neb[era+(dark?'d':'')] ||= paintNebula(era,dark);

// ===================== Playback =====================
// A bang plays the history one link at a time (about two seconds each); a broken link ends it.
let run=null;   // {c, o, t0, idx, done}
const STEP_MS=2200;
let sel=-1;
function bang(){
