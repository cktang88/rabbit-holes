<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Alembic</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;1,400&family=Uncial+Antiqua&display=swap" rel="stylesheet">
<style>
  /* An alchemist's manuscript: the tray is a ruled vellum leaf in a gilt and vermilion border, the vials stand
     in a row beneath it, the book of commissions and the codex are pages written in iron-gall ink with red rubrics. */
  :root{--vel:#eadcbc;--vel2:#dcc9a0;--ink:#2a1d12;--ink2:#5b4632;--verm:#b0301c;--gold:#c79a3a;--gold2:#8a6420;--lapis:#2d4b86;--desk:#1f1610;--desk2:#2c2017}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:"EB Garamond",Georgia,serif;color:var(--vel);display:flex;flex-direction:column;height:100dvh;
    background:radial-gradient(ellipse at 50% 30%,rgba(255,196,120,.13),transparent 60%),repeating-linear-gradient(92deg,rgba(0,0,0,.18) 0 2px,transparent 2px 9px),linear-gradient(#2c2017,#1a120c)}
  header{display:flex;align-items:center;gap:10px;padding:6px 12px;flex-wrap:wrap}
  header a.home{color:#d9c49a;text-decoration:none;font-size:14px}
  h1{font:400 26px/1 "Uncial Antiqua",serif;margin:0;color:#e9c46a;text-shadow:0 1px 0 #000,0 0 12px rgba(233,196,106,.25);letter-spacing:.02em}
  h1 .r{color:#e0553a}
  .sp{flex:1}
  button{font:600 15px "EB Garamond",Georgia,serif;color:var(--ink);background:linear-gradient(#efe0bd,#d9c393);border:1px solid #7a5a2a;border-radius:2px;padding:6px 12px;cursor:pointer;min-height:36px;box-shadow:0 2px 0 #5a3d18,inset 0 1px 0 #fff6;letter-spacing:.02em}
  button:hover{background:linear-gradient(#f6e9c8,#e2cc9c)} button:active{transform:translateY(1px);box-shadow:0 1px 0 #5a3d18}
  button.rub{color:#fff3df;background:linear-gradient(#c2432a,#8f2414);border-color:#5e160b}
  #goal{margin:0 12px 6px;padding:5px 12px;background:linear-gradient(#ecdfc1,#dccaa2);color:var(--ink);border:1px solid #8a6a3a;box-shadow:0 3px 10px #0007;font-size:16px;line-height:1.25;display:flex;align-items:center;gap:10px;min-height:28px}
  #goal .cap{font:400 22px/1 "Uncial Antiqua",serif;color:var(--verm);float:left}
  #goal .txt{flex:1} #goal .txt i{color:var(--ink2)}
  #goal .pg{min-width:84px;text-align:right;font-variant-numeric:tabular-nums;color:var(--verm);font-weight:600}
  #goal .bar{height:3px;background:#0002;margin-top:3px} #goal .bar b{display:block;height:100%;width:0;background:var(--verm);transition:width .3s}
  #desk{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 8px 8px}
  #trayWrap{flex:1;min-height:0;width:100%;position:relative}
  canvas#tray{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  /* zoom buttons as little brass-and-vellum tabs */
  .pz-bar button{min-width:38px;min-height:38px;font:600 20px "EB Garamond",serif;color:var(--ink);background:linear-gradient(#efe0bd,#d9c393);border:1px solid #7a5a2a;border-radius:2px;box-shadow:0 2px 0 #5a3d18;opacity:.92;padding:0}
  #seal{position:absolute;left:50%;top:42%;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none;opacity:0;transform:scale(2.2) rotate(-25deg)}
  #seal.on{animation:press 2.6s ease-out forwards}
  @keyframes press{0%{opacity:0;transform:scale(2.2) rotate(-25deg)}18%{opacity:1;transform:scale(.92) rotate(-8deg)}26%{transform:scale(1.02) rotate(-8deg)}80%{opacity:1;transform:scale(1) rotate(-8deg)}100%{opacity:0;transform:scale(1) rotate(-8deg)}}
  #shelf{flex:none;max-width:100%;display:flex;flex-direction:column;align-items:center;gap:2px}
  #fams{display:flex;gap:3px;align-items:center;flex-wrap:nowrap;max-width:100%}
  #fams button{min-height:30px;padding:2px 7px;font-size:13px;background:linear-gradient(#5a3f24,#3c2916);color:#e8d7b2;border-color:#24170c;box-shadow:none}
  #fams button.on{background:linear-gradient(#efe0bd,#d9c393);color:var(--ink)}
  #fams .pz-bar{position:static;display:flex;gap:3px;margin-left:6px} #fams .pz-bar button{min-width:32px;min-height:30px;font-size:17px}
  #vials{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden;max-width:100%;padding:2px 4px 2px;touch-action:pan-x;scrollbar-width:thin;flex:none;min-height:62px}
  .vial{flex:none;width:50px;height:62px;padding:0;background:none;border:0;box-shadow:none;position:relative;color:#e8d7b2;font:italic 400 12px/1 "EB Garamond",serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:0}
  .vial:hover{background:none} .vial .fl{position:absolute;left:50%;top:5px;width:30px;height:38px;margin-left:-15px;border-radius:7px 7px 15px 15px/6px 6px 18px 18px;
    background:linear-gradient(90deg,rgba(255,255,255,.35),transparent 35%,transparent 70%,rgba(0,0,0,.2)),linear-gradient(transparent 28%,var(--c) 28%);border:1.5px solid rgba(240,230,210,.8);box-shadow:inset 0 -4px 6px rgba(0,0,0,.25)}
  .vial .fl::before{content:"";position:absolute;left:8px;top:-7px;width:11px;height:8px;border:1.5px solid rgba(240,230,210,.8);border-bottom:0;background:#6b4a2a}
  .vial span{position:relative;white-space:nowrap;max-width:50px;overflow:hidden;text-overflow:ellipsis}
  .vial.on .fl{border-color:#ffd77a;box-shadow:0 0 0 2px #e9c46a,0 0 12px #e9c46a88,inset 0 -4px 6px rgba(0,0,0,.25)} .vial.on span{color:#ffd77a}
  .vial.fresh .fl{animation:fresh 1.2s ease-out 2}
  @keyframes fresh{50%{box-shadow:0 0 0 3px #e0553a,0 0 18px #e0553a}}
  .vial.scrape .fl{background:linear-gradient(135deg,transparent 40%,#d8c8a8 40% 60%,transparent 60%);border-style:dashed}
  #book{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center}
  #book.on{display:flex}
  #leaf{width:min(860px,96vw);max-height:92dvh;overflow:auto;color:var(--ink);padding:18px 26px 22px;
    background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.35),transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(120,80,30,.18),transparent 55%),linear-gradient(#efe3c6,#e1cfa6);box-shadow:0 20px 50px #000,inset 0 0 40px rgba(120,80,30,.25);border:1px solid #6b4a22}
  #leaf h2{font:400 26px "Uncial Antiqua",serif;color:var(--verm);margin:0 0 4px}
  #leaf h3{font:400 18px "Uncial Antiqua",serif;color:var(--lapis);margin:14px 0 6px;border-bottom:1px solid #8a6a3a66}
  #tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 4px} #tabs button.on{background:linear-gradient(#c2432a,#8f2414);color:#fff3df}
  .com{display:grid;grid-template-columns:34px 1fr auto;gap:2px 10px;align-items:center;padding:6px 4px;border-bottom:1px dotted #8a6a3a88}
  .com .n{font:400 22px "Uncial Antiqua",serif;color:var(--verm);text-align:center}
  .com.locked{opacity:.55} .com .need{font-size:13px;color:var(--ink2);font-style:italic}
  .com .st{font-size:13px;color:var(--ink2)} .com.done .n{color:#2d6b3a}
  .cx{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 14px}
  .el{display:grid;grid-template-columns:22px 1fr;gap:0 8px;align-items:start;font-size:14px;line-height:1.2;padding:3px 0}
  .el .sw{width:20px;height:20px;border-radius:50% 45% 55% 40%;border:1px solid #2a1d1288;margin-top:2px}
  .el b{font-weight:600} .el small{display:block;color:var(--ink2);font-style:italic;font-size:12.5px}
  .el.unk{color:#8a7658} .el.unk .sw{background:repeating-linear-gradient(45deg,#c9b48a 0 3px,#dccaa2 3px 6px)}
  .note{font-style:italic;color:var(--ink2);font-size:14.5px}
  .toast-wrap{bottom:auto;top:76px}
  /* the assay bench: two wells, a catalyst, a prediction, as brass-edged slots on the goal line's vellum */
  #bench{margin:0 12px 6px;padding:4px 8px;background:linear-gradient(#e6d6b2,#d4bf92);color:var(--ink);border:1px solid #8a6a3a;box-shadow:0 3px 10px #0007}
  #bench .row{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  #bench b{font:400 18px "Uncial Antiqua",serif;color:var(--verm)} #bench b.nr{font:italic 14px "EB Garamond",serif;color:var(--ink2)}
  #bench .slot{min-width:52px;min-height:40px;padding:2px 8px;font-size:21px;display:inline-flex;align-items:center;gap:5px;background:#f4ead2;box-shadow:inset 0 1px 3px #0004}
  #bench .slot small{font:italic 13px "EB Garamond",serif;color:var(--ink2)} #bench .slot i{width:14px;height:14px;border-radius:50%;background:var(--c);border:1px solid #2a1d1288}
  #bench .slot.on{outline:2px solid var(--verm);outline-offset:1px} #bench .slot.pr{border-style:dashed}
  #bench #bRun{min-width:86px;display:inline-flex;flex-direction:column;line-height:1.05} #bench #bRun small{font:italic 11px "EB Garamond",serif;opacity:.8}
  #bench #bRun:disabled{opacity:.55;cursor:default}
  #bench .chip{min-height:32px;padding:2px 8px;font-size:14px}
  #bench .res{font-size:14.5px;line-height:1.25;margin-top:3px;min-height:18px} #bench .res.ok{color:#2d6b3a;font-weight:600} #bench .res.no{color:var(--verm);font-weight:600}
  .vial.glyph span{font:600 17px/1 "EB Garamond",serif;font-style:normal;overflow:visible}
  #leaf ul.help{margin:4px 0;padding-left:20px;font-size:14.5px} #leaf .card{font-size:18px}
  #verdict{position:absolute;left:50%;top:30%;font:400 34px "Uncial Antiqua",serif;letter-spacing:.06em;padding:4px 16px;border:4px double currentColor;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(2) rotate(-12deg)}
  #verdict.ok{color:#2d6b3a;background:#e9f0d6cc} #verdict.no{color:#b0301c;background:#f4dccbcc}
  #verdict.on{animation:stamp 2.2s ease-out forwards}
  @keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) scale(2.2) rotate(-14deg)}15%{opacity:1;transform:translate(-50%,-50%) scale(.95) rotate(-9deg)}22%{transform:translate(-50%,-50%) scale(1.02) rotate(-9deg)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1) rotate(-9deg)}}
  .toast{background:linear-gradient(#efe3c6,#ddc99f);color:var(--ink);border:1px solid #8a6a3a;border-radius:1px;font:16px "EB Garamond",serif;box-shadow:0 6px 18px #000a}
  .toast b{color:var(--verm)}
  .modal{background:linear-gradient(#efe3c6,#e1cfa6);color:var(--ink);border:1px solid #6b4a22;border-radius:2px;font:17px/1.4 "EB Garamond",serif}
  .modal h2{font:400 26px "Uncial Antiqua",serif;color:var(--verm)}
  .modal .modal-actions{background:#e6d6b2}
  @media (max-width:640px){
    header{padding:4px 8px;gap:5px;flex-wrap:nowrap} h1{font-size:20px} header button{padding:3px 7px;font-size:14px}
    #goal{margin:0 6px 4px;font-size:14px;padding:4px 8px} #goal .cap{font-size:18px}
    #goal .wide{display:none}
    #bench{margin:0 6px 4px;padding:3px 6px} #bench .slot{min-width:44px;padding:2px 5px} #bench .row{gap:3px} #bench #bRun{min-width:70px} #verdict{font-size:26px}
    .vial{width:44px;height:58px} .vial .fl{width:26px;height:34px;margin-left:-13px} .vial span{max-width:44px}
    #fams{gap:2px} #fams button{font-size:12px;padding:2px 5px} #fams .pz-bar{margin-left:3px;gap:2px} #fams .pz-bar button{min-width:30px;padding:0}
    #leaf{padding:12px 14px}
  }
  /* small landscape phones: vials in a column beside the tray */
  @media (max-height:500px) and (min-width:560px){
    header{padding:2px 8px} h1{font-size:18px} #goal{margin:0 8px 3px;font-size:13px;min-height:0;padding:2px 8px}
    #desk{flex-direction:row;align-items:stretch} #shelf{width:210px;justify-content:flex-start} #fams{flex-wrap:wrap;justify-content:center} #vials{flex-direction:row;flex-wrap:wrap;align-content:flex-start;overflow-y:auto;overflow-x:hidden;width:200px;touch-action:pan-y}
    .vial{width:44px;height:54px}
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../index.html">← Rabbit Holes</a>
  <h1><span class="r">A</span>lembic</h1>
  <span class="sp"></span>
  <button id="pauseBtn" title="Pause or run the tray (space)">Pause</button>
  <button id="clearBtn" title="Empty the tray">Clear</button>
  <button id="bookBtn" class="rub" title="Commissions, codex, daily tray, sandbox">Book</button>
</header>
<div id="goal" aria-live="polite"><div class="txt"></div><div class="pg"></div></div>
<div id="bench" hidden></div>
<main id="desk" data-play>
  <div id="trayWrap"><canvas id="tray" aria-label="The tray: drag to pour; pinch or wheel to zoom"></canvas><div id="verdict" aria-live="assertive"></div>
    <svg id="seal" viewBox="0 0 150 150" aria-hidden="true"><defs><radialGradient id="wx" cx=".4" cy=".35"><stop offset="0" stop-color="#d8442c"/><stop offset=".7" stop-color="#9c1f12"/><stop offset="1" stop-color="#6a120a"/></radialGradient></defs>
      <path d="M75 6 C98 4 112 18 128 26 C142 44 146 60 143 78 C146 100 132 118 116 130 C98 144 80 146 62 142 C40 140 22 128 12 108 C2 88 6 66 12 48 C20 28 44 8 75 6Z" fill="url(#wx)"/>
      <circle cx="75" cy="75" r="46" fill="none" stroke="#f3b9a0" stroke-opacity=".5" stroke-width="3"/>
      <text x="75" y="70" text-anchor="middle" font-family="Uncial Antiqua" font-size="17" fill="#ffd9c4" fill-opacity=".9">OPUS</text>
      <text x="75" y="92" text-anchor="middle" font-family="Uncial Antiqua" font-size="14" fill="#ffd9c4" fill-opacity=".9">PERFECTUM</text></svg>
  </div>
  <div id="shelf"><div id="fams" role="tablist" aria-label="Vial shelves"></div><div id="vials" role="toolbar" aria-label="Vials"></div></div>
</main>
<div id="book" role="dialog" aria-label="The book"><div id="leaf"></div></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script>
'use strict';
// ===================== The elements =====================
// kind: 1 powder, 2 liquid, 3 gas, 4 solid, 5 flame. dens orders what sinks through what.
const POW=1, LIQ=2, GAS=3, SOL=4, FLM=5;
const ELS=[
 ['empty','Nothing',0,0,['#eadcbc'],''],
 ['sand','Sand',POW,16,['#d6b062','#cca356','#e0be76','#c69b4e'],'Quartz grains. Heat them and they run together into glass.'],
 ['water','Water',LIQ,10,['#4c7cad','#5585b5','#4775a4'],'The universal solvent of the old books. It wets, dissolves, quenches and feeds.'],
 ['fire','Fire',FLM,0,['#f4a63a','#e8742a','#f7c95a','#d9521f'],'Not a substance at all but a happening: things combining with the air, fast.'],
 ['earth','Earth',POW,15,['#7a5a3a','#6d5034','#85633f'],'Soil and ore together. Wet it, fire it, melt it.'],
 ['plant','Plant',SOL,5,['#5f8a3a','#6b9842','#557d34'],'Drinks water and climbs toward the light. Old growth turns to wood.'],
 ['oil','Oil',LIQ,8,['#3e2c15','#48341b','#352610'],'Plants buried deep, out of the air, turn slowly to oil. It floats, and it burns.'],
 ['salt','Salt',POW,14,['#f4f1e8','#e6e2d6','#fbf9f2'],'Left behind when brine is boiled dry. It melts ice and kills plants.'],
 ['stone','Stone',SOL,30,['#7d7b74','#8a877f','#706e68'],'Lava that cooled slowly in the air.'],
 ['steam','Steam',GAS,3,['#fbfdff','#f1f6fa','#ffffff'],'Water made air. It rises, cools and rains back down: nothing is lost.'],
 ['smoke','Smoke',GAS,4,['#8b8478','#9a9386','#7c766b'],'What a fire leaves in the air.'],
 ['glass','Glass',SOL,30,['#6fc0c8','#5db4bf','#86ced4'],'Sand fused by fire. Nothing eats it, not even vitriol.'],
 ['mud','Mud',POW,17,['#5a4030','#4f382a','#634636'],'Wet earth. Seeds wake in it; fire turns it to brick.'],
 ['brick','Brick',SOL,30,['#a24a2e','#b0553a','#933f26'],'Fired mud. The first artificial stone.'],
 ['ash','Ash',POW,4,['#b5aea2','#a59e93','#c3bcb0'],'What burnt plants leave. Steep it in water for lye; it feeds flowers.'],
 ['lye','Lye',LIQ,10.5,['#c7c27a','#bdb76e','#d1cc86'],'Water steeped through ash. Boil it for salt of tartar; mix it with oil for soap.'],
 ['wood','Wood',SOL,6,['#7a4b26','#6c4120','#86552c'],'Old plant, hardened. Burns long; smothered, it chars.'],
 ['charcoal','Charcoal',POW,7,['#2b2622','#352f29','#231f1b'],'Charred wood. Light it and it glows as embers, far hotter than flame.'],
 ['ember','Embers',POW,7,['#c2361b','#e0582a','#a52a14','#f07a30'],'Glowing charcoal. Hot enough to melt earth and sand.'],
 ['lava','Lava',LIQ,25,['#e0541e','#f07a2a','#c83a14','#f59a3a'],'Molten earth. Cools to stone in air, to obsidian in water.'],
 ['obsidian','Obsidian',SOL,30,['#231d2b','#2d2536','#1b1622'],'Lava quenched so fast it had no time to crystallise: natural glass.'],
 ['brine','Brine',LIQ,11,['#6f98a6','#7aa3b0','#6690a0'],'Salt water. Rusts iron ten times faster than fresh.'],
 ['iron','Iron',POW,40,['#5d6066','#686b72','#53565c'],'Won from molten earth by charcoal, as in a bloomery. Rusts in water.'],
 ['rust','Rust',POW,20,['#9b4f2a','#a85b33','#8c4423'],'Iron returning to earth.'],
 ['wax','Wax',SOL,6,['#efe0a8','#e6d595','#f5e9bd'],'Earth wax: oil thickened by clay. Burns slowly, one drop at a time.'],
 ['soap','Soap',POW,9,['#e8d9e6','#dccbd9','#f1e6ef'],'Oil and lye joined. Water turns it to froth.'],
 ['foam','Froth',GAS,6,['#fffdf8','#f7f2ea','#ffffff'],'Soap bubbles. They rise a little and burst.'],
 ['seed','Seed',POW,6,['#8a6b2e','#7c5f27','#977636'],'Dropped by flowers. Falls, floats, and sprouts in mud.'],
 ['flower','Flower',SOL,5,['#c43a5a','#d65a78','#b02e4c','#e6c24a'],'A plant fed with ash, in the open air.'],
 ['essence','Essence',LIQ,8.5,['#e48aa6','#ea9bb4','#dc7a99'],'Attar: steam drawn through flowers carries their oil away.'],
 ['nitre','Nitre',POW,14,['#ebe7f2','#dcd6e8','#f4f1f8'],'Saltpetre, which grows where ash rots in wet earth. Dissolving it chills water to ice.'],
 ['sulfur','Sulfur',POW,13,['#e6cc2e','#d9bd22','#efd94e'],'Brimstone, left where steam meets lava. Burns blue into choking fume.'],
 ['gunpowder','Gunpowder',POW,14,['#3a3a40','#45454c','#2f2f35'],'Nitre and charcoal, quickened by sulfur.'],
 ['pyrite','Fool\'s gold',POW,30,['#c9a640','#b8952f','#d9b852'],'Iron and sulfur. Every alchemist made it; none made the real thing.'],
 ['coal','Coal',POW,12,['#1c1a18','#262320','#141210'],'Wood buried out of the air for ages.'],
 ['ice','Ice',SOL,9,['#d4ecf4','#c2e2ee','#e4f4f8'],'Water chilled by dissolving nitre. Melts in the open, fast by fire.'],
 ['snow','Snow',POW,3,['#fbfbf7','#eef2f2','#ffffff'],'Steam frozen straight from the air onto ice.'],
 ['moss','Moss',SOL,5,['#4f6b2a','#5a7a31','#455e24'],'A plant that has learnt to live on stone.'],
 ['tar','Tar',LIQ,12,['#1e1a16','#28221c','#16130f'],'Oil soaked into sand: thick, slow and smoky.'],
 ['steel','Steel',POW,40,['#9aa3ad','#a8b1ba','#8b949e'],'Iron that has taken in charcoal from the embers. It hardly rusts.'],
 ['fume','Brimstone fume',GAS,5,['#d2d48c','#c6ca7c','#dadd9c'],'Burning sulfur\'s choking air. It withers plants; steam turns it to vitriol.'],
 ['vitriol','Oil of vitriol',LIQ,13,['#9fc23a','#aecf4a','#90b22c'],'Sulfuric acid. Eats stone, iron and wood; only glass will hold it.'],
 ['copperas','Green vitriol',POW,15,['#4fae8a','#5cbb96','#43a07d'],'Iron eaten by vitriol. Roast it and the vitriol comes back out.'],
 ['hydrogen','Inflammable air',GAS,1,['#efe4f6','#f4ecf8','#e8dcf0'],'Cavendish\'s gas from iron and acid. Lighter than anything; it bangs.'],
 // eight blank substances for the Assay Office: each world writes its own glyphs, kinds, colours and laws into them
 ['x0','?',POW,10,['#888888'],''],
 ['x1','?',POW,10,['#888888'],''],
 ['x2','?',POW,10,['#888888'],''],
 ['x3','?',POW,10,['#888888'],''],
 ['x4','?',POW,10,['#888888'],''],
 ['x5','?',POW,10,['#888888'],''],
 ['x6','?',POW,10,['#888888'],''],
 ['x7','?',POW,10,['#888888'],''],
];

function closure(pal){
  const have=new Uint8Array(NT); have[0]=1; for (const t of pal) have[t]=1;
  for (let changed=true; changed;){ changed=false;
    for (const [a,b,oa,ob] of RULES){ if (!have[a]||!have[b]) continue; for (const o of [].concat(oa,ob)) if (o>0 && !have[o]){ have[o]=1; changed=true; } }
    for (const [a,o] of SPECIAL) if (have[a] && !have[o]){ have[o]=1; changed=true; }
    if (have[FIRE]&&!have[SMOKE]){ have[SMOKE]=1; changed=true; } }
  have[0]=0; return have;
}
const POOL=[SAND,WATER,FIRE,EARTH,PLANT,OIL,SALT,STONE,ASH,IRON,SULF,NITRE,ICE,CHAR,MUD,LYE,WAX,SEED];
function dailyFor(key){
  const r=RH.rng('alembic:'+key);
  for (let tries=0; tries<200; tries++){
    const pal=r.shuffle(POOL.slice()).slice(0,4); const cl=closure(pal); let n=0; for (let t=1;t<NREAL;t++) if (cl[t] && !pal.includes(t)) n++;
    if (n>=12 && n<=30) return {key, pal, possible:n, seed:RH.hashStr('tray:'+key)|1};
  }
  return {key, pal:START.slice(), possible:0, seed:7};
}

// trays as links: run-length coded types, base64url
function encodeTray(){
  const out=[]; let i=0;
  while (i<NC){ const t=T[i]; let n=1; while (i+n<NC && T[i+n]===t && n<16383) n++; out.push(t); if (n<128) out.push(n); else out.push(128|(n>>8), n&255); i+=n; }
  let s=''; const u=new Uint8Array(out); for (let k=0;k<u.length;k+=8192) s+=String.fromCharCode.apply(null,u.subarray(k,k+8192));
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');

    while (k<b.length && i<NC){ const t=b.charCodeAt(k++); let n=b.charCodeAt(k++); if (n&128) n=((n&127)<<8)|b.charCodeAt(k++); if (!(t<NREAL)) return false; for (let m=0;m<n&&i<NC;m++,i++){ T[i]=t; L[i]=life(t,t); S[i]=rnd()&63; } }

  } catch(e){ return false; }
}

// ===================== The Assay Office: matter nobody has described =====================
// Each world is drawn from a seed: a handful of unknown substances (glyphs, not names) and hidden laws taken from a
// grammar of real kinds of law: A + B → C; changes that need heat; reactions that need a catalyst close by; a substance
// that decays by itself; one that grows into another; one that eats another. The same cellular engine runs them.
// Experiments cost drops. File each law on a card: predict, then test. The office stamps a card only if the tray shows

let world=null, cards=[], fines=0;
function makeWorld(wseed, tier){

  const ids=[]; for (let i=0;i<8;i++) ids.push(NREAL+i);
  const order=r.shuffle(ids.slice()), glyphs=r.shuffle(GLYPHS.slice()), hue0=r()*360;

  if (tier>=5){ const q=pickPair(prods.slice(0,pi), base); if (q) add(q[0],q[1],K,q[0],.03+r()*.03,'grow'); }
  if (tier>=6){ const q=pickPair(prods.slice(0,pi), prods.slice(0,pi).concat(base)); if (q) add(q[0],q[1],K,0,.04+r()*.04,'eat'); }

}
// install a world into the engine's tables (and only touch the unknown substances' rows and columns)
function installWorld(Wd){

  for (let i=NREAL;i<NT;i++){ const s=Wd.subs[i]; if (!s) continue; KIND[i]=s.kind; DENS[i]=s.dens; FLUID[i]=(s.kind===LIQ||s.kind===GAS)?1:0; ELS[i][1]=s.g; ELS[i][2]=s.kind; ELS[i][3]=s.dens;

    for (let v=0;v<8;v++){ const j=((v*37)%9)-4; PAL[i*8+v]=pack(Math.max(0,Math.min(255,c[0]+j)),Math.max(0,Math.min(255,c[1]+j)),Math.max(0,Math.min(255,c[2]+j))); } }

function stampIt(ok){ const v=$('verdict'); v.textContent=ok?'CONFIRMED':'REFUTED'; v.className=ok?'ok':'no'; void v.offsetWidth; v.classList.add('on'); }
// the bench row under the goal line: tap a slot, then a vial; Mix (or Test card, once you predict a product)
const SLOTLAB={ a:'well A', b:'well B', k:'catalyst', p:'predict' };
function nextSlot(s){ return s==='a'?'b': s==='b'?(world.tier>=3?'k':'p') : 'p'; }
function renderBench(){
  const el=$('bench'); if (!el) return; if (mode!=='office' || !world){ el.hidden=true; return; } el.hidden=false;
  const slot=k=>{ const v=bench[k], set= k==='a'? v>0 : k==='k'? v>0 : v>=0;
    const inner= !set? `<small>${SLOTLAB[k]}</small>` : v===0? `<small>${k==='b'?'alone':'nothing'}</small>` : `<i style="--c:${v===FIRE?'#e0553a':ELS[v][4][0]}"></i>${glyph(v)}`;

  el.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{ if (trial) return; bench.slot=b.dataset.slot; FX.sfx('tick'); renderBench(); });
  el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ if (trial) return; bench[bench.slot]=+b.dataset.v; lastResult=null; reveal=null; bench.slot=nextSlot(bench.slot); FX.sfx('tick'); renderBench(); });

function benchPick(t){ if (mode!=='office' || !world || trial || !(t>0)) return; const s=bench.slot; if (t===FIRE && s!=='b') return;
  bench[s]=t; lastResult=null; reveal=null; bench.slot= s==='p'? 'p' : nextSlot(s); renderBench(); }
// the ghost: before a test, the predicted product hangs over the wells, faint and pulsing; during it, it stays; after it,
// the answer: what formed, under what you said, with a tick or a cross
function drawGhost(){
  if (mode!=='office' || !world) return;
  const now=performance.now(), d=Math.min(2,devicePixelRatio||1), fs=Math.max(4,15/cam.k), xa=W/2-BLK, top=H-BLK-(bench.k?4:0)-1;
  ctx.save(); ctx.textAlign='center'; ctx.textBaseline='bottom'; ctx.font=`600 ${fs}px "EB Garamond",serif`;
  const sw=(t,x,y,s,a)=>{ ctx.globalAlpha=a; ctx.fillStyle= t===0? '#e9dcbc' : t===FIRE? '#e0553a' : ELS[t][4][0]; ctx.fillRect(x-s/2,y-s,s,s); ctx.globalAlpha=1; ctx.strokeStyle='#2a1d12'; ctx.lineWidth=.4; ctx.strokeRect(x-s/2,y-s,s,s); };
  if (!trial && !reveal && bench.a>0 && bench.b>=0){ // where the wells will go
    ctx.setLineDash([1.5,1.5]); ctx.strokeStyle='#5b4632'; ctx.lineWidth=.5;
    if (bench.b>0 && bench.b!==FIRE){ ctx.strokeRect(xa+.5,top+.5,BLK-1,BLK); ctx.strokeRect(xa+BLK+.5,top+.5,BLK-1,BLK); } else ctx.strokeRect(xa+.5,top+.5,2*BLK-1,BLK);

    ctx.fillStyle='#2a1d12'; ctx.fillText('? '+(pr? glyph(pr) : '∅'), W/2, top-2); }

}
const KINDNAME={ mix:'two meet', heat:'heat', cat:'catalyst', decay:'alone', grow:'grows', eat:'eats' };
function kindsLine(){ const c={}; for (const l of world.laws){ const k=KINDNAME[l.kind]; c[k]=c[k]||[0,0]; c[k][1]++; if (cards.some(x=>x.st==='seen' && matchLaw(x.c)===l)) c[k][0]++; } return Object.entries(c).map(([k,[f,n]])=>`${k} ${'■'.repeat(f)}${'□'.repeat(n-f)}`).join(' · '); }
const lawsFound=()=>world.laws.filter(l=>cards.some(x=>x.st==='seen' && matchLaw(x.c)===l)).length;
const glyph=t=>t===0?'∅':t===FIRE?'🔥':ELS[t][1];
function cardText(c){ const [a,b,p,k]=c; return `${glyph(a)} ${b===0?'alone':b===FIRE?'+ heat':'+ '+glyph(b)} → ${p===0?'nothing':glyph(p)}${k?` (near ${glyph(k)})`:''}`; }
const patHave=t=>WMADE[t];   // made in any tray of this world (poured cells do not count)
function officeState(){ if (!world) return null; const pd=SAVE.office.pd||[], pats=world.pats.map(p=>({ ...p, have:patHave(p.t), done: pd.includes(p.t) }));

function startOffice(wseed, tier, keep){
  wseed=wseed>>>0; tier=Math.max(1,Math.min(6,tier|0)); mode='office'; com=null; daily=null; trial=null; reveal=null; lastResult=null;
  world=makeWorld(wseed, tier); installWorld(world); clearTray(); seed=(RH.hashStr('office:'+wseed)|1); FIRED.fill(0); fresh.clear();
  const S=SAVE.office, same= keep && S.w===world.seed && S.tier===world.tier;
  if (same){ const seen=new Set(S.seen); cards=S.cards.map(c=>({ c:c.slice(0,4), st: seen.has(c.slice(0,4).join()) && matchLaw(c)? 'seen' : 'false' })); budgetLeft=S.left; fines=S.fines; }
  WMADE.fill(0); if (same) world.pats.forEach((p,i)=>WMADE[p.t]=S.wm[i]||0);

  SAVE.m='office'; const k=new Uint8Array(NT); k[FIRE]=world.tier>=2?1:0; for (const t of world.base) k[t]=1; if (same) for (const t of S.made) if (world.ids.includes(t)) k[t]=1;

}
function saveOffice(){ if (!world) return; const S=SAVE.office; S.cards=cards.map(x=>x.c); S.seen=cards.filter(x=>x.st==='seen').map(x=>x.c.join()); S.left=budgetLeft; S.fines=fines; S.wm=world.pats.map(p=>WMADE[p.t]); S.made=[]; for (let t=NREAL;t<NT;t++) if (KNOWN[t]) S.made.push(t); persist(); }

const OFFICE_HELP=['Two samples go in the wells. <b>Mix</b> them and watch: whatever forms goes into a new vial.',
  'To file a law, set a <b>prediction</b> and press <b>Test card</b>. If the tray shows that law at work, the card is stamped and paid; if not, it is refuted and fined.',

  'Some things change all <b>alone</b>, given time: well B “alone”.', 'Some things <b>grow</b> by eating another; one may eat into <b>nothing</b>.'];
// the notebook page in the Book: your cards and your patrons
function drawOffice(){

function dayWorld(){ const h=RH.hashStr('assay:'+today())>>>0; return { seed: h%1000000, tier: 2+(h>>>20)%3 }; }

// ===================== Main loop =====================

function frame(now){
  requestAnimationFrame(frame);
  // on a slow device the tray runs at half rate rather than ever stalling the page
  const open=$('book').classList.contains('on');
