<style>
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#0a0f14}
  main{flex:1;display:flex;min-height:0}
  #left{width:280px;background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px}
  #stage{flex:1;position:relative;min-width:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
  #right{width:300px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
  .grp{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:12px 0 4px}
  .lv{display:flex;justify-content:space-between;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:13px}
  .lv:hover{background:var(--panel2)} .lv.cur{background:var(--panel2);outline:1px solid var(--accent)} .lv.lock{opacity:.35;cursor:default}
  .lv .s{color:var(--accent);font-size:11px}
  #score{font-size:44px;font-weight:800;line-height:1}
  .meter{height:10px;background:#1c2630;border-radius:5px;overflow:hidden}
  .meter div{height:100%;background:linear-gradient(90deg,#ff8a3a,#ffd36a)}
  .seq{font-family:ui-monospace,monospace;font-size:11px;word-break:break-all;line-height:1.5}
  .seq .h{color:#ff9a4a} .seq .p{color:#6ac8ff}
  .tool{display:flex;gap:8px;align-items:flex-start;font-size:13px;padding:4px 0}
  .tool .k{min-width:22px;color:var(--accent)}
  .tool.lock{opacity:.4}
  #hint{position:absolute;bottom:10px;left:12px;font-size:12px;color:var(--dim)}

  #pivots{display:none;gap:4px} #pivots.on{display:flex}
  #modes{display:flex} #modes button{box-shadow:none;margin-right:-1px} #modes button.on{background:#26241e;color:#fbf8ef}
  #score.pop{animation:pop .35s ease-out}

    #hint{display:none}
    .topbar{flex-wrap:wrap}

<script>
// ===================== Levels =====================
const CLASSICS=[
  ['S1-1','HPHPPHHPHPPHPHHPPHPH',9],
  ['S1-2','HHPPHPPHPPHPPHPPHPPHPPHH',9],
  ['S1-3','PPHPPHHPPPPHHPPPPHHPPPPHH',8],
  ['S1-4','PPPHHPPHHPPPPPHHHHHHHPPHHPPPPHHPPHPP',14],
  ['S1-5','PPHPPHHPPHHPPPPPHHHHHHHHHHPPPPPPHHPPHHPPHPPHHHHH',23],
  ['S1-6','HHPHPHPHPHHHHPHPPPHPPPHPPPPHPPPHPPPHPHHHHPHPHPHPHH',21],
  ['S1-7','PPHHHPHHHHHHHHPPPHHHHHHHHHHPHPPPHHHHHHHHHHHHPPPPHHHHHHPHHPHP',36],
  ['S1-8','HHHHHHHHHHHHPHPHPPHHPPHHPPHPPHHPPHHPPHPPHHPPHHPPHPHPHHHHHHHHHHHH',42],
  ['S1-9','HHHHPPPPHHHHHHHHHHHHPPPPPPHHHHHHHHHHHHPPPHHHHHHHHHHHHPPPHHHHHHHHHHHHPPPHPPHHPPHHPPHPH',53],
  ['S1-10','PPPPPPHPHHPPPPPHHHPHHHHHPHHPPPPHHPPHHPHHHHHPHHHHHHHHHHPHHPHHHHHHHPPPPPPPPPPPHHHHHHHPPHPHHHPPPPPPHPHH',48],
];
const LV=[];
const tut=['HPPH','HPHPPH','HHPPHH','HPPHPPHH','PHPPHPHH','HPHPHPPHPH','HHPPHPHPPHH','PHHPPHPHHPPH','HPPHHPPHHPPH','HHPHPPHPHHPPH'];
const TUT_STORY=[
  'Two oily (H) balls want to touch, away from the water. Bend the chain so they sit side by side. N and C mark the chain\'s two ends (in a real protein, the N- and C-terminus).',
  'Each red thread is an H–H contact. Neighbours along the chain never count: they are already joined.',
  '<b>Parity.</b> The grid is a chessboard. Every step along the chain changes square colour, so a ball can only touch balls of the opposite colour: even positions touch odd ones. Look for the H pairs that can never meet.',
  '<b>Ceiling.</b> A ball in the middle of the chain has two free sides; an end has three. Add up the free sides of the even-position Hs, then of the odd ones: the smaller sum is a ceiling no fold can beat. When you reach it, you have proved the fold is perfect.',
  'Crankshaft is unlocked: flip a U-shape over in one move.',
  '<b>Build the core first.</b> Fold the Hs into a tight blob, then let the Ps loop around the outside where the water is.',
  'Pull is unlocked: drag any ball and the chain follows like a rope. Long chains get much easier.',
  'Parity again: count even and odd Hs before you start. The smaller group limits everything.',
  'Two cores or one? Try both. Local tidying often traps you in a fold that can\'t be improved one move at a time.',
  'Last warm-up. Pivot unlocks next: whole halves of the chain rotate around a ball.' ];
tut.forEach((s,i)=>LV.push({grp:'Warm-up', name:`Warm-up ${i+1}`, seq:s, story: TUT_STORY[i], exact:true}));
CLASSICS.forEach(([n,s,e],i)=>LV.push({grp:'Benchmarks', name:`${n} · ${s.length} beads`, seq:s, best:e, story:`One of the classic 2D HP benchmark chains that folding algorithms have been tested on for decades. The best fold anyone has found has <b>${e}</b> contacts.`}));
for (let i=0;i<12;i++){ const r=RH.rng('fold'+i); const n=20+i*3; let s=''; for (let k=0;k<n;k++) s+= r()<0.5?'H':'P'; LV.push({grp:'Versus the machine', name:`Protein #${(r()*9000+1000)|0} · ${n}`, seq:s, story:'A new chain. The computer runs its own folding search when the level loads. Beat it, or match it.', machine:true}); }
// Design: the inverse problem. Choose H or P for each ball so that this shape is the one best fold.
const DESIGNS=[
  {name:'Design 1 · hairpin', shape:[[0,0],[1,0],[2,0],[3,0],[3,1],[2,1],[1,1],[0,1]], story:'Protein design runs folding backwards: pick the sequence so this shape is the <b>only</b> best fold. Click balls to switch them between H and P, then ask the machine to check.'},
  {name:'Design 2 · hook', shape:[[0,0],[1,0],[2,0],[2,1],[1,1],[0,1],[0,2],[1,2],[2,2],[3,2]], story:'Every extra H is another way for a rival fold to win. Use parity: only even–odd pairs can ever touch.'},
  {name:'Design 3 · snake', shape:[[0,0],[1,0],[2,0],[3,0],[3,1],[2,1],[1,1],[0,1],[0,2],[1,2],[2,2],[3,2]], story:'Master design: the snake has exactly one sequence whose best fold is unique with two contacts. Even the machine can only check, not invent.'},
];
DESIGNS.forEach(d=>LV.push({grp:'Design', name:d.name, seq:'P'.repeat(d.shape.length), shape:d.shape, design:true, story:d.story}));
// Move unlocks
const TOOLS=[
  {k:'end', n:'End wiggle', d:'Drag an end bead to a free spot next to its neighbour.', at:0},
  {k:'corner', n:'Corner flip', d:'Drag a bead that sits on a corner across to the opposite corner.', at:0},
  {k:'crank', n:'Crankshaft', d:'Drag the bottom of a U-shape to flip the whole U to the other side.', at:3},
  {k:'pull', n:'Pull', d:'Drag any bead one step into free space. The chain follows behind it like a rope.', at:6},
  {k:'pivot', n:'Pivot', d:'Select a bead, then press <kbd>Q</kbd>/<kbd>E</kbd> to rotate the shorter side of the chain around it, or <kbd>W</kbd> to mirror it.', at:10},
];
const isObj=(o)=>o&&typeof o==='object'&&!Array.isArray(o);
let SAVE=RH.load('fold', null); if (!isObj(SAVE)) SAVE={cur:0, best:{}, folds:{}, machine:{}};
for (const k of ['best','folds','machine','bestFold','dseq','dstar']) if (!isObj(SAVE[k])) SAVE[k]={};
for (const j of Object.keys(SAVE.dseq)) if (!LV[j] || !LV[j].design || typeof SAVE.dseq[j]!=='string' || !/^[HP]+$/.test(SAVE.dseq[j]) || SAVE.dseq[j].length!==LV[j].shape.length) delete SAVE.dseq[j];
for (const j of Object.keys(SAVE.dstar)) if (!LV[j] || !LV[j].design || ![1,2,3].includes(SAVE.dstar[j])) delete SAVE.dstar[j];
for (const k of ['best','machine']) for (const j of Object.keys(SAVE[k])) if (!Number.isFinite(SAVE[k][j]) || SAVE[k][j]<0 || !LV[j]) delete SAVE[k][j];
if (!Number.isInteger(SAVE.cur) || SAVE.cur<0 || SAVE.cur>=LV.length) SAVE.cur=0;
const validFold=(P,n)=>Array.isArray(P) && P.length===n && P.every(p=>Array.isArray(p)&&p.length===2&&Number.isInteger(p[0])&&Number.isInteger(p[1])) && valid(P);
const persist=()=>{ RH.save('fold',SAVE); RH.progress('fold', Object.keys(SAVE.best).filter(k=>stars(+k)>=1).length/LV.length); };

// ===================== Geometry =====================
let seq, pos, hist=[], fut=[], li, sel=-1;
const key=(x,y)=>x+','+y;
const adj=(a,b)=>Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])===1;
function occ(){ const m=new Map(); pos.forEach((p,i)=>m.set(key(p[0],p[1]),i)); return m; }
function contacts(P=pos, S=seq){ const m=new Map(); P.forEach((p,i)=>m.set(key(p[0],p[1]),i)); let c=0; const pairs=[];
  for (let i=0;i<P.length;i++){ if (S[i]!=='H') continue; for (const [dx,dy] of [[1,0],[0,1]]){ const j=m.get(key(P[i][0]+dx,P[i][1]+dy)); if (j!==undefined && S[j]==='H' && Math.abs(i-j)>1){ c++; pairs.push([i,j]); } } }
  return {c, pairs}; }
function valid(P){ const s=new Set(); for (let i=0;i<P.length;i++){ const k=key(P[i][0],P[i][1]); if (s.has(k)) return false; s.add(k); if (i && !adj(P[i],P[i-1])) return false; } return true; }
const toolOn=(k)=> li>=TOOLS.find(t=>t.k===k).at;
// Try moving bead i to lattice cell t. Returns new positions or null.
function tryMove(i, t){
  const m=occ(); if (m.has(key(t[0],t[1]))) return null;
  const n=pos.length, P=pos.map(p=>p.slice());
  const nb=[i>0?pos[i-1]:null, i<n-1?pos[i+1]:null];
  // end wiggle / corner flip: new spot keeps both bonds
  if (nb.every(q=>!q||adj(q,t))){ if ((i===0||i===n-1)? toolOn('end') : toolOn('corner')){ P[i]=t; return P; } }
  // crankshaft: i and a neighbour j form the bottom of a U; move both one step together
  if (toolOn('crank')){ for (const j of [i-1,i+1]){ if (j<0||j>=n) continue; const d=[t[0]-pos[i][0], t[1]-pos[i][1]]; const tj=[pos[j][0]+d[0], pos[j][1]+d[1]];
      const oi = j===i-1? i+1 : i-1, oj = j===i-1? j-1 : j+1; if (oi<0||oi>=n||oj<0||oj>=n) continue;
      if (!m.has(key(tj[0],tj[1])) && adj(t,pos[oi]) && adj(tj,pos[oj]) && adj(t,tj)){ P[i]=t; P[j]=tj; return P; } } }
  // pull move: keep one neighbour anchored, drag the other side of the chain along
  if (toolOn('pull')){ const dirs = i < n/2 ? [-1,1] : [1,-1]; for (const dir of dirs){ const Q=pullMove(pos,i,t,dir); if (Q) return Q; } }
  return null;
}
function pullMove(P0,i,t,dir){
  const n=P0.length; const anchor=i-dir; const occupied=new Set(P0.map(p=>key(p[0],p[1])));
  if (occupied.has(key(t[0],t[1]))) return null;
  if (anchor>=0 && anchor<n && !adj(t,P0[anchor])) return null;
  const P=P0.map(p=>p.slice()); const p=P0[i];
  const dist=Math.abs(t[0]-p[0])+Math.abs(t[1]-p[1]);
  if (dist===1){ P[i]=t; for (let j=i+dir; j>=0&&j<n; j+=dir){ if (adj(P0[j],P[j-dir])) break; P[j]=P0[j-dir]; } }
  else if (dist===2 && t[0]!==p[0] && t[1]!==p[1]){
    const corners=[[t[0],p[1]],[p[0],t[1]]].filter(c=> !(anchor>=0&&anchor<n&&c[0]===P0[anchor][0]&&c[1]===P0[anchor][1]));
    let done=false;
    for (const C of corners){ const nx=i+dir; const nextIsC = nx>=0&&nx<n && P0[nx][0]===C[0]&&P0[nx][1]===C[1];
      if (occupied.has(key(C[0],C[1])) && !nextIsC) continue;
      P[i]=t; if (nextIsC || nx<0 || nx>=n){ done=true; break; }
      P[nx]=C; for (let j=nx+dir; j>=0&&j<n; j+=dir){ if (adj(P0[j],P[j-dir])) break; P[j]=P0[j-2*dir]; } done=true; break; }
    if (!done) return null;
  } else return null;
  return valid(P)? P : null;
}
function pivot(i, kind){ if (!toolOn('pivot')||i<0) return; const n=pos.length; const side = i < n/2 ? 'low' : 'high'; const c=pos[i]; const P=pos.map(p=>p.slice());
  const rot=(p)=>{ const dx=p[0]-c[0], dy=p[1]-c[1]; if (kind==='cw') return [c[0]-dy,c[1]+dx]; if (kind==='ccw') return [c[0]+dy,c[1]-dx]; return [c[0]-dx,c[1]+dy]; };
  if (side==='low') for (let j=0;j<i;j++) P[j]=rot(pos[j]); else for (let j=i+1;j<n;j++) P[j]=rot(pos[j]);
  if (valid(P)) commit(P); else RH.toast('Blocked: that rotation would make the chain cross itself.'); }
function commit(P){ hist.push(pos); if (hist.length>500) hist.shift(); fut=[]; pos=P; afterChange(); }
function afterChange(){
  if (LV[li].design){ persist(); renderRight(); renderLevels(); return; }
  const {c}=contacts(); SAVE.folds[li]=pos; const prev=SAVE.best[li]||0;
  if (c>prev){ SAVE.best[li]=c; SAVE.bestFold[li]=pos.map(p=>p.slice()); const t=target(); if (t && c>=t && prev<t) celebrate(c,t); }
  persist(); renderRight(); renderLevels();
}
function target(){ const L=LV[li]; if (L.design) return null; return L.exact? optimum(li) : L.best ?? SAVE.machine[li]; }
// The parity ceiling: contacts only join even and odd positions; an inner H has 2 free sides, an end 3.
function parityBound(S){ let e=0,o=0; for (let i=0;i<S.length;i++) if (S[i]==='H'){ const cap=(i===0||i===S.length-1)?3:2; if (i%2) o+=cap; else e+=cap; } return Math.min(e,o); }
// ---- Design: enumerate every fold of a chain (up to rotation and reflection) and check a sequence against the target shape
const foldCache={};
