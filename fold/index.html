<style>

  }

    #note{width:300px;padding-top:6px} #brief{font-size:12px} .topbar{padding:3px 12px}
  }

<script>
/*ENGINE-START*/
// ===== The machine: exact enumeration of every fold of a short chain pinned at (0,0), beside a fixed molecule =====
// Bead types: 0 P (watery), 1 H (oily), 2 K (+, basic), 3 D (−, acidic). Molecule cells: 'o' oily, '+', '-', 'x' inert.
const FE = (() => {
  const D = [[1, 0], [0, 1], [-1, 0], [0, -1]];
  const ens = {};
  // Every self-avoiding fold, stored as packed directions plus its contact lists:
  // bead–bead pairs (i*16+j, |i−j|>1) and bead–molecule pairs (i*16+k). Cached per chain length and molecule shape.
  function enumerate(n, lig) {
    const id = n + '|' + lig.map(c => c.x + ',' + c.y).join(';');
    if (ens[id]) return ens[id];
    const W = 2 * n + 7, off = n + 3, occ = new Int16Array(W * W).fill(-1), la = new Int16Array(W * W).fill(-1);
    lig.forEach((c, k) => { const x = c.x + off, y = c.y + off; if (x >= 0 && y >= 0 && x < W && y < W) la[y * W + x] = k; });
    const dirs = [], bbS = [0], bb = [], blS = [0], bl = [], st = [], NB = [1, W, -1, -W];
    const place = (m, cell) => { for (let d = 0; d < 4; d++) { const c = cell + NB[d]; const j = occ[c]; if (j >= 0 && j < m - 1) st.push(0, j * 16 + m); const k = la[c]; if (k >= 0) st.push(1, m * 16 + k); } };
    const rec = (m, cell, code) => {
      if (m === n) { dirs.push(code); for (let s = 0; s < st.length; s += 2) (st[s] ? bl : bb).push(st[s + 1]); bbS.push(bb.length); blS.push(bl.length); return; }
      for (let d = 0; d < 4; d++) { const c = cell + NB[d]; if (occ[c] >= 0 || la[c] >= 0) continue; occ[c] = m; const len = st.length; place(m, c); rec(m + 1, c, code + d * Math.pow(4, m - 1)); st.length = len; occ[c] = -1; }
    };
    const c0 = off * W + off; if (la[c0] < 0) { occ[c0] = 0; place(0, c0); rec(1, c0, 0); }
    return ens[id] = { n, N: dirs.length, dirs: Float64Array.from(dirs), bbS: Uint32Array.from(bbS), bb: Uint8Array.from(bb), blS: Uint32Array.from(blS), bl: Uint8Array.from(bl) };
  }
  const coords = (E, k) => { const P = [[0, 0]]; let c = E.dirs[k]; for (let m = 1; m < E.n; m++) { const d = c % 4; c = Math.floor(c / 4); const l = P[m - 1]; P.push([l[0] + D[d][0], l[1] + D[d][1]]); } return P; };
  // acid (pH 4) neutralises D beads; base (pH 10) neutralises K beads: they behave as P
  const eff = (t, pH) => (pH === 'acid' && t === 3) || (pH === 'base' && t === 2) ? 0 : t;
  const BB = [[0, 0, 0, 0], [0, -2, 0, 0], [0, 0, 1, -2], [0, 0, -2, 1]];
  const LT = { x: 0, o: 1, '+': 2, '-': 3 };
  const T = 1;
  // energy of one fold for sequence S
  function energyOf(P, S, pH, lig) { const m = new Map(P.map((p, i) => [p[0] + ',' + p[1], i])); let e = 0;
    for (let i = 0; i < P.length; i++) for (const [dx, dy] of D) { const j = m.get((P[i][0] + dx) + ',' + (P[i][1] + dy)); if (j !== undefined && j > i + 1) e += BB[eff(S[i], pH)][eff(S[j], pH)]; }
    for (const c of lig) for (const [dx, dy] of D) { const j = m.get((c.x + dx) + ',' + (c.y + dy)); if (j !== undefined) e += BB[eff(S[j], pH)][LT[c.t] || 0]; }
    return e; }
  // Free energy (−T ln Z) over every fold, plus the lowest-energy fold (first found on ties: deterministic).
  function assess(E, S, pH, lig) {
    const n = E.n, t = new Uint8Array(n); for (let i = 0; i < n; i++) t[i] = eff(S[i], pH);
    const lt = (lig || []).map(c => LT[c.t] || 0), bbE = new Float64Array(256), blE = new Float64Array(256);
    for (let i = 0; i < n; i++) { for (let j = i + 2; j < n; j++) bbE[i * 16 + j] = BB[t[i]][t[j]]; for (let k = 0; k < lt.length; k++) blE[i * 16 + k] = BB[t[i]][lt[k]]; }
    let emin = 1e9, kmin = 0; const N = E.N, en = new Float64Array(N);
    for (let f = 0; f < N; f++) { let e = 0; for (let a = E.bbS[f], b = E.bbS[f + 1]; a < b; a++) e += bbE[E.bb[a]]; for (let a = E.blS[f], b = E.blS[f + 1]; a < b; a++) e += blE[E.bl[a]]; en[f] = e; if (e < emin) { emin = e; kmin = f; } }
    let z = 0; for (let f = 0; f < N; f++) z += Math.exp(-(en[f] - emin) / T);
    return { F: emin - T * Math.log(z), emin, kmin };
  }
  return { enumerate, coords, assess, eff, energyOf, BB, T, ens };
})();
const TYPES = 'PHKD';
const PHN = { n: 'pH 7', acid: 'pH 4', base: 'pH 10' };
const Lg = (s) => s.split(' ').map(t => { const [x, y, c] = t.split(','); return { x: +x, y: +y, t: c }; });
// The commissions: each one stacks a new requirement on what came before.
const COMMS = [
  { name: 'Wax pebble', n: 8, types: 2, lig: { A: Lg('1,1,o 2,1,o') }, req: [{ lig: 'A', pH: 'n', min: 2.0 }],
    brief: 'Make the chain grip the wax block. Tap a bead to paint it oily, then press Fold.',
    sci: 'Oily beads hide from water by pressing against each other and against oily surfaces. That is the hydrophobic effect, and most binding pockets start with it.' },
  { name: 'The rod', n: 9, types: 2, lig: { A: Lg('1,1,o 2,1,o 3,1,o') }, req: [{ lig: 'A', pH: 'n', min: 2.0 }], oil: 4,
    brief: 'Grip the longer rod with at most 4 oily beads. Drag beads to sketch the fold you intend.',
    sci: 'Every oily bead costs solubility: greasy designs clump together in the test tube. Oil is one of the three things a design is judged on.' },
  { name: 'Left hand', n: 10, types: 2, lig: { A: Lg('1,1,o 2,1,o 2,2,o'), B: Lg('1,1,o 2,1,o 2,0,o') }, req: [{ lig: 'A', pH: 'n', min: 1.3 }, { lig: 'B', pH: 'n', max: 0.7 }],
    brief: 'Grip the left-handed block but not its mirror image. Tap a line in the assay to see the fold the machine finds.',
    sci: 'Chirality: enzymes tell left- from right-handed molecules apart, which is why one mirror form of a drug can heal and the other harm.' },
  { name: 'Salt bridge', n: 9, types: 4, lig: { A: Lg('1,1,o 2,1,-') }, req: [{ lig: 'A', pH: 'n', min: 3.0 }],
    brief: 'New beads: K (+) and D (−). Tap a bead more times to reach them. Grip the charged block hard.',
    sci: 'Opposite charges attract: lysine (K) and aspartate (D) form salt bridges. But like charges on your own chain push each other apart.' },
  { name: 'Opposites', n: 10, types: 4, lig: { A: Lg('1,1,o 2,1,- 3,1,o'), B: Lg('1,1,o 2,1,+ 3,1,o') }, req: [{ lig: 'A', pH: 'n', min: 3.0 }, { lig: 'B', pH: 'n', max: 1.2 }],
    brief: 'Grip the block with a − face; ignore its twin with a + face.',
    sci: 'Specificity is bought with charge: oil sticks to everything, a charge only to its opposite.' },
  { name: 'Acid release', n: 10, types: 4, lig: { A: Lg('1,1,+ 2,1,o') }, req: [{ lig: 'A', pH: 'n', min: 2.0 }, { lig: 'A', pH: 'acid', max: 0.5 }],
    brief: 'Now the water changes. Grip at pH 7, let go at pH 4, where D beads lose their charge.',
    sci: 'Endosomes inside cells are acidic. Drug carriers use exactly this trick to drop their cargo once they are inside.' },
  { name: 'Acid catch', n: 10, types: 4, lig: { A: Lg('1,1,o 2,1,o') }, req: [{ lig: 'A', pH: 'acid', min: 0.3 }, { lig: 'A', pH: 'n', max: -0.3 }],
    brief: 'The other way round: stay shut at pH 7, grip only in acid.',
    sci: 'An allosteric switch: an internal salt bridge holds the pocket shut until acid breaks it. Haemoglobin lets go of oxygen in acidic muscle the same way.' },
  { name: 'Sturdy', n: 10, types: 4, lig: { A: Lg('1,1,o 2,1,o 2,2,o') }, req: [{ lig: 'A', pH: 'n', min: 2.0 }], oil: 5, robust: .7,
    brief: 'Real genes mutate. Grip the block, and keep working after 70% of all single-bead typos, with at most 5 oily beads.',
    sci: 'Robust designs share the work over many beads, so no single change breaks them. Evolution favours them for the same reason.' },
  { name: 'Sturdy hand', n: 10, types: 4, lig: { A: Lg('1,1,o 2,1,o 2,2,o'), B: Lg('1,1,o 2,1,o 2,0,o') }, req: [{ lig: 'A', pH: 'n', min: 1.3 }, { lig: 'B', pH: 'n', max: 0.7 }], robust: .4,
    brief: 'Left hand again, now with charges, and it must survive 40% of typos.',
    sci: 'Specific and robust pull in opposite directions: specificity lives in a few precise beads, robustness in redundancy.' },
  { name: 'Smart cargo', n: 11, types: 4, lig: { A: Lg('1,1,+ 2,1,o 2,2,o'), B: Lg('1,1,- 2,1,o 2,2,o') }, req: [{ lig: 'A', pH: 'n', min: 2.0 }, { lig: 'A', pH: 'acid', max: 0.3 }, { lig: 'B', pH: 'n', max: 0.3 }],
    brief: 'Carry the + cargo at pH 7, drop it at pH 4, and never pick up its − twin.',
    sci: 'Three rules at once is what a real delivery protein has to satisfy, and every rule you add shrinks the set of sequences that work.' },
  { name: 'Sturdy switch', n: 10, types: 4, lig: { A: Lg('1,1,+ 2,1,o') }, req: [{ lig: 'A', pH: 'n', min: 2.0 }, { lig: 'A', pH: 'acid', max: 0.5 }], robust: .5,
    brief: 'The acid release again, but it must keep working after half of all typos.',
    sci: 'Switches are fragile: a protein balanced between two states can be tipped by one mutation. Making one robust is an open problem.' },
  { name: 'The lock', n: 11, types: 4, lig: { A: Lg('1,1,+ 2,1,o 2,2,o'), B: Lg('1,1,o 2,1,o 3,1,o') }, req: [{ lig: 'A', pH: 'n', min: 2.0 }, { lig: 'A', pH: 'acid', max: 0.5 }, { lig: 'B', pH: 'n', max: 0.7 }], robust: .4,
    brief: 'Everything at once: grip the key at pH 7, release it in acid, ignore the oily rod, and survive 40% of typos.',
    sci: 'You have done what protein designers do: written a sequence for a function, not a shape. The shape came out of the physics.' },
];
// Which ensembles a commission needs: one per molecule shape plus the free chain.
const condsOf = (c) => c.req.map(r => ({ lig: c.lig[r.lig], pH: r.pH }));
function grip(c, S, r) { const L = c.lig[r.lig], E1 = FE.enumerate(c.n, L), E0 = FE.enumerate(c.n, []); return FE.assess(E0, S, r.pH).F - FE.assess(E1, S, r.pH, L).F; }
const oilOf = (S) => S.reduce((s, t) => s + (t === 1), 0);
// Grip values, slack per requirement (≥ 0 means met), the worst slack (the grip margin axis) and oil.
function evaluate(c, S) {
  const g = c.req.map(r => grip(c, S, r)), sl = c.req.map((r, k) => r.min != null ? g[k] - r.min : r.max - g[k]);
  const oil = oilOf(S); const oilSl = c.oil != null ? c.oil - oil : Infinity;
  const f = Math.min(...sl, oilSl); return { g, sl, f, oil, ok: f >= 0 };
}
// Robustness: every single-bead substitution (to any bead type the commission allows) is folded again.
function* robustGen(c, S) { let ok = 0, tot = 0; const weak = new Array(c.n).fill(0);
  for (let i = 0; i < c.n; i++) for (let t = 0; t < c.types; t++) { if (t === S[i]) continue; const M = S.slice(); M[i] = t; tot++; if (evaluate(c, M).ok) ok++; else weak[i]++; yield { i, done: false }; }
  return { frac: tot ? ok / tot : 0, weak }; }
const runGen = (g) => { let r; do r = g.next(); while (!r.done); return r.value; };
const robustOf = (c, S) => runGen(robustGen(c, S));
// A seeded design bot (simulated annealing on the worst slack, with a small oil penalty). Used to draft daily
// commissions and to check that every commission can be done.
function* botGen(c, seed, iters = 900, obj) {
  const r = RH.rng('bot:' + seed), n = c.n; const sc = obj || ((S) => Math.min(evaluate(c, S).f, 1) - 0.03 * oilOf(S));
  let best = null; const R = 3, per = Math.ceil(iters / R);
  for (let rs = 0; rs < R; rs++) { let S = Array.from({ length: n }, () => r.int(c.types)), s = sc(S);
    for (let it = 0; it < per; it++) { const M = S.slice(); M[r.int(n)] = r.int(c.types); if (r() < .25) M[r.int(n)] = r.int(c.types); const m = sc(M);
      if (m >= s || r() < Math.exp((m - s) / 0.12)) { S = M; s = m; } if (!best || s > best.s) best = { s, S: S.slice() }; if (it % 20 === 0) yield null; } }
  return best;
}
// ===== Daily and endless commissions: drafted from a seed, then calibrated by the machine's own best attempt =====
const SHAPES = [['1,1', '2,1'], ['1,1', '2,1', '3,1'], ['1,1', '2,1', '2,2'], ['1,1', '2,1', '2,0'], ['1,1', '2,1', '1,2']];
const MIRROR = { 2: 3, 3: 2 };
function* genCommGen(seed) {
  for (let attempt = 0; attempt < 6; attempt++) {
    const r = RH.rng('fold-comm:' + seed + ':' + attempt), n = 9 + r.int(2);
    const si = r.int(SHAPES.length), chem = SHAPES[si].map(() => { const u = r(); return u < .5 ? 'o' : u < .75 ? '+' : '-'; });
