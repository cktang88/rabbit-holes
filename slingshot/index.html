<script>
/*PHYS-START*/
// ===== Ring physics: the surface density Σ(a) of the rings on a radial grid, evolved by viscous spreading, moon torques
// (shepherding ∝ m²/Δ⁴, Lindblad resonances at a_m·(j/(j+1))^(2/3)) and accretion onto moons. Planet radius 1, GM 1.
// The same velocity field also drives the GPU particles, so what you see and what is scored agree.
const PH = (() => {
  const A0 = 1.15, A1 = 3.45, NB = 1150, DA = (A1 - A0) / NB;
  const ORBIT = 2 * Math.PI * Math.pow(2, 1.5); // time units per orbit at a = 2 (the ring's middle)
  const P = { D: 4e-8, KS: 14, KR: 4.0, CW: 5.0, KA: 0.02, VMAX: 2.5e-3 };
  const rH = (m, a) => a * Math.cbrt(m / 3);
  const resList = (am) => { const out = []; for (let j = 1; j <= 3; j++) { out.push({ a: am * Math.pow(j / (j + 1), 2 / 3), j, s: 1 / j, inner: true }); out.push({ a: am * Math.pow((j + 1) / j, 2 / 3), j, s: .6 / j, inner: false }); } return out; };
  // Drift velocity and accretion rate at every grid cell, from the moons.
  function field(moons, out) {
    out = out || { v: new Float32Array(NB), sink: new Float32Array(NB) }; out.v.fill(0); out.sink.fill(0);
    for (const mo of moons) { const h = rH(mo.m, mo.a), s4 = Math.pow(2 * h, 4), res = resList(mo.a);
      for (let i = 0; i < NB; i++) { const a = A0 + (i + .5) * DA, d = a - mo.a, ad = Math.abs(d);
        let v = P.KS * mo.m * mo.m * a * Math.sign(d) / (d * d * d * d + s4);
        if (ad < h) out.sink[i] += P.KA * (1 - ad / h);
        for (const r of res) { const w = r.a * P.CW * Math.sqrt(mo.m) * (1 + mo.e * 4) + DA, x = (a - r.a) / w; if (x * x < 9) v += P.KR * mo.m * r.s * Math.sign(x) * Math.exp(-x * x) / Math.sqrt(w); }
        out.v[i] += v; } }
    for (let i = 0; i < NB; i++) out.v[i] = Math.max(-P.VMAX, Math.min(P.VMAX, out.v[i]));
    return out;
  }
  // One explicit finite-volume step of ∂Σ/∂t = ∂/∂a (D ∂Σ/∂a − vΣ) − sink·Σ (upwind advection, zero-flux walls; the planet eats what falls in).
  function step(S, F, dt) {
    const flux = new Float32Array(NB + 1);
    for (let i = 1; i < NB; i++) { const v = .5 * (F.v[i - 1] + F.v[i]); flux[i] = -P.D * (S[i] - S[i - 1]) / DA + v * (v > 0 ? S[i - 1] : S[i]); }
    flux[0] = Math.min(0, -P.D * S[0] / DA + Math.min(0, F.v[0]) * S[0]); // falls onto the planet
    for (let i = 0; i < NB; i++) S[i] = Math.max(0, S[i] - dt * (flux[i + 1] - flux[i]) / DA - dt * F.sink[i] * S[i]);
  }
  // Advance by T time units with stable substeps.
  function advance(S, F, T) { let vm = 1e-9; for (let i = 0; i < NB; i++) vm = Math.max(vm, Math.abs(F.v[i]));
    const dtMax = Math.min(.45 * DA / vm, .2 * DA * DA / P.D, 1 / Math.max(1e-9, Math.max(...F.sink))); const n = Math.max(1, Math.ceil(T / dtMax)); for (let k = 0; k < n; k++) step(S, F, T / n); return n; }
  const idx = (a) => Math.max(0, Math.min(NB - 1, Math.floor((a - A0) / DA)));
  const aOf = (i) => A0 + (i + .5) * DA;
  function addBump(S, a, w, mass) { const s = new Float32Array(NB); let tot = 0; for (let i = 0; i < NB; i++) { const x = (aOf(i) - a) / w; s[i] = Math.exp(-x * x / 2); tot += s[i]; } for (let i = 0; i < NB; i++) S[i] += mass * s[i] / tot / DA; }
  function addBand(S, a0, a1, mass) { const i0 = idx(a0), i1 = idx(a1); for (let i = i0; i <= i1; i++) S[i] += mass / ((i1 - i0 + 1) * DA); }
  const total = (S, a0 = A0, a1 = A1) => { let t = 0; for (let i = idx(a0); i <= idx(a1); i++) t += S[i] * DA; return t; };
  function smooth(S, k = 3) { const o = new Float32Array(NB); for (let i = 0; i < NB; i++) { let s = 0, n = 0; for (let j = i - k; j <= i + k; j++) if (j >= 0 && j < NB) { s += S[j]; n++; } o[i] = s / n; } return o; }
  // Features the commissions look for, read from Σ.
  function gaps(S, minW = .03) { // empty lanes with ring material on both sides
    const sm = smooth(S, 4), out = []; let mx = 0; for (let i = 0; i < NB; i++) mx = Math.max(mx, sm[i]); if (mx < 50) return out; let lo = 0, hi = NB - 1; while (lo < NB && sm[lo] < .25 * mx) lo++; while (hi > 0 && sm[hi] < .25 * mx) hi--; if (hi - lo < 10) return out;
    let ref = 0, n = 0; for (let i = lo; i <= hi; i++) if (sm[i] > 0) { ref += sm[i]; n++; } ref /= Math.max(1, n);
    let i = lo; while (i <= hi) { if (sm[i] < .15 * ref) { let j = i; while (j <= hi && sm[j] < .15 * ref) j++; const w = (j - i) * DA; if (w >= minW) out.push({ a0: aOf(i), a1: aOf(j - 1), w }); i = j; } else i++; }
    return out; }
  function narrowRings(S) { // isolated ringlets: contiguous runs of material, with their width (containing 90% of their mass)
    const sm = smooth(S, 1), out = []; let mx = 0; for (let i = 0; i < NB; i++) mx = Math.max(mx, sm[i]); const th = mx * .02 + 1e-6; let i = 0;
    while (i < NB) { if (sm[i] > th) { let j = i; while (j < NB && sm[j] > th) j++; let m = 0; for (let k = i; k < j; k++) m += S[k] * DA; let c = 0, q0 = i, q1 = j - 1; for (let k = i; k < j; k++) { c += S[k] * DA; if (c < .05 * m) q0 = k; if (c < .95 * m) q1 = k + 1; } out.push({ a0: aOf(i), a1: aOf(j - 1), w: (q1 - q0) * DA, m, c: aOf((q0 + q1) >> 1) }); i = j; } else i++; }
    return out; }
  const gapOpening = (m, a) => { const h = rH(m, a); return P.KS * m * m * a / (32 * h * h * h) / P.D; }; // > ~3 opens a gap; below, a propeller
  return { A0, A1, NB, DA, ORBIT, P, rH, resList, field, step, advance, idx, aOf, addBump, addBand, total, smooth, gaps, narrowRings, gapOpening };
})();
/*PHYS-END*/
/*GAME-START*/
// ===== Problems (the commission ladder), each read from Σ and the moons. All pure: the tests call these directly. =====
// A 'grain' is the unit of Σ (Σ integrates to grains); the GPU draws k particles per grain, whatever the device.
const BUDGET = 130000;
const sustain = (G, key, cond) => { if (!cond) { G.st[key] = null; return 0; } if (G.st[key] == null) G.st[key] = G.orbits; return G.orbits - G.st[key]; };
const moonsIn = (G, a0, a1) => G.moons.filter(m => m.a > a0 - PH.rH(m.m, m.a) * 2 && m.a < a1 + PH.rH(m.m, m.a) * 2);
const resonanceGaps = (G, minW) => PH.gaps(G.S, minW).filter(g => !moonsIn(G, g.a0, g.a1).length);
const moonGaps = (G, minW) => PH.gaps(G.S, minW).filter(g => G.moons.some(m => m.a > g.a0 && m.a < g.a1));
const mean = (S, a0, a1) => PH.total(S, a0, a1) / Math.max(1e-9, a1 - a0);
const fmt0 = (x) => Math.round(x).toLocaleString('en');
const COMMS = [
  { id: 'ring', name: 'A ring', start: [], goal: 'Pour 20,000 grains of dust into orbit and keep them there for 100 orbits.',
    hint: 'Drag across the dark around the planet to pour dust.', note: 'Dust poured anywhere settles into circles: every grain is its own little moon, and inner grains overtake outer ones.',
    check(G) { const n = PH.total(G.S, 1.25, 3.4), s = sustain(G, 'held', n >= 20000); return { ok: s >= 100, p: `<b>${fmt0(n)}</b> / 20,000 grains · held <b>${s | 0}</b> / 100 orbits` }; } },
  { id: 'cassini', name: 'The Cassini Division', start: [[1.45, 2.35, 50000]], X: 2.0, goal: 'Open an empty lane at least 0.04 wide on the gold circle, with no moon in it.',
    hint: 'Choose Moon and hold outside the ring. While you hold or drag, a dashed circle shows where it bites hardest: put it on the gold one.', note: 'Mimas goes round once for every two orbits of the grains at the Division\'s edge. Each pass tugs them the same way, and the lane empties: a 2:1 resonance.',
    check(G) { const g = resonanceGaps(G, .005).filter(q => Math.abs((q.a0 + q.a1) / 2 - 2) < .035).sort((a, b) => b.w - a.w)[0], w = g ? g.w : 0; return { ok: w >= .04, p: `lane on the gold circle <b>${w.toFixed(3)}</b> / 0.040` }; } },
  { id: 'encke', name: 'The Encke Gap', start: [[1.45, 2.35, 50000]], goal: 'Hide a moon inside the ring and let it sweep its own lane, at least 0.03 wide.',
    hint: 'Grow a moon inside the ring. Watch the gap\'s edges ripple behind it.', note: 'Pan lives in the Encke Gap. Its pull leaves the gap\'s edges scalloped, with a wavelength of 3π times the distance from the moon.',
    check(G) { const g = moonGaps(G, .005).sort((a, b) => b.w - a.w)[0], w = g ? g.w : 0; return { ok: w >= .03, p: `widest moon lane <b>${w.toFixed(3)}</b> / 0.030` }; } },
  { id: 'propeller', name: 'A propeller', start: [[1.45, 2.35, 50000]], goal: 'Set a moonlet in the ring too small to clear a lane, and keep it there 30 orbits.',
    hint: 'Choose Moon and tap quickly inside the ring: a quick tap makes a moonlet.', note: 'Cassini found these in the A ring: moonlets a kilometre across, betrayed by two short dark wings of disturbed dust, one ahead and one behind.',
    check(G) { const ok = G.moons.some(m => { const h = PH.rH(m.m, m.a) * 5, loc = mean(G.S, m.a - h, m.a + h); return PH.gapOpening(m.m, m.a) < 2.5 && loc > .5 * mean(G.S, m.a - .1, m.a + .1) && loc > 8000; }), s = sustain(G, 'prop', ok); return { ok: s >= 30, p: ok ? `propeller held <b>${s | 0}</b> / 30 orbits` : 'no propeller yet' }; } },
  { id: 'narrow', name: 'A narrow ring', start: [], goal: 'Keep a ring narrower than 0.04 with at least 8,000 grains in it for 1,000 orbits.',
    hint: 'A free ring spreads. Put a moon just inside it and another just outside.', note: 'Uranus\'s rings are kilometres wide and sharp-edged; Goldreich and Tremaine showed in 1979 that pairs of shepherd moons hold them in.',
    check(G) { const r = PH.narrowRings(G.S).filter(q => q.w <= .04 && q.m >= 8000)[0], s = sustain(G, 'nar', !!r), best = PH.narrowRings(G.S).filter(q => q.m >= 8000).sort((a, b) => a.w - b.w)[0];
      return { ok: s >= 1000, p: `${best ? `narrowest heavy ring <b>${best.w.toFixed(3)}</b> · ` : ''}held <b>${s | 0}</b> / 1,000 orbits` }; } },
  { id: 'braid', name: 'A braided ring', start: [], goal: 'Hold a narrow ring (under 0.06, 5,000 grains) beside an eccentric shepherd for 200 orbits.',
    hint: 'Tap a moon to stretch its orbit. Its pull then kinks and twists the strands.', note: 'Voyager photographed Saturn\'s F ring braided and kinked. Prometheus, on an eccentric orbit, reaches in to the ring once a lap.',
    check(G) { const r = PH.narrowRings(G.S).filter(q => q.w <= .06 && q.m >= 5000)[0], ok = !!r && G.moons.some(m => m.e > 0 && Math.abs(m.a - r.c) < .2), s = sustain(G, 'br', ok); return { ok: s >= 200, p: r ? `braid held <b>${s | 0}</b> / 200 orbits${ok ? '' : ' · needs an eccentric moon beside it'}` : 'no narrow ring yet' }; } },
  { id: 'system', name: 'A Saturn of your own', start: [], goal: 'At the same time: a moonless lane, a moon\'s lane and a narrow ring outside the rest, for 100 orbits.',
    hint: 'Everything you have learned at once. Moons interfere, so place them with care.', note: 'Saturn\'s rings are this system: Mimas, Pan, Daphnis, Prometheus and Pandora each shaping their part. Yours is now in the same notebook.',
    check(G) { const a = resonanceGaps(G, .03).length > 0, b = moonGaps(G, .02).length > 0, rings = PH.narrowRings(G.S), big = rings.reduce((m, r) => r.m > (m ? m.m : 0) ? r : m, null), c = rings.some(r => r.w <= .05 && r.m >= 2000 && big && r !== big && r.c > big.c);
      const s = sustain(G, 'sys', a && b && c); return { ok: s >= 100, p: `${a ? '✓' : '·'} moonless lane  ${b ? '✓' : '·'} moon lane  ${c ? '✓' : '·'} outer narrow ring · <b>${s | 0}</b> / 100 orbits` }; } },
];
// A seeded problem: a ring with its own extent, and a lane wanted at one radius. The resonance has to be worked out.
function dailyComm(seed) { const r = RH.rng('rings:' + seed), lo = 1.35 + r() * .25, hi = lo + .65 + r() * .35, X = +(lo + .12 + r() * (hi - lo - .24)).toFixed(3);
  return { id: 'day:' + seed, name: 'Lane at ' + X.toFixed(2), start: [[lo, hi, 50000]], X, goal: `Open a moonless lane at least 0.035 wide centred within 0.03 of a = ${X.toFixed(2)} (the gold circle).`,
    hint: 'Where must a moon go for its 2:1 to land on the gold circle?', note: 'The grains at the gold circle must go round twice for each orbit of your moon: Kepler says the moon sits 2^(2/3) ≈ 1.59 times further out.',
    check(G) { const g = resonanceGaps(G, .005).filter(q => Math.abs((q.a0 + q.a1) / 2 - X) < .03).sort((a, b) => b.w - a.w)[0], w = g ? g.w : 0, s = sustain(G, 'day', w >= .035); return { ok: s >= 20, p: `lane at ${X.toFixed(2)}: <b>${w.toFixed(3)}</b> / 0.035 · held <b>${s | 0}</b> / 20 orbits` }; } }; }
const SANDBOX = { id: 'sandbox', name: 'Sandbox', start: [[1.5, 2.3, 40000]], goal: 'No problem set. Pour, grow moons, and watch.', hint: 'Everything is unlocked. Share a link to replay your system.', check: () => ({ ok: false, p: '' }) };
// The game state for one problem, and its fixed-step simulation (deterministic for the same actions).
