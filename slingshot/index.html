<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slingshot</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;background:#03040a}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}
  #side{width:280px;background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:12px}
  .sys{margin-bottom:12px}
  .sys .h{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .sys .d{font-size:12px;color:var(--dim);margin-bottom:6px}
  .lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
  .lvls button{padding:6px 0;font-size:12px}
  .lvls button.cur{border-color:var(--accent)}
  .lvls .st{display:block;font-size:9px;color:var(--accent);letter-spacing:-1px;height:10px}
  #hud{position:absolute;top:10px;left:12px;display:flex;gap:8px;pointer-events:none}
  #hud .pill{background:#0d111acc;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:13px}
  #fuelBar{width:120px;height:8px;background:#222;border-radius:4px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:6px}
  #fuelBar div{height:100%;background:var(--accent)}
  #tip{position:absolute;bottom:12px;left:12px;font-size:12px;color:var(--dim);pointer-events:none}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  #msg div{background:#0d111aee;border:1px solid var(--line);border-radius:12px;padding:16px 24px;text-align:center;pointer-events:auto}
</style>
</head>
<body>
<div class="topbar"><a class="home" href="../">← Rabbit Holes</a><h1>🛰️ Slingshot</h1><span class="spacer"></span><span class="small dim" id="total"></span></div>
<main>
  <div id="stage"><canvas id="cv"></canvas>
    <div id="hud"><span class="pill" id="lvlName"></span><span class="pill">Fuel <span id="fuelBar"><div></div></span></span><span class="pill" id="tries"></span></div>
    <div id="tip">Drag back from the probe to aim, then let go to launch · hold the mouse during flight to burn toward the cursor · <kbd>R</kbd> restart</div>
    <div id="msg"></div>
  </div>
  <div id="side"><div id="levels"></div>
    <div class="sys"><div class="h">Deep space</div><div class="d">Endless generated systems. Share the seed with a friend and compare fuel.</div>
      <div class="row"><input id="seedIn" placeholder="seed" style="width:110px"><button id="deepBtn">Fly</button><button id="rndSeed">🎲</button></div><div class="small dim" id="deepInfo" style="margin-top:6px"></div></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script>
const WW=1600, WH=1000, DT=1/120, TMAX=45;
const SYSTEMS=[
  {n:'Sol Approach', d:'Fixed planets. Learn to curve your path around them.', preview:2.6},
  {n:'Tidal Dance', d:'Moons in orbit. You have to time your launch.', preview:1.8},
  {n:'Binary', d:'Two suns circling each other. Their pull keeps shifting.', preview:1.5},
  {n:'Gauntlet', d:'Fly through every ring, in order, before you reach the target.', preview:1.4},
  {n:'Event Horizon', d:'A black hole. Get close enough to use it, and not too close.', preview:1.2},
];
const S = RH.load('sling', {best:{}, cur:0, deep:{}});
const persist=()=>{ RH.save('sling',S); RH.progress('slingshot', Object.keys(S.best).length/40); };

// ===================== Level generation =====================
function bodyPos(b, t){ if (!b.orb) return [b.x,b.y]; const a=b.orb.ph + t*b.orb.w; const c=b.orb.c; const [cx,cy]= c? bodyPos(c,t) : [b.orb.cx,b.orb.cy]; return [cx+Math.cos(a)*b.orb.r, cy+Math.sin(a)*b.orb.r]; }
function gen(sys, idx, seed){
  const r=RH.rng(seed); const L={sys, idx, bodies:[], rings:[], start:[160, 500], target:[1440,500], tr:46, fuel:1.2};
  const diff = idx/7; // 0..1 within system
  L.start=[140+r.int(60), 200+r.int(600)]; L.target=[1380+r.int(120), 200+r.int(600)];
  if (r()<0.5){ [L.start[1],L.target[1]] = [L.target[1],L.start[1]]; }
  const planet=(x,y,m,rad,col)=>({x,y,m,rad,col});
  if (sys===0){
    const n=1+Math.floor(diff*3.5);
    for (let i=0;i<n;i++){ const x=420+(i+0.5)*(800/n)+r.range(-60,60), y=r.range(240,760); L.bodies.push(planet(x,y,r.range(1.4e6,3.2e6)*(1+diff*0.5),r.range(30,52),r.pick(['#5a8ad8','#c87a4a','#7ac88a','#d8c45a']))); }
    if (idx<2){ L.bodies=[planet(800,(L.start[1]+L.target[1])/2+ (idx?140:0),2.2e6,42,'#5a8ad8')]; }
    L.tr = 60-idx*2;
  }
  if (sys===1){
    const cx=800+r.range(-80,80), cy=500+r.range(-80,80); const core=planet(cx,cy,r.range(2.5e6,4e6),r.range(44,60),'#c87a4a'); L.bodies.push(core);
    const nm=1+Math.floor(diff*2.5);
    for (let i=0;i<nm;i++){ const rr=110+i*90+r.range(0,30); L.bodies.push({m:r.range(5e5,1.1e6), rad:r.range(14,22), col:'#bbb', orb:{c:core, r:rr, w:(r()<.5?-1:1)*Math.sqrt(core.m/rr**3)*0.9, ph:r()*7}}); }
    if (idx>=5){ L.bodies.push(planet(r.range(450,600), r()<.5?200:800, 1.6e6, 34, '#5a8ad8')); }
    L.tr=46;
  }
  if (sys===2){
    const cx=800+r.range(-60,60), cy=500+r.range(-60,60); const sep=r.range(70,120)+diff*40; const m=r.range(2.4e6,3.6e6);
    const w=Math.sqrt(2*m/(2*sep)**3)*1.0*(r()<.5?-1:1); const ph=r()*7;
    L.bodies.push({m, rad:26, col:'#ffd36a', star:1, orb:{cx,cy,r:sep,w,ph}}, {m, rad:22, col:'#ff8a5a', star:1, orb:{cx,cy,r:sep,w,ph:ph+Math.PI}});
    if (idx>=3) L.bodies.push(planet(r.range(420,560), r.range(220,780), r.range(1e6,2e6), 28, '#7ac88a'));
    if (idx>=6) L.bodies.push(planet(r.range(1040,1180), r.range(220,780), r.range(1e6,2e6), 28, '#5a8ad8'));
    L.tr=44;
  }
  if (sys===3){
    const n=2+Math.floor(diff*2); for (let i=0;i<n;i++) L.bodies.push(planet(400+(i+0.5)*(800/n)+r.range(-50,50), r.range(220,780), r.range(1.5e6,3e6), r.range(30,46), r.pick(['#5a8ad8','#c87a4a','#7ac88a'])));
    if (idx>=4){ const c=L.bodies[0]; L.bodies.push({m:6e5, rad:14, col:'#bbb', orb:{c, r:c.rad+70, w:Math.sqrt(c.m/(c.rad+70)**3)*0.9, ph:r()*7}}); }
    L.tr=44;
  }
  if (sys===4){
    const bh={x:800+r.range(-60,60), y:500+r.range(-60,60), m:r.range(1.4e7,2.2e7)*(1+diff*0.4), rad:22, bh:1, col:'#000'}; L.bodies.push(bh);
    const nm=Math.floor(diff*3); for (let i=0;i<nm;i++){ const rr=170+i*80; L.bodies.push({m:9e5, rad:18, col:'#c87a4a', orb:{c:bh, r:rr, w:(i%2?-1:1)*Math.sqrt(bh.m/rr**3)*0.7, ph:r()*7}}); }
    L.tr=42-idx;
  }
  L.fuel = 1;
  return L;
}
// Checkpoint rings are placed along a real solution, so the level is always solvable
function simulate(L, ang, pow, onStep, burns){
  let x=L.start[0], y=L.start[1], vx=Math.cos(ang)*pow, vy=Math.sin(ang)*pow; let t=0; let ring=0; const steps=Math.round(TMAX/DT);
  for (let s=0;s<steps;s++){
    let ax=0, ay=0;
    for (const b of L.bodies){ const [bx,by]=bodyPos(b,t); const dx=bx-x, dy=by-y; const d2=dx*dx+dy*dy; const d=Math.sqrt(d2);
      if (d < b.rad+4) return {res:'crash', t, s, body:b};
      const a=b.m/(d2+400); ax+=a*dx/d; ay+=a*dy/d; }
    if (burns){ const bn=burns(s, x,y,vx,vy); if (bn){ ax+=bn[0]; ay+=bn[1]; } }
    vx+=ax*DT; vy+=ay*DT; x+=vx*DT; y+=vy*DT; t+=DT;
    if (onStep && onStep(x,y,s,t)===false) return {res:'stop', t, s};
    if (L.rings && ring<L.rings.length){ const rg=L.rings[ring]; if (Math.hypot(x-rg[0],y-rg[1])<rg[2]) ring++; }
    if ((!L.rings||ring>=L.rings.length) && Math.hypot(x-L.target[0],y-L.target[1])<L.tr) return {res:'win', t, s};
    if (x<-250||x>WW+250||y<-250||y>WH+250) return {res:'lost', t, s};
  }
  return {res:'timeout', t};
}
function solvable(L, wantRings){
  const sols=[];
  for (let a=0;a<120;a++) for (let p=0;p<9;p++){ const ang=a/120*Math.PI*2, pow=140+p*45;
    const path=[]; const res=simulate(L, ang, pow, wantRings? (x,y,s)=>{ if(s%10===0) path.push([x,y]); } : null);
    if (res.res==='win'){ sols.push({ang,pow,path,t:res.t}); if (!wantRings && sols.length>=1) return sols; }
    if (wantRings && sols.length>=3) return sols; }
  return sols;
}
function tooEasy(L){ // straight shot works without much curve
  const ang=Math.atan2(L.target[1]-L.start[1], L.target[0]-L.start[0]);
  for (let p=0;p<9;p++) for (const da of [-0.06,0,0.06]) if (simulate(L, ang+da, 140+p*45).res==='win') return true;
  return false;
}
function buildLevel(sys, idx, seedBase){
  for (let k=0;k<60;k++){
    const L=gen(sys, idx, seedBase*977+k*31+sys*100+idx);
    if (sys===3){
      L.rings=[]; const sols=solvable(L,true); if (!sols.length) continue;
      const sol=sols[Math.floor(sols.length/2)]; const path=sol.path; const nr=2+Math.floor(idx/3);
      for (let i=1;i<=nr;i++){ const pt=path[Math.floor(path.length*i/(nr+1))]; if(!pt) continue; L.rings.push([pt[0],pt[1],30]); }
      if (L.rings.length<2) continue;
      if (simulate(L, sol.ang, sol.pow).res!=='win') continue;
      return L;
    }
    if (!solvable(L).length) continue;
    if (!(sys===0&&idx<3) && tooEasy(L)) continue;
    return L;
  }
  return gen(sys, idx, seedBase); // fallback (should be rare)
}

// ===================== Game state =====================
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let L=null, levelKey='', mode='aim', probe=null, trail=[], fuel=1, tries=0, drag=null, mouse=null, thrusting=false, simT=0, stepN=0, ringIdx=0, burnLog=[], view={s:1,ox:0,oy:0};
const starsBg=[...Array(400)].map(()=>[Math.random()*WW,Math.random()*WH,Math.random()]);
const cache={};
function openLevel(key){
  levelKey=key;
  if (!cache[key]){
    if (key.startsWith('deep:')){ const sd=key.slice(5); const r=RH.rng(sd); cache[key]=buildLevel(r.int(5), 3+r.int(5), RH.hashStr(sd)); }
    else { const n=+key; cache[key]=buildLevel(Math.floor(n/8), n%8, 1); }
  }
  L=cache[key]; tries=0; reset(); renderSide();
  const nm = key.startsWith('deep:')? `Deep space · ${key.slice(5)}` : `${SYSTEMS[L.sys].n} · ${(+key)%8+1}/8`;
  document.getElementById('lvlName').textContent=nm;
}
function reset(){ mode='aim'; probe={x:L.start[0],y:L.start[1],vx:0,vy:0}; trail=[]; fuel=L.fuel; simT=0; stepN=0; ringIdx=0; burnLog=[]; document.getElementById('msg').innerHTML=''; updHud(); }
function updHud(){ document.querySelector('#fuelBar div').style.width=(fuel*100)+'%'; document.getElementById('tries').textContent=`Attempt ${tries+ (mode==='aim'?1:0)}`; }

// ===================== Physics step (live) =====================
const THRUST=220, BURN_RATE=0.18;
function liveStep(){
  let ax=0, ay=0;
  for (const b of L.bodies){ const [bx,by]=bodyPos(b,simT); const dx=bx-probe.x, dy=by-probe.y; const d2=dx*dx+dy*dy, d=Math.sqrt(d2);
    if (d<b.rad+4) return end('crash', b);
    const a=b.m/(d2+400); ax+=a*dx/d; ay+=a*dy/d; }
  if (thrusting && fuel>0 && mouse){ const [mx,my]=mouse; const dx=mx-probe.x, dy=my-probe.y, d=Math.hypot(dx,dy)||1; ax+=THRUST*dx/d; ay+=THRUST*dy/d; fuel=Math.max(0,fuel-BURN_RATE*DT); burnLog.push(stepN); }
  probe.vx+=ax*DT; probe.vy+=ay*DT; probe.x+=probe.vx*DT; probe.y+=probe.vy*DT; simT+=DT; stepN++;
  if (stepN%3===0) trail.push([probe.x,probe.y, thrusting&&fuel>0]);
  if (L.rings && ringIdx<L.rings.length){ const rg=L.rings[ringIdx]; if (Math.hypot(probe.x-rg[0],probe.y-rg[1])<rg[2]){ ringIdx++; RH.toast(`Ring ${ringIdx}/${L.rings.length}`,1200); } }
  if ((!L.rings||ringIdx>=L.rings.length) && Math.hypot(probe.x-L.target[0],probe.y-L.target[1])<L.tr) return end('win');
  if (probe.x<-250||probe.x>WW+250||probe.y<-250||probe.y>WH+250) return end('lost');
  if (simT>TMAX) return end('timeout');
}
function end(res, body){
  mode='done'; tries++;
  const box=document.getElementById('msg');
  if (res==='win'){
    const used=L.fuel-fuel; const stars = used<=0.0001? 3 : used<=L.fuel/3? 2 : 1;
    const prev=S.best[levelKey]||(S.deep[levelKey]); const rec={stars:Math.max(stars,prev?.stars||0), fuel:Math.min(used, prev?.fuel??9)};
    if (levelKey.startsWith('deep:')) S.deep[levelKey]=rec; else S.best[levelKey]=rec; persist(); renderSide();
    box.innerHTML=`<div><h2 style="margin:0 0 6px">${['','Arrived','Efficient','Elegant'][stars]} ${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</h2><div class="small dim">Fuel used: ${Math.round(used*100)}% · flight time ${simT.toFixed(1)}s${stars<3?'<br>★★★ means arriving without burning any fuel: gravity does all the work.':''}</div><div class="row" style="justify-content:center;margin-top:10px"><button id="again">Retry</button>${levelKey.startsWith('deep:')?'':`<button class="primary" id="nextL">Next →</button>`}</div></div>`;
    document.getElementById('again').onclick=reset; document.getElementById('nextL')?.addEventListener('click',()=>{ const n=Math.min(39,+levelKey+1); S.cur=n; persist(); openLevel(String(n)); });
    if (Object.keys(S.best).length===40 && !S.finished){ S.finished=1; persist(); RH.modal('<h2>All 40 systems charted.</h2><p>Now go back for three stars on each, or fly Deep Space seeds. There are about four billion of them.</p>'); }
  } else {
    const why={crash: body?.bh? 'Crossed the event horizon.' : body?.star? 'Burned up in a star.' : 'Impact.', lost:'Lost to deep space.', timeout:'Ran out of time.'}[res];
    box.innerHTML=`<div><b>${why}</b><div class="small dim" style="margin-top:4px">Press <kbd>R</kbd> or click to retry</div></div>`; box.firstChild.onclick=reset;
  }
}

// ===================== Drawing =====================
function fit(){ const r=cv.getBoundingClientRect(); cv.width=r.width*devicePixelRatio; cv.height=r.height*devicePixelRatio; view.s=Math.min(r.width/WW, r.height/WH)*0.96; view.ox=(r.width-WW*view.s)/2; view.oy=(r.height-WH*view.s)/2; }
const toW=(cx,cy)=>[(cx-view.ox)/view.s,(cy-view.oy)/view.s];
function draw(){
  const d=devicePixelRatio; ctx.setTransform(d,0,0,d,0,0); ctx.fillStyle='#03040a'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(d*view.s,0,0,d*view.s,d*view.ox,d*view.oy);
  for (const [x,y,b] of starsBg){ ctx.fillStyle=`rgba(255,255,255,${0.2+b*0.5})`; ctx.fillRect(x,y,1.6,1.6); }
  ctx.strokeStyle='#1a2030'; ctx.lineWidth=2; ctx.strokeRect(0,0,WW,WH);
  // orbits
  for (const b of L.bodies) if (b.orb){ const [cx,cy]=b.orb.c? bodyPos(b.orb.c,simT):[b.orb.cx,b.orb.cy]; ctx.strokeStyle='#ffffff12'; ctx.lineWidth=1; ctx.beginPath(); ctx.arc(cx,cy,b.orb.r,0,7); ctx.stroke(); }
  // bodies
  for (const b of L.bodies){ const [x,y]=bodyPos(b,simT);
    if (b.bh){ const g=ctx.createRadialGradient(x,y,b.rad,x,y,b.rad*5); g.addColorStop(0,'rgba(255,140,60,.6)'); g.addColorStop(.4,'rgba(160,60,200,.15)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(x,y,b.rad*5,0,7); ctx.fill(); ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(x,y,b.rad,0,7); ctx.fill(); ctx.strokeStyle='#ffb54788'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(x,y,b.rad*2.6,b.rad*0.7,simT*0.4,0,7); ctx.stroke(); continue; }
    const g=ctx.createRadialGradient(x-b.rad*0.3,y-b.rad*0.3,b.rad*0.1,x,y,b.rad); g.addColorStop(0,b.star?'#fff8e0':'#ffffff55'); g.addColorStop(0.3,b.col); g.addColorStop(1,'#000'); ctx.fillStyle=g;
    if (b.star){ ctx.shadowColor=b.col; ctx.shadowBlur=40; }
    ctx.beginPath(); ctx.arc(x,y,b.rad,0,7); ctx.fill(); ctx.shadowBlur=0;
    // gravity well hint
    ctx.strokeStyle='#ffffff08'; for (let k=1;k<=3;k++){ ctx.beginPath(); ctx.arc(x,y,b.rad+Math.sqrt(b.m)/12*k/3,0,7); ctx.stroke(); } }
  // rings
  if (L.rings) L.rings.forEach((rg,i)=>{ ctx.strokeStyle= i<ringIdx? '#5fd38d55' : i===ringIdx? '#7cf0c8' : '#7cf0c855'; ctx.lineWidth=3; ctx.beginPath(); ctx.arc(rg[0],rg[1],rg[2],0,7); ctx.stroke(); ctx.fillStyle='#7cf0c8'; ctx.font='16px system-ui'; ctx.textAlign='center'; ctx.fillText(i+1, rg[0], rg[1]+5); });
  // target
  const pulse=1+0.08*Math.sin(performance.now()/300); ctx.strokeStyle='#ffb547'; ctx.lineWidth=2; ctx.setLineDash([6,6]); ctx.beginPath(); ctx.arc(L.target[0],L.target[1],L.tr*pulse,0,7); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle='#ffb54733'; ctx.beginPath(); ctx.arc(L.target[0],L.target[1],L.tr*0.6,0,7); ctx.fill();
  // trail
  ctx.lineWidth=2; for (let i=1;i<trail.length;i++){ ctx.strokeStyle= trail[i][2]? '#ff6b6b' : `rgba(124,240,200,${0.2+0.8*i/trail.length})`; ctx.beginPath(); ctx.moveTo(trail[i-1][0],trail[i-1][1]); ctx.lineTo(trail[i][0],trail[i][1]); ctx.stroke(); }
  // aim
  if (mode==='aim' && drag){ const v=aimVec(); if (v){ ctx.strokeStyle='#ffffff44'; ctx.beginPath(); ctx.moveTo(L.start[0],L.start[1]); ctx.lineTo(drag.x,drag.y); ctx.stroke();
      const pv=SYSTEMS[L.sys].preview; const n=Math.round(pv/DT); ctx.fillStyle='#ffffffcc'; let k=0;
      const Lp={...L, rings:null}; simulate(Lp, v.ang, v.pow, (x,y,s)=>{ if (s%6===0){ ctx.globalAlpha=1-s/n; ctx.beginPath(); ctx.arc(x,y,2.2,0,7); ctx.fill(); } return s<n; }); ctx.globalAlpha=1;
      ctx.fillStyle='#aaa'; ctx.font='14px system-ui'; ctx.textAlign='left'; ctx.fillText(`${Math.round(v.pow)} m/s · ${Math.round((v.ang*180/Math.PI+360)%360)}°`, L.start[0]+20, L.start[1]-20); } }
  // probe
  const px=mode==='aim'?L.start[0]:probe.x, py=mode==='aim'?L.start[1]:probe.y;
  ctx.fillStyle='#e8e6df'; ctx.shadowColor='#7cf0c8'; ctx.shadowBlur=14; ctx.beginPath(); ctx.arc(px,py,6,0,7); ctx.fill(); ctx.shadowBlur=0;
  if (mode==='fly' && thrusting && fuel>0 && mouse){ ctx.strokeStyle='#ff6b6b'; ctx.lineWidth=3; const dx=mouse[0]-px, dy=mouse[1]-py, d=Math.hypot(dx,dy)||1; ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px-dx/d*18,py-dy/d*18); ctx.stroke(); }
  if (mode==='aim'){ ctx.strokeStyle='#7cf0c855'; ctx.beginPath(); ctx.arc(px,py,26,0,7); ctx.stroke(); }
}
function aimVec(){ if(!drag) return null; const dx=L.start[0]-drag.x, dy=L.start[1]-drag.y; const d=Math.hypot(dx,dy); if (d<8) return null; return {ang:Math.atan2(dy,dx), pow:Math.min(560, d*2.4)}; }

// ===================== Input =====================
cv.addEventListener('mousedown', e=>{ const r=cv.getBoundingClientRect(); const [x,y]=toW(e.clientX-r.left,e.clientY-r.top);
  if (mode==='aim'){ drag={x,y}; }
  else if (mode==='fly'){ thrusting=true; mouse=[x,y]; }
  else if (mode==='done' && !document.querySelector('#msg button')) reset(); });
window.addEventListener('mousemove', e=>{ const r=cv.getBoundingClientRect(); const [x,y]=toW(e.clientX-r.left,e.clientY-r.top); mouse=[x,y]; if (drag) drag={x,y}; });
window.addEventListener('mouseup', ()=>{ thrusting=false; if (mode==='aim' && drag){ const v=aimVec(); drag=null; if (v){ probe.vx=Math.cos(v.ang)*v.pow; probe.vy=Math.sin(v.ang)*v.pow; mode='fly'; updHud(); } } });
window.addEventListener('keydown', e=>{ if (e.key==='r'||e.key==='R'){ reset(); } if (e.key===' ' && mode==='fly'){ thrusting=true; e.preventDefault(); } });
window.addEventListener('keyup', e=>{ if (e.key===' ') thrusting=false; });

// ===================== Sidebar =====================
function renderSide(){
  let h=''; SYSTEMS.forEach((s,si)=>{ const unlocked = si===0 || [...Array(8)].filter((_,i)=>S.best[(si-1)*8+i]).length>=5;
    h+=`<div class="sys"><div class="h">${si+1}. ${s.n}${unlocked?'':' 🔒'}</div><div class="d">${unlocked? s.d : 'Clear 5 levels of the previous system to unlock.'}</div><div class="lvls">`;
    for (let i=0;i<8;i++){ const k=String(si*8+i); const b=S.best[k]; const open = unlocked && (i===0 || S.best[si*8+i-1] || b || i<3);
      h+=`<button data-k="${k}" class="${k===levelKey?'cur':''}" ${open?'':'disabled'}>${i+1}<span class="st">${b?'★'.repeat(b.stars)+'☆'.repeat(3-b.stars):''}</span></button>`; }
    h+='</div></div>'; });
  const el=document.getElementById('levels'); el.innerHTML=h; el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ S.cur=+b.dataset.k; persist(); openLevel(b.dataset.k); });
  const tot=Object.values(S.best).reduce((s,b)=>s+b.stars,0); document.getElementById('total').textContent=`${Object.keys(S.best).length}/40 systems · ${tot}/120 ★ · ${Object.keys(S.deep).length} deep-space seeds`;
  const dk=Object.keys(S.deep); document.getElementById('deepInfo').textContent = dk.length? 'Flown: '+dk.slice(-6).map(k=>k.slice(5)+' '+'★'.repeat(S.deep[k].stars)).join(' · ') : '';
}
document.getElementById('deepBtn').onclick=()=>{ const v=document.getElementById('seedIn').value.trim()||'andromeda'; openLevel('deep:'+v); };
document.getElementById('rndSeed').onclick=()=>{ const w=['vela','orion','lyra','draco','cygnus','hydra','carina','pavo','lupus','ara','grus','norma']; const s=w[Math.floor(Math.random()*w.length)]+'-'+Math.floor(Math.random()*1000); document.getElementById('seedIn').value=s; openLevel('deep:'+s); };

// ===================== Loop =====================
function frame(){ if (mode==='fly'){ for (let i=0;i<2;i++) if (mode==='fly') liveStep(); updHud(); } draw(); requestAnimationFrame(frame); }
fit(); window.addEventListener('resize', fit);
openLevel(String(S.cur||0)); requestAnimationFrame(frame);
if (!S.intro){ S.intro=1; persist(); RH.modal(`<h2>🛰️ Slingshot</h2><p>You have one probe and almost no fuel. Gravity is real: every planet, moon and star pulls on you every moment.</p><p><b>Drag back</b> from the probe to aim and let go to launch. The dotted line shows only the start of your path. The rest you have to work out. Hold the mouse during flight to burn fuel toward the cursor.</p><p>Arrive without burning any fuel and you get three stars.</p>`,[{label:'Launch'}]); }
</script>
