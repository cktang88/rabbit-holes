<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slingshot</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* JPL mission planning, 1977: blueprint navy, cyan plot lines, orange trajectory pencil */
  :root{--navy:#0a2342;--navy2:#0d2c52;--ink:#d9ecf7;--cyan:#6fd3f0;--cyan2:#3a8fb3;--pencil:#ff8a2a;--paper:#efe9d8;--paperInk:#1d2a3a;--red:#e0472f;
    font-family:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
  html,body{background:var(--navy);color:var(--ink)}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;
    background:linear-gradient(rgba(111,211,240,.05) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(111,211,240,.05) 1px,transparent 1px) 0 0/24px 24px,var(--navy)}
  .topbar{background:#071a33;border-bottom:2px solid var(--cyan2);font-family:"Share Tech Mono",monospace}
  .topbar h1{font-family:Orbitron,"Share Tech Mono",monospace;font-weight:800;letter-spacing:.18em;font-size:15px;color:var(--ink);text-transform:uppercase}
  .topbar h1 small{font-family:"Share Tech Mono",monospace;letter-spacing:.08em;font-weight:400;color:var(--cyan);font-size:11px;margin-left:8px}
  .topbar .home,.topbar .rh-like{color:var(--cyan)}
  #total{color:var(--cyan);letter-spacing:.06em}
  button{font-family:"Share Tech Mono",monospace;background:linear-gradient(#24476d,#183456);color:var(--ink);border:1px solid #4d7aa3;border-bottom-color:#0b1d33;border-right-color:#0b1d33;border-radius:2px;
    text-transform:uppercase;letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #06162a}
  button:hover:not(:disabled){border-color:var(--cyan)}
  button:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 1px 3px #0008}
  button:focus-visible,input:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
  button.primary{background:linear-gradient(#ff9d47,#e0701c);color:#241104;border-color:#ffc58a;font-weight:700}
  input{font-family:"Share Tech Mono",monospace;background:#061629;color:var(--cyan);border:1px solid var(--cyan2);border-radius:0;letter-spacing:.06em}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
  /* mission binder */
  #side{width:290px;background:linear-gradient(90deg,#0b2645,#0e2d50);border-left:2px solid var(--cyan2);overflow:auto;padding:12px 12px 16px}
  .bh{font-family:Orbitron,monospace;font-weight:800;font-size:12px;letter-spacing:.22em;color:var(--cyan);border-bottom:1px dashed var(--cyan2);padding-bottom:6px;margin-bottom:8px}
  .sys{margin-bottom:14px}
  .sys .h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-bottom:2px}
  .sys .d{font-size:12px;color:#a9c6da;margin-bottom:8px;line-height:1.35}
  .lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center}
  /* levels are embroidered mission patches */
  .patch{width:54px;height:54px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-transform:none;
    background:radial-gradient(circle at 35% 30%,var(--pc,#2f6b9a) 0 40%,#0d2440 75%);border:3px double #d9ecf7aa;box-shadow:0 0 0 2px #0a1e36,0 3px 6px #0008;font-family:Orbitron,monospace;font-weight:800;font-size:15px;color:#fff}
  .patch .st{display:block;font-family:"Share Tech Mono",monospace;font-size:10px;color:#ffd27a;height:11px;letter-spacing:0}
  .patch.cur{border-color:var(--pencil);box-shadow:0 0 0 2px var(--pencil),0 3px 6px #0008}
  .patch:disabled{background:repeating-linear-gradient(45deg,#13263e 0 4px,#0f1f33 4px 8px);color:#5b7896;border-style:dashed;opacity:1}
  /* console overlay */
  #hud{position:absolute;top:10px;left:12px;display:flex;gap:8px;pointer-events:none;align-items:stretch}
  .plate{background:linear-gradient(#1b3554,#10243d);border:1px solid #4d7aa3;box-shadow:inset 0 0 0 1px #06162a,0 2px 6px #0007;padding:4px 10px;font-size:13px;color:var(--ink);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
  .plate b{color:var(--pencil);font-weight:400}
  #lvlName{max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Orbitron,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  #gauge{width:62px;height:36px}
  #tip{position:absolute;bottom:10px;left:12px;font-size:12px;color:#9fc4dc;pointer-events:none;max-width:60%}
  #window{position:absolute;bottom:50px;left:12px;display:none;gap:8px;align-items:center}
  #window.on{display:flex}
  #window input[type=range]{width:180px;accent-color:var(--pencil)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  /* mission report: plotter paper with a rubber stamp */
  #msg > div{background:linear-gradient(rgba(29,42,58,.07) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(29,42,58,.07) 1px,transparent 1px) 0 0/12px 12px,var(--paper);
    color:var(--paperInk);border:1px solid #b9b19a;padding:16px 24px;text-align:center;pointer-events:auto;max-width:calc(100% - 24px);box-shadow:0 10px 30px #000a;position:relative;animation:rise .35s ease-out both}
  #msg > div.won{animation-delay:1.5s}
  #msg h2{font-family:Orbitron,monospace;letter-spacing:.12em;text-transform:uppercase;font-size:18px}
  #msg .small{color:#4b5a6a}
  #msg button{background:#e3dcc6;color:var(--paperInk);border-color:#8c8470;box-shadow:0 2px 0 #8c8470}
  #msg button.primary{background:var(--pencil);color:#241104;border-color:#b8560e}
  .stamp{position:absolute;right:-8px;top:-14px;transform:rotate(-12deg);border:3px solid var(--red);color:var(--red);font-family:Orbitron,monospace;font-weight:800;font-size:12px;letter-spacing:.12em;padding:2px 8px;opacity:.85;background:transparent}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  kbd{background:#061629;border-color:var(--cyan2);color:var(--cyan);font-family:"Share Tech Mono",monospace}
  .modal{background:linear-gradient(rgba(29,42,58,.07) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(29,42,58,.07) 1px,transparent 1px) 0 0/12px 12px,var(--paper);color:var(--paperInk);border:1px solid #b9b19a;border-radius:0;font-family:"Share Tech Mono",monospace}
  .modal h2{font-family:Orbitron,monospace;letter-spacing:.1em;text-transform:uppercase}
  .modal button{background:#e3dcc6;color:var(--paperInk);border-color:#8c8470} .modal button.primary{background:var(--pencil);color:#241104}
  .toast{background:#071a33;border:1px solid var(--cyan);color:var(--cyan);border-radius:0;font-family:"Share Tech Mono",monospace;letter-spacing:.06em}
  #deep .row{margin-top:6px}
  #deepInfo{color:#a9c6da}
  @media (max-width:760px){
    main{flex-direction:column}
    #side{width:auto;max-height:36vh;border-left:0;border-top:2px solid var(--cyan2)}
    #hud{flex-wrap:wrap;gap:4px;left:6px;right:6px;top:6px} .plate{font-size:11px;padding:2px 6px} #gauge{width:44px;height:26px}
    #tip{font-size:10px;left:8px;right:8px;bottom:6px;max-width:none}
    #window{bottom:40px;left:6px} #window input[type=range]{width:120px}
    .topbar{flex-wrap:wrap;row-gap:2px} .topbar #total{font-size:10px;text-align:right;min-width:0} .topbar h1 small{display:none}
    .lvls{gap:4px} .patch{width:46px;height:46px;font-size:13px}
  }
</style>
</head>
<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>Slingshot<small>JPL · mission design</small></h1><span class="spacer"></span><span class="small" id="total"></span></div>
<main>
  <div id="stage"><canvas id="cv" aria-label="Trajectory plot"></canvas>
    <div id="hud"><span class="plate" id="lvlName"></span>
      <span class="plate">FUEL <svg id="gauge" viewBox="0 0 62 36" aria-label="fuel gauge"><path d="M6 32 A25 25 0 0 1 56 32" fill="none" stroke="#4d7aa3" stroke-width="3"/><path d="M6 32 A25 25 0 0 1 16 13" fill="none" stroke="#e0472f" stroke-width="3"/><g id="needle" transform="rotate(90 31 32)"><line x1="31" y1="32" x2="31" y2="10" stroke="#ff8a2a" stroke-width="2"/></g><circle cx="31" cy="32" r="3" fill="#d9ecf7"/></svg></span>
      <span class="plate" id="met">T+ 00.0</span><span class="plate" id="tries"></span></div>
    <div id="window"><span class="plate">LAUNCH WINDOW <b id="winV">T+ 0.0 s</b></span><input type="range" id="winR" min="0" max="30" step="0.1" value="0" aria-label="Launch time"></div>
    <div id="tip">Drag back from the probe to aim, let go to launch · hold during flight to burn toward the pointer · <kbd>R</kbd> restart</div>
    <div id="msg"></div>
  </div>
  <div id="side"><div class="bh">MISSION BINDER</div><div id="levels"></div>
    <div class="sys" id="deep"><div class="h">Deep space</div><div class="d">Generated systems. Share the seed and compare fuel.</div>
      <div class="row"><input id="seedIn" placeholder="seed" maxlength="32" style="width:110px"><button id="deepBtn">Fly</button><button id="rndSeed" aria-label="Random seed">⚄</button></div><div class="small" id="deepInfo" style="margin-top:6px"></div></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
const WW=1600, WH=1000, DT=1/120, TMAX=45, PER=4, NLEV=5*PER, WIN_MAX=30;
// Five programs, four missions each. Every program adds one new idea.
const SYSTEMS=[
  {n:'Sol Approach', d:'Fixed planets. Bend your path around them. Survey the marked planet on the way for a third star.', preview:2.6, pc:'#2f6b9a'},
  {n:'Tidal Dance', d:'Moons move. Pick your launch window: the dial sets when you leave.', preview:1.8, pc:'#2f8a7a'},
  {n:'Binary', d:'Two suns circle each other. Their pull never stays put.', preview:1.5, pc:'#a8662a'},
  {n:'Gauntlet', d:'Fly through every gate, in order, then reach the target.', preview:1.4, pc:'#7a4fa0'},
  {n:'Event Horizon', d:'A black hole. Use it for a slingshot without crossing it.', preview:1.2, pc:'#8a2f3a'},
];
// ===================== Saves =====================
// v2 has 4 missions per program; older saves (8 per system) keep their first four records per system
function cleanSave(s){
  if (!s || typeof s!=='object' || Array.isArray(s)) s={};
  const rec=(r)=> r && typeof r==='object' && [1,2,3].includes(r.stars) ? {stars:r.stars, fuel: Number.isFinite(r.fuel)? Math.max(0,Math.min(1,r.fuel)) : 1} : null;
  const best={}; if (s.best && typeof s.best==='object') for (const k in s.best){ let n=+k; const r=rec(s.best[k]); if (!Number.isInteger(n) || !r) continue;
    if (s.v!==2){ if (n<0 || n>=40 || n%8>=PER) continue; n=Math.floor(n/8)*PER+n%8; }
    if (n>=0 && n<NLEV) best[String(n)]=r; }
  const deep={}; if (s.deep && typeof s.deep==='object') for (const k in s.deep){ const r=rec(s.deep[k]); if (k.startsWith('deep:') && r) deep[k]=r; }
  const cur=s.v===2 && Number.isInteger(s.cur) && s.cur>=0 && s.cur<NLEV ? s.cur : 0;
  return {...s, v:2, best, deep, cur};
}
const S = cleanSave(RH.load('sling', null));
const persist=()=>{ RH.save('sling',S); RH.progress('slingshot', Object.keys(S.best).length/NLEV); };
const sysUnlocked=(si)=> si===0 || [...Array(PER)].filter((_,i)=>S.best[(si-1)*PER+i]).length>=3;
const levelOpen=(k)=>{ k=+k; if (!(Number.isInteger(k) && k>=0 && k<NLEV)) return false; const si=Math.floor(k/PER), i=k%PER; return sysUnlocked(si) && (i<2 || !!S.best[k-1] || !!S.best[k]); };
const nextOpen=(k)=>{ for (let n=+k+1;n<NLEV;n++) if (levelOpen(n)) return n; return -1; };
if (!levelOpen(S.cur)) S.cur=0;

// ===================== Level generation =====================
function bodyPos(b, t){ if (!b.orb) return [b.x,b.y]; const a=b.orb.ph + t*b.orb.w; const c=b.orb.c; const [cx,cy]= c? bodyPos(c,t) : [b.orb.cx,b.orb.cy]; return [cx+Math.cos(a)*b.orb.r, cy+Math.sin(a)*b.orb.r]; }
const moving=(L)=> L.bodies.some(b=>b.orb);
const photoR=(b)=> b.pr || b.rad+60;
function gen(sys, idx, seed){
  const r=RH.rng(seed); const L={sys, idx, bodies:[], rings:[], start:[160, 500], target:[1440,500], tr:46, fuel:1, photo:-1, t0:0};
  const diff = idx/(PER-1); // 0..1 within a program
  L.start=[140+r.int(60), 200+r.int(600)]; L.target=[1380+r.int(120), 200+r.int(600)];
  if (r()<0.5){ [L.start[1],L.target[1]] = [L.target[1],L.start[1]]; }
  const planet=(x,y,m,rad,col)=>({x,y,m,rad,col});
  if (sys===0){
    const n=1+Math.floor(diff*3);
    for (let i=0;i<n;i++){ const x=420+(i+0.5)*(800/n)+r.range(-60,60), y=r.range(240,760); L.bodies.push(planet(x,y,r.range(1.4e6,3.2e6)*(1+diff*0.5),r.range(30,52),'p')); }
    if (idx===0){ L.bodies=[planet(800,(L.start[1]+L.target[1])/2,2.2e6,42,'p'), planet(r.range(560,1040), r()<.5?190:810, 1.2e6, 28, 'p')]; }
    L.tr = 60-idx*3;
  }
  if (sys===1){
    const cx=800+r.range(-80,80), cy=500+r.range(-80,80); const core=planet(cx,cy,r.range(2.5e6,4e6),r.range(44,60),'p'); L.bodies.push(core);
    const nm=1+Math.floor(diff*2.5);
    for (let i=0;i<nm;i++){ const rr=110+i*90+r.range(0,30); L.bodies.push({m:r.range(5e5,1.1e6), rad:r.range(14,22), col:'m', orb:{c:core, r:rr, w:(r()<.5?-1:1)*Math.sqrt(core.m/rr**3)*0.9, ph:r()*7}}); }
    if (idx>=3){ L.bodies.push(planet(r.range(450,600), r()<.5?200:800, 1.6e6, 34, 'p')); }
    L.tr=46;
  }
  if (sys===2){
    const cx=800+r.range(-60,60), cy=500+r.range(-60,60); const sep=r.range(70,120)+diff*40; const m=r.range(2.4e6,3.6e6);
    const w=Math.sqrt(2*m/(2*sep)**3)*1.0*(r()<.5?-1:1); const ph=r()*7;
    L.bodies.push({m, rad:26, col:'s', star:1, orb:{cx,cy,r:sep,w,ph}}, {m, rad:22, col:'s', star:1, orb:{cx,cy,r:sep,w,ph:ph+Math.PI}});
    if (idx>=1) L.bodies.push(planet(r.range(420,560), r.range(220,780), r.range(1e6,2e6), 28, 'p'));
    if (idx>=3) L.bodies.push(planet(r.range(1040,1180), r.range(220,780), r.range(1e6,2e6), 28, 'p'));
    L.tr=44;
  }
  if (sys===3){
    const n=2+Math.floor(diff*2); for (let i=0;i<n;i++) L.bodies.push(planet(400+(i+0.5)*(800/n)+r.range(-50,50), r.range(220,780), r.range(1.5e6,3e6), r.range(30,46), 'p'));
    if (idx>=2){ const c=L.bodies[0]; L.bodies.push({m:6e5, rad:14, col:'m', orb:{c, r:c.rad+70, w:Math.sqrt(c.m/(c.rad+70)**3)*0.9, ph:r()*7}}); }
    L.tr=44;
  }
  if (sys===4){
    const bh={x:800+r.range(-60,60), y:500+r.range(-60,60), m:r.range(1.4e7,2.2e7)*(1+diff*0.4), rad:22, bh:1, col:'b'}; L.bodies.push(bh);
    const nm=Math.round(diff*3); for (let i=0;i<nm;i++){ const rr=170+i*80; L.bodies.push({m:9e5, rad:18, col:'m', orb:{c:bh, r:rr, w:(i%2?-1:1)*Math.sqrt(bh.m/rr**3)*0.7, ph:r()*7}}); }
    L.tr=42-idx*2;
  }
  return L;
}
// t0: the launch window (mission clock at launch). Returns {res, t, s, photo}
function simulate(L, ang, pow, onStep, burns, t0){
  t0 = t0 ?? L.t0 ?? 0;
  let x=L.start[0], y=L.start[1], vx=Math.cos(ang)*pow, vy=Math.sin(ang)*pow; let t=t0; let ring=0; const steps=Math.round(TMAX/DT);
  const pb = L.photo>=0? L.bodies[L.photo] : null; let photo=false;
  for (let s=0;s<steps;s++){
    let ax=0, ay=0;
    for (const b of L.bodies){ const [bx,by]=bodyPos(b,t); const dx=bx-x, dy=by-y; const d2=dx*dx+dy*dy; const d=Math.sqrt(d2);
      if (d < b.rad+4) return {res:'crash', t, s, body:b, photo};
      if (b===pb && d<photoR(b)) photo=true;
      const a=b.m/(d2+400); ax+=a*dx/d; ay+=a*dy/d; }
    if (burns){ const bn=burns(s, x,y,vx,vy); if (bn){ ax+=bn[0]; ay+=bn[1]; } }
    vx+=ax*DT; vy+=ay*DT; x+=vx*DT; y+=vy*DT; t+=DT;
    if (onStep && onStep(x,y,s,t)===false) return {res:'stop', t, s, photo};
    if (L.rings && ring<L.rings.length){ const rg=L.rings[ring]; if (Math.hypot(x-rg[0],y-rg[1])<rg[2]) ring++; }
    if ((!L.rings||ring>=L.rings.length) && Math.hypot(x-L.target[0],y-L.target[1])<L.tr) return {res:'win', t, s, photo};
    if (x<-250||x>WW+250||y<-250||y>WH+250) return {res:'lost', t, s, photo};
  }
  return {res:'timeout', t, photo};
}
// scan the launch grid; with opts.all, record how close every winning shot passes to each body
function solvable(L, wantRings, opts){
  const sols=[]; const all=opts&&opts.all;
  for (let a=0;a<120;a++) for (let p=0;p<9;p++){ const ang=a/120*Math.PI*2, pow=140+p*45;
    const path=[]; const md=all? L.bodies.map(()=>1e9) : null;
    const res=simulate(L, ang, pow, (wantRings||all)? (x,y,s,t)=>{ if (wantRings && s%10===0) path.push([x,y]); if (md && s%2===0) L.bodies.forEach((b,i)=>{ const [bx,by]=bodyPos(b,t); md[i]=Math.min(md[i],Math.hypot(bx-x,by-y)); }); } : null, null, 0);
    if (res.res==='win'){ sols.push({ang,pow,path,t:res.t,md}); if (!wantRings && !all && sols.length>=1) return sols; }
    if (wantRings && sols.length>=3) return sols; }
  return sols;
}
function tooEasy(L){ // straight shot works without much curve
  const ang=Math.atan2(L.target[1]-L.start[1], L.target[0]-L.start[0]);
  for (let p=0;p<9;p++) for (const da of [-0.06,0,0.06]) if (simulate(L, ang+da, 140+p*45, null, null, 0).res==='win') return true;
  return false;
}
// survey target: a body some winning shot photographs, preferably one the most common solution misses (a detour is a decision)
function pickPhoto(L){
  const sols=solvable(L, false, {all:true}); if (!sols.length) return -1;
  const ok=L.bodies.map((b,i)=>sols.filter(s=>s.md[i]<photoR(b)-6).length);
  let best=-1, bv=1e9; L.bodies.forEach((b,i)=>{ if (!ok[i]) return; const frac=ok[i]/sols.length; const v=Math.abs(frac-0.25); if (v<bv){ bv=v; best=i; } });
  if (best<0){ // nothing within the standard range: widen it around the body winning shots get closest to
    let md=1e9; L.bodies.forEach((b,i)=>{ const m=Math.min(...sols.map(s=>s.md[i])); if (m<md){ md=m; best=i; } }); L.bodies[best].pr=Math.ceil(md+12); }
  return best;
}
function buildLevel(sys, idx, seedBase){
  const finish=(L)=>{ L.photo=pickPhoto(L); return L; };
  for (let k=0;k<60;k++){
    const L=gen(sys, idx, seedBase*977+k*31+sys*100+idx);
    if (sys===3){
      L.rings=[]; const sols=solvable(L,true); if (!sols.length) continue;
      const sol=sols[Math.floor(sols.length/2)]; const path=sol.path; const nr=2+Math.floor(idx/2);
      for (let i=1;i<=nr;i++){ const pt=path[Math.floor(path.length*i/(nr+1))]; if(!pt) continue; L.rings.push([pt[0],pt[1],30]); }
      if (L.rings.length<2) continue;
      if (simulate(L, sol.ang, sol.pow, null, null, 0).res!=='win') continue;
      return finish(L);
    }
    L.rings=null;
    if (!solvable(L).length) continue;
    if (!(sys===0&&idx<2) && tooEasy(L)) continue;
    return finish(L);
  }
  const L=gen(sys, idx, seedBase); L.rings=null; return finish(L); // fallback (should be rare)
}
const starsFor=(used, photo)=> 1 + (used<=0.0001?1:0) + (photo?1:0);

// ===================== Sound: mission control =====================
const T=(o)=>{ try { FX.tone(o); } catch(e){} };
const VOICE={
  quindar:()=>T({f:2525,type:'sine',dur:.22,vol:.06}),
  key:()=>T({f:1800,type:'square',dur:.02,vol:.04}),
  launch:()=>{ T({noise:1,f:180,q:.5,dur:1.1,vol:.22,attack:.08}); T({f:90,f2:320,type:'sawtooth',dur:.9,vol:.05}); },

window.addEventListener('keydown', e=>{ if (typing(e)) { if (e.key==='Enter' && e.target.id==='seedIn') document.getElementById('deepBtn').click(); return; }
  if (e.key==='r'||e.key==='R'){ reset(); } if (e.key===' ' && mode==='fly'){ thrusting=true; e.preventDefault(); } });
window.addEventListener('keyup', e=>{ if (e.key===' ') thrusting=false; });

// ===================== Sidebar =====================
function renderSide(){
  let h=''; SYSTEMS.forEach((s,si)=>{ const unlocked = sysUnlocked(si);
    h+=`<div class="sys"><div class="h">Program ${si+1} · ${s.n}</div><div class="d">${unlocked? s.d : 'CLASSIFIED. Fly 3 missions of the previous program to unlock.'}</div><div class="lvls">`;
    for (let i=0;i<PER;i++){ const k=String(si*PER+i); const b=S.best[k]; const open = levelOpen(k);
      h+=`<button data-k="${k}" class="patch ${k===levelKey?'cur':''}" style="--pc:${s.pc}" ${open?'':'disabled'} aria-label="${s.n} mission ${i+1}${b?', '+b.stars+' stars':''}">${open?i+1:'✕'}<span class="st">${b?'★'.repeat(b.stars)+'☆'.repeat(3-b.stars):''}</span></button>`; }
    h+='</div></div>'; });
  const el=document.getElementById('levels'); el.innerHTML=h; el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{ if (!levelOpen(b.dataset.k)) return; VOICE.key(); S.cur=+b.dataset.k; persist(); openLevel(b.dataset.k); });
  const tot=Object.values(S.best).reduce((s,b)=>s+b.stars,0); document.getElementById('total').textContent=`${Object.keys(S.best).length}/${NLEV} missions · ${tot}/${NLEV*3} ★ · ${Object.keys(S.deep).length} deep`;
  const dk=Object.keys(S.deep); document.getElementById('deepInfo').textContent = dk.length? 'Flown: '+dk.slice(-6).map(k=>k.slice(5)+' '+'★'.repeat(S.deep[k].stars)).join(' · ') : '';
}
document.getElementById('deepBtn').onclick=()=>{ const v=document.getElementById('seedIn').value.trim().slice(0,32)||'andromeda'; openLevel('deep:'+v); };
document.getElementById('rndSeed').onclick=()=>{ const w=['vela','orion','lyra','draco','cygnus','hydra','carina','pavo','lupus','ara','grus','norma']; const s=w[Math.floor(Math.random()*w.length)]+'-'+Math.floor(Math.random()*1000); document.getElementById('seedIn').value=s; openLevel('deep:'+s); };

// ===================== Loop =====================
// Fixed-step physics driven by real elapsed time: the same flight takes the same wall-clock time at 30, 60 or 144 Hz
const MAX_STEPS=24;
function tick(dt){
  dt=Math.min(0.1, Math.max(0, dt||0)); burst.update(dt);
  if (mode!=='fly'){ acc=0; return 0; }
  acc+=dt; let n=0; while (acc>=DT && mode==='fly' && n<MAX_STEPS){ liveStep(); acc-=DT; n++; }
  if (n>=MAX_STEPS) acc=0; updHud(); return n;
}
let lastT=performance.now(), testHold=false;
function frame(now){ const dt=(now-lastT)/1000; lastT=now; if (!testHold) tick(dt); draw(); requestAnimationFrame(frame); }
fit(); window.addEventListener('resize', fit);
openLevel(String(S.cur||0)); requestAnimationFrame(frame);
window.__sling={ gen, buildLevel, simulate, solvable, tooEasy, pickPhoto, starsFor, photoR, moving, bodyPos, cleanSave, levelOpen, nextOpen, sysUnlocked, aimVec, launch, tick, liveStep, reset, openLevel, end, setWindow, DT, TMAX, THRUST, BURN_RATE, PER, NLEV, SYSTEMS,
  get S(){ return S; }, get L(){ return L; }, set L(v){ L=v; }, get mode(){ return mode; }, get probe(){ return probe; }, get fuel(){ return fuel; }, set fuel(v){ fuel=v; }, get stepN(){ return stepN; }, get simT(){ return simT; },
  get thrusting(){ return thrusting; }, set thrusting(v){ thrusting=v; }, get mouse(){ return mouse; }, set mouse(v){ mouse=v; }, get levelKey(){ return levelKey; }, get lastShot(){ return lastShot; }, get view(){ return view; }, get photoTaken(){ return photoTaken; }, get winAnim(){ return winAnim; },
  hold(v){ testHold=!!v; } };
if (!S.intro){ S.intro=1; persist(); RH.modal(`<h2>Slingshot</h2><p>Pasadena, 1977. You plan trajectories for a probe with almost no fuel. Every planet, moon and star pulls on it.</p><p><b>Drag back</b> from the probe to aim and let go to launch. The dots show only the start of the path.</p><p>Three stars per mission: <b>arrive</b>, <b>burn no fuel</b>, and <b>image the survey target</b> on the way.</p>`,[{label:'Go for launch'}]); }
