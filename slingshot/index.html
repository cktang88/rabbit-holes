<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slingshot</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  /* JPL mission planning, 1977: blueprint navy, cyan plot lines, orange trajectory pencil */
  :root{--navy:#0a2342;--navy2:#0d2c52;--ink:#d9ecf7;--cyan:#6fd3f0;--cyan2:#3a8fb3;--pencil:#ff8a2a;--paper:#efe9d8;--paperInk:#1d2a3a;--red:#e0472f;
    font-family:"Share Tech Mono",ui-monospace,Menlo,Consolas,monospace}
  html,body{background:var(--navy);color:var(--ink)}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;
    background:linear-gradient(rgba(111,211,240,.05) 1px,transparent 1px) 0 0/24px 24px,linear-gradient(90deg,rgba(111,211,240,.05) 1px,transparent 1px) 0 0/24px 24px,var(--navy)}
  .topbar{background:#071a33;border-bottom:2px solid var(--cyan2);font-family:"Share Tech Mono",monospace}
  .topbar h1{font-family:Orbitron,"Share Tech Mono",monospace;font-weight:800;letter-spacing:.18em;font-size:15px;color:var(--ink);text-transform:uppercase}
  .topbar h1 small{font-family:"Share Tech Mono",monospace;letter-spacing:.08em;font-weight:400;color:var(--cyan);font-size:11px;margin-left:8px}
  .topbar .home,.topbar .rh-like{color:var(--cyan)}
  #total{color:var(--cyan);letter-spacing:.06em}
  button{font-family:"Share Tech Mono",monospace;background:linear-gradient(#24476d,#183456);color:var(--ink);border:1px solid #4d7aa3;border-bottom-color:#0b1d33;border-right-color:#0b1d33;border-radius:2px;
    text-transform:uppercase;letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 #06162a}
  button:hover:not(:disabled){border-color:var(--cyan)}
  button:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 1px 3px #0008}
  button:focus-visible,input:focus-visible{outline:2px solid var(--pencil);outline-offset:2px}
  button.primary{background:linear-gradient(#ff9d47,#e0701c);color:#241104;border-color:#ffc58a;font-weight:700}
  input{font-family:"Share Tech Mono",monospace;background:#061629;color:var(--cyan);border:1px solid var(--cyan2);border-radius:0;letter-spacing:.06em}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0}
  canvas{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
  /* mission binder */
  #side{width:290px;background:linear-gradient(90deg,#0b2645,#0e2d50);border-left:2px solid var(--cyan2);overflow:auto;padding:12px 12px 16px}
  .bh{font-family:Orbitron,monospace;font-weight:800;font-size:12px;letter-spacing:.22em;color:var(--cyan);border-bottom:1px dashed var(--cyan2);padding-bottom:6px;margin-bottom:8px}
  .sys{margin-bottom:14px}
  .sys .h{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--pencil);margin-bottom:2px}
  .sys .d{font-size:12px;color:#a9c6da;margin-bottom:8px;line-height:1.35}
  .lvls{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;justify-items:center}
  /* levels are embroidered mission patches */
  .patch{width:54px;height:54px;border-radius:50%;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-transform:none;
    background:radial-gradient(circle at 35% 30%,var(--pc,#2f6b9a) 0 40%,#0d2440 75%);border:3px double #d9ecf7aa;box-shadow:0 0 0 2px #0a1e36,0 3px 6px #0008;font-family:Orbitron,monospace;font-weight:800;font-size:15px;color:#fff}
  .patch .st{display:block;font-family:"Share Tech Mono",monospace;font-size:10px;color:#ffd27a;height:11px;letter-spacing:0}
  .patch.cur{border-color:var(--pencil);box-shadow:0 0 0 2px var(--pencil),0 3px 6px #0008}
  .patch:disabled{background:repeating-linear-gradient(45deg,#13263e 0 4px,#0f1f33 4px 8px);color:#5b7896;border-style:dashed;opacity:1}
  /* console overlay */
  #hud{position:absolute;top:10px;left:12px;display:flex;gap:8px;pointer-events:none;align-items:stretch}
  .plate{background:linear-gradient(#1b3554,#10243d);border:1px solid #4d7aa3;box-shadow:inset 0 0 0 1px #06162a,0 2px 6px #0007;padding:4px 10px;font-size:13px;color:var(--ink);letter-spacing:.06em;display:flex;align-items:center;gap:6px}
  .plate b{color:var(--pencil);font-weight:400}
  #lvlName{max-width:36vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Orbitron,monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  #gauge{width:62px;height:36px}
  #tip{position:absolute;bottom:10px;left:12px;font-size:12px;color:#9fc4dc;pointer-events:none;max-width:60%}
  #window{position:absolute;bottom:12px;left:12px;display:none;gap:8px;align-items:center}
  #goalP{font-size:14px;max-width:min(560px,70vw);white-space:normal;line-height:1.3;pointer-events:none}
  #hint{position:absolute;left:50%;top:64px;transform:translateX(-50%);background:#ff8a2acc;color:#241104;font-weight:700;padding:6px 12px;border-radius:2px;pointer-events:none;display:none;max-width:calc(100% - 24px);text-align:center}
  #hint.on{display:block;animation:rise .3s ease-out}
  #camBtns{position:absolute;right:12px;bottom:12px;display:flex;gap:6px} #camBtns button{min-width:44px;min-height:40px}
  #burnBar{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);display:none;gap:8px} #burnBar.on{display:flex} #burnBar button{min-height:44px;user-select:none;-webkit-user-select:none;touch-action:none}
  #burnBar button.on{background:linear-gradient(#e0472f,#a8301c);color:#fff}
  @media (pointer:coarse){ #winR{height:36px} }
  .wcol{display:flex;flex-direction:column;gap:2px} #winStrip{position:relative;display:flex;height:12px;width:180px;border:1px solid #4d7aa3;background:#061629} #winStrip i{flex:1;display:block} #winStrip b{position:absolute;top:-3px;bottom:-3px;width:2px;background:#d9ecf7}
  #flyP{position:absolute;top:54px;left:12px;pointer-events:none;max-width:calc(100% - 24px);font-size:12px} #flyP:empty{display:none}
  .memo{border-top:1px dashed #8c8470;padding-top:6px}
  #window.on{display:flex}
  #tip{display:none}
  #window input[type=range]{width:180px;accent-color:var(--pencil)}
  #msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  /* mission report: plotter paper with a rubber stamp */
  #msg > div{background:linear-gradient(rgba(29,42,58,.07) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(29,42,58,.07) 1px,transparent 1px) 0 0/12px 12px,var(--paper);
    color:var(--paperInk);border:1px solid #b9b19a;padding:16px 24px;text-align:center;pointer-events:auto;max-width:calc(100% - 24px);box-shadow:0 10px 30px #000a;position:relative;animation:rise .35s ease-out both}
  #msg > div.won{animation-delay:1.5s}
  #msg h2{font-family:Orbitron,monospace;letter-spacing:.12em;text-transform:uppercase;font-size:18px}
  #msg .small{color:#4b5a6a}
  #msg button{background:#e3dcc6;color:var(--paperInk);border-color:#8c8470;box-shadow:0 2px 0 #8c8470}
  #msg button.primary{background:var(--pencil);color:#241104;border-color:#b8560e}
  .stamp{position:absolute;right:-8px;top:-14px;transform:rotate(-12deg);border:3px solid var(--red);color:var(--red);font-family:Orbitron,monospace;font-weight:800;font-size:12px;letter-spacing:.12em;padding:2px 8px;opacity:.85;background:transparent}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}}
  kbd{background:#061629;border-color:var(--cyan2);color:var(--cyan);font-family:"Share Tech Mono",monospace}
  .modal{background:linear-gradient(rgba(29,42,58,.07) 1px,transparent 1px) 0 0/12px 12px,linear-gradient(90deg,rgba(29,42,58,.07) 1px,transparent 1px) 0 0/12px 12px,var(--paper);color:var(--paperInk);border:1px solid #b9b19a;border-radius:0;font-family:"Share Tech Mono",monospace}
  .modal h2{font-family:Orbitron,monospace;letter-spacing:.1em;text-transform:uppercase}
  .modal button{background:#e3dcc6;color:var(--paperInk);border-color:#8c8470} .modal button.primary{background:var(--pencil);color:#241104}
  .toast{background:#071a33;border:1px solid var(--cyan);color:var(--cyan);border-radius:0;font-family:"Share Tech Mono",monospace;letter-spacing:.06em}
  #deep .row{margin-top:6px}
  #deepInfo{color:#a9c6da}
  #binderBtn,#binderClose{display:none}
  /* phones: the plot fills the screen; the mission binder is a drawer */
  @media (max-width:760px), (max-height:500px){
    body{height:100dvh}
    #side{position:fixed;z-index:60;left:0;right:0;bottom:0;width:auto;max-height:80dvh;border-left:0;border-top:2px solid var(--cyan2);box-shadow:0 -10px 30px #000c;visibility:hidden;transform:translateY(102%);transition:transform .25s,visibility 0s .25s}
    body.drawer #side{visibility:visible;transform:none;transition:transform .25s}
    #binderBtn{display:block;position:absolute;right:6px;top:6px;z-index:5;min-height:40px;pointer-events:auto}
    #binderClose{display:block;margin-left:auto;margin-bottom:6px;min-height:40px}
    #side button{min-height:40px}
    #hud{right:120px}
  }
  @media (max-height:500px) and (min-width:600px){
    #side{left:auto;top:0;width:330px;max-height:none;border-top:0;border-left:2px solid var(--cyan2);transform:translateX(102%)}
    .topbar{padding:3px 12px} #tip{display:none}
  }
  @media (max-width:760px){
    main{flex-direction:column}
    #hud{flex-wrap:wrap;gap:4px;left:6px;right:132px;top:6px} .plate{font-size:11px;padding:2px 6px}
    #tip{font-size:10px;left:8px;right:8px;bottom:6px;max-width:none}
    /* bottom edge on phones: Compute and Launch on their own strip, the window dial above them, nothing overlapping */
    #window{bottom:60px;left:6px} #window input[type=range]{width:120px;height:32px} #winStrip{width:120px} #camBtns{bottom:8px;right:6px} #burnBar{bottom:60px} #goalP{font-size:12px;max-width:none}
    .topbar{flex-wrap:wrap;row-gap:2px} .topbar #total{font-size:10px;text-align:right;min-width:0} .topbar h1 small{display:none}
    .lvls{gap:4px} .patch{width:46px;height:46px;font-size:13px}
  }
</style>
</head>
<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>Slingshot<small>JPL · mission design</small></h1><span class="spacer"></span><span class="small" id="total"></span></div>
<main>
  <div id="stage"><canvas id="cv" aria-label="Trajectory plot"></canvas>
    <div id="hud"><span class="plate" id="goalP" aria-live="polite"></span><span class="plate" id="dvP"></span></div>
    <span id="lvlName" hidden></span>
    <div id="flyP" class="plate" aria-live="polite"></div>
    <div id="hint" aria-live="polite"></div>
    <div id="camBtns"><button id="fitBtn" title="Frame the probe and its goal">Fit</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="zoomOut" aria-label="Zoom out">−</button></div>
    <div id="burnBar"><button id="burnUp" title="Hold to fire the engine along your motion">Speed up</button><button id="burnDown" title="Hold to fire the engine against your motion">Slow down</button></div>
    <div id="window"><span class="plate">LAUNCH DATE <b id="winV">T+ 0.0 s</b></span><div class="wcol"><div id="winStrip" aria-label="Launch-date strip"></div><input type="range" id="winR" min="0" max="40" step="0.5" value="0" aria-label="Launch date"></div></div>
    <div id="msg"></div>
    <button id="binderBtn" aria-expanded="false" aria-controls="side">Missions ☰</button>
  </div>
  <div id="side"><button id="binderClose">Close ✕</button><div class="bh">MISSION BINDER</div><div id="levels"></div>
    <div class="sys"><div class="h">Deep space</div><div class="d">A sandbox Grand Tour: the planets wherever a seed puts them. Unlimited computing, no stars.</div>
      <div class="row"><input id="seedIn" placeholder="seed" maxlength="32" style="width:110px" aria-label="Seed"><button id="deepBtn">Fly</button></div></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
const WW=1600, WH=1000, DT=1/120, TMAX=45, PER=3, WIN_MAX=40;
// A heliocentric system. The probe leaves Earth with Earth's own orbital speed plus a small launch kick (its Δv budget).
// Planets move on their orbits, so passing behind one steals some of its momentum: a gravity assist.
const SUN={x:800,y:500,m:1.335e6,rad:36}, EPS=400;
const wOf=(r)=>Math.sqrt(SUN.m/(r*(r*r+EPS)));
const PL=(n,r,m,rad,ph)=>({n,r,m,rad,ph,w:wOf(r)});
const E=()=>PL('Earth',150,3e4,14,0);
const SYSTEMS=[
  {n:'Transfer Orbits', d:'Reach Mars with a small kick. Launch along Earth\'s motion, and wait for Mars to come round (the launch-window dial).', preview:2.2, pc:'#2f6b9a',
   memo:'A Hohmann transfer: speed up along your orbit and you rise to a higher one half an orbit later. The art is leaving when the target will be there.'},
  {n:'Gravity Assist', d:'Saturn is out of reach on the fuel you have. Pass behind Jupiter as it moves and borrow some of its speed.', preview:1.8, pc:'#a8662a',
   memo:'In Jupiter\'s frame you leave as fast as you came; only your direction turns. In the Sun\'s frame Jupiter\'s motion is added. Pass behind a planet to speed up, in front to slow down.'},
  {n:'Falling Inward', d:'Mercury is deep in the Sun\'s well. Slowing down is as hard as speeding up: pass in front of Venus to lose speed.', preview:1.6, pc:'#2f8a7a',
   memo:'MESSENGER flew past Earth once, Venus twice and Mercury three times to brake into Mercury orbit. Falling inward costs as much as climbing out.'},
  {n:'Grand Tour', d:'Visit Jupiter, then Saturn, then leave the solar system. Voyager\'s 1977 alignment comes round once in 175 years.', preview:1.4, pc:'#7a4fa0',
   memo:'Voyager 2 used one launch and four planets. Each flyby set up the next: the whole mission was decided by the launch date.'},
];
// Each mission: planets (index 0 is Earth, the launch site), target (a planet, or -1 = escape the system), required flybys in order,
// a Δv budget, and par (the least Δv a search over launch windows, directions and kicks found), plus the solution it found.
const MISSIONS=[{"p": 0, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Mars", "r": 230, "m": 12000.0, "rad": 12, "ph": 1.0}], "target": 1, "budget": 9, "par": 4, "noAssist": 4, "sols": [{"t0": 0, "ang": 0.837758, "dv": 4}, {"t0": 0, "ang": 0.907571, "dv": 4}, {"t0": 0, "ang": 0.977384, "dv": 4}, {"t0": 0, "ang": 1.047198, "dv": 4}]}, {"p": 0, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Mars", "r": 230, "m": 12000.0, "rad": 12, "ph": 2.6}], "target": 1, "budget": 7, "par": 4, "noAssist": 4, "sols": [{"t0": 0, "ang": 0.279253, "dv": 4}, {"t0": 0, "ang": 0.349066, "dv": 4}, {"t0": 0, "ang": 0.418879, "dv": 4}, {"t0": 0, "ang": 0.488692, "dv": 4}]}, {"p": 0, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Mars", "r": 230, "m": 12000.0, "rad": 12, "ph": 4.4}, {"n": "Venus", "r": 105, "m": 40000.0, "rad": 14, "ph": 1.0}], "target": 1, "budget": 6, "par": 4, "noAssist": 4, "sols": [{"t0": 2, "ang": 2.722714, "dv": 4}, {"t0": 2, "ang": 2.792527, "dv": 4}, {"t0": 2, "ang": 2.86234, "dv": 4}, {"t0": 2, "ang": 2.932153, "dv": 4}]}, {"p": 1, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Jupiter", "r": 330, "m": 120000.0, "rad": 26, "ph": 0.9}, {"n": "Saturn", "r": 440, "m": 50000.0, "rad": 20, "ph": 2.2}], "target": 2, "budget": 11, "par": 4, "noAssist": 14, "sols": [{"t0": 4, "ang": 3.351032, "dv": 4}, {"t0": 4, "ang": 3.420845, "dv": 4}, {"t0": 4, "ang": 3.490659, "dv": 4}, {"t0": 4, "ang": 4.118977, "dv": 4}]}, {"p": 1, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Jupiter", "r": 330, "m": 120000.0, "rad": 26, "ph": 3.0}, {"n": "Saturn", "r": 440, "m": 50000.0, "rad": 20, "ph": 0.6}], "target": 2, "budget": 10, "par": 4, "noAssist": 14, "sols": [{"t0": 18, "ang": 1.396263, "dv": 4}, {"t0": 20, "ang": 0.698132, "dv": 4}, {"t0": 30, "ang": 0.628319, "dv": 4}, {"t0": 36, "ang": 5.026548, "dv": 4}]}, {"p": 1, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Mars", "r": 230, "m": 12000.0, "rad": 12, "ph": 2.0}, {"n": "Jupiter", "r": 330, "m": 120000.0, "rad": 26, "ph": 5.0}, {"n": "Saturn", "r": 440, "m": 50000.0, "rad": 20, "ph": 4.0}], "target": 3, "budget": 9, "par": 4, "noAssist": 14, "sols": [{"t0": 38, "ang": 1.256637, "dv": 4}, {"t0": 38, "ang": 1.32645, "dv": 4}, {"t0": 38, "ang": 1.396263, "dv": 4}, {"t0": 38, "ang": 1.466077, "dv": 4}]}, {"p": 2, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Venus", "r": 105, "m": 40000.0, "rad": 14, "ph": 0.4}, {"n": "Mercury", "r": 70, "m": 6000.0, "rad": 8, "ph": 2.0}], "target": 2, "budget": 10, "par": 4, "noAssist": 12, "sols": [{"t0": 2, "ang": 0.069813, "dv": 4}, {"t0": 2, "ang": 0.418879, "dv": 4}, {"t0": 2, "ang": 4.956735, "dv": 4}, {"t0": 2, "ang": 5.026548, "dv": 4}]}, {"p": 2, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Venus", "r": 105, "m": 40000.0, "rad": 14, "ph": 2.5}, {"n": "Mercury", "r": 70, "m": 6000.0, "rad": 8, "ph": 5.0}], "target": 2, "budget": 9, "par": 4, "noAssist": 12, "sols": [{"t0": 0, "ang": 4.118977, "dv": 4}, {"t0": 0, "ang": 4.18879, "dv": 4}, {"t0": 0, "ang": 4.258603, "dv": 4}, {"t0": 0, "ang": 4.328417, "dv": 4}]}, {"p": 2, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Venus", "r": 105, "m": 40000.0, "rad": 14, "ph": 4.0}, {"n": "Mercury", "r": 70, "m": 6000.0, "rad": 8, "ph": 0.5}, {"n": "Mars", "r": 230, "m": 12000.0, "rad": 12, "ph": 1.0}], "target": 2, "budget": 6, "par": 4, "noAssist": 12, "sols": [{"t0": 0, "ang": 5.51524, "dv": 4}, {"t0": 8, "ang": 2.303835, "dv": 4}, {"t0": 8, "ang": 2.373648, "dv": 4}, {"t0": 8, "ang": 4.258603, "dv": 4}]}, {"p": 3, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Jupiter", "r": 330, "m": 150000.0, "rad": 26, "ph": 0.6}, {"n": "Saturn", "r": 440, "m": 80000.0, "rad": 22, "ph": 1.4}], "target": -1, "visits": [1, 2], "budget": 16, "par": 7, "noAssist": 24, "sols": [{"t0": 14, "ang": 3.979351, "dv": 7}, {"t0": 0, "ang": 0.628319, "dv": 10}, {"t0": 0, "ang": 0.698132, "dv": 10}, {"t0": 0, "ang": 1.53589, "dv": 10}]}, {"p": 3, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Jupiter", "r": 330, "m": 150000.0, "rad": 26, "ph": 2.8}, {"n": "Saturn", "r": 440, "m": 80000.0, "rad": 22, "ph": 3.9}], "target": -1, "visits": [1, 2], "budget": 14, "par": 4, "noAssist": 24, "sols": [{"t0": 2, "ang": 1.256637, "dv": 4}, {"t0": 2, "ang": 4.18879, "dv": 4}, {"t0": 4, "ang": 3.141593, "dv": 4}, {"t0": 4, "ang": 3.211406, "dv": 4}]}, {"p": 3, "planets": [{"n": "Earth", "r": 150, "m": 30000.0, "rad": 14, "ph": 0}, {"n": "Venus", "r": 105, "m": 40000.0, "rad": 14, "ph": 1.5}, {"n": "Jupiter", "r": 330, "m": 150000.0, "rad": 26, "ph": 4.6}, {"n": "Saturn", "r": 440, "m": 80000.0, "rad": 22, "ph": 5.6}], "target": -1, "visits": [2, 3], "budget": 13, "par": 4, "noAssist": 24, "sols": [{"t0": 4, "ang": 2.583087, "dv": 4}, {"t0": 12, "ang": 1.256637, "dv": 4}, {"t0": 40, "ang": 0.558505, "dv": 6}, {"t0": 0, "ang": 1.53589, "dv": 8}]}];
const NLEV=MISSIONS.length;
// ===================== Saves =====================
function cleanSave(s){
  if (!s || typeof s!=='object' || Array.isArray(s)) s={};

      const pv=previewSecs(), n=Math.round(pv/DT); ctx.fillStyle=PEN; const pr=simulate(L, v.ang, v.dv, (x,y,s)=>{ if (s%6===0){ ctx.globalAlpha=Math.max(0.15,1-s/n*0.85); ctx.beginPath(); ctx.arc(x,y,px(2.6),0,7); ctx.fill(); } return s<n; }); ctx.globalAlpha=1;
      if (pr.res==='win'){ ctx.fillStyle='#7be38a'; ctx.font=fnt(14); ctx.textAlign='center'; txt('THIS PATH ARRIVES — LET GO', qx, qy+px(40)); }

      ctx.fillStyle='#d9ecf7'; ctx.font=fnt(15); ctx.textAlign='center'; { const [evx,evy]=bodyVel(L.planets[0],simT), em=Math.hypot(evx,evy)||1; txt(aimText(v), qx-evx/em*px(46), qy-evy/em*px(46)+px(4)); } updHud(); } }
  ctx.save(); ctx.translate(qx,qy); const gk=Math.max(1, px(14)/10); ctx.scale(gk,gk); ctx.rotate(mode==='aim'?0:Math.atan2(probe.vy,probe.vx)); ctx.strokeStyle='#ffffff'; ctx.fillStyle='#d9ecf7'; ctx.lineWidth=1.5;

// the mission's goal, pointed at from the edge of the screen when it is out of view

const burst=FX.particles(600);
// aim: the further you pull (in screen pixels), the bigger the kick; a full budget is a pull of about 140 px

// One verb: drag back from the probe like a slingshot, let go to launch. Drag empty space to pan; pinch or wheel to zoom.

const MAX_STEPS=24;

fit(); window.addEventListener('resize', fit);
