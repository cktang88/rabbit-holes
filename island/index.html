<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Naturalist's Island</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* A naturalist's sketchbook: the island is a watercolour on rough paper, the drawer is a row of field-guide cards,
     the notebook is ruled pages in sepia ink with pencilled graphs. Cute, not creepy: round animals, soft washes. */
  :root{--paper:#f5eedb;--paper2:#ebe0c4;--ink:#4a3a28;--ink2:#7b6648;--sea:#8fbcc6;--leaf:#6f9a4f;--berry:#b5476b;--sun:#e0a93b;--line:#c9b68f}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:Lora,Georgia,serif;color:var(--ink);display:flex;flex-direction:column;height:100vh;height:100dvh;
    background:#d9ccab radial-gradient(ellipse at 30% 20%,#efe5cb,#d7c8a3 80%)}
  .bar{display:flex;align-items:center;gap:10px;padding:6px 12px;flex:0 0 auto;background:var(--paper);border-bottom:1.5px solid var(--ink);box-shadow:0 2px 0 rgba(74,58,40,.15)}
  .bar a.home{color:var(--ink2);text-decoration:none;font-size:14px;white-space:nowrap}
  .bar h1{font:700 26px/1 Caveat,cursive;margin:0;color:var(--ink);white-space:nowrap}
  .bar .sp{flex:1}
  #when{font:700 20px/1 Caveat,cursive;color:var(--ink2);white-space:nowrap}
  button{font:600 15px Lora,Georgia,serif;color:var(--ink);background:#fbf6e8;border:1.5px solid var(--ink);border-radius:3px 6px 4px 7px;padding:4px 12px;min-height:38px;cursor:pointer;box-shadow:1px 2px 0 rgba(74,58,40,.35)}
  button:hover:not(:disabled){background:#fffaf0}
  button:active{transform:translate(1px,1px);box-shadow:none}
  button.go{background:#6f9a4f;color:#fbf6e8;border-color:#3f5a2b}
  button:disabled{opacity:.5}
  #bookBtn{font-size:22px;line-height:1;padding:0 14px;min-width:46px}
  main{flex:1;position:relative;min-height:0;overflow:hidden}
  #map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
  #fauna{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
  #brief{position:absolute;left:10px;top:8px;max-width:min(430px,calc(100% - 150px));z-index:2;background:rgba(251,246,232,.93);border:1.5px solid var(--ink);border-radius:2px 8px 3px 6px;padding:5px 10px;box-shadow:2px 3px 0 rgba(74,58,40,.25);font-size:14px;line-height:1.3;pointer-events:none}
  #brief b{font:700 19px/1.1 Caveat,cursive}
  #brief .pg{color:var(--ink2);font-style:italic}
  #census{position:absolute;right:10px;bottom:10px;z-index:2;width:176px;height:64px;background:rgba(251,246,232,.9);border:1.5px solid var(--ink);border-radius:3px;pointer-events:none}
  #note{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:3;font:700 24px Caveat,cursive;color:var(--ink);text-shadow:0 0 6px #fbf6e8,0 0 3px #fbf6e8;pointer-events:none;opacity:0;transition:opacity .3s;text-align:center}
  #note.on{opacity:1}
  .pz-bar{top:8px;right:10px;bottom:auto!important;z-index:3!important;gap:5px!important}
  .pz-bar button{font:700 22px Caveat,cursive!important;min-width:40px!important;min-height:40px!important;padding:0!important;opacity:1!important;background:#fbf6e8}
  /* the drawer: field-guide cards */
  #drawer{flex:0 0 auto;display:flex;align-items:stretch;gap:8px;padding:8px 10px;background:#e7dbbd linear-gradient(#efe5cc,#ddcfab);border-top:1.5px solid var(--ink);box-shadow:0 -3px 8px rgba(74,58,40,.2)}
  #cards{flex:1;display:flex;gap:7px;overflow-x:auto;overflow-y:hidden;padding:2px 2px 4px;scrollbar-width:thin;-webkit-overflow-scrolling:touch}
  .card{flex:0 0 auto;width:74px;min-height:84px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 2px 3px;background:#fbf6e8;border:1.5px solid var(--ink);border-radius:2px 7px 3px 6px;font:600 12px/1.1 Lora,serif;color:var(--ink);box-shadow:1px 2px 0 rgba(74,58,40,.3);transition:transform .15s}
  .card canvas{width:44px;height:44px}
  .card .nm{text-align:center} .card .ct{font:700 15px Caveat,cursive;color:var(--ink2)}
  .card.on{transform:translateY(-6px);background:#fff;box-shadow:0 0 0 3px var(--sun),2px 5px 0 rgba(74,58,40,.3)}
  .card.trap{background:#f3e3d3} .card.tool{background:#eef0dc}
  .card.locked{opacity:.42;filter:grayscale(.8)} .card .lk{font:700 13px Caveat,cursive;color:var(--berry)}
  .card canvas.spark{width:48px;height:11px;margin-top:1px}
  .card.hint{animation:hint 1.2s ease-in-out infinite} @keyframes hint{50%{box-shadow:0 0 0 4px var(--sun),1px 2px 0 rgba(74,58,40,.3)}}
  .ph{border-bottom:1px dashed var(--line);padding:5px 0} .ph .n{font:700 19px Caveat,cursive;color:var(--ink2)} .ph.got .n{color:var(--berry)} .ph .d{font-size:13.5px}
  .axes{font:700 18px Caveat,cursive;color:var(--ink2)} .chn{font-size:15px;color:var(--ink2)}
  .card:disabled{opacity:.45}
  #time{display:flex;flex-direction:column;gap:6px;justify-content:center}
  #time button{min-width:56px}
  #permits{font:700 17px Caveat,cursive;text-align:center;color:var(--ink2)}
  /* the notebook */
  #book{position:absolute;z-index:8;top:0;right:0;bottom:0;width:min(420px,100%);display:flex;flex-direction:column;background:var(--paper) repeating-linear-gradient(transparent 0 27px,rgba(110,150,190,.22) 27px 28px);border-left:2px solid var(--ink);box-shadow:-8px 0 24px rgba(0,0,0,.3);transform:translateX(105%);visibility:hidden;transition:transform .25s,visibility 0s .25s}
  body.book #book{transform:none;visibility:visible;transition:transform .25s}
  .tabs{display:flex;border-bottom:1.5px solid var(--ink);background:var(--paper2);flex:0 0 auto}
  .tabs button{flex:1;border:0;border-radius:0;box-shadow:none;background:none;font:700 19px Caveat,cursive;color:var(--ink2);min-height:44px;padding:0 4px}
  .tabs button.on{color:var(--ink);background:var(--paper);box-shadow:inset 0 -3px var(--berry)}
  .tabs .x{flex:0 0 44px;font:400 24px Lora,serif}
  .pane{flex:1;overflow:auto;padding:10px 14px;display:none;line-height:1.45;font-size:15px}
  .pane.on{display:block}
  .pane h3{font:700 22px Caveat,cursive;margin:12px 0 2px;color:var(--berry)}
  .com{border:1.5px solid var(--ink);border-radius:2px 8px 3px 6px;background:rgba(251,246,232,.92);padding:6px 10px;margin:8px 0;box-shadow:1px 2px 0 rgba(74,58,40,.25)}
  .com .t{font:700 21px Caveat,cursive} .com p{margin:2px 0 6px;font-size:14px}
  .com.done .t::after{content:" ✓ fulfilled";color:var(--leaf);font-size:17px}
  .com.locked{opacity:.55}
  .seal{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d3606f,#9a2d45 60%,#5e1424);vertical-align:-3px}
  .sp{display:flex;gap:10px;align-items:flex-start;margin:8px 0;padding-bottom:6px;border-bottom:1px dashed var(--line)}
  .sp canvas{flex:0 0 auto;width:44px;height:44px}
  .sp .n{font:700 20px Caveat,cursive} .sp .d{font-size:13.5px}
  .ev{font-size:14px;margin:3px 0} .ev b{font:700 17px Caveat,cursive;color:var(--ink2)}
  #bigChart{width:100%;height:220px;border:1.5px solid var(--ink);background:#fbf6e8}
  .legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:13px;margin-top:4px} .legend i{display:inline-block;width:14px;height:4px;vertical-align:middle;margin-right:3px;border-radius:2px}
  .modal{background:var(--paper) repeating-linear-gradient(transparent 0 27px,rgba(110,150,190,.2) 27px 28px);color:var(--ink);border:2px solid var(--ink);border-radius:3px 10px 4px 8px;font-family:Lora,serif;font-size:16px}
  .modal h2{font:700 32px/1.1 Caveat,cursive;margin:0 0 6px;color:var(--berry)}
  .modal .modal-actions{background-color:var(--paper)}
  .modal-bg{background:rgba(60,45,25,.45)}
  .toast{background:#fbf6e8;color:var(--ink);border:1.5px solid var(--ink);border-radius:2px 8px 3px 6px;font-family:Lora,serif;box-shadow:2px 3px 0 rgba(74,58,40,.3)}
  .toast-wrap{bottom:150px}
  /* the signature moment: a pressed-flower seal stamped on the page */
  #stamp{position:fixed;left:50%;top:42%;z-index:9500;width:190px;height:190px;margin:-95px 0 0 -95px;pointer-events:none;opacity:0;transform:scale(2.4) rotate(-14deg)}
  #stamp.on{animation:press 1.6s cubic-bezier(.2,1.3,.4,1) forwards}
  @keyframes press{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}35%{opacity:1;transform:scale(1) rotate(-6deg)}80%{opacity:1;transform:scale(1) rotate(-6deg)}100%{opacity:0;transform:scale(1.04) rotate(-6deg)}}
  @media (max-width:640px){
    .bar h1{font-size:22px} .bar .home span{display:none}
    #brief{max-width:calc(100% - 150px);font-size:13px}
    #census{width:132px;height:52px}
    .card{width:64px;min-height:78px;font-size:11px} .card canvas{width:38px;height:38px}
    #book{position:fixed;inset:0;width:auto;height:auto;border-left:0;transform:translateY(105%);z-index:20}
    #note{font-size:18px;max-width:86%;top:38%}
    #drawer{gap:6px;padding:6px 8px}
    #cards.many{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:50px;gap:5px}
    #cards.many .card{width:50px;min-height:0;padding:2px 1px 1px;font-size:9px;line-height:1;overflow:hidden}
    #cards.many .card .nm{max-width:48px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    #cards.many .card canvas{width:26px;height:26px}
    #cards.many .card .ct{font-size:12px;line-height:1} #cards.many .card canvas.spark{width:40px;height:9px} #cards.many .card .lk{font-size:11px}
    #cards.many .card.on{transform:none}
    #time{gap:4px} #time button{min-width:44px;min-height:36px;padding:0 6px}
    #permits{font-size:14px;line-height:1}
  }
  @media (max-height:520px) and (min-width:600px){
    body{flex-direction:column}
    .bar{padding:2px 10px} .bar h1{font-size:20px}
    #drawer{padding:4px 8px} .card{min-height:62px;width:62px} .card canvas{width:30px;height:30px}
    #time{flex-direction:row;align-items:center} #permits{min-width:52px}
    #census{display:none}
    #book{width:min(420px,62%)}
  }
</style>
</head>
<body>
<div class="bar"><a class="home" href="../index.html">← <span>Rabbit Holes</span></a><h1>Naturalist's Island</h1><span class="sp"></span><span id="when"></span><button id="bookBtn" aria-label="Notebook" title="Notebook: commissions, census, field guide">⋯</button></div>
<main id="stage">
  <canvas id="map" data-play></canvas><canvas id="fauna" aria-hidden="true"></canvas>
  <div id="brief"></div><canvas id="census" width="176" height="64"></canvas><div id="note"></div>
  <aside id="book" aria-label="Notebook">
    <div class="tabs"><button data-t="com" class="on">Chapters</button><button data-t="jr">Journal</button><button data-t="cen">Census</button><button data-t="log">Notes</button><button data-t="guide">Guide</button><button class="x" id="bookX" aria-label="Close the notebook">×</button></div>
    <div class="pane on" id="p-com"></div>
    <div class="pane" id="p-cen"><canvas id="bigChart" width="380" height="220"></canvas><div class="legend" id="legend"></div><canvas id="plantChart" width="380" height="120" style="width:100%;height:120px;border:1.5px solid var(--ink);background:#fbf6e8;margin-top:8px"></canvas><div class="legend" id="plegend"></div></div>
    <div class="pane" id="p-jr"></div>
    <div class="pane" id="p-log"></div>
    <div class="pane" id="p-guide"></div>
  </aside>
</main>
<div id="drawer"><div id="cards"></div><div id="time"><button id="playBtn" aria-label="Play or pause">❚❚</button><button id="speedBtn" title="Speed">×1</button><div id="permits"></div></div></div>
<svg id="stamp" viewBox="0 0 200 200" aria-hidden="true"><defs><radialGradient id="wx" cx="40%" cy="35%"><stop offset="0" stop-color="#d9727f"/><stop offset=".6" stop-color="#a3304a"/><stop offset="1" stop-color="#6a1628"/></radialGradient></defs>
  <path d="M100 8 C130 10 150 22 168 40 C190 62 194 92 186 120 C176 154 150 186 108 190 C70 194 36 176 20 146 C4 114 10 70 34 42 C52 20 74 8 100 8 Z" fill="url(#wx)"/>
  <circle cx="100" cy="100" r="66" fill="none" stroke="#f6d7d0" stroke-width="3" stroke-dasharray="4 5" opacity=".8"/>
  <g fill="#f8e6df" opacity=".95"><ellipse cx="100" cy="70" rx="13" ry="26"/><ellipse cx="100" cy="130" rx="13" ry="26"/><ellipse cx="70" cy="100" rx="26" ry="13"/><ellipse cx="130" cy="100" rx="26" ry="13"/><circle cx="100" cy="100" r="12" fill="#e0a93b"/></g>
  <text x="100" y="178" text-anchor="middle" font-family="Caveat" font-size="22" font-weight="700" fill="#f8e6df">fulfilled</text></svg>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script src="sim.js"></script>
<script>
'use strict';
const I = IslandSim, GW = I.GW, GH = I.GH, N = I.N, TPY = I.TPY, SP = I.SP, IDX = I.IDX;
// ===================== saved progress =====================
// The steward's island is saved as the snapshot taken when the current chapter began, plus the releases made since
// (replayed exactly on load). Plus: the best result on every chapter, every phenomenon ever seen, the daily records.
const isObj = (o) => o && typeof o === 'object' && !Array.isArray(o);
let M = RH.load('island', null); if (!isObj(M)) M = {};
if (!isObj(M.daily)) M.daily = {}; if (!isObj(M.best)) M.best = {}; if (!isObj(M.codex)) M.codex = {};
for (const [k, v] of Object.entries(M.daily)) if (!/^\d{4}-\d\d-\d\d$/.test(k) || !isObj(v) || !Number.isFinite(v.score)) delete M.daily[k];
for (const [k, v] of Object.entries(M.best)) if (!I.CH.some(c => c.id === k) || !isObj(v) || !['y', 'r', 's'].every(a => Number.isFinite(v[a]))) delete M.best[k];
for (const k of Object.keys(M.codex)) if (!I.CODEX.some(c => c.id === k) || !Number.isFinite(M.codex[k])) delete M.codex[k];
const validAct = (a) => Array.isArray(a) && a.length === 4 && Number.isInteger(a[0]) && a[0] >= 0 && typeof a[1] === 'string' && I.validId(a[1]) && Number.isInteger(a[2]) && Number.isInteger(a[3]) && a[2] >= 0 && a[3] >= 0 && a[2] < GW && a[3] < GH;
const validRun = (r) => isObj(r) && typeof r.c === 'string' && Array.isArray(r.a) && r.a.length < 400 && r.a.every(validAct) && Number.isInteger(r.t) && r.t >= 0 && r.t < 300 * TPY;
const validCamp = (c) => isObj(c) && typeof c.seed === 'string' && c.seed.length < 40 && isObj(c.snap) && c.snap.v === 1 && Array.isArray(c.a) && c.a.length < 400 && c.a.every(validAct) && Number.isInteger(c.t) && c.t >= 0;
if (!validRun(M.run)) delete M.run; if (!validCamp(M.camp)) delete M.camp;
const chDone = () => M.camp && M.camp.snap && M.camp.snap.camp ? M.camp.snap.camp.ch : 0;
const persist = () => { RH.save('island', M); RH.progress('island', Math.min(1, (Object.keys(M.best).length + Object.keys(M.codex).length / 4) / (I.CH.length - 1 + I.CODEX.length / 4))); };
const todayKey = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const deepUnlocked = () => Object.keys(M.best).length > 0;

// ===================== the run =====================
// MODE 'camp' is the steward's island (chapters, persistent); 'daily' and 'sandbox' are one-off islands.
let MODE = 'camp', C = null, W = null, permits = 0, result = null, running = true, waiting = false, speed = 8, acc = 0, sel = null, lastYear = -1, events = [];
const CHn = () => I.CH[W.camp.ch];
const left = () => MODE === 'camp' ? W.camp.permits : permits;
const title = () => MODE === 'camp' ? CHn().title : C.title;
function commission(id, arg) { if (id === 'daily') return I.daily(arg || todayKey()); return I.sandbox(arg || 'one'); }
function reset() { result = null; sel = null; lastYear = -1; events = []; acc = 0; speed = 8; hush(); for (const k in prevYear) delete prevYear[k]; }
// the steward's island: restore the chapter's starting snapshot and replay the releases since
function beginCamp(seed) { reset(); MODE = 'camp'; C = null; let w = null; const c = M.camp && M.camp.seed === seed ? M.camp : null;
  if (c) { try { w = I.restore(c.snap); const acts = [...c.a].sort((a, b) => a[0] - b[0]); let ai = 0;
      while (w.t < c.t) { while (ai < acts.length && acts[ai][0] <= w.t) I.campAct(w, acts[ai++]); I.campTick(w); }
      while (ai < acts.length && acts[ai][0] <= w.t) I.campAct(w, acts[ai++]); } catch (e) { w = null; } }
  if (!w) { w = I.newCampaign(seed); M.camp = { seed, snap: I.snapshot(w), a: [], t: w.t }; }
  W = w; M.lastMode = 'camp'; M.camp.a = W.actions; lastYear = Math.floor(W.t / TPY); mergeCodex(); persist(); started(!W.actions.length);
  if (location.hash && !/^#camp=/.test(location.hash)) history.replaceState(null, '', location.pathname); }
function rewind() { if (MODE !== 'camp') return; reset(); W = I.restore(M.camp.snap); M.camp.a = W.actions; M.camp.t = W.t; lastYear = Math.floor(W.t / TPY); persist(); started(true); say('Back to the start of the chapter, year ' + lastYear); }
function newIsland(seed) { M.camp = null; beginCamp(seed); }
function started(wait) { running = true; waiting = wait; floraDirty = vegDirty = true; buildStatic(); renderCards(); renderBrief(); renderBook(); fitIsland(); syncPlay(); }
// a one-off island: the daily island, or a free island
function begin(id, arg, actions, upto) {
  if (id === 'camp') return beginCamp(arg || (M.camp && M.camp.seed) || 'hollow');
  reset(); MODE = id; C = commission(id, arg); W = I.start(C); permits = C.permits;
  if (actions && actions.length) { const acts = [...actions].sort((a, b) => a[0] - b[0]); let ai = 0; const end = Math.max(upto || 0, acts[acts.length - 1][0]);
    while (W.t <= end) { while (ai < acts.length && acts[ai][0] <= W.t) { I.act(W, acts[ai++]); permits--; } if (W.t >= end) break; I.step(W); yearTick(true); } }
  M.run = { c: id, arg: arg || null, a: W.actions, t: W.t }; M.lastMode = id; persist(); started(!W.actions.length); setHash(); }
function setHash() { const h = C.id === 'daily' ? '#day=' + C.seed.slice(4) : '#free=' + encodeURIComponent(C.seed.slice(5)) + (W.actions.length ? '&r=' + encodeActs(W.actions) : ''); history.replaceState(null, '', location.pathname + h); }
const encodeActs = (a) => a.map(([t, id, x, y]) => `${t.toString(36)}.${id}.${x.toString(36)}.${y.toString(36)}`).join('_');
const decodeActs = (s) => String(s || '').split('_').filter(Boolean).map(p => { const [t, id, x, y] = p.split('.'); return [parseInt(t, 36), id, parseInt(x, 36), parseInt(y, 36)]; })
  .filter(a => Number.isInteger(a[0]) && a[0] >= 0 && a[0] < 200 * TPY && validAct(a)).slice(0, 300);

// one tick of the world, plus the yearly bookkeeping
function advance() { vegDirty = true; if ((W.t + 1) % 12 === 0) floraDirty = true;
  if (MODE === 'camp') { const ev = I.campTick(W); if (ev) campEvents(ev); yearTick(false); } else { I.step(W); yearTick(false); } }
function yearTick(quiet) {
  if (W.t % TPY !== 0) return; const y = W.t / TPY; if (y === lastYear) return; lastYear = y;
  notice(y, quiet);
  if (MODE !== 'camp' && !result) { const g = C.goal(W); if (g === 'done') finish(g, quiet); }
  if (!quiet) { if (MODE === 'camp') M.camp.t = W.t; else M.run.t = W.t; persist(); renderBrief(); renderSparks(); if (bookOpen()) renderBook(); }
}
function mergeCodex() { for (const [k, v] of Object.entries(W.codex || {})) if (M.codex[k] == null) M.codex[k] = v; }
// what the year brought: phenomena, shocks, a fulfilled chapter (and the next one), a lapse
function campEvents(ev) {
  for (const e of ev) {
    if (e.kind === 'codex') { const c = I.CODEX.find(x => x.id === e.id); const fresh = M.codex[e.id] == null; M.codex[e.id] = W.t / TPY; events.push({ y: W.t / TPY, txt: 'Observed: ' + c.name }); if (fresh) { toast(`New in the journal: <b>${c.name}</b>`); SND.chirp(); } }
    else if (e.kind === 'shock') { events.push({ y: W.t / TPY, txt: e.msg }); say(e.msg); }
    else if (e.kind === 'permits') toast('The society sends four more releases.');
    else if (e.kind === 'won') { const ch = I.CH[e.ch], yrs = e.years, rel = M.camp.a.length, sp = I.speciesCount(W); const b = M.best[ch.id];
      M.best[ch.id] = b ? { y: Math.min(b.y, yrs), r: Math.min(b.r, rel), s: Math.max(b.s, sp) } : { y: yrs, r: rel, s: sp }; lastWin = { ch: e.ch, yrs, rel, sp, prev: b };
      stamp(); SND.seal(); events.push({ y: W.t / TPY, txt: 'Fulfilled: ' + ch.title }); }
    else if (e.kind === 'chapter') { M.camp.snap = I.snapshot(W); W.actions = []; M.camp.a = W.actions; M.camp.t = W.t; sel = null; waiting = true; syncPlay(); persist(); renderCards(); renderBrief();

const eatenBy = (id) => SP.filter(s => s.prey && s.prey.some(p => p[0] === id)).map(s => s.name.toLowerCase());

document.querySelectorAll('.tabs button[data-t]').forEach(b => b.onclick = () => { tab = b.dataset.t; renderBook(); });
document.getElementById('bookX').onclick = closeBook;
document.getElementById('bookBtn').onclick = () => bookOpen() ? closeBook() : openBook();

let down = null;

// ===================== time =====================

const SPEEDS = [1, 8, 24], TPS = 3;

document.getElementById('playBtn').onclick = () => { if (waiting) { waiting = false; running = true; } else running = !running; syncPlay(); };
document.getElementById('speedBtn').onclick = () => { speed = SPEEDS[(SPEEDS.indexOf(speed) + 1) % SPEEDS.length]; syncPlay(); };
addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); document.getElementById('playBtn').click(); } else if (e.key === 'Escape') { sel = null; renderCards(); closeBook(); } });
let last = performance.now(), countsT = 0, frames = [];
function loop(now) {

// ===================== boot =====================
// No intro screen: the island, the drawer, and one line telling you what to tap.
function boot() {
