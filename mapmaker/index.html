<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapmaker of Lost Islands</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  /* A 1680 chart table: walnut, vellum, iron-gall ink, verdigris and sealing wax */
  :root{--vellum:#eadbb4;--vellum2:#dcc898;--ink:#2e2015;--ink2:#5a4630;--verd:#3f7f6a;--wax:#9c1f1a;--brass:#b58a3c;--wood:#3b2414;
    font-family:"IM Fell English",Georgia,serif}
  html,body{background:var(--wood);color:var(--ink)}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;
    background:repeating-linear-gradient(92deg,#3b2414 0 7px,#432a17 7px 9px,#36200f 9px 15px,#3f2615 15px 22px),var(--wood)}
  .topbar{background:linear-gradient(#2a180c,#1f1208);border-bottom:2px solid #120a04;color:#e9d9b0}
  .topbar h1{font-family:"IM Fell English SC",serif;font-size:20px;font-weight:400;letter-spacing:.06em;color:#f0e2bc}
  .topbar .home,.topbar .rh-like{color:#cdb88a;font-style:italic}
  #tot{color:#cdb88a;font-style:italic}
  button{font-family:"IM Fell English",serif;font-size:14px;color:#2e2015;background:linear-gradient(#f1e4c3,#d8c290);border:1px solid #7a5c32;border-radius:3px;box-shadow:inset 0 1px 0 #fff8,0 2px 0 #6b4e28}
  button:hover:not(:disabled){border-color:var(--wax)}
  button:focus-visible{outline:2px solid var(--wax);outline-offset:2px}
  button.primary{background:linear-gradient(#b8312a,#8a1a15);color:#f7e8c8;border-color:#5e0f0b;box-shadow:inset 0 1px 0 #fff4,0 2px 0 #4a0c09}
  button:disabled{opacity:.5}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0}
  #chart{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
  /* the lookout: a brass-rimmed glass */
  #look{position:absolute;right:16px;top:16px;width:220px;height:220px;border-radius:50%;background:#0d2a3a;
    box-shadow:0 0 0 5px #c79a48,0 0 0 8px #7a5a24,0 0 0 9px #e8c878,0 10px 30px #000c}
  #lookL{position:absolute;right:14px;top:246px;width:220px;text-align:center;font-size:14px;color:#f0e2bc;font-style:italic;text-shadow:0 1px 3px #000}
  /* the side is the master's journal: vellum leaves */
  #side{width:330px;background:linear-gradient(90deg,#c9b383 0,#eadbb4 14px,#eadbb4);border-left:3px solid #1f1208;overflow:auto;padding:14px 14px 16px 22px;display:flex;flex-direction:column;gap:14px;color:var(--ink);
    box-shadow:inset 12px 0 18px -10px #6b4e28}
  .box{border-bottom:1px solid #a88b5a;padding:2px 0 12px}
  h3{margin:0 0 6px;font-family:"IM Fell English SC",serif;font-weight:400;font-size:19px;letter-spacing:.04em;color:var(--ink)}
  .stat{display:flex;justify-content:space-between;font-size:15px;padding:1px 0}
  .bar{height:6px;border:1px solid var(--ink2);margin-top:2px;background:#f4ead0}
  .bar div{height:100%}
  .com{font-size:14px;padding:6px 0 6px 0;border-bottom:1px dotted #a88b5a;position:relative}
  .com.done{color:#6d5a40}
  .com .t{font-weight:400;font-size:15px}
  .com .p{font-size:13px;color:#5a4630;font-style:italic}
  .com .ready{color:var(--verd);font-style:normal}
  .seal{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d24a3c,#9c1f1a 55%,#6a120e);box-shadow:0 1px 2px #0006;vertical-align:middle;margin-right:4px;position:relative}
  .seal::after{content:"A";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f3c2b2;font-size:11px;font-family:"IM Fell English SC",serif}
  .inst{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;padding:4px 0}
  .inst .p{color:#5a4630!important;font-style:italic}
  .inst button{font-size:13px;padding:3px 8px}
  #hud{position:absolute;left:14px;bottom:12px;font-size:15px;color:#f0e2bc;font-style:italic;text-shadow:0 1px 3px #000}
  .nudge{animation:nudge 1.2s ease-in-out infinite;outline:2px solid #9c1f1a;outline-offset:2px}
  @keyframes nudge{50%{outline-color:transparent}}
  @media (prefers-reduced-motion:reduce){.nudge{animation:none}}
  #orders{background:#f6ecd0;border:1px solid #9c1f1a;padding:8px 10px}
  .sails{display:flex;gap:4px;margin-top:6px} .sails button{flex:1;font-size:13px;padding:5px 4px} .sails button.on{background:linear-gradient(#3f7f6a,#2c5c4c);color:#f0e2bc;border-color:#1d3d33}
  #log{font-size:14px;line-height:1.35;max-height:170px;overflow:auto;font-style:italic;color:var(--ink2)}
  #log div{padding:2px 0;border-bottom:1px dotted #c4aa78} #log b{font-style:normal;color:var(--ink);font-weight:400;font-family:"IM Fell English SC",serif}
  #ashore{display:none;margin-top:8px;width:100%}
  #ashore.on{display:block}
  kbd{background:#f4ead0;border-color:#a88b5a;color:var(--ink)}
  .small{font-size:13px}
  .modal{background:linear-gradient(#f1e4c3,#e3d1a4);color:var(--ink);border:1px solid #7a5c32;border-radius:2px;font-family:"IM Fell English",serif;box-shadow:0 10px 40px #000a}
  .modal h2{font-family:"IM Fell English SC",serif;font-weight:400}
  .toast{background:#f1e4c3;color:var(--ink);border:1px solid #7a5c32;border-radius:2px;font-family:"IM Fell English",serif;font-style:italic;box-shadow:0 4px 14px #0008}
  /* the Admiralty seal, pressed when a commission is delivered */
  #sealFx{position:absolute;left:50%;top:44%;width:180px;height:180px;margin:-90px 0 0 -90px;pointer-events:none;display:none}
  #sealFx.on{display:block;animation:press 2.6s ease-out forwards}
  @keyframes press{0%{transform:scale(2.6) rotate(-30deg);opacity:0}18%{transform:scale(.92) rotate(-8deg);opacity:1}24%{transform:scale(1.04) rotate(-10deg)}30%{transform:scale(1) rotate(-10deg)}80%{opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){#sealFx.on{animation:none;opacity:1}}
  #zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
  #zoom button{width:40px;height:40px;padding:0;font-size:22px;line-height:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d48a,#b58a3c 60%,#7a5a24);border-color:#5e4418}
  @media (max-height:500px){
    #look{width:110px;height:110px;right:10px;top:10px} #lookL{display:none}
    .topbar{padding:3px 12px} #side{width:300px}
  }
  @media (max-width:760px){
    main{flex-direction:column}
    #stage{flex:none;height:54vh}
    #side{width:auto;flex:1;min-height:0;border-left:0;border-top:3px solid #1f1208;padding-left:14px}
    #look{width:104px;height:104px;right:10px;top:10px} #lookL{display:none}
    #hud{left:8px;bottom:6px;font-size:13px}
    .topbar{flex-wrap:wrap;row-gap:0} .topbar h1{font-size:15px} .topbar #tot{font-size:11px;min-width:0}
  }
</style>
</head>
<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>The Mapmaker of Lost Islands</h1><span class="spacer"></span><span class="small" id="tot"></span></div>
<main>
  <div id="stage"><canvas id="chart" aria-label="Your chart"></canvas><canvas id="look" aria-label="The lookout's view"></canvas><div id="lookL">The lookout: what is truly there</div><div id="hud"></div><div id="zoom"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button></div>
    <svg id="sealFx" viewBox="0 0 180 180" aria-hidden="true"><defs><radialGradient id="wx" cx=".38" cy=".32"><stop offset="0" stop-color="#d9584a"/><stop offset=".55" stop-color="#9c1f1a"/><stop offset="1" stop-color="#5e0f0b"/></radialGradient></defs>
      <path d="M90 6 C120 4 150 18 164 44 C178 70 176 104 162 130 C148 158 118 176 88 174 C56 172 26 156 14 126 C2 96 6 62 22 38 C38 14 62 8 90 6Z" fill="url(#wx)"/>
      <circle cx="90" cy="90" r="58" fill="none" stroke="#6a120e" stroke-width="3"/><circle cx="90" cy="90" r="52" fill="none" stroke="#e58a7c" stroke-opacity=".5" stroke-width="1.5"/>
      <text x="90" y="82" text-anchor="middle" font-family="IM Fell English SC,serif" font-size="17" fill="#f3c2b2">ADMIRALTY</text><text id="sealTxt" x="90" y="106" text-anchor="middle" font-family="IM Fell English,serif" font-style="italic" font-size="13" fill="#f3c2b2"></text>
      <path d="M58 118 l64 0" stroke="#f3c2b2" stroke-opacity=".6"/></svg>
  </div>
  <div id="side">
    <div class="box" id="orders" hidden><h3>Master's orders</h3><div id="ordersTxt" class="small" style="font-size:15px"></div></div>
    <div class="box"><h3 id="shipName">The Wandering Gull</h3>
      <div class="stat"><span>Gold</span><b id="gold"></b></div>
      <div class="stat"><span>Provisions</span><b id="prov"></b></div><div class="bar"><div id="provBar" style="background:#3f7f6a"></div></div>
      <div class="stat"><span>Hull</span><b id="hull"></b></div><div class="bar"><div id="hullBar" style="background:#8a5a2a"></div></div>
      <div class="stat" style="margin-top:4px"><span title="Dead reckoning: where we think we are from speed, heading and time. The circle on the chart grows until a fix shrinks it.">Our position (reckoned)</span><b id="unc"></b></div>
      <div class="sails" id="sails"><button data-sail="0">⚓ Furl</button><button data-sail="1">Half sail</button><button data-sail="2">Full sail</button></div>
      <div class="row" style="margin-top:8px"><button id="bearBtn" title="Compass bearings on two landmarks you have already charted. Your chart's errors become your position's errors.">⌖ Bearings</button><button id="fixBtn">⊕ Noon sight</button><button id="inkBtn" title="Stray ink lowers a chart's accuracy: lift the quill when you are unsure where you are">🖋 Quill: inking</button></div>
      <button id="leadBtn" title="Heave the lead: depth tells you how close rocks and shoals are, even in fog (L)" style="margin-top:6px">⚓ Sound</button>
      <button id="allowBtn" title="Add the currents you have measured (set and drift) to your reckoning" style="margin-top:6px">Allow for current: yes</button>
      <button id="ashore">⛵ Go ashore</button>
      <div class="small" style="color:#5a4630;margin-top:6px"><kbd>W</kbd>/<kbd>S</kbd> sails · <kbd>A</kbd>/<kbd>D</kbd> helm · or click the chart to steer. <kbd>F</kbd> fix · <kbd>Space</kbd> heave to</div>
    </div>
    <div class="box" id="portBox"></div>
    <div class="box"><h3>Ship's log</h3><div id="log"></div></div>
    <div class="box"><h3>Commissions</h3><div id="coms"></div></div>
    <div class="box"><h3>Instruments</h3><div id="insts"></div></div>
    <div class="row"><button id="exportBtn">Export chart</button><button id="newWorld">New archipelago</button></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
const WX=1400, WY=900, CELL=5, GW=WX/CELL, GH=WY/CELL;
// ===================== World =====================
let S = RH.load('mapmaker', null);
function freshSave(seed){ return {seed:playableSeed(seed), gold:40, prov:100, hull:100, inst:{compass:1}, ship:null, ink:[], done:{}, visited:[], rep:0, worlds:(S&&S.worlds)||0, log:[], landed:{}, day:0, learned:{}, allow:false, tut:(S&&S.tut)||0, tutSpot:null, reefInk:{}, sold:{}, rivalDone:{}, routes:0}; }
// every commission needs at least five islands (home + four to chart); skip the rare seeds that make fewer
function playableSeed(seed){ seed=Math.floor(Math.abs(+seed||0))%1e9; for (let k=0;k<50;k++){ buildWorld(seed+k); if (islands.length>=5) return seed+k; } return seed; }
const num=(v,d,lo,hi)=> Number.isFinite(v)? Math.max(lo,Math.min(hi,v)) : d;
function cleanSave(s){
  if (!s || typeof s!=='object' || Array.isArray(s) || !Number.isFinite(s.seed)) return null;
  const pt=(p)=>Array.isArray(p) && (p.length===2 || (p.length===3 && (p[2]===1||p[2]===0))) && Number.isFinite(p[0]) && Number.isFinite(p[1]);
  const inst={compass:1}; if (s.inst && typeof s.inst==='object') for (const k in s.inst) if (INST.some(x=>x.k===k) && s.inst[k]) inst[k]=1;
  const done={}; if (s.done && typeof s.done==='object') for (const k in s.done){ const n=+k; if (Number.isInteger(n) && n>=0 && n<COMS.length && s.done[k]) done[n]=1; }
  const sh=s.ship; const ship= sh && typeof sh==='object' && ['x','y','bx','by','h'].every(k=>Number.isFinite(sh[k])) ? {...sh, sail:[0,1,2].includes(sh.sail)?sh.sail:0, voyageDmg:num(sh.voyageDmg,0,0,1e4)} : null;
  return {...s, seed:Math.floor(Math.abs(s.seed))%1e9, gold:Math.floor(num(s.gold,40,0,1e9)), prov:num(s.prov,100,0,100), hull:num(s.hull,100,1,100), inst, done, ship,
    ink:Array.isArray(s.ink)? s.ink.filter(pt) : [], visited:Array.isArray(s.visited)? s.visited.filter(pt).slice(-3000) : [], worlds:Math.floor(num(s.worlds,0,0,1e6)),
    log:Array.isArray(s.log)? s.log.filter(e=>e && Number.isFinite(e.d) && typeof e.t==='string').slice(0,40) : [], landed:(s.landed && typeof s.landed==='object' && !Array.isArray(s.landed))? Object.fromEntries(Object.keys(s.landed).filter(k=>/^\d+$/.test(k)).map(k=>[k,1])) : {}, day:num(s.day,0,0,1e7),
    learned:(s.learned && typeof s.learned==='object')? Object.fromEntries(Object.entries(s.learned).filter(([k,v])=>/^\d+$/.test(k) && +k<12 && v && Number.isFinite(v.x) && Number.isFinite(v.y))) : {}, allow:s.allow!==false,
    reefInk:(s.reefInk && typeof s.reefInk==='object')? Object.fromEntries(Object.entries(s.reefInk).filter(([k,v])=>/^\d+$/.test(k) && pt(v))) : {},
    sold:(s.sold && typeof s.sold==='object')? Object.fromEntries(Object.entries(s.sold).filter(([k,v])=>/^\d+$/.test(k) && ['ok','wreck','sea'].includes(v))) : {},
    rivalDone:(s.rivalDone && typeof s.rivalDone==='object')? Object.fromEntries(Object.keys(s.rivalDone).filter(k=>/^\d+$/.test(k)).map(k=>[k,1])) : {}, routes:Math.floor(num(s.routes,0,0,100)), soundings:Array.isArray(s.soundings)? s.soundings.filter(q=>Array.isArray(q)&&q.length===3&&q.every(Number.isFinite)).slice(-200) : [], rep:Math.floor(num(s.rep,0,-99,999))};
}
const persist=()=>{ RH.save('mapmaker', S); RH.progress('mapmaker', Object.keys(S.done).length/COMS.length); };
let land, islands, coast, port, currents, reefs, rng, names;
function noise2(r){ const N=24; const g=[...Array(N*N)].map(()=>r()); const f=(x,y)=>{ const X=Math.floor(x), Y=Math.floor(y), fx=x-X, fy=y-Y; const v=(i,j)=>g[((Y+j)%N+N)%N*N+((X+i)%N+N)%N]; const s=t=>t*t*(3-2*t); return (v(0,0)*(1-s(fx))+v(1,0)*s(fx))*(1-s(fy))+(v(0,1)*(1-s(fx))+v(1,1)*s(fx))*s(fy); }; return (x,y)=>f(x,y)*0.6+f(x*2.1,y*2.1)*0.3+f(x*4.3,y*4.3)*0.1; }
function buildWorld(seed){
  rng=RH.rng(seed); const n=noise2(rng);
  const centers=[...Array(9)].map((_,i)=>({x:rng.range(120,WX-120), y:rng.range(110,WY-110), r:rng.range(60,150)*(i===0?1.2:1)}));
  centers[0].x=220; centers[0].y=WY/2+rng.range(-100,100);
  land=new Uint8Array(GW*GH);
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++){ const wx=x*CELL, wy=y*CELL; let h=-0.55; for (const c of centers){ const d=Math.hypot(wx-c.x,wy-c.y)/c.r; h+=Math.max(0,1-d*d)*0.9; } h+= (n(wx/90,wy/90)-0.5)*0.9; if (x<4||y<4||x>GW-5||y>GH-5) h=-1; land[y*GW+x]= h>0?1:0; }
  // islands by flood fill
  const lab=new Int32Array(GW*GH).fill(-1); islands=[];
  for (let i=0;i<GW*GH;i++) if (land[i]&&lab[i]<0){ const st=[i]; lab[i]=islands.length; const cells=[]; while(st.length){ const j=st.pop(); cells.push(j); const x=j%GW,y=(j/GW)|0; for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const X=x+dx,Y=y+dy; if(X<0||Y<0||X>=GW||Y>=GH) continue; const k=Y*GW+X; if(land[k]&&lab[k]<0){ lab[k]=islands.length; st.push(k);} } } islands.push({cells}); }
  islands=islands.filter(is=>is.cells.length>=12);
  // remove tiny islets from land
  const keep=new Set(islands.flatMap(is=>is.cells)); for (let i=0;i<GW*GH;i++) if (land[i]&&!keep.has(i)) land[i]=0;
  for (const is of islands){ is.coast=[]; let sx=0,sy=0; for (const j of is.cells){ const x=j%GW,y=(j/GW)|0; sx+=x; sy+=y; if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>!land[(y+dy)*GW+x+dx])) is.coast.push([x*CELL+CELL/2,y*CELL+CELL/2]); } is.cx=sx/is.cells.length*CELL; is.cy=sy/is.cells.length*CELL; }
  // home island = the one nearest centers[0]
  islands.sort((a,b)=>Math.hypot(a.cx-centers[0].x,a.cy-centers[0].y)-Math.hypot(b.cx-centers[0].x,b.cy-centers[0].y));
  const home=islands[0]; const rest=islands.slice(1).sort((a,b)=>b.coast.length-a.coast.length); islands=[home,...rest];
  const pre=['Isle of','Cape','Saint','Las','Mount','The','Port']; const nm=['Sorrow','Gannets','Tamsin','Velas','Brume','Cinders','Margery','Thorn','Abel','Quiet','Hollow','Ember','Lantern','Saltmarsh'];
  islands.forEach((is,i)=>{ is.name = i===0? 'Home Isle' : rng.pick(pre)+' '+nm[(i*5+rng.int(3))%nm.length]; is.id=i; });
  // port: home coast point facing east
  const pc=home.coast.slice().sort((a,b)=>b[0]-a[0])[Math.floor(home.coast.length*0.05)]; port={x:pc[0]+12, y:pc[1]};
  while (isLand(port.x,port.y)) port.x+=5;
  // currents: coarse grid of vectors
  currents=[...Array(12)].map(()=>({x:rng.range(-4.5,4.5), y:rng.range(-3.5,3.5)}));
  // reefs near island 2 or 3
  reefs=[]; const ri=islands[Math.min(3,islands.length-1)]; for (let k=0;k<26;k++){ const c=rng.pick(ri.coast); const a=rng()*7, d=rng.range(10,30); const x=c[0]+Math.cos(a)*d, y=c[1]+Math.sin(a)*d; if (!isLand(x,y)) reefs.push({x,y}); }
  ri.reefy=true;
  hashCoast();
}
const isLand=(x,y)=>{ const X=Math.floor(x/CELL), Y=Math.floor(y/CELL); if(X<0||Y<0||X>=GW||Y>=GH) return true; return land[Y*GW+X]===1; };
const currentAt=(x,y)=> currents[Math.max(0,Math.min(3,Math.floor(x/WX*4)))+4*Math.max(0,Math.min(2,Math.floor(y/WY*3)))];

// ===================== Instruments =====================
const INST=[
  {k:'compass', n:'Brass compass', d:'Heading to within ±6°.', cost:0},
  {k:'log', n:'Log line', d:'Measures your speed through the water, so dead reckoning drifts less.', cost:40},
  {k:'quadrant', n:'Quadrant', d:'Take a fix on latitude (north–south) from the sun. Rough.', cost:70},
  {k:'fineCompass', n:'Azimuth compass', d:'Heading to within ±1.5°.', cost:90},
  {k:'telescope', n:'Telescope', d:'The lookout sees 50% farther.', cost:110},
  {k:'sextant', n:'Sextant', d:'Fixes latitude very precisely.', cost:160},
  {k:'copper', n:'Copper sheathing', d:'Reefs and groundings do half damage.', cost:120},
  {k:'chronometer', n:'Marine chronometer', d:'Fix longitude (east–west) too. The great prize of navigation.', cost:300},
];
const has=(k)=>!!S.inst[k];

// ===================== Commissions =====================
const COMS=[
  {n:'Home Waters', d:'Chart 60% of Home Isle\'s coast.', reward:40, test:()=>acc(0)>=60, prog:()=>`${acc(0)|0}%`},
  {n:'The Neighbour', d:'Chart 50% of the nearest other island.', reward:60, test:()=>acc(nearest())>=50, prog:()=>`${islands[nearest()].name}: ${acc(nearest())|0}%`},
  {n:'Two Islands', d:'Chart two islands besides home, 50% each.', reward:70, test:()=>others().filter(i=>acc(i)>=50).length>=2, prog:()=>`${others().filter(i=>acc(i)>=50).length}/2`},
  {n:'The Reef', d:'Chart 55% of the reef-ringed island without taking more than 30 hull damage in one voyage.', reward:110, test:()=>acc(reefIsle())>=55 && S.reefOk, prog:()=>`${islands[reefIsle()].name}: ${acc(reefIsle())|0}%`},
  {n:'Circumnavigation', d:'Chart 85% of any island other than home.', reward:120, test:()=>others().some(i=>acc(i)>=85), prog:()=>`best ${Math.max(0,...others().map(acc))|0}%`},
  {n:'The Far Isle', d:'Chart 50% of the island farthest from port.', reward:150, test:()=>acc(farthest())>=50, prog:()=>`${islands[farthest()].name}: ${acc(farthest())|0}%`},
  {n:'The Island That Isn\'t There', d:'An old chart shows an island at the marked spot. Sail within 40 miles of it and confirm it doesn\'t exist.', reward:90, test:()=>S.ghostSeen, prog:()=>S.ghostSeen?'confirmed':'unvisited'},

// A rival hydrographer works the same islands. Each commission after the first has a day by which he will deliver it; after that the Admiralty pays you half.
const RIVAL='Captain Delacroix';
const rivalDay=(i)=> i===0? 1e9 : 20+i*25;
const reefsMarked=()=>Object.keys(S.reefInk).length;
const payFor=(i)=> S.rivalDone[i]? Math.round(COMS[i].reward/2) : COMS[i].reward;
const nearest=()=>{ let b=Math.min(1,islands.length-1), bd=1e9; for (let i=1;i<islands.length;i++){ const d=Math.hypot(islands[i].cx-port.x,islands[i].cy-port.y); if (d<bd){ bd=d; b=i; } } return b; };

// accuracy: how much of the true coast is inked (recall), discounted by stray ink near that island that matches no coast (precision).

let inkHash=new Map(), accCache={}, accDirty=true, precCache=null;
const TOL=14, STRAY=1.5*TOL, NEAR_ISLE=70, PREC_W=0.5;
function hashInk(){ inkHash=new Map(); precCache=null; for (const [x,y] of S.ink){ const k=((x/TOL)|0)+','+((y/TOL)|0); (inkHash.get(k)||inkHash.set(k,[]).get(k)).push([x,y]); } accDirty=true; }
function near(x,y){ const cx=(x/TOL)|0, cy=(y/TOL)|0; for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){ const l=inkHash.get((cx+dx)+','+(cy+dy)); if (l) for (const p of l) if ((p[0]-x)**2+(p[1]-y)**2<TOL*TOL) return true; } return false; }
let coastHash=new Map();
function hashCoast(){ coastHash=new Map(); for (const is of islands) for (const [x,y] of is.coast){ const k=((x/NEAR_ISLE)|0)+','+((y/NEAR_ISLE)|0); (coastHash.get(k)||coastHash.set(k,[]).get(k)).push([x,y,is.id]); } }
// nearest true coast point to (x,y) within NEAR_ISLE: [distance, island id] or null
function nearestCoast(x,y){ const cx=(x/NEAR_ISLE)|0, cy=(y/NEAR_ISLE)|0; let bd=NEAR_ISLE*NEAR_ISLE, bi=-1; for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){ const l=coastHash.get((cx+dx)+','+(cy+dy)); if (l) for (const p of l){ const d=(p[0]-x)**2+(p[1]-y)**2; if (d<bd){ bd=d; bi=p[2]; } } } return bi<0? null : [Math.sqrt(bd), bi]; }

// ===================== Sound: wood, rope, bell and wax =====================
const T_=(o)=>{ try { FX.tone(o); } catch(e){} };
let quillT=0;
// every event sound is gentle and rate-limited: at most once every few seconds per kind, never looping
const lastV={};
const gated=(name,gap,fn)=>(...a)=>{ const n=performance.now(); if (n-(lastV[name]||-1e9)<gap*1000) return; lastV[name]=n; fn(...a); };
const VOICE={
  quill:()=>{ const n=performance.now(); if (n-quillT<260) return; quillT=n; T_({noise:1,f:5600+Math.random()*1500,q:3,dur:.05,vol:.025}); },
  bell:gated('bell',4,()=>{ for (const dl of [0,.55]){ T_({f:740,type:'sine',dur:1.4,vol:.09,delay:dl}); T_({f:1860,type:'sine',dur:.5,vol:.025,delay:dl}); } }),
  seal:()=>{ T_({f:80,f2:45,type:'sine',dur:.3,vol:.3}); for (let i=0;i<6;i++) T_({noise:1,f:3000+i*300,q:4,dur:.025,vol:.04,delay:.12+i*.05}); },
  squall:gated('squall',8,()=>T_({noise:1,f:500,q:.4,dur:2.6,vol:.06,attack:.8})),
  surf:gated('surf',4,()=>{ T_({noise:1,f:900,q:.5,dur:1.2,vol:.05,attack:.3}); T_({f:330,type:'triangle',dur:.3,vol:.04,delay:.6}); }),
  creak:gated('creak',3,()=>T_({f:140,f2:95,type:'triangle',dur:.2,vol:.025})),
  thump:gated('thump',3,()=>T_({f:95,f2:70,type:'triangle',dur:.12,vol:.07})), // one muffled wooden knock
  call:gated('call',3,()=>T_({f:520,f2:460,type:'triangle',dur:.18,vol:.04})),
};
// ===================== Ship's log =====================
function logE(t){ S.log.unshift({d:Math.floor(S.day)+1, t}); if (S.log.length>40) S.log.pop(); renderLog(); }
function renderLog(){ const el=document.getElementById('log'); if (el) el.innerHTML = S.log.length? S.log.map(e=>`<div><b>Day ${e.d}.</b> ${e.t}</div>`).join('') : '<div>The log is empty. Weigh anchor.</div>'; }
const DIRS=['east','south-east','south','south-west','west','north-west','north','north-east'];
const dirOf=(dx,dy)=> DIRS[((Math.round(Math.atan2(dy,dx)/(Math.PI/4))%8)+8)%8];
// ===================== Landfall =====================
// heave to near an island you have not visited and send a boat ashore: water, trade, or a sure position
function landfallIsle(){ if (!ship || ship.sail || fixing>0 || atPort) return -1; let best=-1, bd=26;
  for (const is of islands){ if (is.id===0 || S.landed[is.id]) continue; if (Math.hypot(is.cx-ship.x,is.cy-ship.y)>400) continue; for (const [x,y] of is.coast){ const d=Math.hypot(x-ship.x,y-ship.y); if (d<bd){ bd=d; best=is.id; } } }
  return best; }
function goAshore(){ const i=landfallIsle(); if (i<0) return null; const is=islands[i]; S.landed[i]=1; S.prov=Math.min(100,S.prov+25); const roll=rng(); let what;
  if (roll<0.4){ S.gold+=15; what=`traded with the people of ${is.name}: fresh water and 15 gold`; }
  else if (roll<0.7){ S.prov=Math.min(100,S.prov+15); what=`found a spring and fruit trees on ${is.name}. The casks are full`; }
  else { ship.bx=ship.x; ship.by=ship.y; what=`a hermit on ${is.name} told us exactly where we are`; }
  VOICE.surf(); logE(`Went ashore. We ${what}.`); RH.toast(`Landfall on ${is.name}.`); persist(); renderAll(); return what; }
// ===================== Squalls =====================
let squallT=75;
function squall(){ currents=currents.map(()=>({x:rng.range(-5,5), y:rng.range(-4,4)})); if (ship.sail===2) damage(5,'The squall caught us under full sail and carried away a spar.'); const c=currentAt(ship.x,ship.y); compassBias=rng.range(-1,1); speedBias=rng.range(-1,1);
  VOICE.squall(); FX.shake(0.3); logE(`A squall. The current here now sets to the ${dirOf(c.x,c.y)}. Our reckoning is worth less than it was.`); RH.toast('A squall! The currents have turned.'); }

// ===================== Navigation: only what the master can know =====================
const cellOf=(x,y)=> Math.min(3,Math.max(0,Math.floor(x/WX*4)))+4*Math.min(2,Math.max(0,Math.floor(y/WY*3)));
let lastDrift=null, nav={dist:0,t:0,cells:{}}, fogT=0, weatherT=60, pendingFix=null, bearingFx=null, doubtWarned=false;
// estimated error of the reckoning, from what was sailed since the last fix (never from the true position)
function estErr(){ const lc=S.learned[cellOf(ship.bx,ship.by)]; return 3 + nav.dist*(has('log')?0.03:0.07) + nav.t*(lc && S.allow? 0.9 : 3); }
// a fix: compare where we reckoned we were with where we are, and learn the current (set and drift) from the difference
const perDay=(v)=>v*6; // current: miles per second of sailing -> miles per day (a day is six seconds at sea)
function fixAt(x,y,how){ const dx=x-ship.bx, dy=y-ship.by, off=Math.hypot(dx,dy), days=nav.t/6;
  let msg= off<3? `${how}. We were where we reckoned.` : `${how}. The current carried us ${Math.round(off)} miles ${dirOf(dx,dy)}${days>=0.5?` in ${days.toFixed(1)} days`:''}.`;
  if (how.startsWith('Bearings')){ S.tutFix=1; if (tutShown[2]) tutShown[2].fixOk=true; }
  if (off>=3 && nav.t>2) lastDrift={from:[ship.bx,ship.by], to:[x,y], off, dir:dirOf(dx,dy), days, t:performance.now()};
  if (off>=3 && nav.t>6 && !S.explained){ S.explained=1; setTimeout(()=>RH.modal(`<h2>Where we thought we were</h2><p><b>Dead reckoning</b> is where you think you are, worked out from speed, heading and time. <b>Currents</b> push the ship sideways without you feeling it, so the reckoning drifts away from the truth.</p><p>A fix tells you where you really are. On the chart the hollow ship is where you reckoned you were, the solid one is where you are, and the arrow is what the current did. Turn on <b>Allow for current</b> and the reckoning adds that current from now on.</p>`,[{label:'Understood'}]),300); }

// the nearest mark on YOUR chart to a real coast feature: the landmark you would recognise and take a bearing on
function inkNear(x,y,r){ const cx=(x/TOL)|0, cy=(y/TOL)|0; let best=null, bd=r*r; for (let dy=-2;dy<=2;dy++) for (let dx=-2;dx<=2;dx++){ const l=inkHash.get((cx+dx)+','+(cy+dy)); if (l) for (const p of l){ const d=(p[0]-x)**2+(p[1]-y)**2; if (d<bd){ bd=d; best=p; } } } return best; }

// Heave the lead: the depth says how near rock or shore is. Close to a reef, the leadsman's call marks it on the chart, fog or no fog.
function sound(){ if (atPort) return null; let dl=1e9; for (let r=2;r<120;r+=3){ for (let a=0;a<6.3;a+=0.3) if (isLand(ship.x+Math.cos(a)*r, ship.y+Math.sin(a)*r)){ dl=r; break; } if (dl<1e9) break; }

// ===================== Ship =====================
let ship;
function newShip(){ return {x:port.x, y:port.y, bx:port.x, by:port.y, h:0, sail:0, voyageDmg:0}; }
let target=null, fixing=0, ghost;
function sightR(){ return (has('telescope')? 135 : 90)*(fogT>0? 0.5 : 1); }
let simClock=0; // game seconds, for pacing the tutorial
function step(dt){ simClock+=dt;

  let v=[0,14,28][ship.sail]; if (!v) return;

  ship.bx += (Math.cos(ship.h)*v*(1+speedBias*verr) + (lc? lc.x : 0))*dt; ship.by += (Math.sin(ship.h)*v*(1+speedBias*verr) + (lc? lc.y : 0))*dt;
  nav.dist+=v*dt; nav.t+=dt; { const ce=cellOf(ship.bx,ship.by); nav.cells[ce]=(nav.cells[ce]||0)+dt; }

    if (fogT<=0){ let a=Math.atan2(r.y-ship.y,r.x-ship.x)-trueH; a=Math.atan2(Math.sin(a),Math.cos(a)); const side= Math.abs(a)<0.5? 'ahead' : a>0? 'to starboard' : 'to port'; RH.toast(`Breakers ${side}!`); logE(`Breakers ${side}: a reef just under the water.`); VOICE.call(); }
    else if (d<22){ RH.toast(`The lead: ${Math.max(2,Math.round(d/4))} fathoms and shoaling!`); VOICE.call(); } });
  for (const r of reefs) if (Math.hypot(r.x-ship.x,r.y-ship.y)<5 && !r.hitT){ r.hitT=3; damage(14,'We touched a reef. Some planking is sprung.'); }
  if (fogT<=0) reefs.forEach((r,k)=>{ if (!S.reefInk[k] && Math.hypot(r.x-ship.x,r.y-ship.y)<sightR()*0.45){ S.reefInk[k]=[Math.round(r.x+ship.bx-ship.x),Math.round(r.y+ship.by-ship.y)]; } });
