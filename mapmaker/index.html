<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapmaker of Lost Islands</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  /* A 1680 chart room: walnut desk, vellum leaves, iron-gall ink, verdigris and sealing wax */
  :root{--vellum:#eadbb4;--vellum2:#dcc898;--ink:#2e2015;--ink2:#5a4630;--verd:#3f7f6a;--wax:#9c1f1a;--brass:#b58a3c;--wood:#3b2414;
    font-family:"IM Fell English",Georgia,serif}
  html,body{background:var(--wood);color:var(--ink)}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;
    background:repeating-linear-gradient(92deg,#3b2414 0 7px,#432a17 7px 9px,#36200f 9px 15px,#3f2615 15px 22px),var(--wood)}
  .topbar{background:linear-gradient(#2a180c,#1f1208);border-bottom:2px solid #120a04;color:#e9d9b0}
  .topbar h1{font-family:"IM Fell English SC",serif;font-size:20px;font-weight:400;letter-spacing:.06em;color:#f0e2bc}
  .topbar .home,.topbar .rh-like{color:#cdb88a;font-style:italic}
  #tot{color:#cdb88a;font-style:italic;font-size:14px}
  button{font-family:"IM Fell English",serif;font-size:15px;color:#2e2015;background:linear-gradient(#f1e4c3,#d8c290);border:1px solid #7a5c32;border-radius:3px;box-shadow:inset 0 1px 0 #fff8,0 2px 0 #6b4e28;min-height:34px;padding:3px 10px}
  button:hover:not(:disabled){border-color:var(--wax)}
  button:focus-visible{outline:2px solid var(--wax);outline-offset:2px}
  button:disabled{opacity:.5}
  button.on{background:linear-gradient(#3f7f6a,#2c5c4c);color:#f0e2bc;border-color:#1d3d33}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0}
  #chart{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
  #chart.drag{cursor:grabbing}
  .pz-bar{right:12px;bottom:12px;flex-direction:column;gap:6px} .pz-bar button{width:40px;height:40px;padding:0;font-size:22px;line-height:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d48a,#b58a3c 60%,#7a5a24);border:1px solid #5e4418;color:#2e2015;opacity:.95}
  #note{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#f4e7c6ee;border:1px solid #7a5c32;padding:5px 12px;font-style:italic;font-size:16px;box-shadow:0 3px 10px #0006;pointer-events:none;transition:opacity .4s;max-width:calc(100% - 30px);text-align:center}
  /* the desk: vellum leaves of the chart-room ledger */
  #side{width:370px;background:linear-gradient(90deg,#c9b383 0,#eadbb4 14px,#eadbb4);border-left:3px solid #1f1208;overflow:auto;padding:12px 14px 18px 22px;display:flex;flex-direction:column;gap:12px;color:var(--ink);box-shadow:inset 12px 0 18px -10px #6b4e28}
  h3{margin:0 0 4px;font-family:"IM Fell English SC",serif;font-weight:400;font-size:19px;letter-spacing:.04em}
  .sheetName{font-family:"IM Fell English SC",serif;font-size:24px;line-height:1.05}
  .hint{font-style:italic;font-size:15px;color:var(--ink2)}
  .purse{display:flex;justify-content:space-between;font-size:15px;border-top:1px solid #a88b5a;border-bottom:1px solid #a88b5a;padding:4px 0}
  .tabs{display:flex;flex-wrap:wrap;gap:4px}
  .tabs button{font-size:14px;padding:2px 8px;min-height:36px;border-radius:2px 2px 0 0}
  .tabs button .st{font-size:12px;margin-left:3px}
  .tabs button.sel{background:#fbf2da;border-bottom-color:#fbf2da;box-shadow:none;font-weight:700}
  .tabs button.struck{text-decoration:line-through;color:#7a5c32}
  .page{background:#fbf2da;border:1px solid #a88b5a;padding:8px 10px;box-shadow:inset 0 0 18px #d8c29066;font-size:14.5px;line-height:1.35}
  .page .cap{font-family:"IM Fell English SC",serif;font-size:17px}
  .entries{max-height:190px;overflow:auto;font-style:italic;color:var(--ink2);margin:6px 0;border-top:1px dotted #a88b5a;border-bottom:1px dotted #a88b5a;padding:2px 0}
  .entries div{padding:1px 0} .entries b{font-style:normal;color:var(--ink);font-weight:400}
  .entries .sight{color:#6a2a10} .entries .off{text-decoration:line-through;opacity:.55}
  .ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
  .ctrl .lbl{font-size:14px;min-width:66px}
  .needle{min-width:84px;text-align:center;font-size:15px}
  .status{font-size:14.5px;margin-top:4px}
  .status.ok{color:var(--verd)} .status.bad{color:var(--wax)}
  .agree{height:7px;border:1px solid var(--ink2);background:#f4ead0;margin-top:3px} .agree i{display:block;height:100%;background:linear-gradient(90deg,#3f7f6a,#c9a040,#9c1f1a)}
  .feats{display:flex;flex-direction:column;gap:2px;font-size:14.5px}
  .feat{display:grid;grid-template-columns:22px 1fr auto auto;gap:6px;align-items:center;border-bottom:1px dotted #c4aa78;padding:2px 0}
  .feat input{width:18px;height:18px;accent-color:#9c1f1a}
  .feat .d{font-size:13px;color:var(--ink2);font-style:italic}
  .feat button{font-size:13px;min-height:30px;padding:1px 6px}
  .feat.warn .n::after{content:" ⚠";color:var(--wax)}
  #publish{font-family:"IM Fell English SC",serif;font-size:19px;padding:8px 14px;background:radial-gradient(circle at 35% 30%,#d24a3c,#9c1f1a 55%,#6a120e);color:#f7e8c8;border-color:#5e0f0b;box-shadow:inset 0 1px 0 #fff4,0 3px 0 #4a0c09}
  .sheets{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
  .sheets button{min-height:40px;font-size:15px;padding:2px}
  .sheets button.cur{outline:2px solid var(--wax)}
  .sheets .s{display:block;font-size:10px;color:var(--wax);line-height:1}
  .res{background:#fbf2da;border:1px solid #9c1f1a;padding:8px 10px;font-size:15px}
  .res table{width:100%;border-collapse:collapse;font-size:14px} .res td{padding:1px 2px;border-bottom:1px dotted #c4aa78} .res td:last-child{text-align:right}
  .modal{background:linear-gradient(#f1e4c3,#e3d1a4);color:var(--ink);border:1px solid #7a5c32;border-radius:2px;font-family:"IM Fell English",serif;box-shadow:0 10px 40px #000a}
  .modal h2{font-family:"IM Fell English SC",serif;font-weight:400} .modal .modal-actions{background-color:#e3d1a4}
  .toast{background:#f1e4c3;color:var(--ink);border:1px solid #7a5c32;border-radius:2px;font-family:"IM Fell English",serif;font-style:italic;box-shadow:0 4px 14px #0008}
  #sealFx{position:absolute;left:50%;top:44%;width:170px;height:170px;margin:-85px 0 0 -85px;pointer-events:none;display:none}
  #sealFx.on{display:block;animation:press 2.4s ease-out forwards}
  @keyframes press{0%{transform:scale(2.6) rotate(-30deg);opacity:0}18%{transform:scale(.92) rotate(-8deg);opacity:1}24%{transform:scale(1.04) rotate(-10deg)}30%{transform:scale(1) rotate(-10deg)}80%{opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){#sealFx.on{animation:none;opacity:1}}
  @media (max-width:760px){
    body{height:100dvh} .topbar{padding:4px 10px} .topbar h1{font-size:15px;white-space:nowrap} #tot{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
    main{flex-direction:column}
    #stage{flex:none;height:52dvh}
    #side{width:auto;flex:1;min-height:0;border-left:0;border-top:3px solid #1f1208;padding:10px 12px 20px;box-shadow:inset 0 12px 18px -10px #6b4e28}
    .entries{max-height:150px} #note{font-size:14px;top:6px}
  }
  @media (max-height:500px) and (min-width:600px){ body{height:100dvh} .topbar{padding:2px 10px} #side{width:330px} }
</style>
</head>

<script id="mapsim">
// MapSim: the chart room as a pure, seeded model. Truth (islands, reefs, a current) makes ship's logs; the player's corrections
// turn logs into rays; rays cross into landmarks with a doubt ring; merchants sail the published chart against the truth.
const MapSim = (() => {
  const WX = 100, WY = 70, D = Math.PI / 180, POINT = 11.25;
  function hash(s) { s = String(s); let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  const rngOf = (seed) => { let a = (typeof seed === 'number' ? seed : hash(seed)) >>> 0;
    const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    f.int = n => Math.floor(f() * n); f.range = (lo, hi) => lo + f() * (hi - lo); f.pick = a => a[Math.floor(f() * a.length)]; f.gauss = () => { let s = 0; for (let i = 0; i < 6; i++) s += f(); return (s - 3) / 0.7071; }; return f; };
  const shuffle = (arr, r) => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
  const dirOf = (b) => [Math.sin(b * D), -Math.cos(b * D)];
  const brg = (dx, dy) => ((Math.atan2(dx, -dy) / D) % 360 + 360) % 360;
  const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
  // ---- names ----
  const ISLES = ['Isla Verde', 'Sorrow Isle', 'Bastion Key', 'The Anvil', 'Gull Island', 'Saint Brendan', 'Isle of Ash', 'Grey Friar', 'Cormorant Rock', 'Mercy Isle', 'Black Hen', 'Tortuga Chica'];
  const CAPES = ['North Point', 'Cape Fortune', 'Cape Sorrow', 'Gannet Head', 'Ram Head', 'Cape Lantern', 'Bishop Point', 'Cape Deliverance', 'Long Nose', 'Cape Ember', 'Raven Point', 'Cape Hope', 'Dead Man\'s Head', 'Cape Clement', 'Saddle Point', 'Cape Thorn', 'Gallows Point', 'Seal Head', 'Cape Mercy', 'Tern Point', 'Cape Grace', 'Wolf Point', 'Cape Vigil', 'Kestrel Head'];
  const REEFS = ['the Teeth', 'the Widow\'s Reef', 'Hen and Chickens', 'the Sunken Bell', 'the Graves', 'Shark Ledge'];
  const CAPTAINS = ['Capt. Aldous Penn', 'Capt. Mary Rowe', 'Capt. Josiah Crane', 'Capt. Lucas Vane', 'Capt. Ines Ferro', 'Capt. Thos. Gale', 'Capt. Hendrik Dorn', 'Capt. Abel Swift', 'Capt. Ruth Marlowe', 'Capt. Silas Grey', 'Capt. Tobias Kell', 'Capt. Anne Pryor'];

  // ---- geometry ----
  function smooth(pts, n = 8) { const out = [], N = pts.length; for (let i = 0; i < N; i++) { const p0 = pts[(i - 1 + N) % N], p1 = pts[i], p2 = pts[(i + 1) % N], p3 = pts[(i + 2) % N];
      for (let k = 0; k < n; k++) { const t = k / n, t2 = t * t, t3 = t2 * t; out.push([0.5 * ((2 * p1[0]) + (-p0[0] + p2[0]) * t + (2 * p0[0] - 5 * p1[0] + 4 * p2[0] - p3[0]) * t2 + (-p0[0] + 3 * p1[0] - 3 * p2[0] + p3[0]) * t3), 0.5 * ((2 * p1[1]) + (-p0[1] + p2[1]) * t + (2 * p0[1] - 5 * p1[1] + 4 * p2[1] - p3[1]) * t2 + (-p0[1] + 3 * p1[1] - 3 * p2[1] + p3[1]) * t3)]); } } return out; }
  function inPoly(p, poly) { let c = false; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) { const a = poly[i], b = poly[j]; if ((a[1] > p[1]) !== (b[1] > p[1]) && p[0] < (b[0] - a[0]) * (p[1] - a[1]) / (b[1] - a[1]) + a[0]) c = !c; } return c; }
  function segDist(p, a, b) { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy || 1; const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy); }
  function polyDist(p, poly) { let d = 1e9; for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) d = Math.min(d, segDist(p, poly[j], poly[i])); return inPoly(p, poly) ? -d : d; }
  // ---- the truth of a sheet ----
  function gen(spec, seed) {
    const r = rngOf('sheet:' + seed), T = { seed, ports: [], isles: [], reefs: [], feats: {}, current: [0, 0] };
    const portAt = (side) => side === 'W' ? [2, r.range(14, 56)] : side === 'E' ? [98, r.range(14, 56)] : side === 'N' ? [r.range(20, 80), 2] : [r.range(20, 80), 68];
    const PN = { W: 'Port Royal', E: 'Santa Cruz', N: 'Fort Hollis', S: 'Port Mercy' };
    for (const s of spec.ports) T.ports.push({ name: PN[s], side: s, p: portAt(s) });
    const usedC = new Set(), names = rngOf('names:' + seed);
    const isleNames = shuffle([...ISLES], names), capeNames = shuffle([...CAPES], names), reefNames = shuffle([...REEFS], names);
    for (let k = 0; k < spec.isles; k++) {
      // islands sit across the trade lanes, so a chart that is wrong about them costs ships
      const rts = spec.routes || [[0, 1]];
      let c; for (let t = 0; t < 400; t++) { const rt = rts[(k + t) % rts.length], a = T.ports[rt[0]].p, b = T.ports[rt[1]].p, u = r.range(0.3, 0.7), L = dist(a, b), nx = -(b[1] - a[1]) / L, ny = (b[0] - a[0]) / L, off = r.range(-5, 5);
        c = [a[0] + (b[0] - a[0]) * u + nx * off, a[1] + (b[1] - a[1]) * u + ny * off];
        if (c[0] > 22 && c[0] < 78 && c[1] > 15 && c[1] < 55 && T.isles.every(o => dist(o.c, c) > o.R + 20) && T.ports.every(p => dist(p.p, c) > 22)) break; }
      const R = r.range(6, 9.5) * (spec.small ? 0.8 : 1), n = 4 + r.int(spec.isles > 1 ? 2 : 3), a0 = r() * 6.283, caps = [];
      for (let i = 0; i < n; i++) { const a = a0 + i / n * 6.283 + r.range(-0.25, 0.25), rr = R * r.range(0.8, 1.25); caps.push({ p: [c[0] + Math.sin(a) * rr, c[1] - Math.cos(a) * rr] }); }
      const isle = { name: isleNames[k], c, R, caps: [], poly: null };
      caps.forEach((cp, i) => { const nm = capeNames.pop(); const f = { name: nm, kind: 'cape', isle: k, order: i, p: cp.p }; isle.caps.push(f); T.feats[nm] = f; });
      isle.poly = smooth(isle.caps.map(f => f.p)); T.isles.push(isle);
    }
    // reefs lie where trade would cross them
    for (let k = 0; k < (spec.reefs || 0); k++) { let p; for (let t = 0; t < 400; t++) { const a = T.ports[r.int(T.ports.length)].p, b = T.ports[(r.int(T.ports.length - 1) + 1 + T.ports.indexOf(T.ports.find(q => q.p === a))) % T.ports.length].p, u = r.range(0.3, 0.7); p = [a[0] + (b[0] - a[0]) * u + r.range(-6, 6), a[1] + (b[1] - a[1]) * u + r.range(-6, 6)];
        if (T.isles.every(i => polyDist(p, i.poly) > 4) && T.reefs.every(q => dist(q.p, p) > 10) && p[0] > 12 && p[0] < 88 && p[1] > 8 && p[1] < 62) break; }
      const nm = reefNames.pop(); const f = { name: nm, kind: 'reef', p }; T.reefs.push(f); T.feats[nm] = f; }
    if (spec.current) { const a = r() * 360, m = spec.current; T.current = [Math.sin(a * D) * m, -Math.cos(a * D) * m]; }
    T.land = (p) => T.isles.some(i => inPoly(p, i.poly));
    return T;
  }
  // ---- sailing: A* on a one-league grid around whatever is believed to be in the way ----
  function maskOf(blocked) { const GX = WX + 1, GY = WY + 1, m = new Uint8Array(GX * GY); for (let y = 0; y < GY; y++) for (let x = 0; x < GX; x++) m[y * GX + x] = blocked([x, y]) ? 1 : 0; return m; }
  function plan(a, b, blocked) {
    const GX = WX + 1, GY = WY + 1, N = GX * GY, g = new Float32Array(N).fill(1e9), from = new Int32Array(N).fill(-1), done = new Uint8Array(N);
    const key = (x, y) => y * GX + x, sx = Math.round(a[0]), sy = Math.round(a[1]), tx = Math.round(b[0]), ty = Math.round(b[1]);
    const blk = typeof blocked === 'function' ? maskOf(blocked) : blocked.slice();
    for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) { const X = sx + dx, Y = sy + dy, X2 = tx + dx, Y2 = ty + dy; if (X >= 0 && Y >= 0 && X < GX && Y < GY) blk[key(X, Y)] = 0; if (X2 >= 0 && Y2 >= 0 && X2 < GX && Y2 < GY) blk[key(X2, Y2)] = 0; }
    const open = [[Math.hypot(tx - sx, ty - sy), key(sx, sy)]]; g[key(sx, sy)] = 0;
    const push = (e) => { open.push(e); let i = open.length - 1; while (i > 0) { const p = (i - 1) >> 1; if (open[p][0] <= open[i][0]) break; [open[p], open[i]] = [open[i], open[p]]; i = p; } };
    const pop = () => { const top = open[0], last = open.pop(); if (open.length) { open[0] = last; let i = 0; for (;;) { const l = 2 * i + 1, rr = l + 1; let m = i; if (l < open.length && open[l][0] < open[m][0]) m = l; if (rr < open.length && open[rr][0] < open[m][0]) m = rr; if (m === i) break; [open[m], open[i]] = [open[i], open[m]]; i = m; } } return top; };
    open.length = 0; push([Math.hypot(tx - sx, ty - sy), key(sx, sy)]);
    let found = false;
    while (open.length) { const [, k] = pop(); if (done[k]) continue; done[k] = 1; const x = k % GX, y = (k / GX) | 0; if (x === tx && y === ty) { found = true; break; }
      for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) { if (!dx && !dy) continue; const X = x + dx, Y = y + dy; if (X < 0 || Y < 0 || X >= GX || Y >= GY) continue; const j = key(X, Y); if (blk[j] || done[j]) continue; const ng = g[k] + (dx && dy ? 1.4142 : 1); if (ng < g[j]) { g[j] = ng; from[j] = k; push([ng + Math.hypot(tx - X, ty - Y), j]); } } }
    if (!found) return null;
    const cells = []; for (let k = key(tx, ty); k >= 0; k = from[k]) cells.push([k % GX, (k / GX) | 0]); cells.reverse();
    // string-pull: keep only the turns a navigator would steer
    const clear = (p, q) => { const n = Math.ceil(dist(p, q) * 2); for (let i = 1; i < n; i++) { const t = i / n, X = Math.round(p[0] + (q[0] - p[0]) * t), Y = Math.round(p[1] + (q[1] - p[1]) * t); if (blk[key(X, Y)]) return false; } return true; };
    const path = [a.slice()]; let i = 0; while (i < cells.length - 1) { let j = cells.length - 1; while (j > i + 1 && !clear(cells[i], cells[j])) j--; path.push(cells[j].slice()); i = j; }
    path[path.length - 1] = b.slice(); return path;
  }
  // ---- ship's logs ----

  if (down && e && Math.hypot(e.clientX-down.x,e.clientY-down.y)<6 && performance.now()-down.t<600){ const r=hitRay(e); if (r && !published){ const s=st.logs[r.li], id=r.id; if (s.off[id]) delete s.off[id]; else s.off[id]=1; recompute(); renderPage(); renderFeats(); note(s.off[id]?`You strike out that sighting of ${r.f}.`:`You trust that sighting of ${r.f} again.`); }
    else { const h=hitTrack(e); if (h!==false && h!==sel){ sel=h; renderTabs(); renderPage(); dirty=true; } } }
  down=null; };
window.addEventListener('pointerup',endDrag); window.addEventListener('pointercancel',()=>{ dragging=null; down=null; });
document.getElementById('publish').onclick=publish;
window.addEventListener('resize',fitChart);
function loop(){ const animating= published && performance.now()-published.t0<4200; if (dirty||animating||dragging||(published&&published.sc.wrecks)){ dirty=false; drawChart(); } requestAnimationFrame(loop); }
// bots for the chart room. Each takes (M, S) and returns { st, est } ready to publish.
// The navigator: a competent chart-maker the game uses to set the daily target (and the tests use as the adaptive bot)
const NAV = {
  idle(M, S) { const st = M.newState(S); return { st, est: M.estimate(S, st, S.logs) }; },
  close(M, S) { const st = M.newState(S); closeAll(M, S, st, S.logs); return { st, est: M.estimate(S, st, S.logs) }; },
  closeStrike(M, S) { const st = M.newState(S); closeAll(M, S, st, S.logs); strikeOutliers(M, S, st, S.logs); return { st, est: M.estimate(S, st, S.logs) }; },
  competent(M, S, opt = {}) {
    const st = M.newState(S); let logs = S.logs.slice();
    const settle = () => { closeAll(M, S, st, logs); fixDev(M, S, st, logs); closeAll(M, S, st, logs); fixLost(M, S, st, logs); strikeOutliers(M, S, st, logs); fixLost(M, S, st, logs); dropPhantoms(M, S, st, logs); };
    settle();
    // commission surveys where a hazard near trade is unfixed or vague
    if (!opt.noSurvey) for (let k = 0; k < (opt.maxSurvey ?? 3); k++) {
      const est = M.estimate(S, st, logs); const need = Object.values(est).filter(e => e.on && (e.kind === 'cape' || e.kind === 'reef') && (!e.fixed || e.r > 4) && nearRoute(M, S, e) && !st.surveys.includes(e.f)).sort((a, b) => (b.fixed ? b.r : 99) - (a.fixed ? a.r : 99))[0];
      if (!need || st.spent + 10 > (opt.cash ?? 99)) break;
      const L = M.surveyLog(S, need.f, st.surveys.length); if (!L) break; logs.push(L); st.logs.push({ drift: [0, 0], dev: 0, struck: false, off: {} }); st.surveys.push(need.f); st.spent += 10; settle();
    }
    return { st, est: M.estimate(S, st, logs), logs };
  },
};
function nearRoute(M, S, e) { const pts = e.p ? [e.p] : e.rays.map(r => r.o); return S.routes.some(rt => { const a = S.T.ports[rt.from].p, b = S.T.ports[rt.to].p; return pts.some(p => { const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy; const t = Math.max(0, Math.min(1, ((p[0] - a[0]) * dx + (p[1] - a[1]) * dy) / L)); return Math.hypot(p[0] - a[0] - t * dx, p[1] - a[1] - t * dy) < 16; }); }); }
function closeAll(M, S, st, logs) { logs.forEach((L, i) => { if (L.to == null) return; const s = st.logs[i]; s.drift = [0, 0]; const tr = M.track(S, L, s), end = tr[tr.length - 1], port = S.T.ports[L.to].p; s.drift = [port[0] - end[0], port[1] - end[1]]; }); }
function totalRes(M, S, st, logs, only) { const est = M.estimate(S, st, logs); let s = 0, n = 0; for (const e of Object.values(est)) if (e.fixed) for (const r of e.rays) if (r.on && (only == null || r.li === only)) { s += Math.min(r.res, 8) ** 2; n++; } return n ? s / n : 99; }
function fixDev(M, S, st, logs) { for (let pass = 0; pass < 2; pass++) logs.forEach((L, i) => { if (L.to == null) return; const s = st.logs[i]; let best = s.dev, bv = 1e9, v0 = null; for (const d of [0, -1, 1, -2, 2]) { s.dev = d; if (L.to != null) { s.drift = [0, 0]; const tr = M.track(S, L, s), end = tr[tr.length - 1], port = S.T.ports[L.to].p; s.drift = [port[0] - end[0], port[1] - end[1]]; } const v = totalRes(M, S, st, logs, i); if (d === 0) { v0 = v; bv = v; best = 0; } else if (v < bv && v < 0.45 * v0 && v0 > 1.5) { bv = v; best = d; } } s.dev = best; if (L.to != null) { s.drift = [0, 0]; const tr = M.track(S, L, s), end = tr[tr.length - 1], port = S.T.ports[L.to].p; s.drift = [port[0] - end[0], port[1] - end[1]]; } }); }
function fixLost(M, S, st, logs) { logs.forEach((L, i) => { if (L.to != null) return; const s = st.logs[i];
  const cost = (d) => { s.drift = d; const tr = M.track(S, L, s); let v = 0; L.noons.forEach(nn => { const k = L.entries.findIndex(e => e.t >= nn.t); const p = tr[Math.max(1, k + 1)]; v += (p[1] - nn.lat) ** 2; });
    const est = M.estimate(S, st, logs); for (const e of Object.values(est)) if (e.fixed && e.logs >= 2) for (const r of e.rays) if (r.li === i && r.on) v += Math.min(r.res, 6) ** 2 * 0.5; return v; };
  let best = [0, 0], bv = 1e9; for (let dx = -16; dx <= 16; dx += 2) for (let dy = -16; dy <= 16; dy += 2) { const v = cost([dx, dy]); if (v < bv) { bv = v; best = [dx, dy]; } }
  const c = best.slice(); for (let dx = -1.5; dx <= 1.5; dx += 0.5) for (let dy = -1.5; dy <= 1.5; dy += 0.5) { const d = [c[0] + dx, c[1] + dy], v = cost(d); if (v < bv) { bv = v; best = d; } }
  s.drift = best; }); }
function strikeOutliers(M, S, st, logs) { for (let pass = 0; pass < 2; pass++) { const per = logs.map((_, i) => st.logs[i].struck ? null : totalRes(M, S, st, logs, i)); const vals = per.filter(v => v != null).sort((a, b) => a - b); const med = vals[vals.length >> 1] || 1;
    let worst = -1, wv = 0; per.forEach((v, i) => { if (v != null && v > Math.max(6, 4 * med) && v > wv) { wv = v; worst = i; } }); if (worst >= 0) st.logs[worst].struck = true; } }
function dropPhantoms(M, S, st, logs) { const est = M.estimate(S, st, logs); for (const e of Object.values(est)) if (e.fixed && e.logs < 2 && e.contra >= 1 && e.kind !== 'reef') st.feats[e.f] = { on: false }; }

NAV.noSurvey = (M, S) => NAV.competent(M, S, { noSurvey: true });

// the day's target scales with the work: trade lanes, capes and reefs (calibrated against the navigator bot)
function dailyTarget(d){ const S2=M.sheet(d.spec,'daily:'+d.seed); const caps=Object.values(S2.T.feats).filter(f=>f.kind==='cape').length; return Math.round(1.05*(S2.routes.length*30+caps*5+S2.T.reefs.length*4)); }

window.__map={ M, NAV, get S(){ return S; }, get st(){ return st; }, get logs(){ return logs; }, get est(){ return est; }, recompute, openSheet, publish, closeOn, setDev, toggleStrike, survey, get published(){ return published; }, get sel(){ return sel; }, set sel(v){ sel=v; renderTabs(); renderPage(); dirty=true; }, SHEETS, get SAVE(){ return SAVE; }, cleanSave, cam, toScreen:(x,y)=>cam.toScreen(x,y), get si(){ return si; }, get daily(){ return daily; }, dailySpec, renderAll };
{ const h=decodeURIComponent(location.hash.slice(1)), q=Object.fromEntries(h.split('&').map(p=>p.split('=')).filter(p=>p.length===2));
  if (q.survey && /^[\w-]{1,24}$/.test(q.survey)) openSheet(0,q.survey); else openSheet(SAVE.cur); }
requestAnimationFrame(loop);
