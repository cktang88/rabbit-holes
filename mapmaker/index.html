<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mapmaker of Lost Islands</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  /* A 1680 chart table: walnut, vellum, iron-gall ink, verdigris and sealing wax */
  :root{--vellum:#eadbb4;--vellum2:#dcc898;--ink:#2e2015;--ink2:#5a4630;--verd:#3f7f6a;--wax:#9c1f1a;--brass:#b58a3c;--wood:#3b2414;
    font-family:"IM Fell English",Georgia,serif}
  html,body{background:var(--wood);color:var(--ink)}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;
    background:repeating-linear-gradient(92deg,#3b2414 0 7px,#432a17 7px 9px,#36200f 9px 15px,#3f2615 15px 22px),var(--wood)}
  .topbar{background:linear-gradient(#2a180c,#1f1208);border-bottom:2px solid #120a04;color:#e9d9b0}
  .topbar h1{font-family:"IM Fell English SC",serif;font-size:20px;font-weight:400;letter-spacing:.06em;color:#f0e2bc}
  .topbar .home,.topbar .rh-like{color:#cdb88a;font-style:italic}
  #tot{color:#cdb88a;font-style:italic}
  button{font-family:"IM Fell English",serif;font-size:14px;color:#2e2015;background:linear-gradient(#f1e4c3,#d8c290);border:1px solid #7a5c32;border-radius:3px;box-shadow:inset 0 1px 0 #fff8,0 2px 0 #6b4e28}
  button:hover:not(:disabled){border-color:var(--wax)}
  button:focus-visible{outline:2px solid var(--wax);outline-offset:2px}
  button.primary{background:linear-gradient(#b8312a,#8a1a15);color:#f7e8c8;border-color:#5e0f0b;box-shadow:inset 0 1px 0 #fff4,0 2px 0 #4a0c09}
  button:disabled{opacity:.5}
  main{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0}
  #chart{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair;touch-action:none}
  /* the lookout: a brass-rimmed glass */
  #look{position:absolute;right:16px;top:16px;width:220px;height:220px;border-radius:50%;background:#0d2a3a;
    box-shadow:0 0 0 5px #c79a48,0 0 0 8px #7a5a24,0 0 0 9px #e8c878,0 10px 30px #000c}
  #lookL{position:absolute;right:14px;top:246px;width:220px;text-align:center;font-size:14px;color:#f0e2bc;font-style:italic;text-shadow:0 1px 3px #000}
  /* the side is the master's journal: vellum leaves */
  #side{width:330px;background:linear-gradient(90deg,#c9b383 0,#eadbb4 14px,#eadbb4);border-left:3px solid #1f1208;overflow:auto;padding:14px 14px 16px 22px;display:flex;flex-direction:column;gap:14px;color:var(--ink);
    box-shadow:inset 12px 0 18px -10px #6b4e28}
  .box{border-bottom:1px solid #a88b5a;padding:2px 0 12px}
  h3{margin:0 0 6px;font-family:"IM Fell English SC",serif;font-weight:400;font-size:19px;letter-spacing:.04em;color:var(--ink)}
  .stat{display:flex;justify-content:space-between;font-size:15px;padding:1px 0}
  .bar{height:6px;border:1px solid var(--ink2);margin-top:2px;background:#f4ead0}
  .bar div{height:100%}
  .com{font-size:14px;padding:6px 0 6px 0;border-bottom:1px dotted #a88b5a;position:relative}
  .com.done{color:#6d5a40}
  .com .t{font-weight:400;font-size:15px}
  .com .p{font-size:13px;color:#5a4630;font-style:italic}
  .com .ready{color:var(--verd);font-style:normal}
  .seal{display:inline-block;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d24a3c,#9c1f1a 55%,#6a120e);box-shadow:0 1px 2px #0006;vertical-align:middle;margin-right:4px;position:relative}
  .seal::after{content:"A";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f3c2b2;font-size:11px;font-family:"IM Fell English SC",serif}
  .inst{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:14px;padding:4px 0}
  .inst .p{color:#5a4630!important;font-style:italic}
  .inst button{font-size:13px;padding:3px 8px}
  #hud{position:absolute;left:14px;bottom:12px;font-size:15px;color:#f0e2bc;font-style:italic;text-shadow:0 1px 3px #000}
  .sails{display:flex;gap:4px;margin-top:6px} .sails button{flex:1;font-size:13px;padding:5px 4px} .sails button.on{background:linear-gradient(#3f7f6a,#2c5c4c);color:#f0e2bc;border-color:#1d3d33}
  #log{font-size:14px;line-height:1.35;max-height:170px;overflow:auto;font-style:italic;color:var(--ink2)}
  #log div{padding:2px 0;border-bottom:1px dotted #c4aa78} #log b{font-style:normal;color:var(--ink);font-weight:400;font-family:"IM Fell English SC",serif}
  #ashore{display:none;margin-top:8px;width:100%}
  #ashore.on{display:block}
  kbd{background:#f4ead0;border-color:#a88b5a;color:var(--ink)}
  .small{font-size:13px}
  .modal{background:linear-gradient(#f1e4c3,#e3d1a4);color:var(--ink);border:1px solid #7a5c32;border-radius:2px;font-family:"IM Fell English",serif;box-shadow:0 10px 40px #000a}
  .modal h2{font-family:"IM Fell English SC",serif;font-weight:400}
  .toast{background:#f1e4c3;color:var(--ink);border:1px solid #7a5c32;border-radius:2px;font-family:"IM Fell English",serif;font-style:italic;box-shadow:0 4px 14px #0008}
  /* the Admiralty seal, pressed when a commission is delivered */
  #sealFx{position:absolute;left:50%;top:44%;width:180px;height:180px;margin:-90px 0 0 -90px;pointer-events:none;display:none}
  #sealFx.on{display:block;animation:press 2.6s ease-out forwards}
  @keyframes press{0%{transform:scale(2.6) rotate(-30deg);opacity:0}18%{transform:scale(.92) rotate(-8deg);opacity:1}24%{transform:scale(1.04) rotate(-10deg)}30%{transform:scale(1) rotate(-10deg)}80%{opacity:1}100%{transform:scale(1) rotate(-10deg);opacity:0}}
  @media (prefers-reduced-motion:reduce){#sealFx.on{animation:none;opacity:1}}
  #zoom{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
  #zoom button{width:40px;height:40px;padding:0;font-size:22px;line-height:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f0d48a,#b58a3c 60%,#7a5a24);border-color:#5e4418}
  @media (max-width:760px){
    main{flex-direction:column}
    #stage{flex:none;height:54vh}
    #side{width:auto;flex:1;min-height:0;border-left:0;border-top:3px solid #1f1208;padding-left:14px}
    #look{width:104px;height:104px;right:10px;top:10px} #lookL{display:none}
    #hud{left:8px;bottom:6px;font-size:13px}
    .topbar{flex-wrap:wrap;row-gap:0} .topbar h1{font-size:15px} .topbar #tot{font-size:11px;min-width:0}
  }
</style>
</head>
<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>The Mapmaker of Lost Islands</h1><span class="spacer"></span><span class="small" id="tot"></span></div>
<main>
  <div id="stage"><canvas id="chart" aria-label="Your chart"></canvas><canvas id="look" aria-label="The lookout's view"></canvas><div id="lookL">The lookout: what is truly there</div><div id="hud"></div><div id="zoom"><button data-z="in" aria-label="Zoom in">+</button><button data-z="out" aria-label="Zoom out">−</button></div>
    <svg id="sealFx" viewBox="0 0 180 180" aria-hidden="true"><defs><radialGradient id="wx" cx=".38" cy=".32"><stop offset="0" stop-color="#d9584a"/><stop offset=".55" stop-color="#9c1f1a"/><stop offset="1" stop-color="#5e0f0b"/></radialGradient></defs>
      <path d="M90 6 C120 4 150 18 164 44 C178 70 176 104 162 130 C148 158 118 176 88 174 C56 172 26 156 14 126 C2 96 6 62 22 38 C38 14 62 8 90 6Z" fill="url(#wx)"/>
      <circle cx="90" cy="90" r="58" fill="none" stroke="#6a120e" stroke-width="3"/><circle cx="90" cy="90" r="52" fill="none" stroke="#e58a7c" stroke-opacity=".5" stroke-width="1.5"/>
      <text x="90" y="82" text-anchor="middle" font-family="IM Fell English SC,serif" font-size="17" fill="#f3c2b2">ADMIRALTY</text><text id="sealTxt" x="90" y="106" text-anchor="middle" font-family="IM Fell English,serif" font-style="italic" font-size="13" fill="#f3c2b2"></text>
      <path d="M58 118 l64 0" stroke="#f3c2b2" stroke-opacity=".6"/></svg>
  </div>
  <div id="side">
    <div class="box"><h3 id="shipName">The Wandering Gull</h3>
      <div class="stat"><span>Gold</span><b id="gold"></b></div>
      <div class="stat"><span>Provisions</span><b id="prov"></b></div><div class="bar"><div id="provBar" style="background:#3f7f6a"></div></div>
      <div class="stat"><span>Hull</span><b id="hull"></b></div><div class="bar"><div id="hullBar" style="background:#8a5a2a"></div></div>
      <div class="stat" style="margin-top:4px"><span>Where we think we are</span><b id="unc"></b></div>
      <div class="sails" id="sails"><button data-sail="0">⚓ Furl</button><button data-sail="1">Half sail</button><button data-sail="2">Full sail</button></div>
      <div class="row" style="margin-top:8px"><button id="fixBtn">⊕ Take a fix</button><button id="inkBtn" title="Stray ink lowers a chart's accuracy: lift the quill when you are unsure where you are">🖋 Quill: inking</button></div>
      <button id="ashore">⛵ Go ashore</button>
      <div class="small" style="color:#5a4630;margin-top:6px"><kbd>W</kbd>/<kbd>S</kbd> sails · <kbd>A</kbd>/<kbd>D</kbd> helm · or click the chart to steer. <kbd>F</kbd> fix · <kbd>Space</kbd> heave to</div>
    </div>
    <div class="box" id="portBox"></div>
    <div class="box"><h3>Ship's log</h3><div id="log"></div></div>
    <div class="box"><h3>Commissions</h3><div id="coms"></div></div>
    <div class="box"><h3>Instruments</h3><div id="insts"></div></div>
    <div class="row"><button id="exportBtn">Export chart</button><button id="newWorld">New archipelago</button></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
const WX=1400, WY=900, CELL=5, GW=WX/CELL, GH=WY/CELL;
// ===================== World =====================
let S = RH.load('mapmaker', null);
function freshSave(seed){ return {seed:playableSeed(seed), gold:40, prov:100, hull:100, inst:{compass:1}, ship:null, ink:[], done:{}, visited:[], rep:0, worlds:(S&&S.worlds)||0, log:[], landed:{}, day:0}; }
// every commission needs at least five islands (home + four to chart); skip the rare seeds that make fewer
function playableSeed(seed){ seed=Math.floor(Math.abs(+seed||0))%1e9; for (let k=0;k<50;k++){ buildWorld(seed+k); if (islands.length>=5) return seed+k; } return seed; }
const num=(v,d,lo,hi)=> Number.isFinite(v)? Math.max(lo,Math.min(hi,v)) : d;
function cleanSave(s){
  if (!s || typeof s!=='object' || Array.isArray(s) || !Number.isFinite(s.seed)) return null;
  const pt=(p)=>Array.isArray(p) && p.length===2 && Number.isFinite(p[0]) && Number.isFinite(p[1]);
  const inst={compass:1}; if (s.inst && typeof s.inst==='object') for (const k in s.inst) if (INST.some(x=>x.k===k) && s.inst[k]) inst[k]=1;
  const done={}; if (s.done && typeof s.done==='object') for (const k in s.done){ const n=+k; if (Number.isInteger(n) && n>=0 && n<COMS.length && s.done[k]) done[n]=1; }
  const sh=s.ship; const ship= sh && typeof sh==='object' && ['x','y','bx','by','h'].every(k=>Number.isFinite(sh[k])) ? {...sh, sail:[0,1,2].includes(sh.sail)?sh.sail:0, voyageDmg:num(sh.voyageDmg,0,0,1e4)} : null;
  return {...s, seed:Math.floor(Math.abs(s.seed))%1e9, gold:Math.floor(num(s.gold,40,0,1e9)), prov:num(s.prov,100,0,100), hull:num(s.hull,100,1,100), inst, done, ship,
    ink:Array.isArray(s.ink)? s.ink.filter(pt) : [], visited:Array.isArray(s.visited)? s.visited.filter(pt).slice(-3000) : [], worlds:Math.floor(num(s.worlds,0,0,1e6)),
    log:Array.isArray(s.log)? s.log.filter(e=>e && Number.isFinite(e.d) && typeof e.t==='string').slice(0,40) : [], landed:(s.landed && typeof s.landed==='object' && !Array.isArray(s.landed))? Object.fromEntries(Object.keys(s.landed).filter(k=>/^\d+$/.test(k)).map(k=>[k,1])) : {}, day:num(s.day,0,0,1e7)};
}
const persist=()=>{ RH.save('mapmaker', S); RH.progress('mapmaker', Object.keys(S.done).length/COMS.length); };
let land, islands, coast, port, currents, reefs, rng, names;
function noise2(r){ const N=24; const g=[...Array(N*N)].map(()=>r()); const f=(x,y)=>{ const X=Math.floor(x), Y=Math.floor(y), fx=x-X, fy=y-Y; const v=(i,j)=>g[((Y+j)%N+N)%N*N+((X+i)%N+N)%N]; const s=t=>t*t*(3-2*t); return (v(0,0)*(1-s(fx))+v(1,0)*s(fx))*(1-s(fy))+(v(0,1)*(1-s(fx))+v(1,1)*s(fx))*s(fy); }; return (x,y)=>f(x,y)*0.6+f(x*2.1,y*2.1)*0.3+f(x*4.3,y*4.3)*0.1; }
function buildWorld(seed){
  rng=RH.rng(seed); const n=noise2(rng);
  const centers=[...Array(9)].map((_,i)=>({x:rng.range(120,WX-120), y:rng.range(110,WY-110), r:rng.range(60,150)*(i===0?1.2:1)}));
  centers[0].x=220; centers[0].y=WY/2+rng.range(-100,100);
  land=new Uint8Array(GW*GH);
  for (let y=0;y<GH;y++) for (let x=0;x<GW;x++){ const wx=x*CELL, wy=y*CELL; let h=-0.55; for (const c of centers){ const d=Math.hypot(wx-c.x,wy-c.y)/c.r; h+=Math.max(0,1-d*d)*0.9; } h+= (n(wx/90,wy/90)-0.5)*0.9; if (x<4||y<4||x>GW-5||y>GH-5) h=-1; land[y*GW+x]= h>0?1:0; }
  // islands by flood fill
  const lab=new Int32Array(GW*GH).fill(-1); islands=[];
  for (let i=0;i<GW*GH;i++) if (land[i]&&lab[i]<0){ const st=[i]; lab[i]=islands.length; const cells=[]; while(st.length){ const j=st.pop(); cells.push(j); const x=j%GW,y=(j/GW)|0; for (const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const X=x+dx,Y=y+dy; if(X<0||Y<0||X>=GW||Y>=GH) continue; const k=Y*GW+X; if(land[k]&&lab[k]<0){ lab[k]=islands.length; st.push(k);} } } islands.push({cells}); }
  islands=islands.filter(is=>is.cells.length>=12);
  // remove tiny islets from land
  const keep=new Set(islands.flatMap(is=>is.cells)); for (let i=0;i<GW*GH;i++) if (land[i]&&!keep.has(i)) land[i]=0;
  for (const is of islands){ is.coast=[]; let sx=0,sy=0; for (const j of is.cells){ const x=j%GW,y=(j/GW)|0; sx+=x; sy+=y; if ([[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>!land[(y+dy)*GW+x+dx])) is.coast.push([x*CELL+CELL/2,y*CELL+CELL/2]); } is.cx=sx/is.cells.length*CELL; is.cy=sy/is.cells.length*CELL; }
  // home island = the one nearest centers[0]
  islands.sort((a,b)=>Math.hypot(a.cx-centers[0].x,a.cy-centers[0].y)-Math.hypot(b.cx-centers[0].x,b.cy-centers[0].y));
  const home=islands[0]; const rest=islands.slice(1).sort((a,b)=>b.coast.length-a.coast.length); islands=[home,...rest];
  const pre=['Isle of','Cape','Saint','Las','Mount','The','Port']; const nm=['Sorrow','Gannets','Tamsin','Velas','Brume','Cinders','Margery','Thorn','Abel','Quiet','Hollow','Ember','Lantern','Saltmarsh'];
  islands.forEach((is,i)=>{ is.name = i===0? 'Home Isle' : rng.pick(pre)+' '+nm[(i*5+rng.int(3))%nm.length]; is.id=i; });
  // port: home coast point facing east
  const pc=home.coast.slice().sort((a,b)=>b[0]-a[0])[Math.floor(home.coast.length*0.05)]; port={x:pc[0]+12, y:pc[1]};
  while (isLand(port.x,port.y)) port.x+=5;
  // currents: coarse grid of vectors
  currents=[...Array(12)].map(()=>({x:rng.range(-7,7), y:rng.range(-5,5)}));
  // reefs near island 2 or 3
  reefs=[]; const ri=islands[Math.min(3,islands.length-1)]; for (let k=0;k<26;k++){ const c=rng.pick(ri.coast); const a=rng()*7, d=rng.range(10,30); const x=c[0]+Math.cos(a)*d, y=c[1]+Math.sin(a)*d; if (!isLand(x,y)) reefs.push({x,y}); }
  ri.reefy=true;
  hashCoast();
}
const isLand=(x,y)=>{ const X=Math.floor(x/CELL), Y=Math.floor(y/CELL); if(X<0||Y<0||X>=GW||Y>=GH) return true; return land[Y*GW+X]===1; };
const currentAt=(x,y)=> currents[Math.min(3,Math.floor(x/WX*4))+4*Math.min(2,Math.floor(y/WY*3))];

// ===================== Instruments =====================
const INST=[
  {k:'compass', n:'Brass compass', d:'Heading to within ±6°.', cost:0},
  {k:'log', n:'Log line', d:'Measures your speed through the water, so dead reckoning drifts less.', cost:40},
  {k:'quadrant', n:'Quadrant', d:'Take a fix on latitude (north–south) from the sun. Rough.', cost:70},
  {k:'fineCompass', n:'Azimuth compass', d:'Heading to within ±1.5°.', cost:90},
  {k:'telescope', n:'Telescope', d:'The lookout sees 50% farther.', cost:110},
  {k:'sextant', n:'Sextant', d:'Fixes latitude very precisely.', cost:160},
  {k:'copper', n:'Copper sheathing', d:'Reefs and groundings do half damage.', cost:120},
  {k:'chronometer', n:'Marine chronometer', d:'Fix longitude (east–west) too. The great prize of navigation.', cost:300},
];
const has=(k)=>!!S.inst[k];

// ===================== Commissions =====================
const COMS=[
  {n:'Home Waters', d:'Chart 60% of Home Isle\'s coast.', reward:40, test:()=>acc(0)>=60, prog:()=>`${acc(0)|0}%`},
  {n:'The Neighbour', d:'Chart 50% of the nearest other island.', reward:60, test:()=>acc(nearest())>=50, prog:()=>`${islands[nearest()].name}: ${acc(nearest())|0}%`},
  {n:'Two Islands', d:'Chart two islands besides home, 50% each.', reward:70, test:()=>others().filter(i=>acc(i)>=50).length>=2, prog:()=>`${others().filter(i=>acc(i)>=50).length}/2`},
  {n:'The Reef', d:'Chart 55% of the reef-ringed island without taking more than 30 hull damage in one voyage.', reward:110, test:()=>acc(reefIsle())>=55 && S.reefOk, prog:()=>`${islands[reefIsle()].name}: ${acc(reefIsle())|0}%`},
  {n:'Circumnavigation', d:'Chart 85% of any island other than home.', reward:120, test:()=>others().some(i=>acc(i)>=85), prog:()=>`best ${Math.max(0,...others().map(acc))|0}%`},
  {n:'The Far Isle', d:'Chart 50% of the island farthest from port.', reward:150, test:()=>acc(farthest())>=50, prog:()=>`${islands[farthest()].name}: ${acc(farthest())|0}%`},
  {n:'The Island That Isn\'t There', d:'An old chart shows an island at the marked spot. Sail within 40 leagues of it and confirm it doesn\'t exist.', reward:90, test:()=>S.ghostSeen, prog:()=>S.ghostSeen?'confirmed':'unvisited'},
  {n:'Four Coasts', d:'Chart four islands at 60% or better.', reward:160, test:()=>islands.filter(is=>acc(is.id)>=60).length>=4, prog:()=>`${islands.filter(is=>acc(is.id)>=60).length}/4`},
  {n:'Precision', d:'Chart any island at 92% or better. Your position has to be very good for this: ink drawn while you were lost counts against you.', reward:200, test:()=>islands.some(is=>acc(is.id)>=92), prog:()=>`best ${Math.max(...islands.map(is=>acc(is.id)))|0}%`},
  {n:'The Archipelago', d:'Chart 60% of the coastline in the whole archipelago.', reward:250, test:()=>accAll()>=60, prog:()=>`${accAll()|0}%`},
  {n:'Every Island', d:'Chart every island to at least 40%.', reward:250, test:()=>islands.every(is=>acc(is.id)>=40), prog:()=>`${islands.filter(is=>acc(is.id)>=40).length}/${islands.length}`},
  {n:'Master Chart', d:'80% of all coastline. The Admiralty will print it.', reward:500, test:()=>accAll()>=80, prog:()=>`${accAll()|0}%`},
];
const nearest=()=>{ let b=Math.min(1,islands.length-1), bd=1e9; for (let i=1;i<islands.length;i++){ const d=Math.hypot(islands[i].cx-port.x,islands[i].cy-port.y); if (d<bd){ bd=d; b=i; } } return b; };
const farthest=()=>{ let b=Math.min(1,islands.length-1), bd=0; for (let i=1;i<islands.length;i++){ const d=Math.hypot(islands[i].cx-port.x,islands[i].cy-port.y); if (d>bd){ bd=d; b=i; } } return b; };
const reefIsle=()=>Math.max(0,islands.findIndex(is=>is.reefy));
const others=()=>islands.slice(1).map(is=>is.id);
// accuracy: how much of the true coast is inked (recall), discounted by stray ink near that island that matches no coast (precision).
// Stray ink costs up to a quarter of the score, so a smeared chart drawn while lost can't pass for a precise one.
let inkHash=new Map(), accCache={}, accDirty=true, precCache=null;
const TOL=14, STRAY=1.5*TOL, NEAR_ISLE=70, PREC_W=0.25;
function hashInk(){ inkHash=new Map(); precCache=null; for (const [x,y] of S.ink){ const k=((x/TOL)|0)+','+((y/TOL)|0); (inkHash.get(k)||inkHash.set(k,[]).get(k)).push([x,y]); } accDirty=true; }
function near(x,y){ const cx=(x/TOL)|0, cy=(y/TOL)|0; for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){ const l=inkHash.get((cx+dx)+','+(cy+dy)); if (l) for (const p of l) if ((p[0]-x)**2+(p[1]-y)**2<TOL*TOL) return true; } return false; }
let coastHash=new Map();
function hashCoast(){ coastHash=new Map(); for (const is of islands) for (const [x,y] of is.coast){ const k=((x/NEAR_ISLE)|0)+','+((y/NEAR_ISLE)|0); (coastHash.get(k)||coastHash.set(k,[]).get(k)).push([x,y,is.id]); } }
// nearest true coast point to (x,y) within NEAR_ISLE: [distance, island id] or null
function nearestCoast(x,y){ const cx=(x/NEAR_ISLE)|0, cy=(y/NEAR_ISLE)|0; let bd=NEAR_ISLE*NEAR_ISLE, bi=-1; for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){ const l=coastHash.get((cx+dx)+','+(cy+dy)); if (l) for (const p of l){ const d=(p[0]-x)**2+(p[1]-y)**2; if (d<bd){ bd=d; bi=p[2]; } } } return bi<0? null : [Math.sqrt(bd), bi]; }
function precisions(){ if (precCache) return precCache; const good={}, all={}; for (const [x,y] of S.ink){ const n=nearestCoast(x,y); if (!n) continue; all[n[1]]=(all[n[1]]||0)+1; if (n[0]<=STRAY) good[n[1]]=(good[n[1]]||0)+1; }
  precCache={}; for (const is of islands) precCache[is.id]= all[is.id]? (good[is.id]||0)/all[is.id] : 1; return precCache; }
function recall(i){ const is=islands[i]; let c=0; for (const [x,y] of is.coast) if (near(x,y)) c++; return c/is.coast.length; }
function acc(i){ if (accDirty){ accCache={}; precCache=null; accDirty=false; } if (accCache[i]!=null) return accCache[i]; if (!islands[i]) return 0; return accCache[i]=100*recall(i)*(1-PREC_W+PREC_W*precisions()[i]); }
function accAll(){ let c=0,t=0; for (const is of islands){ t+=is.coast.length; c+=acc(is.id)*is.coast.length/100; } return t? 100*c/t : 0; }

// ===================== Sound: wood, rope, bell and wax =====================
const T_=(o)=>{ try { FX.tone(o); } catch(e){} };
let quillT=0;
const VOICE={
  quill:()=>{ const n=performance.now(); if (n-quillT<260) return; quillT=n; T_({noise:1,f:5600+Math.random()*1500,q:3,dur:.05,vol:.025}); },
  bell:()=>{ for (const dl of [0,.55]){ T_({f:740,type:'sine',dur:1.4,vol:.09,delay:dl}); T_({f:1860,type:'sine',dur:.5,vol:.025,delay:dl}); } },
  seal:()=>{ T_({f:80,f2:45,type:'sine',dur:.3,vol:.3}); for (let i=0;i<6;i++) T_({noise:1,f:3000+i*300,q:4,dur:.025,vol:.04,delay:.12+i*.05}); },
  squall:()=>T_({noise:1,f:500,q:.4,dur:2.6,vol:.12,attack:.8}),
  surf:()=>{ T_({noise:1,f:900,q:.5,dur:1.2,vol:.1,attack:.3}); T_({f:330,type:'triangle',dur:.3,vol:.06,delay:.6}); },
  creak:()=>T_({f:140,f2:95,type:'sawtooth',dur:.25,vol:.03}),

};
// ===================== Ship's log =====================
function logE(t){ S.log.unshift({d:Math.floor(S.day)+1, t}); if (S.log.length>40) S.log.pop(); renderLog(); }
function renderLog(){ const el=document.getElementById('log'); if (el) el.innerHTML = S.log.length? S.log.map(e=>`<div><b>Day ${e.d}.</b> ${e.t}</div>`).join('') : '<div>The log is empty. Weigh anchor.</div>'; }
const DIRS=['east','south-east','south','south-west','west','north-west','north','north-east'];
const dirOf=(dx,dy)=> DIRS[((Math.round(Math.atan2(dy,dx)/(Math.PI/4))%8)+8)%8];
// ===================== Landfall =====================
// heave to near an island you have not visited and send a boat ashore: water, trade, or a sure position
function landfallIsle(){ if (!ship || ship.sail || fixing>0 || atPort) return -1; let best=-1, bd=26;
  for (const is of islands){ if (is.id===0 || S.landed[is.id]) continue; if (Math.hypot(is.cx-ship.x,is.cy-ship.y)>400) continue; for (const [x,y] of is.coast){ const d=Math.hypot(x-ship.x,y-ship.y); if (d<bd){ bd=d; best=is.id; } } }
  return best; }
function goAshore(){ const i=landfallIsle(); if (i<0) return null; const is=islands[i]; S.landed[i]=1; S.prov=Math.min(100,S.prov+25); const roll=rng(); let what;
  if (roll<0.4){ S.gold+=15; what=`traded with the people of ${is.name}: fresh water and 15 gold`; }
  else if (roll<0.7){ S.prov=Math.min(100,S.prov+15); what=`found a spring and fruit trees on ${is.name}. The casks are full`; }
  else { ship.bx=ship.x; ship.by=ship.y; what=`a hermit on ${is.name} told us exactly where we are`; }
  VOICE.surf(); logE(`Went ashore. We ${what}.`); RH.toast(`Landfall on ${is.name}.`); persist(); renderAll(); return what; }
// ===================== Squalls =====================
let squallT=75;
function squall(){ currents=currents.map(()=>({x:rng.range(-9,9), y:rng.range(-6,6)})); const c=currentAt(ship.x,ship.y); compassBias=rng.range(-1,1); speedBias=rng.range(-1,1);
  VOICE.squall(); FX.shake(0.3); logE(`A squall. The current here now sets to the ${dirOf(c.x,c.y)}. Our reckoning is worth less than it was.`); RH.toast('A squall! The currents have turned.'); }

// ===================== Ship =====================
let ship;
function newShip(){ return {x:port.x, y:port.y, bx:port.x, by:port.y, h:0, sail:0, voyageDmg:0}; }
let target=null, fixing=0, ghost;
function sightR(){ return has('telescope')? 135 : 90; }
function step(dt){
  // helm
  if (keys.a) ship.h-=1.4*dt; if (keys.d) ship.h+=1.4*dt;
  if (target){ const want=Math.atan2(target[1]-ship.by, target[0]-ship.bx); let d=want-ship.h; d=Math.atan2(Math.sin(d),Math.cos(d)); ship.h+=Math.max(-1.4*dt,Math.min(1.4*dt,d)); if (Math.hypot(target[0]-ship.bx,target[1]-ship.by)<10) target=null; }
  if (fixing>0){ fixing-=dt; if (fixing<=0) doFix(); return; }
  const v=[0,14,28][ship.sail]; if (!v) return;
  // true motion: heading error + current
  const herr = (has('fineCompass')? 1.5 : 6)*Math.PI/180;
  const trueH = ship.h + compassBias*herr;
  const c=currentAt(ship.x,ship.y);
  const nx = ship.x + (Math.cos(trueH)*v + c.x)*dt, ny = ship.y + (Math.sin(trueH)*v + c.y)*dt;
  // believed motion: logged speed with error, compass heading
  const verr = has('log')? 0.03 : 0.15;
  ship.bx += Math.cos(ship.h)*v*(1+speedBias*verr)*dt; ship.by += Math.sin(ship.h)*v*(1+speedBias*verr)*dt;
  if (isLand(nx,ny)){ ship.sail=0; damage(8,'You ran aground!'); ship.x-=Math.cos(trueH)*4; ship.y-=Math.sin(trueH)*4; }
  else { ship.x=nx; ship.y=ny; }
  for (const r of reefs) if (Math.hypot(r.x-ship.x,r.y-ship.y)<5 && !r.hitT){ r.hitT=3; damage(12,'Reef! The hull scrapes on rock.'); }
  for (const r of reefs) if (r.hitT) r.hitT=Math.max(0,r.hitT-dt);
  S.prov -= dt*0.2; S.day += dt/6; if (S.prov<=0){ S.prov=0; mutiny(); }
  squallT-=dt; if (squallT<=0){ squallT=70+rng.int(40); if (!atPort) squall(); }
  // ink coast in sight
  inkT+=dt; if (inkT>0.35 && inkOn){ inkT=0; ink(); }
  // ghost island
  if (!S.ghostSeen && Math.hypot(ship.x-ghost.x, ship.y-ghost.y)<40){ S.ghostSeen=1; RH.toast('Nothing but open sea where the island should be. The old chart was wrong.'); logE('Sounded at the place of the Isle of Mists. Open sea. The old chart lied.'); persist(); }
  visT+=dt; if (visT>1){ visT=0; S.visited.push([Math.round(ship.bx),Math.round(ship.by)]); if (S.visited.length>3000) S.visited.shift(); }
  // biases drift slowly (they are what makes dead reckoning wander)
  biasT-=dt; if (biasT<=0){ biasT=8; compassBias=rng.range(-1,1); speedBias=rng.range(-1,1); }

}
let inkT=0, visT=0, biasT=0, compassBias=0, speedBias=0, inkOn=true, atPort=true, keys={};
function ink(){
  const R=sightR(); const ox=ship.bx-ship.x, oy=ship.by-ship.y; const noise=has('fineCompass')?1.5:4;
  let added=0;
  for (const is of islands) { if (Math.hypot(is.cx-ship.x,is.cy-ship.y)>R+400) continue;
    for (const [x,y] of is.coast){ const d=Math.hypot(x-ship.x,y-ship.y); if (d>R) continue;
      const px=x+ox+rng.range(-noise,noise)*d/R, py=y+oy+rng.range(-noise,noise)*d/R;
      if (inkSet.has(((px/4)|0)+','+((py/4)|0))) continue; inkSet.add(((px/4)|0)+','+((py/4)|0)); S.ink.push([Math.round(px*10)/10,Math.round(py*10)/10]); added++; } }
  if (added){ hashInk(); VOICE.quill(); }
}
let inkSet=new Set();
function doFix(){
  const ny = has('sextant')? 2 : 14; ship.by = ship.y + rng.range(-ny,ny);
  if (has('chronometer')) ship.bx = ship.x + rng.range(-3,3);
  RH.toast(has('chronometer')? 'Fix taken: latitude and longitude corrected.' : 'Fix taken: latitude corrected. Longitude is still dead reckoning.'); VOICE.creak();
}
function damage(n,msg){ const d=has('copper')? n/2 : n; S.hull-=d; ship.voyageDmg+=d; RH.toast(msg); VOICE.thump(); FX.shake(0.35); logE(msg); if (ship.voyageDmg>30) S.reefOk=S.reefOk||false; if (S.hull<=0) wreck(); }
function wreck(){ S.hull=40; S.gold=Math.max(0,S.gold-40); ship=newShip(); RH.modal('<h2>Shipwreck</h2><p>Your ship broke up on the rocks. The crew rowed home. A new ship cost 40 gold, but your chart survived in its oilskin.</p>'); }
function mutiny(){ S.gold=Math.max(0,S.gold-25); S.prov=40; ship=newShip(); RH.modal('<h2>Mutiny</h2><p>The food ran out. The crew turned the ship around and brought you home. You paid them 25 gold to keep quiet.</p>'); }

// ===================== Port =====================
function renderPort(){
  const el=document.getElementById('portBox');
  if (!atPort){ el.innerHTML=`<h3>At sea</h3><div class="small" style="color:#5a4630;font-style:italic">Return to Port Haven (⚓ on your chart) to deliver charts, victual and buy instruments. In port your position is known exactly.</div>`; return; }
  const ready=COMS.map((c,i)=>[c,i]).filter(([c,i])=>!S.done[i] && c.test());
  el.innerHTML=`<h3>⚓ In port</h3><div class="row"><button id="resup" ${S.prov>=99?'disabled':''}>Resupply (${Math.ceil((100-S.prov)*0.3)}g)</button><button id="repair" ${S.hull>=100?'disabled':''}>Repair (${Math.ceil((100-S.hull)*0.6)}g)</button></div>
    ${ready.length? `<button class="primary" id="sell" style="width:100%;margin-top:8px">Deliver ${ready.length} chart${ready.length>1?'s':''} (+${ready.reduce((s,[c])=>s+c.reward,0)}g)</button>` : '<div class="small" style="color:#5a4630;margin-top:6px;font-style:italic">No commissions ready to deliver.</div>'}
    <button id="compare" style="width:100%;margin-top:6px">Compare your chart with the truth</button>`;
  document.getElementById('resup').onclick=()=>{ const c=Math.ceil((100-S.prov)*0.3); if (S.gold<c) return RH.toast('Not enough gold.'); S.gold-=c; S.prov=100; persist(); renderAll(); };
  document.getElementById('repair').onclick=()=>{ const c=Math.ceil((100-S.hull)*0.6); if (S.gold<c) return RH.toast('Not enough gold.'); S.gold-=c; S.hull=100; persist(); renderAll(); };
  document.getElementById('sell')?.addEventListener('click',()=>{ let g=0; for (const [c,i] of ready){ if (S.done[i]) continue; S.done[i]=1; g+=c.reward; } if (!g) return; S.gold+=g; persist(); pressSeal(ready.filter(([c,i])=>S.done[i]).map(([c])=>c.n)); RH.toast(`The Admiralty pays ${g} gold.`); logE(`Delivered to the Admiralty: ${ready.map(([c])=>c.n).join(', ')}. Paid ${g} gold.`); renderAll();
    if (Object.keys(S.done).length===COMS.length) RH.modal('<h2>The Admiralty prints your chart.</h2><p>Your name is in the corner of every copy. Sailors will use it for a hundred years.</p><p>A new archipelago has been sighted. Every new one is a new set of islands.</p>'); });
  document.getElementById('compare').onclick=()=>{ showTruth=performance.now()+5000; RH.toast('Truth overlay for 5 seconds: blue is the real coast, ink is yours.'); };
}
let showTruth=0;
// Signature moment: the Admiralty's wax seal is pressed onto the delivered chart
function pressSeal(names){ const el=document.getElementById('sealFx'); document.getElementById('sealTxt').textContent=(names[0]||'').slice(0,18); el.classList.remove('on'); void el.getBoundingClientRect(); el.classList.add('on'); setTimeout(VOICE.seal,420); }
document.getElementById('fixBtn').onclick=()=>tryFix();
function tryFix(){ if (!has('quadrant')&&!has('sextant')) return RH.toast('You need a quadrant or sextant to take a fix.'); ship.sail=0; fixing=2; RH.toast('Taking a sighting…'); }
document.getElementById('inkBtn').onclick=()=>{ inkOn=!inkOn; document.getElementById('inkBtn').textContent='🖋 Quill: '+(inkOn?'inking':'lifted'); };
document.getElementById('ashore').onclick=()=>goAshore();
document.getElementById('exportBtn').onclick=()=>{ const c=document.createElement('canvas'); c.width=WX; c.height=WY; drawChart(c.getContext('2d'), 1, 0, 0, true); const a=document.createElement('a'); a.download='my-chart.png'; a.href=c.toDataURL(); a.click(); };

// ===================== Rendering =====================
const cv=document.getElementById('chart'), ctx=cv.getContext('2d'); const lk=document.getElementById('look'), lctx=lk.getContext('2d');
let view={s:1,ox:0,oy:0};
function fit(){ const r=cv.getBoundingClientRect(), dp=Math.min(2,devicePixelRatio||1); cv.width=Math.max(1,r.width*dp|0); cv.height=Math.max(1,r.height*dp|0); view.base=Math.min(r.width/WX,r.height/WY)*0.97; view.w=r.width; view.h=r.height;
  if (view.z==null) view.z = r.width<600? 2 : 1; applyView(); lk.width=220*dp; lk.height=220*dp; }
// zoomed in, the chart follows the ship (believed position) and never shows past its edges
function applyView(){ const s=view.base*view.z; view.s=s; const fitAx=(len,W,c)=> W*s<=len? (len-W*s)/2 : Math.max(len-W*s, Math.min(0, len/2-c*s));
  view.ox=fitAx(view.w,WX,ship? ship.bx : WX/2); view.oy=fitAx(view.h,WY,ship? ship.by : WY/2); }
function setZoom(z){ view.z=Math.max(1,Math.min(4,z)); applyView(); }
document.querySelectorAll('#zoom [data-z]').forEach(b=>b.onclick=()=>setZoom(view.z*(b.dataset.z==='in'?1.5:1/1.5)));
let vellum=null;
function rose(c, x, y, R, full){ // a compass rose: 32 points, alternating ink and verdigris, fleur-de-lis north
  c.save(); c.translate(x,y);
  for (let k=31;k>=0;k--){ const a=k/32*Math.PI*2-Math.PI/2, L= k%8===0? R : k%4===0? R*0.72 : k%2===0? R*0.55 : R*0.4, w= k%8===0? R*0.12 : R*0.07;
    for (const side of [-1,1]){ c.beginPath(); c.moveTo(0,0); c.lineTo(Math.cos(a)*L,Math.sin(a)*L); c.lineTo(Math.cos(a+side*Math.PI/2)*w,Math.sin(a+side*Math.PI/2)*w); c.closePath();
      c.fillStyle= side<0? (k%8===0?'#2e2015':k%4===0?'#3f7f6a':'#9c1f1a') : '#f1e4c3'; c.fill(); c.strokeStyle='#2e2015'; c.lineWidth=0.8; c.stroke(); } }
  if (full){ c.strokeStyle='#2e2015'; c.lineWidth=1.2; c.beginPath(); c.arc(0,0,R*0.18,0,7); c.stroke(); c.beginPath(); c.arc(0,0,R*1.06,0,7); c.stroke(); c.beginPath(); c.arc(0,0,R*1.12,0,7); c.stroke();
    c.fillStyle='#2e2015'; c.font=`${R*0.3}px "IM Fell English SC",serif`; c.textAlign='center'; c.fillText('⚜',0,-R*1.18); }
  c.restore(); }
function makeVellum(){
  const v=document.createElement('canvas'); v.width=WX; v.height=WY; const c=v.getContext('2d');
  const gr=c.createRadialGradient(WX/2,WY/2,100,WX/2,WY/2,WX*0.7); gr.addColorStop(0,'#f0e2bc'); gr.addColorStop(1,'#d9c08a'); c.fillStyle=gr; c.fillRect(0,0,WX,WY);
  const r=RH.rng(7); for (let k=0;k<700;k++){ c.fillStyle=`rgba(120,86,40,${r()*0.045})`; c.beginPath(); c.arc(r()*WX,r()*WY,r()*46,0,7); c.fill(); }
  for (let k=0;k<5;k++){ const x=r()*WX, y=r()*WY, R=30+r()*60; c.strokeStyle='rgba(120,80,30,.12)'; c.lineWidth=2; c.beginPath(); c.arc(x,y,R,0,7); c.stroke(); c.fillStyle='rgba(150,110,50,.05)'; c.fill(); }
  for (let k=0;k<4000;k++){ c.fillStyle=`rgba(90,60,30,${r()*0.08})`; c.fillRect(r()*WX,r()*WY,1,1); }
  // rhumb lines from a ring of sixteen wind roses
  const cx=WX*0.52, cy=WY*0.5, RR=Math.min(WX,WY)*0.42; const nodes=[[cx,cy]]; for (let k=0;k<16;k++){ const a=k/16*Math.PI*2; nodes.push([cx+Math.cos(a)*RR, cy+Math.sin(a)*RR]); }
  c.lineWidth=0.8; nodes.forEach(([x,y],ni)=>{ for (let k=0;k<32;k++){ const a=k/32*Math.PI*2; c.strokeStyle= k%8===0? 'rgba(46,32,21,.22)' : k%4===0? 'rgba(63,127,106,.22)' : 'rgba(156,31,26,.16)'; if (ni && k%2) continue;
      c.beginPath(); c.moveTo(x,y); c.lineTo(x+Math.cos(a)*2000,y+Math.sin(a)*2000); c.stroke(); } });
  // a border of degrees
  c.strokeStyle='#2e2015'; c.lineWidth=2; c.strokeRect(8,8,WX-16,WY-16); c.lineWidth=1; c.strokeRect(16,16,WX-32,WY-32);
  for (let x=16;x<WX-16;x+=20){ c.fillStyle= (x/20|0)%2? '#2e2015':'#f1e4c3'; c.fillRect(x,8,20,8); c.fillRect(x,WY-16,20,8); }
  for (let y=16;y<WY-16;y+=20){ c.fillStyle= (y/20|0)%2? '#2e2015':'#f1e4c3'; c.fillRect(8,y,8,20); c.fillRect(WX-16,y,8,20); }
  rose(c, WX-120, WY-130, 70, true); rose(c, cx, cy, 26, false);
  // the engraver's sea: little wave strokes, and a serpent in the far corner
  c.strokeStyle='rgba(46,32,21,.28)'; c.lineWidth=1; for (let k=0;k<70;k++){ const x=40+r()*(WX-80), y=100+r()*(WY-140); c.beginPath(); for (let j=0;j<3;j++){ c.moveTo(x+j*9,y); c.quadraticCurveTo(x+j*9+4.5,y-4,x+j*9+9,y); } c.stroke(); }
  c.save(); c.translate(150,WY-120); c.strokeStyle='rgba(46,32,21,.55)'; c.fillStyle='rgba(63,127,106,.25)'; c.lineWidth=1.5;
  for (let j=0;j<3;j++){ c.beginPath(); c.arc(j*34,0,14,Math.PI,0); c.fill(); c.stroke(); } c.beginPath(); c.moveTo(-14,0); c.quadraticCurveTo(-30,-26,-44,-12); c.quadraticCurveTo(-36,-8,-30,-2); c.stroke(); c.beginPath(); c.arc(-40,-14,1.6,0,7); c.fill();
  c.beginPath(); c.moveTo(82,0); c.quadraticCurveTo(96,-18,104,-4); c.stroke(); c.font='italic 12px "IM Fell English",serif'; c.fillStyle='rgba(46,32,21,.6)'; c.fillText('Here be serpents',20,24); c.restore();

  return v; }
function drawChart(c, s, ox, oy, exportMode){
  const d=exportMode?1:Math.min(2,devicePixelRatio||1); c.setTransform(d*s,0,0,d*s,d*ox,d*oy);

  // truth overlay
  if (!exportMode && performance.now()<showTruth){ c.fillStyle='rgba(60,120,200,.5)'; for (const is of islands) for (const [x,y] of is.coast) c.fillRect(x-2,y-2,4,4); for (const rf of reefs){ c.fillStyle='rgba(200,60,60,.6)'; c.fillRect(rf.x-2,rf.y-2,4,4); } }

  // iron-gall ink: each inked point a small nib stroke, with shoreline hatching seaward
  c.fillStyle='rgba(46,32,21,.85)'; c.strokeStyle='rgba(46,32,21,.22)'; c.lineWidth=0.7;
  for (let i=0;i<S.ink.length;i++){ const [x,y]=S.ink[i]; c.fillRect(x-1.1,y-0.7,2.2,1.4); if (i%3===0){ c.beginPath(); c.moveTo(x+2,y+2); c.lineTo(x+6,y+5); c.stroke(); } }
  // port & ghost
  c.font='22px "IM Fell English",serif'; c.textAlign='center'; c.fillStyle='#2e2015'; c.fillText('⚓',port.x,port.y+7); c.font='italic 15px "IM Fell English",serif'; c.fillText('Port Haven',port.x,port.y+26);
  if (!S.done[6]){ c.strokeStyle='#9c1f1a'; c.setLineDash([5,5]); c.beginPath(); c.arc(ghost.x,ghost.y,40,0,7); c.stroke(); c.setLineDash([]); c.fillStyle='#9c1f1a'; c.font='italic 15px "IM Fell English",serif'; c.fillText(S.ghostSeen?'(no island here)':'? Isle of Mists ?', ghost.x, ghost.y+5); }
  // island names once well-charted, or once you have set foot there
  c.font='italic 17px "IM Fell English",serif'; c.fillStyle='#2e2015'; for (const is of islands) if (acc(is.id)>=30 || S.landed[is.id]){ c.fillText(is.name+(S.landed[is.id]?' ✠':''), is.cx, is.cy); }
  c.font='26px "IM Fell English SC",serif'; c.textAlign='left'; c.fillStyle='#2e2015'; c.fillText('A Chart of the Lost Islands', 44, 58); c.font='italic 14px "IM Fell English",serif'; c.fillText(`surveyed aboard ${document.getElementById('shipName').textContent}, anno 1680`, 44, 78);
  if (exportMode) return;
  // ship (believed position) + uncertainty
  const u=uncertainty(); c.strokeStyle='rgba(156,31,26,.55)'; c.setLineDash([3,4]); c.beginPath(); c.arc(ship.bx,ship.by,Math.max(6,u),0,7); c.stroke(); c.setLineDash([]);
  if (target){ // the dividers: two legs from ship to destination
    const mx=(ship.bx+target[0])/2, my=(ship.by+target[1])/2, dx=target[0]-ship.bx, dy=target[1]-ship.by, L=Math.hypot(dx,dy)||1, hx=mx-dy/L*Math.min(60,L*0.3), hy=my+dx/L*Math.min(60,L*0.3);
    c.strokeStyle='#6b5a3a'; c.lineWidth=2; c.beginPath(); c.moveTo(ship.bx,ship.by); c.lineTo(hx,hy); c.lineTo(target[0],target[1]); c.stroke(); c.fillStyle='#b58a3c'; c.beginPath(); c.arc(hx,hy,4,0,7); c.fill();
    c.strokeStyle='rgba(156,31,26,.6)'; c.lineWidth=1; c.setLineDash([2,6]); c.beginPath(); c.moveTo(ship.bx,ship.by); c.lineTo(target[0],target[1]); c.stroke(); c.setLineDash([]); }
  // a little galleon
  c.save(); c.translate(ship.bx,ship.by); c.rotate(ship.h); c.fillStyle='#5a3418'; c.strokeStyle='#2e2015'; c.lineWidth=1;
  c.beginPath(); c.moveTo(14,0); c.quadraticCurveTo(6,-6,-10,-5); c.lineTo(-12,0); c.lineTo(-10,5); c.quadraticCurveTo(6,6,14,0); c.fill(); c.stroke();
  c.fillStyle= ship.sail? '#f7efd8' : '#c9b68c'; for (const mx of [-5,3]){ c.beginPath(); c.ellipse(mx,0,2.2,ship.sail? 8:3,0,0,7); c.fill(); c.stroke(); }
  c.restore();
}
function uncertainty(){ return Math.hypot(ship.bx-ship.x, ship.by-ship.y); }
function drawLook(){
  const d=Math.min(2,devicePixelRatio||1), R=sightR(), sc=110/R; lctx.setTransform(d,0,0,d,0,0); lctx.clearRect(0,0,220,220);
  lctx.save(); lctx.beginPath(); lctx.arc(110,110,110,0,7); lctx.clip();
  lctx.fillStyle='#1a4a66'; lctx.fillRect(0,0,220,220);
  const step=CELL; for (let y=-R;y<=R;y+=step) for (let x=-R;x<=R;x+=step){ if (x*x+y*y>R*R) continue; if (isLand(ship.x+x,ship.y+y)){ lctx.fillStyle='#7a9a5a'; lctx.fillRect(110+x*sc,110+y*sc,step*sc+1,step*sc+1); } }
  for (const rf of reefs){ const x=rf.x-ship.x, y=rf.y-ship.y; if (x*x+y*y<(R*0.45)**2){ lctx.fillStyle='#e8e0d0'; lctx.beginPath(); lctx.arc(110+x*sc,110+y*sc,2.5,0,7); lctx.fill(); } }
  const t=performance.now()/600; lctx.strokeStyle='rgba(255,255,255,.08)'; for (let k=0;k<12;k++){ lctx.beginPath(); lctx.arc((k*53+t*10)%220,(k*91)%220,8,0,3); lctx.stroke(); }
  lctx.translate(110,110); lctx.rotate(ship.h); lctx.fillStyle='#e8d8b0'; lctx.beginPath(); lctx.moveTo(10,0); lctx.lineTo(-7,-5); lctx.lineTo(-7,5); lctx.closePath(); lctx.fill(); lctx.restore();
}
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  for (let k=0;k<2;k++) step(dt);
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  if (view.z>1) applyView();
  const [shx,shy]=FX.shakeOffset(6); drawChart(ctx, view.s, view.ox+shx, view.oy+shy); drawLook();
  const la=landfallIsle(); const ab=document.getElementById('ashore'); if ((la>=0)!==ab.classList.contains('on')){ ab.classList.toggle('on', la>=0); if (la>=0) ab.textContent=`⛵ Go ashore on ${islands[la].name}`; }
  hudT+=dt; if (hudT>0.3){ hudT=0; renderStatus(); if (atPort!==lastPort){ if (atPort && lastPort===false){ VOICE.bell(); logE('Made Port Haven. Our position is certain again.'); } lastPort=atPort; if (atPort){ ship.bx=ship.x; ship.by=ship.y; ship.voyageDmg=0; } renderPort(); } saveT++; if (saveT>15){ saveT=0; S.ship=ship; persist(); } }
  lastVoyageOk = ship.voyageDmg<=30;
  if (acc(reefIsle())>=55 && ship.voyageDmg<=30) S.reefOk=true;
  requestAnimationFrame(frame);
}
let last=performance.now(), hudT=0, lastPort=null, saveT=0, lastVoyageOk=true;
function renderStatus(){
  document.getElementById('gold').textContent=S.gold+'g'; document.getElementById('prov').textContent=Math.ceil(S.prov)+' days'; document.getElementById('provBar').style.width=S.prov+'%';
  document.getElementById('hull').textContent=Math.ceil(S.hull)+'%'; document.getElementById('hullBar').style.width=S.hull+'%';
  const u=uncertainty(); document.getElementById('unc').textContent= u<4? 'precise' : `~${Math.round(u)} leagues`;
  document.getElementById('hud').textContent = fixing>0? 'Taking a sighting…' : ['Sails furled','Half sail','Full sail'][ship.sail] + (atPort?' · in port':'');
  document.getElementById('fixBtn').disabled = !(has('quadrant')||has('sextant'));
  document.querySelectorAll('#sails [data-sail]').forEach(b=>b.classList.toggle('on', +b.dataset.sail===ship.sail));
  noteReady(); renderComs();
}
let readySeen=new Set();
function noteReady(){ COMS.forEach((c,i)=>{ if (S.done[i] || readySeen.has(i)) return; if (c.test()){ readySeen.add(i); FX.sfx('coin'); RH.toast(`<b>${c.n}</b> is ready. Deliver it at port for ${c.reward}g.`, 3600); logE(`The chart for "${c.n}" is good enough to sell.`); } }); }
function renderComs(){ document.getElementById('coms').innerHTML=COMS.map((c,i)=>`<div class="com ${S.done[i]?'done':''}"><div class="t">${S.done[i]?'<span class="seal" title="Delivered and sealed"></span>':''}${c.n} <span style="float:right;color:#7a5c32">${c.reward}g</span></div><div class="p">${c.d}</div>${S.done[i]?'':`<div class="p">Progress: ${c.prog()}${c.test()?' · <span class="ready">ready: deliver at port</span>':''}</div>`}</div>`).join('');
  document.getElementById('tot').textContent=`${Object.keys(S.done).length}/${COMS.length} commissions · ${Math.round(accAll())}% of coast charted${S.worlds?` · archipelago #${S.worlds+1}`:''}`; }
function renderInsts(){ document.getElementById('insts').innerHTML=INST.map(it=>`<div class="inst"><div><b>${it.n}</b><div class="p small">${it.d}</div></div>${has(it.k)?'<span>✓</span>':`<button data-i="${it.k}" ${!atPort||S.gold<it.cost?'disabled':''}>${it.cost}g</button>`}</div>`).join('');
  document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{ const it=INST.find(x=>x.k===b.dataset.i); if (S.gold<it.cost||!atPort) return; S.gold-=it.cost; S.inst[it.k]=1; persist(); RH.toast(`Bought: ${it.n}`); renderAll(); }); }
function renderAll(){ renderStatus(); renderPort(); renderInsts(); }
setInterval(()=>{ if (atPort) renderInsts(); }, 1000);

// ===================== Input =====================
window.addEventListener('keydown',e=>{ const k=e.key.toLowerCase(); if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey) return;
  if ((k==='w'||e.key==='ArrowUp') && fixing<=0){ ship.sail=Math.min(2,ship.sail+1); }
  if (k==='s'||e.key==='ArrowDown'){ ship.sail=Math.max(0,ship.sail-1); }
  if (k==='a'||e.key==='ArrowLeft') keys.a=1; if (k==='d'||e.key==='ArrowRight') keys.d=1;
  if (k==='f') tryFix(); if (e.key===' '){ ship.sail=0; e.preventDefault(); } });
window.addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if (k==='a'||e.key==='ArrowLeft') keys.a=0; if (k==='d'||e.key==='ArrowRight') keys.d=0; if (keys.a||keys.d) target=null; });
// one finger (or click) sets a course; two fingers pinch to zoom
const touches=new Map(); let pinch=null, beforeTap=null;
cv.addEventListener('pointerdown',e=>{ touches.set(e.pointerId,[e.clientX,e.clientY]);
  if (touches.size===2){ const [a,b]=[...touches.values()]; pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1, z:view.z}; if (beforeTap){ target=beforeTap.target; ship.sail=beforeTap.sail; } return; }
  beforeTap={target, sail:ship.sail};
  const r=cv.getBoundingClientRect(); const x=(e.clientX-r.left-view.ox)/view.s, y=(e.clientY-r.top-view.oy)/view.s; if (!(x>=0&&y>=0&&x<=WX&&y<=WY)) return; target=[x,y]; if (!ship.sail && fixing<=0) ship.sail=2; });
cv.addEventListener('pointermove',e=>{ if (!touches.has(e.pointerId)) return; touches.set(e.pointerId,[e.clientX,e.clientY]); if (pinch && touches.size>=2){ const [a,b]=[...touches.values()]; setZoom(pinch.z*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d); } });
const lift=e=>{ touches.delete(e.pointerId); if (touches.size<2) pinch=null; };
window.addEventListener('pointerup',lift); window.addEventListener('pointercancel',lift);
document.querySelectorAll('#sails [data-sail]').forEach(b=>b.onclick=()=>{ if (fixing>0) return; ship.sail=+b.dataset.sail; if (!ship.sail) target=null; renderStatus(); });
window.addEventListener('blur',()=>{ keys={}; });

function boot(){
  buildWorld(S.seed);
  if (islands.length<5 && !S.ink.length){ S.seed=playableSeed(S.seed+1); S.ship=null; buildWorld(S.seed); } // an old save on an unplayable world, not started yet
  hashInk(); inkSet=new Set(S.ink.map(([x,y])=>((x/4)|0)+','+((y/4)|0))); target=null; fixing=0; keys={}; readySeen=new Set(COMS.map((c,i)=>i).filter(i=>!S.done[i] && COMS[i].test()));
  const gr=RH.rng(S.seed+5); let gt=0; do { ghost={x:gr.range(300,WX-100), y:gr.range(100,WY-100)}; } while (islands.some(is=>Math.hypot(is.cx-ghost.x,is.cy-ghost.y)<200) && ++gt<500);
  ship = S.ship && !isLand(S.ship.x,S.ship.y) ? S.ship : newShip();
  document.getElementById('shipName').textContent = ['The Wandering Gull','The Patient Heron','The Small Hours','The Last Lantern'][(S.worlds||0)%4];
  squallT=70+rng.int(40); fit(); renderAll(); renderLog(); persist();
}
window.addEventListener('resize', fit);
S = cleanSave(S) || freshSave(Math.floor(Math.random()*1e9));
boot(); requestAnimationFrame(frame);
window.__map={ landfallIsle, goAshore, squall, logE, pressSeal, dirOf, hashCoast, buildWorld, acc, accAll, recall, precisions, nearestCoast, near, hashInk, cleanSave, freshSave, playableSeed, boot, step, ink, doFix, damage, renderAll, renderPort, COMS, INST, TOL, PREC_W, isLand, currentAt, uncertainty,
  get S(){ return S; }, set S(v){ S=v; }, get islands(){ return islands; }, set islands(v){ islands=v; }, get port(){ return port; }, get reefs(){ return reefs; }, get ship(){ return ship; }, set ship(v){ ship=v; }, get ghost(){ return ghost; },
  get target(){ return target; }, set target(v){ target=v; }, get fixing(){ return fixing; }, get atPort(){ return atPort; }, set atPort(v){ atPort=v; }, get view(){ return view; }, setZoom, applyView, get inkOn(){ return inkOn; }, set inkOn(v){ inkOn=v; }, get currents(){ return currents; }, get squallT(){ return squallT; }, set squallT(v){ squallT=v; }, get fixing(){ return fixing; }, set fixing(v){ fixing=v; } };
if (!S.intro){ S.intro=1; persist(); RH.modal(`<h2>The Mapmaker of Lost Islands</h2><p>It's 1680. Nobody has charted these islands. You will.</p><p>The big view is <b>your chart</b>, drawn where you <i>think</i> you are. The round lookout shows what's <i>really</i> there. Currents push you off course and your compass is a little off, so your chart drifts away from the truth unless you navigate well.</p><p>Sail close to coasts to ink them. Come back to port to deliver commissions and buy better instruments. Watch out for reefs.</p>`,[{label:'Weigh anchor'}]); }
</script>
