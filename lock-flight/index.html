<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lock Flight</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;overflow:hidden;background:#f3eee4;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;overscroll-behavior:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* sky and vignette live in CSS so the compositor paints them, not the canvas, every frame */
  #sky{position:fixed;inset:0;background:linear-gradient(#dfeaee,#f3eee4)}
  #vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(60,40,20,0) 55%,rgba(60,40,20,.16) 100%)}
  .chip{position:fixed;background:rgba(255,253,248,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(40,36,30,.08);border-radius:16px;color:#2a2622;box-shadow:0 12px 32px -14px rgba(60,40,20,.35)}
  #hud{top:16px;left:16px;padding:12px 16px;width:340px}
  #hud .home{color:#8a8175;font-size:12px;text-decoration:none}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #hud h1{margin:4px 0 2px;font-size:21px;letter-spacing:-.02em;cursor:pointer}
  #hud h1 small{font-size:12px;color:#8a8175;font-weight:500;margin-right:6px}
  #story{font-size:13.5px;line-height:1.42;color:#5b544b;margin:4px 0 8px}
  #hud.mini #story{display:none}
  #hud.mini h1::after{content:' ⓘ';font-size:.6em;color:#8a8175;font-weight:500}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:4px}
  .stat b{display:block;font-size:20px;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
  .stat span{font-size:10.5px;color:#8a8175;text-transform:uppercase;letter-spacing:.06em}
  .stat.ok b{color:#2c8a56}.stat.bad b{color:#c8452f}
  .wbar{margin-top:8px;font-size:12px;color:#5b544b}
  .wbar .track{height:9px;border-radius:5px;background:#e3dccf;position:relative;overflow:hidden;margin-top:3px}
  .wbar .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f7fa6,#5cb6d6);border-radius:5px;transition:width .3s}
  .wbar .res{position:absolute;top:0;bottom:0;background:#9fd0e2;transition:width .3s,left .3s}
  .wbar.warn .fill{background:linear-gradient(90deg,#c8452f,#e9a23b)}
  .wbar .row2{display:flex;justify-content:space-between}
  #goals{font-size:12px;color:#8a8175;margin-top:6px}
  #goals i{font-style:normal;color:#c9a227}
  #tools{bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:5px;padding:7px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
  .tool{border:0;background:#efe8dc;border-radius:12px;padding:8px 12px;font:inherit;font-size:14px;color:#2a2622;cursor:pointer;display:flex;gap:5px;align-items:center;white-space:nowrap;transition:transform .08s,background .15s}
  .tool:active{transform:scale(.94)}
  .tool.on{background:#2a2622;color:#fbf7ef}
  .tool.pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 4px rgba(224,102,58,.45)}}
  .tool i{font-style:normal;background:#e0663a;color:#fff;border-radius:8px;padding:0 6px;font-size:11px}
  #lvBox #levels{top:16px;right:16px;padding:8px;width:240px;max-height:calc(100vh - 110px);overflow:auto;display:none;z-index:5}
  #lvBox.open #levels{display:block}
  #levels h4{margin:6px 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8a8175}
  .lv{padding:5px 8px;border-radius:9px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px}
  .lv:hover{background:#efe8dc}
  .lv.cur{background:#2a2622;color:#fbf7ef}
  .lv.lock{opacity:.35;pointer-events:none}
  .lv img{width:34px;height:21px;border-radius:3px;object-fit:cover;box-shadow:0 1px 3px #0003}
  .lv .st{color:#c9a227;font-size:11px;letter-spacing:-1px}
  #lvBtn{display:block;position:static;font:inherit;font-size:13px;padding:4px 10px;border-radius:10px;cursor:pointer;box-shadow:none}
  #queue{bottom:76px;left:50%;transform:translateX(-50%);display:none;gap:4px;padding:6px 8px;align-items:center;max-width:calc(100vw - 24px);overflow:hidden;touch-action:none;font-size:12px}
  #queue>span{color:#8a8175;margin-right:4px;white-space:nowrap}
  .qb{display:flex;gap:3px;align-items:center;padding:3px 8px;border-radius:9px;background:#efe8dc;cursor:grab;white-space:nowrap;font-variant-numeric:tabular-nums;transition:transform .15s}
  .qb.drag{background:#2a2622;color:#fff;cursor:grabbing;transition:none;z-index:2}
  .qb em{width:9px;height:9px;border-radius:3px;display:inline-block}
  #receipts{right:16px;bottom:16px;padding:8px 12px;width:230px;font-size:12px;color:#5b544b;display:none}
  #receipts h4{margin:0 0 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#8a8175}
  #receipts div{display:flex;justify-content:space-between;padding:2px 0;border-top:1px dashed #e0d8ca;font-variant-numeric:tabular-nums}
  #banner{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;font-size:40px;font-weight:700;letter-spacing:-.03em;color:#2a2622;pointer-events:none;transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1);text-align:center;text-shadow:0 2px 18px rgba(255,250,240,.9)}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #banner small{display:block;font-size:16px;font-weight:500;color:#5b544b;margin-top:6px}
  .modal-bg{background:rgba(40,32,24,.35);backdrop-filter:blur(3px)}
  .modal{background:#fbf8f2;color:#2a2622;border:1px solid rgba(40,36,30,.1);font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;box-shadow:0 30px 60px -20px rgba(60,40,20,.4)}
  .modal button{background:#efe8dc;color:#2a2622;border:0;border-radius:10px;padding:8px 16px}
  .modal button.primary{background:#2a2622;color:#fbf7ef}
  .photo{background:#fff;padding:8px 8px 26px;box-shadow:0 8px 24px -8px #0005;transform:rotate(-1.5deg);margin:6px auto 12px;width:max-content;max-width:100%;position:relative}
  .photo img{display:block;max-width:100%;width:320px}
  @media (max-width:760px){.photo img{width:210px}}
  .photo span{position:absolute;bottom:5px;left:10px;font-size:12px;color:#5b544b}
  .stars{font-size:30px;color:#c9a227;letter-spacing:4px;text-align:center}
  .stars s{color:#d9d1c3;text-decoration:none}
  .ledger{font-size:13px;color:#5b544b;display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:8px}
  .ledger b{font-variant-numeric:tabular-nums}
  .aha{margin:10px 0 0;font-size:13.5px;line-height:1.4;color:#2a2622;background:#f1ebdf;border-radius:10px;padding:8px 10px}
  .tip{margin:8px 0 0;font-size:13px;color:#5b544b}
  .wchart{margin-top:10px;position:relative}
  .wchart h5{margin:0 0 6px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:#8a8175;font-weight:500;display:flex;justify-content:space-between}
  .wc-row{display:grid;grid-template-columns:118px 1fr 84px;gap:8px;align-items:center;font-size:12.5px;color:#5b544b;margin:3px 0}
  .wc-row.you{color:#2a2622;font-weight:700}
  .wc-track{height:12px;position:relative}
  .wc-track i{position:absolute;left:0;top:0;bottom:0;background:#b9b0a2;border-radius:0 4px 4px 0}
  .wc-row.you .wc-track i{background:#2f7fa6}
  .wc-row b{font-variant-numeric:tabular-nums;font-weight:500}.wc-row.you b{font-weight:700}
  .wc-row em{font-style:normal;font-size:11px;color:#c8452f}
  .wc-cols{height:70px;display:flex;align-items:flex-end;gap:2px;position:relative;border-bottom:1px solid #d9d1c3}
  .wc-cols i{flex:1;max-width:18px;border-radius:4px 4px 0 0}
  .u{background:#2f7fa6}.d{background:#e9a23b}
  .wc-leg{text-transform:none;letter-spacing:0;font-size:11px;display:flex;gap:4px;align-items:center}
  .wc-leg i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-left:6px}
  .wc-one{position:absolute;left:0;right:0;border-top:1px dashed #8a8175;pointer-events:none}
  .wc-one span{position:absolute;right:0;top:-14px;font-size:10px;color:#8a8175}
  .picks{display:grid;gap:8px;margin-top:10px}
  .picks button{text-align:left;padding:10px 12px}
  .picks button.sel{outline:2px solid #2a2622}
  @media (max-width:900px){#lvBox #levels{top:12px;right:12px;max-height:calc(100vh - 24px)}#receipts{display:none!important}}
  @media (max-width:760px){
    #hud{top:8px;left:8px;width:calc(100vw - 16px);padding:9px 12px}
    #hud h1{font-size:17px;margin:2px 0}
    #story{font-size:12px;line-height:1.35;margin:3px 0 5px}
    .stat b{font-size:16px}.stat span{font-size:9.5px}
    .wbar{margin-top:5px}
    #goals{margin-top:4px;font-size:11px}
    #tools{bottom:8px;padding:5px;gap:4px}
    .tool{padding:8px 10px;font-size:13px}
    #queue{bottom:62px}
    #banner{font-size:28px;width:90vw}
  }
  @media (max-width:420px){#tools{gap:3px;padding:4px}.tool{padding:7px 8px;font-size:12.5px;gap:3px}}
</style>
</head>
<body>
<div id="sky"></div><canvas id="cv"></canvas><div id="vig"></div>
<div id="hud" class="chip">
  <div class="hrow"><a class="home" href="../index.html">← Rabbit Holes</a><button id="lvBtn" class="chip">☰</button></div>
  <h1 id="title">Lock Flight</h1>
  <div id="story"></div>
  <div class="stats">
    <div class="stat" id="stD"><b id="vD">0/0</b><span>delivered</span></div>
    <div class="stat" id="stT"><b id="vT">0:00</b><span>time left</span></div>
    <div class="stat" id="stW"><b id="vW">–</b><span>water/boat</span></div>
    <div class="stat" id="stA"><b id="vA">–</b><span>avg wait</span></div>
  </div>
  <div class="wbar" id="wbar"><div class="row2"><span id="wLbl">Summit water</span><span id="wDry"></span></div><div class="track"><div class="fill" id="wFill"></div><div class="res" id="wRes"></div></div></div>
  <div id="goals"></div>
</div>
<div id="lvBox"><div id="levels" class="chip"></div></div>
<div id="queue" class="chip"></div>
<div id="receipts" class="chip"></div>
<div id="tools" class="chip"></div>
<div id="banner"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
// ================= constants =================
// Units: height in "rises" (one lock = 1), volume in "lockfuls" (one standard chamber x one rise = 1).
const ZS = 22, CL = 46, BL = 30, DT = 1 / 30;
const EQ = 0.02;          // gates open only when levels agree to within this
const PK = 0.3, PKP = 0.34, GK = 3, WK = 2.2; // paddle, side-pond paddle, open gate, weir coefficients
const SPD = 28;           // boat speed, world px / s
const PAL = ['#e0663a', '#2f9e8f', '#e9b53b', '#6b5bd2', '#d8456b', '#3a7bd5', '#7a9a3a', '#b8653a'];

// ================= level vocabulary =================
const R = (len = 150) => ({ t: 'river', len });
const P = (len = 90, A = 3) => ({ t: 'pound', len, A });
const S = (len = 210, A = 10) => ({ t: 'summit', len, A });
const K = (dz = 1, o = {}) => ({ t: 'lock', dz, ...o });
const stair = (n, dz = 1, o = {}) => Array.from({ length: n }, () => K(dz, o));
const flight = (n, dz = 1, pl = 80, pA = 3, o = {}) => { const a = []; for (let i = 0; i < n; i++) { if (i) a.push(P(pl, pA)); a.push(K(dz, o)); } return a; };
const bt = (t, d, o = {}) => ({ t, d, ...o });
const pat = (s, t0, gap) => [...s].map((c, i) => bt(t0 + i * gap, c === '+' || c === 'V' || c === 'F' ? 1 : -1, { vip: c === 'V' || c === 'v', per: c === 'F' || c === 'f' ? 240 : 0 }));

const LV = [
  { n: 'One Lock', story: 'A boat wants to climb. <b>Tap the bottom gate</b> to let it in, <b>tap the chamber</b> to fill it from the pound above, then <b>tap the top gate</b>. Gates only open when the water on both sides is level.',
    seq: [R(160), K(1), S(230, 8)], feed: .3, boats: [bt(1, 1)], goal: 1, time: 150, wpb: 1.05, wait: 25, hint: 1 },
  { n: 'Two-Way Traffic', story: 'Boats now come from both ends, and the summit holds only a few lockfuls. Every fill is water lost downhill. Watch what the chamber is doing when each boat leaves it.',
    seq: [R(160), K(1), S(230, 5)], feed: .55, boats: [bt(1, 1), bt(2, -1), bt(50, 1), bt(52, -1), bt(105, -1), bt(106, 1), bt(160, 1), bt(161, -1)], goal: 8, time: 420, wpb: .6, wait: 45, hint: 1 },
  { n: 'A Flight of Three', story: 'Three locks with short pounds between them. Each lockful you take from a pound leaves it lower; too low and boats run aground. Fill one too full and it spills over the weir.',
    seq: [R(150), ...flight(3, 1, 90, 2.6), S(220, 10)], feed: .8, boats: [bt(1, 1), bt(25, 1), bt(70, -1), bt(110, 1), bt(150, -1), bt(185, 1)], goal: 6, time: 600, wpb: 1.1, wait: 90, hint: 1 },
  { n: 'Over the Top', story: 'A summit level: locks fall away on <b>both</b> sides. Boats crossing the summit draw a lockful from it going up and another coming down. Rain and a feeder stream are all that refill it.',
    seq: [R(150), ...flight(2, 1, 90, 3), S(220, 12), ...flight(2, -1, 90, 3), R(150)], feed: 1, boats: pat('+-+-+--+', 1, 45), goal: 8, time: 780, wpb: 1.3, wait: 110 },
  { n: 'The Lock-Keeper', story: 'Turn on the <b>Keeper</b> and he works the locks for you, one boat at a time, first come first served. Your job is the water and the schedule. Use <b>fast-forward</b>.',
    seq: [R(140), ...flight(5, 1, 70, 3), S(220, 14)], feed: 1.2, boats: pat('++-+--++-+', 1, 40), goal: 10, time: 1000, wpb: 1.2, wait: 150, keeper: 'on' },
  { n: 'Drought', story: 'The feeder stream dries up a minute in, and boats arrive in clumps. Tap the label over each lock to change how its keeper chooses boats: <b>FIFO</b>, <b>ALT</b> (alternate directions) or <b>BATCH</b>.',
    seq: [R(160), K(1), S(240, 9)], feed: 1, boats: [0, 110, 220].flatMap(t => pat('++--', t + 1, 1.5)), goal: 12, time: 1000, wpb: .5, wait: 120, keeper: 'on', policy: 'FIFO', events: [{ t: 60, type: 'drought' }] },
  { n: 'Bingley Five Rise', story: 'Bingley, 1774: five chambers with no pounds between them. Each chamber fills from the one above. You cannot pass inside, and the whole staircase must be <b>full before a boat goes up</b> and <b>empty before one comes down</b>.',
    seq: [R(160), ...stair(5), S(240, 16)], feed: .6, boats: pat('+-+-+-+-+-', 1, 30), goal: 10, time: 1500, wpb: 1.6, wait: 260, keeper: 'on', policy: 'ALT' },
  { n: 'Staircase & Flight', story: 'Two single locks below a three-rise staircase. Each lock gets its own policy: what saves water in one wastes it in the other.',
    seq: [R(140), ...flight(2, 1, 80, 3), P(100, 4), ...stair(3), S(220, 16)], feed: .8, boats: pat('+-+-+-+-+-', 1, 35), goal: 10, time: 1500, wpb: 1.3, wait: 240, keeper: 'on', policy: 'FIFO' },
  { n: 'Side Pond', story: 'A <b>side pond</b> sits beside the chamber at one-third height. Tap it to switch it on. Draining, the top third goes into the pond, not downhill; filling, it comes back first.',
    seq: [R(160), K(1, { ponds: 1, pondsOff: 1 }), S(230, 5)], feed: .4, boats: pat('++-++-++', 1, 40), goal: 8, time: 700, wpb: .5, wait: 70, keeper: 'on', policy: 'FIFO' },
  { n: 'Caen Hill', story: 'Kennet &amp; Avon, 1810: sixteen locks up the hill, each short pound widened into a big <b>side pound</b> so it can hold a lockful. Drag to pan; pinch or scroll to zoom.',
    seq: [R(140), ...flight(16, 1, 52, 6), S(240, 26)], feed: 1.6, boats: pat('+-+-++--+-+-', 1, 60), goal: 12, time: 3000, wpb: 1.2, wait: 420, keeper: 'on', policy: 'ALT' },
  { n: 'Back-Pump', story: 'A dry summer, and no feeder at all. Since 1996 Caen Hill has had a <b>back-pump</b> that returns water from the bottom to the top. It runs on electricity, and you have a limited budget.',
    seq: [R(140), ...flight(6, 1, 60, 4), S(220, 8)], feed: 0, boats: pat('++-+-++-+-++', 1, 45), goal: 12, time: 1500, wpb: .6, wait: 200, keeper: 'on', policy: 'ALT', pump: { energy: 9 } },
  { n: 'Reservoir & Dam', story: 'The summit is small, but a dammed <b>reservoir</b> stands above it. Open the sluice when you need water. A storm will refill it, but only once.',
    seq: [R(140), ...flight(2, 1, 80, 3), S(180, 5), ...flight(2, -1, 80, 3), R(140)], feed: 0, res: { V: 9, max: 24, feed: 0 }, boats: pat('+-+-+-+-+-+-', 1, 50), goal: 12, time: 1400, wpb: 1.3, wait: 160, keeper: 'on', policy: 'ALT', events: [{ t: 420, type: 'rain', dur: 140, mul: 1, res: 4 }] },
  { n: 'Foxton', story: 'Foxton: two staircases of five with a passing pound between. In 1900 the canal company built an <b>inclined plane</b> beside it: two counterweighted tanks that lift boats using almost no water. The steam engine has coal for <b>four runs</b>.',
    seq: [R(150), ...stair(5), P(110, 5), ...stair(5), S(230, 22)], feed: 1.2, boats: pat('+-++-+--+-', 1, 40), goal: 10, time: 2200, wpb: 1.2, wait: 400, keeper: 'on', policy: 'BATCH', plane: { runs: 4 } },
  { n: 'Leaky Gates', story: 'Old oak gates start to <b>leak</b>, bleeding water downhill all the time. Tap a leaking gate to send the repair crew.',
    seq: [R(140), ...flight(5, 1, 70, 3), S(220, 9)], feed: .6, boats: pat('+-+-+-+-+-', 1, 40), goal: 10, time: 1100, wpb: .8, wait: 140, keeper: 'on', policy: 'ALT', crew: 1,
    events: [{ t: 40, type: 'leak', k: 2 }, { t: 160, type: 'leak', k: 6 }, { t: 320, type: 'leak', k: 4 }, { t: 470, type: 'leak', k: 8 }] },
  { n: 'Storm', story: 'A storm is coming. Weirs carry spare water down, but not this much. Tap a pound to open its <b>flood paddle</b> before the towpath floods. Close it after, or the summit drains away.',
    seq: [R(140), ...flight(2, 1, 90, 3), S(200, 10), ...flight(2, -1, 90, 3), R(140)], feed: .5, boats: pat('+-+-+-+-+-', 1, 45), goal: 10, time: 1200, wpb: 1.2, wait: 160, keeper: 'on', policy: 'ALT', fw: 1,
    events: [{ t: 120, type: 'storm', dur: 150, rate: .45 }] },
  { n: 'Wide Locks', story: 'Broad chambers take <b>two boats side by side</b>, and twice the water. The <b>PAIR</b> policy waits a little for a second boat.',
    seq: [R(140), ...flight(3, 1, 90, 6, { wide: 1 }), S(230, 16)], feed: .8, boats: [...pat('++-+-++--+-+', 1, 22), ...pat('+-+-', 400, 60)], goal: 16, time: 1500, wpb: 1.1, wait: 160, keeper: 'on', policy: 'FIFO', picks: 1, events: [{ t: 500, type: 'ice', dur: 240 }] },
  { n: 'Agua Clara', story: 'Panama, 2016: three chambers in a row, each with <b>three water-saving basins</b>. Gatun Lake is also Panama\'s drinking water, so the canal is metered.',
    seq: [R(170), ...stair(3, 1, { ponds: 3 }), S(260, 18)], feed: .5, draw: .35, boats: pat('+-+-+V+-+-', 1, 45), goal: 10, time: 1500, wpb: .7, wait: 200, keeper: 'on', policy: 'BATCH', picks: 1 },
  { n: 'Panama', story: 'Atlantic to Pacific over Gatun Lake. A drought is forecast. Endless mode: keep ships moving for as long as the lake lasts. Deliver 20 to clear.',
    seq: [R(170), ...stair(3, 1, { ponds: 3 }), S(300, 40), ...stair(3, -1, { ponds: 3 }), R(170)], feed: 1.3, draw: .3, boats: pat('+-+-V-+F-+', 1, 50), goal: 20, time: 0, endless: 1, wpb: 1.3, wait: 220, keeper: 'on', policy: 'BATCH', picks: 1,
    events: [{ t: 700, type: 'drought' }] },
];

// What each level is trying to teach, shown with a water chart after it ends.
// cmp rows: [label, water per boat, ran dry?] measured by running the keeper on the level's own boats.
const AHA = {
  0: { aha: 'A boat going up takes one lockful from above. That water is gone downhill for good.' },
  1: { aha: 'A boat leaving the chamber leaves it set for a boat going the <b>other</b> way. Alternate directions and every second boat rides free: half the water.' },
  2: { aha: 'In a flight, each lockful taken from the summit is passed down from pound to pound. The pounds only lend water; the summit pays.' },
  3: { aha: 'Crossing a summit costs a lockful up and another down, unless a boat from the far side has left the chamber where you need it.' },
  4: { aha: 'The keeper is cheap with water when boats alternate. His receipts show who paid and who rode free.' },
  5: { aha: 'Boats arriving in clumps: first come, first served sends two the same way in a row, and the second pays in full. Alternating halves it.', tip: 'Tap the label over the lock to switch it to <b>ALT</b>.',
    cmp: [['Keeper · FIFO', .60, 1], ['Keeper · ALT', .39]] },
  6: { aha: 'A staircase is the opposite of a single lock: a boat going up after one came down has to refill <b>every</b> chamber. Send convoys the same way.', tip: 'Switch the staircase to <b>BATCH</b>.',
    cmp: [['Keeper · ALT', 3.27, 1], ['Keeper · BATCH', 1.18]] },
  7: { aha: 'Single locks want alternation; the staircase wants convoys. Each lock needs its own policy.', tip: 'Give the three-rise staircase <b>BATCH</b>.',

    $('tools').querySelectorAll('[data-a]').forEach(b => b.onpointerdown = e => {
      e.preventDefault(); const a = b.dataset.a;
      if (a === 'pause') togglePause();
      else if (a.startsWith('sp')) { speed = +a.slice(2); FX.sfx('click'); }
      else if (a === 'keeper') toggleKeeper();
      else if (a === 'pump') { if (pump.energy > 0) pump.on = pump.on ? 0 : 1; FX.sfx(pump.on ? 'zap' : 'click'); }
      else if (a === 'res') { res.on = res.on ? 0 : 1; FX.sfx('whoosh'); }
      else if (a === 'plane') { plane.on = plane.on ? 0 : 1; FX.sfx('click'); }
      else if (a === 'reset') { FX.sfx('pop'); load(LI, { extra: pickUp }); return; }
      renderTools();
    });
  }
}
function renderUI() {
  renderTools();
  $('title').innerHTML = `<small>${LI + 1}/${LV.length}</small>${L.n}`;
  $('story').innerHTML = L.story;
  $('goals').innerHTML = `<i>★</i> deliver ${L.goal}${L.time ? ` in ${fmtT(L.time)}` : ''} · <i>★</i> ≤ ${L.wpb} lockful/boat · <i>★</i> wait ≤ ${fmtT(L.wait)}`;
  const maxOpen = (() => { let m = 0; while (m < LV.length - 1 && SAVE.done[m]) m++; return m; })();
  $('levels').innerHTML = '<h4>Canals</h4>' + LV.map((l, i) => `<div class="lv ${i === LI ? 'cur' : ''} ${i > maxOpen && !SAVE.done[i] ? 'lock' : ''}" data-i="${i}"><span>${i + 1}. ${l.n}</span><span>${SAVE.photos[i] ? `<img src="${SAVE.photos[i]}" alt="">` : ''}<span class="st">${SAVE.done[i] ? '★'.repeat(SAVE.done[i]) : ''}</span></span></div>`).join('');
  $('levels').querySelectorAll('.lv').forEach(el => el.onclick = () => { FX.sfx('click'); $('lvBox').classList.remove('open'); startLevel(+el.dataset.i); });
  $('lvBtn').textContent = `☰ ${LI + 1}/${LV.length}`;
  $('queue').style.display = L.keeper ? 'flex' : 'none';
  renderQueue(); renderReceipts();
  $('hud').classList.remove('mini'); hud.auto = 0;
}
$('lvBtn').onclick = e => { e.stopPropagation(); FX.sfx('click'); $('lvBox').classList.toggle('open'); };
$('title').onclick = () => setMini(!$('hud').classList.contains('mini'));
function setMini(on) { if ($('hud').classList.contains('mini') === on) return; $('hud').classList.toggle('mini', on); setTimeout(() => fitView(!cam.user), 0); }
// queue: drag to reorder priority, tap to bring to the front
let qDrag = null;
function renderQueue() {
  if (!L || !L.keeper || qDrag) return;
  const live = boats.filter(b => b.state !== 'done').sort((a, b) => a.pri - b.pri).slice(0, 9);
  const html = `<span>Queue</span>` + (live.length ? live.map(b => `<div class="qb" data-id="${b.id}"><em style="background:${b.col}"></em>${b.dir > 0 ? '→' : '←'}${b.id}${b.vip ? '★' : ''}</div>`).join('') : '<span>empty</span>');
  if ($('queue').innerHTML !== html) $('queue').innerHTML = html;
}
$('queue').addEventListener('pointerdown', e => {
  const el = e.target.closest('.qb'); if (!el) return;
  $('queue').setPointerCapture(e.pointerId); FX.sfx('click');
  qDrag = { el, x0: e.clientX, moved: false, id: +el.dataset.id }; el.classList.add('drag');
});
$('queue').addEventListener('pointermove', e => {
  if (!qDrag) return; const dx = e.clientX - qDrag.x0; if (Math.abs(dx) > 4) qDrag.moved = true;
  qDrag.el.style.transform = `translateX(${dx}px)`;
});
$('queue').addEventListener('pointerup', e => {
  if (!qDrag) return;
  const els = [...$('queue').querySelectorAll('.qb')], ids = els.map(x => +x.dataset.id);
  const r = qDrag.el.getBoundingClientRect(), cx = r.left + r.width / 2;
  let to = qDrag.moved ? els.filter(x => x !== qDrag.el && x.getBoundingClientRect().left + x.getBoundingClientRect().width / 2 < cx).length : 0;
  const order = ids.filter(i => i !== qDrag.id); order.splice(to, 0, qDrag.id);
  const base = Math.min(...boats.map(b => b.pri)) - order.length;
  order.forEach((id, k) => { const b = boatById(id); if (b) b.pri = base + k; });
  qDrag.el.classList.remove('drag'); qDrag = null; FX.sfx('pop'); renderQueue();
});
function renderReceipts() {
  const el = $('receipts');
  if (!receipts.length) { el.style.display = 'none'; return; }
  el.style.display = innerWidth > 900 ? 'block' : 'none';
  el.innerHTML = '<h4>Water receipts</h4>' + receipts.slice(0, 5).map(r => `<div><span style="color:${r.col}">■</span><span>#${r.id} ${r.dir > 0 ? '→' : '←'}</span><b>${r.water.toFixed(2)}</b><span>${fmtT(r.wait)}</span></div>`).join('');
}
const ui = {};
const setText = (id, v) => { if (ui[id] !== v) { ui[id] = v; $(id).textContent = v; } };
const setCls = (id, v) => { if (ui['c' + id] !== v) { ui['c' + id] = v; $(id).className = v; } };
function hud() {
  if (innerWidth < 760 && T > 20 && !hud.auto) { hud.auto = 1; setMini(true); } // phones: fold the story away once play is under way
  setText('vD', `${delivered}/${L.goal}`);
  setText('vT', L.time ? fmtT(L.time - T) : fmtT(T));
  if (ui.stT !== !!L.time) { ui.stT = !!L.time; $('stT').querySelector('span').textContent = L.time ? 'time left' : 'elapsed'; }
  const w = wpb(); setText('vW', isFinite(w) ? w.toFixed(2) : '–'); setCls('stW', 'stat' + (isFinite(w) ? (w <= L.wpb ? ' ok' : ' bad') : ''));
  const aw = avgWait(); setText('vA', fmtT(aw)); setCls('stA', 'stat' + (isFinite(aw) ? (aw <= L.wait ? ' ok' : ' bad') : ''));
  const us = usable(), cap = capacity(), sV = sIdx >= 0 ? Math.max(0, (lev(B[sIdx]) - (B[sIdx].nom - .55)) * B[sIdx].A) : 0;
  $('wFill').style.width = Math.min(100, sV / cap * 100).toFixed(1) + '%';
  $('wRes').style.left = Math.min(100, sV / cap * 100).toFixed(1) + '%'; $('wRes').style.width = res ? Math.min(100, res.V / cap * 100).toFixed(1) + '%' : '0';
  setText('wLbl', `Summit water${res ? ' + reservoir' : ''}: ${us.toFixed(1)} lockfuls`);
  const r = outflowEMA, dry = r < -1e-4 ? us / -r : Infinity;
  setText('wDry', dry < 36000 ? `dry in ~${fmtT(dry)}` : r > 1e-4 ? 'rising' : 'holding');
  setCls('wbar', 'wbar' + (dry < 120 || us < 1.2 ? ' warn' : ''));
  if (pump) { const b = $('tools').querySelector('[data-a="pump"] i'); if (b) b.textContent = pump.energy.toFixed(1); }
  if (pump && !pump.on && $('tools').querySelector('[data-a="pump"].on')) renderTools();
}

// ================= loop =================
let last = performance.now(), acc = 0, raf = 0, hudT = 0;
const PERF = { step: 0, draw: 0, frames: 0, steps: 0 };
function loop(now) {
  raf = requestAnimationFrame(loop);
  const rdt = Math.min(.05, (now - last) / 1000); last = now;
  if (!FX.frozen()) {
    acc += rdt * speed;
    const t0 = performance.now();
    let n = 0; while (acc >= DT && n < 40) { step(DT); acc -= DT; n++; }
    if (n >= 40) acc = 0;
    for (const f of floats) f.t += rdt;
    stepParticles(rdt);
    PERF.step += performance.now() - t0; PERF.steps += n;
  }
  const t1 = performance.now();
  draw(now);
  PERF.draw += performance.now() - t1; PERF.frames++;
  if ((hudT += rdt) > .15) { hudT = 0; hud(); renderQueueThrottled(); }
}
let qT = 0; function renderQueueThrottled() { if ((qT += 1) % 4 === 0) renderQueue(); }
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); } });

// ================= debug / test API =================
window.__lock = {
  LV, load: (i, o) => load(i, o || {}),
  tick: sec => { const n = Math.round(sec / DT); for (let i = 0; i < n; i++) step(DT); return __lock.state(); },
  gate: (gi, open = true) => open ? requestOpen(gi, true) : (G[gi].want = 0, true),
  op: (gi) => startOp(gi, true),
  fill: ci => startOp(B[ci].upG, true), drain: ci => startOp(B[ci].loG, true),
  ponds: (ci, on) => { B[ci].pondsOn = on ? 1 : 0; },
  keeper: (on, policy) => { keeperOn = !!on; if (policy) U.forEach(u => u.policy = policy); if (!on) U.forEach(u => { u.k.phase = 'idle'; u.k.boats = []; }); renderTools(); },
  policy: (ui, p) => { U[ui].policy = p; },
  schedule: list => { sched = list.map(o => ({ ...o })).sort((a, b) => a.t - b.t); nextBoat = 0; },
  set: o => { if ('pump' in o && pump) pump.on = o.pump; if ('res' in o && res) res.on = o.res; if ('plane' in o && plane) plane.on = o.plane; if ('speed' in o) speed = o.speed; },
  fix: gi => { if (crew) { crew.tgt = gi; } },
  floodWeir: (bi, on) => { B[bi].fw = on ? 1 : 0; },
  state: () => ({ T, state, delivered, spoiled, goal: L.goal, total: total(), ledger: { ...ledger }, usable: usable(), wpb: wpb(), avgWait: avgWait(), stars: state === 'won' || state === 'endless' ? stars() : 0,
    basins: B.map(b => ({ i: b.i, kind: b.kind, level: lev(b), V: b.V, lo: b.lo, hi: b.hi, nom: b.nom, ponds: b.ponds ? b.ponds.map(p => p.V) : undefined, op: !!b.op })),
    gates: G.map(x => x && { i: x.i, x: x.x, o: x.o, paddle: x.paddle, leak: x.leak }),
    boats: boats.map(b => ({ id: b.id, dir: b.dir, b: b.b, x: b.x, state: b.state, water: b.water, wait: b.wait, grounded: b.grounded })),
    units: U.map(u => ({ chs: u.chs, policy: u.policy, phase: u.k.phase })), receipts: receipts.slice() }),
  view: () => ({ ...cam, W, H, dpr }),
  bench: (n = 200, flush) => { const t0 = performance.now(); for (let i = 0; i < n; i++) { draw(performance.now()); if (flush) g.getImageData(0, 0, 1, 1); } const t1 = performance.now(); for (let i = 0; i < n; i++) step(DT); return { draw: (t1 - t0) / n, step: (performance.now() - t1) / n }; },
  perf: reset => { const r = { ...PERF }; if (reset) { PERF.step = PERF.draw = PERF.frames = PERF.steps = 0; } return r; },
  hint: () => { const h0 = hintOn; hintOn = true; const h = hintTarget0(); hintOn = h0; return h; },
  scr: (x, z) => [sx(x) / dpr, sy(z) / dpr],
  unitPos: ui => { const p = unitLabelPos(U[ui]); return [sx(p.x) / dpr, sy(p.z) / dpr]; },
};

startLevel(Math.min(SAVE.cur || 0, LV.length - 1));
if (!L) load(0);
if (document.fonts) document.fonts.ready.then(() => fitView(false));
raf = requestAnimationFrame(loop);
</script>
