<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Canal Mania</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Rye&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Canal company signage and a narrowboat's painted cabin: bottle green boards, cream sign-writing,
     red and yellow lining, roses-and-castles roundels, black-and-white lock beams. The map is the surveyor's sheet. */
  :root{--green:#1d3f2e;--green2:#24503a;--cream:#f3e6c4;--red:#b3261e;--yellow:#e3b23c;--ink:#1b1712;--blue:#2c5f86;--paper:#efe3c8}
  html,body{height:100%;overflow:hidden;background:#d8cfae;font-family:"Josefin Sans",Georgia,serif;overscroll-behavior:none;color:var(--cream)}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:#d8cfae}
  .chip{position:fixed;color:var(--cream);border-radius:3px;
    background:repeating-linear-gradient(92deg,rgba(0,0,0,.05) 0 2px,rgba(255,255,255,.02) 2px 7px,rgba(0,0,0,.03) 7px 11px),linear-gradient(var(--green2),var(--green));
    box-shadow:inset 0 0 0 2px var(--green),inset 0 0 0 4px var(--cream),inset 0 0 0 6px var(--green),inset 0 0 0 7px var(--red),0 10px 22px -10px rgba(10,20,10,.7)}
  #hud{top:12px;left:12px;padding:14px 18px 12px;width:340px;z-index:6}
  #hud::before,#hud::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;top:-7px;
    background:radial-gradient(circle at 50% 50%,var(--yellow) 0 18%,var(--red) 19% 46%,#7d1a14 47% 58%,var(--cream) 59% 66%,var(--green) 67%);box-shadow:0 1px 3px #0006}
  #hud::before{left:-7px}#hud::after{right:-7px}
  #hud .home{color:#cdbf9a;font-size:12px;text-decoration:none;letter-spacing:.06em}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
  #hud h1{margin:5px 0 2px;font:400 23px/1.1 Rye,Georgia,serif;color:var(--yellow);text-shadow:1px 1px 0 var(--red),2px 2px 0 #0b1a12;cursor:pointer;letter-spacing:.02em}
  #hud h1 small{display:block;font:700 10.5px "Josefin Sans";color:var(--cream);letter-spacing:.16em;text-transform:uppercase;text-shadow:none;margin-bottom:2px}
  #story{font-size:13.5px;line-height:1.4;color:#e9dcb8;margin:5px 0 8px}
  #story b{color:var(--yellow)}
  #hud.mini #story{display:none}
  #hud.mini h1::after{content:' ⓘ';font-size:.55em;color:var(--cream)}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;border-top:1px solid rgba(243,230,196,.35);padding-top:6px}
  .stat b{display:block;font:400 17px/1.15 Rye,Georgia,serif;font-variant-numeric:tabular-nums;color:var(--cream);white-space:nowrap}
  .stat span{font-size:9.5px;color:#cdbf9a;text-transform:uppercase;letter-spacing:.1em}
  .stat.ok b{color:#9fe0a8}.stat.bad b{color:#ff9d84}
  .wbar{margin-top:7px;font-size:12px;color:#e9dcb8;letter-spacing:.04em}
  .wbar .track{height:10px;border-radius:1px;background:repeating-linear-gradient(90deg,#1b1712 0 2px,transparent 2px 10%),var(--cream);position:relative;overflow:hidden;margin-top:3px;box-shadow:inset 0 0 0 1px #0b1a12}
  .wbar .fill{position:absolute;left:0;top:2px;bottom:2px;background:linear-gradient(#4b86b0,var(--blue));transition:width .3s}
  .wbar.warn .fill{background:linear-gradient(var(--red),#7d1a14)}
  .wbar .row2{display:flex;justify-content:space-between}
  #goals{font-size:12px;color:#cdbf9a;margin-top:6px}
  #goals i{font-style:normal;color:var(--yellow)}
  #tools{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;padding:9px 11px;max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;z-index:6}
  .tool{border:0;border-radius:2px;background:var(--cream);color:var(--green);padding:8px 11px 6px;font:700 14px "Josefin Sans",Georgia,serif;cursor:pointer;display:flex;gap:5px;align-items:center;white-space:nowrap;min-height:40px;
    box-shadow:inset 0 0 0 1.5px var(--green),inset 0 0 0 3px var(--cream),inset 0 0 0 4px var(--red),0 2px 0 #0b1a12;transition:transform .08s}
  .tool:active{transform:translateY(2px)}
  .tool:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
  .tool.on{background:var(--red);color:var(--cream);box-shadow:inset 0 0 0 1.5px #7d1a14,inset 0 0 0 3px var(--yellow),0 2px 0 #0b1a12}
  .tool.go{background:var(--yellow);color:var(--ink)}
  .tool.pulse{animation:pulse 1.4s ease-in-out infinite}
  .tool:disabled{opacity:.45}
  @keyframes pulse{50%{box-shadow:inset 0 0 0 1.5px var(--green),inset 0 0 0 3px var(--cream),inset 0 0 0 4px var(--red),0 0 0 5px rgba(227,178,60,.65)}}
  /* the surveyor's section: side view of the selected cut */
  #prof{position:fixed;left:12px;width:calc(100vw - 24px);bottom:80px;height:170px;display:none;z-index:5;border-radius:3px;touch-action:none;
    box-shadow:0 0 0 2px var(--green),0 0 0 4px var(--cream),0 0 0 5px var(--red),0 10px 22px -10px rgba(10,20,10,.7)}
  #prof.on{display:block}
  #profX{position:fixed;right:20px;bottom:222px;z-index:7;display:none;border:0;background:var(--green);color:var(--cream);font:700 20px/1 Georgia,serif;width:32px;height:32px;border-radius:50%;box-shadow:0 0 0 2px var(--cream);cursor:pointer}
  #prof.on+#profX{display:block}
  #insp{left:50%;transform:translateX(-50%);bottom:80px;padding:12px 14px;z-index:8;display:none;width:min(440px,calc(100vw - 24px));font-size:13px;line-height:1.35}
  #insp h4{margin:0 0 4px;font:400 17px Rye,Georgia,serif;color:var(--yellow)}
  #insp .opts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
  #insp .opts .tool{font-size:12.5px;padding:7px 9px 5px;min-height:34px}
  #insp .x{position:absolute;right:10px;top:8px;background:none;border:0;color:var(--cream);font-size:18px;cursor:pointer;min-width:30px;min-height:30px}
  #lvBox{top:12px;right:12px;padding:12px 12px 8px;width:260px;max-height:calc(100vh - 110px);overflow:auto;display:none;z-index:9}
  #lvBox.open{display:block}
  #lvBox h4{margin:2px 4px 8px;font:400 17px Rye,Georgia,serif;color:var(--yellow);text-align:center}
  .lv{padding:7px 8px 5px;font-size:13.5px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:6px;color:var(--ink);margin-bottom:2px;
    background:linear-gradient(transparent 92%,rgba(44,95,134,.35) 92%),var(--paper);border-left:3px solid var(--red)}
  .lv.cur{background:var(--yellow)}
  .lv.lock{opacity:.45;pointer-events:none}
  .lv .st{color:var(--red);font-size:11px}
  #banner{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;font:400 40px Rye,Georgia,serif;color:var(--yellow);pointer-events:none;transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1);text-align:center;z-index:12;
    text-shadow:2px 2px 0 var(--red),4px 4px 0 var(--green),0 0 30px rgba(20,40,25,.5);width:min(680px,92vw)}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #banner small{display:block;font:700 16px "Josefin Sans";color:var(--green);margin-top:8px;text-shadow:0 0 8px #f3e6c4,0 0 2px #f3e6c4,0 0 14px #f3e6c4}
  #sign{position:fixed;left:50%;top:-220px;z-index:20;transform:translateX(-50%);pointer-events:none;text-align:center;width:min(440px,92vw)}
  #sign .chains{height:70px;margin:0 18%;background:repeating-linear-gradient(#5d5345 0 6px,#a89a7a 6px 8px) left/3px 100% no-repeat,repeating-linear-gradient(#5d5345 0 6px,#a89a7a 6px 8px) right/3px 100% no-repeat}
  #sign .board{padding:18px 26px 16px;border-radius:4px;background:repeating-linear-gradient(92deg,rgba(0,0,0,.06) 0 2px,transparent 2px 9px),linear-gradient(var(--green2),var(--green));
    box-shadow:inset 0 0 0 3px var(--green),inset 0 0 0 6px var(--cream),inset 0 0 0 9px var(--green),inset 0 0 0 11px var(--red),0 16px 30px -10px #000a;position:relative}
  #sign h3{margin:0;font:400 32px/1.05 Rye,Georgia,serif;color:var(--yellow);text-shadow:2px 2px 0 var(--red),3px 3px 0 #0b1a12}
  #sign p{margin:6px 0 0;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--cream)}
  #sign .rose{position:absolute;top:50%;width:46px;height:46px;margin-top:-23px;border-radius:50%;
    background:radial-gradient(circle,var(--yellow) 0 14%,#e0453a 15% 34%,var(--red) 35% 52%,#7d1a14 53% 60%,transparent 61%),conic-gradient(from 20deg,#3d7a3a 0 12%,transparent 12% 25%,#3d7a3a 25% 37%,transparent 37% 50%,#3d7a3a 50% 62%,transparent 62% 75%,#3d7a3a 75% 87%,transparent 87%)}
  #sign .rose.l{left:-16px}#sign .rose.r{right:-16px}
  #sign.on{animation:signDrop 2.6s cubic-bezier(.3,1.3,.5,1) forwards}
  #sign.on .board,#sign.on .chains{transform-origin:50% -70px;animation:swing 2.2s ease-in-out .35s}
  @keyframes signDrop{0%{top:-220px}22%{top:6px}82%{top:6px;opacity:1}100%{top:6px;opacity:0}}
  @keyframes swing{0%{transform:rotate(0)}15%{transform:rotate(5deg)}35%{transform:rotate(-3.5deg)}55%{transform:rotate(2deg)}75%{transform:rotate(-1deg)}100%{transform:rotate(0)}}
  .modal-bg{background:rgba(15,30,20,.45);backdrop-filter:none}
  .modal{background:linear-gradient(rgba(44,95,134,.18) 1px,transparent 1px) 0 6px/100% 24px,linear-gradient(90deg,transparent 34px,rgba(179,38,30,.45) 34px 35.5px,transparent 35.5px),var(--paper);
    color:var(--ink);border:0;border-radius:2px;font-family:"Josefin Sans",Georgia,serif;box-shadow:0 0 0 5px var(--green),0 0 0 7px var(--cream),0 0 0 9px var(--green),0 30px 60px -20px rgba(0,0,0,.6);padding-left:46px;max-height:calc(100vh - 40px);overflow:auto}
  .modal h2{font:400 26px Rye,Georgia,serif;color:var(--green)}
  .modal button{background:var(--cream);color:var(--green);border:0;border-radius:2px;padding:9px 16px 7px;font:700 14px "Josefin Sans";box-shadow:inset 0 0 0 2px var(--green),inset 0 0 0 4px var(--cream),inset 0 0 0 5px var(--red);min-height:36px}
  .modal button.primary{background:var(--green);color:var(--yellow);box-shadow:inset 0 0 0 2px var(--yellow)}
  .stars{font-size:30px;color:var(--red);letter-spacing:4px;text-align:center}
  .stars s{color:#c9bc9c;text-decoration:none}
  .ledger{font-size:13px;color:#3b342b;display:grid;grid-template-columns:1fr auto;gap:2px 12px;margin-top:8px}
  .ledger b{font-variant-numeric:tabular-nums}
  .aha{margin:10px 0 0;font-size:14px;line-height:1.4;color:var(--ink);background:rgba(227,178,60,.22);border-left:4px solid var(--yellow);padding:8px 10px}
  .hist{margin-top:10px}
  .hist h5{margin:0 0 4px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#5b544b;font-weight:700}
  .hist .cols{height:64px;display:flex;align-items:flex-end;gap:2px;border-bottom:1px solid #9b8f74;position:relative}
  .hist .cols i{flex:1;background:#9b8f74;min-height:1px}
  .hist .cols i.you{background:var(--red)}
  .hist .ax{display:flex;justify-content:space-between;font-size:11px;color:#5b544b}
  .quote{font-size:13px;margin:6px 0 0;color:#3b342b}.quote em{display:block;font-style:normal;font-size:11px;color:#7d6f5a}
  /* zoom buttons as lock-side signs */
  .pz-bar{position:fixed!important;right:12px!important;top:12px!important;bottom:auto!important;z-index:6!important}
  .pz-bar button{background:var(--cream);color:var(--green);border:0;border-radius:2px;font:700 18px "Josefin Sans",Georgia,serif!important;min-width:36px!important;min-height:36px!important;opacity:1!important;
    box-shadow:inset 0 0 0 1.5px var(--green),inset 0 0 0 3px var(--cream),inset 0 0 0 4px var(--red),0 2px 0 #0b1a12}
  #lvBtnTop{position:fixed;right:136px;top:12px;z-index:6}
  @media (max-width:760px){
    #hud{top:8px;left:8px;width:calc(100vw - 16px);padding:10px 13px 9px}
    #hud h1{font-size:18px;margin:2px 0}
    #story{font-size:12.5px;line-height:1.33;margin:3px 0 5px}
    .stat b{font-size:14px}.stat span{font-size:9px;letter-spacing:.04em}
    .wbar{margin-top:5px}#goals{margin-top:4px;font-size:11px}
    #tools{bottom:8px;padding:7px;gap:4px}
    .tool{padding:7px 9px 5px;font-size:13px}
    .tool .lbl{display:none}
    #prof{left:6px;width:calc(100vw - 12px);bottom:66px;height:150px}
    #profX{right:12px;bottom:200px}
    #insp{bottom:66px}
    .pz-bar{right:8px!important;flex-direction:row}
    #lvBtnTop{display:none}
    #banner{font-size:28px}
  }
  @media (max-width:900px) and (max-height:520px) and (orientation:landscape){
    #hud{top:6px;left:6px;width:250px;padding:8px 11px 7px;max-height:calc(100vh - 12px);overflow:auto}
    #hud h1{font-size:16px}#story{font-size:11.5px}
    .stat b{font-size:13px}
    #tools{left:auto;right:8px;transform:none;bottom:6px;padding:6px;max-width:calc(100vw - 280px)}
    .tool{padding:6px 8px 4px;font-size:12.5px}.tool .lbl{display:none}
    #prof{left:268px;width:calc(100vw - 276px);bottom:62px;height:110px}
    #profX{bottom:178px}
    #insp{left:auto;right:8px;transform:none;bottom:62px;width:min(400px,calc(100vw - 280px))}
    .pz-bar{top:6px!important;right:8px!important}
    #lvBtnTop{display:none}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip">
  <div class="hrow"><a class="home" href="../index.html">← Rabbit Holes</a></div>
  <h1 id="title"><small id="sub">Canal Mania</small><span id="tName"></span></h1>
  <div id="story"></div>
  <div class="stats">
    <div class="stat" id="stS"><b id="vS">£0k</b><span>spent</span></div>
    <div class="stat" id="stR"><b id="vR">£0k</b><span>tolls</span></div>
    <div class="stat" id="stD"><b id="vD">–</b><span id="lD">prospectus</span></div>
    <div class="stat" id="stT"><b id="vT">1793</b><span id="lT">survey</span></div>
  </div>
  <div class="wbar" id="wbar"><div class="row2"><span id="wLbl">Thirstiest pound</span><span id="wTxt"></span></div><div class="track"><div class="fill" id="wFill"></div></div></div>
  <div id="goals"></div>
</div>
<canvas id="prof"></canvas><button id="profX" aria-label="Close section">×</button>
<div id="insp" class="chip"></div>
<div id="lvBox" class="chip"></div>
<div id="tools" class="chip"></div>
<div id="banner"></div>
<div id="sign" aria-hidden="true"><div class="chains"></div><div class="board"><span class="rose l"></span><span class="rose r"></span><h3 id="signT"></h3><p id="signS"></p></div></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script src="core.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const K = window.CANAL, { W, H, N, C: CC, xy, idx, ekey } = K;
// canal voices: windlass ratchet, oak gates thudding, water rushing through paddles, the lock bell, picks and shovels
{ const base = FX.sfx, T = FX.tone, bell = (f, v = .12, d = 0) => [1, 2.76, 5.4, 8.93].forEach((m, i) => T({ f: f * m, type: 'sine', dur: 1.6 / (1 + i), vol: v / (1 + i * 1.6), delay: d }));
  const V = { click: () => [0, .05, .1].forEach(d => T({ f: 1500 + Math.random() * 300, type: 'square', dur: .012, vol: .05, delay: d })),
    dig: () => { T({ noise: 1, f: 500 + Math.random() * 300, q: 1.2, dur: .05, vol: .06 }); T({ f: 120, f2: 80, type: 'triangle', dur: .05, vol: .06 }); },
    place: () => { T({ f: 95, f2: 55, type: 'sine', dur: .22, vol: .32 }); T({ noise: 1, f: 300, q: .7, dur: .12, vol: .14 }); },
    whoosh: () => T({ noise: 1, f: 380, q: .5, dur: .9, vol: .1, attack: .25 }),
    tick: () => T({ f: 900, type: 'triangle', dur: .03, vol: .05 }),
    coin: () => bell(1180, .06), win: () => { bell(523, .14); bell(659, .1, .35); bell(784, .1, .7); },
    warn: () => { bell(330, .1); bell(311, .08, .3); },
    chime: (k = 0) => bell(440 * Math.pow(2, ((k % 8) * 2) / 12), .07) };
  FX.sfx = (n, ...a) => { try { (V[n] || (() => base(n, ...a)))(...a); } catch (e) {} }; }

// ================= commissions =================
// Each is a country (seeded heightmap + ridges + towns + the weather to come) and a brief from the company.
const COMS = [
  { id: 'first', n: 'The First Cut', spec: { seed: 11, relief: 1.2, ridges: [], hills: [[15, 3, 3.5, 3]], towns: [[4, 11, 3], [26, 11, 3]], names: ['Ashby', 'Wexford'], drought: [[66, 3]] },
    story: 'The company has its Act of Parliament. <b>Drag from Ashby to Wexford</b> to dig a canal. The flat valley keeps it level, and every furlong costs. Then press <b>Open</b> and watch ten years of boats pay their tolls.' },
  { id: 'ridge', n: 'Over the Top', spec: { seed: 23, relief: 2.4, ridges: [{ a: [15, -2], b: [15, 24], amp: 6.5, w: 3, saddles: [[.32, .3, .12]] }], hills: [[19, 3, 3, 3]], towns: [[3, 14, 3], [27, 13, 3]], names: ['Hartley', 'Brinford'], drought: [[29, 4], [65, 5]] },
    story: 'A ridge stands between the towns. A canal over it has a <b>summit pound</b>, and every boat that crosses lets a lockful down each side. Nothing refills it but the streams: dam one above the summit with a <b>⛲ Reservoir</b>.' },
  { id: 'tunnel', n: 'Through the Hill', spec: { seed: 37, relief: 1.8, ridges: [{ a: [14, -2], b: [16, 24], amp: 8.5, w: 2.1, saddles: [] }], towns: [[4, 10, 4], [26, 11, 4]], names: ['Kelbury', 'Stoham'], drought: [[30, 5], [78, 4]] },
    story: 'A steep, narrow ridge and no streams on its crest. Climbing means a high dry summit. Hold the level and the canal goes <b>underground</b>: drag sideways in the section below to flatten a pound into a cutting or a tunnel.' },
  { id: 'round', n: 'The Long Way Round', spec: { seed: 41, relief: 1.6, ridges: [], hills: [[15, 9, 7, 5.5]], towns: [[4, 8, 3], [26, 9, 3]], names: ['Fenley', 'Marwick'], drought: [[42, 5], [90, 4]] },
    story: 'A great round hill. Over it is high and dry, through it is a long bore, and around it is longer but level. Slow canals lose trade to the carters, but cheap ones pay. <b>Compare the prospectus</b> as you try each.' },
  { id: 'dry', n: 'The Dry Years', spec: { seed: 53, relief: 2.4, ridges: [{ a: [-2, 4], b: [32, 18], amp: 7.5, w: 4.6, saddles: [[.5, .4, .12]] }], towns: [[5, 17, 4], [25, 4, 4]], names: ['Ludham', 'Ockwell'], drought: [[17, 6], [41, 6], [65, 6], [89, 6]] },
    story: 'Four dry summers are coming. When the summit runs low, boats stop. Tap a lock for <b>side ponds</b> (a third less water) or a <b>back-pump</b> (lifts water back up), or bank water in reservoirs before the drought.' },
  { id: 'junction', n: 'Grand Junction', spec: { seed: 67, relief: 2.6, ridges: [{ a: [16, -2], b: [13, 24], amp: 5.8, w: 2.8, saddles: [[.55, .45, .1]] }], towns: [[3, 4, 3], [4, 18, 3], [27, 12, 4], [21, 20, 3, 40]], names: ['Calworth', 'Penstow', 'Thurmouth', 'Newby'], drought: [[55, 5], [91, 4]] },
    story: 'Four towns, one network: canals may <b>branch</b> from one another. Trade grows every year and Newby is a village until 1796. Busy locks jam: <b>double</b> them, or build an <b>inclined plane</b>.' },
  { id: 'daily', n: 'Daily Survey', daily: 1, story: 'A new country every day, the same for everyone. Join the towns however you like. Your best dividend today is kept.' },
  { id: 'sandbox', n: 'Free Survey', free: 1, story: 'Any country you like (⟳ New country). Join the towns, share the map and design.' },
];
const dailySeed = () => { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); };
function mapFor(c, seed) { if (c.daily) return K.genMap(K.goodSpec(dailySeed())); if (c.free) return K.genMap(K.goodSpec(seed || 1)); return K.genMap(c.spec); }

// ================= state =================
const isObj = v => !!v && typeof v === 'object' && !Array.isArray(v);
const SAVE = (v => isObj(v) && v.v === 2 ? v : { v: 2 })(RH.load('lock-flight', {}));
for (const k of ['done', 'best', 'designs']) SAVE[k] = isObj(SAVE[k]) ? SAVE[k] : {};
for (const k in SAVE.done) if (!COMS.some(c => c.id === k) || !(SAVE.done[k] >= 1 && SAVE.done[k] <= 3)) delete SAVE.done[k];

    [{ label: 'Share', value: 's' }, { label: 'Rebuild', value: 'r' }, ...(stars && COMS.indexOf(Cm) < COMS.length - 1 && !Cm.free && !Cm.daily ? [{ label: 'Next', value: 'n' }] : [])]).then(v => {
    if (v === 's') { share(); toSurvey(); } else if (v === 'n') loadCom(COMS.indexOf(Cm) + 1); else toSurvey(); }), 1800);
}
function histHtml(fl, you) {
  const lo = Math.min(...fl, you), hi = Math.max(...fl, you) + 1e-6, nb = 14, bins = new Array(nb).fill(0); for (const v of fl) bins[Math.min(nb - 1, Math.floor((v - lo) / (hi - lo) * nb))]++;
  const yb = Math.min(nb - 1, Math.floor((you - lo) / (hi - lo) * nb)), mx = Math.max(1, ...bins), better = fl.filter(v => v <= you + .5).length;
  return `<div class="hist"><h5>Dividend against ${fl.length} other engineers' canals</h5><div class="cols">${bins.map((b, i) => `<i class="${i === yb ? 'you' : ''}" style="height:${Math.max(i === yb ? 30 : 2, b / mx * 100)}%"></i>`).join('')}</div><div class="ax"><span>${fmtK(lo)}</span><span>you beat ${Math.round(better / fl.length * 100)}%</span><span>${fmtK(hi)}</span></div></div>`;
}
function toSurvey() { mode = 'survey'; st = null; runAn = null; lastRec = null; boats = []; siteAnim.clear(); reanalyse(); }
function hangSign(big, small) { const el = $('sign'); $('signT').textContent = big; $('signS').textContent = small; el.classList.remove('on'); void el.offsetWidth; el.classList.add('on'); }
function banner(big, small, ms = 2200) { const t = $('banner'); t.innerHTML = big + (small ? `<small>${small}</small>` : ''); t.classList.add('on'); clearTimeout(banner.h); banner.h = setTimeout(() => t.classList.remove('on'), ms); }
// the field: canals by the company's other engineers (the planner), for the histogram and par
const FIELD = {};
function fieldFor() { const key = Cm.id + (Cm.free ? ':' + seed : ''); if (FIELD[key]) return FIELD[key]; const P2 = K.plan(M, { tries: 3, top: 8 }); return FIELD[key] = P2.field.map(x => x.dividend).filter(v => v > -999); }
function par() { const key = Cm.id + (Cm.free ? ':' + seed : ''); const f = FIELD[key]; if (!f || !f.length) return null; const s = f.slice().sort((a, b) => a - b); return Math.round(s[Math.floor(s.length / 2)]); }
function share() { const url = location.href.split('#')[0] + `#c=${Cm.id}${Cm.free ? '&s=' + seed : ''}&d=${K.enc(D)}`; try { navigator.clipboard.writeText(url); } catch (e) {} try { window.history.replaceState(null, '', url); } catch (e) {} banner('', 'Link copied: this country and your canal.', 2000); }

// ================= tools, commissions =================
function renderTools() {
  const el = $('tools'), run = mode === 'run';
  const b = (id, txt, lbl, cls = '', title = '') => `<button class="tool ${cls}" id="${id}" title="${title || lbl}">${txt}<span class="lbl"> ${lbl}</span></button>`;
  el.innerHTML = (mode === 'survey' ? b('tDig', '✎', 'Dig', tool === 'dig' ? 'on' : '', 'Dig: drag from a town or a canal') + b('tFill', '⌫', 'Fill in', tool === 'fill' ? 'on' : '') + b('tRes', '⛲', 'Reservoir', tool === 'res' ? 'on' : '', 'Dam a stream') + b('tUndo', '↶', 'Undo', '', 'Undo')
      + b('tOpen', '▶', 'Open', 'go' + (pulseOpen ? ' pulse' : ''), 'Open the canal: run ten years')
    : run ? b('tSpd', speed ? speed + '×' : '❚❚', 'speed', '', 'Speed') + b('tDig', '✎', 'Dig', tool === 'dig' ? 'on' : '', 'Dig a branch while it runs') + b('tRes', '⛲', 'Reservoir', tool === 'res' ? 'on' : '') + b('tSkip', '⏭', 'To 1803', '', 'Run to the end') + b('tStop', '■', 'Survey', '', 'Close the canal and redraw')
    : b('tAgain', '↺', 'Survey again')) + b('tLv', '☰', 'Commissions');
  const on = (id, f) => { if ($(id)) $(id).onclick = f; };
  on('tDig', () => { tool = 'dig'; FX.sfx('click'); renderTools(); }); on('tFill', () => { tool = 'fill'; FX.sfx('click'); renderTools(); }); on('tRes', () => { tool = tool === 'res' ? 'dig' : 'res'; FX.sfx('click'); if (tool === 'res') banner('', 'Tap a stream (blue line) above your canal to dam it.', 1800); renderTools(); });
  on('tUndo', () => { if (!hist.length) return; const o = JSON.parse(hist.pop()); D.paths = o.paths; D.lv = o.lv; D.locks = o.locks; D.res = o.res; sel = Math.min(sel, D.paths.length - 1); FX.sfx('click'); reanalyse(); });
  on('tOpen', openCanal); on('tSpd', () => { speed = { 1: 2, 2: 4, 4: 0, 0: 1 }[speed]; FX.sfx('click'); renderTools(); });
  on('tSkip', () => { while (mode === 'run') stepOne(); boats = []; hud(); kick(); });
  on('tStop', toSurvey); on('tAgain', toSurvey); on('tLv', () => { $('lvBox').classList.toggle('open'); renderLevels(); });
}
function renderLevels() {
  const open = i => i === 0 || COMS[i].free || COMS[i].daily || SAVE.done[COMS[i - 1].id];
  $('lvBox').innerHTML = `<h4>The Company's Commissions</h4>` + COMS.map((c, i) => `<div class="lv${c === Cm ? ' cur' : ''}${open(i) ? '' : ' lock'}" data-i="${i}"><span>${c.daily ? '☀ ' : ''}${c.n}</span><span class="st">${SAVE.done[c.id] ? '★'.repeat(SAVE.done[c.id]) : open(i) ? '' : '🔒'}</span></div>`).join('')
    + (Cm.free ? `<div class="lv" id="lvNew"><span>⟳ New country</span></div>` : '');
  $('lvBox').querySelectorAll('[data-i]').forEach(e => e.onclick = () => { $('lvBox').classList.remove('open'); loadCom(+e.dataset.i); });
  if ($('lvNew')) $('lvNew').onclick = () => { $('lvBox').classList.remove('open'); loadCom(COMS.indexOf(Cm), null, (Math.random() * 1e6) | 0); };
}
function setMini(on) { const was = $('hud').classList.contains('mini'); $('hud').classList.toggle('mini', on); if (was !== on) requestAnimationFrame(() => { if (!cam.touched) fitMap(); kick(); }); }
$('title').onclick = () => setMini(!$('hud').classList.contains('mini'));
function loadCom(i, shared, sd) {
  Cm = COMS[i]; seed = sd || (Cm.free ? (SAVE.seed || 1) : 1); if (Cm.free) SAVE.seed = seed; M = mapFor(Cm, seed); bake();
  D = shared || (SAVE.designs[Cm.id + (Cm.free ? ':' + seed : '')] && K.dec(SAVE.designs[Cm.id + (Cm.free ? ':' + seed : '')])) || K.newDesign();
  mode = 'survey'; st = null; runAn = null; lastRec = null; boats = []; hist = []; sel = -1; tool = 'dig'; closeInsp(); openProf(false); pulseOpen = false; events = {};
  SAVE.cur = i; persist();
  $('tName').textContent = Cm.n + (Cm.daily ? ' · ' + dailySeed() : Cm.free ? ' · #' + seed : ''); $('story').innerHTML = Cm.story; setMini(false);
  reanalyse(); renderLevels(); requestAnimationFrame(() => { fitMap(); kick(); });
  if (!Cm.free && !Cm.daily) setTimeout(() => { if (Cm === COMS[i]) { fieldFor(); hud(); } }, 600);
}
const saveDesign = () => { SAVE.designs[Cm.id + (Cm.free ? ':' + seed : '')] = K.enc(D); persist(); };

// ================= loop =================
let lastT = performance.now();
function frame(now) {
  raf = 0; const dt = Math.min(.1, (now - lastT) / 1000); lastT = now; const t = now / 1000;
  if (mode === 'run' && speed) { monthT += dt * speed / .8; while (monthT >= 1 && mode === 'run') { monthT -= 1; stepOne(); hud(); } }
  if (boats.length || siteAnim.size) stepBoats(dt * (speed || 0));
  draw(t); drawProf(t);
  if (mode === 'run' || boats.length || siteAnim.size || (Cm.id === 'first' && !D.paths.length) || pc.classList.contains('on')) kick();
}
addEventListener('resize', resize);
addEventListener('keydown', e => { if (e.key === 'z' && (e.ctrlKey || e.metaKey) || e.key === 'u') $('tUndo') && $('tUndo').click(); });
// keep the design whenever it changes
const _re = reanalyse; reanalyse = function () { _re(); if (mode === 'survey') saveDesign(); };

// ================= debug / test handle =================
window.__lf = { K, COMS, get M() { return M; }, get D() { return D; }, set D(d) { D = d; hist = []; reanalyse(); }, get an() { return an; }, get fore() { return fore; }, get mode() { return mode; }, get st() { return st; }, get cam() { return cam; }, get sel() { return sel; },
  load: (i, sd) => loadCom(i, null, sd), open: openCanal, skip: () => { while (mode === 'run') stepOne(); }, fieldFor, par, SAVE, toSurvey,
  screenOf: c => cam.toScreen(cx(c), cy(c)), profX: i => { const G2 = PV; const r = pc.getBoundingClientRect(); return [r.left + G2.X(G2.xs[i]) / dpr, r.top + G2.Y(D.lv[G2.p[i]]) / dpr]; } };

// ================= boot =================
resize();
{ const m = /#c=([a-z]+)(?:&s=(\d+))?&d=([A-Za-z0-9_~.!-]*)/.exec(location.hash), ci = m ? COMS.findIndex(c => c.id === m[1]) : -1;
  if (ci >= 0) { const d = K.dec(m[3]); loadCom(ci, d || null, m[2] ? +m[2] : undefined); if (d) banner('', 'A shared canal. Press <b>Open</b> to run it.', 2400); }
  else loadCom(Math.min(COMS.length - 1, Math.max(0, Number.isInteger(SAVE.cur) ? SAVE.cur : 0))); }
if (document.fonts) document.fonts.ready.then(() => kick());
</script>
