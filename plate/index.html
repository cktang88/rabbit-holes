<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mantle</title>
<meta name="description" content="You are the mantle. Grab a tectonic plate and shove it: continents crumple into Himalayas, oceans dive into trenches, rifts tear open new seas with magnetic stripes, and rain wears it all down.">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600&family=Cormorant+Garamond:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* Lamont-Doherty, 1959: the Heezen–Tharp physiographic map. Chrome is cartographer's stock: cream map labels,
     india-ink rules, a sounding-line gauge and a seismograph drum. Feature names in atlas italics. */
  :root{--paper:#efe6cf;--paper2:#e2d6b6;--ink:#1f2a30;--ink2:#56616a;--red:#b8412c;--sea:#24506e;--gold:#c99a3a;--glow:#ff9b4a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#0d1620;color:var(--ink);font-family:Jost,"Futura","Century Gothic",sans-serif;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  #gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
  #ov{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .lab{position:absolute;left:0;top:0;white-space:nowrap;font:600 italic 17px/1 "Cormorant Garamond",Georgia,serif;color:#fbf3df;letter-spacing:.02em;
    text-shadow:0 1px 2px rgba(0,0,0,.85),0 0 8px rgba(0,0,0,.6);transition:opacity .6s;will-change:transform}
  .lab::before{content:"";position:absolute;left:-9px;top:50%;width:5px;height:5px;margin-top:-3px;border-radius:50%;background:#fbf3df;box-shadow:0 0 6px #fff}
  .lab.big{font-size:21px}
  /* map-label chips */
  .chip{position:fixed;z-index:5;background:linear-gradient(#f3ebd6,#e6dabc);border:1px solid #2a3338;box-shadow:inset 0 0 0 2px #f3ebd6,inset 0 0 0 3px rgba(31,42,48,.35),0 6px 16px -8px rgba(0,0,0,.7);color:var(--ink)}
  #hud{left:10px;top:10px;padding:7px 10px 8px;min-width:210px;max-width:min(330px,calc(100vw - 150px))}
  #hud .row{display:flex;align-items:center;gap:8px}
  .home{color:var(--ink2);font-size:13px;text-decoration:none;white-space:nowrap}
  #lvName{font:600 15px/1.1 Jost;letter-spacing:.14em;text-transform:uppercase;cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;padding:0;text-align:left;color:var(--ink)}
  #lvName:after{content:" ▾";font-size:11px;color:var(--ink2)}
  #lvTag{font:italic 500 15px/1.15 "Cormorant Garamond",serif;color:var(--ink2);margin-top:1px}
  #gauge{margin-top:6px;position:relative;height:16px;border:1.5px solid var(--ink);background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(31,42,48,.18) 9px 10px),#f6efdc}
  #gFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#4e7f9a,#24506e);transition:width .25s}
  #gauge.pass #gFill{background:linear-gradient(90deg,#d8a945,#b07a22)}
  .mk{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--red)}
  .mk i{position:absolute;top:-13px;left:-5px;font:normal 10px Jost;color:var(--red)}
  #gText{display:flex;justify-content:space-between;align-items:baseline;margin-top:3px;font-size:13px;color:var(--ink2);gap:8px}
  #gText b{font:600 17px Jost;color:var(--ink)}
  #stars{color:var(--gold);letter-spacing:2px;font-size:16px}
  #views{right:10px;top:10px;display:flex;flex-direction:column;gap:0;padding:3px}
  .vb{width:44px;height:40px;border:0;border-bottom:1px solid rgba(31,42,48,.25);background:none;font:600 10px/1 Jost;letter-spacing:.08em;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
  .vb:last-child{border-bottom:0}
  .vb svg{width:20px;height:20px}
  .vb.on{background:var(--ink);color:var(--paper)}
  .vb.locked{opacity:.3;pointer-events:none}
  #bar{left:50%;bottom:10px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:5px 8px;max-width:calc(100vw - 20px)}
  .tb{min-width:40px;height:40px;border:1.5px solid var(--ink);background:#f6efdc;font:600 15px Jost;color:var(--ink);cursor:pointer;padding:0 8px;display:flex;align-items:center;justify-content:center}
  .tb.on{background:var(--ink);color:var(--paper)}
  .tb.pulse{animation:pulse 1.3s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 5px rgba(255,155,74,.65)}}
  .tb svg{width:20px;height:20px}
  #clock{font:600 14px Jost;min-width:70px;text-align:center;line-height:1.05}
  #clock small{display:block;font:400 10px Jost;color:var(--ink2);letter-spacing:.08em}
  #seis{width:120px;height:36px;border:1px solid rgba(31,42,48,.5);background:repeating-linear-gradient(0deg,transparent 0 8px,rgba(184,65,44,.13) 8px 9px),#fbf6e7}
  #scrub{width:110px;accent-color:#24506e;height:28px}
  #tools{left:10px;bottom:10px;display:flex;gap:6px;padding:5px}
  #toast{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.9);z-index:8;padding:10px 16px;opacity:0;pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.2,1.4,.4,1);
    font:italic 600 22px "Cormorant Garamond",serif;color:#fbf3df;text-shadow:0 2px 6px rgba(0,0,0,.9);text-align:center;max-width:90vw}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #card{left:50%;top:50%;transform:translate(-50%,-50%) rotate(-1deg);width:min(360px,calc(100vw - 24px));padding:16px 18px 14px;display:none;z-index:9}
  #card.on{display:block;animation:cardin .45s cubic-bezier(.2,1.3,.4,1)}
  @keyframes cardin{from{transform:translate(-50%,-40%) rotate(-4deg);opacity:0}}
  #card h2{margin:0;font:600 13px Jost;letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
  #card .big{font:600 30px/1.05 Jost;margin:4px 0 2px}
  #card .st{font-size:30px;color:var(--gold);letter-spacing:4px}
  #card p{margin:6px 0 0;font:italic 500 18px/1.25 "Cormorant Garamond",serif}
  #card .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
  .go{border:2px solid var(--ink);background:var(--ink);color:var(--paper);font:600 14px Jost;letter-spacing:.1em;text-transform:uppercase;padding:8px 14px;min-height:40px;cursor:pointer}
  .go.ghost{background:transparent;color:var(--ink)}
  #stamp{position:absolute;right:14px;top:10px;padding:3px 8px;border:3px double var(--red);color:var(--red);font:600 13px Jost;letter-spacing:.2em;transform:rotate(9deg);opacity:.85}
  #menu{position:fixed;inset:0;z-index:10;background:rgba(8,14,20,.72);display:none;align-items:center;justify-content:center;padding:12px}
  #menu.on{display:flex}
  #menu .chip{position:relative;width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto;padding:14px 16px}
  #menu h2{margin:0 0 2px;font:600 14px Jost;letter-spacing:.24em;text-transform:uppercase}
  #menu .sub{font:italic 500 17px "Cormorant Garamond",serif;color:var(--ink2);margin-bottom:8px}
  #list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .lv{border:1.5px solid var(--ink);background:#f7f0de;padding:7px 9px;text-align:left;cursor:pointer;min-height:58px;font:inherit;color:var(--ink);position:relative}
  .lv b{display:block;font:600 13px Jost;letter-spacing:.08em;text-transform:uppercase}
  .lv span{display:block;font:italic 500 15px/1.1 "Cormorant Garamond",serif;color:var(--ink2);margin-top:2px}
  .lv i{position:absolute;right:6px;top:5px;font-style:normal;color:var(--gold);font-size:12px;letter-spacing:1px}
  .lv.locked{opacity:.38;pointer-events:none}
  .lv.cur{background:#e9dcb8}
  #closeM{position:absolute;right:8px;top:6px;border:0;background:none;font:24px Jost;cursor:pointer;color:var(--ink);min-width:36px;min-height:36px}
  #hint{position:fixed;z-index:4;pointer-events:none;font:italic 600 19px "Cormorant Garamond",serif;color:#fff4dc;text-shadow:0 0 8px rgba(0,0,0,.95),0 1px 2px #000;white-space:nowrap;opacity:0;transition:opacity .5s}
  body.nohud .chip,body.nohud #hint,body.nohud #labels{display:none!important}
  @media (max-width:640px){
    #hud{min-width:0;max-width:calc(100vw - 72px);padding:5px 8px 6px}
    #lvTag{display:none} #lvName{font-size:13px} #gauge{height:12px;margin-top:4px} #gText{font-size:12px} #gText b{font-size:15px}
    .vb{width:40px;height:36px}
    #seis{display:none} #scrub{width:70px} .tb{min-width:36px;height:36px} #clock{min-width:56px;font-size:13px}
    #bar{left:auto;right:8px;transform:none;bottom:8px;gap:4px;padding:4px} #tools{bottom:8px;left:8px;padding:4px;gap:4px}
  }
  @media (max-height:460px){ #lvTag{display:none} .vb{height:32px} #views{flex-direction:row} #seis{display:none} }
</style>
</head>
<body>
<canvas id="gl" aria-label="The planet's crust: drag a plate to push it" data-play></canvas>
<canvas id="ov"></canvas>
<div id="labels"></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="hud" class="chip">
  <div class="row"><a class="home" href="../index.html">← Rabbit Holes</a></div>
  <div class="row"><button id="lvName" aria-label="Commissions">Crumple</button></div>
  <div id="lvTag"></div>
  <div id="gauge"><div id="gFill"></div></div>
  <div id="gText"><span id="gLabel">highest peak</span><span><b id="gVal">0</b> <span id="gUnit">km</span></span><span id="stars">☆☆☆</span></div>
</div>
<div id="views" class="chip">
  <button class="vb on" data-v="0" title="Satellite"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 8c3 1 4-2 7-1s3 3 5 2M5 13c2-1 4 1 6 0" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>sat</button>
  <button class="vb" data-v="1" title="Relief (hypsometric)"><svg viewBox="0 0 20 20"><path d="M2 16l5-8 3 4 3-6 5 10z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>relief</button>
  <button class="vb locked" data-v="2" id="vMag" title="Magnetic stripes"><svg viewBox="0 0 20 20"><path d="M3 3v14M6 3v14M10 3v14M14 3v14M17 3v14" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 1"/></svg>mag</button>
  <button class="vb" data-v="3" title="Plates"><svg viewBox="0 0 20 20"><path d="M2 6l7 2 2 9M9 8l9-3M11 17l7-5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>plates</button>
  <button class="vb" id="globeB" title="Globe"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="10" cy="10" rx="3.2" ry="7.5" fill="none" stroke="currentColor" stroke-width="1.2"/><path d="M2.5 10h15" stroke="currentColor" stroke-width="1.2"/></svg>globe</button>
  <button class="vb" id="sndB" title="Sound"><svg viewBox="0 0 20 20"><path d="M3 8h3l4-4v12l-4-4H3z" fill="currentColor"/><path id="sndW" d="M13 7c1.5 1.5 1.5 4.5 0 6M15 5c3 3 3 7 0 10" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>sound</button>
</div>
<div id="tools" class="chip">
  <button class="tb on" id="tPush" title="Push a plate (drag it)"><svg viewBox="0 0 20 20"><path d="M7 17V8.5a1.3 1.3 0 012.6 0V7a1.3 1.3 0 012.6 0v1a1.3 1.3 0 012.6 0v.7a1.3 1.3 0 012.4.6V13c0 2.5-2 4-4.5 4z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M7 11L4.6 9.4a1.2 1.2 0 00-1.6 1.7L7 16" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <button class="tb" id="tRift" title="Rift: draw a line to split a plate"><svg viewBox="0 0 20 20"><path d="M10 2l-2 4 3 2-3 4 2 3-1 3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  <button class="tb" id="tHot" title="Hotspot: tap to place or remove"><svg viewBox="0 0 20 20"><path d="M10 2c1 4 5 5 5 10a5 5 0 01-10 0c0-3 2-4 2-6 1 1 2 2 2 3 1-2 1-4 1-7z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></button>
  <button class="tb" id="tFit" title="Fit view"><svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
</div>
<div id="bar" class="chip">
  <button class="tb" id="bPause" title="Pause (space)">❚❚</button>
  <button class="tb on" id="bPlay" title="Play">▶</button>
  <button class="tb" id="bFast" title="Fast">▶▶</button>
  <div id="clock"><span id="myr">0</span> Myr<small>since start</small></div>
  <input type="range" id="scrub" min="0" max="0" value="0" step="1" aria-label="Rewind through geologic time" title="Rewind">
  <canvas id="seis" width="240" height="72" aria-label="Seismograph"></canvas>
</div>
<div id="card" class="chip"><div id="stamp">SURVEYED</div><h2 id="cH">Commission met</h2><div class="big" id="cBig"></div><div class="st" id="cStars"></div><p id="cP"></p>
  <div class="acts"><button class="go ghost" id="cKeep">Keep pushing</button><button class="go ghost" id="cShare" style="display:none">Copy result</button><button class="go" id="cNext">Next</button></div></div>
<div id="menu"><div class="chip"><button id="closeM" aria-label="Close">×</button><h2>Commissions</h2><div class="sub">Each one a planet. Push its plates until the survey reads true.</div><div id="list"></div></div></div>

<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
// ============================================================================================
//  PLATE SIM: rigid plates on a wrapping lat-lon grid, crust carried cell by cell.
//  Every world cell belongs to exactly one plate after each step. Plates move by whole cells
//  (sub-cell remainder kept in an accumulator); where two plates land on one cell the crust
//  decides: continents collide and thicken, ocean subducts (the older ocean when both are ocean),
//  where none lands new crust is made (ocean, or stretched continent first). Elevation is isostatic.
// ============================================================================================
const PlateSim = (() => {
  const DT = .25, EARTH_KM = 40000, VMAX_KM = 400, SLAB_KM = 75;
  const NONE = 255, MAXP = 15, COLW = [[1, .2], [2, .16], [3, .12], [4, .1]];
  const iso = (h, f, age) => -2.6 - .35 * Math.sqrt(age < 0 ? 0 : age > 90 ? 90 : age) * (1 - f) + .13 * (h - 7);
  // ---- noise ----
  function hash2(x, y, s) { let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul(s | 0, 1442695041)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
  function vnoise(x, y, px, s) {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const x0 = ((xi % px) + px) % px, x1 = (x0 + 1) % px;
    const a = hash2(x0, yi, s), b = hash2(x1, yi, s), c = hash2(x0, yi + 1, s), d = hash2(x1, yi + 1, s);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(u, v, base, oct, s) { let sum = 0, amp = .5, norm = 0; for (let o = 0; o < oct; o++) { const p = base << o; sum += amp * vnoise(u * p, v * p * .5, p, s + o * 101); norm += amp; amp *= .5; } return sum / norm; }
  function rng(seed) { let a = seed >>> 0; return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // geomagnetic reversals: a fixed random sequence of chrons, 1.5–5 Myr long (compressed for a game)
  const REV = (() => { const r = []; let t = -900, k = 0; while (t < 9000) { r.push(t); t += 1.5 + 3.5 * hash2(k++, 7, 99); } return Float64Array.from(r); })();
  function polarity(t) { let lo = 0, hi = REV.length; while (lo < hi) { const m = (lo + hi) >> 1; if (REV[m] <= t) lo = m + 1; else hi = m; } return lo & 1; }

  function create(o = {}) {
    const W = o.W || 256, H = W >> 1, N = W * H, cellKm = EARTH_KM / W;
    const F = () => new Float32Array(N), U = () => new Uint8Array(N);
    const S = { W, H, N, cellKm, dt: DT, time: 0, t0: 0, stepN: 0, seed: o.seed || 1, rand: rng(o.seed || 1),
      vmax: VMAX_KM / cellKm, slab: SLAB_KM / cellKm,
      owner: U(), h: F(), f: F(), birth: F(), vt: F(), kind: U(), ghost: U(),
      _o: U(), _h: F(), _f: F(), _birth: F(), _vt: F(), _kind: U(), _ghost: U(),
      addSub: F(), addCol: F(), addP: U(), e: F(), trench: F(), volc: F(), swell: F(), arcN: F(),
      P: F(), P0: F(), T: F(), A: F(), Er: F(), Dr: F(), rcv: new Int32Array(N), bnd: new Int8Array(N), bndV: F(),
      lat: new Float32Array(H), wl: new Float32Array(H),
      plates: [], hot: [], sea: 0, water: 0, events: [], qc: { transform: 0, subduction: 0, collision: 0, rift: 0, total: 0 },
      pairs: new Map(), acc: new Map(), stress: new Map(), dec: new Map(), snaps: [], volcList: [], firsts: {}, frozen: false };
    for (let y = 0; y < H; y++) { const la = 90 - (y + .5) * 180 / H; S.lat[y] = la; S.wl[y] = Math.cos(la * Math.PI / 180); }
    for (let i = 0; i < N; i++) { const x = i % W, y = (i / W) | 0; S.arcN[i] = .25 + 1.5 * fbm(x / W, y / H, 48, 2, 777); }
    return S;
  }
  const cmToCells = (S, cm) => cm * 10 / S.cellKm, cellsToCm = (S, v) => v * S.cellKm / 10;

  // ---------------------------------------------------------------------------------------
  //  World generation from a level spec (positions: u east 0..1 wrapping, v from north 0..1; sizes in km)
  // ---------------------------------------------------------------------------------------
  function gen(S, spec) {
    const { W, H, N, cellKm } = S, sd = spec.seed || 1;
    S.rand = rng(sd * 7919 + 13);
    S.plates = spec.plates.map((p, k) => ({ id: k, alive: true, name: p.name || '', vx: cmToCells(S, (p.v || [0, 0])[0]), vy: cmToCells(S, (p.v || [0, 0])[1]), ax: 0, ay: 0, sx: 0, sy: 0, tvx: 0, tvy: 0, held: false,
      mass: 0, cmass: 0, cx: 0, cy: 0, subN: 0, subDX: 0, subDY: 0, cminY: 0, cmaxY: 0, fixed: !!p.fixed }));
    const conts = (spec.conts || []).map(c => ({ ...c, cs: Math.cos((c.rot || 0) * Math.PI / 180), sn: Math.sin((c.rot || 0) * Math.PI / 180) }));
    const dKm = (u0, v0, x, y) => { let dx = x - u0 * W; dx -= Math.round(dx / W) * W; const dy = y - v0 * H; return [dx * cellKm, dy * cellKm]; };
    const rOf = (c, x, y) => { const [dx, dy] = dKm(c.u, c.v, x + .5, y + .5); const a = (dx * c.cs + dy * c.sn) / c.rx, b = (-dx * c.sn + dy * c.cs) / c.ry;
      let r = Math.hypot(a, b); if (c.shape) r = c.shape(a, b, r); r *= 1 + (c.rough ?? .35) * (fbm(x / W, y / H, 6, 4, sd + 31 + (c.ns || 0)) - .5); return r; };
    for (let i = 0; i < N; i++) {
      const x = i % W, y = (i / W) | 0;
      let best = 1e18, bp = 0, ch = 0, cf = 0, inC = -1, minR = 9;
      const rs = conts.map(c => rOf(c, x, y));
      conts.forEach((c, k) => { if (rs[k] < minR) { minR = rs[k]; inC = k; } });
      S.plates.forEach((P, k) => {
        const ps = spec.plates[k]; let d = 1e18;
        for (const s of ps.seeds || []) { const [a, b] = dKm(s[0], s[1], x + .5, y + .5); d = Math.min(d, Math.hypot(a, b) * (s[2] || 1)); }
        conts.forEach((c, j) => { if (c.plate === k && !c.add) d = Math.min(d, Math.max(0, rs[j] - 1) * Math.min(c.rx, c.ry) * 1.4); });
        d += (spec.warp ?? 380) * (fbm(x / W, y / H, 5, 3, sd + k * 17) - .5);
        if (d < best) { best = d; bp = k; }
      });
      let h = 7, f = 0, kd = 0;
      conts.forEach((c, k) => { if (c.add) return; const r = rs[k]; if (r < 1.18) { const t = Math.min(1, Math.max(0, (1.18 - r) / .3)), sm = t * t * (3 - 2 * t);

function toggleGlobe(on = !cam.globe) { cam.globe = on ? 1 : 0; U.uGlobe.value = cam.globe; atmo.visible = stars.visible = !!cam.globe; $('globeB').classList.toggle('on', !!cam.globe); SAVE.globe = cam.globe; persist();
  if (cam.globe) { cam.lon = cam.x; cam.lat = clamp(-cam.z, -60, 60); } else { cam.x = cam.lon; cam.z = -cam.lat; } }
$('globeB').onclick = () => { toggleGlobe(); FX.sfx('whoosh'); };
const sndUI = () => { $('sndW').style.display = FX.muted ? 'none' : ''; $('sndB').classList.toggle('on', FX.muted); };
$('sndB').onclick = () => { FX.setMuted(!FX.muted); if (FX.muted && grind) setGrind(0); sndUI(); }; sndUI();
function openMenu() {
  const L = $('list'); L.innerHTML = ''; const ul = unlockedIdx();
  const add = (lv, locked, extra) => { const b = document.createElement('button'); b.className = 'lv' + (locked ? ' locked' : '') + (level && level.id === lv.id ? ' cur' : ''); const s = SAVE.stars[lv.id] || 0;
    b.innerHTML = `<b>${lv.name}</b><span>${extra || lv.tag}</span>${lv.goal ? `<i>${'★'.repeat(s)}${'☆'.repeat(3 - s)}</i>` : ''}`; b.onclick = () => { closeMenu(); openLevel(lv.id); FX.sfx('pop'); }; L.appendChild(b); };
  LEVELS.forEach((lv, i) => add(lv, i > ul, i > ul ? '···' : null));
  add(LV.daily(today), false, 'a new planet every day'); add({ id: 'sandbox', name: 'Sandbox', tag: 'your own planet: plumes, rifts, no survey' }, false);
  $('menu').classList.add('on');
}
function closeMenu() { $('menu').classList.remove('on'); }
$('lvName').onclick = () => { openMenu(); FX.sfx('click'); }; $('closeM').onclick = closeMenu; $('menu').onclick = e => { if (e.target.id === 'menu') closeMenu(); };
$('cKeep').onclick = () => { $('card').classList.remove('on'); FX.sfx('click'); }; $('cNext').onclick = () => { $('card').classList.remove('on'); nextLevel(); FX.sfx('pop'); };
$('cShare').onclick = () => { const m = LV.M[level.goal.m], s = run.stars; const txt = `Mantle · ${level.name} · ${'★'.repeat(s)}${'☆'.repeat(3 - s)} · ${m.fmt(run.best)} ${m.unit} in ${Math.round(S.time - S.t0)} Myr`;
  try { navigator.clipboard.writeText(txt); showToast('copied'); } catch (e) { showToast(txt, 4000); } };

// =====================================================================================================
//  OVERLAY: plate arrows, the rubber band, the rift stroke, the first hint
// =====================================================================================================
const ov = $('ov'), og = ov.getContext('2d');
function fitOv() { const d = Math.min(2, devicePixelRatio || 1); ov.width = innerWidth * d; ov.height = innerHeight * d; og.setTransform(d, 0, 0, d, 0, 0); }
function arrow(x0, y0, x1, y1, w, col) { const a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0); if (L < 3) return; og.strokeStyle = col; og.fillStyle = col; og.lineWidth = w; og.lineCap = 'round';
  og.beginPath(); og.moveTo(x0, y0); og.lineTo(x1 - Math.cos(a) * w * 2, y1 - Math.sin(a) * w * 2); og.stroke(); og.beginPath(); og.moveTo(x1, y1); og.lineTo(x1 - Math.cos(a - .45) * w * 4, y1 - Math.sin(a - .45) * w * 4); og.lineTo(x1 - Math.cos(a + .45) * w * 4, y1 - Math.sin(a + .45) * w * 4); og.closePath(); og.fill(); }
function drawOverlay(now) {
  og.clearRect(0, 0, innerWidth, innerHeight);
  const hud = !document.body.classList.contains('nohud');
  // plate motion arrows at each plate's centre (a big round grip to grab)
  if (hud) for (const p of S.plates) {
    if (!p.alive || p.mass < 30) continue; const e = 0; const [sx, sy, vis] = toScreen(p.cx, p.cy, e); if (!vis) continue;
    const sp = Math.hypot(p.vx, p.vy), cm = PlateSim.cellsToCm(S, sp); const held = drag && drag.kind === 'push' && drag.id === p.id;
    og.globalAlpha = held ? .95 : .55; og.fillStyle = 'rgba(20,28,34,.35)'; og.strokeStyle = held ? '#ffd9a0' : 'rgba(255,248,230,.75)'; og.lineWidth = 1.5;
    og.beginPath(); og.arc(sx, sy, 17, 0, 2 * PI); og.fill(); og.stroke();
    if (sp > .02) { const [ex, ey] = toScreen(p.cx + p.vx * 6, p.cy + p.vy * 6, e); const dx = ex - sx, dy = ey - sy, L = Math.hypot(dx, dy) || 1, len = clamp(10 + cm * 2.2, 14, 70);
      arrow(sx, sy, sx + dx / L * len, sy + dy / L * len, 3, held ? '#ffd9a0' : 'rgba(255,248,230,.85)'); }
    if (cm > .5) { og.font = '600 11px Jost'; og.fillStyle = 'rgba(255,248,230,.9)'; og.textAlign = 'center'; og.fillText(cm.toFixed(0) + ' cm/yr', sx, sy + 30); }
    og.globalAlpha = 1;
  }
  // the rubber band while pushing
  if (drag && drag.kind === 'push') { const [ax, ay] = toScreen(drag.anchor[0], drag.anchor[1]), [bx, by] = toScreen(drag.cur[0] + Math.round((drag.anchor[0] - drag.cur[0]) / W) * W, drag.cur[1]);
    og.setLineDash([6, 5]); og.strokeStyle = 'rgba(255,220,170,.9)'; og.lineWidth = 2; og.beginPath(); og.moveTo(ax, ay); og.lineTo(bx, by); og.stroke(); og.setLineDash([]);
    og.fillStyle = 'rgba(255,200,140,.9)'; og.beginPath(); og.arc(bx, by, 9, 0, 2 * PI); og.fill(); }
  // rift stroke
  const rs = drag && drag.kind === 'rift' ? { pts: drag.pts, live: 1 } : riftFlash && now - riftFlash.t0 < 900 ? riftFlash : null;
  if (rs && rs.pts.length > 1) { og.strokeStyle = rs.live ? 'rgba(255,170,90,.95)' : rs.ok ? `rgba(255,220,140,${1 - (now - rs.t0) / 900})` : `rgba(255,70,50,${1 - (now - rs.t0) / 900})`; og.lineWidth = rs.live ? 3 : 4; og.setLineDash(rs.live ? [8, 6] : []);
    og.beginPath(); rs.pts.forEach((c, k) => { const [x, y] = toScreen(c[0], c[1]); k ? og.lineTo(x, y) : og.moveTo(x, y); }); og.stroke(); og.setLineDash([]); }
  // quake magnitude flashes
  for (const f of flashes) { const a = 1 - (now - f.t0) / 1800; if (a <= 0) continue; const [x, y, vis] = toScreen(f.cx, f.cy); if (!vis) continue; og.globalAlpha = a; og.font = 'italic 600 16px "Cormorant Garamond"'; og.fillStyle = '#ffe9b0'; og.textAlign = 'center'; og.fillText(f.txt, x, y - 14 - (1 - a) * 20); og.globalAlpha = 1; }
  // first-minute hint: a glowing arrow from one plate to the other
  const hint = $('hint');
  if (hud && hintOn && level && level.hint) {
    const [a, b] = level.hint, P = S.plates[a]; let tx, ty, txt = '';
    if (P && P.alive) {
      const [sx, sy] = toScreen(P.cx, P.cy);
      if (typeof b === 'number' && S.plates[b]) { const Q2 = S.plates[b]; let dx = Q2.cx - P.cx; dx -= Math.round(dx / W) * W; [tx, ty] = toScreen(P.cx + dx * .8, P.cy + (Q2.cy - P.cy) * .8); txt = grabbed ? 'keep pushing' : 'drag this plate into that one'; }
      else if (b === 'rift') { txt = level.hintStage ? 'now push the two halves apart' : 'pick ✂ and draw a line across the continent'; }
      else if (b === 'drift') { [tx, ty] = toScreen(P.cx - 12, P.cy); txt = 'push the plate over the glowing plume'; }
      else if (b === 'slide') { [tx, ty] = toScreen(P.cx, P.cy + 14); txt = 'slide it along the coast, not into it'; }
      else if (b === 'target') { const t = level.target; [tx, ty] = toScreen(t.u * W, t.v * H); txt = 'dock India on the dashed outline'; }
      if (tx != null) { const k = (Math.sin(now / 260) + 1) / 2; og.globalAlpha = .55 + .45 * k; og.shadowColor = '#ff9b4a'; og.shadowBlur = 16; arrow(sx, sy, tx, ty, 5, '#ffcf8a'); og.shadowBlur = 0; og.globalAlpha = 1; }
      hint.style.opacity = txt ? 1 : 0; hint.textContent = txt; hint.style.left = clamp(sx - 90, 8, innerWidth - 260) + 'px'; hint.style.top = clamp(sy + 26, 90, innerHeight - 110) + 'px';
    }
    U.uHint.value = a;
  } else { hint.style.opacity = 0; U.uHint.value = -1; }
  // labels
  for (let i = labels.length - 1; i >= 0; i--) { const l = labels[i], age = now - l.t0; if (age > l.life) { l.el.remove(); labels.splice(i, 1); continue; }
    const [x, y, vis] = toScreen(l.cx, l.cy, elevAt(l.cx, l.cy)); l.el.style.transform = `translate(${x + 10}px,${y - 9}px)`; l.el.style.opacity = vis ? (age < 300 ? age / 300 : age > l.life - 800 ? (l.life - age) / 800 : 1) : 0; }
}
// seismograph drum
const sg = $('seis').getContext('2d');
function drawSeis() { seis.push(seis.pop() * 1); const v = seis.shift(); seis.push(0); const c = sg, w = 240, h = 72; c.clearRect(0, 0, w, h); c.strokeStyle = '#a3321f'; c.lineWidth = 1.4; c.beginPath();
  for (let i = 0; i < seis.length; i++) { const a = seis[i], y = h / 2 + (a ? Math.sin(i * 2.7) * Math.min(32, a) : (Math.random() - .5) * 1.2); i ? c.lineTo(i * 2, y) : c.moveTo(0, y); } c.stroke();
  for (let i = 0; i < seis.length; i++) seis[i] *= .93; }

// =====================================================================================================
//  MAIN LOOP
// =====================================================================================================
function stepSim(n) { for (let k = 0; k < n; k++) { applyDrag(S.dt); PlateSim.step(S); if (S.stepN % 4 === 0) evalLevel(); } processEvents(); dirty = true; }
let last = performance.now(), frames = 0, fpsT = 0, fps = 60, stepCap = mob ? 3 : 5;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now; frames++;
  if (now - fpsT > 1000) { fps = frames * 1000 / (now - fpsT); frames = 0; fpsT = now;
    if (!FAST && fps < 28 && DPR > .75) { DPR = Math.max(.75, DPR - .2); renderer.setPixelRatio(DPR); if (composer) composer.setPixelRatio(DPR); } }
  U.uTime.value += dt;
  if (!FX.frozen() && level) {
    stepAcc += dt * rate; let n = 0; while (stepAcc >= S.dt && n < stepCap) { stepAcc -= S.dt; n++; } if (n >= stepCap) stepAcc = 0;
    if (n) { stepSim(n); updateScrub(); }
  }
  if (dirty) { buildTex(); dirty = false; }
  // grinding while a push meets resistance
  if (drag && drag.kind === 'push') { let col = 0; for (const [key, c] of S.pairs) if ((key >> 4) === drag.id || (key & 15) === drag.id) col += c.col + c.sub * .4; setGrind(rate ? Math.min(.45, col / 60) : 0); }
  if (camT) { const k = Math.min(1, (now - camT.t0) / camT.ms), e = FX.ease.outCubic(k); for (const key of ['x', 'z', 'd', 'lon']) cam[key] = lerp(camT.from[key], camT[key], e); if (k >= 1) camT = null; }
  if (hintOn && grabbed && level.hint && typeof level.hint[1] === 'number' && lastEval && lastEval.frac > .35) hintOn = false;
  if (hintOn && level.hint && level.hint[1] === 'rift' && level.hintStage && lastEval && lastEval.frac > .4) hintOn = false;
  if (hintOn && level.hint && typeof level.hint[1] === 'string' && level.hint[1] !== 'rift' && grabbed && now - hintT0 > 9000) hintOn = false;
  placeCamera(); updateParts(dt);
  $('myr').textContent = Math.round(S.time - S.t0);
  drawOverlay(now); if (frames % 2 === 0) drawSeis();
  if (composer) composer.render(); else renderer.render(scene, camera);
}
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); if (composer) composer.setSize(innerWidth, innerHeight);
  fitOv(); [sparks, ash].forEach(P => P.p.material.uniforms.uPx.value = DPR * innerHeight * .5); }
addEventListener('resize', resize); resize();

// =====================================================================================================
//  BOOT
// =====================================================================================================
setView(SAVE.view === 2 && !SAVE.unlockMag ? 0 : SAVE.view || 0);
const startId = Q.get('level') || SAVE.cur || 'crumple';
openLevel(LEVELS.some(l => l.id === startId) || startId === 'daily' || startId === 'sandbox' ? startId : 'crumple');
if (SAVE.globe || Q.get('globe') == '1') toggleGlobe(true);
if (Q.has('view')) setView(+Q.get('view'));
if (Q.has('rate')) setRate(+Q.get('rate'));
// lab: pre-run a scripted push, then pose the camera (?steps=n&push=id,vx,vy&cam=x,z,d,tilt,yaw)
if (Q.has('steps')) { const pu = (Q.get('push') || '').split(';').filter(Boolean).map(s => s.split(',').map(Number)); for (let k = 0; k < +Q.get('steps'); k++) { for (const [id, vx, vy] of pu) { const p = S.plates[id]; if (p) { p.held = true; p.tvx = PlateSim.cmToCells(S, vx); p.tvy = PlateSim.cmToCells(S, vy); } } PlateSim.step(S); }
  for (const p of S.plates) p.held = false; S.events.length = 0; evalLevel(); hintOn = false; dirty = true; }
if (Q.has('cam')) { const [x, z, d, tilt, yaw] = Q.get('cam').split(',').map(Number); Object.assign(cam, { x, z, d, tilt: tilt ?? cam.tilt, yaw: yaw ?? 0, lon: x, lat: -z, gd: d }); }
if (Q.has('sun')) { const [a, b, c] = Q.get('sun').split(',').map(Number); U.uSun.value.set(a, b, c).normalize(); }
buildTex(); placeCamera();
renderer.compile(scene, camera);
requestAnimationFrame(frame);

// =====================================================================================================
//  TEST HOOKS
// =====================================================================================================
window.__plate = {
  get state() { return S; }, get level() { return level; }, get run() { return run; }, get lastEval() { return lastEval; }, Sim: PlateSim, LV, cam, SAVE,
  step(n = 1) { for (let k = 0; k < n; k++) { PlateSim.step(S); if (S.stepN % 4 === 0) evalLevel(); } processEvents(); dirty = true; return S.time; },
  push(id, dx, dy) { const p = S.plates[id]; if (!p || !p.alive) return false; p.held = true; p.tvx = PlateSim.cmToCells(S, dx); p.tvy = PlateSim.cmToCells(S, dy); return true; },
  release(id) { const p = S.plates[id]; if (p) p.held = false; },
  rift(pts) { const r = PlateSim.rift(S, pts.map(([u, v]) => [u * W, v * H])); dirty = true; return r; },
  stats() { const s = PlateSim.stats(S); return { maxElev: s.peak, peakCollision: s.peakCol, peakArc: s.peakSub, trench: s.trench, oceanWidth: s.oceanWidth, islands: s.islands, hotIslands: s.hotIslands, arcIslands: s.arcs.filter(a => a.n >= 2).length,
    hot: s.hot, superFrac: s.superFrac, shadowKm2: s.shadowKm2, quakes: s.quakes, volcanoes: s.volcanoes, sea: s.sea, plates: s.plates, time: s.time, activeFrac: s.activeFrac, raw: s }; },
  open: id => openLevel(id), setRate, setView, toggleGlobe, pick, toScreen, frameLevel, buildTex: () => buildTex(),
  contCentroid(id) { let n = 0, sx = 0, sy = 0; const p = S.plates[id]; if (!p || !p.alive) return null; for (let i = 0; i < N; i++) if (S.owner[i] === id && S.f[i] > .85) { let x = i % W; x -= Math.round((x - p.cx) / W) * W; sx += x; sy += (i / W) | 0; n++; } return n ? [sx / n, sy / n] : null; },
  perf() { renderer.render(scene, camera); const i = renderer.info; return { calls: i.render.calls, triangles: i.render.triangles, points: i.render.points, programs: i.programs.length, textures: i.memory.textures, geometries: i.memory.geometries, grid: [W, H], mesh: MESH, dpr: DPR, post: POST }; },
  ready: true,
};
</script>
