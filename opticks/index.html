<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opticks</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  main{flex:1;display:flex;min-height:0}
  #side{width:230px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px}
  .ch{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:12px 4px 4px;display:flex;justify-content:space-between}
  .ch.locked{color:var(--dim)}
  .lv{display:flex;justify-content:space-between;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:13px}
  .lv:hover{background:var(--panel2)}
  .lv.cur{background:var(--panel2);outline:1px solid var(--accent)}
  .lv.locked{opacity:.35;cursor:default}
  .lv .st{color:var(--accent);font-size:11px}
  #stage{flex:1;display:flex;flex-direction:column;min-width:0}
  #info{padding:10px 16px;border-bottom:1px solid var(--line);font-size:14px;line-height:1.5}
  #info h2{margin:0;font-size:20px}
  #info .story{color:#c9c6bd;max-width:900px}
  #wrap{flex:1;position:relative;min-height:0;background:#06080b}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #tray{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:var(--panel);align-items:center;flex-wrap:wrap;min-height:58px}
  .piece{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--dim);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:grab;user-select:none}
  .piece:hover{border-color:var(--accent)}
  .piece canvas{position:static;width:44px;height:28px}
  #status{margin-left:auto;font-size:13px}
  .ok{color:var(--good)} .no{color:var(--bad)}
  .hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--dim);pointer-events:none}
  .tg{font-size:13px;display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
  .tg span{border:1px solid var(--line);border-radius:20px;padding:1px 9px}
  .tg span.ok{border-color:var(--good)}
  @media (max-width:760px){body{height:auto;min-height:100vh;overflow:auto}main{flex-direction:column}#side{width:auto;max-height:160px;border-right:0;border-bottom:1px solid var(--line)}#wrap{height:62vh;flex:none}.topbar{flex-wrap:wrap}}
</style>
</head>
<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>🔦 Opticks</h1><span class="spacer"></span><span class="dim small" id="totals"></span><button id="helpBtn">?</button></div>
<main>
  <div id="side"></div>
  <div id="stage">
    <div id="info"></div>
    <div id="wrap"><canvas id="cv"></canvas><div class="hint">Drag pieces from the tray onto the bench · drag to move · scroll or <kbd>Q</kbd>/<kbd>E</kbd> to rotate (hold <kbd>Shift</kbd> for fine) · arrow keys nudge · <kbd>Delete</kbd> or double-click returns a piece</div></div>
    <div id="tray"></div>
  </div>
</main>
<script src="../shared/common.js"></script>
<script>
'use strict';
// ================= optics =================
const BW = 32, BH = 20;
const WL = [650, 600, 570, 530, 470, 420]; // wavelengths for white light (nm)
const GLASS = { crown: [1.5046, 4200], flint: [1.6040, 10500], water: [1.3199, 3000], diamond: [2.38, 15000] };
const nOf = (g, l) => GLASS[g][0] + GLASS[g][1] / (l * l);
function wlColor(l, a = 1) {
  let r = 0, g = 0, b = 0;
  if (l >= 620) r = 1; else if (l >= 580) { r = 1; g = (620 - l) / 40 * .65 + .35 * (l < 600); } else if (l >= 550) { r = (l - 550) / 30; g = 1; } else if (l >= 495) { g = 1; b = (550 - l) / 55; } else if (l >= 450) { g = (l - 450) / 45; b = 1; } else { r = (450 - l) / 60 * .6; b = 1; }
  if (l === 600) { r = 1; g = .55; b = 0; }
  return `rgba(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0},${a})`;
}
const rad = a => a * Math.PI / 180;
const rot = (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; };

// Piece geometry in world space
const SIZE = { mirror: 3, splitter: 3, lens: 4, screen: 3 };
function segOf(p) { const L = p.L ?? SIZE[p.t] ?? 3, [dx, dy] = rot(L / 2, 0, rad(p.a)); return [p.x - dx, p.y - dy, p.x + dx, p.y + dy]; }
function polyOf(p) {
  let pts;
  if (p.t === 'prism') { const s = p.s ?? 3, h = s * Math.sqrt(3) / 2; pts = [[-s / 2, h / 3], [s / 2, h / 3], [0, -2 * h / 3]]; }
  else if (p.t === 'rprism') { const s = p.s ?? 3; pts = [[-s / 2, s / 2], [s / 2, s / 2], [-s / 2, -s / 2]]; } // right-angle prism
  else { const w = p.w ?? 3, h = p.h ?? 2; pts = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]; }
  return pts.map(([x, y]) => { const [rx, ry] = rot(x, y, rad(p.a)); return [p.x + rx, p.y + ry]; });
}
function arcOf(p) { // concave mirror: circle of radius R = 2f, chord length L, opening toward local -y
  const f = p.f ?? 6, R = 2 * f, L = p.L ?? 4, half = Math.asin(Math.min(.95, L / 2 / R));
  const [cx, cy] = rot(0, -R, rad(p.a)); return { cx: p.x + cx, cy: p.y + cy, R, a0: rad(p.a) + Math.PI / 2 - half, a1: rad(p.a) + Math.PI / 2 + half };
}
function segHit(ox, oy, dx, dy, x1, y1, x2, y2) {
  const ex = x2 - x1, ey = y2 - y1, den = dx * ey - dy * ex; if (Math.abs(den) < 1e-12) return null;
  const t = ((x1 - ox) * ey - (y1 - oy) * ex) / den, u = ((x1 - ox) * dy - (y1 - oy) * dx) / den;
  if (t > 1e-6 && u >= 0 && u <= 1) return { t, u }; return null;
}
function circHit(ox, oy, dx, dy, cx, cy, r) {
  const fx = ox - cx, fy = oy - cy, b = fx * dx + fy * dy, c = fx * fx + fy * fy - r * r, disc = b * b - c; if (disc < 0) return [];
  const s = Math.sqrt(disc); return [-b - s, -b + s].filter(t => t > 1e-6);
}
const angIn = (a, a0, a1) => { const tw = Math.PI * 2; let x = ((a - a0) % tw + tw) % tw, w = ((a1 - a0) % tw + tw) % tw; return x <= w; };

function trace(level, pieces) {
  const segs = [], polys = [], arcs = [], spots = [];
  const all = [...(level.fixed || []).map(p => ({ ...p, fixed: 1 })), ...pieces];
  for (const p of all) {
    if (p.t === 'mirror' || p.t === 'splitter' || p.t === 'lens' || p.t === 'wall') segs.push({ p, s: p.t === 'wall' ? [p.x1, p.y1, p.x2, p.y2] : segOf(p) });
    else if (p.t === 'prism' || p.t === 'rprism' || p.t === 'block') polys.push({ p, v: polyOf(p), g: p.g || 'crown' });
    else if (p.t === 'arc') arcs.push({ p, ...arcOf(p) });
  }
  level.targets.forEach((tg, i) => { if (tg.k === 'spot') spots.push({ i, ...tg }); else segs.push({ p: { t: 'screen', ti: i }, s: [tg.x1, tg.y1, tg.x2, tg.y2] }); });
  const walls = [[0, 0, BW, 0], [BW, 0, BW, BH], [BW, BH, 0, BH], [0, BH, 0, 0]];
  const paths = [], hits = level.targets.map(() => []);
  const rays = [];
  level.sources.forEach((s, si) => {
    const lams = s.l === 'white' ? WL : [s.l];
    const n = s.n ?? 1;
    for (let k = 0; k < n; k++) {
      let ox = s.x, oy = s.y, a = rad(s.a);
      if (s.k === 'beam' && n > 1) { const off = -s.w / 2 + s.w * k / (n - 1), [px, py] = rot(0, off, a); ox += px; oy += py; }
      if (s.k === 'fan' && n > 1) a += rad(-s.spread / 2 + s.spread * k / (n - 1));
      for (const l of lams) rays.push({ x: ox, y: oy, dx: Math.cos(a), dy: Math.sin(a), l, I: 1 / lams.length, si, k, depth: 0 });
    }
  });
  let budget = 6000;
  while (rays.length && budget-- > 0) {
    const r = rays.pop(); if (r.I < .02 || r.depth > 60) continue;
    let best = { t: 1e9 };
    for (const s of segs) { const h = segHit(r.x, r.y, r.dx, r.dy, ...s.s); if (h && h.t < best.t) best = { t: h.t, u: h.u, seg: s }; }
    for (const pg of polys) for (let e = 0; e < pg.v.length; e++) { const [x1, y1] = pg.v[e], [x2, y2] = pg.v[(e + 1) % pg.v.length]; const h = segHit(r.x, r.y, r.dx, r.dy, x1, y1, x2, y2); if (h && h.t < best.t) best = { t: h.t, poly: pg, e }; }
    for (const ac of arcs) for (const t of circHit(r.x, r.y, r.dx, r.dy, ac.cx, ac.cy, ac.R)) { const hx = r.x + r.dx * t, hy = r.y + r.dy * t; if (t < best.t && angIn(Math.atan2(hy - ac.cy, hx - ac.cx), ac.a0, ac.a1)) best = { t, arc: ac }; }
    for (const sp of spots) for (const t of circHit(r.x, r.y, r.dx, r.dy, sp.x, sp.y, sp.r)) if (t < best.t) best = { t, spot: sp };
    for (const w of walls) { const h = segHit(r.x, r.y, r.dx, r.dy, ...w); if (h && h.t < best.t) best = { t: h.t, edge: 1 }; }
    const hx = r.x + r.dx * best.t, hy = r.y + r.dy * best.t;
    paths.push({ x1: r.x, y1: r.y, x2: hx, y2: hy, l: r.l, I: r.I });
    const nr = (dx, dy, I = r.I) => rays.push({ ...r, x: hx, y: hy, dx, dy, I, depth: r.depth + 1 });
    if (best.edge) continue;
    if (best.spot) { for (const sp of spots) if (Math.hypot(hx - sp.x, hy - sp.y) <= sp.r + 1e-6) hits[sp.i].push({ si: r.si, k: r.k, l: r.l, I: r.I, x: hx, y: hy, dx: r.dx, dy: r.dy }); continue; }
    if (best.arc) { const ac = best.arc, nx = (hx - ac.cx) / ac.R, ny = (hy - ac.cy) / ac.R, d = r.dx * nx + r.dy * ny; nr(r.dx - 2 * d * nx, r.dy - 2 * d * ny); continue; }
    if (best.seg) {
      const { p, s } = best.seg, ex = s[2] - s[0], ey = s[3] - s[1], L = Math.hypot(ex, ey), tx = ex / L, ty = ey / L, nx = -ty, ny = tx;
      if (p.t === 'wall') continue;
      if (p.t === 'screen') { hits[p.ti].push({ si: r.si, k: r.k, l: r.l, I: r.I, x: hx, y: hy, dx: r.dx, dy: r.dy, u: best.u }); continue; }
      const dn = r.dx * nx + r.dy * ny;
      if (p.t === 'mirror') { nr(r.dx - 2 * dn * nx, r.dy - 2 * dn * ny); continue; }
      if (p.t === 'splitter') { nr(r.dx - 2 * dn * nx, r.dy - 2 * dn * ny, r.I / 2); nr(r.dx, r.dy, r.I / 2); continue; }
      if (p.t === 'lens') {
        const sgn = dn >= 0 ? 1 : -1, an = Math.abs(dn), u = (r.dx * tx + r.dy * ty) / an, y = (best.u - .5) * L;
        const f = (p.f ?? 6) * (GLASS[p.g || 'crown'][0] + GLASS[p.g || 'crown'][1] / 589 ** 2 - 1) / (nOf(p.g || 'crown', r.l) - 1);
        const u2 = u - y / f, ddx = sgn * nx + u2 * tx, ddy = sgn * ny + u2 * ty, m = Math.hypot(ddx, ddy);
        nr(ddx / m, ddy / m); continue;
      }
    }
    if (best.poly) {
      const pg = best.poly, [x1, y1] = pg.v[best.e], [x2, y2] = pg.v[(best.e + 1) % pg.v.length];
      let ex = x2 - x1, ey = y2 - y1; const L = Math.hypot(ex, ey); ex /= L; ey /= L;
      let nx = ey, ny = -ex; // outward normal for CCW? check by centroid
      const cx = pg.v.reduce((a, v) => a + v[0], 0) / pg.v.length, cy = pg.v.reduce((a, v) => a + v[1], 0) / pg.v.length;
      if ((hx - cx) * nx + (hy - cy) * ny < 0) { nx = -nx; ny = -ny; }
      const cosi = -(r.dx * nx + r.dy * ny), entering = cosi > 0, n = nOf(pg.g, r.l);
      const eta = entering ? 1 / n : n, N = entering ? [nx, ny] : [-nx, -ny], ci = Math.abs(cosi);
      const k = 1 - eta * eta * (1 - ci * ci);
      if (k < 0) { nr(r.dx + 2 * ci * N[0], r.dy + 2 * ci * N[1]); continue; } // total internal reflection
      const ct = Math.sqrt(k); nr(eta * r.dx + (eta * ci - ct) * N[0], eta * r.dy + (eta * ci - ct) * N[1]);
      continue;
    }
  }
  return { paths, hits };
}

// ================= target checks =================
function checkTarget(tg, hits, level) {
  const src = tg.src ?? 0, s = level.sources[src], lams = s.l === 'white' ? WL : [s.l];
  const want = tg.l ? (Array.isArray(tg.l) ? tg.l : [tg.l]) : lams;
  const hs = hits.filter(h => h.si === src && want.includes(h.l));
  const total = (s.n ?? 1) * want.length;
  const frac = hs.length / total;
  const bad = tg.only ? hits.filter(h => !tg.only.includes(h.l)).length : 0;
  let ok = frac >= (tg.frac ?? .99) - 1e-9 && bad === 0, msg = `${Math.round(frac * 100)}%`;
  if (ok && tg.par != null) { // parallel: direction spread in degrees
    const as = hs.map(h => Math.atan2(h.dy, h.dx) * 180 / Math.PI), spr = Math.max(...as) - Math.min(...as);
    ok = spr <= tg.par; msg += ` · spread ${spr.toFixed(1)}°`;
  }
  if (ok && tg.width) { const us = hs.map(h => h.u * Math.hypot(tg.x2 - tg.x1, tg.y2 - tg.y1)); const w = Math.max(...us) - Math.min(...us); ok = w >= tg.width[0] && w <= tg.width[1]; msg += ` · width ${w.toFixed(2)}`; }
  if (bad) msg += ' · wrong colours';
  return { ok, msg, frac };
}

// ================= levels =================
// Every level is authored from a working solution (sol); the tray holds the solution's pieces.
const W = (x1, y1, x2, y2) => ({ t: 'wall', x1, y1, x2, y2 });
const LASER = (x, y, a, l = 650) => ({ k: 'beam', x, y, a, l, n: 1 });
const CHS = ['Reflection', 'Refraction', 'Lenses', 'Colour', 'Instruments'];
const L = [];
// ---- Reflection
L.push({ c: 0, n: 'Bounce', s: 'Light travels in straight lines until something turns it. A mirror reflects at the same angle it arrives. <i>Drag the mirror onto the bench and rotate it until the laser hits the target.</i>',
  sources: [LASER(2, 4, 0)], targets: [{ k: 'spot', x: 16, y: 16, r: .6 }], sol: [{ t: 'mirror', x: 16, y: 4, a: 45 }] });
L.push({ c: 0, n: 'Around the Wall', s: 'Three mirrors and a wall in the way.',
  sources: [LASER(2, 10, 0)], fixed: [W(12, 4, 12, 18)], targets: [{ k: 'spot', x: 22, y: 12, r: .6 }], sol: [{ t: 'mirror', x: 6, y: 10, a: -45 }, { t: 'mirror', x: 6, y: 2, a: -45 }, { t: 'mirror', x: 22, y: 2, a: 45 }] });
L.push({ c: 0, n: 'Two Targets', s: 'A <b>beam splitter</b> is a half-silvered mirror: half the light passes straight through and half is reflected.',
  sources: [LASER(2, 10, 0)], targets: [{ k: 'spot', x: 26, y: 10, r: .6, frac: .45 }, { k: 'spot', x: 12, y: 18, r: .6, frac: .45 }], sol: [{ t: 'splitter', x: 12, y: 10, a: 45 }] });
L.push({ c: 0, n: 'Return to Sender', s: 'Two mirrors at right angles send light straight back the way it came, wherever it comes from. Astronauts left arrays of these "corner reflectors" on the Moon, and lasers still bounce off them.',
  sources: [LASER(2, 6, 0)], fixed: [W(1, 7.5, 14, 7.5)], targets: [{ k: 'spot', x: 2.5, y: 9, r: .6 }], sol: [{ t: 'mirror', x: 20, y: 6, a: 45 }, { t: 'mirror', x: 20, y: 9, a: -45 }] });
L.push({ c: 0, n: 'Three Lasers', s: 'Three beams, one target. Each beam needs its own mirror.',
  sources: [LASER(2, 3, 0), LASER(2, 17, 0, 530), LASER(30, 3, 180, 470)], targets: [{ k: 'spot', x: 16, y: 10, r: .7, src: 0 }, { k: 'spot', x: 16, y: 10, r: .7, src: 1 }, { k: 'spot', x: 16, y: 10, r: .7, src: 2 }],
  sol: [{ t: 'mirror', x: 9, y: 3, a: 22.5 }, { t: 'mirror', x: 9, y: 17, a: -22.5 }, { t: 'mirror', x: 23, y: 3, a: -22.5 }] });
L.push({ c: 0, n: 'The Maze', s: 'Thread the beam through the gaps.',
  sources: [LASER(2, 2, 0)], fixed: [W(8, 0, 8, 14), W(16, 6, 16, 20), W(24, 0, 24, 14)], targets: [{ k: 'spot', x: 28, y: 2.5, r: .6 }],
  sol: [{ t: 'mirror', x: 5, y: 2, a: 45 }, { t: 'mirror', x: 5, y: 17, a: 45 }, { t: 'mirror', x: 12, y: 17, a: -45 }, { t: 'mirror', x: 12, y: 3, a: -45 }, { t: 'mirror', x: 20, y: 3, a: 45 }, { t: 'mirror', x: 20, y: 17, a: 45 }, { t: 'mirror', x: 28, y: 17, a: -45 }] });
// ---- Refraction
L.push({ c: 1, n: 'A Slab of Glass', s: 'Light slows down in glass and bends at the surface (Snell\'s law). A tilted slab shifts a beam sideways without changing its direction.',
  sources: [LASER(2, 9, 0)], targets: [{ k: 'spot', x: 29, y: 7.83, r: .35 }], sol: [{ t: 'block', x: 14, y: 9, a: 40, w: 4, h: 3 }] });
L.push({ c: 1, n: 'Through the Prism', s: 'A prism bends light twice, once going in and once coming out, towards its thick end.',
  sources: [LASER(2, 12, 0)], targets: [{ k: 'spot', x: 20, y: 4.0, r: .5 }], sol: [{ t: 'prism', x: 10, y: 12, a: 160, s: 3 }] });
L.push({ c: 1, n: 'Total Internal Reflection', s: 'Light trying to leave glass at a shallow angle cannot get out. It reflects perfectly, better than any mirror. Binoculars use right-angle prisms this way. <i>No mirrors today.</i>',
  sources: [LASER(2, 5, 0)], targets: [{ k: 'spot', x: 16, y: 17, r: .6 }], sol: [{ t: 'rprism', x: 16, y: 5, a: 0, s: 3 }] });
L.push({ c: 1, n: 'Periscope of Glass', s: 'Two right-angle prisms make a periscope.',
  sources: [LASER(2, 15, 0)], fixed: [W(12, 8, 12, 20)], targets: [{ k: 'spot', x: 28, y: 4, r: .6 }], sol: [{ t: 'rprism', x: 6, y: 15, a: 90, s: 3 }, { t: 'rprism', x: 6, y: 4, a: 270, s: 3 }] });
L.push({ c: 1, n: 'Under Water', s: 'A fixed tank of water (n = 1.33). Get the beam to the target on the tank floor.',
  sources: [LASER(2, 3, 0)], fixed: [{ t: 'block', x: 20, y: 14.8, a: 0, w: 20, h: 9.6, g: 'water' }], targets: [{ k: 'spot', x: 0, y: 18.8, r: .5, probe: 650 }], sol: [{ t: 'mirror', x: 10, y: 3, a: 25 }] });
L.push({ c: 1, n: 'Bent Light', s: 'The target is out of plain sight, and the gap in the wall is narrow.',
  sources: [LASER(2, 10, 0)], fixed: [W(14, 0, 14, 8), W(14, 12, 14, 20)], targets: [{ k: 'spot', x: 26, y: 15.8, r: .6 }], sol: [{ t: 'prism', x: 20, y: 10, a: 0, s: 3 }] });
// ---- Lenses
const SUN = (x, y, a, w = 3, n = 9) => ({ k: 'beam', x, y, a, l: 650, n, w });
L.push({ c: 2, n: 'Burning Glass', s: 'A converging lens bends every parallel ray through one point, the <b>focus</b>, one focal length away. Archimedes supposedly set ships alight this way.',
  sources: [SUN(2, 10, 0, 3, 9)], targets: [{ k: 'spot', x: 18, y: 10, r: .25 }], sol: [{ t: 'lens', x: 12, y: 10, a: 90, f: 6 }] });
L.push({ c: 2, n: 'Searchlight', s: 'Run it backwards: a lamp at the focus of a lens comes out as a parallel beam. Make the light parallel and hit the screen.',
  sources: [{ k: 'fan', x: 6, y: 10, a: 0, spread: 30, n: 9, l: 590 }], targets: [{ k: 'screen', x1: 28, y1: 8, x2: 28, y2: 12, par: 1 }], sol: [{ t: 'lens', x: 12, y: 10, a: 90, f: 6, L: 5 }] });
L.push({ c: 2, n: 'Keplerian Telescope', s: 'Two converging lenses that share a focus make a telescope. The beam comes out parallel again, but narrower by the ratio of the focal lengths. Shrink this 3-unit beam to 1 unit.',
  sources: [SUN(2, 10, 0, 3, 7)], targets: [{ k: 'screen', x1: 30, y1: 8, x2: 30, y2: 12, par: 1, width: [.9, 1.1] }], sol: [{ t: 'lens', x: 8, y: 10, a: 90, f: 9, L: 4 }, { t: 'lens', x: 20, y: 10, a: 90, f: 3, L: 4 }] });
L.push({ c: 2, n: 'Galilean Telescope', s: 'Galileo used a <b>diverging</b> lens as his eyepiece. It is shorter, and the image stays upright. Shrink the beam 3× again with a converging and a diverging lens.',
