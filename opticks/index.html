<style>

  body{display:flex;flex-direction:column;height:100vh;overflow:hidden;color:#e8d8b4}

  button:hover:not(:disabled){background:linear-gradient(#ecc97e,#9a7230);border-color:#2a1a08}

<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>Opticks</h1><span class="spacer"></span><span class="dim small" id="totals"></span><button id="helpBtn">?</button></div>

<script src="../shared/fx.js"></script>
<script>
'use strict';
// ================= sound: glass, oak, brass =================
const SFX = {
  knock: () => { FX.tone({ f: 210, f2: 120, type: 'triangle', dur: .09, vol: .22 }); FX.tone({ noise: 1, f: 900, q: .8, dur: .05, vol: .06 }); },
  tick: () => FX.tone({ noise: 1, f: 5200, q: 6, dur: .012, vol: .035 }),
  glass: () => [1568, 2349, 3136, 3951].forEach((f, i) => FX.tone({ f: f * (1 + (Math.random() - .5) * .004), type: 'sine', dur: 2.2 - i * .4, vol: .07 / (i + 1), delay: i * .03 })),
};
const sfx = n => { try { if (typeof FX !== 'undefined') SFX[n](); } catch (e) {} };
let lastTick = 0; const tickSfx = () => { const t = performance.now(); if (t - lastTick > 45) { lastTick = t; sfx('tick'); } };
// ================= optics =================
const BW = 32, BH = 20;
const WL = [650, 600, 570, 530, 470, 420]; // wavelengths for white light (nm)
const GLASS = { crown: [1.5046, 4200], flint: [1.6040, 10500], water: [1.3199, 3000], diamond: [2.38, 15000] };
const nOf = (g, l) => GLASS[g][0] + GLASS[g][1] / (l * l);
function wlColor(l, a = 1) {
  let r = 0, g = 0, b = 0;
  if (l >= 620) r = 1; else if (l >= 580) { r = 1; g = (620 - l) / 40 * .65 + .35 * (l < 600); } else if (l >= 550) { r = (l - 550) / 30; g = 1; } else if (l >= 495) { g = 1; b = (550 - l) / 55; } else if (l >= 450) { g = (l - 450) / 45; b = 1; } else { r = (450 - l) / 60 * .6; b = 1; }
  if (l === 600) { r = 1; g = .55; b = 0; }
  return `rgba(${r * 255 | 0},${g * 255 | 0},${b * 255 | 0},${a})`;
}
const rad = a => a * Math.PI / 180;
const rot = (x, y, a) => { const c = Math.cos(a), s = Math.sin(a); return [x * c - y * s, x * s + y * c]; };

// Piece geometry in world space
const SIZE = { mirror: 3, splitter: 3, lens: 4, screen: 3 };
function segOf(p) { const L = p.L ?? SIZE[p.t] ?? 3, [dx, dy] = rot(L / 2, 0, rad(p.a)); return [p.x - dx, p.y - dy, p.x + dx, p.y + dy]; }
function polyOf(p) {
  let pts;
  if (p.t === 'prism') { const s = p.s ?? 3, h = s * Math.sqrt(3) / 2; pts = [[-s / 2, h / 3], [s / 2, h / 3], [0, -2 * h / 3]]; }
  else if (p.t === 'rprism') { const s = p.s ?? 3; pts = [[-s / 2, s / 2], [s / 2, s / 2], [-s / 2, -s / 2]]; } // right-angle prism
  else { const w = p.w ?? 3, h = p.h ?? 2; pts = [[-w / 2, -h / 2], [w / 2, -h / 2], [w / 2, h / 2], [-w / 2, h / 2]]; }
  return pts.map(([x, y]) => { const [rx, ry] = rot(x, y, rad(p.a)); return [p.x + rx, p.y + ry]; });
}
function arcOf(p) { // concave mirror: circle of radius R = 2f, chord length L, opening toward local -y
  const f = p.f ?? 6, R = 2 * f, L = p.L ?? 4, half = Math.asin(Math.min(.95, L / 2 / R));
  const [cx, cy] = rot(0, -R, rad(p.a)); return { cx: p.x + cx, cy: p.y + cy, R, a0: rad(p.a) + Math.PI / 2 - half, a1: rad(p.a) + Math.PI / 2 + half };
}
function segHit(ox, oy, dx, dy, x1, y1, x2, y2) {
  const ex = x2 - x1, ey = y2 - y1, den = dx * ey - dy * ex; if (Math.abs(den) < 1e-12) return null;
  const t = ((x1 - ox) * ey - (y1 - oy) * ex) / den, u = ((x1 - ox) * dy - (y1 - oy) * dx) / den;
  if (t > 1e-6 && u >= 0 && u <= 1) return { t, u }; return null;
}
function circHit(ox, oy, dx, dy, cx, cy, r) {
  const fx = ox - cx, fy = oy - cy, b = fx * dx + fy * dy, c = fx * fx + fy * fy - r * r, disc = b * b - c; if (disc < 0) return [];
  const s = Math.sqrt(disc); return [-b - s, -b + s].filter(t => t > 1e-6);
}
const angIn = (a, a0, a1) => { const tw = Math.PI * 2; let x = ((a - a0) % tw + tw) % tw, w = ((a1 - a0) % tw + tw) % tw; return x <= w; };

function trace(level, pieces) {
  const segs = [], polys = [], arcs = [], spots = [];
  const all = [...(level.fixed || []).map(p => ({ ...p, fixed: 1 })), ...pieces];
  for (const p of all) {
    if (p.t === 'mirror' || p.t === 'splitter' || p.t === 'lens' || p.t === 'wall') segs.push({ p, s: p.t === 'wall' ? [p.x1, p.y1, p.x2, p.y2] : segOf(p) });
    else if (p.t === 'prism' || p.t === 'rprism' || p.t === 'block') polys.push({ p, v: polyOf(p), g: p.g || 'crown' });
    else if (p.t === 'arc') arcs.push({ p, ...arcOf(p) });
  }
  level.targets.forEach((tg, i) => { if (tg.k === 'spot') spots.push({ i, ...tg }); else segs.push({ p: { t: 'screen', ti: i }, s: [tg.x1, tg.y1, tg.x2, tg.y2] }); });
  const walls = [[0, 0, BW, 0], [BW, 0, BW, BH], [BW, BH, 0, BH], [0, BH, 0, 0]];
  const paths = [], hits = level.targets.map(() => []);
  const rays = [];
  level.sources.forEach((s, si) => {
    const lams = s.l === 'white' ? WL : [s.l];
    const n = s.n ?? 1;
    for (let k = 0; k < n; k++) {
      let ox = s.x, oy = s.y, a = rad(s.a);
      if (s.k === 'beam' && n > 1) { const off = -s.w / 2 + s.w * k / (n - 1), [px, py] = rot(0, off, a); ox += px; oy += py; }
      if (s.k === 'fan' && n > 1) a += rad(-s.spread / 2 + s.spread * k / (n - 1));
      for (const l of lams) rays.push({ x: ox, y: oy, dx: Math.cos(a), dy: Math.sin(a), l, I: 1 / lams.length, si, k, depth: 0 });
    }
  });
  let budget = 6000;
  while (rays.length && budget-- > 0) {
    const r = rays.pop(); if (r.I < .02 || r.depth > 60) continue;
    let best = { t: 1e9 };
    for (const s of segs) { const h = segHit(r.x, r.y, r.dx, r.dy, ...s.s); if (h && h.t < best.t) best = { t: h.t, u: h.u, seg: s }; }
    for (const pg of polys) for (let e = 0; e < pg.v.length; e++) { const [x1, y1] = pg.v[e], [x2, y2] = pg.v[(e + 1) % pg.v.length]; const h = segHit(r.x, r.y, r.dx, r.dy, x1, y1, x2, y2); if (h && h.t < best.t) best = { t: h.t, poly: pg, e }; }
    for (const ac of arcs) for (const t of circHit(r.x, r.y, r.dx, r.dy, ac.cx, ac.cy, ac.R)) { const hx = r.x + r.dx * t, hy = r.y + r.dy * t; if (t < best.t && angIn(Math.atan2(hy - ac.cy, hx - ac.cx), ac.a0, ac.a1)) best = { t, arc: ac }; }
    for (const sp of spots) for (const t of circHit(r.x, r.y, r.dx, r.dy, sp.x, sp.y, sp.r)) if (t < best.t) best = { t, spot: sp };
    for (const w of walls) { const h = segHit(r.x, r.y, r.dx, r.dy, ...w); if (h && h.t < best.t) best = { t: h.t, edge: 1 }; }
    const hx = r.x + r.dx * best.t, hy = r.y + r.dy * best.t;
    paths.push({ x1: r.x, y1: r.y, x2: hx, y2: hy, l: r.l, I: r.I });
    const nr = (dx, dy, I = r.I) => rays.push({ ...r, x: hx, y: hy, dx, dy, I, depth: r.depth + 1 });
    if (best.edge) continue;
    if (best.spot) { for (const sp of spots) if (Math.hypot(hx - sp.x, hy - sp.y) <= sp.r + 1e-6) hits[sp.i].push({ si: r.si, k: r.k, l: r.l, I: r.I, x: hx, y: hy, dx: r.dx, dy: r.dy }); continue; }
    if (best.arc) { const ac = best.arc, nx = (hx - ac.cx) / ac.R, ny = (hy - ac.cy) / ac.R, d = r.dx * nx + r.dy * ny; nr(r.dx - 2 * d * nx, r.dy - 2 * d * ny); continue; }
    if (best.seg) {
      const { p, s } = best.seg, ex = s[2] - s[0], ey = s[3] - s[1], L = Math.hypot(ex, ey), tx = ex / L, ty = ey / L, nx = -ty, ny = tx;
      if (p.t === 'wall') continue;
      if (p.t === 'screen') { hits[p.ti].push({ si: r.si, k: r.k, l: r.l, I: r.I, x: hx, y: hy, dx: r.dx, dy: r.dy, u: best.u }); continue; }
      const dn = r.dx * nx + r.dy * ny;
      if (p.t === 'mirror') { nr(r.dx - 2 * dn * nx, r.dy - 2 * dn * ny); continue; }
      if (p.t === 'splitter') { nr(r.dx - 2 * dn * nx, r.dy - 2 * dn * ny, r.I / 2); nr(r.dx, r.dy, r.I / 2); continue; }
      if (p.t === 'lens') {
        const sgn = dn >= 0 ? 1 : -1, an = Math.abs(dn), u = (r.dx * tx + r.dy * ty) / an, y = (best.u - .5) * L;
        const f = (p.f ?? 6) * (GLASS[p.g || 'crown'][0] + GLASS[p.g || 'crown'][1] / 589 ** 2 - 1) / (nOf(p.g || 'crown', r.l) - 1);
        const u2 = u - y / f, ddx = sgn * nx + u2 * tx, ddy = sgn * ny + u2 * ty, m = Math.hypot(ddx, ddy);
        nr(ddx / m, ddy / m); continue;
      }
    }
    if (best.poly) {
      const pg = best.poly, [x1, y1] = pg.v[best.e], [x2, y2] = pg.v[(best.e + 1) % pg.v.length];
      let ex = x2 - x1, ey = y2 - y1; const L = Math.hypot(ex, ey); ex /= L; ey /= L;
      let nx = ey, ny = -ex; // outward normal for CCW? check by centroid
      const cx = pg.v.reduce((a, v) => a + v[0], 0) / pg.v.length, cy = pg.v.reduce((a, v) => a + v[1], 0) / pg.v.length;
      if ((hx - cx) * nx + (hy - cy) * ny < 0) { nx = -nx; ny = -ny; }
      const cosi = -(r.dx * nx + r.dy * ny), entering = cosi > 0, n = nOf(pg.g, r.l);
      const eta = entering ? 1 / n : n, N = entering ? [nx, ny] : [-nx, -ny], ci = Math.abs(cosi);
      const k = 1 - eta * eta * (1 - ci * ci);
      if (k < 0) { nr(r.dx + 2 * ci * N[0], r.dy + 2 * ci * N[1]); continue; } // total internal reflection
      const ct = Math.sqrt(k); nr(eta * r.dx + (eta * ci - ct) * N[0], eta * r.dy + (eta * ci - ct) * N[1]);
      continue;
    }
  }
  return { paths, hits };
}

// ================= target checks =================
function checkTarget(tg, hits, level) {
  const src = tg.src ?? 0, s = level.sources[src], lams = s.l === 'white' ? WL : [s.l];
  const want = tg.l ? (Array.isArray(tg.l) ? tg.l : [tg.l]) : lams;
  const hs = hits.filter(h => h.si === src && want.includes(h.l));
  const total = (s.n ?? 1) * want.length;
  const frac = hs.length / total;
  const bad = tg.only ? hits.filter(h => !tg.only.includes(h.l)).length : 0;
  let ok = frac >= (tg.frac ?? .99) - 1e-9 && bad === 0, msg = `${Math.round(frac * 100)}%`;
  if (ok && tg.par != null) { // parallel: direction spread in degrees
    const as = hs.map(h => Math.atan2(h.dy, h.dx) * 180 / Math.PI), spr = Math.max(...as) - Math.min(...as);
    ok = spr <= tg.par; msg += ` · spread ${spr.toFixed(1)}°`;
  }
  if (ok && tg.width) { const us = hs.map(h => h.u * Math.hypot(tg.x2 - tg.x1, tg.y2 - tg.y1)); const w = Math.max(...us) - Math.min(...us); ok = w >= tg.width[0] && w <= tg.width[1]; msg += ` · width ${w.toFixed(2)}`; }
  if (bad) msg += ' · wrong colours';
  return { ok, msg, frac };
}

// ================= levels =================
// Every level is authored from a working solution (sol); the tray holds the solution's pieces.
const W = (x1, y1, x2, y2) => ({ t: 'wall', x1, y1, x2, y2 });
const LASER = (x, y, a, l = 650) => ({ k: 'beam', x, y, a, l, n: 1 });
const CHS = ['Reflection', 'Refraction', 'Lenses', 'Colour', 'Instruments'];
const L = [];
// ---- Reflection
L.push({ c: 0, n: 'Bounce', s: 'Light travels in straight lines until something turns it. A mirror reflects at the same angle it arrives. <i>Drag the mirror onto the bench and rotate it until the laser hits the target.</i>',
  sources: [LASER(2, 4, 0)], targets: [{ k: 'spot', x: 16, y: 16, r: .6 }], sol: [{ t: 'mirror', x: 16, y: 4, a: 45 }] });
L.push({ c: 0, n: 'Around the Wall', s: 'Three mirrors and a wall in the way.',
  sources: [LASER(2, 10, 0)], fixed: [W(12, 4, 12, 18)], targets: [{ k: 'spot', x: 22, y: 12, r: .6 }], sol: [{ t: 'mirror', x: 6, y: 10, a: -45 }, { t: 'mirror', x: 6, y: 2, a: -45 }, { t: 'mirror', x: 22, y: 2, a: 45 }] });
L.push({ c: 0, n: 'Two Targets', s: 'A <b>beam splitter</b> is a half-silvered mirror: half the light passes straight through and half is reflected.',
  sources: [LASER(2, 10, 0)], targets: [{ k: 'spot', x: 26, y: 10, r: .6, frac: .45 }, { k: 'spot', x: 12, y: 18, r: .6, frac: .45 }], sol: [{ t: 'splitter', x: 12, y: 10, a: 45 }] });
L.push({ c: 0, n: 'Return to Sender', s: 'Two mirrors at right angles send light straight back the way it came, wherever it comes from. Astronauts left arrays of these "corner reflectors" on the Moon, and lasers still bounce off them.',

  else if (e.key === 'ArrowUp') p.y = +(p.y - mv).toFixed(2); else if (e.key === 'ArrowDown') p.y = +(p.y + mv).toFixed(2);
  else if (e.key === 'Delete' || e.key === 'Backspace') { placed.splice(sel, 1); sel = -1; save(); renderTray(); recompute(); return; }
  else return;
  p.x = Math.min(BW, Math.max(0, p.x)); p.y = Math.min(BH, Math.max(0, p.y)); // nudging can't push a piece off the bench

});

// A level is won only once the light has stayed on every target for SETTLE ms with nothing being dragged,
// so sweeping a mirror past the right angle (wheel, keys or drag) does not count.
const SETTLE = 800;
const solvedNow = () => !!(R && R.lv === cur && R.checks.every(c => c.ok));
function recompute() {
  const lv = L[cur]; R = trace(lv, placed); R.lv = cur;
  R.checks = lv.targets.map((t, i) => checkTarget(t, R.hits[i], lv));
  draw(); updateStatus();
  clearTimeout(winT); winT = 0;
  if (solvedNow() && !drag && !S.done[cur]) { winT = setTimeout(() => { winT = 0; if (solvedNow() && !drag) win(); }, SETTLE); updateStatus(); }
}
function updateStatus() {
  if (!R || R.lv !== cur || !$('tg')) return;
  $('tg').innerHTML = L[cur].targets.map((t, i) => `<span class="${R.checks[i].ok ? 'ok' : ''}">${R.checks[i].ok ? '✓' : '○'} Target ${i + 1}${t.l ? ' (' + (Array.isArray(t.l) ? 'colours' : colourName(t.l)) + (t.only ? ' only' : '') + ')' : ''}${t.par != null ? ' · parallel' : ''}${t.width ? ` · width ${((t.width[0] + t.width[1]) / 2).toFixed(0)}` : ''}: ${R.checks[i].msg}</span>`).join('') + (winT ? '<span class="ok"> · Hold it there…</span>' : '') + (placed[sel] ? `<span class="dim"> · ${pieceName(placed[sel])} at ${placed[sel].a}°</span>` : '');
}
const colourName = l => ({ 650: 'red', 600: 'orange', 570: 'yellow', 530: 'green', 470: 'blue', 420: 'violet', 590: 'amber' })[l] || l + 'nm';
// Signature moment: the paper targets catch the light, a spectrum rings out of each one, and the notebook writes Q.E.D.
let bloom = null;
function ROMAN(n) { const t = [[10, 'X'], [9, 'IX'], [5, 'V'], [4, 'IV'], [1, 'I']]; let s = ''; for (const [v, r] of t) while (n >= v) { s += r; n -= v; } return s; }
function win() {
  if (S.done[cur]) return;
  S.done[cur] = 1; persist(); render(); sfx('glass');
  const lv = L[cur]; bloom = { t0: performance.now(), lv: cur, at: lv.targets.map(t => t.k === 'spot' ? [t.x, t.y] : [(t.x1 + t.x2) / 2, (t.y1 + t.y2) / 2]) };
  const at = cur; setTimeout(() => { if (cur === at) showQed(); }, 900);
}
function showQed() {
  const nxt = L.findIndex((l, j) => j > cur && !S.done[j] && chOpen(l.c));
  const d = document.createElement('div'); d.className = 'qed'; d.setAttribute('role', 'status');
  d.innerHTML = `<span class="qedMark">Q.E.D.</span><span class="qedTxt">Experimentum ${ROMAN(cur + 1)} confirmatum. The light goes where you sent it.</span>${nxt >= 0 ? `<button class="primary" id="nextLv">Next: ${L[nxt].n}</button>` : ''}`;
  $('info').appendChild(d);
  if (nxt >= 0) $('nextLv').onclick = () => loadLevel(nxt);
}

// ================= drawing =================
function drawPiece(c, p, selected, lw = 1 / view.s) {
  c.save();
  if (p.t === 'mirror' || p.t === 'splitter' || p.t === 'lens') {
    const L2 = (p.L ?? SIZE[p.t]) / 2, [dx, dy] = rot(L2, 0, rad(p.a));
    if (p.t === 'lens') {
      const [nx, ny] = rot(0, 1, rad(p.a)), bul = p.f > 0 ? .35 : -.25, th = .12;
      c.beginPath(); c.moveTo(p.x - dx, p.y - dy);
      c.quadraticCurveTo(p.x + nx * (bul + th), p.y + ny * (bul + th), p.x + dx, p.y + dy);
      c.quadraticCurveTo(p.x - nx * (bul + th), p.y - ny * (bul + th), p.x - dx, p.y - dy);
      c.fillStyle = p.g === 'flint' ? 'rgba(200,170,255,.35)' : 'rgba(150,210,255,.3)'; c.fill(); c.strokeStyle = selected ? '#ffb547' : 'rgba(180,220,255,.9)'; c.lineWidth = 2 * lw; c.stroke();
    } else {
      c.beginPath(); c.moveTo(p.x - dx, p.y - dy); c.lineTo(p.x + dx, p.y + dy);
      if (p.t === 'mirror') { c.strokeStyle = '#2a1a0c'; c.lineWidth = 7 * lw; c.stroke(); } // the wooden back
      c.strokeStyle = selected ? '#ffcf6a' : p.t === 'mirror' ? '#e8eef4' : 'rgba(200,230,255,.7)'; c.lineWidth = (p.t === 'mirror' ? 3.5 : 3) * lw; c.setLineDash(p.t === 'splitter' ? [4 * lw, 3 * lw] : []); c.stroke(); c.setLineDash([]);
      c.fillStyle = '#b08a4a'; for (const sg of [-1, 1]) { c.beginPath(); c.arc(p.x + sg * dx, p.y + sg * dy, 3 * lw, 0, 7); c.fill(); }
    }
  } else if (p.t === 'arc') {
    const a = arcOf(p); c.beginPath(); c.arc(a.cx, a.cy, a.R, a.a0, a.a1); c.strokeStyle = selected ? '#ffb547' : '#dfe6ee'; c.lineWidth = 4 * lw; c.stroke();
  }
  else if (p.t === 'wall') { c.beginPath(); c.moveTo(p.x1, p.y1); c.lineTo(p.x2, p.y2); c.lineCap = 'round'; c.strokeStyle = '#0b0705'; c.lineWidth = 9 * lw; c.stroke(); c.strokeStyle = '#3d2a1a'; c.lineWidth = 6 * lw; c.stroke(); } // blackened board
  else {
    const v = polyOf(p); c.beginPath(); v.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath();
    c.fillStyle = p.g === 'water' ? 'rgba(60,140,255,.18)' : p.g === 'flint' ? 'rgba(200,170,255,.22)' : p.g === 'diamond' ? 'rgba(255,255,255,.25)' : 'rgba(150,210,255,.18)'; c.fill();
    c.strokeStyle = selected ? '#ffb547' : 'rgba(180,220,255,.7)'; c.lineWidth = 1.5 * lw; c.stroke();
  }
  c.restore();
}
// ---- the room: an oak bench in a darkened chamber, drawn once per resize ----
let benchCv = null;
function buildBench() {
  benchCv = document.createElement('canvas'); benchCv.width = cv.width; benchCv.height = cv.height;
  const b = benchCv.getContext('2d'), w = cv.width, h = cv.height, { s, ox, oy } = view, W = BW * s, H = BH * s, r = RH.rng('oak');
  b.fillStyle = '#060403'; b.fillRect(0, 0, w, h);
  const gr = b.createLinearGradient(0, oy, 0, oy + H); gr.addColorStop(0, '#2e1c0f'); gr.addColorStop(.5, '#3a2413'); gr.addColorStop(1, '#24150a');
  b.fillStyle = gr; b.fillRect(ox, oy, W, H);
  b.save(); b.beginPath(); b.rect(ox, oy, W, H); b.clip();
  for (let i = 0; i < 220; i++) { // grain
    const y = oy + r() * H, amp = 1 + r() * 4, fr = .002 + r() * .01, ph = r() * 9;
    b.strokeStyle = r() < .6 ? `rgba(12,6,2,${.15 + r() * .25})` : `rgba(140,92,48,${.05 + r() * .08})`; b.lineWidth = .6 + r() * 1.6;
    b.beginPath(); for (let x = ox; x <= ox + W; x += 8) { const yy = y + Math.sin(x * fr + ph) * amp + Math.sin(x * fr * 3.1 + ph) * amp * .3; x === ox ? b.moveTo(x, yy) : b.lineTo(x, yy); } b.stroke();
  }
  for (let k = 1; k < 4; k++) { b.fillStyle = '#0c0703'; b.fillRect(ox, oy + H * k / 4 - 1, W, 2); } // plank seams
  for (let i = 0; i < 6; i++) { const kx = ox + r() * W, ky = oy + r() * H, kr = 4 + r() * 10; const kg = b.createRadialGradient(kx, ky, 0, kx, ky, kr * 2.5); kg.addColorStop(0, '#120803cc'); kg.addColorStop(1, '#12080300'); b.fillStyle = kg; b.fillRect(kx - kr * 3, ky - kr * 3, kr * 6, kr * 6); } // knots
  b.restore();
  const vg = b.createRadialGradient(w / 2, h / 2, Math.min(w, h) * .25, w / 2, h / 2, Math.max(w, h) * .75); vg.addColorStop(0, '#0000'); vg.addColorStop(1, '#000d');
  b.fillStyle = vg; b.fillRect(0, 0, w, h);
  b.strokeStyle = '#8a6a3a'; b.lineWidth = Math.max(1, s * .06); b.strokeRect(ox, oy, W, H); // brass edging
  b.fillStyle = '#b08a4a'; for (let x = 0; x <= BW; x++) b.fillRect(ox + x * s - .5, oy, 1, s * (x % 4 ? .18 : .4)); // a ruler along the far edge
}
// ---- dust motes: they only show where the light passes ----
const motes = Array.from({ length: 140 }, (_, i) => { const r = RH.rng('mote' + i); return { x: r() * BW, y: r() * BH, vx: (r() - .5) * .25, vy: (r() - .5) * .18, z: .4 + r() * .8 }; });
function segDist(px, py, p) { const dx = p.x2 - p.x1, dy = p.y2 - p.y1, L2 = dx * dx + dy * dy || 1; const t = Math.max(0, Math.min(1, ((px - p.x1) * dx + (py - p.y1) * dy) / L2)); return Math.hypot(px - p.x1 - t * dx, py - p.y1 - t * dy); }
function drawMotes() {
  const ps = R.paths.filter(p => p.I > .04).slice(0, 260);
  for (const m of motes) {
    let best = .32, col = null;
    for (const p of ps) { const d = segDist(m.x, m.y, p); if (d < best) { best = d; col = p.l; } }
    if (col == null) continue;
    g.fillStyle = wlColor(col, (1 - best / .32) * .8 * m.z); g.beginPath(); g.arc(m.x, m.y, .045 * m.z, 0, 7); g.fill();
  }
}
const reduceMotion = typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches;
let lastAnim = 0;
function anim(now) {
  requestAnimationFrame(anim);
  if (document.hidden || now - lastAnim < 33) return;
  const dt = Math.min(.1, (now - lastAnim) / 1000); lastAnim = now;
  if (!reduceMotion) for (const m of motes) { m.x = (m.x + m.vx * dt + BW) % BW; m.y = (m.y + m.vy * dt + BH) % BH; }
  if (!reduceMotion || bloom) draw();
}
requestAnimationFrame(anim);
function draw() {
  if (!R || R.lv !== cur) return;
  const lv = L[cur];
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (!benchCv || benchCv.width !== cv.width || benchCv.height !== cv.height || benchCv.s !== view.s) { buildBench(); benchCv.s = view.s; }
  g.drawImage(benchCv, 0, 0);
  g.setTransform(view.s, 0, 0, view.s, view.ox, view.oy);
  // light falling on the wood: a warm wash under every beam
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  for (const p of R.paths) { g.strokeStyle = wlColor(p.l, .05 * Math.min(1, p.I * 3)); g.lineWidth = .9; g.beginPath(); g.moveTo(p.x1, p.y1); g.lineTo(p.x2, p.y2); g.stroke(); }
  g.globalCompositeOperation = 'source-over';
  (lv.fixed || []).forEach(p => drawPiece(g, p, false));
  // targets: paper cards, or paper screens
  lv.targets.forEach((t, i) => {
    const ok = R.checks[i].ok, col = t.l && !Array.isArray(t.l) ? wlColor(t.l) : '#8a2a10';
    if (t.k === 'spot') {
      const rr = Math.max(t.r, .3) + .15;
      g.fillStyle = '#00000088'; g.beginPath(); g.arc(t.x + .12, t.y + .16, rr, 0, 7); g.fill();
      g.fillStyle = ok ? '#fff3d0' : '#e6dcc2'; g.beginPath(); g.arc(t.x, t.y, rr, 0, 7); g.fill();
      g.strokeStyle = '#4a3a2a'; g.lineWidth = 1 / view.s; for (const f of [.95, .66, .36]) { g.beginPath(); g.arc(t.x, t.y, rr * f, 0, 7); g.stroke(); }
      g.fillStyle = ok ? '#5fd38d' : col; g.beginPath(); g.arc(t.x, t.y, Math.max(t.r, .08) * .6, 0, 7); g.fill();
      if (ok) { g.globalCompositeOperation = 'lighter'; const gg = g.createRadialGradient(t.x, t.y, 0, t.x, t.y, rr * 2.2); gg.addColorStop(0, '#ffd88a88'); gg.addColorStop(1, '#ffd88a00'); g.fillStyle = gg; g.beginPath(); g.arc(t.x, t.y, rr * 2.2, 0, 7); g.fill(); g.globalCompositeOperation = 'source-over'; }
    } else {
      g.lineCap = 'butt'; g.strokeStyle = '#3a2413'; g.lineWidth = 9 / view.s; g.beginPath(); g.moveTo(t.x1, t.y1); g.lineTo(t.x2, t.y2); g.stroke();
      g.strokeStyle = ok ? '#fff3d0' : '#e6dcc2'; g.lineWidth = 6 / view.s; g.stroke();
      g.strokeStyle = ok ? '#5fd38d' : col; g.lineWidth = 1.5 / view.s; g.stroke();
    }
  });
  // light: glow, body and a hot core
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  for (const p of R.paths) {
    const a = Math.min(1, .35 + p.I * 1.2);
    g.beginPath(); g.moveTo(p.x1, p.y1); g.lineTo(p.x2, p.y2);
    g.strokeStyle = wlColor(p.l, .07 * a); g.lineWidth = .32; g.stroke();
    g.strokeStyle = wlColor(p.l, .35 * a); g.lineWidth = 4 / view.s; g.stroke();
    g.strokeStyle = `rgba(255,250,235,${.55 * a * Math.min(1, p.I * 2)})`; g.lineWidth = 1.1 / view.s; g.stroke();
  }
  drawMotes();
  g.globalCompositeOperation = 'source-over';
  // sources: brass lanterns with a shutter slit
  lv.sources.forEach(s => {
    g.save(); g.translate(s.x, s.y); g.rotate(rad(s.a));
    const w = Math.max(.8, (s.w || 0) + .4), br = g.createLinearGradient(0, -w / 2, 0, w / 2); br.addColorStop(0, '#d9b36a'); br.addColorStop(.5, '#8a6326'); br.addColorStop(1, '#4a3212');
    g.fillStyle = br; g.fillRect(-1.3, -w / 2, 1.3, w); g.strokeStyle = '#2a1a08'; g.lineWidth = 1.2 / view.s; g.strokeRect(-1.3, -w / 2, 1.3, w);
    g.fillStyle = s.l === 'white' ? '#fff6dc' : wlColor(s.l); g.fillRect(-.14, -w / 2 + .1, .14, w - .2);
    g.globalCompositeOperation = 'lighter'; const hg = g.createRadialGradient(0, 0, 0, 0, 0, w); hg.addColorStop(0, s.l === 'white' ? '#fff3c855' : wlColor(s.l, .35)); hg.addColorStop(1, '#0000'); g.fillStyle = hg; g.beginPath(); g.arc(0, 0, w, 0, 7); g.fill();
    g.restore();
  });
  placed.forEach((p, i) => drawPiece(g, p, i === sel));
  // the bloom: a spectrum rings out of each target
  if (bloom) {
    const t = (performance.now() - bloom.t0) / 1600;
    if (t >= 1 || bloom.lv !== cur) bloom = null;
    else {
      g.globalCompositeOperation = 'lighter';
      for (const [x, y] of bloom.at) WL.forEach((l, k) => { const r = .3 + t * (5 + k * .55); g.strokeStyle = wlColor(l, (1 - t) * .7); g.lineWidth = .25 * (1 - t) + .04; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); });
      for (const [x, y] of bloom.at) { const gg = g.createRadialGradient(x, y, 0, x, y, 3); gg.addColorStop(0, `rgba(255,240,200,${(1 - t) * .8})`); gg.addColorStop(1, '#0000'); g.fillStyle = gg; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill(); }

}

const help = () => RH.modal(`<h2>Opticks</h2>
  <p>An optical bench. Light comes from lasers, lamps and the sun. You have a tray of mirrors, prisms and lenses. Put them on the bench and steer the light into the targets.</p>
  <p>Everything follows real optics: the law of reflection, Snell's law of refraction (with each colour bending by a slightly different amount), total internal reflection, and thin-lens focusing.</p>
  <p>Five chapters follow the history: from mirrors and Newton's prism, through telescopes and the achromatic lens, to optical fibres.</p>
  <p class="dim">Drag from the tray · drag to move · scroll or Q/E to rotate (Shift for fine) · arrows to nudge · double-click to remove.</p>`, [{ label: 'Light the lamp' }]);
$('helpBtn').onclick = help;
render(); loadLevel(cur);
if (!S.intro) { S.intro = 1; persist(); help(); }
window.__opt = { L, trace, checkTarget, loadLevel, cleanSave, trayOf, chOpen, SETTLE, get R() { return R; }, get cur() { return cur; }, get sel() { return sel; }, set sel(v) { sel = v; }, get placed() { return placed; }, set placed(v) { placed = v; }, recompute, S };
</script>
