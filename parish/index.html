<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>⛪ Parish</h1><span class="spacer"></span><span class="dim small" id="totals"></span><button id="newParish" title="A new village with a new register">New parish</button><button id="helpBtn">?</button></div>
<main>
  <div id="side"></div>
  <div id="reg">
    <div class="search">
      <span class="modes"><button id="mBook" class="on">📖 Book</button><button id="mIdx">🔎 Index</button></span>
      <input id="qG" placeholder="Given name"><input id="qS" placeholder="Surname">
      <label title="Match surnames that sound alike (Soundex), so Cooper also finds Couper"><input type="checkbox" id="qSx" checked> sounds-like</label>
      <label><input type="checkbox" id="qB" checked>Bap</label><label><input type="checkbox" id="qM" checked>Mar</label><label><input type="checkbox" id="qD" checked>Bur</label>
      <input id="qY0" placeholder="from yr" style="width:70px"><input id="qY1" placeholder="to yr" style="width:70px">

</main>
<script src="../shared/common.js"></script>
<script>
'use strict';
// ================= simulation =================
const YD = 365.25, Y0 = 1650, REG0 = 1700, REG1 = 1800;
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dayToDate = d => { const t = new Date(Date.UTC(Y0, 0, 1) + Math.floor(d) * 864e5); return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate() }; };
const fmtD = d => { const x = dayToDate(d); return `${x.d} ${MN[x.m]} ${x.y}`; };
const yearOf = d => dayToDate(d).y;
const yrs = n => n * YD;

const GM = ['John','William','Thomas','James','Richard','Robert','Joseph','George','Edward','Henry','Samuel','Charles'];
const GF = ['Mary','Elizabeth','Ann','Sarah','Jane','Margaret','Hannah','Martha','Susanna','Alice','Catherine','Frances'];
const WM = [20, 18, 14, 10, 7, 6, 6, 5, 4, 4, 3, 3], WF = [20, 17, 15, 10, 8, 7, 6, 5, 4, 3, 3, 2];
const ABBR = { William: 'Wm', John: 'Jno', Thomas: 'Thos', James: 'Jas', Richard: 'Richd', Robert: 'Robt', Joseph: 'Jos', George: 'Geo', Edward: 'Edwd', Charles: 'Chas', Samuel: 'Saml', Elizabeth: 'Eliz', Margaret: 'Margt', Catherine: 'Cath', Susanna: 'Susan' };
const UNABBR = Object.fromEntries(Object.entries(ABBR).map(([a, b]) => [b.toLowerCase(), a]));
const SUR = [['Cooper','Couper'],['Smith','Smyth'],['Thatcher','Thacher'],['Baker'],['Fletcher','Flecher'],['Turner'],['Walker','Waker'],['Harris','Harries'],['Wright','Write','Right'],['Hughes','Hewes'],['Allen','Allin','Allan'],['Webb','Web'],['Barker'],['Hobbs','Hobbes'],['Pearce','Pierce','Pearse'],['Price','Pryce'],['Shepherd','Sheppard','Shepard'],['Mason'],['Cox','Cocks'],['Gardner','Gardiner'],['Phillips','Philips'],['Moore','More'],['Kemp'],['Lambert']];
const CANON = {}; SUR.forEach(v => v.forEach(s => CANON[s.toLowerCase()] = v[0]));
const canon = s => CANON[(s || '').toLowerCase()] || s;
const OCC = ['labourer','labourer','labourer','husbandman','weaver','blacksmith','carpenter','yeoman','shoemaker','tailor','miller','mason','thatcher','shepherd'];
const PLACES = ['Ashby','Kirton','Lowfield','Market Harrow','Stoke Abbas','Wendle','Brayford','Othery'];
const VILLAGES = ['Little Wenham','Ashcombe','Kingsbury Episcopi','Thornley','Saxby St Mary','Hollowell','Upper Swell','Chilton Foliat','Broadwater','Fenny Compton'];

function soundex(s) {
  s = (s || '').toUpperCase().replace(/[^A-Z]/g, ''); if (!s) return '';
  const code = { B: 1, F: 1, P: 1, V: 1, C: 2, G: 2, J: 2, K: 2, Q: 2, S: 2, X: 2, Z: 2, D: 3, T: 3, L: 4, M: 5, N: 5, R: 6 };
  let out = s[0], last = code[s[0]] || 0;
  for (let i = 1; i < s.length && out.length < 4; i++) { const c = code[s[i]] || 0; if (c && c !== last) out += c; if (s[i] !== 'H' && s[i] !== 'W') last = c; }
  return (out + '000').slice(0, 4);
}

function simulate(seed) {
  const r = RH.rng('parish:' + seed);
  const wpick = (arr, w) => { const t = w.reduce((a, b) => a + b, 0); let x = r() * t; for (let i = 0; i < arr.length; i++) { x -= w[i]; if (x < 0) return arr[i]; } return arr[0]; };
  const P = [];
  const mk = o => { const p = { id: P.length, sex: 'M', given: '', sur: '', cur: '', born: 0, father: -1, mother: -1, spouse: -1, spouses: [], died: null, left: null, outsider: 0, occ: null, kids: [], lastBirth: -1e9, ...o }; P.push(p); return p; };
  const famSur = SUR.map(v => v[0]);
  const marriages = []; // {g, b, d, gWid, bWid, bSurAtMar, of}
  // founders
  for (let i = 0; i < 42; i++) {
    const s = famSur[i % famSur.length];
    const h = mk({ sex: 'M', given: wpick(GM, WM), sur: s, cur: s, born: -yrs(20 + r() * 18), outsider: 1, occ: r.pick(OCC) });
    const ws = r.pick(famSur);
    const w = mk({ sex: 'F', given: wpick(GF, WF), sur: ws, cur: s, born: -yrs(18 + r() * 15), outsider: 1 });
    h.spouse = w.id; w.spouse = h.id; h.spouses.push(w.id); w.spouses.push(h.id);
    marriages.push({ g: h.id, b: w.id, d: -yrs(r() * 8), pre: 1 });
  }
  const alive = p => p.died === null && p.left === null;
  const age = (p, d) => (d - p.born) / YD;
  const q = a => a < 1 ? .16 : a < 5 ? .03 : a < 15 ? .007 : a < 45 ? .012 : a < 65 ? .026 : a < 75 ? .065 : .16;
  const sibs = (f, m) => P.filter(x => x.father === f && x.mother === m);
  const nameFor = (f, m, sex) => {
    const F = P[f], M = P[m], kids = sibs(f, m).filter(k => k.sex === sex), n = kids.length;
    const gpF = sex === 'M' ? P[F.father] : P[F.mother], gpM = sex === 'M' ? P[M.father] : P[M.mother];
    const prefs = sex === 'M' ? [gpF?.given, gpM?.given, F.given] : [gpM?.given, gpF?.given, M.given];
    const living = new Set(kids.filter(alive).map(k => k.given));
    // necronym: a child who died young often has the name re-used
    const deadName = kids.filter(k => k.died !== null).map(k => k.given).find(g => !living.has(g));
    if (deadName && r() < .6) return deadName;
    for (let i = n; i < prefs.length; i++) if (prefs[i] && !living.has(prefs[i]) && r() < .75) return prefs[i];
    let g; do g = wpick(sex === 'M' ? GM : GF, sex === 'M' ? WM : WF); while (living.has(g) && r() < .95);
    return g;
  };
  for (let y = Y0; y < REG1; y++) {
    const ys = (y - Y0) * YD;
    const pop = P.filter(alive);
    // deaths & migration
    for (const p of pop) {
      const d = ys + r() * YD; if (d < p.born) continue;
      const a = age(p, d);
      if (r() < q(a)) { p.died = d; if (p.spouse >= 0) P[p.spouse].spouse = -1; continue; }
      if (a > 16 && a < 32 && p.spouse < 0 && r() < (pop.length > 420 ? .07 : .02)) p.left = d;
    }
    // marriages
    const singleM = P.filter(p => alive(p) && p.sex === 'M' && p.spouse < 0 && age(p, ys) >= 21 && age(p, ys) < 55);
    for (const m of singleM) {
      if (r() > (m.spouses.length ? .35 : .22)) continue;
      const d = ys + r() * YD;
      const pool = P.filter(w => alive(w) && w.sex === 'F' && w.spouse < 0 && age(w, d) >= 19 && age(w, d) < (m.spouses.length ? 45 : 36) && w.father !== m.father | m.father < 0 && w.id !== m.mother);
      let w;
      if (pool.length && r() < .82) w = r.pick(pool);
      else w = mk({ sex: 'F', given: wpick(GF, WF), sur: r.pick(famSur), cur: '', born: d - yrs(20 + r() * 8), outsider: 1, from: r.pick(PLACES) });
      const rec = { g: m.id, b: w.id, d, gWid: m.spouses.length > 0, bWid: w.spouses.length > 0, bSur: w.cur || w.sur, of: w.from || null };
      if (w.from) w.from = null;
      marriages.push(rec);
      m.spouse = w.id; w.spouse = m.id; m.spouses.push(w.id); w.spouses.push(m.id); w.cur = m.cur;
    }
    // occupations
    for (const p of pop) if (p.sex === 'M' && !p.occ && age(p, ys) >= 16) p.occ = p.father >= 0 && r() < .6 ? P[p.father].occ : r.pick(OCC);
    // births
    const wives = P.filter(w => alive(w) && w.sex === 'F' && w.spouse >= 0 && age(w, ys) >= 18 && age(w, ys) < 45);
    for (const w of wives) {
      if (r() > .34) continue;
      const d = ys + r() * YD; if (d - w.lastBirth < 400) continue;
      const h = P[w.spouse]; if (!alive(h)) continue;
      const sex = r() < .51 ? 'M' : 'F';
      const c = mk({ sex, given: nameFor(h.id, w.id, sex), sur: h.cur, cur: h.cur, born: d, father: h.id, mother: w.id });
      w.lastBirth = d; h.kids.push(c.id); w.kids.push(c.id);
    }
  }
  return { P, marriages, r };
}

// ================= the register =================
function buildRegister(seed) {
  const { P, marriages, r } = simulate(seed);
  const lostY0 = 1735 + r.int(20), lostY1 = lostY0 + 2 + r.int(2);
  const inReg = d => { const y = yearOf(d); return y >= REG0 && y < REG1 && !(y >= lostY0 && y <= lostY1); };
  const spell = s => { const v = SUR.find(x => x[0] === s); return v && v.length > 1 && r() < .3 ? r.pick(v.slice(1)) : s; };
  const R = [];
  const add = o => { o.id = R.length; R.push(o); return o; };
  // baptisms
  for (const p of P) {
    if (p.outsider || p.father < 0) continue;
    const d = p.born + r.int(28);
    if (!inReg(d)) continue;
    const F = P[p.father], M = P[p.mother];
    p.bap = add({ t: 'B', d, g: p.given, sex: p.sex, fg: F.given, fs: spell(F.cur), mg: M.given, ms: yearOf(d) >= 1755 && r() < .55 ? spell(M.sur) : null, occ: r() < .7 ? F.occ : null, pid: p.id, f: F.id, m: M.id }).id;
  }
  // marriages
  for (const m of marriages) {
    if (m.pre || !inReg(m.d)) continue;
    const G = P[m.g], B = P[m.b];
    m.rec = add({ t: 'M', d: m.d, gg: G.given, gs: spell(G.cur), gst: m.gWid ? 'widower' : 'bachelor', bg: B.given, bs: spell(m.bSur), bst: m.bWid ? 'widow' : 'spinster', of: m.of, groom: G.id, bride: B.id }).id;
  }
  // burials
  for (const p of P) {
    if (p.died === null) continue;
    const d = p.died + 1 + r.int(4); if (!inReg(d)) continue;
    const a = (p.died - p.born) / YD;
    let age = null, about = false;
    if (a < 1) age = 0;
    else if (a < 16 || r() < .78) { age = Math.floor(a); if (a >= 16) { const n = r(); if (n < .25) age += r.pick([-2, -1, 1, 2]); else if (n < .32) { age = Math.round(a / 5) * 5; about = true; } } }
    let rel = null;
    if (a < 16 && p.father >= 0) rel = { k: p.sex === 'M' ? 'son' : 'dau', fg: P[p.father].given, fs: spell(P[p.father].cur) };
    else if (p.sex === 'F' && p.spouses.length) { const h = P[p.spouses[p.spouses.length - 1]]; rel = { k: h.died !== null && h.died < p.died ? 'widow' : 'wife', hg: h.given }; }
    p.bur = add({ t: 'D', d, g: p.given, s: spell(p.cur), age, about, rel, occ: p.sex === 'M' && a >= 16 && r() < .6 ? p.occ : null, pid: p.id }).id;
  }
  R.sort((a, b) => a.d - b.d); R.forEach((x, i) => x.id = i);
  // remap ids after sort
  const byPid = {}; R.forEach(x => { if (x.t === 'B') (byPid[x.pid] ||= {}).bap = x.id; if (x.t === 'D') (byPid[x.pid] ||= {}).bur = x.id; });
  P.forEach(p => { p.bap = byPid[p.id]?.bap; p.bur = byPid[p.id]?.bur; });
  const marRec = {}; R.forEach(x => { if (x.t === 'M') marRec[x.groom + ':' + x.bride] = x.id; });
  return { P, R, lostY0, lostY1, marRec, village: VILLAGES[r.int(VILLAGES.length)] };
}

// ================= deduction model =================
// Each task kind lists the records a careful genealogist could not rule out, using only what the anchor records say.
const sameSur = (a, b) => canon(a) === canon(b);
function bornFromBurial(b) { return b.age == null ? null : b.d - (b.age + .5) * YD; }
function deadBefore(R, c, before) {
  // a burial that plausibly is this baptised child, before the date we know they were alive
  return R.some(b => b.t === 'D' && b.d < before && b.d > c.d && b.g === c.g && sameSur(b.s, c.fs) && (
    (b.rel && (b.rel.k === 'son' || b.rel.k === 'dau') && b.rel.fg === c.fg && (b.age == null || Math.abs(bornFromBurial(b) - c.d) < yrs(1.5))) ||
    (!b.rel && b.age != null && Math.abs(bornFromBurial(b) - c.d) < yrs(2.5))));
}
const WHY = {
  name: 'The names do not match.', sex: 'Wrong sex.', type: 'Wrong kind of record.',
  early: 'Too early to fit.', late: 'Too late to fit.', dead: 'This child was buried before the date we know they were alive.',
  age: 'The age at burial does not fit the baptism.', rel: 'The burial says whose relative this was, and it is someone else.', maiden: "The bride's surname does not match the mother's maiden name.",
};
const KIND = {
  // parents' marriage, from a baptism
  A: { fits: (R, c, k) => {
      const b = R[k.a];
      if (c.t !== 'M') return 'type';
      if (c.gg !== b.fg || !sameSur(c.gs, b.fs) || c.bg !== b.mg) return 'name';
      if (b.ms && !sameSur(c.bs, b.ms)) return 'maiden';
      if (c.d > b.d) return 'late'; if (c.d < b.d - yrs(26)) return 'early';
      return null; } },
  // groom's baptism, from a marriage
  B: { fits: (R, c, k) => {
      const m = R[k.a]; if (c.t !== 'B') return 'type'; if (c.sex !== 'M') return 'sex';
      if (c.g !== m.gg || !sameSur(c.fs, m.gs)) return 'name';
      if (c.d > m.d - yrs(16)) return 'late'; if (c.d < m.d - yrs(55)) return 'early';
      if (deadBefore(R, c, m.d)) return 'dead'; return null; } },
  // bride's baptism, from a marriage (spinster)
  C: { fits: (R, c, k) => {
      const m = R[k.a]; if (c.t !== 'B') return 'type'; if (c.sex !== 'F') return 'sex';
      if (c.g !== m.bg || !sameSur(c.fs, m.bs)) return 'name';
      if (c.d > m.d - yrs(14)) return 'late'; if (c.d < m.d - yrs(46)) return 'early';
      if (deadBefore(R, c, m.d)) return 'dead'; return null; } },
  // groom's burial, from his marriage + baptism
  D: { fits: (R, c, k) => {
      const m = R[k.a], b = R[k.b]; if (c.t !== 'D') return 'type';
      if (c.g !== m.gg || !sameSur(c.s, m.gs)) return 'name';
      if (c.rel) return 'rel';
      if (c.d < k.after) return 'early';
      if (c.age != null && Math.abs(bornFromBurial(c) - b.d) > yrs(c.about ? 5.5 : 3.5)) return 'age';
      return null; } },
  // bride's burial, from her marriage + baptism
  E: { fits: (R, c, k) => {
      const m = R[k.a], b = R[k.b]; if (c.t !== 'D') return 'type';
      if (c.g !== m.bg || !sameSur(c.s, m.gs)) return 'name';
      if (c.rel && (c.rel.k === 'son' || c.rel.k === 'dau' || c.rel.hg !== m.gg)) return 'rel';
      if (c.d < k.after) return 'early';
      if (c.age != null && Math.abs(bornFromBurial(c) - b.d) > yrs(c.about ? 5.5 : 3.5)) return 'age';
      return null; } },
};
const naive = (R, k) => { // name-only matches: how many decoys there are
  const a = R[k.a];
  if (k.kind === 'A') return R.filter(c => c.t === 'M' && c.gg === a.fg && sameSur(c.gs, a.fs)).length;
  if (k.kind === 'B') return R.filter(c => c.t === 'B' && c.sex === 'M' && c.g === a.gg && sameSur(c.fs, a.gs)).length;
  if (k.kind === 'C') return R.filter(c => c.t === 'B' && c.sex === 'F' && c.g === a.bg && sameSur(c.fs, a.bs)).length;
  if (k.kind === 'D') return R.filter(c => c.t === 'D' && c.g === a.gg && sameSur(c.s, a.gs)).length;
  if (k.kind === 'E') return R.filter(c => c.t === 'D' && c.g === a.bg && sameSur(c.s, a.gs)).length;
};
const solveTask = (R, k) => R.filter(c => KIND[k.kind].fits(R, c, k) === null);

// ================= commissions =================
function buildCommissions(W) {
  const { P, R, marRec } = W, r = RH.rng('parish:com:' + S.seed);
  const cands = [];
  const starts = R.filter(x => x.t === 'B' && yearOf(x.d) >= 1765);
  r.shuffle(starts);
  const parentsOf = bapId => { const b = R[bapId]; return marRec[b.f + ':' + b.m]; };
