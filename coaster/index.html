<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coaster</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Architects+Daughter&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* A 1930s coaster engineer's drafting table: blueprint paper, white construction lines, red pencil,
     and the park's poster-printed commission cards pinned at the edge. */
  :root{--bp:#123a66;--bp2:#0d2c52;--line:#cfe6ff;--pencil:#ff6b57;--cream:#f4e8cc;--ink:#1d1a16;--gold:#f2b33d;--teal:#2f8f8a;--red:#c8372d}
  html,body{height:100%;overflow:hidden;background:var(--bp2);font-family:"Architects Daughter","Comic Sans MS",cursive;color:var(--line);overscroll-behavior:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* poster card for the commission */
  .card{position:fixed;color:var(--ink);border-radius:2px;
    background:radial-gradient(circle at 15% 12%,rgba(255,255,255,.5),transparent 50%),repeating-linear-gradient(0deg,rgba(80,50,20,.035) 0 1px,transparent 1px 3px),linear-gradient(var(--cream),#e8d7b0);
    box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 5px var(--cream),inset 0 0 0 6px var(--red),0 14px 30px -10px #000c}
  #brief{top:12px;left:12px;width:310px;padding:14px 16px 12px;max-height:calc(100vh - 120px);overflow:auto}
  #brief .home{color:#6b5536;font-size:13px;text-decoration:none}
  #brief h1{margin:4px 0 0;font:400 30px/1 Limelight,Georgia,serif;color:var(--red);letter-spacing:.03em;text-shadow:1px 1px 0 var(--gold)}
  #brief h2{margin:6px 0 2px;font:400 18px Limelight,Georgia,serif;color:var(--ink)}
  #brief p{margin:4px 0;font-size:14.5px;line-height:1.38}
  #brief b{color:var(--red)}
  .req{margin:6px 0 0;padding:0;list-style:none;font-size:13.5px}
  .req li::before{content:'▢ ';color:#6b5536}.req li.ok::before{content:'☑ ';color:var(--teal)}.req li.bad::before{content:'☒ ';color:var(--red)}
  #comSel{width:100%;margin-top:6px;font:16px "Architects Daughter",cursive;background:#fbf3df;color:var(--ink);border:0;border-bottom:2px solid var(--ink);border-radius:0}
  /* the readout: an engineer's gauge strip */
  #gauge{top:12px;right:12px;padding:10px 14px;display:none;min-width:200px;font-family:"Courier Prime",monospace;color:var(--ink)}
  #gauge .row2{display:flex;justify-content:space-between;gap:10px;font-size:13px}
  #gauge b{font-size:20px}
  #gauge .bar{height:8px;background:#d8c7a2;margin-top:3px;position:relative}
  #gauge .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--teal)}
  #gauge .bar i.hot{background:var(--red)}
  /* drafting tools along the bottom: pencil-stamped tabs */
  #tools{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 20px);padding:8px;
    background:linear-gradient(#5a3a1e,#3c2410);border-radius:3px;box-shadow:0 10px 24px -8px #000c,inset 0 1px 0 rgba(255,220,170,.3)}
  .t{border:0;border-radius:2px;min-height:42px;min-width:44px;padding:6px 11px;font:700 14px "Courier Prime",monospace;color:var(--ink);cursor:pointer;
    background:linear-gradient(#fbf3df,#e6d4ad);box-shadow:inset 0 0 0 1px #6b5536,0 2px 0 #1d1006}
  .t:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px #6b5536}
  .t.on{background:var(--ink);color:var(--cream)}
  .t.ride{background:linear-gradient(#e2493b,#9e2419);color:#fff3dc;font:400 18px Limelight,Georgia,serif;letter-spacing:.08em;padding:6px 18px}
  .t:disabled{opacity:.45}
  .t:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  /* node inspector */
  #insp{display:none;left:50%;transform:translateX(-50%);bottom:76px;padding:10px 14px;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:14px;max-width:calc(100vw - 20px)}
  #insp label{display:flex;gap:6px;align-items:center}
  #insp input[type=range]{width:120px;min-height:28px;accent-color:var(--red)}
  /* results */
  #result{display:none;top:50%;left:50%;transform:translate(-50%,-50%);width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 30px);overflow:auto;padding:16px 18px;z-index:20}
  #result h3{margin:0;font:400 28px Limelight,Georgia,serif;color:var(--red)}
  #result .scores{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0;text-align:center;font-family:"Courier Prime",monospace}
  #result .scores div{border:1px solid #6b5536;padding:5px 2px}
  #result .scores b{display:block;font-size:22px}
  #result .stars{font-size:28px;color:var(--gold);letter-spacing:4px;text-shadow:0 1px 0 #6b5536}
  #result .stars s{color:#c8b48a;text-decoration:none}
  #result .guests{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  #result .guests div{flex:1 1 150px;background:#fff9ea;border:1px solid #6b5536;border-radius:12px 12px 12px 2px;padding:6px 9px;font-size:14px}
  #result .guests em{display:block;font-style:normal;font-size:11.5px;color:#6b5536}
  #result canvas{width:100%;height:90px;display:block;margin-top:6px}
  #result .row3{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
  #toastC{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:30;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;width:min(520px,calc(100vw - 24px))}
  .tc{background:var(--cream);color:var(--ink);border:2px solid var(--ink);padding:7px 14px;font-size:15px;box-shadow:0 8px 20px -8px #000c;text-align:center;animation:tin .25s ease-out}
  .tc.bad{border-color:var(--red)}
  #pov{position:fixed;right:12px;bottom:76px;width:300px;height:190px;border:3px solid var(--cream);box-shadow:0 10px 24px -8px #000c;display:none;background:#8fc7e8}
  #povL{position:fixed;right:18px;bottom:248px;font:400 14px Limelight,Georgia,serif;color:var(--cream);display:none;text-shadow:0 1px 3px #000}
  /* the 3D ride: full screen under the gauge and tools */
  #v3{position:fixed;inset:0;width:100%;height:100%;display:none;z-index:4;background:#9cc9e6;touch-action:none}
  #v3fx{position:fixed;inset:0;pointer-events:none;display:none;z-index:5}
  #v3.on,#v3fx.on{display:block}
  body.ride3 #brief,body.ride3 #insp{display:none!important}
  body.ride3 #gauge{z-index:8;background:rgba(244,232,204,.88)}
  body.ride3 #tools{z-index:8}
  .modal{background:linear-gradient(var(--cream),#e8d7b0);color:var(--ink);font-family:"Architects Daughter",cursive;border:0;border-radius:2px}
  .modal h2{font-family:Limelight,Georgia,serif;color:var(--red)}
  .modal button{background:var(--ink);color:var(--cream);border:0;border-radius:2px;font-family:"Courier Prime",monospace}
  @media (max-width:860px){
    #brief{top:6px;left:6px;right:6px;width:auto;padding:8px 12px;max-height:27vh}
    #brief h1{font-size:22px;display:inline}
    #brief p{font-size:13px;margin:2px 0}
    #brief .req{font-size:12.5px;columns:2}
    #gauge{top:auto;bottom:122px;right:6px;padding:6px 10px;min-width:0}
    #gauge b{font-size:16px}
    #tools{left:6px;right:6px;transform:none;max-width:none;bottom:6px;flex-wrap:wrap;gap:4px;padding:5px}
    .t{padding:5px 8px;font-size:13px}
    .t .lbl{display:none}
    #pov{width:46vw;height:28vw;bottom:auto;top:calc(27vh + 14px);right:6px}
    #povL{display:none!important}
    #insp{bottom:112px}
  }
  @media (max-width:860px) and (max-height:520px) and (orientation:landscape){
    #brief{right:auto;width:240px;max-height:calc(100vh - 70px)}
    #brief .req{columns:1}
    #tools{left:auto;right:6px;max-width:calc(100vw - 260px);flex-wrap:nowrap;overflow-x:auto}
    #gauge{bottom:60px}
    #pov{top:8px;width:30vw;height:20vw}
    #insp{left:auto;right:6px;transform:none;bottom:60px}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="brief" class="card">
  <a class="home" href="../index.html">← Rabbit Holes</a>
  <h1>Coaster</h1>
  <select id="comSel" aria-label="Commission"></select>
  <h2 id="cTitle"></h2>
  <p id="cStory"></p>
  <ul class="req" id="cReq"></ul>
</div>
<div id="gauge" class="card">
  <div class="row2"><span>speed</span><b id="gV">0</b></div><div class="bar"><i id="gVb"></i></div>
  <div class="row2" style="margin-top:4px"><span>g (seat)</span><b id="gG">1.0</b></div><div class="bar"><i id="gGb"></i></div>
  <div class="row2" style="margin-top:4px"><span>g (side)</span><b id="gL">0.0</b></div>
</div>
<div id="insp" class="card"></div>
<div id="tools"></div>
<div id="result" class="card"></div>
<canvas id="v3" aria-label="Front-seat view of the ride"></canvas><div id="v3fx"></div>
<canvas id="pov" width="600" height="380"></canvas><div id="povL">Front seat</div>
<div id="toastC"></div>
<script type="importmap">{"imports":{"three":"../shared/vendor/three/build/three.module.min.js"}}</script>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const G = 9.81, MU = .015, DRAG = .0006, DS = .5, CHAIN = 3.5, CAR_W = 1.2;
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

// ================= track model =================
// A design is a list of nodes in an elevation view (x along the ground, y height, metres). The track is a
// centripetal Catmull-Rom spline through them, so a loop is just nodes that curl back over themselves.
// Each node may carry a flat turn for the segment that follows it: radius r (m, signed, 0 = straight) and bank (deg).
// Segment 0 (station → first crest) is a chain lift.
function spline(nodes, perSeg = 28) {
  const P = nodes.map(n => [n.x, n.y]), n = P.length, out = [];
  if (n < 2) return out;
  const ext = [[2 * P[0][0] - P[1][0], 2 * P[0][1] - P[1][1]], ...P, [2 * P[n - 1][0] - P[n - 2][0], 2 * P[n - 1][1] - P[n - 2][1]]];
  const tj = (a, b) => Math.pow(Math.hypot(b[0] - a[0], b[1] - a[1]), .5) || 1e-3;
  for (let i = 0; i < n - 1; i++) {
    const p0 = ext[i], p1 = ext[i + 1], p2 = ext[i + 2], p3 = ext[i + 3];
    const t1 = tj(p0, p1), t2 = t1 + tj(p1, p2), t3 = t2 + tj(p2, p3);
    for (let k = 0; k < perSeg; k++) {
      const t = t1 + (t2 - t1) * k / perSeg, pt = [0, 0];
      for (let c = 0; c < 2; c++) {
        const A1 = (t1 - t) / t1 * p0[c] + t / t1 * p1[c], A2 = (t2 - t) / (t2 - t1) * p1[c] + (t - t1) / (t2 - t1) * p2[c], A3 = (t3 - t) / (t3 - t2) * p2[c] + (t - t2) / (t3 - t2) * p3[c];
        const B1 = (t2 - t) / t2 * A1 + t / t2 * A2, B2 = (t3 - t) / (t3 - t1) * A2 + (t - t1) / (t3 - t1) * A3;
        pt[c] = (t2 - t) / (t2 - t1) * B1 + (t - t1) / (t2 - t1) * B2;
      }
      out.push({ x: pt[0], y: pt[1], seg: i });
    }
  }
  out.push({ x: P[n - 1][0], y: P[n - 1][1], seg: n - 2 });
  return out;
}
// resample at even arc length DS, keeping which segment each sample is on
function resample(pts) {
  const out = [{ ...pts[0], s: 0 }]; let acc = 0, need = DS;
  for (let i = 1; i < pts.length; i++) {
    const a = pts[i - 1], b = pts[i], l = Math.hypot(b.x - a.x, b.y - a.y); if (!l) continue;
    let used = 0;
    while (acc + (l - used) >= need) { const f = (used + need - acc) / l; out.push({ x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, seg: b.seg, s: out.length * DS }); used += need - acc; acc = 0; need = DS; }
    acc += l - used;
  }
  return out;
}
// the track in 3D: ground position from integrating the heading through flat turns (loops stay in a vertical plane)
function geometry(design) {
  const S = resample(spline(design.nodes)), nodes = design.nodes;
  let hx = 0, hz = 0, h = 0;
  for (let i = 0; i < S.length; i++) {
    const p = S[i], th = i < S.length - 1 ? Math.atan2(S[i + 1].y - p.y, S[i + 1].x - p.x) : S[i - 1].th;
    p.th = th; const nd = nodes[p.seg] || {}, r = nd.r || 0; p.kh = r ? 1 / r : 0; p.bank = (nd.bank || 0) * Math.PI / 180;
    p.X = hx; p.Z = hz; p.head = h;
    if (i < S.length - 1) { const dxg = S[i + 1].x - p.x; hx += Math.cos(h) * dxg; hz += Math.sin(h) * dxg; h += p.kh * Math.abs(dxg); }
  }
  for (let i = 1; i < S.length - 1; i++) { let d = S[i + 1].th - S[i - 1].th; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; S[i].kv = d / (2 * DS); }
  if (S.length > 1) { S[0].kv = S[1].kv || 0; S[S.length - 1].kv = S[S.length - 2].kv || 0; }
  // a train is ~10 m long: riders feel the curvature averaged over a few metres, not the spline's kinks at each node
  const raw = S.map(p => p.kv || 0), Wn = 6; S.kink = raw.findIndex((k, i) => i > 2 && i < S.length - 3 && Math.abs(k) > 1 / 3); // tighter than a 3 m radius: steel can't be bent that way for (let i = 0; i < S.length; i++) { let a = 0, n = 0; for (let k = Math.max(0, i - Wn); k <= Math.min(S.length - 1, i + Wn); k++) { a += raw[k]; n++; } S[i].kv = a / n; }
  return S;
}

// ================= ride physics =================
// Energy along the track: d(v²)/ds = −2g·sinθ − 2μ·|N|/m − 2c·v². Seat g = (v²κ + g cosθ)/g in the vertical plane;
// a flat turn adds v²/r sideways, part of it taken into the seat by the bank angle.
function ride(design, opt = {}) {
  const S = design.S || geometry(design), mu = opt.mu ?? MU, drag = opt.drag ?? DRAG, terrain = opt.terrain || (() => -1e9), lift = design.lift ?? 1;
  const out = { S, t: [], v: [], gs: [], gl: [], idx: [], stall: -1, crash: -1, done: false };
  let v = opt.v0 ?? 2, t = 0, prevG = 1;
  const stats = { vmax: 0, gmax: -9, gmin: 9, latmax: 0, air: 0, inv: 0, jerks: 0, drop: 0, len: (S.length - 1) * DS, time: 0 };
  let inverted = false, lastPeak = S[0].y;
  for (let i = 0; i < S.length - 1; i++) {
    const p = S[i], q = S[i + 1], th = p.th, onLift = p.seg < lift;
    const gv = (v * v * (p.kv || 0) + G * Math.cos(th)) / G, ah = v * v * p.kh;
    const seat = gv * Math.cos(p.bank) + (ah / G) * Math.sin(p.bank), lat = (ah / G) * Math.cos(p.bank) - gv * Math.sin(p.bank);
    const N = G * Math.hypot(seat, lat);
    let v2 = v * v + 2 * DS * (-G * Math.sin(th) - mu * N - drag * v * v);
    if (onLift) v2 = Math.max(v2, CHAIN * CHAIN);
    if (v2 <= 0) { out.stall = i; break; }
    const vn = Math.sqrt(v2), dt = DS / ((v + vn) / 2); t += dt; v = vn;
    if (p.y < terrain(p.x) + .3 && out.crash < 0) out.crash = i;
    out.t.push(t); out.v.push(v); out.gs.push(seat); out.gl.push(lat); out.idx.push(i);
    if (!onLift) {
      stats.vmax = Math.max(stats.vmax, v); stats.gmax = Math.max(stats.gmax, seat); stats.gmin = Math.min(stats.gmin, seat); stats.latmax = Math.max(stats.latmax, Math.abs(lat));
      if (seat < .2) stats.air += dt;
      if (Math.abs((seat - prevG) / dt) > 18) stats.jerks++;
    }
    prevG = seat;
    const up = Math.cos(th) < -.2; if (up && !inverted) stats.inv++; inverted = up;
    if (q.y > p.y && p.y <= lastPeak) { /* climbing */ } if (S[i + 1] && i > 0 && p.y > S[i - 1].y && p.y >= q.y) lastPeak = p.y;
    stats.drop = Math.max(stats.drop, lastPeak - q.y);
  }
  stats.time = t; out.done = out.stall < 0 && out.crash < 0; out.stats = stats; out.vEnd = v; if (S.kink >= 0) { out.kink = S.kink; out.done = false; }
  return out;
}

// ================= scoring =================
function footprint(S) { let x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9; for (const p of S) { x0 = Math.min(x0, p.X); x1 = Math.max(x1, p.X); z0 = Math.min(z0, p.Z); z1 = Math.max(z1, p.Z); } return { w: x1 - x0 + 4, d: z1 - z0 + 4, area: (x1 - x0 + 4) * (z1 - z0 + 4) }; }
function costOf(S, terrain, lake) {
  let support = 0; for (const p of S) { const h = Math.max(0, p.y - terrain(p.x)); support += h * DS * (lake && p.x > lake[0] && p.x < lake[1] ? 4 : 1); }
  const len = (S.length - 1) * DS; return Math.round(len * .8 + support * .06 + S.filter(p => Math.abs(p.bank) > .05).length * DS * .3); // £k
}
function scores(design, site) {
  const S = design.S = geometry(design), r = ride(design, { terrain: site.terrain }), st = r.stats, fp = footprint(S);
  const thrill = Math.round(22 * Math.min(1, st.vmax / 28) + 22 * Math.min(1, st.air / 3) + 20 * Math.min(1, st.inv / 2) + 16 * Math.min(1, (st.gmax - st.gmin) / 4.5) + 20 * Math.min(1, st.drop / 40));
  let comfort = 100; comfort -= Math.max(0, st.gmax - 3.5) * 22; comfort -= Math.max(0, -1 - st.gmin) * 40; comfort -= Math.max(0, st.latmax - 1) * 35; comfort -= st.jerks * 2;
  comfort = Math.round(clamp(comfort, 0, 100));
  return { r, st, thrill, comfort, cost: costOf(S, site.terrain, site.lake), fp, ok: r.done, black: st.gmax > 6, grey: st.gmax > 5, eject: st.gmin < -1.5 };
}

// ================= sites and commissions =================
const flatSite = () => ({ terrain: () => 0, lake: null });
function siteFrom(seed) { // rolling ground with a lake, from a seed
  const r = RH.rng(seed >>> 0 || 1), a = [r() * 6, r() * 6, r() * 3], f = [.013 + r() * .01, .031 + r() * .02, .07 + r() * .03], ph = [r() * 6, r() * 6, r() * 6];
  const lx = 90 + r() * 120, lake = [lx, lx + 30 + r() * 30];
  const terrain = x => { let y = 0; for (let k = 0; k < 3; k++) y += a[k] * Math.sin(x * f[k] + ph[k]); y += 6; if (x > lake[0] && x < lake[1]) y = Math.min(y, 1); return y; };
  return { terrain, lake, seed };
}
const N = (x, y, o = {}) => ({ x, y, ...o });
const COMS = [
  { id: 'first', n: 'First Ride', site: flatSite, start: () => [N(0, 2), N(40, 32), N(62, 18), N(80, 5), N(105, 36), N(130, 5), N(170, 3)],
    story: 'The chain lift drags the train up the first hill; after that, <b>gravity is the only engine</b>. Press <b>RIDE</b>. If it stalls, drag the top of the hill where it stopped lower, and ride again.',
    req: { done: 1 } },
  { id: 'loop', n: 'The Loop', site: flatSite, start: () => [N(0, 2), N(44, 34.5), N(54.5, 21), N(86.5, 4), N(103.5, .5), N(118, 2), N(130, 14), N(118, 26), N(106, 14), N(118, 2), N(150, 1), N(165, .5)],
    story: 'The park wants an inversion. This loop is a perfect <b>circle</b>: fast enough to stay pressed in at the top means a crushing squeeze at the bottom. Keep riders under <b>5 g</b>. Real loops are not circles.',
    req: { done: 1, inv: 1, gmax: 5 } },
  { id: 'family', n: 'Family Coaster', site: flatSite, start: () => [N(0, 2), N(30, 18), N(50, 8), N(70, 3), N(95, 10), N(120, 3), N(150, 3)],
    story: 'For the under-tens: nothing above <b>3 g</b>, nothing that throws them out of the seat, but at least <b>0.8 s of airtime</b> on a hump. Budget £160k.',
    req: { done: 1, gmax: 3, gmin: -.5, air: .8, cost: 160 } },
  { id: 'turn', n: 'The Narrow Lot', site: flatSite, start: () => [N(0, 2), N(30, 22), N(50, 12), N(70, 5), N(80, 5, { r: 14, bank: 0 }), N(110, 5), N(140, 4)],
    story: 'The lot is only <b>40 m deep</b>, so the ride must turn back on itself. A flat turn throws riders sideways; <b>bank</b> it so the seat takes the push. Select the node before the turn to set its radius and bank.',
    req: { done: 1, lat: 1.2, depth: 40, turn: 1 } },
  { id: 'lake', n: 'Over the Lake', site: () => siteFrom(1937), start: () => [N(0, 8), N(40, 40), N(80, 12), N(130, 14), N(180, 10), N(230, 10)],

  out.push(['The engineer', st.latmax > 1.2 ? `Riders slammed sideways at ${st.latmax.toFixed(1)} g. Bank your turns.` : st.gmax > 5 ? `Peak ${st.gmax.toFixed(1)} g: a circle is the wrong shape for a loop.` : `Peak ${st.gmax.toFixed(1)} g, £${sc.cost}k. Tidy work.`]);

}
let HIST = {};
function histogram(c) { // the field: 30 other drafters each start from a known good design and polish it for a while (only passing designs kept)
  if (HIST[c.id]) return HIST[c.id];
  const ref = REF[c.id]; if (!ref) return null; const r = RH.rng(7), out = [], s0 = c.site(), metric = sc => c.daily ? -dailyScore(sc) : sc.cost;
  for (let k = 0; k < 30; k++) { let d = { nodes: ref(), lift: 1 }, best = scores(d, s0); if (!checkReq(c, best).every(x => x[1])) continue; let m = metric(best);
    const effort = 4 + (k % 6) * 4; // some drafters stop early, some polish for longer
    for (let it = 0; it < effort; it++) { const nd = d.nodes.map(n => ({ ...n })), q = nd[1 + (r() * (nd.length - 1) | 0)]; q.x = Math.round((q.x + (r() - .5) * 3) * 2) / 2; q.y = Math.max(.5, Math.round((q.y + (r() - .5) * 3) * 2) / 2);

}
function showResult(sc) {

    SAVE.done[C.id] = Math.max(SAVE.done[C.id] || 0, stars); const b = SAVE.best[C.id]; if (!b || (C.daily ? mine > b : mine < b)) SAVE.best[C.id] = mine;
    if (C.daily) SAVE.dailyKey = dailySeed(); persist(); FX.sfx('win'); FX.shake(.3); }

    <div class="scores"><div>thrill<b>${sc.thrill}</b></div><div>comfort<b>${sc.comfort}</b></div><div>cost<b>£${sc.cost}k</b></div><div>plan<b>${Math.round(sc.fp.w)}×${Math.round(sc.fp.d)}</b></div></div>
    <div style="font-family:'Courier Prime';font-size:13px">top ${Math.round(sc.st.vmax * 3.6)} km/h · peak ${sc.st.gmax.toFixed(1)} g · low ${sc.st.gmin.toFixed(1)} g · side ${sc.st.latmax.toFixed(1)} g · airtime ${sc.st.air.toFixed(1)} s · inversions ${sc.st.inv}</div>
    <ul class="req">${rows.map(r => `<li class="${r[1] ? 'ok' : 'bad'}">${r[0]}</li>`).join('')}</ul>
    ${pass && hist && hist.length ? `<canvas id="hist" width="600" height="110"></canvas><div style="font-size:13px">${C.daily ? 'Score' : 'Cost'} against ${hist.length} designs by other drafters: better than ${pct}%.${C.daily ? ` Today's score: <b>${mine}</b> (best ${SAVE.best[C.id]}).` : ''}</div>` : ''}
    <div class="guests">${guests(sc).map(([w, q]) => `<div>${q}<em>${w}</em></div>`).join('')}</div>
    <div class="row3"><button class="t" id="rShare">Share design</button><button class="t" id="rEdit">Keep drafting</button>${pass && COMS.indexOf(C) < COMS.length - 1 ? '<button class="t ride" id="rNext">Next →</button>' : ''}</div>`;

  $('rShare').onclick = share;

}
function drawHist(c, h, mine, higherBetter) {
  const x = c.getContext('2d'), Wc = c.width, Hc = c.height, lo = Math.min(...h, mine), hi = Math.max(...h, mine) + 1e-6, nb = 16, bins = new Array(nb).fill(0);
  for (const v of h) bins[Math.min(nb - 1, Math.floor((v - lo) / (hi - lo) * nb))]++; const mx = Math.max(...bins);
  x.fillStyle = '#123a66'; x.fillRect(0, 0, Wc, Hc);
  bins.forEach((b, i) => { const bw = Wc / nb; x.fillStyle = '#cfe6ff'; x.fillRect(i * bw + 2, Hc - 18 - b / mx * (Hc - 30), bw - 4, b / mx * (Hc - 30)); });

function share() { const url = location.href.split('#')[0] + `#c=${C.id}&d=${enc(design)}`; try { navigator.clipboard.writeText(url); } catch (e) {} toast('Design link copied to the clipboard.'); try { window.history.replaceState(null, '', url); } catch (e) {} }

// ================= UI =================
function toast(m, bad) { const t = document.createElement('div'); t.className = 'tc' + (bad ? ' bad' : ''); t.innerHTML = m; $('toastC').appendChild(t); setTimeout(() => t.remove(), 3400); while ($('toastC').children.length > 2) $('toastC').firstChild.remove(); }

  $('tools').innerHTML = play ? `<button class="t" id="tSpd" title="Ride speed">${play.speed ? play.speed + '×' : '❚❚'}</button><button class="t" id="t3d" title="Switch view">${V3.on ? '📐<span class="lbl"> Blueprint</span>' : '🎢<span class="lbl"> 3D ride</span>'}</button>${V3.on ? `<button class="t" id="tCam" title="Camera">${V3.chase ? '💺<span class="lbl"> Front seat</span>' : '📷<span class="lbl"> Chase</span>'}</button>` : ''}<button class="t" id="tSkip">Skip ▸▸</button>`

  on('tReset', () => { snapshot(); design = { nodes: C.start(), lift: 1 }; sel = -1; changed(); renderInsp(); fit(); });
  on('tSkip', () => { play.fast = 1e6; }); on('tSpd', cycleSpeed); on('t3d', toggle3D); on('tCam', () => { V3.chase = !V3.chase; V3.chaseP = null; renderTools(); if (play) v3Frame(play); });
}
function renderReq() { $('cReq').innerHTML = (last && last.ok !== undefined && last.r ? checkReq(C, last).map(r => `<li class="${r[1] ? 'ok' : 'bad'}">${r[0]}</li>`) : ROWS_ONLY(C).map(r => `<li>${r}</li>`)).join(''); }

const REF = { // found by search under the game's own rules (they are also the "field" for each histogram)
  first: () => [[0, 2], [40, 32], [54, 12.5], [81.5, .5], [110, 4.5], [129.5, 1.5], [157.5, .5]].map(a => N(...a)),

{ const m = /#c=([a-z]+)&d=([0-9a-z._-]+)/.exec(location.hash), ci = m ? COMS.findIndex(c => c.id === m[1]) : -1;
