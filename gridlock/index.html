<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip"><div class="hrow"><a class="home" href="../index.html">← Rabbit Holes</a><button id="lvBtn" class="chip">☰ Cities</button></div><h1 id="title">Gridlock</h1><div id="story"></div>
  <div class="big"><b id="avg">–</b><span>min average commute</span></div><div class="target" id="tgt"></div><div class="meter"><div id="bar"></div><i id="tick"></i></div><div id="per"></div></div>

<script>
'use strict';
// ================= traffic model =================
// Roads are one-way. Travel time on a road = t0 + k * (cars / 1000) minutes. Highways have k = 0: they never jam.
// Drivers are selfish: each keeps switching to whichever route is fastest for them right now (Wardrop equilibrium).
const R = (a, b, t0, k, o = {}) => ({ a, b, t0, k, ...o });
const LV = [
  { n: 'Rush Hour', story: 'Two thousand people drive from <b>Home</b> to <b>Work</b> every morning on a long, slow highway. You can build one street straight across.',
    nodes: { H: [140, 330, 'home'], J: [500, 120], W: [860, 330, 'work'] }, roads: [R('H', 'J', 15, 0, { hw: 1 }), R('J', 'W', 15, 0, { hw: 1 })], ghosts: [R('H', 'W', 10, 5)],
    demand: [{ o: 'H', d: 'W', n: 2000 }], target: 22, tools: { build: 1 } },
  { n: 'Detour', story: 'The town street is jammed solid. Build a bypass, but a bypass only works if it connects all the way through.',
    nodes: { H: [140, 380, 'home'], X: [500, 150], W: [860, 380, 'work'] }, roads: [R('H', 'W', 5, 20)], ghosts: [R('H', 'X', 10, 0, { hw: 1 }), R('X', 'W', 15, 0, { hw: 1 })],
    demand: [{ o: 'H', d: 'W', n: 2000 }], target: 26, tools: { build: 2 } },
  { n: 'Braess\'s Paradox', story: 'Someone built a free connector between the two routes. Now everyone uses it, and everyone is slower. Each driver is choosing rationally. <b>Close one road</b> and see what happens.',
    nodes: { A: [130, 330, 'home'], C: [500, 110], D: [500, 550], B: [870, 330, 'work'] }, roads: [R('A', 'C', 0, 10), R('C', 'B', 45, 0, { hw: 1 }), R('A', 'D', 45, 0, { hw: 1 }), R('D', 'B', 0, 10), R('C', 'D', 0, 0, { hw: 1 })],
    demand: [{ o: 'A', d: 'B', n: 4000 }], target: 66, tools: { close: 1 } },
  { n: 'Cheonggyecheon', story: 'In 2005 Seoul tore down a six-lane elevated highway and turned it back into a stream. Traffic got <b>better</b>. Here is a city with an expressway through the middle.',
    nodes: { A: [130, 330, 'home'], C: [500, 120], D: [500, 540], B: [870, 330, 'work'] }, roads: [R('A', 'C', 5, 8), R('C', 'B', 40, 0, { hw: 1 }), R('A', 'D', 40, 0, { hw: 1 }), R('D', 'B', 5, 8), R('C', 'D', 2, 0, { hw: 1, name: 'Expressway' })],
    demand: [{ o: 'A', d: 'B', n: 4000 }], target: 62, tools: { close: 1 } },
  { n: 'Ring Road', story: 'A jammed avenue through the centre, a short link down from it, and a ring road far out past Work. One road is quietly making everyone slower, and it is <b>not</b> the one in the middle.',
    nodes: { H: [110, 340, 'home'], N: [470, 110], C: [470, 340], S: [470, 570], W: [810, 340, 'work'] },
    roads: [R('H', 'N', 0, 10), R('N', 'W', 45, 0, { hw: 1 }), R('H', 'S', 45, 0, { hw: 1 }), R('S', 'W', 0, 10), R('N', 'S', 5, 0, { hw: 1, bend: -5.4, name: 'the Ring Road' }), R('H', 'C', 20, 30, { name: 'Centre Avenue' }), R('C', 'W', 30, 0, { hw: 1 }), R('C', 'S', 0, 0, { hw: 1 })],
    demand: [{ o: 'H', d: 'W', n: 4000 }], target: 67, tools: { close: 1 } },
  { n: 'The Skyway', story: 'Three proposals, budget for <b>one</b>: a gleaming zero-minute Skyway between the two routes, a little link the other way, or a slow country road around the south.',
    nodes: { H: [130, 340, 'home'], N: [480, 130], S: [480, 550], W: [850, 340, 'work'] },
    roads: [R('H', 'N', 0, 10), R('N', 'W', 45, 0, { hw: 1 }), R('H', 'S', 45, 0, { hw: 1 }), R('S', 'W', 0, 10)],
    ghosts: [R('N', 'S', 0, 0, { hw: 1, bend: .25, name: 'the Skyway' }), R('S', 'N', 5, 5, { bend: .25 }), R('H', 'W', 50, 10, { bend: 3.3, name: 'the country road' })],
    demand: [{ o: 'H', d: 'W', n: 4000 }], target: 61, tools: { build: 1 } },
  { n: 'Two Suburbs', story: 'Two suburbs share one jammed junction. There is budget for <b>two</b> of the four proposed roads. Some proposals do nothing at all on their own.',
    nodes: { P: [120, 190, 'home'], Q: [120, 500, 'home'], M: [420, 350], R: [520, 120], W: [870, 350, 'work'] },
    roads: [R('P', 'M', 4, 6), R('Q', 'M', 4, 6), R('M', 'W', 10, 4), R('P', 'W', 40, 0, { hw: 1, bend: -1 }), R('Q', 'W', 40, 0, { hw: 1, bend: 1 })],
    ghosts: [R('P', 'R', 5, 2), R('R', 'W', 8, 6), R('Q', 'R', 20, 0, { hw: 1 }), R('M', 'R', 1, 0, { hw: 1 })],
    demand: [{ o: 'P', d: 'W', n: 2000 }, { o: 'Q', d: 'W', n: 2000 }], target: 31, tools: { build: 2 } },
  { n: 'Zero Sum', story: 'Suburb <b>P</b> lobbies for an express road into the M junction; it would cut their commute. Suburb <b>Q</b> already queues through M. You can build <b>one</b> road; the target is the average over everyone.',
    nodes: { P: [120, 170, 'home'], Q: [120, 500, 'home'], N: [480, 110], M: [480, 370], S: [480, 610], W: [860, 350, 'work'] },
    roads: [R('P', 'N', 9, 6), R('N', 'W', 16, 0, { hw: 1 }), R('Q', 'M', 10, 7), R('M', 'W', 1, 11), R('Q', 'S', 45, 0, { hw: 1 }), R('S', 'W', 8, 0, { hw: 1 })],
    ghosts: [R('P', 'M', 4, 0, { hw: 1, name: 'the P Express' }), R('N', 'M', 2, 3), R('Q', 'N', 8, 3, { bend: -.35 })],
    demand: [{ o: 'P', d: 'W', n: 2000 }, { o: 'Q', d: 'W', n: 2000 }], target: 35, tools: { build: 1 } },
  { n: 'Pigou\'s Toll', story: 'A highway that always takes 40 minutes, and a free street that jams. Selfish drivers pile onto the street until it is <i>also</i> 40 minutes. A <b>toll</b> nudges some drivers back onto the highway (drivers treat $1 like 1 minute), and the people still on the street get there faster.',
    nodes: { A: [140, 340, 'home'], B: [860, 340, 'work'], T: [500, 560] }, roads: [R('A', 'B', 40, 0, { hw: 1, bend: -1 }), R('A', 'T', 0, 10), R('T', 'B', 0, 10)],
    demand: [{ o: 'A', d: 'B', n: 2000 }], target: 30.5, tools: { toll: 1 } },
  { n: 'Just Enough Toll', story: 'This connector jams a little itself. Price it out completely and you are back to 60 min. But a connector used by <i>some</i> drivers beats none at all. Find a toll that gets the average under <b>59</b>.',
    nodes: { A: [130, 330, 'home'], C: [500, 110], D: [500, 550], B: [870, 330, 'work'] }, roads: [R('A', 'C', 0, 10), R('C', 'B', 45, 0, { hw: 1 }), R('A', 'D', 45, 0, { hw: 1 }), R('D', 'B', 0, 10), R('C', 'D', 0, 5, { name: 'the connector' })],
    demand: [{ o: 'A', d: 'B', n: 3000 }], target: 59, tools: { toll: 1 } },
  { n: 'Congestion Charge', story: 'Both suburbs now have every road. The best possible average, with a dispatcher assigning routes, is <b>28.7 min</b>. Selfish drivers get 30.7. With <b>two tolls</b>, get within 2% of the optimum.',
    nodes: { P: [120, 190, 'home'], Q: [120, 500, 'home'], M: [420, 350], R: [520, 120], W: [870, 350, 'work'] },
    roads: [R('P', 'M', 4, 6), R('Q', 'M', 4, 6), R('M', 'W', 10, 4), R('P', 'W', 40, 0, { hw: 1, bend: -1 }), R('Q', 'W', 40, 0, { hw: 1, bend: 1 }), R('P', 'R', 5, 2), R('R', 'W', 8, 6), R('Q', 'R', 20, 0, { hw: 1 }), R('M', 'R', 1, 0, { hw: 1 })],
    demand: [{ o: 'P', d: 'W', n: 2000 }, { o: 'Q', d: 'W', n: 2000 }], target: 29.2, tools: { toll: 2 } },
];

// ================= state =================
const SAVE = RH.load('gridlock', { done: {}, cur: 0 });
const persist = () => { RH.save('gridlock', SAVE); RH.progress('gridlock', Object.keys(SAVE.done).length / LV.length); };
let L, roads, P, tool = 'look', sel = -1, settleT = 0, won = false, shown = { avg: 0 }, homes = [];

function load(i) {
  SAVE.cur = i; persist(); L = LV[i]; won = false; settleT = 0; sel = -1; shown.avg = 0;
  roads = [...L.roads.map(r => ({ ...r })), ...(L.ghosts || []).map(r => ({ ...r, ghost: 1, built: 0 }))];
  roads.forEach(r => { r.toll = 0; r.cars = 0; r.G = roadGeom(r); r.path = roadPath(r.G); r.lt = null; });
  homes = Object.keys(L.nodes).filter(k => L.nodes[k][2] === 'home');
  rebuildPaths(true);
  tool = Object.keys(L.tools)[0]; cars.length = 0;
  const t = $('toast'); clearTimeout(toast.h); t.classList.remove('on'); // a win toast must not linger over the next city
  $('title').textContent = L.n; $('story').innerHTML = L.story; $('toll').style.display = 'none'; $('lvBox').classList.remove('open');
  document.body.classList.toggle('tollLv', !!L.tools.toll);
  renderUI(); fit();
}
const usable = r => (!r.ghost || r.built) && !r.closed;
function rebuildPaths(reset) {
  const old = P && !reset ? new Map(P.flat().map(p => [p.key, p.f])) : null;
  P = L.demand.map(dm => {
    const out = [], adj = {}; roads.forEach((r, i) => { if (usable(r)) (adj[r.a] ||= []).push(i); });
    const dfs = (n, seen, p) => { if (out.length > 60) return; if (n === dm.d) { out.push({ e: p.slice(), key: p.join(','), f: 0, c: 0 }); return; } for (const i of adj[n] || []) { const m = roads[i].b; if (seen.has(m)) continue; seen.add(m); p.push(i); dfs(m, seen, p); p.pop(); seen.delete(m); } };
    dfs(dm.o, new Set([dm.o]), []);
    // keep drivers on routes they already use; new routes start empty so the switch is visible
    let tot = 0; out.forEach(p => { p.f = old?.get(p.key) ?? 0; tot += p.f; });
    if (tot < dm.n - 1) { const miss = dm.n - tot; if (!old || tot === 0) out.forEach(p => p.f += miss / out.length); else { flows(); let b = 0; out.forEach((p, q) => { p.c = cost(p); if (p.c < out[b].c) b = q; }); out[b].f += miss; } }
    return out;
  });
  settleT = 0; layoutLabels();
}
function flows() { for (const r of roads) r.cars = 0; if (!P) return; for (const ps of P) for (const p of ps) for (const i of p.e) roads[i].cars += p.f; }
const time = r => r.t0 + r.k * r.cars / 1000;
function cost(p) { let a = 0; for (const i of p.e) { const r = roads[i]; a += time(r) + r.toll; } return a; }
function ttime(p) { let a = 0; for (const i of p.e) a += time(roads[i]); return a; }
// one tick of "drivers learn": a few percent of drivers on slower routes switch to the currently fastest one
function adjust(rate) {
  flows();
  let gap = 0;
  for (const ps of P) {
    if (!ps.length) continue; let b = 0;
    for (let q = 0; q < ps.length; q++) { ps[q].c = cost(ps[q]); if (ps[q].c < ps[b].c) b = q; }
    const m = ps[b].c;
    for (let q = 0; q < ps.length; q++) { if (q === b) continue; const p = ps[q], d = p.c - m; if (d > 1e-6 && p.f > 0) { const mv = p.f * Math.min(.5, rate * d); p.f -= mv; ps[b].f += mv; if (p.f > 1 && d > gap) gap = d; } }
  }
  flows(); return gap;
}
function average(j) { let t = 0, n = 0; P.forEach((ps, q) => { if (j != null && q !== j) return; for (const p of ps) { t += p.f * ttime(p); n += p.f; } }); return n ? t / n : Infinity; }

// ================= drawing =================
const $ = id => document.getElementById(id);
const cv = $('cv'), g = cv.getContext('2d');
const bg = document.createElement('canvas'), bgc = bg.getContext('2d');
let W = 1, H = 1, view = { s: 1, ox: 0, oy: 0 }, dpr = 1, fs = 1; // fs: world-units scale for text so labels stay legible on phones
function fit() {
  dpr = FX.fit(cv, 2); W = cv.width; H = cv.height;
  // world bounds: nodes plus the extent of every (possibly bent) road
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (const [x, y] of Object.values(L.nodes)) { x0 = Math.min(x0, x - 45); x1 = Math.max(x1, x + 45); y0 = Math.min(y0, y - 45); y1 = Math.max(y1, y + 45); }
  for (const r of roads) for (let t = 0; t <= 1; t += .05) { const [x, y] = bez(r.G, t); x0 = Math.min(x0, x - 30); x1 = Math.max(x1, x + 30); y0 = Math.min(y0, y - 30); y1 = Math.max(y1, y + 30); }
  // reserve the screen space taken by the panels
  const wide = innerWidth > 900, hud = $('hud').getBoundingClientRect(), tools = $('tools').getBoundingClientRect();
  let left = 12, right = 12, top = 12, bottom = innerHeight - tools.top + 8;
  if (wide) { left = hud.right + 12; right = innerWidth - $('lvBox').getBoundingClientRect().left + 12; }
  else top = hud.bottom + 6;
  if (L.tools.toll) bottom += 58;
  left *= dpr; right *= dpr; top *= dpr; bottom *= dpr;
  const aw = Math.max(50, W - left - right), ah = Math.max(50, H - top - bottom);
  view.s = Math.min(aw / (x1 - x0), ah / (y1 - y0), 1.6 * dpr); view.ox = left + (aw - (x1 - x0) * view.s) / 2 - x0 * view.s; view.oy = top + (ah - (y1 - y0) * view.s) / 2 - y0 * view.s;
  fs = Math.max(1, (11 * dpr / view.s) / 15);
  // static background: paper gradient + grid, drawn once per resize
  bg.width = W; bg.height = H;
  const grd = bgc.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .7); grd.addColorStop(0, '#f8f4ec'); grd.addColorStop(1, '#e9e1d2'); bgc.fillStyle = grd; bgc.fillRect(0, 0, W, H);
  bgc.setTransform(view.s, 0, 0, view.s, view.ox, view.oy); bgc.strokeStyle = 'rgba(80,60,30,.05)'; bgc.lineWidth = 1 / view.s; bgc.beginPath();
  for (let x = -400; x <= 1400; x += 40) { bgc.moveTo(x, -400); bgc.lineTo(x, 1100); }
  for (let y = -400; y <= 1100; y += 40) { bgc.moveTo(-400, y); bgc.lineTo(1400, y); }
  bgc.stroke(); bgc.setTransform(1, 0, 0, 1, 0, 0);
  layoutLabels();
}
let fitQ = 0; addEventListener('resize', () => { if (L && !fitQ) fitQ = requestAnimationFrame(() => { fitQ = 0; fit(); }); });
const ND = n => L.nodes[n];
const nodeName = n => { const k = ND(n)[2]; return k === 'work' ? 'Work' : k === 'home' ? (homes.length > 1 ? 'Home ' + n : 'Home') : n; };
function roadGeom(r) { // returns control points; parallel roads between the same pair bend apart
  const [x1, y1] = ND(r.a), [x2, y2] = ND(r.b);
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / len, ny = (x2 - x1) / len;
  const bend = (r.bend || 0) * 170;
  return { x1, y1, x2, y2, cx: mx + nx * bend, cy: my + ny * bend, len };
}
function roadPath(G) { const p = new Path2D(); p.moveTo(G.x1, G.y1); p.quadraticCurveTo(G.cx, G.cy, G.x2, G.y2); return p; }
const bez = (G, t) => { const u = 1 - t; return [u * u * G.x1 + 2 * u * t * G.cx + t * t * G.x2, u * u * G.y1 + 2 * u * t * G.cy + t * t * G.y2]; };
const bezD = (G, t) => { const u = 1 - t; return [2 * u * (G.cx - G.x1) + 2 * t * (G.x2 - G.cx), 2 * u * (G.cy - G.y1) + 2 * t * (G.y2 - G.cy)]; };
const JAM = []; { const c1 = [58, 165, 140], c2 = [233, 162, 59], c3 = [216, 69, 47]; for (let i = 0; i <= 64; i++) { const x = i / 64, m = x < .5 ? c1.map((v, j) => v + (c2[j] - v) * x * 2) : c2.map((v, j) => v + (c3[j] - v) * (x - .5) * 2); JAM.push(`rgb(${m.map(v => v | 0)})`); } }
function jamColor(r) { const x = r.k ? Math.min(1, (time(r) - r.t0) / Math.max(8, r.t0 + 10)) : 0; return JAM[(x * 64) | 0]; }
const ORIG = ['#3a7bd5', '#c2459b', '#2f9e74', '#d98b2b'];

// labels: placed once per layout change, avoiding nodes and each other
function layoutLabels() {

let hover = -1;
function draw(now) {

function roundRect(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }

// ================= input =================
const toWorld = e => { const r = cv.getBoundingClientRect(); return [((e.clientX - r.left) * dpr - view.ox) / view.s, ((e.clientY - r.top) * dpr - view.oy) / view.s]; };

cv.addEventListener('pointermove', e => { const [x, y] = toWorld(e); hover = roadAt(x, y); cv.style.cursor = hover >= 0 && (roads[hover].ghost ? L.tools.build : tool !== 'look') ? 'pointer' : 'default'; });

});
const roadName = r => r.name ? r.name[0].toUpperCase() + r.name.slice(1) : `${nodeName(r.a)} → ${nodeName(r.b)}`;

function renderTools() {

  if (L.tools.close) t.push(['close', '🚧 Close', `<i>${L.tools.close - roads.filter(q => q.closed).length}</i>`]);
