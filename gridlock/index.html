<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gridlock</title>
<meta name="description" content="You can't build roads, only rules. Toll, close, signal and bus-lane a growing city, forecast where selfish commuters settle, and keep the city moving.">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,600;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* The Department of Traffic Law: a printed city map on drafting paper, a typed memo clipped beside it,
     rule tokens (toll booths, barriers, signal heads, paint) in a wooden tray. */
  :root{--paper:#f1ead9;--ink:#1d2733;--ink2:#4a5562;--red:#c8312b;--orange:#ec6a1c;--green:#1f8a5b;--navy:#24466e;--mustard:#d39a00;--memo:#fbf7ec;--wood1:#5b3a22;--wood2:#3f2716}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#e9e0c9;color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  button{font-family:"Barlow Condensed",Barlow,sans-serif;cursor:pointer;color:var(--ink)}
  button:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
  #app{position:fixed;inset:0;display:grid;grid-template-columns:340px 1fr;grid-template-rows:1fr auto;grid-template-areas:"memo map" "memo tray"}
  /* the memo */
  #memo{grid-area:memo;position:relative;z-index:2;margin:14px 0 14px 14px;padding:14px 16px 12px;overflow:auto;color:var(--ink);transform:rotate(-.3deg);
    background:radial-gradient(120% 90% at 30% 10%,rgba(255,255,255,.55),transparent 60%),repeating-linear-gradient(0deg,transparent 0 23px,rgba(36,70,110,.07) 23px 24px),var(--memo);
    box-shadow:0 1px 0 #fff inset,2px 10px 22px -10px rgba(40,30,10,.55);border:1px solid #d9cfb7}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:6px}
  .home{color:var(--ink2);font-size:12px;text-decoration:none;letter-spacing:.04em}
  .dept{margin-top:6px;font:600 11px/1.2 "Barlow Condensed";letter-spacing:.18em;color:var(--red);text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:4px;display:flex;justify-content:space-between}
  h1{margin:5px 0 0;font:700 26px/1 "Barlow Condensed";text-transform:uppercase}
  #ev{font-size:14px;line-height:1.4;color:#323c47;margin:7px 0 8px;min-height:2.8em}
  #ev b{color:var(--ink)}
  .big{display:flex;align-items:baseline;gap:8px;border-top:1px dashed #b9ae95;padding-top:6px}
  .big b{font:700 46px/1 "Barlow Condensed";font-variant-numeric:tabular-nums}
  .big span{color:var(--ink2);font:500 13px/1.1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.07em}
  .scale{height:9px;border:1.5px solid var(--ink);margin:6px 0 2px;position:relative;background:repeating-linear-gradient(90deg,#fff 0 9.5%,#d8d2c2 9.5% 10%)}
  .scale div{position:absolute;left:0;top:0;bottom:0;background:var(--navy);transition:width .3s}
  .scale i{position:absolute;top:-5px;width:3px;height:17px;background:var(--red)}
  .lim{font:600 11px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);display:flex;justify-content:space-between}
  #cls{margin-top:8px;display:grid;grid-template-columns:auto 1fr 34px;gap:3px 7px;align-items:center;font:600 13px "Barlow Condensed";letter-spacing:.03em}
  #cls .bar{height:8px;background:#e4dccb;position:relative;border:1px solid #b9ae95}
  #cls .bar div{position:absolute;left:0;top:0;bottom:0}
  #cls .bar i{position:absolute;top:-4px;width:2px;height:14px;background:var(--red)}
  #cls .n{text-align:right;font-variant-numeric:tabular-nums}
  .sw{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
  #books{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 14px;font:600 13px "Barlow Condensed";letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
  #books b{color:var(--ink);font-size:15px}
  .dots i{display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--navy);margin-left:2px;vertical-align:0}
  .dots i.on{background:var(--navy)}
  .strike{color:var(--red)}
  #spark{display:block;width:100%;height:34px;margin-top:8px}
  .mbtn{border:1.5px solid var(--ink);background:var(--memo);font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;min-height:30px}
  #more{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  /* the map */
  #mapWrap{grid-area:map;position:relative;overflow:hidden;min-height:0}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #chip{position:absolute;left:12px;top:12px;max-width:min(300px,calc(100% - 24px));display:none;padding:8px 11px 9px;background:var(--memo);border:1.5px solid var(--ink);box-shadow:3px 3px 0 rgba(29,39,51,.25);font:500 14px/1.35 Barlow;z-index:3}
  #chip.on{display:block}
  #chip h3{margin:0 0 2px;font:700 17px "Barlow Condensed";text-transform:uppercase;letter-spacing:.03em;padding-right:24px}
  #chip .law{font:600 13px "Barlow Condensed";color:var(--ink2);letter-spacing:.03em}
  #chip .mix{display:flex;height:7px;margin:5px 0 4px;border:1px solid var(--ink)}
  #chip .row{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
  #chip .row button{border:1.5px solid var(--ink);background:#fff;font-weight:700;font-size:14px;letter-spacing:.05em;padding:2px 9px;min-height:32px}
  #chip .row button.on{background:var(--ink);color:var(--memo)}
  #chipX{position:absolute;right:2px;top:2px;border:0;background:none;font-size:18px;min-width:32px;min-height:32px}
  #slip{position:absolute;left:50%;top:14px;transform:translateX(-50%) rotate(.6deg);width:min(380px,calc(100% - 24px));display:none;padding:12px 16px 12px;z-index:4;
    background:repeating-linear-gradient(0deg,transparent 0 21px,rgba(36,70,110,.08) 21px 22px),#fffdf5;border:1px solid #cfc4a9;border-top:6px solid var(--navy);box-shadow:2px 12px 26px -12px rgba(40,30,10,.6)}
  #slip.on{display:block}
  #slip h2{margin:0;font:700 22px/1.1 "Barlow Condensed";text-transform:uppercase;letter-spacing:.03em}
  #slip p{margin:6px 0 0;font-size:14px;line-height:1.4}
  #slip .case{margin-top:8px;padding:6px 8px;border:2px dashed var(--red);font-size:13.5px}
  #slip .case b{font:700 15px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--red);display:block}
  #slip .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  .go{border:2px solid var(--ink);background:var(--ink);color:var(--memo);font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;min-height:40px;box-shadow:3px 3px 0 var(--orange)}
  .go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--orange)}
  .go.ghost{background:var(--memo);color:var(--ink);box-shadow:none}
  #stamp{position:absolute;left:22px;bottom:22px;padding:3px 10px;border:4px double var(--red);color:var(--red);font:700 26px/1 "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;opacity:0;transform:rotate(-14deg);pointer-events:none;mix-blend-mode:multiply;z-index:3}
  #stamp.slam{animation:slam .42s cubic-bezier(.2,1.4,.4,1) both}
  #stamp.navy{color:var(--navy);border-color:var(--navy)}
  @keyframes slam{0%{opacity:0;transform:rotate(-4deg) scale(3)}55%{opacity:.95;transform:rotate(-15deg) scale(.92)}100%{opacity:.85;transform:rotate(-14deg) scale(1)}}
  /* the token tray */
  #tray{grid-area:tray;position:relative;z-index:2;display:flex;align-items:center;gap:10px;padding:9px 12px;margin:0 14px 14px;background:linear-gradient(var(--wood1),var(--wood2));border:1px solid #2a180c;box-shadow:0 8px 18px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15);min-height:76px}
  #hand{display:flex;gap:8px;flex:1;min-width:0}
  .tok{position:relative;flex:0 1 112px;min-width:0;min-height:56px;border:2px solid #1a1a1a;background:linear-gradient(#f6efdf,#e2d6bc);box-shadow:0 3px 0 #120b05;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:4px 6px;touch-action:none;user-select:none;-webkit-user-select:none}
  .tok svg{width:30px;height:22px}
  .tok span{font:700 13px/1 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .tok i{position:absolute;top:-7px;right:-7px;font:700 12px/18px "Barlow Condensed";font-style:normal;min-width:20px;height:20px;text-align:center;background:var(--ink);color:#fff;border-radius:10px}
  .tok.armed{background:linear-gradient(#ffd6ad,#f3a86b);border-color:var(--red)}
  .tok.dead{opacity:.4}
  .tok.pulse{animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 3px 0 #120b05,0 0 0 5px rgba(236,106,28,.55)}}
  #side{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
  #actsL{font:600 12px "Barlow Condensed";letter-spacing:.1em;text-transform:uppercase;color:#f1e3c6}
  #actsL .dots i{border-color:#f1e3c6}#actsL .dots i.on{background:#ffb06b;border-color:#ffb06b}
  #runBtn{border:2px solid #120b05;background:linear-gradient(#ffd6ad,#f3a86b);font-size:17px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;min-height:42px;box-shadow:0 3px 0 #120b05}
  #runBtn:disabled{opacity:.5}
  /* forecast: a slide rule over the tray */
  #fc{position:absolute;inset:0;display:none;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(#2b4a6b,#1d3550);color:#f4efe2;z-index:3}
  #fc.on{display:flex}
  #fc label{font:600 13px/1.15 "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;max-width:120px}
  #fc input{flex:1;min-width:80px;accent-color:#ffb06b;height:32px}
  #fcV{font:700 32px/1 "Barlow Condensed";min-width:84px;text-align:right;font-variant-numeric:tabular-nums}
  #fcV small{font-size:14px}
  #fcGo{border:2px solid #120b05;background:linear-gradient(#ffd6ad,#f3a86b);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:6px 12px;min-height:42px}
  #ghost{position:fixed;z-index:20;pointer-events:none;display:none;transform:translate(-50%,-90%)}
  #ghost.on{display:block}
  /* casebook */
  .modal-bg{position:fixed;inset:0;background:rgba(29,39,51,.45);z-index:30;display:flex;align-items:center;justify-content:center;padding:12px}
  .modal{width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto;padding:16px 18px;background:linear-gradient(#e3c98d,#d4b46c);border:1px solid #a9893f;box-shadow:2px 14px 30px -12px rgba(0,0,0,.6);font-size:14px;line-height:1.4}
  .modal h2{margin:0 0 8px;font:700 22px "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;color:#4a3610}
  .modal .card{background:#fbf4e0;border:1px solid #c7ad70;border-left:5px solid #c7ad70;padding:6px 10px;margin:0 0 5px}
  .modal .card.found{border-left-color:var(--red)}
  .modal .card b{font:700 15px "Barlow Condensed";letter-spacing:.05em;text-transform:uppercase}
  .modal .card.unk{opacity:.7;border-style:dashed}
  .modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}
  .modal button{border:2px solid var(--ink);background:#fbf4e0;font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;padding:5px 12px;min-height:38px}
  .modal button.primary{background:var(--ink);color:#fbf4e0}
  .modal pre{white-space:pre-wrap;background:#fbf4e0;padding:8px;border:1px solid #c7ad70;font:14px/1.3 ui-monospace,monospace}
  .toast-wrap{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
  .toast{background:var(--ink);color:var(--memo);padding:7px 14px;font:600 15px "Barlow Condensed";letter-spacing:.04em;box-shadow:0 6px 14px -6px rgba(0,0,0,.5);max-width:90vw;text-align:center}
  .pz-bar{right:10px!important;bottom:10px!important}
  .pz-bar button{border:1.5px solid var(--ink);background:var(--memo);font-weight:700}
  /* phones: memo on top (compact), map, tray */
  @media (max-width:900px){
    #app{grid-template-columns:1fr;grid-template-rows:auto 1fr auto;grid-template-areas:"memo" "map" "tray"}
    #memo{margin:6px 6px 0;padding:8px 11px 8px;transform:none;max-height:42vh}
    h1,.dept,#spark{display:none}
    #ev{font-size:13px;line-height:1.3;margin:4px 0 5px;min-height:0}
    .big b{font-size:32px}.big{padding-top:4px}
    #cls{margin-top:5px;font-size:12px;gap:1px 6px;grid-template-columns:auto 1fr 28px}
    #cls .lim{display:none}
    .big b{font-size:30px}.scale{margin:3px 0 1px}
    #books{margin-top:5px;font-size:12px;gap:2px 10px}
    #more{margin-top:5px}
    #tray{margin:0 6px 6px;padding:7px 8px;gap:7px;min-height:70px}
    .tok{min-height:52px;flex-basis:84px}.tok span{font-size:12px}
    #runBtn{font-size:15px;padding:5px 10px}
    #fc label{display:none}#fcV{font-size:26px;min-width:66px}
    #chip{font-size:13px}
    .toast-wrap{bottom:96px}
  }
  @media (max-width:900px) and (max-height:520px), (max-height:520px){
    #app{grid-template-columns:270px 1fr;grid-template-rows:1fr auto;grid-template-areas:"memo map" "memo tray"}
    #memo{margin:6px 0 6px 6px;max-height:none}
    #gauge{display:block}
    #tray{min-height:60px;padding:5px 8px;margin:0 6px 6px}
    .tok{min-height:46px}.tok svg{height:18px}
  }
  @media (prefers-color-scheme:dark){html,body{background:#d9cfb5}}
</style>
</head>
<body>
<div id="app">
  <section id="memo">
    <div class="hrow"><a class="home" href="../index.html">← Rabbit Holes</a><span id="monthL" style="font:700 14px 'Barlow Condensed';letter-spacing:.08em;text-transform:uppercase"></span></div>
    <div class="dept"><span>Department of Traffic Law</span><span id="seedL"></span></div>
    <h1>Gridlock</h1>
    <div id="ev"></div>
    <div id="gauge">
      <div><div class="big"><b id="avg">–</b><span>min<br>average</span></div>
        <div class="scale"><div id="avgBar"></div><i id="avgTick"></i></div><div class="lim"><span id="avgNote">today</span><span>council limit 40</span></div></div>
      <div id="cls"></div>
    </div>
    <div id="books"></div>
    <svg id="spark" viewBox="0 0 100 30" preserveAspectRatio="none" aria-hidden="true"></svg>
    <div id="more"><button class="mbtn" id="caseBtn">Casebook</button><button class="mbtn" id="cityBtn">City ▾</button></div>
  </section>
  <div id="mapWrap" data-play>
    <canvas id="cv" aria-label="City map: drag rule tokens onto roads"></canvas>
    <div id="chip" role="dialog" aria-live="polite"><button id="chipX" aria-label="Close">×</button><div id="chipBody"></div></div>
    <div id="slip" role="status"></div>
    <div id="stamp"></div>
  </div>
  <div id="tray">
    <div id="hand"></div>
    <div id="side"><span id="actsL"></span><button id="runBtn">Run month ▸</button></div>
    <div id="fc"><label for="fcR">Forecast: once drivers settle, the average will be</label><input type="range" id="fcR" min="5" max="90" step="0.5" aria-label="Forecast average commute in minutes"><span id="fcV"></span><button id="fcGo">Lock &amp; run</button></div>
  </div>
</div>
<div id="ghost"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script>
// ENGINE START
// Gridlock engine: a growing city, rule tokens, multi-class selfish commuters (Wardrop equilibrium, day by day).
// Pure logic, no DOM. Deterministic per seed.
const GL = (() => {
  'use strict';
  const VOT = { c: 1.5, o: 0.5, s: 0.15 };            // value of time, $ per minute
  const CLS = ['c', 'o', 's'];
  const CLSNAME = { c: 'Couriers', o: 'Office staff', s: 'Students' };
  const COLS = 9, ROWS = 7, SP = 120;
  const LIMIT_T = 40, LIMIT_B = 60, FARE = 1, CAR = 2; // CAR: fuel and parking, $ per car trip
  const SWEEPS = 40;
  const RULES = {
    toll:   { n: 'Toll booth', on: 'road', levels: [1, 2, 4, 8] },
    close:  { n: 'Barrier', on: 'road' },
    signal: { n: 'Signal priority', on: 'road' },
    lane:   { n: 'Bus lane', on: 'road' },
    bus:    { n: 'Bus line', on: 'home' },
    cordon: { n: 'Cordon charge', on: 'job', levels: [2, 4, 8] },
    widen:  { n: 'Widening', on: 'road', cost: 1.5 },
  };
  // ---- rng ----
  function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  function rng(seed) {
    let a = typeof seed === 'string' ? hash(seed) : seed >>> 0;
    const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
    f.int = n => Math.floor(f() * n); f.pick = arr => arr[Math.floor(f() * arr.length)];
    return f;
  }
  const NAMES_H = ['Ashby', 'Elm Park', 'Kettle Hill', 'Marsh End', 'Northgate', 'Pell Green', 'Quarry Row', 'Sorrel', 'Tanners', 'Upfield', 'Vine Cross', 'Wexley', 'Yarrow', 'Brook Lea', 'Cinder Vale', 'Fenwick', 'Holloway', 'Larch', 'Ormsby', 'Redcliff'];
  const STREETS = ['Mill', 'Station', 'Church', 'Canal', 'Market', 'Ropewalk', 'Victoria', 'Albert', 'Foundry', 'Chapel', 'Quay', 'Garden', 'Orchard', 'Tower', 'Bridge', 'Tannery', 'Wharf', 'Union', 'Granary', 'Cobble'];

  const idx = (c, r) => r * COLS + c;
  const colOf = i => i % COLS, rowOf = i => (i / COLS) | 0;

  // ---------------- city creation ----------------
  function newCity(seed) {
    seed = String(seed).slice(0, 32);
    const R = rng('gl:' + seed);
    const pts = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) pts.push([Math.round(c * SP + (R() - .5) * 46), Math.round(r * SP * .92 + (R() - .5) * 40)]);
    const river = []; let cr = 4 + R.int(2) - (R() < .5 ? 0 : 1);
    for (let r = 0; r < ROWS; r++) { river.push(cr); if (R() < .4) cr = Math.max(3, Math.min(5, cr + (R() < .5 ? -1 : 1))); }
    const C = { v: 3, seed, pts, river, nodes: {}, roads: [], lines: [], cordons: [], month: 0, treasury: 2, cred: 4, strikes: 0, groups: [],
      hist: [], cases: {}, names: { h: 0, s: R.int(STREETS.length) }, unlock: {}, hand: [], acts: 0, log: [], over: false, avgH: {}, mixes: {} };
    // downtown just west of the river in the middle row; a block of junctions around it
    const r0 = 3, cD = river[r0];
    const dt = idx(cD, r0);
    const act = (i, kind, extra) => { C.nodes[i] = Object.assign({ kind: kind || 'j' }, extra || {}); };
    for (let r = r0 - 1; r <= r0 + 1; r++) for (let c = cD - 2; c <= cD; c++) if (c > 0) act(idx(c, r));
    act(dt, 'job', { name: 'Downtown', w: 1, mix: { c: 0, o: 1, s: 0 } });
    // the east bank: a small block across one bridge
    for (let r = r0 - 1; r <= r0 + 1; r++) act(idx(river[r] + 1, r));
    // homes: one west, one east
    const hw = idx(cD - 3, r0 - 1 + R.int(3)), he = idx(river[r0 + 1] + 2, r0 + 1);
    act(hw, 'home', { name: NAMES_H[0], pop: 1200 });
    act(he, 'home', { name: NAMES_H[1], pop: 900 });
    C.names.h = 2;
    connectAll(C, R);
    // bridges: the downtown row and one more
    addRoad(C, idx(river[r0], r0), idx(river[r0] + 1, r0), 'bridge');
    const rb = R() < .5 ? r0 - 1 : r0 + 1; addRoad(C, idx(river[rb], rb), idx(river[rb] + 1, rb), 'bridge');
    // avenues through downtown
    for (const rd of C.roads) if ((rd.a === dt || rd.b === dt) && rd.type === 'street') { rd.type = 'avenue'; rd.k = 2.4; }
    ensureConnected(C);
    C.unlock = { toll: 2, close: 1 };
    rebuildGroups(C);
    return C;
  }
  const crosses = (C, a, b) => { // does the lattice edge a-b cross the river?
    const side = i => colOf(i) <= C.river[rowOf(i)] ? 0 : 1; return side(a) !== side(b);
  };
  function roadName(C) { const s = STREETS[(C.names.s++) % STREETS.length]; const suf = ['Street', 'Road', 'Lane', 'Way'][C.roads.length % 4]; return s + ' ' + suf; }
  function addRoad(C, a, b, type) {
    if (a > b) [a, b] = [b, a];

    $('spark').innerHTML = `<line x1="0" x2="100" y1="${30 - GL.LIMIT_T / mx * 30}" y2="${30 - GL.LIMIT_T / mx * 30}" stroke="#c8312b" stroke-width="1" stroke-dasharray="2 2" vector-effect="non-scaling-stroke"/><polyline points="${pts}" fill="none" stroke="#24466e" stroke-width="1.6" vector-effect="non-scaling-stroke"/>` + H.map((x, i) => x.bad ? `<circle cx="${i / (H.length - 1) * 100}" cy="${30 - x.avg / mx * 30}" r="1.6" fill="#c8312b"/>` : '').join(''); }

function renderTray() {

    el.className = 'tok' + (left <= 0 || C.acts <= 0 || phase !== 'plan' ? ' dead' : '') + (armed === k ? ' armed' : '') + (C.month === 1 && !C.placed.length && k === 'toll' ? ' pulse' : '');
    el.innerHTML = ICON[k] + `<span>${GL.RULES[k].n}</span><i>${Math.max(0, left)}</i>`; el.title = TIP[k]; el.dataset.k = k; el.setAttribute('aria-label', `${GL.RULES[k].n} token, ${left} left. ${TIP[k]}`);
    hookToken(el, k); hand.appendChild(el);

  $('actsL').innerHTML = `Changes ${dots}`;
  $('runBtn').disabled = phase !== 'plan';

}

// ---------- tokens: drag from the tray, or tap then tap the map ----------
const ghost = $('ghost');

function place(k, h) {

}

// ---------- info chip ----------
function select(h) {
  sel = h; const b = $('chipBody'); let s = '';
  const placedIdx = pred => C.placed.findIndex(pred);
  if (!h) { $('chip').classList.remove('on'); return; }
  if (h.road != null) {
    const rd = C.roads[h.road], x = flowX[rd.id], t = timeOf(rd.id), xc = flowXC[rd.id];
    s += `<h3>${rd.name}</h3><div class="law">${rd.t0.toFixed(1)} min + ${GL.kEff(C, rd).toFixed(1)} per 1,000 cars${rd.type === 'express' ? ' · flyover' : rd.type === 'bridge' ? ' · bridge' : ''}</div>`;
    s += rd.closed ? '<div>Closed.</div>' : `<div><b>${Math.round(x).toLocaleString('en')}</b> cars · <b>${t.toFixed(1)}</b> min to cross${rd.toll ? ` · <b style="color:var(--red)">$${rd.toll}</b> toll` : ''}</div>`;
    if (x > 5) s += '<div class="mix">' + GL.CLS.map((k, i) => `<div style="flex:${xc[i]};background:${CCOL[k]}" title="${GL.CLSNAME[k]}"></div>`).join('') + '</div>';
    const row = [];
    if (rd.toll) { const pi = placedIdx(a => a.t === 'toll' && a.road === rd.id);
      if (pi >= 0) row.push(...[1, 2, 4, 8].map(lv => `<button data-do="lv" data-v="${lv}" class="${rd.toll === lv ? 'on' : ''}">$${lv}</button>`)); }
    for (const [what, has] of [['toll', rd.toll], ['close', rd.closed], ['signal', rd.sig === 1], ['lane', rd.lane]]) if (has) {
      const pi = placedIdx(a => a.t === what && a.road === rd.id);
      row.push(pi >= 0 ? `<button data-do="undo" data-v="${pi}">Pick up ${GL.RULES[what].n.toLowerCase()}</button>` : `<button data-do="rm" data-v="${what}">Remove ${GL.RULES[what].n.toLowerCase()} (1 change)</button>`); }

  } else {

        const pi = C.placed.findIndex(a => a.t === 'bus' && a.node === h.node);
        if (phase === 'plan') s += `<div class="row">${pi >= 0 ? GL.jobs(C).map(j => `<button data-do="dest" data-v="${j}" class="${l.d === j ? 'on' : ''}">to ${C.nodes[j].name.replace(/^the /, '')}</button>`).join('') + `<button data-do="undo" data-v="${pi}">Pick up</button>` : `<button data-do="rmline" data-v="${li}">Scrap line (1 change)</button>`}</div>`; }
    } else {
      s += `<h3>${n.name.replace(/^the /, 'The ')}</h3><div>Jobs for ${GL.CLS.filter(k => n.mix[k] > 0).map(k => Math.round(n.mix[k] * 100) + '% ' + GL.CLSNAME[k].toLowerCase()).join(', ')}</div>`;
      const cd = C.cordons.find(c => c.node === h.node);

        s += `<div class="row">${pi >= 0 ? [2, 4, 8].map(lv => `<button data-do="clv" data-v="${lv}" class="${cd.level === lv ? 'on' : ''}">$${lv}</button>`).join('') + `<button data-do="undo" data-v="${pi}">Pick up</button>` : `<button data-do="rmcord">Lift charge (1 change)</button>`}</div>`; }

  }

}
function chipDo(what, v) {
  const h = sel;

  if (what === 'lv' || what === 'dest' || what === 'clv') { // change a token placed this month: rewrite its entry and replay
    const placed = C.placed.slice(), i = placed.findIndex(a => what === 'lv' ? a.t === 'toll' && a.road === h.road : what === 'dest' ? a.t === 'bus' && a.node === h.node : a.t === 'cordon' && a.node === h.node);
    if (i < 0) return; placed[i] = Object.assign({}, placed[i], what === 'dest' ? { to: +v } : { level: +v });
    const D = GL.restore(snap); C = D; for (const a of placed) GL.act(C, Object.assign({}, a)); snd.tick(); persist(); syncFlows(); renderMemo(); renderTray(); select(h); return; }
  let err = null;

$('chipX').onclick = () => select(null);
// taps on the map: place an armed token, or inspect
let downAt = null;
cv.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
cv.addEventListener('pointerup', e => {
  if (!downAt || cam.gesturing || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 8) { downAt = null; return; } downAt = null;
  if (armed && phase === 'plan') { const h = hitAt(e.clientX, e.clientY, targetKind(armed)); if (h) { place(armed, h); return; } }
  select(hitAt(e.clientX, e.clientY));
});
cv.addEventListener('pointermove', e => { if (armed && e.pointerType === 'mouse') { hover = hitAt(e.clientX, e.clientY, targetKind(armed)); } });

// ---------- forecast and run ----------
function openForecast() {
  if (phase !== 'plan') return;
  const pre = GL.measure(C).avg; $('fcR').min = Math.max(5, Math.floor(pre - 20)); $('fcR').max = Math.ceil(pre + 20); $('fcR').value = Math.round(pre * 2) / 2; showFc();
  $('fc').classList.add('on'); select(null); snd.key();
}
function showFc() { $('fcV').innerHTML = (+$('fcR').value).toFixed(1) + '<small> min</small>'; }
$('fcR').oninput = () => { showFc(); snd.tick(); };
$('runBtn').onclick = openForecast;
$('fcGo').onclick = () => { $('fc').classList.remove('on'); run(+$('fcR').value); };
function run(forecast) {
  phase = 'run'; renderTray();
  snap = snap || GL.serialize(C);
  const startX = Float64Array.from(flowX);
  report = GL.runMonth(C, forecast, { frames: true });
  // animate the days: drivers learning, one day per frame-step
  anim = { t0: performance.now(), dur: 2600, frames: report.frames, startX };
  persist();
}
function stepAnim(now) {
  const u = Math.min(1, (now - anim.t0) / anim.dur), F = anim.frames, f = Math.min(F.length - 1, Math.floor(u * u * (F.length - 1) * 1.0));
  const day = f + 1; flowX = Float64Array.from(F[f]); $('avgNote').textContent = `day ${day} of ${F.length}: drivers trying routes`; $('avg').textContent = report.days[f].toFixed(1);
  if (f > (anim.lastF ?? -1)) { anim.lastF = f; if (f % 3 === 0) snd.tick(); }
  if (u >= 1) { anim = null; syncFlows(); cars.length = 0; phase = 'result'; renderMemo(); showResult(); }
}
function showResult() {
  const r = report, fc = r.fc; let h = '';
  const bad = !r.okT || !r.okB || r.broke;
  h += `<h2>Month ${r.month}: ${r.avg.toFixed(1)} min</h2>`;
  if (fc) h += `<p>You forecast <b>${fc.guess.toFixed(1)}</b>. ${fc.grade === 2 ? '<b>Spot on.</b>' : fc.grade === 1 ? '<b>Close.</b>' : `<b>Off by ${fc.err.toFixed(1)}.</b>`} ${fc.dc > 0 ? `Credibility +${fc.dc}.` : fc.dc < 0 ? 'Credibility −1.' : 'Nothing moved much, so nothing earned.'}</p>`;
  const worst = Object.entries(r.cls).sort((a, b) => b[1].burden - a[1].burden)[0];
  const why = []; if (!r.okT) why.push(`the average is over ${GL.LIMIT_T}`); if (!r.okB && worst) why.push(`${GL.CLSNAME[worst[0]].toLowerCase()} carry a burden of ${worst[1].burden.toFixed(0)}`); if (r.broke) why.push('the treasury is in the red');
  h += `<p>${bad ? (C.month <= 3 ? 'On probation, the council lets it pass: ' : `<b style="color:var(--red)">Strike ${r.strikes} of 3</b>: `) + why.join(' and ') + '.' : 'The council is satisfied.'} Treasury ${r.rev - r.upkeep >= 0 ? '+' : '−'}$${Math.abs(r.rev - r.upkeep).toFixed(2)}M${r.riders > 20 ? ` · ${Math.round(r.riders).toLocaleString('en')} bus riders` : ''}.</p>`;
  for (const [k, why2] of r.found) { const cs = GL.CASES.find(c => c[0] === k); const fresh = !META.cases[k]; if (fresh) META.cases[k] = C.month; h += `<div class="case"><b>${fresh ? 'New in the casebook' : 'Casebook'}: ${cs[1]}</b>${cs[2]} ${why2}</div>`; }
  if (C.over === 'fired') h += `<p><b>Three bad months in a row: the council has let you go</b> after ${C.month} months.</p>`;
  if (C.over === 'retired') h += `<p><b>Thirty-six months. The city gives you its freedom.</b></p>`;
  h += `<div class="acts">${C.over ? `<button class="go ghost" id="sAgain">This city again</button><button class="go" id="sEnd">${C.over === 'retired' ? 'Keep going' : 'Summary'}</button>` : `<button class="go ghost" id="sRedo" title="Replan this month (−1 credibility)">↺ Redo</button><button class="go" id="sNext">Month ${C.month + 1} ▸</button>`}</div>`;
  select(null); $('slip').innerHTML = h; $('slip').classList.add('on');
  const st = $('stamp'); st.className = ''; void st.offsetWidth; st.textContent = bad ? (C.month <= 3 ? 'NOTED' : 'OVER LIMIT') : fc && fc.grade === 2 ? 'CALLED IT' : 'APPROVED'; st.className = 'slam' + (bad ? '' : ' navy'); setTimeout(() => { snd.stamp(); FX.shake(.25); }, 150);
  if (r.found.length) setTimeout(() => snd.till(), 500);
  const best = META.best[C.seed] || 0; if (C.month > best && (!bad || C.over)) META.best[C.seed] = C.hist.filter(x => true).length;
  persist();
  if ($('sNext')) $('sNext').onclick = () => { $('stamp').className = ''; nextMonth(); };
  if ($('sRedo')) $('sRedo').onclick = () => { $('stamp').className = ''; redoMonth(); };
  if ($('sAgain')) $('sAgain').onclick = () => { $('stamp').className = ''; newRun(C.seed); };
  if ($('sEnd')) $('sEnd').onclick = () => { if (C.over === 'retired') { C.over = false; C.endless = 1; $('stamp').className = ''; nextMonth(); } else summary(); };
}
function hideSlip() { $('slip').classList.remove('on'); $('stamp').className = ''; }

// ---------- casebook, city menu, sharing ----------
function modal(html, buttons) { return new Promise(res => { const bg = document.createElement('div'); bg.className = 'modal-bg'; const m = document.createElement('div'); m.className = 'modal'; m.innerHTML = html; const row = document.createElement('div'); row.className = 'row';
  buttons.forEach((b, i) => { const el = document.createElement('button'); el.textContent = b.label; if (i === buttons.length - 1) el.className = 'primary'; el.onclick = () => { bg.remove(); res(b.value ?? b.label); }; row.appendChild(el); });
  m.appendChild(row); bg.appendChild(m); bg.onclick = e => { if (e.target === bg) { bg.remove(); res(null); } }; document.body.appendChild(bg); }); }
$('caseBtn').onclick = () => {
  const n = Object.keys(META.cases).length;
  const cards = GL.CASES.map(([k, name, what, hint]) => META.cases[k] ? `<div class="card found"><b>${name}</b><br>${what}</div>` : `<div class="card unk"><b>? ? ?</b><br><i>${hint}</i></div>`).join('');
  const rb = Object.entries(C.unlock).filter(([k, v]) => v > 0 && GL.RULES[k]).map(([k, v]) => `${GL.RULES[k].n} ×${k === 'widen' ? '∞' : v}`).join(' · ');
  modal(`<h2>Casebook · ${n} of ${GL.CASES.length}</h2><p style="margin:0 0 8px">Things your city did that its commuters never meant to. Each one you witness in a run adds a token to that run's rulebook.</p>${cards}<p style="margin:8px 0 0"><b>This run's rulebook:</b> ${rb}. Each month you are dealt three of them.</p>`, [{ label: 'Close' }]);
};
function shareText() {
  const grid = C.hist.map(h => h.bad ? '🟥' : h.avg > GL.LIMIT_T - 4 ? '🟨' : '🟩').join('');
  const calls = C.hist.filter(h => h.fc === 2).length;
  return `Gridlock · ${C.seed === todaySeed() ? "today's city" : 'city ' + C.seed}\nheld ${C.hist.length} months ${C.over === 'retired' ? '🏅' : ''}\n${grid}\n🎯 ${calls} forecasts called · 📒 ${Object.keys(C.cases).length}/${GL.CASES.length} cases\n${location.origin + location.pathname}#city=${encodeURIComponent(C.seed)}`;
}
async function share() { const t = shareText(); try { await navigator.clipboard.writeText(t); RH.toast('Copied: paste it anywhere.'); } catch (e) { modal(`<h2>Share</h2><pre>${t.replace(/</g, '&lt;')}</pre>`, [{ label: 'Close' }]); } }
$('cityBtn').onclick = async () => {
  const best = META.best[C.seed] || 0, today = META.best[todaySeed()] || 0;
  const v = await modal(`<h2>The city</h2><p>${C.seed === todaySeed() ? "Today's city: everyone gets the same map, the same events and the same tokens." : `City <b>${C.seed}</b>.`} Best here: <b>${best}</b> months. Today's best: <b>${today}</b>.</p><p>Runs filed: ${META.runs}. A run is endless after month 36; three bad months in a row ends it.</p>`,
    [{ label: 'Share', value: 'share' }, { label: 'Random city', value: 'rand' }, { label: 'Restart this city', value: 'again' }, { label: "Today's city", value: 'today' }]);
  if (v === 'share') share(); else if (v === 'rand') newRun(Math.random().toString(36).slice(2, 8)); else if (v === 'again') newRun(C.seed); else if (v === 'today') newRun(todaySeed());
};
function summary() {
  const n = C.hist.length, avg = C.hist.reduce((a, h) => a + h.avg, 0) / Math.max(1, n), calls = C.hist.filter(h => h.fc === 2).length;
  modal(`<h2>${C.over === 'fired' ? 'Dismissed' : 'Retired'} after ${n} months</h2><p>Average commute over your tenure <b>${avg.toFixed(1)} min</b>. Peak population <b>${Math.max(...C.hist.map(h => h.pop)).toLocaleString('en')}</b>. Forecasts called: <b>${calls}</b>.</p><pre>${shareText().replace(/</g, '&lt;')}</pre>`,
    [{ label: 'Share', value: 'share' }, { label: 'Random city', value: 'rand' }, { label: 'This city again', value: 'again' }]).then(v => { if (v === 'share') share(); else if (v === 'rand') newRun(Math.random().toString(36).slice(2, 8)); else if (v === 'again') newRun(C.seed); });
}
addEventListener('keydown', e => { if (e.key === 'Escape') { armed = null; select(null); renderTray(); } if (e.key === 'Enter' && $('fc').classList.contains('on')) $('fcGo').click(); });
addEventListener('hashchange', () => { const h = /^#city=(.+)$/.exec(location.hash); if (h && decodeURIComponent(h[1]) !== C.seed) newRun(decodeURIComponent(h[1]).slice(0, 32)); });
addEventListener('resize', () => { if (!cam.touched) cam.fit(false); });

boot();
requestAnimationFrame(frame);
