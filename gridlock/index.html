<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gridlock</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* A city-planning office: a printed transit map on drafting paper, memos clipped to it, rubber stamps, toll booths and orange barriers. */
  :root{--accent:#ec6a1c;--paper:#f1ead9;--paper2:#e7dcc3;--ink:#1d2733;--ink2:#4a5562;--pencil:#6f6a61;--red:#c8312b;--orange:#ec6a1c;--green:#1f8a5b;--navy:#24466e;--manila:#e3c98d;--manila2:#d4b46c}
  html,body{height:100%;overflow:hidden;background:#e9e0c9;color:var(--ink);font-family:Barlow,"Helvetica Neue",Arial,sans-serif}
  button{font-family:"Barlow Condensed",Barlow,sans-serif;border-radius:2px}
  button:focus-visible,.lv:focus-visible,input:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  /* the memo: a typed sheet clipped to the map */
  .sheet{position:fixed;color:var(--ink);background:
      radial-gradient(120% 90% at 30% 10%,rgba(255,255,255,.55),transparent 60%),
      repeating-linear-gradient(0deg,transparent 0 23px,rgba(36,70,110,.07) 23px 24px),#fbf7ec;
    box-shadow:0 1px 0 #fff inset,0 2px 0 rgba(0,0,0,.06),2px 10px 22px -10px rgba(40,30,10,.55);border:1px solid #d9cfb7}
  #hud{top:18px;left:18px;padding:16px 18px 14px;width:336px;transform:rotate(-.4deg)}
  #hud::before{content:'';position:absolute;top:-12px;left:50%;width:74px;height:20px;margin-left:-37px;background:linear-gradient(#b8bcc2,#7d838b 45%,#a9aeb5);border-radius:3px 3px 1px 1px;box-shadow:0 2px 3px rgba(0,0,0,.35)}
  #hud .home{color:var(--ink2);font-size:12px;text-decoration:none;letter-spacing:.04em}
  .dept{margin-top:8px;font:600 11px/1.2 "Barlow Condensed";letter-spacing:.18em;color:var(--red);text-transform:uppercase;border-bottom:2px solid var(--ink);padding-bottom:4px;display:flex;justify-content:space-between}
  #hud h1{margin:6px 0 2px;font:700 27px/1.05 "Barlow Condensed";letter-spacing:.01em;text-transform:uppercase}
  #story{font-size:14px;line-height:1.42;color:#323c47;margin:6px 0 10px}
  .big{display:flex;align-items:baseline;gap:8px;border-top:1px dashed #b9ae95;padding-top:8px}
  .big b{font:700 54px/1 "Barlow Condensed";font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .big span{color:var(--ink2);font:500 14px "Barlow Condensed";text-transform:uppercase;letter-spacing:.08em}
  .target{font:600 14px "Barlow Condensed";letter-spacing:.04em;color:var(--ink2);margin-top:3px;text-transform:uppercase}
  .target.ok{color:var(--green)}
  /* a printed scale bar instead of a progress pill */
  .meter{height:10px;background:repeating-linear-gradient(90deg,var(--ink) 0 10%,#fbf7ec 10% 20%);border:1.5px solid var(--ink);margin-top:10px;position:relative}
  .meter div{position:absolute;left:0;top:0;height:100%;background:var(--orange);mix-blend-mode:multiply;transition:width .25s,background .25s}
  .meter i{position:absolute;top:-6px;width:3px;height:20px;background:var(--red)}
  .meter i::after{content:'TARGET';position:absolute;top:21px;left:-16px;font:700 8px "Barlow Condensed";letter-spacing:.12em;color:var(--red)}
  #per{font:500 13px "Barlow Condensed";letter-spacing:.04em;color:var(--ink2);margin-top:16px}#per:empty{display:none}
  #grade{font:600 13px "Barlow Condensed";letter-spacing:.06em;text-transform:uppercase;color:var(--navy);margin-top:6px}#grade:empty{display:none}
  #next{display:none;margin-top:14px;border:2px solid var(--ink);background:var(--ink);color:#fbf7ec;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--orange)}
  #next:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--orange)}
  body.canNext #next{display:inline-block}
  /* the APPROVED stamp: the signature moment */
  #stamp{position:absolute;right:12px;bottom:40px;padding:4px 12px;border:4px double var(--red);color:var(--red);font:700 30px/1 "Barlow Condensed";letter-spacing:.12em;text-transform:uppercase;opacity:0;transform:rotate(-14deg);pointer-events:none;
    -webkit-mask:repeating-radial-gradient(circle at 30% 40%,#000 0 1.4px,rgba(0,0,0,.55) 1.6px 2.4px);mask:repeating-radial-gradient(circle at 30% 40%,#000 0 1.4px,rgba(0,0,0,.55) 1.6px 2.4px);mix-blend-mode:multiply}
  #stamp.on{opacity:.88}
  #stamp.slam{animation:slam .42s cubic-bezier(.2,1.4,.4,1) both}
  #stamp.grade1{color:var(--navy);border-color:var(--navy)}#stamp.grade2{color:#7b3fa0;border-color:#7b3fa0}
  @keyframes slam{0%{opacity:0;transform:rotate(-4deg) scale(3.2)}55%{opacity:.95;transform:rotate(-15deg) scale(.92)}100%{opacity:.88;transform:rotate(-14deg) scale(1)}}
  /* case files: manila folders with tabs */
  #lvBox #levels{position:fixed;top:18px;right:18px;padding:10px 8px 8px;width:228px;max-height:calc(100vh - 130px);overflow:auto;background:linear-gradient(var(--manila),var(--manila2));border:1px solid #b99b55;box-shadow:2px 10px 22px -10px rgba(40,30,10,.55);transform:rotate(.5deg)}
  #levels h4{margin:0 6px 8px;font:700 13px "Barlow Condensed";letter-spacing:.2em;text-transform:uppercase;color:#5a4318}
  .lv{position:relative;padding:5px 10px 5px 12px;margin:0 0 3px;font:600 15px "Barlow Condensed";letter-spacing:.03em;cursor:pointer;display:flex;justify-content:space-between;background:#fbf4e0;border:1px solid #c7ad70;border-left:5px solid #c7ad70}
  .lv:hover{border-left-color:var(--orange)}
  .lv.cur{background:var(--ink);color:#fbf7ec;border-color:var(--ink);border-left-color:var(--orange)}
  .lv.lock{opacity:.4;pointer-events:none;background:transparent;border-style:dashed}
  .lv .ok{color:var(--red);font-weight:700;font-size:12px;letter-spacing:.1em}
  .lv.cur .ok{color:#ffb38a}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:6px}.hrow>span{white-space:nowrap}
  #lvBtn{display:none;font-size:14px;font-weight:700;letter-spacing:.12em;padding:3px 10px;cursor:pointer;background:linear-gradient(var(--manila),var(--manila2));border:1px solid #a9893f;color:#4a3610}
  /* the stamp rack */
  #tools{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px 10px;background:linear-gradient(#5b3a22,#3f2716);border:1px solid #2a180c;box-shadow:0 8px 18px -8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.15)}
  .tool{position:relative;border:2px solid #1a1a1a;background:linear-gradient(#f6efdf,#e2d6bc);padding:6px 12px 5px;font-size:16px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);cursor:pointer;display:flex;gap:7px;align-items:center;box-shadow:0 3px 0 #120b05;transition:transform .06s,box-shadow .06s}
  .tool:active{transform:translateY(3px);box-shadow:0 0 0 #120b05}
  .tool.on{background:linear-gradient(#ffd6ad,#f3a86b);border-color:var(--red);color:#3a1004}
  .tool i{font-style:normal;font:700 13px "Barlow Condensed";background:var(--ink);color:#fff;padding:0 5px;min-width:18px;text-align:center}
  .tool svg{width:18px;height:18px}
  /* the toll booth ticket */
  #toll{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);padding:9px 16px;display:none;align-items:center;gap:10px;font:600 15px "Barlow Condensed";letter-spacing:.05em;text-transform:uppercase;background:repeating-linear-gradient(-45deg,#fde9c9 0 12px,#fbe2b8 12px 24px);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--orange)}
  #toll b{font-weight:700}
  #toll input{width:220px;accent-color:var(--orange)}
  #toll small{color:var(--ink2);font-size:12px;text-transform:none;letter-spacing:0;font-family:Barlow}
  #tollV{font:700 22px "Barlow Condensed";min-width:44px;display:inline-block;color:var(--red)}
  /* printed map key */
  #legend{position:fixed;bottom:16px;left:16px;padding:7px 12px;font:600 12px "Barlow Condensed";letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);display:flex;gap:10px;align-items:center;background:#fbf7ec;border:1.5px solid var(--ink)}
  #legend span{display:inline-block;width:26px;height:6px;vertical-align:middle;margin-right:4px}
  #legend em{font-style:normal;padding-right:8px;border-right:1px solid #c9bea5;color:var(--ink)}
  #toast{position:fixed;top:46%;left:50%;transform:translate(-50%,-50%) rotate(-1deg) translateY(10px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s;text-align:center;max-width:min(520px,90vw);background:#fbf7ec;border:1px solid #c9bea5;border-top:6px solid var(--red);padding:10px 18px 12px;box-shadow:2px 12px 26px -12px rgba(40,30,10,.6);font:700 30px/1.1 "Barlow Condensed";letter-spacing:.04em;text-transform:uppercase}
  #toast.on{opacity:1;transform:translate(-50%,-50%) rotate(-1deg)}
  #toast small{display:block;font:400 15px/1.4 Barlow;letter-spacing:0;text-transform:none;color:#323c47;margin-top:6px}
  #briefBtn{display:none;font-size:14px;font-weight:700;letter-spacing:.12em;padding:3px 10px;cursor:pointer;background:#fbf7ec;border:1px solid var(--ink);color:var(--ink)}
  /* on phones the brief folds away once you start working on the map (BRIEF brings it back) */
  @media (max-width:760px),(max-height:520px){#briefBtn{display:inline-block}body.playing:not(.brief) #story{display:none}}
  @media (max-height:520px){#story{display:none}body.brief #story{display:block}#hud{width:290px;top:8px;left:8px;padding:8px 12px;transform:none}#hud::before{display:none}#hud h1{font-size:19px;margin:2px 0}.dept{margin-top:4px}.big b{font-size:32px}.big{padding-top:4px}#per{margin-top:14px}#stamp{bottom:30px;font-size:20px}#hud .rh-like{display:none!important}#tools{bottom:6px;padding:5px}.tool{padding:5px 9px 4px;font-size:14px}#toll{bottom:62px}}
  @media (pointer:coarse){.tool,#lvBtn,#briefBtn,#next{min-height:40px}.lv{min-height:40px;align-items:center}}
  @media (max-width:900px){#lvBtn{display:inline-block}#lvBox #levels{display:none;top:12px;right:12px;width:236px;max-height:calc(100vh - 24px);z-index:5}#lvBox.open #levels{display:block}#legend{display:none}}
  @media (max-width:760px){#hud{top:10px;left:8px;width:calc(100vw - 16px);padding:10px 13px 10px;transform:none}#hud h1{font-size:21px;margin:3px 0}#story{font-size:12.5px;line-height:1.33;margin:3px 0 6px}.big b{font-size:36px}.big span{font-size:12px}.meter{margin-top:6px}#per{margin-top:14px}#stamp{bottom:26px;font-size:22px}#tools{bottom:8px;max-width:calc(100vw - 12px);gap:5px;padding:6px}.tool{padding:6px 9px 5px;font-size:14px}#toll{bottom:70px;width:calc(100vw - 16px);box-sizing:border-box;flex-wrap:wrap;justify-content:center;gap:4px 8px;padding:7px 10px}#toll input{width:150px}#toast{font-size:22px}}
</style>
</head>
<body>
<canvas id="cv" aria-label="City map"></canvas>
<div id="hud" class="sheet"><div class="hrow"><a class="home" href="../index.html">← Rabbit Holes</a><span><button id="briefBtn" aria-expanded="false">BRIEF</button> <button id="lvBtn">CASE FILES</button></span></div>
  <div class="dept"><span>City Planning Dept.</span><span id="fileNo">Traffic study</span></div>
  <h1 id="title">Gridlock</h1><div id="story"></div>
  <div class="big"><b id="avg">–</b><span>min average commute</span></div><div class="target" id="tgt"></div><div class="meter"><div id="bar"></div><i id="tick"></i></div><div id="per"></div><div id="grade"></div><button id="next">Next city →</button><div id="stamp"></div></div>
<div id="lvBox"><div id="levels"></div></div>
<div id="tools"></div>
<div id="toll"><span>Toll booth on <b id="tollName"></b></span> <input type="range" id="tollR" min="0" max="40" step="1" aria-label="Toll in dollars"> <b id="tollV"></b> <small>($1 ≈ 1 min to drivers)</small></div>
<div id="legend"><em>Key</em><span style="background:#2b9a6b"></span>free <span style="background:#f0a020"></span>busy <span style="background:#d63a2a"></span>jammed</div>
<div id="toast" role="status"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
// ================= traffic model =================
// Roads are one-way. Travel time on a road = t0 + k * (cars / 1000) minutes. Highways have k = 0: they never jam.
// Drivers are selfish: each keeps switching to whichever route is fastest for them right now (Wardrop equilibrium).
const R = (a, b, t0, k, o = {}) => ({ a, b, t0, k, ...o });
const LV = [
  { n: 'Rush Hour', story: 'Two thousand people drive from <b>Home</b> to <b>Work</b> every morning on a long, slow highway. You can build one street straight across.',
    nodes: { H: [140, 330, 'home'], J: [500, 120], W: [860, 330, 'work'] }, roads: [R('H', 'J', 15, 0, { hw: 1 }), R('J', 'W', 15, 0, { hw: 1 })], ghosts: [R('H', 'W', 10, 5)],
    demand: [{ o: 'H', d: 'W', n: 2000 }], target: 22, tools: { build: 1 } },
  { n: 'Detour', story: 'The town street is jammed solid. Build a bypass, but a bypass only works if it connects all the way through.',
    nodes: { H: [140, 380, 'home'], X: [500, 150], W: [860, 380, 'work'] }, roads: [R('H', 'W', 5, 20)], ghosts: [R('H', 'X', 10, 0, { hw: 1 }), R('X', 'W', 15, 0, { hw: 1 })],
    demand: [{ o: 'H', d: 'W', n: 2000 }], target: 26, tools: { build: 2 } },
  { n: 'Braess\'s Paradox', story: 'Someone built a free connector between the two routes. Now everyone uses it, and everyone is slower. Each driver is choosing rationally. <b>Close one road</b> and see what happens.',
    nodes: { A: [130, 330, 'home'], C: [500, 110], D: [500, 550], B: [870, 330, 'work'] }, roads: [R('A', 'C', 0, 10), R('C', 'B', 45, 0, { hw: 1 }), R('A', 'D', 45, 0, { hw: 1 }), R('D', 'B', 0, 10), R('C', 'D', 0, 0, { hw: 1 })],
    demand: [{ o: 'A', d: 'B', n: 4000 }], target: 66, tools: { close: 1 },
    lesson: 'That is Braess\'s paradox. It happens in real cities: when Seoul tore down the Cheonggyecheon expressway in 2005, traffic got <b>better</b>.' },
  { n: 'Ring Road', story: 'A jammed avenue through the centre, a short link down from it, and a ring road far out past Work. One road is quietly making everyone slower, and it is <b>not</b> the one in the middle.',
    nodes: { H: [110, 340, 'home'], N: [470, 110], C: [470, 340], S: [470, 570], W: [810, 340, 'work'] },
    roads: [R('H', 'N', 0, 10), R('N', 'W', 45, 0, { hw: 1 }), R('H', 'S', 45, 0, { hw: 1 }), R('S', 'W', 0, 10), R('N', 'S', 5, 0, { hw: 1, bend: -5.4, name: 'the Ring Road' }), R('H', 'C', 20, 30, { name: 'Centre Avenue' }), R('C', 'W', 30, 0, { hw: 1 }), R('C', 'S', 0, 0, { hw: 1 })],
    demand: [{ o: 'H', d: 'W', n: 4000 }], target: 67, tools: { close: 1 } },
  { n: 'The Skyway', story: 'Three proposals, budget for <b>one</b>: a gleaming zero-minute Skyway between the two routes, a little link the other way, or a slow country road around the south.',
    nodes: { H: [130, 340, 'home'], N: [480, 130], S: [480, 550], W: [850, 340, 'work'] },
    roads: [R('H', 'N', 0, 10), R('N', 'W', 45, 0, { hw: 1 }), R('H', 'S', 45, 0, { hw: 1 }), R('S', 'W', 0, 10)],
    ghosts: [R('N', 'S', 0, 0, { hw: 1, bend: .25, name: 'the Skyway' }), R('S', 'N', 5, 5, { bend: .25 }), R('H', 'W', 50, 10, { bend: 3.3, name: 'the country road' })],
    demand: [{ o: 'H', d: 'W', n: 4000 }], target: 61, tools: { build: 1 } },
  { n: 'Two Suburbs', story: 'Two suburbs share one jammed junction. There is budget for <b>two</b> of the four proposed roads. Some proposals do nothing at all on their own.',
    nodes: { P: [120, 190, 'home'], Q: [120, 500, 'home'], M: [420, 350], R: [520, 120], W: [870, 350, 'work'] },
    roads: [R('P', 'M', 4, 6), R('Q', 'M', 4, 6), R('M', 'W', 10, 4), R('P', 'W', 40, 0, { hw: 1, bend: -1 }), R('Q', 'W', 40, 0, { hw: 1, bend: 1 })],
    ghosts: [R('P', 'R', 5, 2), R('R', 'W', 8, 6), R('Q', 'R', 20, 0, { hw: 1 }), R('M', 'R', 1, 0, { hw: 1 })],
    demand: [{ o: 'P', d: 'W', n: 2000 }, { o: 'Q', d: 'W', n: 2000 }], target: 31, tools: { build: 2 } },
  { n: 'Zero Sum', story: 'Suburb <b>P</b> lobbies for an express road into the M junction; it would cut their commute. Suburb <b>Q</b> already queues through M. You can build <b>one</b> road; the target is the average over everyone.',
    nodes: { P: [120, 170, 'home'], Q: [120, 500, 'home'], N: [480, 110], M: [480, 370], S: [480, 610], W: [860, 350, 'work'] },
    roads: [R('P', 'N', 9, 6), R('N', 'W', 16, 0, { hw: 1 }), R('Q', 'M', 10, 7), R('M', 'W', 1, 11), R('Q', 'S', 45, 0, { hw: 1 }), R('S', 'W', 8, 0, { hw: 1 })],
    ghosts: [R('P', 'M', 4, 0, { hw: 1, name: 'the P Express' }), R('N', 'M', 2, 3), R('Q', 'N', 8, 3, { bend: -.35 })],
    demand: [{ o: 'P', d: 'W', n: 2000 }, { o: 'Q', d: 'W', n: 2000 }], target: 35, tools: { build: 1 } },
  { n: 'Pigou\'s Toll', story: 'A highway that always takes 40 minutes, and a free street that jams. Selfish drivers pile onto the street until it is <i>also</i> 40 minutes. A <b>toll</b> nudges some drivers back onto the highway (drivers treat $1 like 1 minute), and the people still on the street get there faster.',
    nodes: { A: [140, 340, 'home'], B: [860, 340, 'work'], T: [500, 560] }, roads: [R('A', 'B', 40, 0, { hw: 1, bend: -1 }), R('A', 'T', 0, 10), R('T', 'B', 0, 10)],
    demand: [{ o: 'A', d: 'B', n: 2000 }], target: 30.5, tools: { toll: 1 },
    lesson: 'The best toll charges each driver the delay they cause everyone else. Here that is $20.' },
  { n: 'Just Enough Toll', story: 'This connector jams a little itself. Price it out completely and you are back to 60 min. But a connector used by <i>some</i> drivers beats none at all. Find a toll that gets the average under <b>59</b>.',
    nodes: { A: [130, 330, 'home'], C: [500, 110], D: [500, 550], B: [870, 330, 'work'] }, roads: [R('A', 'C', 0, 10), R('C', 'B', 45, 0, { hw: 1 }), R('A', 'D', 45, 0, { hw: 1 }), R('D', 'B', 0, 10), R('C', 'D', 0, 5, { name: 'the connector' })],
    demand: [{ o: 'A', d: 'B', n: 3000 }], target: 59, tools: { toll: 1 } },
  { n: 'Congestion Charge', story: 'Both suburbs now have every road. The best possible average, with a dispatcher assigning routes, is <b>28.7 min</b>. Selfish drivers get 30.7. With <b>two tolls</b>, get within 2% of the optimum.',
    nodes: { P: [120, 190, 'home'], Q: [120, 500, 'home'], M: [420, 350], R: [520, 120], W: [870, 350, 'work'] },
    roads: [R('P', 'M', 4, 6), R('Q', 'M', 4, 6), R('M', 'W', 10, 4), R('P', 'W', 40, 0, { hw: 1, bend: -1 }), R('Q', 'W', 40, 0, { hw: 1, bend: 1 }), R('P', 'R', 5, 2), R('R', 'W', 8, 6), R('Q', 'R', 20, 0, { hw: 1 }), R('M', 'R', 1, 0, { hw: 1 })],
    demand: [{ o: 'P', d: 'W', n: 2000 }, { o: 'Q', d: 'W', n: 2000 }], target: 29.2, tools: { toll: 2 } },
  { n: 'Your City', story: 'The whole department is yours: a <b>$6M</b> budget for any of five proposals, one closure, and up to two toll booths. Every plan is graded by the commission. The flashiest proposal is a trap on its own.',
    nodes: { P: [110, 190, 'home'], Q: [110, 520, 'home'], A: [370, 90], M: [420, 340], B: [360, 620], C: [660, 210], D: [660, 500], W: [900, 350, 'work'] },
    roads: [R('M', 'C', 0, 4), R('P', 'A', 2, 7), R('A', 'M', 16, 0, { hw: 1, bend: .22 }), R('D', 'W', 23, 0, { hw: 1 }), R('D', 'C', 13, 0, { hw: 1, bend: .2 }), R('B', 'M', 1, 5), R('P', 'M', 28, 0, { hw: 1 }), R('M', 'A', 2, 2, { bend: .22 }), R('Q', 'M', 1, 3), R('C', 'W', 3, 7),
      R('P', 'W', 45, 0, { hw: 1, bend: -.62 }), R('Q', 'W', 45, 0, { hw: 1, bend: .55 })],
    ghosts: [R('Q', 'B', 4, 1, { cost: 3 }), R('A', 'C', 3, 0, { hw: 1, cost: 4, name: 'the Skyline Expressway' }), R('M', 'W', 5, 2, { cost: 2, bend: .05 }), R('C', 'D', 5, 6, { cost: 2, bend: .2 }), R('M', 'D', 6, 3, { cost: 2 })],
    demand: [{ o: 'P', d: 'W', n: 2000 }, { o: 'Q', d: 'W', n: 2000 }], target: 30, budget: 6, tools: { build: 5, close: 1, toll: 2 },
    // the commission's grades (minutes): any sound plan, the right pair of roads, and roads plus a well-priced toll
    grades: [[30, 'Approved'], [26.2, 'Commended'], [24.3, 'Masterplan']],
    lesson: 'The commission\'s dispatcher, routing every car by hand, could reach about 23.5 min. Selfish drivers plus a good plan get within a few percent.' },
];

// ================= the office's sounds =================
const T = o => FX.tone(o);

const roadName = r => r.name ? r.name[0].toUpperCase() + r.name.slice(1) : `${nodeName(r.a)} → ${nodeName(r.b)}`;

$('tollR').addEventListener('pointerdown', () => { tollHeld = true; settleT = 0; });
addEventListener('pointerup', () => { tollHeld = false; }); addEventListener('pointercancel', () => { tollHeld = false; });

$('tollR').addEventListener('change', () => { const r = roads[sel]; if (r && r.toll) snd.till(); });

  const t = [];
  if (L.tools.build) t.push(['build', ICON.build + 'Build', `<i>${L.budget ? '$' + budgetLeft() + 'M' : L.tools.build - roads.filter(q => q.ghost && q.built).length}</i>`]);
