<style>

<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip"><a class="home" href="../index.html">← Rabbit Holes</a><h1 id="title">Low Reynolds</h1><div id="story"></div><div id="goal"></div>
  <div id="nav"><select id="lvsel" aria-label="Level"></select><button class="b on" id="next">Next ▸</button></div></div>
<div id="levels" class="chip"></div>
<div id="padBox" class="chip"><div class="t" id="padT"></div>
  <div class="pw"><canvas id="pad"></canvas><div class="ctl">
  <div class="row"><button class="b" data-p="circle">◯ circle</button><button class="b" data-p="square">◻ square</button><button class="b" data-p="line">⟷ back &amp; forth</button><button class="b" id="rev">↺ reverse</button><button class="b" id="asym" hidden title="Open the hinge fast and close it slowly">⚡ open fast, close slow</button></div>
  <div class="row" id="slots"><button class="b" id="slotSave" title="Save the current loop into a slot (or Shift+1/2/3)">💾 save</button><button class="b" data-slot="0" title="Key 1">1</button><button class="b" data-slot="1" title="Key 2">2</button><button class="b" data-slot="2" title="Key 3">3</button></div>
  <div class="row"><button class="b" id="play">⏸</button><button class="b" data-s="1">1×</button><button class="b on" data-s="3">3×</button><button class="b" data-s="8">8×</button><button class="b" id="reset">Reset</button><button class="b" id="padMin" title="Hide or show shape space">▾ pad</button></div>
  </div></div></div>
<div id="stat" class="chip"></div>
<div id="toast"></div>

<script src="../shared/fx.js"></script>
<script>
'use strict';
// ================= physics: Purcell's three-link swimmer in resistive-force theory =================
// No inertia: at every instant drag forces and torques on the body sum to exactly zero.
// Drag on a slender segment is twice as strong sideways as lengthways (ξ⊥ = 2ξ∥), and that asymmetry is what lets it swim at all.
const XP = 1, XN = 2, SEG = 8, Lm = 1, Ls = 1, NP = SEG * 3;
// body-frame geometry of the current shape, in flat typed arrays (no per-step allocation)
const PRX = new Float64Array(NP), PRY = new Float64Array(NP), PTX = new Float64Array(NP), PTY = new Float64Array(NP),
  PJ1X = new Float64Array(NP), PJ1Y = new Float64Array(NP), PJ2X = new Float64Array(NP), PJ2Y = new Float64Array(NP), PDS = new Float64Array(NP);
function shape(t1, t2) {
  let n = 0;
  for (let i = 0; i < SEG; i++, n++) { PRX[n] = -Lm / 2 + (i + .5) * Lm / SEG; PRY[n] = 0; PTX[n] = 1; PTY[n] = 0; PJ1X[n] = PJ1Y[n] = PJ2X[n] = PJ2Y[n] = 0; PDS[n] = Lm / SEG; }
  const a1 = Math.PI + t1, c1 = Math.cos(a1), s1 = Math.sin(a1);
  for (let i = 0; i < SEG; i++, n++) { const s = (i + .5) * Ls / SEG; PRX[n] = -Lm / 2 + c1 * s; PRY[n] = s1 * s; PTX[n] = c1; PTY[n] = s1; PJ1X[n] = -s1 * s; PJ1Y[n] = c1 * s; PJ2X[n] = PJ2Y[n] = 0; PDS[n] = Ls / SEG; }
  const a2 = -t2, c2 = Math.cos(a2), s2 = Math.sin(a2);
  for (let i = 0; i < SEG; i++, n++) { const s = (i + .5) * Ls / SEG; PRX[n] = Lm / 2 + c2 * s; PRY[n] = s2 * s; PTX[n] = c2; PTY[n] = s2; PJ1X[n] = PJ1Y[n] = 0; PJ2X[n] = s2 * s; PJ2Y[n] = -c2 * s; PDS[n] = Ls / SEG; }
}
// Body velocity (forward, sideways, turn rate) in the body frame for shape velocity (d1, d2) at shape (t1, t2).
// Linear in (d1, d2): the hallmark of Stokes flow. Returns the power dissipated against drag.
const BV = new Float64Array(3);
function bodyVel(t1, t2, d1, d2, out = BV) {
  shape(t1, t2);
  let m00 = 0, m01 = 0, m02 = 0, m11 = 0, m12 = 0, m22 = 0, b0 = 0, b1 = 0, b2 = 0;
  const dk = XP - XN;
  for (let i = 0; i < NP; i++) {
    const tx = PTX[i], ty = PTY[i], ds = PDS[i], rx = PRX[i], ry = PRY[i], sx = PJ1X[i] * d1 + PJ2X[i] * d2, sy = PJ1Y[i] * d1 + PJ2Y[i] * d2;
    // K v = XN v + (XP-XN)(v·t) t ;  basis velocities e0=(1,0), e1=(0,1), e2=(-ry, rx)
    const k0x = XN + dk * tx * tx, k0y = dk * tx * ty, k1x = k0y, k1y = XN + dk * ty * ty, k2x = -ry * k0x + rx * k1x, k2y = -ry * k0y + rx * k1y;
    const st = sx * tx + sy * ty, ksx = XN * sx + dk * st * tx, ksy = XN * sy + dk * st * ty;
    m00 += k0x * ds; m01 += k0y * ds; m02 += k2x * ds; m11 += k1y * ds; m12 += k2y * ds; m22 += (-ry * k2x + rx * k2y) * ds;
    b0 -= ksx * ds; b1 -= ksy * ds; b2 -= (-ry * ksx + rx * ksy) * ds;
  }
  const c00 = m11 * m22 - m12 * m12, c01 = m02 * m12 - m01 * m22, c02 = m01 * m12 - m02 * m11, D = m00 * c00 + m01 * c01 + m02 * c02;
  const c11 = m00 * m22 - m02 * m02, c12 = m01 * m02 - m00 * m12, c22 = m00 * m11 - m01 * m01;
  const x0 = (c00 * b0 + c01 * b1 + c02 * b2) / D, x1 = (c01 * b0 + c11 * b1 + c12 * b2) / D, x2 = (c02 * b0 + c12 * b1 + c22 * b2) / D;
  out[0] = x0; out[1] = x1; out[2] = x2;
  MI[0] = c00 / D; MI[1] = c01 / D; MI[2] = c02 / D; MI[3] = c11 / D; MI[4] = c12 / D; MI[5] = c22 / D; // symmetric inverse of the drag matrix
  return powerOf(x0, x1, x2, d1, d2);
}
const MI = new Float64Array(6);
function powerOf(x0, x1, x2, d1, d2) { // drag power for body motion (x0, x1, x2) plus shape motion (d1, d2), current shape
  let w = 0; const dk = XP - XN;
  for (let i = 0; i < NP; i++) {
    const vx = x0 - x2 * PRY[i] + PJ1X[i] * d1 + PJ2X[i] * d2, vy = x1 + x2 * PRX[i] + PJ1Y[i] * d1 + PJ2Y[i] * d2, vt = vx * PTX[i] + vy * PTY[i];
    w += (XN * (vx * vx + vy * vy) + dk * vt * vt) * PDS[i];
  }
  return w;
}

// ================= levels =================
const LV = [
  { n: 'The Scallop', hinges: 1, start: [0, 0, 0], line: 2.5, obstacles: [],
    story: 'You are a bacterium. At your size water is like <b>honey</b>: stop moving and you stop dead, with no gliding. You have <b>one hinge</b>, like a scallop. Open and close it any way you like, even <b>fast one way and slow the other</b> (⚡), and try to swim across the line.',
    goal: 'Try to cross the line. Do 8 strokes with any stroke you like.', test: S => S.cycles >= 8, lesson: '<b>The scallop theorem.</b> With one hinge, every stroke runs backwards over exactly the path it came. In honey, undoing a stroke undoes the motion. Speed doesn\'t matter, fast or slow: you can\'t swim. (E. M. Purcell, 1976)' },
  { n: 'Two Hinges', hinges: 2, start: [0, 0, 0], line: 2.5, dir: 1, obstacles: [],
    story: 'Purcell\'s fix: <b>two hinges</b>. Now a stroke can trace a <b>loop</b> in shape space, going out one way and coming back another. That is a stroke time can\'t simply rewind.',
    goal: 'Cross the line 2.5 body lengths ahead.', test: S => S.reached, lesson: 'Net motion comes from the <b>area</b> your loop encloses. A back-and-forth line has no area and goes nowhere.' },
  { n: 'Reverse Gear', hinges: 2, start: [0, 0, 0], line: -2.5, dir: -1, obstacles: [],
    story: 'The line is <b>behind</b> you. Swimmers can\'t turn their heads round, but they can run the stroke the other way.',
    goal: 'Cross the line behind you.', test: S => S.reached, lesson: 'Running the loop the other way round reverses the motion. The direction is in the stroke itself.' },
  { n: 'Nine Strokes', hinges: 2, start: [0, 0, 0], line: 2, maxCycles: 9, obstacles: [],
    story: 'The colours under shape space are a map. For a loop run the way the <b>default circle</b> goes (clockwise on the pad), green regions push you forward and pink regions push you back, for every bit of area the loop encloses there. Reverse the loop and they swap. <b>Big loops over the bright patches go furthest.</b>',
    goal: 'Cross a line in <b>9 strokes or fewer</b>, in either direction. Reset to try again.', test: S => S.reached && S.strokes <= 9.001, fail: S => S.strokes > 9.001 && !S.reached, lesson: 'Displacement ≈ area × field strength. Mathematicians call this the <b>geometric phase</b>: the same maths as Foucault\'s pendulum and a falling cat righting itself.' },
  { n: 'About Turn', hinges: 2, start: [0, 0, 0], target: null, turn: Math.PI / 2, obstacles: [],
    story: 'A loop centred on the middle of shape space swims straight. Push the loop off into a <b>corner</b> and the swimmer starts to <b>turn</b>.',
    goal: 'Turn the swimmer at least 90°.', test: S => Math.abs(S.phi) >= Math.PI / 2, lesson: 'Off-centre loops rotate the body. Swimmers steer by choosing where in shape space they stroke.' },
  { n: 'Around the Rock', hinges: 2, start: [0, 0, 0], target: [5.4, -2.6], tr: .75, obstacles: [[3.4, -.2, .85]],
    story: 'Steer to the ring. A sand grain sits in the way, and you can\'t push through it. Tip: save a turning loop and a straight loop in slots <b>1</b>, <b>2</b>, <b>3</b> and switch with the keys.',
    goal: 'Reach the ring. Change your loop as often as you like.', test: S => S.reached, lesson: 'Steering is just switching between a turning loop and a swimming loop.' },
  { n: 'Slalom', hinges: 2, start: [0, 0, 0], target: [8, 0], tr: .75, obstacles: [[3.2, 1.35, .7], [5.8, -1.35, .7]],
    story: 'Weave between the grains.', goal: 'Reach the far ring.', test: S => S.reached, lesson: 'You\'re navigating with nothing but geometry.' },
  { n: 'Lazy Swimmer', hinges: 2, start: [0, 0, 0], line: 1.5, obstacles: [], budget: 28, init: 'square',
    story: 'Bacteria run on a tiny energy budget. Every stroke burns energy fighting the honey. Small loops are cheap but slow, and big loops travel further but cost more. Corners are expensive too: sharp turns in a stroke waste effort. You start with a square.',
    goal: 'Cross a line, in either direction, using no more than <b>28 units of energy</b>.', test: S => S.reached && S.energy <= L.budget, fail: S => S.energy > L.budget && !S.reached, lesson: 'The best stroke balances enclosed area against path length, like a cyclist choosing the right gear.' },
];
for (const l of LV) l.goalBase = l.goal;

// ================= state =================
const SAVE = RH.load('lowre', { done: {}, cur: 0 });
if (!Array.isArray(SAVE.slots)) SAVE.slots = [null, null, null];
const persist = () => { RH.save('lowre', SAVE); RH.progress('low-reynolds', Object.keys(SAVE.done).length / LV.length); };
// loop: closed polygon in shape space. seg: the pose sits on loop[seg]→loop[seg+1]. trans: a point the pose is first travelling to.
let L, sw, loop = [], seg = 0, trans = null, perim = 1, playing = true, speed = 3, trail = [], St, won = false, failed = false, asym = false, slotArm = false;
const $ = id => document.getElementById(id);

function load(i) {
  SAVE.cur = i; persist(); L = LV[i]; won = false; failed = false;
  sw = { x: L.start[0], y: L.start[1], phi: L.start[2], t1: 0, t2: 0 };
  trail = []; St = { cycles: 0, strokes: 0, reached: false, energy: 0, phi: 0, dist: 0, blocked: false };
  if (L.init) loop = presetLoop(L.init);
  else if (!loop.length || (L.hinges === 1 && loop.some(p => p[1] !== 0)) || (L.hinges === 2 && loop.every(p => p[1] === 0))) loop = presetLoop(L.hinges === 1 ? 'line' : 'circle');
  if (L.hinges === 1) asym = false;
  setLoop(loop, true); // a fresh start: nothing measured yet, so the pose may start on the loop
  $('title').textContent = L.n; $('story').innerHTML = L.story; renderGoal(); renderLevels();
  $('padT').innerHTML = L.hinges === 1 ? '<b>One hinge.</b> A scallop can only open and close. Drag left and right to set the stroke.' : '<b>Shape space.</b> Each point is a pose (two hinge angles). <b>Draw a loop</b>: the swimmer repeats it as its stroke.';
  $('asym').hidden = L.hinges !== 1; $('asym').classList.toggle('on', asym); $('slots').hidden = L.hinges === 1; $('slots').style.display = L.hinges === 1 ? 'none' : '';
  renderSlots();
  cam.x = sw.x + 1.2; cam.y = sw.y; layout();
}
const LIM = 1.45;
// The default circle runs clockwise on the pad, the direction that swims forward (towards +x).
function presetLoop(p) {
  const n = 64, one = L?.hinges === 1;
  if (p === 'circle') return Array.from({ length: n }, (_, i) => [1.15 * Math.cos(i / n * Math.PI * 2), one ? 0 : -1.15 * Math.sin(i / n * Math.PI * 2)]);
  if (p === 'square') { const a = 1.2, c = [[-a, a], [a, a], [a, -a], [-a, -a]], out = []; for (let s = 0; s < 4; s++) for (let k = 0; k < 16; k++) { const A = c[s], B = c[(s + 1) % 4]; out.push([A[0] + (B[0] - A[0]) * k / 16, one ? 0 : A[1] + (B[1] - A[1]) * k / 16]); } return out; }
  if (p === 'line') return Array.from({ length: n }, (_, i) => { const t = Math.sin(i / n * Math.PI * 2) * 1.2; return [t, one ? 0 : t]; });
}
function preset(p) { setLoop(presetLoop(p)); }
// Change the stroke. The pose never jumps: it travels in a straight line through shape space to the
// nearest point of the new loop, and that journey moves the body and costs energy like any other.
function setLoop(nl, snap = false) {
  loop = nl.map(p => [p[0], p[1]]); const n = loop.length; perim = 0;
  for (let i = 0; i < n; i++) { const A = loop[i], B = loop[(i + 1) % n]; perim += Math.hypot(B[0] - A[0], B[1] - A[1]); }
  perim = Math.max(perim, .05);
  if (snap) { sw.t1 = loop[0][0]; sw.t2 = loop[0][1]; seg = 0; trans = null; return; }
  let best = Infinity, bi = 0, bx = 0, by = 0;
  for (let i = 0; i < n; i++) {
    const A = loop[i], B = loop[(i + 1) % n], ex = B[0] - A[0], ey = B[1] - A[1], l2 = ex * ex + ey * ey;
    const f = l2 > 0 ? FX.clamp(((sw.t1 - A[0]) * ex + (sw.t2 - A[1]) * ey) / l2, 0, 1) : 0, px = A[0] + ex * f, py = A[1] + ey * f, d = Math.hypot(px - sw.t1, py - sw.t2);
    if (d < best - 1e-12) { best = d; bi = i; bx = px; by = py; }
  }
  seg = bi; trans = best > 1e-9 ? [bx, by] : null; St.blocked = false;
}

// ================= simulation step =================
// Fixed small steps along the shape path (independent of frame rate), midpoint rule for the body's rotation.
const DS = .004, ESCALE = 2;
let DSX = DS; // exposed for the step-size convergence test
function stepShape(dt1, dt2, rate) {
  const d = Math.hypot(dt1, dt2); if (d < 1e-12) return true;
  const m1 = sw.t1 + dt1 / 2, m2 = sw.t2 + dt2 / 2, nt1 = sw.t1 + dt1, nt2 = sw.t2 + dt2;
  let P = bodyVel(m1, m2, dt1, dt2), vx = BV[0], vy = BV[1], w = BV[2];
  let ph = sw.phi + w / 2, c = Math.cos(ph), s = Math.sin(ph);
  let nx = sw.x + c * vx - s * vy, ny = sw.y + s * vx + c * vy;
  if (hits(nx, ny, sw.phi + w, nt1, nt2)) {
    // Contact. The grain pushes on the touching point with whatever force stops it going in (and no more).
    // Solve the Stokes balance again with that extra force: drag + contact = 0, and the point slides along the grain.
    const px = HB[2 * hitI], py = HB[2 * hitI + 1], [ox, oy] = L.obstacles[hitO]; let wx = px - ox, wy = py - oy; const wl = Math.hypot(wx, wy) || 1; wx /= wl; wy /= wl;
    bodyVel(m1, m2, dt1, dt2); // restore shape arrays and the drag matrix at the midpoint
    const nbx = c * wx + s * wy, nby = -s * wx + c * wy;
    let rx, ry; // body-frame position of the touching point (an arm tip has its own index)
    if (hitI < NP) { rx = PRX[hitI]; ry = PRY[hitI]; }
    else if (hitI === NP) { const a = Math.PI + m1; rx = -Lm / 2 + Math.cos(a) * Ls; ry = Math.sin(a) * Ls; }
    else { const a = -m2; rx = Lm / 2 + Math.cos(a) * Ls; ry = Math.sin(a) * Ls; }
    const g0 = nbx, g1 = nby, g2 = -ry * nbx + rx * nby;
    const q0 = MI[0] * g0 + MI[1] * g1 + MI[2] * g2, q1 = MI[1] * g0 + MI[3] * g1 + MI[4] * g2, q2 = MI[2] * g0 + MI[4] * g1 + MI[5] * g2;
    // just enough push to bring the touching point back to the grain's surface
    const lam = (hitPen + 2e-4) / (g0 * q0 + g1 * q1 + g2 * q2);
    if (!(lam > 0)) return false;
    vx += lam * q0; vy += lam * q1; w += lam * q2; P = powerOf(vx, vy, w, dt1, dt2);
    ph = sw.phi + w / 2; c = Math.cos(ph); s = Math.sin(ph); nx = sw.x + c * vx - s * vy; ny = sw.y + s * vx + c * vy;
    if (hits(nx, ny, sw.phi + w, nt1, nt2)) return false;
    St.contact = 1;
  }
  sw.x = nx; sw.y = ny; sw.phi += w; sw.t1 = nt1; sw.t2 = nt2; St.phi += w;
