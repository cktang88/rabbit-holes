<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Low Reynolds</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;overflow:hidden;background:#041512;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;color:#e4fff6}
  #cv{position:fixed;inset:0;width:100%;height:100%}
  .chip{position:fixed;background:rgba(6,32,28,.6);backdrop-filter:blur(14px);border:1px solid rgba(120,255,210,.12);border-radius:18px;box-shadow:0 16px 40px -18px rgba(0,0,0,.8)}
  #hud{top:16px;left:16px;padding:14px 18px;width:340px}
  #hud .home{color:#7fb8a6;font-size:12px;text-decoration:none}

  #goal{margin-top:10px;padding:9px 12px;border-radius:12px;background:rgba(120,255,210,.07);border:1px solid rgba(120,255,210,.2);font-size:13px}
  #goal.ok{border-color:#5fd38d;background:rgba(95,211,141,.12)}
  #padBox{right:16px;bottom:16px;padding:12px;width:272px}
  #pad{width:248px;height:248px;border-radius:12px;display:block;cursor:crosshair;touch-action:none}
  #padBox .t{font-size:12px;color:#9fd8c6;margin-bottom:6px;line-height:1.4}
  .row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .b{border:0;background:rgba(255,255,255,.08);color:#e4fff6;font:inherit;font-size:12px;border-radius:9px;padding:6px 10px;cursor:pointer}
  .b.on{background:#7dffd0;color:#032018;font-weight:700}
  #levels{top:16px;right:16px;padding:8px;width:220px}
  #levels h4{margin:4px 8px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#7fb8a6}
  .lv{padding:6px 10px;border-radius:9px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between}
  .lv:hover{background:rgba(255,255,255,.06)} .lv.cur{background:rgba(125,255,208,.18)} .lv.lock{opacity:.3;pointer-events:none}
  #stat{bottom:16px;left:16px;padding:12px 16px;font-size:13px;line-height:1.6;color:#b9e8d8;font-variant-numeric:tabular-nums}
  #stat b{color:#fff}
  #toast{position:fixed;top:40%;left:46%;transform:translate(-50%,-50%) scale(.85);opacity:0;font-size:42px;font-weight:700;letter-spacing:-.02em;pointer-events:none;transition:opacity .35s,transform .6s cubic-bezier(.3,1.6,.5,1);text-align:center;text-shadow:0 6px 40px rgba(0,0,0,.8);max-width:640px}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast small{display:block;font-size:16px;font-weight:400;color:#b9e8d8;margin-top:8px;line-height:1.5}
  @media (max-width:860px){#levels{display:none}#hud{width:calc(100vw - 32px)}#pad{width:180px;height:180px}#padBox{width:204px}#stat{bottom:auto;top:250px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip"><a class="home" href="../index.html">← Rabbit Holes</a><h1 id="title">Low Reynolds</h1><div id="story"></div><div id="goal"></div></div>
<div id="levels" class="chip"></div>
<div id="padBox" class="chip"><div class="t" id="padT"><b>Shape space.</b> Each point is a pose (two hinge angles). <b>Draw a loop</b>: the swimmer repeats it as its stroke.</div><canvas id="pad"></canvas>
  <div class="row"><button class="b" data-p="circle">◯ circle</button><button class="b" data-p="square">◻ square</button><button class="b" data-p="line">⟷ back &amp; forth</button><button class="b" id="rev">↺ reverse</button></div>
  <div class="row"><button class="b" id="play">⏸</button><button class="b" data-s="1">1×</button><button class="b on" data-s="3">3×</button><button class="b" data-s="8">8×</button><button class="b" id="reset">Reset</button></div></div>
<div id="stat" class="chip"></div>
<div id="toast"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
// ================= physics: Purcell's three-link swimmer in resistive-force theory =================
// No inertia: at every instant drag forces and torques on the body sum to exactly zero.
// Drag on a slender segment is twice as strong sideways as lengthways (ξ⊥ = 2ξ∥), and that asymmetry is what lets it swim at all.
const XP = 1, XN = 2, SEG = 8, Lm = 1, Ls = 1;
function points(t1, t2, P = []) {
  let n = 0;
  const put = (x, y, tx, ty, ds) => { const p = P[n] || (P[n] = { r: [0, 0], t: [0, 0], ds: 0 }); p.r[0] = x; p.r[1] = y; p.t[0] = tx; p.t[1] = ty; p.ds = ds; n++; };
  for (let i = 0; i < SEG; i++) put(-Lm / 2 + (i + .5) * Lm / SEG, 0, 1, 0, Lm / SEG);
  const a1 = Math.PI + t1, a2 = -t2;
  for (let i = 0; i < SEG; i++) { const s = (i + .5) * Ls / SEG; put(-Lm / 2 + Math.cos(a1) * s, Math.sin(a1) * s, Math.cos(a1), Math.sin(a1), Ls / SEG); }
  for (let i = 0; i < SEG; i++) { const s = (i + .5) * Ls / SEG; put(Lm / 2 + Math.cos(a2) * s, Math.sin(a2) * s, Math.cos(a2), Math.sin(a2), Ls / SEG); }
  return P;
}
function ft(P, vel) { let Fx = 0, Fy = 0, T = 0; for (let i = 0; i < P.length; i++) { const p = P[i], [vx, vy] = vel(i), vt = vx * p.t[0] + vy * p.t[1], px = vt * p.t[0], py = vt * p.t[1], fx = -(XP * px + XN * (vx - px)) * p.ds, fy = -(XP * py + XN * (vy - py)) * p.ds; Fx += fx; Fy += fy; T += p.r[0] * fy - p.r[1] * fx; } return [Fx, Fy, T]; }
const PA = [], PB = [], PC = [];
let power = 0;
function bodyVel(t1, t2, d1, d2) {
  const P = points(t1, t2, PA), h = 1e-5, P1 = points(t1 + h, t2, PB), P2 = points(t1, t2 + h, PC);
  const J = i => [(P1[i].r[0] - P[i].r[0]) / h * d1 + (P2[i].r[0] - P[i].r[0]) / h * d2, (P1[i].r[1] - P[i].r[1]) / h * d1 + (P2[i].r[1] - P[i].r[1]) / h * d2];
  const c0 = ft(P, () => [1, 0]), c1 = ft(P, () => [0, 1]), c2 = ft(P, i => [-P[i].r[1], P[i].r[0]]), b = ft(P, J).map(x => -x);
  const A = [[c0[0], c1[0], c2[0]], [c0[1], c1[1], c2[1]], [c0[2], c1[2], c2[2]]];
  const det = m => m[0][0] * (m[1][1] * m[2][2] - m[1][2] * m[2][1]) - m[0][1] * (m[1][0] * m[2][2] - m[1][2] * m[2][0]) + m[0][2] * (m[1][0] * m[2][1] - m[1][1] * m[2][0]);
  const D = det(A), x = [0, 1, 2].map(j => det(A.map((row, r) => row.map((v, c) => c === j ? b[r] : v))) / D);
  // energy dissipated = work done against drag by the moving body (for the efficiency level)
  let w = 0; for (let i = 0; i < P.length; i++) { const [jx, jy] = J(i), vx = x[0] - x[2] * P[i].r[1] + jx, vy = x[1] + x[2] * P[i].r[0] + jy, vt = vx * P[i].t[0] + vy * P[i].t[1]; w += (XP * vt * vt + XN * (vx * vx + vy * vy - vt * vt)) * P[i].ds; }
  power = w;
  return x;
}

// ================= levels =================
const LV = [
  { n: 'The Scallop', hinges: 1, start: [0, 0, 0], line: 2.5, obstacles: [],
    story: 'You are a bacterium. At your size water is like <b>honey</b>: stop moving and you stop dead, with no gliding. You have <b>one hinge</b>, like a scallop. Swing it fast, swing it slow: try to swim to the ring.',
    goal: 'Try to cross the line. Do 8 strokes with any stroke you like.', test: S => S.cycles >= 8, lesson: '<b>The scallop theorem.</b> With one hinge, every stroke runs backwards over exactly the path it came. In honey, undoing a stroke undoes the motion. Speed doesn\'t matter: you can\'t swim. (E. M. Purcell, 1976)' },
  { n: 'Two Hinges', hinges: 2, start: [0, 0, 0], line: 2.5, obstacles: [],
    story: 'Purcell\'s fix: <b>two hinges</b>. Now a stroke can trace a <b>loop</b> in shape space, going out one way and coming back another. That is a stroke time can\'t simply rewind.',
    goal: 'Cross the line 2.5 body lengths ahead.', test: S => S.reached, lesson: 'Net motion comes from the <b>area</b> your loop encloses. A back-and-forth line has no area and goes nowhere.' },
  { n: 'Reverse Gear', hinges: 2, start: [0, 0, 0], line: -2.5, obstacles: [],
    story: 'The line is behind you. Swimmers can\'t turn their heads round, but they can run the stroke the other way.',
    goal: 'Cross the line behind you.', test: S => S.reached, lesson: 'Running the loop clockwise instead of anticlockwise reverses the motion. The direction is in the stroke itself.' },
  { n: 'Nine Strokes', hinges: 2, start: [0, 0, 0], line: 2, maxCycles: 9, obstacles: [],
    story: 'The colours under shape space are a map. For an anticlockwise loop, green regions push you forward and pink regions push you back, for every bit of area the loop encloses there. A clockwise loop swaps them. <b>Big loops over the bright patches go furthest.</b>',
    goal: 'Cross the line in <b>9 strokes or fewer</b>, in either direction. Reset to try again.', test: S => S.reached && S.cycles <= 9, fail: S => S.cycles > 9 && !S.reached, lesson: 'Displacement ≈ area × field strength. Mathematicians call this the <b>geometric phase</b>: the same maths as Foucault\'s pendulum and a falling cat righting itself.' },
  { n: 'About Turn', hinges: 2, start: [0, 0, 0], target: null, turn: Math.PI / 2, obstacles: [],
    story: 'A loop centred on the middle of shape space swims straight. Push the loop off into a <b>corner</b> and the swimmer starts to <b>turn</b>.',
    goal: 'Turn the swimmer at least 90°.', test: S => Math.abs(S.phi) >= Math.PI / 2, lesson: 'Off-centre loops rotate the body. Swimmers steer by choosing where in shape space they stroke.' },
  { n: 'Around the Rock', hinges: 2, start: [0, 0, 0], target: [5.4, -2.6], tr: .75, obstacles: [[3.4, -.2, .85]],
    story: 'Steer to the ring. A sand grain sits in the way, and you can\'t push through it.',
    goal: 'Reach the ring. Change your loop as often as you like.', test: S => S.reached, lesson: 'Steering is just switching between a turning loop and a swimming loop.' },
  { n: 'Slalom', hinges: 2, start: [0, 0, 0], target: [8, 0], tr: .75, obstacles: [[3.2, 1.35, .7], [5.8, -1.35, .7]],
    story: 'Weave between the grains.', goal: 'Reach the far ring.', test: S => S.reached, lesson: 'You\'re navigating with nothing but geometry.' },
  { n: 'Lazy Swimmer', hinges: 2, start: [0, 0, 0], line: 1.5, obstacles: [], budget: 24,
    story: 'Bacteria run on a tiny energy budget. Every stroke burns energy fighting the honey. Small loops are cheap but slow, and big loops travel further but cost more.',
    goal: 'Cross the line, in either direction, using no more than <b>24 units of energy</b>.', test: S => S.reached && S.energy <= 40, fail: S => S.energy > 40 && !S.reached, lesson: 'The best stroke balances enclosed area against path length, like a cyclist choosing the right gear.' },
];

// ================= state =================
const SAVE = RH.load('lowre', { done: {}, cur: 0 });
const persist = () => { RH.save('lowre', SAVE); RH.progress('low-reynolds', Object.keys(SAVE.done).length / LV.length); };
let L, sw, loop = [], loopPos = 0, playing = true, speed = 3, trail = [], St, won = false, failed = false;
const $ = id => document.getElementById(id);

function load(i) {
  SAVE.cur = i; persist(); L = LV[i]; won = false; failed = false;
  sw = { x: L.start[0], y: L.start[1], phi: L.start[2], t1: 0, t2: 0 };
  trail = []; St = { cycles: 0, reached: false, energy: 0, phi: 0, dist: 0 };
  if (!loop.length || (L.hinges === 1 && loop.some(p => p[1] !== 0)) || (L.hinges === 2 && loop.every(p => p[1] === 0))) preset(L.hinges === 1 ? 'line' : 'circle');
  loopPos = 0; heat = null;
  $('title').textContent = L.n; $('story').innerHTML = L.story; renderGoal(); renderLevels();
  $('padT').innerHTML = L.hinges === 1 ? '<b>One hinge.</b> A scallop can only open and close. Drag left and right to set the stroke.' : '<b>Shape space.</b> Each point is a pose (two hinge angles). <b>Draw a loop</b>: the swimmer repeats it as its stroke.';
  cam.x = sw.x + 1.2; cam.y = sw.y;
}
const LIM = 1.45;
function preset(p) {
  const n = 64;
  if (p === 'circle') loop = Array.from({ length: n }, (_, i) => [1.15 * Math.cos(i / n * Math.PI * 2), (L?.hinges === 1 ? 0 : 1.15) * Math.sin(i / n * Math.PI * 2)]);
  if (p === 'square') { const a = 1.2, c = [[-a, -a], [a, -a], [a, a], [-a, a]]; loop = []; for (let s = 0; s < 4; s++) for (let k = 0; k < 16; k++) { const A = c[s], B = c[(s + 1) % 4]; loop.push([A[0] + (B[0] - A[0]) * k / 16, (L?.hinges === 1 ? 0 : A[1] + (B[1] - A[1]) * k / 16)]); } }
  if (p === 'line') loop = Array.from({ length: n }, (_, i) => { const t = Math.sin(i / n * Math.PI * 2) * 1.2; return [t, L?.hinges === 1 ? 0 : t]; });
  loopPos = 0;
}

// ================= simulation step =================
function advance(ds) { // move along the stroke loop by ds radians of shape-space path
  if (loop.length < 2) return;
  let left = ds;
  while (left > 0) {
    const i = Math.floor(loopPos) % loop.length, f = loopPos - Math.floor(loopPos), A = loop[i], B = loop[(i + 1) % loop.length];
    const segLen = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1e-6, rem = (1 - f) * segLen, d = Math.min(left, rem, .02), df = d / segLen;
    const t1 = A[0] + (B[0] - A[0]) * (f + df / 2), t2 = A[1] + (B[1] - A[1]) * (f + df / 2);
    const [vx, vy, w] = bodyVel(t1, t2, (B[0] - A[0]) * df, (B[1] - A[1]) * df);
    const c = Math.cos(sw.phi), s = Math.sin(sw.phi), nx = sw.x + c * vx - s * vy, ny = sw.y + s * vx + c * vy, nphi = sw.phi + w;
    if (!hits(nx, ny, nphi, t1, t2)) { sw.x = nx; sw.y = ny; sw.phi = nphi; St.phi += w; }
    sw.t1 = t1; sw.t2 = t2; St.energy += power * 100;
    loopPos += df; left -= d;
    if (loopPos >= loop.length) { loopPos -= loop.length; St.cycles++; FX.sfx('chime', St.cycles); }
  }
}
function bodyPts(x, y, phi, t1, t2) { const c = Math.cos(phi), s = Math.sin(phi); return points(t1, t2, []).map(p => [x + c * p.r[0] - s * p.r[1], y + s * p.r[0] + c * p.r[1]]); }
function hits(x, y, phi, t1, t2) { if (!L.obstacles.length) return false; const P = bodyPts(x, y, phi, t1, t2); return L.obstacles.some(([ox, oy, r]) => P.some(([px, py]) => Math.hypot(px - ox, py - oy) < r + .06)); }

// ================= shape-space field (where loops push you) =================
let heat = null;
function buildHeat(w, h) {
  const c = document.createElement('canvas'); c.width = 48; c.height = 48; const g = c.getContext('2d'), im = g.createImageData(48, 48);
  const hh = .05, vals = [];
  for (let j = 0; j < 48; j++) for (let i = 0; i < 48; i++) {
    const a = -LIM + (i + .5) / 48 * 2 * LIM, b = LIM - (j + .5) / 48 * 2 * LIM;
    // forward displacement from a tiny counter-clockwise square loop around (a, b), divided by its area
    let X = 0; const sq = [[a - hh, b - hh], [a + hh, b - hh], [a + hh, b + hh], [a - hh, b + hh]];
    for (let k = 0; k < 4; k++) { const [p1, p2] = sq[k], [q1, q2] = sq[(k + 1) % 4]; const v = bodyVel((p1 + q1) / 2, (p2 + q2) / 2, q1 - p1, q2 - p2); X += v[0]; }
    vals.push(X / (4 * hh * hh));
  }
  const mx = Math.max(...vals.map(Math.abs));
  vals.forEach((v, n) => { const x = v / mx, o = n * 4; if (x > 0) { im.data[o] = 30 + 60 * x; im.data[o + 1] = 70 + 160 * x; im.data[o + 2] = 70 + 90 * x; } else { im.data[o] = 70 - 160 * x; im.data[o + 1] = 40 + 20 * -x; im.data[o + 2] = 80 + 90 * -x; } im.data[o + 3] = 255; });
  g.putImageData(im, 0, 0); return c;
}

// ================= input: drawing loops =================
const pad = $('pad'), pg = pad.getContext('2d'); let pd = 1, drawing = null;
const padTo = e => { const r = pad.getBoundingClientRect(); return [FX.clamp(((e.clientX - r.left) / r.width * 2 - 1) * LIM, -LIM, LIM), L.hinges === 1 ? 0 : FX.clamp((1 - (e.clientY - r.top) / r.height * 2) * LIM, -LIM, LIM)]; };
pad.addEventListener('pointerdown', e => { drawing = [padTo(e)]; pad.setPointerCapture(e.pointerId); FX.sfx('tick'); });
pad.addEventListener('pointermove', e => { if (!drawing) return; const p = padTo(e), q = drawing[drawing.length - 1]; if (Math.hypot(p[0] - q[0], p[1] - q[1]) > .04) drawing.push(p); });
pad.addEventListener('pointerup', () => {
  if (!drawing) return;
  if (drawing.length > 3) {
    if (L.hinges === 1) { const xs = drawing.map(p => p[0]), lo = Math.min(...xs), hi = Math.max(...xs); loop = Array.from({ length: 48 }, (_, i) => [lo + (hi - lo) * (.5 - .5 * Math.cos(i / 48 * Math.PI * 2)), 0]); }
    else loop = resample(drawing, 64);
    loopPos = 0; FX.sfx('place');
  }
  drawing = null;
});
function resample(pts, n) { const d = [0]; for (let i = 1; i <= pts.length; i++) { const a = pts[i - 1], b = pts[i % pts.length]; d.push(d[i - 1] + Math.hypot(b[0] - a[0], b[1] - a[1])); } const tot = d[d.length - 1], out = []; let j = 0; for (let k = 0; k < n; k++) { const t = k / n * tot; while (d[j + 1] < t) j++; const a = pts[j], b = pts[(j + 1) % pts.length], f = (t - d[j]) / Math.max(1e-9, d[j + 1] - d[j]); out.push([a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f]); } return out; }
document.querySelectorAll('[data-p]').forEach(b => b.onclick = () => { preset(b.dataset.p); FX.sfx('click'); });
$('rev').onclick = () => { loop.reverse(); loopPos = 0; FX.sfx('whoosh'); };
$('play').onclick = () => { playing = !playing; $('play').textContent = playing ? '⏸' : '▶'; FX.sfx('click'); };
document.querySelectorAll('[data-s]').forEach(b => b.onclick = () => { speed = +b.dataset.s; document.querySelectorAll('[data-s]').forEach(x => x.classList.toggle('on', x === b)); FX.sfx('click'); });
$('reset').onclick = () => { load(SAVE.cur); FX.sfx('pop'); };

// ================= rendering =================
const cv = $('cv'), g = cv.getContext('2d'); let W = 1, H = 1, dpr = 1;
const cam = { x: 0, y: 0, z: 110 };
function resize() { dpr = FX.fit(cv); W = cv.width; H = cv.height; }
addEventListener('resize', resize); resize();
const motes = Array.from({ length: 220 }, () => ({ x: (Math.random() - .5) * 30, y: (Math.random() - .5) * 20, r: Math.random(), vx: 0, vy: 0 }));
const toS = (x, y) => [W / 2 + (x - cam.x) * cam.z * dpr, H / 2 + (y - cam.y) * cam.z * dpr];
function render(now) {
  g.setTransform(1, 0, 0, 1, 0, 0);
  const bg = g.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, Math.max(W, H) * .65); bg.addColorStop(0, '#0d3a31'); bg.addColorStop(.7, '#062320'); bg.addColorStop(1, '#020b09'); g.fillStyle = bg; g.fillRect(0, 0, W, H);
  // micrometre grid
  g.strokeStyle = 'rgba(160,255,220,.05)'; g.lineWidth = dpr; const z = cam.z * dpr;
  for (let gx = Math.floor(cam.x - W / z / 2); gx <= cam.x + W / z / 2; gx += .5) { const [x] = toS(gx, 0); g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); }
  for (let gy = Math.floor(cam.y - H / z / 2); gy <= cam.y + H / z / 2; gy += .5) { const [, y] = toS(0, gy); g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
  // Brownian motes: the jiggling that every microbe lives with
  for (const m of motes) { m.vx = m.vx * .9 + (Math.random() - .5) * .004; m.vy = m.vy * .9 + (Math.random() - .5) * .004; m.x += m.vx; m.y += m.vy; if (Math.abs(m.x - cam.x) > 15) m.x = cam.x + (Math.random() - .5) * 28; if (Math.abs(m.y - cam.y) > 10) m.y = cam.y + (Math.random() - .5) * 18; const [x, y] = toS(m.x, m.y); g.fillStyle = `rgba(180,255,230,${.06 + m.r * .12})`; g.beginPath(); g.arc(x, y, (1 + m.r * 2.5) * dpr, 0, 7); g.fill(); }
  // obstacles: sand grains
  for (const [ox, oy, r] of L.obstacles) { const [x, y] = toS(ox, oy), gr = g.createRadialGradient(x - r * z * .3, y - r * z * .3, 0, x, y, r * z); gr.addColorStop(0, '#d9c8a2'); gr.addColorStop(1, '#6b5a3c'); g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * z, 0, 7); g.fill(); }
  // target
  if (L.target) { const [x, y] = toS(...L.target), pulse = (L.tr || .45) / .45 * (1 + .08 * Math.sin(now / 300)); g.strokeStyle = St.reached ? '#5fd38d' : '#ffd27a'; g.lineWidth = 3 * dpr; g.shadowColor = g.strokeStyle; g.shadowBlur = 18 * dpr; g.beginPath(); g.arc(x, y, .45 * z * pulse, 0, 7); g.stroke(); g.shadowBlur = 0; }
  if (L.line != null) { for (const lx of (L.maxCycles || L.budget) ? [L.line, -L.line] : [L.line]) { const [x] = toS(lx, 0); g.strokeStyle = St.reached ? '#5fd38d' : '#ffd27a'; g.lineWidth = 3 * dpr; g.setLineDash([10 * dpr, 10 * dpr]); g.shadowColor = g.strokeStyle; g.shadowBlur = 14 * dpr; g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke(); g.setLineDash([]); g.shadowBlur = 0; } }
  if (L.turn) { const [x, y] = toS(sw.x, sw.y); g.strokeStyle = 'rgba(255,210,122,.6)'; g.lineWidth = 3 * dpr; g.setLineDash([6 * dpr, 6 * dpr]); g.beginPath(); g.arc(x, y, 1.9 * z, -Math.PI / 2 - .3, -Math.PI / 2 + .3); g.stroke(); g.setLineDash([]); g.beginPath(); g.arc(x, y, 1.9 * z, 0, St.phi, St.phi < 0); g.strokeStyle = '#7dffd0'; g.stroke(); }
  // trail
  g.strokeStyle = 'rgba(125,255,208,.25)'; g.lineWidth = 2 * dpr; g.beginPath(); trail.forEach(([tx, ty], i) => { const [x, y] = toS(tx, ty); i ? g.lineTo(x, y) : g.moveTo(x, y); }); g.stroke();
  // swimmer: three glowing links
  const c = Math.cos(sw.phi), s = Math.sin(sw.phi), T = (lx, ly) => toS(sw.x + c * lx - s * ly, sw.y + s * lx + c * ly);
  const a1 = Math.PI + sw.t1, a2 = -sw.t2, J1 = [-Lm / 2, 0], J2 = [Lm / 2, 0], E1 = [J1[0] + Math.cos(a1) * Ls, Math.sin(a1) * Ls], E2 = [J2[0] + Math.cos(a2) * Ls, Math.sin(a2) * Ls];
  g.lineCap = 'round'; g.lineJoin = 'round';
  for (const [w, col, blur] of [[26, 'rgba(125,255,208,.18)', 30], [14, '#7dffd0', 12], [5, '#e9fff7', 0]]) {
    g.strokeStyle = col; g.lineWidth = w * dpr * cam.z / 110; g.shadowColor = '#7dffd0'; g.shadowBlur = blur * dpr;
    g.beginPath(); g.moveTo(...T(...E1)); g.lineTo(...T(...J1)); g.lineTo(...T(...J2)); g.lineTo(...T(...E2)); g.stroke();
  }
  g.shadowBlur = 0; for (const J of [J1, J2]) { const [x, y] = T(...J); g.fillStyle = '#032018'; g.beginPath(); g.arc(x, y, 3.5 * dpr, 0, 7); g.fill(); }
  // head marker: which way is "forward"
  const [hx, hy] = T(.15, 0); g.fillStyle = '#ffd27a'; g.beginPath(); g.arc(hx, hy, 3 * dpr, 0, 7); g.fill();
  // microscope vignette
  const vg = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .38, W / 2, H / 2, Math.max(W, H) * .72); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.75)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);
  particles.update(1 / 60); particles.draw(g);
}
const particles = FX.particles();
function renderPad() {
  pd = FX.fit(pad); const w = pad.width, h = pad.height;
  if (!heat) heat = buildHeat(w, h);
  pg.imageSmoothingEnabled = true; pg.drawImage(heat, 0, 0, w, h);
  if (L.hinges === 1) { pg.fillStyle = 'rgba(2,11,9,.75)'; pg.fillRect(0, 0, w, h / 2 - 10 * pd); pg.fillRect(0, h / 2 + 10 * pd, w, h / 2 - 10 * pd); }
  pg.strokeStyle = 'rgba(255,255,255,.18)'; pg.lineWidth = pd; pg.beginPath(); pg.moveTo(w / 2, 0); pg.lineTo(w / 2, h); pg.moveTo(0, h / 2); pg.lineTo(w, h / 2); pg.stroke();
  const P = ([a, b]) => [(a / LIM + 1) / 2 * w, (1 - b / LIM) / 2 * h];
  const path = drawing || loop;
  pg.strokeStyle = '#fff'; pg.lineWidth = 2.5 * pd; pg.shadowColor = '#7dffd0'; pg.shadowBlur = 8 * pd; pg.beginPath(); path.forEach((p, i) => { const [x, y] = P(p); i ? pg.lineTo(x, y) : pg.moveTo(x, y); }); if (!drawing) pg.closePath(); pg.stroke(); pg.shadowBlur = 0;
  // direction arrows along the loop
  if (!drawing && loop.length > 8) for (let k = 0; k < 4; k++) { const i = (k * loop.length / 4) | 0, [x1, y1] = P(loop[i]), [x2, y2] = P(loop[(i + 2) % loop.length]), a = Math.atan2(y2 - y1, x2 - x1); pg.save(); pg.translate(x1, y1); pg.rotate(a); pg.fillStyle = '#fff'; pg.beginPath(); pg.moveTo(7 * pd, 0); pg.lineTo(-4 * pd, -5 * pd); pg.lineTo(-4 * pd, 5 * pd); pg.fill(); pg.restore(); }
  const [cx, cy] = P([sw.t1, sw.t2]); pg.fillStyle = '#ffd27a'; pg.beginPath(); pg.arc(cx, cy, 5 * pd, 0, 7); pg.fill();
  pg.fillStyle = 'rgba(255,255,255,.55)'; pg.font = `${10 * pd}px Space Grotesk`; pg.fillText('back hinge →', 6 * pd, h - 6 * pd); if (L.hinges === 2) { pg.save(); pg.translate(12 * pd, h * .62); pg.rotate(-Math.PI / 2); pg.fillText('front hinge →', 0, 0); pg.restore(); }
}

// ================= UI & loop =================
function renderGoal() { const ok = SAVE.done[SAVE.cur]; $('goal').className = ok ? 'ok' : ''; $('goal').innerHTML = (ok ? '✓ ' : '🎯 ') + L.goal; }
function renderLevels() {
  const maxOpen = (() => { let m = 0; while (m < LV.length - 1 && SAVE.done[m]) m++; return m; })();
  $('levels').innerHTML = '<h4>Pond samples</h4>' + LV.map((l, i) => `<div class="lv ${i === SAVE.cur ? 'cur' : ''} ${i > maxOpen && !SAVE.done[i] ? 'lock' : ''}" data-i="${i}"><span>${i + 1}. ${l.n}</span><span>${SAVE.done[i] ? '✓' : ''}</span></div>`).join('');
  $('levels').querySelectorAll('.lv').forEach(el => el.onclick = () => { FX.sfx('click'); load(+el.dataset.i); });
}
function toast(big, small, ms = 7000) { const t = $('toast'); t.innerHTML = big + (small ? `<small>${small}</small>` : ''); t.classList.add('on'); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove('on'), ms); }
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (playing && !won && !failed) {
    const ds = dt * 2.2 * speed; const sub = Math.ceil(ds / .1); for (let i = 0; i < sub; i++) advance(ds / sub);
    if (!trail.length || Math.hypot(trail[trail.length - 1][0] - sw.x, trail[trail.length - 1][1] - sw.y) > .02) trail.push([sw.x, sw.y]); if (trail.length > 1500) trail.shift();
  }
  if (L.target) St.reached = Math.hypot(sw.x - L.target[0], sw.y - L.target[1]) < (L.tr || .45);
  if (L.line != null) St.reached = L.maxCycles || L.budget ? Math.abs(sw.x - L.start[0]) >= Math.abs(L.line) : (L.line > 0 ? sw.x >= L.line : sw.x <= L.line);
  St.dist = sw.x - L.start[0];
  cam.x = FX.damp(cam.x, sw.x + (L.target ? (L.target[0] - sw.x) * .3 : L.line && !L.maxCycles && !L.budget ? (L.line - sw.x) * .3 : 0), 2, dt); cam.y = FX.damp(cam.y, sw.y, 2, dt);
  if (!won && L.test(St)) { won = true; SAVE.done[SAVE.cur] = 1; persist(); FX.sfx('win'); FX.shake(.25); particles.burst(W / 2, H / 2, { n: 120, color: ['#7dffd0', '#ffffff', '#ffd27a'], speed: 480 * dpr, life: 1.1 }); toast('✓ ' + L.n, L.lesson); renderGoal(); renderLevels(); }
  if (!won && !failed && L.fail && L.fail(St)) { failed = true; FX.sfx('fail'); toast('Out of ' + (L.budget ? 'energy' : 'strokes'), 'Press Reset and try a different loop.', 3500); }
  $('stat').innerHTML = `strokes <b>${St.cycles}</b>${L.maxCycles ? ` / ${L.maxCycles}` : ''} · moved <b>${St.dist.toFixed(2)}</b> body lengths<br>turned <b>${(St.phi * 180 / Math.PI).toFixed(0)}°</b>${L.budget ? ` · energy <b style="color:${St.energy > L.budget ? '#ff7a7a' : '#fff'}">${St.energy.toFixed(1)}</b> / ${L.budget}` : ''}`;
  render(now); renderPad();
}
load(Math.min(SAVE.cur || 0, LV.length - 1));
requestAnimationFrame(frame);
window.__lr = { LV, load, preset, advance, setLoop: l => { loop = l; loopPos = 0; }, St: () => St, sw: () => sw, get loop() { return loop; } };
</script>
