<style>

  :root{--ink:#1d1a14;--dim:#5d5440;--brass:linear-gradient(150deg,#f3d98a,#c49a3e 45%,#8d6a22 62%,#ddbb63);--blue:#1b2f66;--bad:#a3281c;--good:#2f6b3a;
    font-family:"EB Garamond",Garamond,Georgia,serif;font-size:16px}
  html,body{background:#142824;height:100%}
  body{margin:0;display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;color:#f1e8d0;background:radial-gradient(ellipse at 50% 20%,#2f5a50,#1c352f 70%,#142824)}
  .topbar{background:linear-gradient(#2a4686,#14275a);border-bottom:3px solid #0b1638;box-shadow:0 3px 8px #0008;color:#f1e8d0;gap:10px;padding:5px 12px;flex-wrap:nowrap;min-width:0}

<script>
'use strict';
// ================= the plate: geometry and kinematics =================
// Every wheel has the same tooth size, so a wheel's pitch radius is half its tooth count (plate units).
// Two wheels mesh when their centres are the sum of their radii apart (within a small depthing tolerance),
// and only if they sit at the same depth in the movement. The second wheel on an arbor sits one level deeper.
const rad = T => T / 2, TOL = .4, DAY = 86400, HOUR = 3600, YEAR = 365.2422 * DAY;
const gcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
const red = (p, q) => { const g = gcd(p, q) || 1n; return q < 0n ? [-p / g, -q / g] : [p / g, q / g]; };
const D2 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
function circleX(p, r1, q, r2) { // intersections of two circles
  const d = D2(p, q); if (d < 1e-9 || d > r1 + r2 + 1e-9 || d < Math.abs(r1 - r2) - 1e-9) return [];
  const a = (r1 * r1 - r2 * r2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, r1 * r1 - a * a)), mx = p[0] + a * (q[0] - p[0]) / d, my = p[1] + a * (q[1] - p[1]) / d;
  return [[mx + h * (q[1] - p[1]) / d, my - h * (q[0] - p[0]) / d], [mx - h * (q[1] - p[1]) / d, my + h * (q[0] - p[0]) / d]];
}
// A design: ax[0] is the motor, ax[1..H] the hand arbors (fixed), the rest are arbors the player hung.
// Hung arbor: { g: [teeth…], p: [parent, parentGear, myGear], a: angle, lk: [arbor, gear, myGear] | null }
const fixedN = com => 1 + com.hands.length;
function layout(com, d) {
  const P = [];
  d.ax.forEach((A, i) => {
    if (i === 0) P[i] = [com.motor.x, com.motor.y];
    else if (i < fixedN(com)) P[i] = [com.hands[i - 1].x, com.hands[i - 1].y];
    else {
      const pa = P[A.p[0]], par = d.ax[A.p[0]], rho = rad(par.g[A.p[1]]) + rad(A.g[A.p[2]]);
      if (A.lk && A.lk[0] < i && d.ax[A.lk[0]] && d.ax[A.lk[0]].g[A.lk[1]] && A.g[A.lk[2]]) {
        const sols = circleX(pa, rho, P[A.lk[0]], rad(d.ax[A.lk[0]].g[A.lk[1]]) + rad(A.g[A.lk[2]]));
        if (sols.length) { const an = sols.map(s => Math.atan2(s[1] - pa[1], s[0] - pa[0])), df = x => Math.abs(Math.atan2(Math.sin(x - A.a), Math.cos(x - A.a)));
          A.a = df(an[0]) <= df(an[1]) ? an[0] : an[1]; }
      }
      P[i] = [pa[0] + rho * Math.cos(A.a), pa[1] + rho * Math.sin(A.a)];
    }
  });
  return P;
}
// Run the movement: which arbors turn, how fast (exact rationals), at what depth each wheel sits, and what is wrong.
function solve(com, d) {
  const P = layout(com, d), n = d.ax.length, sp = Array(n).fill(null), rat = Array(n).fill(null), dep = d.ax.map(A => A.g.map(() => null));
  const meshes = [], jams = [], probs = [];
  if (d.ax[0].g.length) { sp[0] = 1; rat[0] = [1n, 1n]; d.ax[0].g.forEach((_, j) => dep[0][j] = j); }
  const Q = sp[0] != null ? [0] : [];
  while (Q.length) {
    const a = Q.shift(), A = d.ax[a];
    // a wheel hung on one of this arbor's wheels sits at that wheel's level (the player's intent wins over a lookalike)
    d.ax.forEach((B, b) => { if (!B.p || B.p[0] !== a || sp[b] != null || dep[a][B.p[1]] == null) return; const ta = A.g[B.p[1]], tb = B.g[B.p[2]];
      if (Math.abs(D2(P[a], P[b]) - rad(ta) - rad(tb)) > TOL) return;
      sp[b] = -sp[a] * ta / tb; rat[b] = red(-rat[a][0] * BigInt(ta), rat[a][1] * BigInt(tb)); dep[b][B.p[2]] = dep[a][B.p[1]]; B.g.forEach((_, k) => { if (k !== B.p[2]) dep[b][k] = dep[a][B.p[1]] + 1; }); Q.push(b); meshes.push([a, B.p[1], b, B.p[2]]); });
    A.g.forEach((ta, ja) => { if (dep[a][ja] == null) return;
      for (let b = 0; b < n; b++) { if (b === a) continue; const B = d.ax[b], dist = D2(P[a], P[b]);
        B.g.forEach((tb, jb) => {
          if (Math.abs(dist - rad(ta) - rad(tb)) > TOL) return;
          const s = -sp[a] * ta / tb, r = red(-rat[a][0] * BigInt(ta), rat[a][1] * BigInt(tb));
          if (sp[b] == null) { sp[b] = s; rat[b] = r; dep[b][jb] = dep[a][ja]; B.g.forEach((_, k) => { if (k !== jb) dep[b][k] = dep[a][ja] + 1; }); Q.push(b); meshes.push([a, ja, b, jb]); }
          else if (dep[b][jb] === dep[a][ja]) { if (!meshes.some(m => m[0] === b && m[2] === a && m[1] === jb && m[3] === ja)) meshes.push([a, ja, b, jb]);
            if (rat[b][0] !== r[0] || rat[b][1] !== r[1]) jams.push([a, b]); }
        });
      }
    });
  }
  // collisions: wheels at the same depth that overlap, wheels that run over another arbor or a pillar, wheels off the plate, too deep
  const G = []; d.ax.forEach((A, i) => A.g.forEach((T, j) => G.push({ i, j, T, r: rad(T), d: dep[i][j], p: P[i] })));
  const bad = new Set(), mark = (i, j) => bad.add(i + ':' + j);
  for (let x = 0; x < G.length; x++) for (let y = x + 1; y < G.length; y++) { const g = G[x], h = G[y]; if (g.i === h.i || g.d == null || g.d !== h.d) continue;
    if (D2(g.p, h.p) < g.r + h.r - TOL) { probs.push({ k: 'clash', a: [g.i, g.j], b: [h.i, h.j] }); mark(g.i, g.j); mark(h.i, h.j); } }
  for (const g of G) {
    for (let b = 0; b < n; b++) { if (b === g.i) continue; const dd = D2(g.p, P[b]); if (dd > .5 && dd < g.r - 1.2) { probs.push({ k: 'foul', a: [g.i, g.j], b }); mark(g.i, g.j); } }
    for (const pl of com.pillars || []) if (D2(g.p, [pl.x, pl.y]) < g.r + pl.r) { probs.push({ k: 'pillar', a: [g.i, g.j] }); mark(g.i, g.j); }
    if (Math.hypot(g.p[0], g.p[1]) + g.r > com.R + .01) { probs.push({ k: 'edge', a: [g.i, g.j] }); mark(g.i, g.j); }
    if (g.d != null && g.d >= com.depth) { probs.push({ k: 'deep', a: [g.i, g.j] }); mark(g.i, g.j); }
    if (g.T < com.tmin || g.T > com.tmax) { probs.push({ k: 'teeth', a: [g.i, g.j] }); mark(g.i, g.j); }
  }
  for (let i = fixedN(com); i < n; i++) for (const pl of com.pillars || []) if (D2(P[i], [pl.x, pl.y]) < pl.r + 1) { probs.push({ k: 'pillar', a: [i, 0] }); mark(i, 0); }
  jams.forEach(([a, b]) => { mark(a, 0); mark(b, 0); });
  const hands = com.hands.map((h, k) => { const i = k + 1;
    if (sp[i] == null) return { ok: false, driven: false };
    const v = sp[i], dirOk = !h.dir || v > 0, e = h.exact ? null : (Math.abs(v) / h.ratio - 1) * 1e6;
    let ok = dirOk, exact = false;
    if (h.exact) { const [p, q] = h.exact, pa = rat[i][0] < 0n ? -rat[i][0] : rat[i][0]; exact = pa * BigInt(q) === BigInt(p) * rat[i][1]; ok = ok && exact; }
    else ok = ok && Math.abs(e) <= h.tol;
    return { ok, driven: true, v, e: h.exact ? (exact ? 0 : (Math.abs(v) / (h.exact[0] / h.exact[1]) - 1) * 1e6) : e, dirOk, exact };
  });
  const used = d.ax.map((A, i) => sp[i] != null), gears = d.ax.reduce((a, A) => a + A.g.length, 0), brass = d.ax.reduce((a, A) => a + A.g.reduce((x, y) => x + y, 0), 0);
  const ok = hands.every(h => h.ok) && !jams.length && !probs.length;
  const err = ok ? Math.max(...hands.map(h => Math.abs(h.e))) : null;
  return { P, sp, rat, dep, meshes, jams, probs, bad, hands, used, gears, brass, ok, err };
}
// ---- editing a design (the same calls the page and the bots use) ----
const cloneD = d => ({ ax: d.ax.map(A => ({ g: A.g.slice(), p: A.p ? A.p.slice() : undefined, a: A.a, lk: A.lk ? A.lk.slice() : null })) });
function blank(com) { return { ax: [{ g: [com.motor.T0 || 20] }, ...com.hands.map(h => ({ g: (h.g0 || []).slice() }))] }; }
function hang(com, d, parent, pg, T, ang) { d.ax.push({ g: [T], p: [parent, pg, 0], a: ang, lk: null }); return d.ax.length - 1; }
function removeArbor(com, d, i) {
  if (i < fixedN(com)) return false;
  const gone = new Set([i]); let grew = true;
  while (grew) { grew = false; d.ax.forEach((A, k) => { if (!gone.has(k) && A.p && gone.has(A.p[0])) { gone.add(k); grew = true; } }); }
  const map = []; let m = 0; d.ax.forEach((_, k) => { map[k] = gone.has(k) ? -1 : m++; });
  d.ax = d.ax.filter((_, k) => !gone.has(k)).map(A => { if (A.p) A.p[0] = map[A.p[0]]; if (A.lk) A.lk = map[A.lk[0]] < 0 ? null : [map[A.lk[0]], A.lk[1], A.lk[2]]; return A; });
  return true;
}
const gearUsed = (d, i, j) => d.ax.some(A => (A.p && A.p[0] === i && A.p[1] === j) || (A.lk && A.lk[0] === i && A.lk[1] === j));
function setTeeth(com, d, i, j, T) { T = Math.max(com.tmin, Math.min(com.tmax, Math.round(T))); if (!d.ax[i] || d.ax[i].g[j] == null) return false; d.ax[i].g[j] = T; return true; }
function addGear(com, d, i, T) { const A = d.ax[i]; if (!A || A.g.length >= 2 || (i === 0 && A.g.length >= 1 && com.motorOne)) return false; A.g.push(T); return true; }
function removeGear(com, d, i, j) { const A = d.ax[i]; if (!A || A.g[j] == null || gearUsed(d, i, j) || (i >= fixedN(com) && A.g.length < 2)) return false;
  if (i >= fixedN(com) && (A.p[2] === j || (A.lk && A.lk[2] === j))) return false;
  A.g.splice(j, 1); if (A.p && A.p[2] > j) A.p[2]--; if (A.lk && A.lk[2] > j) A.lk[2]--;
  d.ax.forEach(B => { if (B.p && B.p[0] === i && B.p[1] > j) B.p[1]--; if (B.lk && B.lk[0] === i && B.lk[1] > j) B.lk[1]--; });
  return true; }
// Turn a hung arbor round its parent's rim to angle a; if one of its wheels then lands on another wheel's mesh circle, it snaps in.
function swing(com, d, i, a, snapRad = .22) {
  const A = d.ax[i]; if (!A || i < fixedN(com)) return null;
  A.a = a; A.lk = null; const P = layout(com, d), pa = P[A.p[0]], rho = rad(d.ax[A.p[0]].g[A.p[1]]) + rad(A.g[A.p[2]]); let best = null;
  for (let b = 0; b < i; b++) { if (b === A.p[0]) continue; const B = d.ax[b];
    B.g.forEach((tb, jb) => A.g.forEach((tm, jm) => {
      for (const s of circleX(pa, rho, P[b], rad(tb) + rad(tm))) { const an = Math.atan2(s[1] - pa[1], s[0] - pa[0]), df = Math.abs(Math.atan2(Math.sin(an - a), Math.cos(an - a)));
        if (df < snapRad && (!best || df < best.df)) best = { df, an, lk: [b, jb, jm] }; }
    })); }
  if (best) { A.a = best.an; A.lk = best.lk; }
  return best;
}

// ================= commissions =================
// hands: x = turns of the hand per turn of the motor; exact: [p, q] when it must be exact; tol in ppm otherwise; dir 1 = clockwise like the motor
// a tidier constructor: hands given as {n, at:[x,y], per, …}
function C_(o) {
  const hands = o.hands.map(h => { const per = h.per, mp = o.motor.per, r = { n: h.n, x: h.at[0], y: h.at[1], per, ratio: mp / per, dir: h.dir || 0, kind: h.kind || 'hand', g0: h.g0 || [], tol: h.tol || 0 };
    if (Number.isInteger(mp) && Number.isInteger(per) && !h.approx) { const g = Number(gcd(BigInt(mp), BigInt(per))); r.exact = [mp / g, per / g]; }
    return r; });
  hands.forEach(h => { h.xr = h.ratio; });
  return { tmin: 8, tmax: 120, depth: 4, pillars: [], ...o, hands: hands.map(h => ({ ...h, x: h.x, y: h.y })) };
}

  if ($('remG')) $('remG').onclick = () => { push(); if (removeGear(c, D, i, sel.j)) { sel.j = 0; snd('clunk'); refresh(); } else { hist.pop(); RH.toast('Another arbor hangs on that wheel. Remove it first.'); } };
  if ($('remA')) $('remA').onclick = () => { push(); removeArbor(c, D, i); sel = { i: -1, j: 0 }; snd('clunk'); refresh(); };
  $('undoB').onclick = undo;
}
function liveEditor() { // update numbers in place so a slider keeps its focus
  const c = com(), i = sel.i, el = $('editor'); if (i < 0 || !D.ax[i]) return;
  const v = R.sp[i], per = el.querySelector('.per'); if (per) per.textContent = v == null ? (i === 0 ? '' : 'standing still') : 'one turn in ' + fmtP(c.motor.per / Math.abs(v));
  el.querySelectorAll('.grow').forEach(r => { const j = +r.dataset.j, T = D.ax[i].g[j]; r.querySelector('.tn').textContent = T; const inp = r.querySelector('input'); if (+inp.value !== T) inp.value = T; r.classList.toggle('sel', j === sel.j); });
  const u = $('undoB'); if (u) u.disabled = !hist.length;
}
function doHang(i, j) {
  const c = com(); if (D.ax.length >= 30) return RH.toast('The plate is full.');
  push(); const P = R.P, tgt = c.hands.map((h, k) => k + 1).find(k => !R.hands[k - 1].driven) || 1, ang = Math.atan2(P[tgt][1] - P[i][1], P[tgt][0] - P[i][0]) + .5;
  const k = hang(c, D, i, j, 40, ang); sel = { i: k, j: 0 }; snd('clunk'); swing(c, D, k, ang, .05); refresh();
}
let hist = [];
const push = () => { hist.push(JSON.stringify(D)); if (hist.length > 80) hist.shift(); };
function undo() { const h = hist.pop(); if (!h) return; D = JSON.parse(h); if (sel.i >= D.ax.length) sel = { i: -1, j: 0 }; refresh(); }

function renderBrief() {
  const c = com(), ci = C.indexOf(c);
  $('title').textContent = c.guild ? `The Guild · ${S.guild.daily ? 'today' : 'no. ' + c.level}` : `${['I', 'II', 'III'][c.a]}.${C.filter((x, k) => x.a === c.a && k <= ci).length} ${c.n}`;
  const rules = [`plate ${c.R * 2} wide`, `${c.depth} levels deep`, `teeth ${c.tmin}–${c.tmax}`, ...(c.pillars.length ? [`${c.pillars.length} pillar${c.pillars.length > 1 ? 's' : ''}`] : []), `motor: ${c.motor.lab}`];
  $('brief').innerHTML = `<h2>${c.n}</h2><div class="brief">${c.s}</div><div class="chips">${rules.map(x => `<span class="chip">${x}</span>`).join('')}</div>`;
}
const PROB = { clash: 'two wheels at the same level collide', foul: 'a wheel runs over an arbor', pillar: 'a wheel hits a pillar', edge: 'a wheel overhangs the plate', deep: 'the train is deeper than the movement', teeth: 'a wheel has too many or too few teeth' };
function renderLedger() {
  const c = com(), key = ckey(c), b = S.best[key], pst = guildPopStep(c, 0), pop = pst.out, now = R.ok ? metrics(R) : null;

  let st;

  else if (probs.length) st = `<span class="no">${probs.join('; ')}.</span>`;
  else if (R.hands.some(h => h.driven && !h.ok)) st = c.hands.map((h, k) => { const x = R.hands[k]; return x.driven && !x.ok ? (!x.dirOk ? `${h.n} turns the wrong way.` : `${h.n} is ${x.e > 0 ? 'too fast' : 'too slow'}${h.exact ? '' : ` (${fmtPPM(x.e)} ppm, ${drift(x.e, h.per)})`}.`) : ''; }).join(' ');

    <div class="row"><span class="chip">${R.gears} wheels</span><span class="chip">${R.brass} teeth of brass</span>${b ? '<span class="chip" style="border-color:#2f6b3a">delivered</span>' : ''}</div>
    ${b || now ? `<div class="hgs">${MEASURES.filter(([m]) => m !== 'e' || c.hands.some(h => !h.exact)).map(([m, name, unit, log]) => `<div class="hg"><div class="hl"><span>${name}${unit ? ' (' + unit + ')' : ''}</span><span>${b ? `yours ${m === 'e' ? fmtPPM(b.e) : b[m]} · better than ${Math.round(beatsShare(b[m], pop.map(x => x[m])) * 100)}%` : ''}</span></div><div class="hsvg">${histSVG(pop.map(x => x[m]), b ? b[m] : null, now ? now[m] : null, log)}</div></div>`).join('')}</div>
      <div class="hint" style="font-size:13px">${pop.length} members of the Guild built this commission too${pst.done ? '' : ' (more are still at their benches)'} · <span style="color:#a3281c">▼ your best</span> · <span style="color:#1b2f66">┆ this train</span></div>` : ''}
    <div class="row" style="margin-top:8px">${c.guild ? `<button id="gNext" ${b ? '' : 'disabled'}>Next commission ▸</button><button id="gDaily">Today's commission</button>` : nxt && S.done[c.id] ? `<button class="primary" id="nextB">Next: ${nxt.n} ▸</button>` : !nxt && S.done[c.id] && guildOpen() ? '<button class="primary" id="toGuild">To the Guild ▸</button>' : ''}<button id="shareB" ${R.ok ? '' : 'disabled title="Make the movement run first"'}>🔗 Share this movement</button></div>`;
  if ($('nextB')) $('nextB').onclick = () => open(nxt.id);
  const nf = $('nextF'); nf.hidden = !(nxt && S.done[c.id] && R.ok); nf.textContent = nxt ? 'Next: ' + nxt.n + ' ▸' : ''; nf.onclick = () => nxt && open(nxt.id);
  if ($('toGuild')) $('toGuild').onclick = () => open('guild');
  if ($('gNext')) $('gNext').onclick = () => { S.guild = { ...S.guild, seed: Math.random().toString(36).slice(2, 8), level: S.guild.daily ? S.guild.level : S.guild.level + 1, daily: 0 }; GUILD = null; open('guild'); };
  if ($('gDaily')) $('gDaily').onclick = () => { S.guild = { ...S.guild, seed: 'daily:' + todayStr(), level: 6, daily: todayStr() }; GUILD = null; open('guild'); };
  $('shareB').onclick = share;
}
function histSVG(vals, best, now, log) {
  const W = 240, Hh = 44, n = 16, f = v => log ? Math.log10(Math.max(.01, v)) : v, all = [...vals, best, now].filter(v => v != null && isFinite(v)).map(f);
  if (!all.length) return '';
  let lo = Math.min(...all), hi = Math.max(...all); if (hi - lo < 1e-9) { lo -= 1; hi += 1; }
  const bin = v => Math.min(n - 1, Math.floor((f(v) - lo) / (hi - lo) * n)), cnt = Array(n).fill(0); vals.forEach(v => cnt[bin(v)]++); const mx = Math.max(1, ...cnt);
  const X = v => 4 + (f(v) - lo) / (hi - lo) * (W - 8), bw = (W - 8) / n, lab = v => log ? (v < 1 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.round(v)) : Math.round(v);
  return `<svg viewBox="0 0 ${W} ${Hh + 12}" preserveAspectRatio="none" role="img">${cnt.map((k, i) => `<rect x="${4 + i * bw + 1}" y="${Hh - k / mx * (Hh - 6)}" width="${bw - 2}" height="${k / mx * (Hh - 6)}" fill="#8d6a22" opacity=".55"/>`).join('')}
    <line x1="2" x2="${W - 2}" y1="${Hh}" y2="${Hh}" stroke="#5d5440"/>
    ${now != null ? `<line x1="${X(now)}" x2="${X(now)}" y1="2" y2="${Hh}" stroke="#1b2f66" stroke-width="2" stroke-dasharray="4 3"/>` : ''}
    ${best != null ? `<line x1="${X(best)}" x2="${X(best)}" y1="6" y2="${Hh}" stroke="#a3281c" stroke-width="2.5"/><path d="M${X(best) - 5} 0 L${X(best) + 5} 0 L${X(best)} 7 Z" fill="#a3281c"/>` : ''}
    <text x="3" y="${Hh + 11}" font-size="10" fill="#5d5440">${lab(log ? Math.pow(10, lo) : lo)}</text><text x="${W - 3}" y="${Hh + 11}" font-size="10" text-anchor="end" fill="#5d5440">${lab(log ? Math.pow(10, hi) : hi)}</text></svg>`;
}
async function record() {
  const c = com(), key = ckey(c), m = metrics(R), b = S.best[key], first = !S.done[c.id] && !c.guild, firstG = c.guild && !b;
  const better = !b ? ['all'] : MEASURES.filter(([k]) => m[k] < b[k] - 1e-9).map(x => x[1].toLowerCase());
  if (!b) S.best[key] = { ...m }; else for (const [k] of MEASURES) b[k] = Math.min(b[k], m[k]);
  if (!better.length && !first) return;

  persist(); renderLedger(); renderDrawer(); coachCheck();
  if (first || firstG) { snd('bell'); FX.shake(.12); const p = R.P[1]; for (let k = 0; k < 3; k++) flash.push({ x: p[0], y: p[1], r: 8 + k * 6, t: .6 + k * .2 });
    const ci = C.indexOf(c), nxt = c.guild ? null : C[ci + 1];
    if (first) RH.toast(`Delivered: ${c.n}.${nxt ? ' Next: ' + nxt.n : ''}`, 2600); else RH.toast('Delivered to the Guild. Now improve it: less error, fewer wheels, less brass.', 3000);
  } else { snd('run'); RH.toast('New best: ' + better.join(', ')); }
}
function share() {
  const c = com(), enc = btoa(JSON.stringify({ c: c.guild ? ['g', c.seed, c.level] : c.id, d: D.ax.map(A => A.p ? [A.g, A.p, +A.a.toFixed(4), A.lk] : [A.g]) })).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

}
function fromLink(h) {
  try { const m = h.match(/#m=([\w-]+)/); if (!m) return false; const o = JSON.parse(atob(m[1].replace(/-/g, '+').replace(/_/g, '/')));
    let c; if (Array.isArray(o.c)) { S.guild = { ...S.guild, seed: String(o.c[1]).slice(0, 40), level: Math.max(1, Math.min(999, o.c[2] | 0)), daily: /^daily:/.test(o.c[1]) ? String(o.c[1]).slice(6, 16) : 0 }; S.cur = 'guild'; GUILD = null; c = com(); }
    else { c = C.find(x => x.id === o.c); if (!c) return false; S.cur = c.id; }
    const d = cleanDesign(c, { ax: o.d.map(x => x.length > 1 ? { g: x[0], p: x[1], a: x[2], lk: x[3] } : { g: x[0] }) }); if (!d) return false;
    S.designs[ckey(c)] = d; return true; } catch (e) { return false; }
}

// ---------- commission list ----------
function renderDrawer() {
  let h = '<h2 style="font-family:Pinyon Script,cursive;font-weight:400;font-size:32px;margin:0">Commissions</h2>';
  ACTS.forEach((an, a) => { h += `<div class="act">${['I', 'II', 'III'][a]}. ${an}</div>`; C.forEach((c, i) => { if (c.a !== a) return; const o = isOpen(i);
    h += `<div class="cm ${S.cur === c.id ? 'cur' : ''} ${o ? '' : 'locked'}" data-id="${c.id}"><span>${S.done[c.id] ? '⚙' : '○'} ${o ? c.n : '· · ·'}</span><span>${S.best[c.id] ? S.best[c.id].g + ' wheels' : o ? '' : '🔒'}</span></div>`; }); });
  h += `<div class="act">∞. The Guild</div><div class="cm ${S.cur === 'guild' ? 'cur' : ''} ${guildOpen() ? '' : 'locked'}" data-id="guild"><span>📜 Endless commissions, ranked</span><span>${guildOpen() ? S.guild.n + ' delivered' : 'after Act I 🔒'}</span></div>

  $('drawerIn').innerHTML = h;
  $('drawerIn').querySelectorAll('.cm').forEach(el => el.onclick = () => { const id = el.dataset.id; if (id === 'guild' ? !guildOpen() : !isOpen(C.findIndex(c => c.id === id))) return; $('drawer').classList.remove('open'); open(id); });
  $('muteB').onclick = () => { FX.setMuted(!FX.muted); renderDrawer(); }; $('closeD').onclick = () => $('drawer').classList.remove('open');
}
$('listBtn').onclick = () => { renderDrawer(); $('drawer').classList.add('open'); };
$('drawer').onclick = e => { if (e.target === $('drawer')) $('drawer').classList.remove('open'); };
let popT = null;
function popTick() { clearTimeout(popT); popT = null; const c = com(), st = guildPopStep(c, 12); if (R && (R.ok || S.best[ckey(c)]) && (st.done || st.out.length % 10 === 0)) renderLedger(); if (!st.done) popT = setTimeout(popTick, 28); }
function open(id) { S.cur = id; if (id === 'guild') GUILD = null; persist(); hist = []; sel = { i: -1, j: 0 }; loadDesign(); wasOk = R.ok; renderBrief(); renderPlaques(); renderEditor(); renderLedger(); cam.fit(); coachCheck(); clearTimeout(popT); popT = null; if (S.best[ckey(com())] || R.ok) popT = setTimeout(popTick, 300); }

// ---------- coach: first commission only ----------
const COACH = ['Tap the <b>motor</b>\'s ruby jewel, then slide its wheel bigger.', 'Now tap the <b>hand</b>\'s jewel and cut its wheel too, until the rims touch and it turns once in 2 s.'];

  else if (c.id === 'idler' && !S.done.idler) t = D.ax.length <= fixedN(c) ? 'Tap the motor\'s jewel and press <b>⚙ Hang a wheel</b>.' : !R.hands[0].driven ? '<b>Drag</b> the new wheel round the motor\'s rim, and size it until it clicks into the hand\'s wheel.' : '';

if (S.cur === 'guild' && !guildOpen() && !location.hash.startsWith('#m=')) S.cur = 'mesh';
if (S.cur !== 'guild' && !isOpen(C.findIndex(c => c.id === S.cur)) && !location.hash.startsWith('#m=')) S.cur = 'mesh';
open(S.cur);
window.__esc = { C, S, solve, layout, blank, hang, swing, setTeeth, addGear, removeGear, removeArbor, cloneD, plan, guildDef, guildTry, guildPop, beatsShare, metrics, fmtP, drift, cleanDesign, loadState, circleX, rad, TOL, fixedN,
  screenOf: i => cam.toScreen(R.P[i][0], R.P[i][1]), toScreenW: (x, y) => cam.toScreen(x, y), get D() { return D; }, set D(v) { D = v; refresh(); }, get R() { return R; }, open, refresh, com, ckey };
