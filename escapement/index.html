<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Escapement</title>
<link rel="stylesheet" href="../shared/common.css">
<style>
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  main{flex:1;display:flex;min-height:0}
  #side{width:240px;border-right:1px solid var(--line);background:var(--panel);overflow:auto;padding:10px}
  .act{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);margin:12px 4px 4px;display:flex;justify-content:space-between}
  .act.locked{color:var(--dim)}
  .cm{display:flex;justify-content:space-between;gap:6px;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:13px}
  .cm:hover{background:var(--panel2)}
  .cm.cur{background:var(--panel2);outline:1px solid var(--accent)}
  .cm.locked{opacity:.35;cursor:default}
  .cm .st{color:var(--accent);font-size:11px;white-space:nowrap}
  #center{flex:1;overflow:auto;padding:14px 18px 40px;min-width:0}
  h2{margin:0;font-size:22px}
  .story{color:#c9c6bd;line-height:1.55;font-size:14px;max-width:820px;margin:6px 0 10px}
  .rules{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .pill{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px;color:var(--dim)}
  .pill.bad{border-color:var(--bad);color:var(--bad)}
  .pill.ok{border-color:var(--good);color:var(--good)}
  table.tg{border-collapse:collapse;font-size:13px;width:100%;max-width:900px}
  table.tg td,table.tg th{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left}
  table.tg th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .yes{color:var(--good)} .no{color:var(--bad)} .mid{color:var(--accent)}
  #cv{width:100%;height:340px;display:block;background:radial-gradient(ellipse at center,#161b25,#0b0d12);border:1px solid var(--line);border-radius:12px;margin:10px 0}
  .axles{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;align-items:stretch}
  .ax{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:150px;font-size:13px}
  .ax h4{margin:0 0 6px;font-size:12px;color:var(--dim);font-weight:600;display:flex;justify-content:space-between}
  .ax .gl{display:flex;align-items:center;gap:4px;margin:4px 0}
  .ax .gl input{width:58px;text-align:center;font-family:ui-monospace,monospace}
  .ax .gl select{width:70px}
  .ax .gl button{padding:1px 7px}
  .ax .sp{font-family:ui-monospace,monospace;font-size:12px;color:var(--accent);margin-top:4px}
  .ax .hand{font-size:11px;color:var(--good)}
  .ax.bad{border-color:var(--bad)}
  .addax{display:flex;flex-direction:column;gap:6px;justify-content:center}
  .tool{margin-top:16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel);max-width:900px}
  .tool summary{cursor:pointer;font-weight:600}
  .bt{font-family:ui-monospace,monospace;font-size:12px;width:100%;border-collapse:collapse;margin-top:8px}
  .bt td,.bt th{padding:3px 6px;border-bottom:1px solid #1d2230;text-align:right}
  .bt th{color:var(--dim);font-weight:500}
  .bt td.l,.bt th.l{text-align:left}
  .note{font-size:12px;color:var(--dim);line-height:1.45}
  .stars{color:var(--accent);font-size:18px}
  @media (max-width:800px){#side{display:none}}
</style>
</head>
<body>
<div class="topbar"><a class="home" href="../index.html">← Rabbit Holes</a><h1>⚙️ Escapement</h1><span class="spacer"></span><span class="dim small" id="totals"></span><button id="helpBtn">?</button></div>
<main><div id="side"></div><div id="center"></div></main>
<script src="../shared/common.js"></script>
<script>
'use strict';
const DAY = 86400, YEAR = 365.2422 * DAY;
// Targets: ratio = turns of the target hand per turn of the motor. Exact: [p, q]. Approximate: x (float) + tol ppm tiers [pass, 2★, 3★].
const ACTS = ['The Workshop', 'Awkward Parts', 'The Heavens', 'Many Hands'];
const C = [
  // Act I
  { a: 0, n: 'Half Speed', motor: [2, '1 turn every 2 seconds'], T: [{ n: 'Output', r: [1, 2] }], par: 2,
    s: 'Two gears that mesh turn at speeds in the inverse ratio of their teeth. A 20-tooth gear driving a 40-tooth gear makes it turn at half speed.<br><i>Set the motor gear and the gear on axle 1 so that axle 1 turns half as fast.</i>' },
  { a: 0, n: 'Same Way Round', motor: [1, '1 turn per second'], T: [{ n: 'Output', r: [1, 3], dir: 1 }], par: 3,
    s: 'Every mesh <b>reverses</b> the direction of rotation. This output has to turn at a third of the speed <b>and</b> clockwise, the same way as the motor. Put an <b>idler</b> in between: a gear that only passes the motion along. It changes the direction but not the overall ratio.' },
  { a: 0, n: 'The Seconds Hand', motor: [1, 'escape wheel: 1 turn per second'], T: [{ n: 'Seconds hand', r: [1, 60], dir: 1 }], par: 4,
    s: 'The escapement ticks the motor round once a second. A seconds hand turns once a minute. Gears run from 8 to 120 teeth, so one mesh can reduce speed by at most 15×. You need a <b>compound</b> axle: two gears fixed to the same arbor, one driven and one driving.' },
  { a: 0, n: 'The Hour Hand', motor: [3600, 'minute arbor: 1 turn per hour'], T: [{ n: 'Hour hand', r: [1, 12], dir: 1 }], par: 3,
    s: 'The minute arbor turns once an hour. The hour hand turns once every 12 hours, clockwise like everything else on a clock face.' },
  { a: 0, n: 'Hours from Seconds', motor: [1, '1 turn per second'], T: [{ n: 'Hour wheel', r: [1, 3600], dir: 1 }], par: 8,
    s: 'From one turn a second down to one turn an hour: a 3600× reduction, clockwise. 15 × 15 × 15 is only 3375.' },
  { a: 0, n: 'The Weekday Wheel', motor: [DAY, '1 turn per day'], T: [{ n: 'Weekday wheel', r: [1, 7], dir: 1 }], par: 3,
    s: 'A wheel that steps through Sunday to Saturday: one turn per week, clockwise.' },
  { a: 0, n: 'Step Up', motor: [6, '1 turn every 6 seconds'], T: [{ n: 'Fan', r: [6, 1] }], par: 2,
    s: 'Gears speed things up too. The governor fan of a chiming clock spins fast to slow the strike. Make it turn 6 times per motor turn.' },
  { a: 0, n: 'Week from Hours', motor: [3600, '1 turn per hour'], T: [{ n: 'Week dial', r: [1, 168] }], par: 4,
    s: 'One turn per week, from a motor that turns once an hour. Either direction is fine. 168 = 8 × 21 = 12 × 14 = …' },
  // Act II
  { a: 1, n: 'Small Parts', motor: [1, '1 turn per second'], T: [{ n: 'Output', r: [1, 100] }], par: 6, tmax: 40,
    s: 'A pocket watch has no room for big wheels: <b>no gear may have more than 40 teeth</b>. Reduce by 100×.' },
  { a: 1, n: 'Thirteen', motor: [DAY, '1 turn per day'], T: [{ n: 'Output', r: [1, 91] }], par: 6, tmax: 60,
    s: 'A 91-day quarter-year dial (7 × 13). <b>Wheels up to 60 teeth, pinions at least 8.</b> No wheel can reduce by 13 on its own, so the 13 has to be split up between gears.' },
  { a: 1, n: 'The Spare-Parts Bin', motor: [1, '1 turn per second'], T: [{ n: 'Output', r: [1, 54], dir: 1 }], par: 4, inv: [10, 12, 15, 20, 24, 30, 40, 45, 60, 72, 90, 120],
    s: 'The workshop has run dry. You have <b>one each</b> of these gears and nothing else. Make a clockwise 54× reduction.' },
  { a: 1, n: 'Prime Suspect', motor: [3600, '1 turn per hour'], T: [{ n: 'Day dial', r: [1, 97] }], par: 4,
    s: 'A clock for a colony on a planet with a <b>97-hour</b> day. 97 is prime, so some gear has to have exactly 97 teeth (or a multiple).' },
  { a: 1, n: 'Odd Teeth', motor: [1, '1 turn per second'], T: [{ n: 'Output', r: [1, 45], dir: 1 }], par: 4, odd: 1,
    s: 'A superstitious clockmaker will only cut gears with an <b>odd</b> number of teeth. Clockwise, 45× slower.' },
  { a: 1, n: 'No Two Alike', motor: [1, '1 turn per second'], T: [{ n: 'Output', r: [1, 1000] }], par: 6, distinct: 1,
    s: 'For a display cabinet: a 1000× reduction in which <b>every gear has a different tooth count</b>.' },
  // Act III
  { a: 2, n: 'The Pi Wheel', motor: [1, '1 turn per second'], T: [{ n: 'Output', x: Math.PI, tol: [1000, 100, 1] }], maxG: 4, brocot: 1,
    s: 'Approximate ratios. Real clocks have to match the sky, and the sky does not use whole numbers. Make the output turn π times per motor turn. 22/7 is close. <b>Brocot\'s table</b>, published in 1862 by Achille Brocot, a Paris clockmaker, lists the best fractions near any number. Error is measured in parts per million (ppm).' },
  { a: 2, n: 'Moon Phase', motor: [DAY, '1 turn per day'], T: [{ n: 'Moon-phase disc', x: 1 / 29.530589, tol: [1000, 100, 5] }], maxG: 4, brocot: 1,
    s: 'From new moon to new moon is 29.530589 days. Mantel clocks often use 59 teeth for two months. Can you beat that? A disc that is off by 100 ppm drifts one day in about 800 years.' },
  { a: 2, n: 'The Golden Gear', motor: [1, '1 turn per second'], T: [{ n: 'Output', x: (1 + Math.sqrt(5)) / 2, tol: [1000, 200, 100] }], maxG: 2, brocot: 1,
    s: 'The golden ratio φ = 1.6180339…, using <b>only two gears</b>. Each Fibonacci number divided by the one before it gets closer to φ.' },
  { a: 2, n: 'Sidereal Time', motor: [DAY, '1 turn per solar day'], T: [{ n: 'Star dial', x: 1.0027379093, tol: [100, 10, 1] }], maxG: 4, brocot: 1,
    s: 'Measured against the stars, Earth turns 366.2422 times a year, not 365.2422. A sidereal clock runs 0.27% fast. Astronomers needed this ratio to point telescopes.' },
  { a: 2, n: 'The Tropical Year', motor: [DAY, '1 turn per day'], T: [{ n: 'Year ring', x: 1 / 365.2422, tol: [1000, 50, 1] }], maxG: 6, brocot: 1,
    s: 'One turn per tropical year: 365.2422 days. Leap years exist because this number is not a whole number.' },
  { a: 2, n: 'Root Two', motor: [1, '1 turn per second'], T: [{ n: 'Output', x: Math.SQRT2, tol: [1000, 200, 60] }], maxG: 2, brocot: 1,
    s: 'The ratio of A4 paper, built from only two gears. The Babylonians knew 99/70 was close.' },
  { a: 2, n: "Euler's Engine", motor: [1, '1 turn per second'], T: [{ n: 'Output', x: Math.E, tol: [1000, 50, 1] }], maxG: 4, brocot: 1,
    s: 'e = 2.718281828… using four gears.' },
  { a: 2, n: 'Venus', motor: [DAY, '1 turn per day'], T: [{ n: 'Venus arm', x: 1 / 224.701, tol: [1000, 50, 1] }], maxG: 6, brocot: 1,
    s: 'Venus goes round the Sun every 224.701 days. A 224.7× reduction, accurate enough for an orrery to keep up with the real sky.' },
  // Act IV
  { a: 3, n: 'A Proper Clock', motor: [1, 'escape wheel: 1 turn per second'], T: [{ n: 'Seconds', r: [1, 60], dir: 1 }, { n: 'Minutes', r: [1, 3600], dir: 1 }, { n: 'Hours', r: [1, 43200], dir: 1 }], par: 11, maxG: 14,
    s: 'Three hands, one gear train, all clockwise. Any axle can carry a hand: the workshop matches each hand to the best axle automatically. Arrange the train so that the right speeds turn up along the way.' },
  { a: 3, n: 'Calendar Clock', motor: [3600, '1 turn per hour'], T: [{ n: 'Day', r: [1, 24] }, { n: 'Week', r: [1, 168] }], par: 6, maxG: 10,
    s: 'A day dial and a week dial from the hour arbor. Either direction.' },
  { a: 3, n: 'Weeks and Moons', motor: [DAY, '1 turn per day'], T: [{ n: 'Week', r: [1, 7] }, { n: 'Moon phase', x: 1 / 29.530589, tol: [1000, 100, 10] }], maxG: 8, brocot: 1,
    s: 'An exact week dial, then a moon-phase disc further down the same train. The ratio from week to moon is 7 / 29.530589. Try it in Brocot\'s table.' },
  { a: 3, n: 'Earth and Moon', motor: [DAY, '1 turn per day'], T: [{ n: 'Moon (sidereal month)', x: 1 / 27.321661, tol: [1000, 100, 10] }, { n: 'Earth (year)', x: 1 / 365.2422, tol: [1000, 100, 10] }], maxG: 8, brocot: 1,
    s: 'A small orrery. The Moon circles the Earth every 27.321661 days, and the Earth circles the Sun every 365.2422 days.' },
  { a: 3, n: 'The Antikythera Mechanism', motor: [YEAR, 'crank: 1 turn per year'], T: [{ n: 'Lunar month pointer', r: [235, 19] }, { n: 'Saros dial', r: [235, 19 * 223] }], par: 6, tmax: 240, brocot: 1,
    s: 'Around 100 BC a Greek workshop built a bronze computer with a <b>223-tooth</b> gear. 19 years contain 235 lunar months (the Metonic cycle), and eclipses repeat every 223 months (the Saros). <b>Gears up to 240 teeth here.</b> Turn the crank once a year.' },
  { a: 3, n: 'Grand Orrery', motor: [DAY, '1 turn per day'], T: [{ n: 'Mercury', x: 1 / 87.969, tol: [1000, 200, 50] }, { n: 'Venus', x: 1 / 224.701, tol: [1000, 200, 50] }, { n: 'Earth', x: 1 / 365.2422, tol: [1000, 200, 50] }, { n: 'Mars', x: 1 / 686.98, tol: [1000, 200, 50] }], maxG: 18, brocot: 1,
    s: 'Four planets on one train, innermost first. Each planet\'s period divided by the previous one\'s is the ratio you need between them. Your finest work.' },
];
const ACTN = ACTS.map((_, a) => C.filter(c => c.a === a).length);

// ---------- rational helpers (BigInt) ----------
const gcd = (a, b) => { a = a < 0n ? -a : a; b = b < 0n ? -b : b; while (b) [a, b] = [b, a % b]; return a; };
const red = (p, q) => { const g = gcd(p, q) || 1n; return [p / g, q / g]; };
function factor(n) { const f = []; let d = 2; while (n > 1 && d * d <= n) { while (n % d === 0) { f.push(d); n /= d; } d++; } if (n > 1) f.push(n); return f; }

// ---------- state ----------
const S = RH.load('esc', { done: {}, designs: {}, cur: 0, intro: 0 });
const persist = () => { RH.save('esc', S); RH.progress('escapement', Object.keys(S.done).length / C.length); };
const actOpen = a => a === 0 || C.filter(c => c.a === a - 1 && S.done[C.indexOf(c)]).length >= 5;
let cur = S.cur ?? 0;
if (cur !== 'free' && (!C[cur] || !actOpen(C[cur].a))) cur = 0;
const FREE = { a: -1, n: 'Free workshop', motor: [1, '1 turn per second'], T: [{ n: 'Your target', x: 1 / 29.530589, tol: [1000, 100, 1] }], maxG: 30, brocot: 1, s: 'No commission, no rules. Type any ratio and build towards it.' };
const com = () => cur === 'free' ? FREE : C[cur];
const design = () => (S.designs[cur] ||= { ax: [{ o: 20 }, { i: 20, o: null }] });
const limits = c => ({ tmin: c.tmin || 8, tmax: c.tmax || 120 });

function analyse(c, d) {
  const ax = d.ax, L = limits(c), res = { axles: [], gears: [], problems: [] };
  let p = 1n, q = 1n, sign = 1;
  res.axles.push({ p, q, sign });
  res.gears.push(ax[0].o);
  for (let k = 1; k < ax.length; k++) {
    const drv = ax[k - 1].o ?? ax[k - 1].i, dvn = ax[k].i;
    p *= BigInt(drv); q *= BigInt(dvn);[p, q] = red(p, q); sign = -sign;
    res.axles.push({ p, q, sign });
    res.gears.push(dvn); if (k < ax.length - 1 && ax[k].o != null) res.gears.push(ax[k].o);
  }
  const bad = new Set();
  res.gears.forEach((t, j) => {
    if (!Number.isInteger(t) || t < L.tmin || t > L.tmax) { bad.add(t); res.problems.push(`${t} teeth is outside ${L.tmin}–${L.tmax}`); }
    if (c.odd && t % 2 === 0) { bad.add(t); res.problems.push(`${t} is even`); }
  });
  if (c.distinct || c.inv) { const seen = {}; res.gears.forEach(t => { seen[t] = (seen[t] || 0) + 1; }); for (const t in seen) if (seen[t] > 1) { bad.add(+t); res.problems.push(`${t}-tooth gear used ${seen[t]} times`); } }
  if (c.inv) res.gears.forEach(t => { if (!c.inv.includes(t)) { bad.add(t); res.problems.push(`no ${t}-tooth gear in the bin`); } });
  if (c.maxG && res.gears.length > c.maxG) res.problems.push(`${res.gears.length} gears, limit ${c.maxG}`);
  res.bad = bad;
  res.problems = [...new Set(res.problems)];
  // match each target to its best axle
  res.T = c.T.map(t => {
    let best = null;
    res.axles.forEach((a, k) => {
      if (!k) return; if (t.dir && a.sign !== t.dir) return;
      const val = Number(a.p) / Number(a.q);
      let err, exact = false;
      if (t.r) { exact = a.p * BigInt(t.r[1]) === a.q * BigInt(t.r[0]); err = Math.abs(val / (t.r[0] / t.r[1]) - 1) * 1e6; }
      else err = Math.abs(val / t.x - 1) * 1e6;
      if (!best || (exact && !best.exact) || (exact === best.exact && err < best.err)) best = { k, err, exact, val };
    });
    let ok = false, stars = 0;
    if (best) {
      if (t.r) { ok = best.exact; stars = ok ? 3 : 0; }
      else { ok = best.err <= t.tol[0]; stars = ok ? 1 + (best.err <= t.tol[1]) + (best.err <= t.tol[2]) : 0; }
    }
    return { ...best, ok, stars };
  });
  res.ok = !res.problems.length && res.T.every(t => t.ok);
  if (res.ok) {
    let st = Math.min(...res.T.map(t => t.stars));
    if (c.par) st = Math.min(st, res.gears.length <= c.par ? 3 : res.gears.length <= c.par + 2 ? 2 : 1);
    res.stars = st;
  }
  return res;
}

// ---------- formatting ----------
function fmtP(sec) {
  if (!isFinite(sec)) return '∞';
  const u = [[YEAR, 'years'], [DAY, 'days'], [3600, 'hours'], [60, 'minutes'], [1, 'seconds']];
  for (const [s, n] of u) if (sec >= s * .999 || s === 1) { const v = sec / s; return (v >= 100 ? v.toFixed(2) : v >= 10 ? v.toFixed(3) : v.toFixed(4)).replace(/\.?0+$/, '') + ' ' + (Math.abs(v - 1) < 1e-9 ? n.replace(/s$/, '') : n); }
}
const fmtR = (p, q) => q === 1n ? `${p}` : `${p}/${q}`;
const fmtErr = e => e == null ? '–' : e < .01 ? '<0.01 ppm' : e < 10 ? e.toFixed(2) + ' ppm' : e < 1e4 ? e.toFixed(0) + ' ppm' : (e / 1e4).toFixed(1) + '%';

// ---------- UI ----------
const $ = id => document.getElementById(id);
function renderSide() {
  let h = '', last = -1;
  C.forEach((c, i) => {
    if (c.a !== last) { last = c.a; const n = C.filter((x, j) => x.a === c.a && S.done[j]).length; h += `<div class="act ${actOpen(c.a) ? '' : 'locked'}"><span>${['I','II','III','IV'][c.a]}. ${ACTS[c.a]}</span><span>${actOpen(c.a) ? n + '/' + ACTN[c.a] : '🔒'}</span></div>`; }
    const d = S.done[i];
    h += `<div class="cm ${i === cur ? 'cur' : ''} ${actOpen(c.a) ? '' : 'locked'}" data-i="${i}"><span>${d ? '⚙️' : '○'} ${c.n}</span><span class="st">${d ? '★'.repeat(d.stars) + '☆'.repeat(3 - d.stars) : ''}</span></div>`;
  });
  h += `<div class="act"><span>∞. Free workshop</span></div><div class="cm ${cur === 'free' ? 'cur' : ''}" data-i="free"><span>🛠️ Any ratio you like</span></div><div class="note" style="margin:14px 6px">Finish 5 commissions in an act to open the next.</div>`;
  $('side').innerHTML = h;
  $('side').querySelectorAll('.cm').forEach(el => el.onclick = () => { const i = el.dataset.i === 'free' ? 'free' : +el.dataset.i; if (i === 'free' || actOpen(C[i].a)) open(i); });
  const n = Object.keys(S.done).length, st = Object.values(S.done).reduce((a, x) => a + x.stars, 0);
  $('totals').textContent = `${n}/${C.length} commissions · ${st}★`;
}

function open(i) { cur = i; S.cur = i; persist(); render(); }

function render() {
  const c = com(), d = design(), L = limits(c);
  const rules = [`Teeth ${L.tmin}–${L.tmax}`];
  if (c.maxG) rules.push(`At most ${c.maxG} gears`);
  if (c.par) rules.push(`Par: ${c.par} gears`);
  if (c.odd) rules.push('Odd tooth counts only');
  if (c.distinct) rules.push('Every gear different');
  if (c.inv) rules.push('Bin: ' + c.inv.join(', '));
  const best = S.done[cur];
  $('center').innerHTML = `
    <div class="row" style="justify-content:space-between"><div><div class="dim small">${cur === 'free' ? 'Free workshop' : `${['I','II','III','IV'][c.a]}. ${ACTS[c.a]} · Commission ${cur + 1}`}</div><h2>${c.n}</h2></div>
      <div class="row">${best ? `<span class="stars">${'★'.repeat(best.stars)}${'☆'.repeat(3 - best.stars)}</span><span class="pill">best: ${best.gears} gears</span>` : ''}<button id="resetBtn">Reset train</button></div></div>
    <p class="story">${c.s}</p>
    ${cur === 'free' ? `<div class="row" style="margin-bottom:8px">Target ratio (output turns per motor turn): <input id="freeX" style="width:180px" class="mono" value="${S.freeX ?? '1/29.530589'}"><span class="note">e.g. 1/365.2422, 3.14159, 7/29.53</span></div>` : ''}
    <div class="rules"><span class="pill">Motor: ${c.motor[1]}</span>${rules.map(r => `<span class="pill">${r}</span>`).join('')}<span id="status"></span></div>
    <table class="tg"><thead><tr><th>Hand</th><th>Needs</th><th>Direction</th><th>Best axle</th><th>Achieved</th><th>Error</th><th></th></tr></thead><tbody id="tgt"></tbody></table>
    <canvas id="cv"></canvas>
    <div class="axles" id="axles"></div>
    <div class="note" style="margin-top:6px">Each axle after the motor has a <b>driven</b> gear. Give it a second, <b>driving</b> gear to make it compound, or leave that empty and the driven gear passes the motion on by itself (an idler). Every mesh reverses direction.</div>
    ${c.brocot ? brocotHTML(c) : ''}`;
  $('resetBtn').onclick = () => { delete S.designs[cur]; persist(); render(); };
  if ($('freeX')) $('freeX').oninput = () => { S.freeX = $('freeX').value; const x = parseRatio(S.freeX); if (x > 0) { FREE.T[0].x = x; } update(); };
  if (cur === 'free') { const x = parseRatio(S.freeX ?? '1/29.530589'); if (x > 0) FREE.T[0].x = x; }
  renderAxles(); renderSide(); update();
  if (c.brocot) wireBrocot(c);
  sizeCanvas();
}
const parseRatio = s => { const m = String(s).split('/'); const v = m.length === 2 ? +m[0] / +m[1] : +m[0]; return isFinite(v) ? v : NaN; };

function gearInput(c, val, attr, k, allowEmpty) {
  if (c.inv) return `<select data-k="${k}" data-f="${attr}">${allowEmpty ? `<option value="" ${val == null ? 'selected' : ''}>idler</option>` : ''}${c.inv.map(t => `<option ${t === val ? 'selected' : ''}>${t}</option>`).join('')}</select>`;
  if (allowEmpty && val == null) return `<button data-k="${k}" data-add="o" title="Add a driving gear to this axle">+ driving gear</button>`;
  return `<button data-k="${k}" data-f="${attr}" data-d="-1">−</button><input data-k="${k}" data-f="${attr}" type="number" value="${val}"><button data-k="${k}" data-f="${attr}" data-d="1">+</button>${allowEmpty ? `<button data-k="${k}" data-rm="o" title="Make it an idler">✕</button>` : ''}`;
}
function renderAxles() {
  const c = com(), d = design(), ax = d.ax;
  let h = '';
  ax.forEach((a, k) => {
    const last = k === ax.length - 1;
    h += `<div class="ax" data-ax="${k}"><h4><span>${k === 0 ? 'Motor' : 'Axle ' + k}</span>${k > 0 && last && ax.length > 2 ? `<button data-pop="1" style="padding:0 6px">✕</button>` : ''}</h4>`;
    if (k > 0) h += `<div class="gl" title="Driven gear: meshes with the previous axle">⟵ ${gearInput(c, a.i, 'i', k)}</div>`;
    if (k === 0) h += `<div class="gl" title="Driving gear">⟶ ${gearInput(c, a.o, 'o', k)}</div>`;
    else if (!last) h += `<div class="gl" title="Driving gear (compound), or idler">⟶ ${gearInput(c, a.o, 'o', k, true)}</div>`;
    h += `<div class="sp" data-sp="${k}"></div><div class="hand" data-hand="${k}"></div></div>`;
  });
  h += `<div class="addax"><button id="addAx">+ Axle</button></div>`;
  $('axles').innerHTML = h;
  const set = (k, f, v) => { ax[k][f] = v; persist(); update(); };
  $('axles').querySelectorAll('input[data-f]').forEach(inp => inp.oninput = () => { const v = parseInt(inp.value); if (v > 0) set(+inp.dataset.k, inp.dataset.f, v); });
  $('axles').querySelectorAll('select[data-f]').forEach(sel => sel.onchange = () => set(+sel.dataset.k, sel.dataset.f, sel.value === '' ? null : +sel.value));
  $('axles').querySelectorAll('button[data-d]').forEach(bn => bn.onclick = () => { const k = +bn.dataset.k, f = bn.dataset.f, v = Math.max(1, (ax[k][f] || 8) + +bn.dataset.d); ax[k][f] = v; bn.parentNode.querySelector('input').value = v; persist(); update(); });
  $('axles').querySelectorAll('button[data-add]').forEach(bn => bn.onclick = () => { ax[+bn.dataset.k].o = c.inv ? c.inv[0] : 10; persist(); renderAxles(); update(); });
  $('axles').querySelectorAll('button[data-rm]').forEach(bn => bn.onclick = () => { ax[+bn.dataset.k].o = null; persist(); renderAxles(); update(); });
  $('axles').querySelectorAll('button[data-pop]').forEach(bn => bn.onclick = () => { ax.pop(); persist(); renderAxles(); update(); });
  $('addAx').onclick = () => { const lastAx = ax[ax.length - 1]; if (ax.length > 1 && lastAx.o == null) lastAx.o = c.inv ? c.inv[1] : 10; ax.push({ i: c.inv ? c.inv[2] : 40, o: null }); persist(); renderAxles(); update(); };
}

let R = null;
function update() {
  const c = com(), d = design(); R = analyse(c, d);
  const mp = c.motor[0];
  c.T.forEach((t, j) => {});
  $('tgt').innerHTML = c.T.map((t, j) => {
    const m = R.T[j], need = t.r ? `${t.r[0]}/${t.r[1]} <span class="dim">(1 turn / ${fmtP(mp * t.r[1] / t.r[0])})</span>` : `${t.x.toPrecision(9)} <span class="dim">(1 turn / ${fmtP(mp / t.x)})</span>`;
    const dir = t.dir === 1 ? '↻ clockwise' : t.dir === -1 ? '↺ anticlockwise' : 'either';
    const ach = m?.k ? `${fmtR(R.axles[m.k].p, R.axles[m.k].q)} <span class="dim">= ${m.val.toPrecision(9)}</span>` : '–';
    const st = m?.ok ? (t.r ? '<span class="yes">✓ exact</span>' : `<span class="${m.stars === 3 ? 'yes' : 'mid'}">${'★'.repeat(m.stars)}</span>`) : '<span class="no">✗</span>';
    return `<tr><td>${t.n}</td><td class="mono">${need}</td><td>${dir}</td><td>${m?.k ? 'Axle ' + m.k : '–'}</td><td class="mono">${ach}</td><td class="mono">${m?.k ? (t.r && m.exact ? '0' : fmtErr(m.err)) : '–'}</td><td>${st}</td></tr>`;
  }).join('');
  document.querySelectorAll('[data-sp]').forEach(el => { const k = +el.dataset.sp, a = R.axles[k]; el.textContent = `${a.sign > 0 ? '↻' : '↺'} ${fmtR(a.p, a.q)}`; el.title = '1 turn per ' + fmtP(mp * Number(a.q) / Number(a.p)); });
  document.querySelectorAll('[data-hand]').forEach(el => { const k = +el.dataset.hand; el.textContent = c.T.filter((t, j) => R.T[j]?.k === k && R.T[j].ok).map(t => '◆ ' + t.n).join(' '); });
  document.querySelectorAll('.ax').forEach(el => { const k = +el.dataset.ax, a = d.ax[k], gs = [a.o, a.i].filter(x => x != null); el.classList.toggle('bad', gs.some(g => R.bad.has(g))); });
  const st = $('status');
  st.innerHTML = `<span class="pill ${c.maxG && R.gears.length > c.maxG ? 'bad' : ''}">${R.gears.length} gears</span>` + R.problems.map(p => `<span class="pill bad">${p}</span>`).join('') + (R.ok ? `<span class="pill ok">✓ Commission met ${'★'.repeat(R.stars)}</span>` : '');
  if (R.ok && cur !== 'free') record();
}
let celebrating = false;
async function record() {
  const prev = S.done[cur], st = R.stars, g = R.gears.length;
  if (prev && (prev.stars > st || (prev.stars === st && prev.gears <= g))) return;
  S.done[cur] = { stars: st, gears: g }; persist(); renderSide();
  if (prev) { RH.toast(`New best: ${'★'.repeat(st)} with ${g} gears`); return; }
  if (celebrating) return; celebrating = true;
  try { const ac = new AudioContext(); [392, 523, 659, 784].forEach((f, k) => { const o = ac.createOscillator(), gg = ac.createGain(); o.type = 'triangle'; o.frequency.value = f; gg.gain.setValueAtTime(.08, ac.currentTime + k * .12); gg.gain.exponentialRampToValueAtTime(.001, ac.currentTime + k * .12 + .5); o.connect(gg).connect(ac.destination); o.start(ac.currentTime + k * .12); o.stop(ac.currentTime + k * .12 + .55); }); } catch (e) {}
  const nxt = C.findIndex((x, j) => j > cur && !S.done[j] && actOpen(x.a));
  const unlocked = C[cur].a < 3 && C.filter((x, j) => x.a === C[cur].a && S.done[j]).length === 5;
  const go = await RH.modal(`<h2>⚙️ ${C[cur].n}: delivered</h2><p class="stars" style="font-size:26px;text-align:center">${'★'.repeat(st)}${'☆'.repeat(3 - st)}</p><p style="text-align:center">${g} gears${C[cur].par ? ` (par ${C[cur].par})` : ''}.${st < 3 ? ' You can keep refining it for more stars.' : ''}</p>${unlocked ? `<p style="text-align:center">🔓 New act: <b>${ACTS[C[cur].a + 1]}</b></p>` : ''}`,
    nxt >= 0 ? [{ label: 'Keep tinkering', value: 0 }, { label: `Next: ${C[nxt].n}`, value: 1 }] : [{ label: 'Close', value: 0 }]);
  celebrating = false;
  if (go) open(nxt);
}

// ---------- Brocot table ----------
function brocotHTML(c) {
  const opts = c.T.map((t, j) => `<option value="${t.r ? t.r[0] / t.r[1] : t.x}">${t.n}</option>`).join('') + (c.T.length > 1 ? c.T.slice(1).map((t, j) => { const a = c.T[j], va = a.r ? a.r[0] / a.r[1] : a.x, vb = t.r ? t.r[0] / t.r[1] : t.x; return `<option value="${vb / va}">${a.n} → ${t.n}</option>`; }).join('') : '');
  return `<details class="tool" open><summary>📖 Brocot's table: best fractions near a number</summary>
    <div class="row" style="margin-top:8px"><select id="bSel">${opts}</select><input id="bX" class="mono" style="width:170px"><span class="note">Max numerator/denominator</span><input id="bMax" class="mono" type="number" value="20000" style="width:90px"></div>
    <div class="note" style="margin-top:6px">Every fraction p/q here is the closest possible with a denominator that small. To build one, split p and q into factors that make gear sizes: p = drivers multiplied together, q = driven gears multiplied together. Gears can be scaled: 3/7 is the same mesh as 24/56.</div>
    <div id="bOut"></div></details>`;
}
function wireBrocot(c) {
  const run = () => {
    const x = parseRatio($('bX').value), M = +$('bMax').value || 20000;
    if (!(x > 0)) { $('bOut').innerHTML = ''; return; }
    // Stern–Brocot walk: collect every mediant that improves the approximation.
    let a = [0, 1], b = [1, 0]; const out = []; let bestE = Infinity;
    for (let it = 0; it < 4000; it++) {
      const m = [a[0] + b[0], a[1] + b[1]]; if (m[0] > M || m[1] > M) break;
      const v = m[0] / m[1], e = Math.abs(v / x - 1) * 1e6;
      if (e < bestE) { bestE = e; out.push({ p: m[0], q: m[1], e }); }
      if (v < x) a = m; else if (v > x) b = m; else break;
    }
    $('bOut').innerHTML = `<table class="bt"><tr><th class="l">p / q</th><th>value</th><th>error</th><th class="l">p factors</th><th class="l">q factors</th></tr>${out.slice(-16).reverse().map(r => `<tr><td class="l">${r.p}/${r.q}</td><td>${(r.p / r.q).toPrecision(10)}</td><td>${fmtErr(r.e)}</td><td class="l">${factor(r.p).join('·') || 1}</td><td class="l">${factor(r.q).join('·') || 1}</td></tr>`).join('')}</table>`;
  };
  $('bSel').onchange = () => { $('bX').value = (+$('bSel').value).toPrecision(12); run(); };
  $('bX').oninput = run; $('bMax').oninput = run;
  $('bSel').onchange();
}

// ---------- drawing ----------
const cv = () => $('cv');
function sizeCanvas() { const c = cv(); if (!c) return; const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1; c.width = r.width * dpr; c.height = r.height * dpr; }
addEventListener('resize', sizeCanvas);
const HUES = [38, 200, 140, 280, 10, 170, 60, 320, 100, 230];
function gearPath(g, x, y, teeth, r, ang) {
  const n = teeth, depth = Math.max(1.5, r * .09), ro = r + depth / 2, ri = r - depth / 2;
  g.beginPath();
  for (let i = 0; i < n; i++) {
    const a0 = ang + i / n * Math.PI * 2, s = Math.PI * 2 / n;
    const pts = [[ri, a0], [ro, a0 + s * .2], [ro, a0 + s * .5], [ri, a0 + s * .7]];
    pts.forEach(([rr, aa], j) => { const px = x + rr * Math.cos(aa), py = y + rr * Math.sin(aa); if (!i && !j) g.moveTo(px, py); else g.lineTo(px, py); });
  }
  g.closePath();
}
let t0 = performance.now();
function draw(now) {
  requestAnimationFrame(draw);
  const c = cv(); if (!c || !R) return;
  const g = c.getContext('2d'), W = c.width, H = c.height, d = design(), ax = d.ax;
  g.clearRect(0, 0, W, H);
  // layout in tooth units, alternating up/down so compound gears don't overlap the next train
  const rad = t => t * .5 + 2;
  const pos = [[0, 0]]; let ang = -0.35;
  for (let k = 1; k < ax.length; k++) {
    const drv = ax[k - 1].o ?? ax[k - 1].i, dist = rad(drv) + rad(ax[k].i);
    ang = k % 2 ? 0.45 : -0.45;
    pos.push([pos[k - 1][0] + dist * Math.cos(ang), pos[k - 1][1] + dist * Math.sin(ang)]);
  }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  ax.forEach((a, k) => { const r = Math.max(rad(a.o || 0), rad(a.i || 0)) + 3; x0 = Math.min(x0, pos[k][0] - r); x1 = Math.max(x1, pos[k][0] + r); y0 = Math.min(y0, pos[k][1] - r); y1 = Math.max(y1, pos[k][1] + r); });
  const sc = Math.min((W - 40) / (x1 - x0), (H - 50) / (y1 - y0), 4 * (devicePixelRatio || 1));
  const ox = (W - (x1 - x0) * sc) / 2 - x0 * sc, oy = (H - (y1 - y0) * sc) / 2 - y0 * sc + 8;
  const time = (now - t0) / 1000, base = 0.25; // motor: a quarter turn per real second
  const c0 = com();
  ax.forEach((a, k) => {
    const A = R.axles[k], spd = Number(A.p) / Number(A.q) * A.sign;
    const th = time * base * spd * Math.PI * 2;
    const x = ox + pos[k][0] * sc, y = oy + pos[k][1] * sc, hue = HUES[k % HUES.length];
    const list = [];
    if (k > 0) list.push(['i', a.i]);
    if (a.o != null && (k === 0 || k < ax.length - 1)) list.push(['o', a.o]);
    list.sort((p, q) => q[1] - p[1]);
    list.forEach(([f, t], j) => {
      const r = rad(t) * sc, bad = R.bad.has(t);
      // offset each gear by half a tooth so that neighbouring teeth look interleaved
      const phase = f === 'i' && k % 2 ? Math.PI / t : 0;
      gearPath(g, x, y, Math.min(t, 240), r, th + phase);
      g.fillStyle = bad ? '#5a2020' : `hsla(${hue},45%,${j ? 52 : 38}%,${j ? .95 : .85})`;
      g.fill(); g.strokeStyle = bad ? '#ff6b6b' : `hsla(${hue},60%,70%,.9)`; g.lineWidth = 1; g.stroke();
      if (r > 18) { g.fillStyle = '#0008'; g.font = `${Math.min(14, r * .35)}px ui-monospace,monospace`; g.textAlign = 'center'; g.fillText(t, x + (r * .6) * Math.cos(-Math.PI / 2), y + (r * .6) * Math.sin(-Math.PI / 2) + 4); }
    });
    // hand / pointer
    const hand = c0.T.map((t, j) => R.T[j]?.k === k && R.T[j].ok ? t.n : null).filter(Boolean);
    const L = rad(Math.max(a.i || 0, a.o || 0)) * sc * .9;
    g.strokeStyle = hand.length ? '#5fd38d' : '#e8e6df'; g.lineWidth = hand.length ? 3 : 2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + L * Math.cos(th - Math.PI / 2), y + L * Math.sin(th - Math.PI / 2)); g.stroke();
    g.fillStyle = '#e8e6df'; g.beginPath(); g.arc(x, y, 3, 0, 7); g.fill();
    g.font = '11px ui-sans-serif,system-ui'; g.textAlign = 'center'; g.fillStyle = hand.length ? '#5fd38d' : '#8a8f9c';
    const lab = (k === 0 ? 'motor' : 'axle ' + k) + (hand.length ? ' · ' + hand.join(', ') : '');
    const yy = Math.max(12, Math.min(H - 4, y - Math.max(rad(a.i || 0), rad(a.o || 0)) * sc - 8));
    g.fillText(lab, x, yy);
  });
}
requestAnimationFrame(draw);

const help = () => RH.modal(`<h2>⚙️ Escapement</h2>
  <p>You are a clockmaker. Each commission asks for a gear train that turns a hand at an exact speed, or as close to the sky's speed as you can get.</p>
  <p>Two meshing gears trade speed for teeth: a 10-tooth gear driving a 40-tooth gear makes it turn 4× slower and the <b>other way round</b>. Put two gears on one axle (a <b>compound</b> axle) to multiply reductions.</p>
  <p>Act I teaches the basics, Act II gives you awkward parts, Act III asks for the irrational ratios of the solar system, and Act IV wants several hands from one train, ending with the Antikythera mechanism.</p>
  <p class="dim">Stars: fewer gears than par for exact work, smaller error (in parts per million) for astronomical work.</p>`, [{ label: 'Open the workshop' }]);
$('helpBtn').onclick = help;
if (!S.intro) { S.intro = 1; persist(); help(); }
open(cur);
window.__esc = { C, S, analyse, open, design, render, get R() { return R; } };
</script>
