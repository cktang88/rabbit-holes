<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiln</title>
<meta name="description" content="Glaze chemistry: mix oxides, program the kiln, and open the door on what the fire made.">
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ======== World: a potter's studio at the mouth of a kiln. Bisque test tiles, a clay-dusted recipe card pinned
   by the wheel, and a kiln controller whose orange LEDs count the heat. Ink is iron-brown; the accent is ember. ======== */
:root{--bisque:#e4d9c6;--bisque2:#d6c8af;--grog:#b9a78a;--ink:#2a2018;--ink2:#6e5c49;--char:#17120f;--char2:#221b16;--ember:#d9572a;--ember2:#f08a3c;--led:#ff7a35;--cel:#7fa694;--kaki:#9a4a24;
  --mono:"IBM Plex Mono",ui-monospace,monospace;--serif:"Shippori Mincho","Hiragino Mincho ProN",Georgia,serif;font-family:var(--serif)}
html,body{margin:0;height:100%;overflow:hidden;background:#120e0b;color:var(--ink);font-family:var(--serif);-webkit-tap-highlight-color:transparent}
#gl,#c2d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 40% 55%,transparent 45%,rgba(8,5,3,.55) 100%)}
#c2d{background:radial-gradient(ellipse at 50% 60%,#3a2c22,#120e0b 75%)}
button{font-family:var(--serif);border-radius:2px}
/* top bar: transparent strip, only its children catch the pointer */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:20;pointer-events:none;background:none;border:0}
.top>*{pointer-events:auto}
.top a.home{color:#cdbfa9;text-decoration:none;font-size:14px;text-shadow:0 1px 2px #000;white-space:nowrap}
.top h1{margin:0 0 0 4px;font-weight:800;font-size:22px;letter-spacing:.42em;color:#f1e6d3;text-shadow:0 1px 8px #000a}
.top .spacer{flex:1;pointer-events:none}
.tb{background:rgba(23,18,15,.55);border:1px solid #6b5947;color:#eadcc5;min-height:34px;min-width:34px;padding:0 10px;font-size:14px;cursor:pointer;letter-spacing:.06em}
.tb:hover{border-color:#e9d9bf}
.tb .n{font-family:var(--mono);font-size:11px;opacity:.7;margin-left:4px}
/* bisque: the material every panel is made of */
.bisque{background:
  radial-gradient(circle at 20% 30%,rgba(120,92,62,.10) 0 1px,transparent 1.5px) 0 0/7px 9px,
  radial-gradient(circle at 70% 60%,rgba(90,64,40,.13) 0 .8px,transparent 1.3px) 0 0/11px 6px,
  radial-gradient(circle at 40% 80%,rgba(255,255,255,.35) 0 .8px,transparent 1.4px) 0 0/13px 10px,
  linear-gradient(170deg,#e9dfcd,#dccfb8);box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),inset 0 -14px 30px rgba(120,90,60,.10),0 8px 30px rgba(0,0,0,.45);border:1px solid #a8957a}
/* the commission ticket, pinned top-left */
#ticket{position:fixed;left:12px;top:52px;z-index:12;width:min(360px,calc(100vw - 24px));padding:10px 12px 10px 12px;display:grid;grid-template-columns:44px 1fr;gap:4px 10px;cursor:pointer;color:var(--ink)}
#ticket .sw{grid-row:span 2;width:44px;height:44px;border-radius:50%;box-shadow:inset 0 -6px 10px rgba(0,0,0,.25),inset 0 4px 6px rgba(255,255,255,.35),0 1px 0 #fff8;border:1px solid #8d7a61}
#ticket .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
#ticket .tt{font-size:18px;font-weight:800;line-height:1.1}
#ticket .ask{grid-column:1/-1;font-size:14px;line-height:1.35;color:#3b2f24;display:none;margin-top:4px}
#ticket.open .ask{display:block}
#ticket .want{grid-column:1/-1;font-size:12px;color:var(--ink2);display:none;font-family:var(--mono)}
#ticket.open .want{display:block}
#ticket .seals{position:absolute;right:10px;top:8px;font-family:var(--mono);font-size:12px;letter-spacing:.2em;color:var(--kaki)}
/* the bench: recipe card + kiln controller */
#bench{position:fixed;z-index:14;display:flex;flex-direction:column;color:var(--ink)}
#bench .tabs{display:flex;gap:0;border-bottom:1px solid #a8957a}
#bench .tabs button{flex:1;background:none;border:0;border-right:1px solid rgba(168,149,122,.6);min-height:38px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer;letter-spacing:.08em}
#bench .tabs button.on{color:var(--ink);background:rgba(255,255,255,.35);box-shadow:inset 0 -3px 0 var(--ember)}
#bench .tabs button.hide{display:none}
#bench .tabs .exp{flex:0 0 42px;font-size:16px}
.pane{overflow-y:auto;overflow-x:hidden;padding:8px 12px;flex:1;min-height:0;overscroll-behavior:contain}
.pane[hidden]{display:none}
.row2{display:grid;grid-template-columns:22px minmax(0,1fr) 92px 46px 30px;align-items:center;gap:6px;min-height:40px;border-bottom:1px dashed rgba(110,92,73,.25)}
.jar{width:20px;height:22px;border-radius:3px 3px 5px 5px;border:1px solid rgba(60,40,25,.45);box-shadow:inset 0 3px 0 rgba(255,255,255,.4),inset 0 -4px 6px rgba(0,0,0,.18)}
.row2 .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row2 .nm small{font-family:var(--mono);font-size:10px;color:var(--ink2);margin-left:4px}
.row2 .v{font-family:var(--mono);font-size:14px;text-align:right}
.row2 .x{background:none;border:1px solid transparent;color:var(--ink2);min-width:30px;min-height:30px;cursor:pointer;font-size:16px;padding:0}
.row2 .x:hover{border-color:#a8957a}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:none;border:0;padding:0;border-radius:0;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(#a08b6f,#c4b294);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(#a08b6f,#c4b294)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;margin-top:-7px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 35% 30%,#fff9,transparent 40%),var(--thumb,#7a4a2a);border:1px solid #3a2414;box-shadow:0 2px 3px rgba(0,0,0,.35)}
input[type=range]::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--thumb,#7a4a2a);border:1px solid #3a2414}
.addjar{margin:8px 0 2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{background:rgba(255,255,255,.4);border:1px solid #a8957a;color:var(--ink);min-height:34px;padding:0 12px;font-size:14px;cursor:pointer}
.btn:hover{background:rgba(255,255,255,.65)}
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:6px;margin:6px 0}
.picker button{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.35);border:1px solid #b5a284;min-height:36px;font-size:13px;text-align:left;padding:2px 6px;cursor:pointer;color:var(--ink)}
.picker button .jar{flex:0 0 16px;height:18px}
.picker button.new{box-shadow:0 0 0 2px var(--ember)}
.strip{display:inline-flex;margin-left:6px;vertical-align:middle;gap:1px}.strip i{display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 -1px 2px rgba(0,0,0,.3),0 0 0 .5px rgba(60,40,25,.35)}
.picker button .strip{margin-left:4px}
.row2 .nm,.row2 .jar{cursor:help}
.info{font-size:13px;line-height:1.35;color:#3b2f24;background:rgba(255,255,255,.45);border-left:3px solid var(--ember);padding:5px 8px;margin:2px 0 4px}
.prevbox{display:flex;gap:10px;align-items:center;padding:4px 0 8px;border-bottom:1px solid rgba(110,92,73,.3);margin-bottom:4px;font-size:13px}
.prevbox canvas{width:44px;height:59px;flex:0 0 44px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.pred{font-size:13px;color:var(--ink);line-height:1.3;margin-top:2px}
.predrow{display:flex;gap:8px;align-items:center;margin:-2px 0 6px}.predrow canvas{width:28px;height:37px;flex:0 0 28px}.predrow .pred{color:#ffd9b8;font-size:12.5px}
.why{font-size:11.5px;line-height:1.3;color:#ad9a82;margin:-4px 0 4px 2px;transition:color .2s}
.why.live{color:#ffd9b8}
.mini canvas.prev{width:18px;height:24px;flex:0 0 18px;margin-right:6px}
.unity{font-family:var(--mono);font-size:11.5px;color:var(--ink2);line-height:1.5;margin-top:8px;padding-top:6px;border-top:1px solid rgba(110,92,73,.3)}
.unity b{color:var(--ink);font-weight:500}
/* the kiln controller: a black box with LED digits */
#kilnPane{background:linear-gradient(#211a15,#17120f);color:#d9c9b0}
.ctl{display:grid;grid-template-columns:70px minmax(0,1fr) 82px;align-items:center;gap:8px;min-height:38px}
.ctl label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#a89478}
.ctl .v{font-family:var(--mono);font-size:15px;color:var(--led);text-shadow:0 0 6px rgba(255,110,40,.6);text-align:right;white-space:nowrap}
.ctl input[type=range]::-webkit-slider-runnable-track{background:linear-gradient(#0c0907,#2e251e);box-shadow:inset 0 1px 2px #000}
.ctl input[type=range]{--thumb:#c9b79c}
#curve{width:100%;height:108px;display:block;border:1px solid #3d3229;background:#0e0b09;margin-bottom:6px}
.seg{display:flex;border:1px solid #5d4c3c;margin:4px 0}
.seg button{flex:1;background:none;border:0;border-right:1px solid #5d4c3c;color:#bda98b;min-height:34px;font-size:13px;cursor:pointer;letter-spacing:.05em}
.seg button:last-child{border-right:0}
.seg button.on{background:#3a2c20;color:#ffd9b8;box-shadow:inset 0 -2px 0 var(--led)}
.seg button:disabled{opacity:.35}
.note{font-size:12px;color:#9c8770;margin:4px 0;line-height:1.35}
#glazePane .note{color:var(--ink2)}
/* fire row */
.fire{display:flex;gap:8px;padding:8px 10px;border-top:1px solid #a8957a;align-items:stretch;background:rgba(0,0,0,.04)}
.fire .modes{display:flex;flex:1;border:1px solid #a8957a;min-width:0}
.fire .modes button{flex:1;background:none;border:0;border-right:1px solid #c2b092;font-size:12.5px;min-height:44px;cursor:pointer;color:var(--ink2);padding:0 2px;line-height:1.1}
.fire .modes button:last-child{border-right:0}
.fire .modes button.on{background:rgba(255,255,255,.55);color:var(--ink);font-weight:600;box-shadow:inset 0 -3px 0 var(--ink)}
.fire .modes button small{display:block;font-family:var(--mono);font-size:10px;opacity:.75;font-weight:400}
#fireBtn{flex:0 0 96px;background:radial-gradient(ellipse at 50% 0%,#f6a35c,#d9572a 55%,#9b3416);color:#fff3e3;border:1px solid #6d230e;font-weight:800;font-size:18px;letter-spacing:.22em;cursor:pointer;text-shadow:0 1px 2px #5a1a08;box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 3px 10px rgba(217,87,42,.45)}
#fireBtn:disabled{filter:grayscale(.7) brightness(.8);cursor:default}
#fireBtn.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),0 0 22px 6px rgba(240,138,60,.7)}}
.mini{display:none;padding:6px 12px;font-family:var(--mono);font-size:12px;color:var(--ink2);gap:6px;flex-wrap:nowrap;overflow:hidden;white-space:nowrap}
.mini .chip{display:inline-flex;align-items:center;gap:4px;margin-right:8px}
.mini .chip .jar{width:12px;height:14px}
/* the kiln controller readout while firing */
#led{position:fixed;left:50%;top:54px;transform:translateX(-50%);z-index:16;font-family:var(--mono);color:var(--led);font-size:30px;letter-spacing:.08em;text-shadow:0 0 10px rgba(255,100,30,.8),0 0 2px #fff3;background:rgba(10,7,5,.78);border:1px solid #4d3a2a;padding:4px 14px;display:none;pointer-events:none;white-space:nowrap}
#led small{font-size:13px;color:#c79a74;margin-left:10px;text-shadow:none}
/* result card */
#result{position:fixed;z-index:18;display:none;color:var(--ink);padding:12px 14px;max-height:calc(100% - 120px);overflow:auto}
#result.show{display:block;animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
#result h3{margin:0 0 6px;font-size:17px;font-weight:800}
#result .lik{display:flex;align-items:center;gap:12px}
#result .dial{width:64px;height:64px;flex:0 0 64px}
#result ul{margin:6px 0 6px 18px;padding:0;font-size:14px;line-height:1.35}
#result .axes{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0;font-family:var(--mono);font-size:12px}
#result .axes div{border:1px solid #b5a284;padding:4px 6px;background:rgba(255,255,255,.3)}
#result .axes b{display:block;font-size:15px;font-weight:500}
#result .axes .good{box-shadow:inset 0 -3px 0 #6b8f5a}
#result .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#result .x{position:absolute;right:6px;top:4px;background:none;border:0;font-size:20px;min-width:32px;min-height:32px;cursor:pointer;color:var(--ink2)}
.stamp{display:inline-block;border:3px double #a8271a;color:#a8271a;font-weight:800;letter-spacing:.2em;padding:2px 10px;transform:rotate(-6deg);font-size:16px;margin-left:auto;opacity:.9}
.stamp.no{border-color:#6e5c49;color:#6e5c49}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:6px 0}
.tiles button{background:none;border:0;padding:0;cursor:pointer;text-align:center;font-family:var(--mono);font-size:11px;color:var(--ink2);min-height:30px}
.tiles canvas{width:100%;display:block;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}
.tiles button.best canvas{outline:2px solid var(--ember);outline-offset:2px}
/* drawer: the shelf of fired tiles, the commission book, Seger's chart */
#drawer{position:fixed;inset:0;z-index:30;display:none;background:rgba(12,9,7,.55)}
#drawer.show{display:block}
#drawer .sheet{position:absolute;right:0;top:0;bottom:0;width:min(560px,100vw);display:flex;flex-direction:column;color:var(--ink)}
#drawer .head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid #a8957a}
#drawer .head .tabs2{display:flex;gap:4px;flex:1}
#drawer .head .tabs2 button{min-height:36px}
#drawer .head .tabs2 button.on{background:rgba(255,255,255,.7);box-shadow:inset 0 -3px 0 var(--ember)}
#drawer .body{overflow:auto;padding:10px 12px;flex:1}
.shelfrow{border-bottom:6px solid #6e573f;box-shadow:0 6px 0 #4a3a2a;margin:0 0 22px;padding:4px 2px 2px}
.shelfrow h4{margin:0 0 4px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink2)}
.book li{list-style:none;border-bottom:1px dashed rgba(110,92,73,.35);padding:8px 2px;display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;cursor:pointer}
.book ul{padding:0;margin:0}
.book li.lock{opacity:.5;cursor:default}
.book li .k{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.book li .t{font-weight:600}
.book li .t small{display:block;font-weight:400;font-size:12px;color:var(--ink2)}
.book li .s{font-family:var(--mono);color:var(--kaki);letter-spacing:.15em}
.book li.cur{background:rgba(255,255,255,.35)}
#chart{width:100%;display:block;border:1px solid #a8957a;background:#f3ecdf}
.detail{font-family:var(--mono);font-size:12.5px;line-height:1.5}
.toast-wrap{bottom:auto;top:96px}
.toast{background:#efe5d3;color:var(--ink);border:1px solid #a8957a;border-radius:2px;font-family:var(--serif)}
.modal{background:#e9dfcd;color:var(--ink);border-radius:2px;border:1px solid #a8957a;font-family:var(--serif)}
.modal button{background:rgba(255,255,255,.4);color:var(--ink);border:1px solid #a8957a;border-radius:2px}
.modal button.primary{background:var(--ember);color:#fff;border-color:#7a2a10}
/* ---------- layouts ---------- */
/* desktop and tablets: the bench is a column on the right */
@media (min-width:900px){
  #bench{right:12px;top:52px;bottom:12px;width:372px}
  #result{left:12px;bottom:12px;width:min(400px,calc(100vw - 420px))}
}
/* phones, portrait: the bench is a sheet along the bottom, folded down until you open it */
@media (max-width:899px) and (min-aspect-ratio:1/100) and (max-aspect-ratio:1/1){
  #bench{left:0;right:0;bottom:0;max-height:60vh;border-left:0;border-right:0;border-bottom:0}
  #bench.fold .pane{display:none}
  #bench.fold .mini{display:flex}
  #ticket{top:46px;left:8px;width:calc(100vw - 16px);grid-template-columns:34px 1fr;padding:6px 10px}
  #ticket .sw{width:34px;height:34px}
  #ticket .tt{font-size:16px}
  #result{left:8px;right:8px;bottom:8px;max-height:58vh}
  .top h1{font-size:17px;letter-spacing:.28em}
  .top a.home{font-size:12.5px}
  .top{gap:6px;padding:8px 8px}
  .tb{padding:0 7px;font-size:13px}
  #led{top:auto;bottom:calc(var(--benchH,150px) + 10px);font-size:24px}
}
/* phones on their side: a narrow column on the right */
@media (max-width:899px) and (min-aspect-ratio:1/1){
  #bench{right:0;top:0;bottom:0;width:min(29vw,300px);border-right:0;border-top:0;border-bottom:0}
  #bench .fire{flex-wrap:wrap}
  #bench .fire .modes{flex:1 1 100%}
  #bench .fire #fireBtn{flex:1 1 100%;min-height:42px}
  .row2{grid-template-columns:18px minmax(0,1fr) 64px 38px 30px;gap:4px}
  .row2 .nm{font-size:12.5px}
  #ticket{top:44px;width:min(230px,calc(60vw - 24px));padding:4px 8px;grid-template-columns:26px 1fr}
  #ticket .sw{width:28px;height:28px}
  #ticket .tt{font-size:14px}
  #ticket .who{display:none}
  #result{left:8px;bottom:8px;width:calc(71vw - 24px);max-height:calc(100vh - 60px)}
  .top{right:30vw}
  .top h1{display:none}
  .top h1{font-size:16px}
}
@media (prefers-reduced-motion:reduce){#fireBtn.pulse{animation:none}#result.show{animation:none}}
</style>
</head>
<body>
<div id="vig" aria-hidden="true"></div>
<canvas id="gl" aria-label="The kiln: drag to turn the pot, pinch or scroll to zoom"></canvas>
<header class="top"><a class="home" href="../index.html">← Rabbit Holes</a><h1>KILN</h1><span class="spacer"></span>
  <button class="tb" id="bookBtn" title="The commission book">Book</button><button class="tb" id="shelfBtn" title="Your shelf of fired tiles">Shelf<span class="n" id="shelfN"></span></button><button class="tb" id="muteBtn" title="Sound">♪</button></header>
<section id="ticket" class="bisque" aria-live="polite"></section>
<aside id="bench" class="bisque">
  <nav class="tabs" id="tabs"><button data-tab="A" class="on">Glaze A</button><button data-tab="B" class="hide">B</button><button data-tab="C" class="hide">C</button><button data-tab="K">Kiln</button><button class="exp" id="expBtn" title="Open the bench">▴</button></nav>
  <div class="mini" id="mini"></div>
  <div class="pane" id="glazePane"></div>
  <div class="pane" id="kilnPane" hidden></div>
  <div class="fire"><div class="modes" id="modes"></div><button id="fireBtn" class="pulse">FIRE</button></div>
</aside>
<div id="led"></div>
<section id="result" class="bisque"></section>
<div id="drawer"><div class="sheet bisque"><div class="head"><div class="tabs2" id="dtabs"></div><button class="btn" id="dclose" title="Close">✕</button></div><div class="body" id="dbody"></div></div></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
// ======================================================================================================
//  GLAZE CHEMISTRY. Pure functions, no DOM: recipe (weights of raw materials) -> oxide analysis -> unity
//  (Seger) formula -> what a firing schedule does to it. Every visual property of the fired pot comes out of
//  this: melt, gloss, opacity, colour as light passes through glass of a given thickness over a clay body,
//  iron saturation, copper colloids, zinc-silicate crystals, expansion mismatch, crawling and pinholes.
// ======================================================================================================
const KILN = (() => {
  const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x, sm = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
  const MW = { SiO2: 60.08, Al2O3: 101.96, B2O3: 69.62, Li2O: 29.88, Na2O: 61.98, K2O: 94.2, MgO: 40.3, CaO: 56.08, SrO: 103.62, BaO: 153.33, ZnO: 81.38,
    Fe2O3: 159.69, CuO: 79.55, CoO: 74.93, MnO: 70.94, Cr2O3: 151.99, SnO2: 150.71, ZrO2: 123.22, TiO2: 79.87 };
  const OX = Object.keys(MW), FLUX = ['Li2O', 'Na2O', 'K2O', 'MgO', 'CaO', 'SrO', 'BaO', 'ZnO'];
