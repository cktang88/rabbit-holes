<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Evolution Tank</title>
<meta name="description" content="Set a few conditions on a glowing tide pool and watch life evolve by itself: speciation, hunters and hunted, armour, eyes and giants.">
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400;1,9..144,600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ======== World: a naturalist's tide-pool tank at the edge of the sea. Brass fittings on black lacquer, a field guide
   on cream rag paper, Latin in iron-gall ink. The water is the only light source; the chrome stays out of its way. ======== */
:root{--sea:#04090b;--lac:#0b1a1e;--lac2:#10262b;--brass:#c9a45c;--brass2:#8a6d36;--cream:#efe6cf;--paper:#f3ead4;--paper2:#e6d8b8;--ink:#2a2217;--ink2:#6b5b43;
  --glow:#8ff5e2;--coral:#ff8f6b;--moss:#9ccf6a;--serif:"Fraunces",Georgia,serif;--mono:"DM Mono",ui-monospace,monospace;font-family:var(--serif)}
html,body{margin:0;height:100%;overflow:hidden;background:var(--sea);color:var(--cream);font-family:var(--serif);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#gl,#c2d{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:crosshair}
#c2d{background:#06161a}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 80% 75% at 50% 48%,transparent 55%,rgba(2,6,8,.55) 100%)}
body.tool #gl,body.tool #c2d{cursor:cell}
button{font-family:var(--serif);border-radius:1px}
/* brass-on-lacquer controls */
.b{background:linear-gradient(180deg,rgba(22,44,50,.82),rgba(8,20,24,.86));border:1px solid var(--brass2);color:var(--cream);min-height:36px;min-width:36px;padding:0 10px;font-size:14px;cursor:pointer;letter-spacing:.03em;
  box-shadow:inset 0 1px 0 rgba(255,236,190,.12),0 2px 8px rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.b:hover{border-color:var(--brass);color:#fff8e6}
.b.on{border-color:var(--brass);background:linear-gradient(180deg,rgba(201,164,92,.32),rgba(120,92,40,.25));color:#fff3d4}
.b:disabled,.b.locked{opacity:.45;cursor:default}
.b .g{font-size:16px;line-height:1;opacity:.95}
.b small{font-family:var(--mono);font-size:10.5px;opacity:.7}
/* top: home, name, clock */
.top{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:8px 12px;z-index:20;pointer-events:none}
.top>*{pointer-events:auto}
.top a.home{color:#bcd3cf;text-decoration:none;font-size:14px;text-shadow:0 1px 3px #000;white-space:nowrap}
.top h1{margin:0 0 0 4px;font-weight:300;font-style:italic;font-size:22px;letter-spacing:.02em;color:#f2ecd8;text-shadow:0 1px 10px #000c;white-space:nowrap}
.top .spacer{flex:1;pointer-events:none}
#clock{font-family:var(--mono);font-size:12px;color:#cfe3dc;text-shadow:0 1px 3px #000;text-align:right;line-height:1.35;white-space:nowrap}
#clock b{font-weight:500;color:#fff2cf}
#muteBtn{min-width:34px;min-height:34px;padding:0}
/* the dock: a brass rail along the bottom of the tank */
#dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:22;display:flex;gap:10px;align-items:flex-end;max-width:calc(100vw - 16px)}
#dock .grp{display:flex;gap:0}
#dock .grp .b{border-right-width:0}
#dock .grp .b:last-child{border-right-width:1px}
#dock .tools{position:relative}
#tray{display:flex}
#trayBtn{display:none}
.lock{font-size:11px;opacity:.8}
#guideBtn b{font-family:var(--mono);font-weight:400;font-size:11px;color:var(--glow)}
/* ticker: the naturalist's running notes */
#ticker{position:fixed;left:14px;bottom:62px;z-index:15;pointer-events:none;display:flex;flex-direction:column;gap:3px;max-width:min(460px,calc(100vw - 28px))}
#ticker div{font-size:14px;color:#e9f3ee;text-shadow:0 1px 4px #000,0 0 12px #000a;animation:tin .4s ease-out;transition:opacity 1.2s}
#ticker div.old{opacity:0}
#ticker i{color:#fff3cf}
#hint{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:15;pointer-events:none;font-size:15px;font-style:italic;color:#eaf6f0;text-shadow:0 1px 6px #000;opacity:0;transition:opacity .8s;white-space:nowrap}
#hint.show{opacity:.92}
/* paper: the material of the field guide, the specimen card and the tree */
.paper{color:var(--ink);background:
  radial-gradient(circle at 18% 22%,rgba(120,90,50,.07) 0 1px,transparent 1.6px) 0 0/9px 11px,
  radial-gradient(circle at 70% 60%,rgba(90,70,40,.06) 0 .8px,transparent 1.3px) 0 0/13px 7px,
  radial-gradient(ellipse at 30% 0%,rgba(255,255,255,.35),transparent 60%),
  linear-gradient(172deg,#f5ecd6,#e9dcbc);box-shadow:0 10px 34px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.4),inset 0 -20px 40px rgba(120,90,50,.08);border:1px solid #b39d72}
.paper h2,.paper h3{font-weight:500;margin:0}
.lat{font-style:italic}
.x{position:absolute;right:4px;top:4px;background:none;border:0;font-size:22px;min-width:36px;min-height:36px;cursor:pointer;color:var(--ink2);line-height:1}
/* the tree panel */
#treeP{position:fixed;right:12px;top:54px;bottom:66px;width:300px;z-index:14;display:flex;flex-direction:column;padding:10px 10px 8px}
#treeP[hidden]{display:none}
#treeP h3{font-size:15px;letter-spacing:.04em;display:flex;align-items:baseline;gap:6px}
#treeP h3 small{font-family:var(--mono);font-size:10.5px;color:var(--ink2);font-weight:400}
#treeC{flex:1;min-height:0;width:100%;display:block;margin-top:6px;cursor:pointer}
#popC{width:100%;height:74px;display:block;border-top:1px solid rgba(110,90,60,.3);margin-top:4px}
.legend{font-family:var(--mono);font-size:10.5px;color:var(--ink2);display:flex;gap:10px;margin-top:2px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:3px;font-style:normal}
/* the specimen card (inspector) */
#insp{position:fixed;left:12px;top:54px;width:330px;max-height:calc(100% - 128px);overflow:auto;z-index:16;padding:12px 14px;display:none;overscroll-behavior:contain}
#insp.show{display:block;animation:rise .3s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{transform:translateY(14px);opacity:0}}
#insp .hd{display:flex;gap:10px;align-items:center;padding-right:28px}
#insp .hd .sw{width:14px;height:14px;border-radius:50%;flex:0 0 14px;box-shadow:0 0 0 2px rgba(255,255,255,.6),0 0 0 3px rgba(80,60,30,.4)}
#insp .nm{font-size:19px;line-height:1.1}
#insp .role{font-size:13px;color:var(--ink2);margin:3px 0 6px}
#portrait{width:100%;height:120px;display:block}
.bars{display:grid;grid-template-columns:62px 1fr;gap:3px 8px;font-size:12px;align-items:center;margin:6px 0}
.bars span{color:var(--ink2);font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.bar{height:7px;background:rgba(110,90,60,.15);position:relative;border-radius:1px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#6b8f7a,#3b6a5a);border-radius:1px}
.bar.diet i{background:linear-gradient(90deg,#7aa257,#b4583f)}
#brainC{width:100%;height:150px;display:block;margin:4px 0}
.bio{font-size:13.5px;line-height:1.45;margin:6px 0}
.bio p{margin:2px 0}
.chain{display:flex;flex-wrap:wrap;gap:3px;font-size:12px;margin:6px 0}
.chain span{border:1px solid rgba(110,90,60,.35);padding:1px 6px;font-style:italic;cursor:pointer}
.chain span:hover{background:rgba(255,255,255,.5)}
.chain em{opacity:.5;font-style:normal}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pb{background:rgba(255,255,255,.35);border:1px solid #a8916a;color:var(--ink);min-height:34px;padding:0 12px;font-size:14px;cursor:pointer}
.pb:hover{background:rgba(255,255,255,.65)}
.pb.on{background:#2f4a44;color:#f3ead4;border-color:#2f4a44}
.sec{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);margin-top:8px;border-top:1px solid rgba(110,90,60,.25);padding-top:5px}
/* tank conditions: brass valves on a lacquer plate */
#sheet{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);width:min(460px,calc(100vw - 20px));z-index:24;padding:12px 16px 14px;display:none;color:var(--cream);
  background:linear-gradient(180deg,#10262b,#081518);border:1px solid var(--brass2);box-shadow:0 12px 40px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,236,190,.1);max-height:calc(100% - 130px);overflow:auto}
#sheet.show{display:block;animation:rise .25s ease-out}
#sheet h3{margin:0 0 6px;font-weight:500;font-size:16px;letter-spacing:.04em}
#sheet .x{color:#cdb98d}
.knob{display:grid;grid-template-columns:104px 1fr 64px;align-items:center;gap:8px;min-height:36px}
.knob label{font-size:14px}
.knob .v{font-family:var(--mono);font-size:11.5px;color:var(--glow);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:32px;background:none;border:0;padding:0;margin:0;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,#3e5a52,#8a6d36);border-radius:2px;box-shadow:inset 0 1px 2px #000}
input[type=range]::-moz-range-track{height:4px;background:linear-gradient(90deg,#3e5a52,#8a6d36)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;margin-top:-9px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c8,#c9a45c 45%,#6d5226);border:1px solid #3a2a10;box-shadow:0 2px 4px rgba(0,0,0,.5)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2c8,#c9a45c 45%,#6d5226);border:1px solid #3a2a10}
.seg{display:flex;border:1px solid var(--brass2);margin:4px 0}
.seg button{flex:1;background:none;border:0;border-right:1px solid var(--brass2);color:#d9cfb6;min-height:34px;font-size:13.5px;cursor:pointer}
.seg button:last-child{border-right:0}
.seg button.on{background:rgba(201,164,92,.28);color:#fff3d4}
.note{font-size:12.5px;color:#9fb6ae;line-height:1.4;margin:4px 0}
.row3{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#chart{width:100%;height:80px;display:block;margin-top:6px}
/* the field guide: a book of plates */
#book{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(2,6,8,.62)}
#book.show{display:flex}
#book .pg{position:relative;width:min(980px,calc(100vw - 20px));max-height:calc(100% - 30px);overflow:auto;padding:22px 26px 26px;overscroll-behavior:contain}
#book h2{font-size:28px;font-weight:300;font-style:italic}
#book .sub{font-size:13.5px;color:var(--ink2);margin:2px 0 14px}
.plates{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.plate{border:1px solid rgba(110,90,60,.35);padding:8px 10px 10px;background:rgba(255,255,255,.22);position:relative;min-height:220px}
.plate canvas{width:100%;height:120px;display:block}
.plate .no{position:absolute;right:8px;top:6px;font-family:var(--mono);font-size:10.5px;color:var(--ink2)}
.plate h4{margin:4px 0 0;font-size:15.5px;font-weight:500}
.plate .lat{font-size:13.5px;color:#3c3122}
.plate .when{font-family:var(--mono);font-size:10.5px;color:var(--ink2);margin-top:3px}
.plate.locked{background:rgba(110,90,60,.06)}
.plate.locked h4{color:#7d6c52}
.plate.locked .hint{font-size:13.5px;font-style:italic;color:var(--ink2);margin-top:2px}
.plate.fresh{box-shadow:0 0 0 2px #b4583f}
.share{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.share code{font-family:var(--mono);font-size:11.5px;background:rgba(255,255,255,.4);padding:4px 8px;border:1px solid rgba(110,90,60,.3);word-break:break-all}
/* a newly observed entry: a plate slides in and the watercolour paints itself */
#plate{position:fixed;right:16px;top:64px;width:min(300px,calc(100vw - 32px));z-index:30;padding:12px 14px;display:none;cursor:pointer}
#plate.show{display:block;animation:slidein .6s cubic-bezier(.2,.9,.3,1.15)}
@keyframes slidein{from{transform:translateX(30px) rotate(2deg);opacity:0}}
#plate .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#a1452e}
#plate h3{font-size:19px;margin:2px 0}
#plate canvas{width:100%;height:130px;display:block}
/* while you were away */
#away{position:fixed;inset:0;z-index:45;display:none;align-items:center;justify-content:center;background:rgba(2,6,8,.6)}
#away.show{display:flex}
#away .pg{position:relative;width:min(460px,calc(100vw - 24px));padding:18px 20px;max-height:calc(100% - 40px);overflow:auto}
#away h2{font-weight:300;font-style:italic;font-size:24px}
#away .prog{height:6px;background:rgba(110,90,60,.2);margin:12px 0}
#away .prog i{display:block;height:100%;width:0;background:#3b6a5a;transition:width .2s}
#away ul{margin:8px 0;padding-left:18px;font-size:14.5px;line-height:1.5}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.pz-bar{display:none!important}
/* phones: the dock folds its tools into a tray; panels become sheets from the bottom */
@media (max-width:760px){
  .top h1{font-size:18px}
  .top{gap:6px;padding:6px 8px}
  .top a.home{font-size:13px}
  #clock{font-size:11px}
  #muteBtn{display:none}
  #dock{gap:6px;width:calc(100vw - 16px);justify-content:space-between}
  #dock .b{padding:0 8px;font-size:13px}
  #dock .lbl{display:none}
  #trayBtn{display:inline-flex}
  #tray{display:none;position:absolute;bottom:44px;left:0;flex-direction:column;gap:4px}
  #tray.open{display:flex}
  #tray .b{border-right-width:1px!important;justify-content:flex-start;min-width:150px}
  #tray .lbl{display:inline}
  #treeP{left:8px;right:8px;width:auto;top:auto;bottom:64px;height:46%}
  #insp{left:8px;right:8px;width:auto;top:auto;bottom:64px;max-height:52%}
  #ticker{bottom:60px;left:10px}
  #ticker div{font-size:13px}
  #plate{top:auto;bottom:70px;right:8px}
  #book .pg{padding:16px 14px}
  .plates{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .plate{min-height:190px}.plate canvas{height:96px}
}
@media (max-height:500px){#treeP{top:50px;bottom:56px;height:auto}#insp{max-height:calc(100% - 110px)}}
</style>
</head>
<body>
<canvas id="gl" data-play aria-label="The tank"></canvas>
<div id="vig"></div>
<header class="top">
  <a class="home" href="../index.html">← Rabbit Holes</a>
  <h1>Evolution Tank</h1>
  <div class="spacer"></div>
  <div id="clock" aria-live="off"></div>
  <button class="b" id="muteBtn" title="Sound" aria-label="Sound on or off">♪</button>
</header>
<div id="hint"></div>
<div id="ticker" aria-live="polite"></div>
<nav id="dock">
  <div class="grp" id="timeGrp">
    <button class="b" id="playBtn" title="Pause or play (space)" aria-label="Pause">❚❚</button>
    <button class="b" data-sp="1" title="Real time">1×</button>
    <button class="b" data-sp="2" title="Four times">4×</button>
    <button class="b" data-sp="3" title="Sixteen times">16×</button>
    <button class="b" data-sp="4" title="Time-lapse: as fast as this device can go">⏩</button>
  </div>
  <div class="grp tools">
    <button class="b" id="trayBtn" aria-label="Nudges"><span class="g">✦</span></button>
    <div id="tray">
      <button class="b" data-tool="bloom" title="Drop a food bloom where you tap"><span class="g">❀</span><span class="lbl">Bloom</span></button>
      <button class="b" data-tool="wall" title="Put a glass divider in (or lift one out)"><span class="g">▮</span><span class="lbl">Divider</span></button>
      <button class="b" data-tool="newcomer" title="Introduce a newcomer from another tank"><span class="g">✧</span><span class="lbl">Newcomer</span></button>
      <button class="b" data-tool="climate" title="Shift the climate"><span class="g">☼</span><span class="lbl">Climate</span></button>
      <button class="b" data-tool="asteroid" title="An extinction event"><span class="g">☄</span><span class="lbl">Impact</span></button>
    </div>
  </div>
  <div class="grp">
    <button class="b" id="treeBtn" title="Tree of life (T)"><span class="g">⟟</span><span class="lbl">Tree</span></button>
    <button class="b" id="guideBtn" title="Field guide (G)"><span class="g">❦</span><span class="lbl">Field guide</span> <b id="guideN">0/18</b></button>
    <button class="b" id="tankBtn" title="Tank conditions"><span class="g">⚙</span><span class="lbl">Tank</span></button>
  </div>
</nav>
<aside id="treeP" class="paper" hidden>
  <h3>Tree of life <small id="treeSub"></small></h3>
  <canvas id="treeC"></canvas>
  <canvas id="popC"></canvas>
  <div class="legend"><span><i style="background:#5f8f4e"></i>grazers</span><span><i style="background:#b4583f"></i>hunters</span><span><i style="background:#6b5b43;height:1px"></i>species</span></div>
</aside>
<aside id="insp" class="paper"></aside>
<section id="sheet"></section>
<section id="book"><div class="pg paper"></div></section>
<aside id="plate" class="paper"></aside>
<section id="away"><div class="pg paper"></div></section>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script id="simsrc">
// ===================================================================================================
//  EvoSim: a deterministic tide-pool ecosystem. Plain JS with no DOM, so the same text runs in a Worker,
//  on the main thread (fallback, tests, the away-mode catch-up) and in Node.
// ===================================================================================================
var EvoSim = (function () {
'use strict';
// ---- genome layout: 24 trait slots, then a 16-8-3 neural net ----
const NT = 24, NI = 16, NH = 8, NO = 3;
const W1 = NT, B1 = W1 + NI * NH, W2 = B1 + NH, B2 = W2 + NH * NO, GLEN = B2 + NO;
const SIZE = 0, SEGS = 1, ELONG = 2, HUE = 3, LIGHT = 4, PATT = 5, GLOW = 6, SPEED = 7, FINS = 8, MOUTH = 9, ARMOUR = 10, SPIKES = 11, EYES = 12, FILTER = 13, DIET = 14, REPRO = 15, INVEST = 16, MUT = 17, SEX = 18, OSC = 19, NTR = 20;
const GENE = { SIZE, SEGS, ELONG, HUE, LIGHT, PATT, GLOW, SPEED, FINS, MOUTH, ARMOUR, SPIKES, EYES, FILTER, DIET, REPRO, INVEST, MUT, SEX, OSC };
const TW = [1.5, 1, .5, 1.5, 1, .5, .7, 1, .7, 1, 1, 1, 1, 1, 2, .3, .3, .3, .3, .2];
const BRAINW = 1.5, TWSUM = TW.reduce((a, b) => a + b, 0) + BRAINW;
const DAY = 1800, YEAR = 9000, CS = 40, PCS = 64, FTS = 8, HIST_EVERY = 150, SPLIT = .12;
const INPUTS = ['food ahead', 'food side', 'kin ahead', 'kin side', 'threat ahead', 'threat side', 'prey ahead', 'prey side', 'light', 'energy', 'floor match', 'floor ahead', 'plankton', 'kin nearby', 'pulse', 'bias'];
const OUTPUTS = ['thrust', 'turn', 'bite'];
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const TAU = Math.PI * 2;

// ---- deterministic noise for the floor ----
function hash2(ix, iy, s) { let h = Math.imul(ix, 374761393) ^ Math.imul(iy, 668265263) ^ Math.imul(s, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function vnoise(x, y, s) { const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy, ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy, s), b = hash2(ix + 1, iy, s), c = hash2(ix, iy + 1, s), d = hash2(ix + 1, iy + 1, s); return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy; }
function fbm(x, y, s) { let v = 0, a = .5, f = 1; for (let o = 0; o < 4; o++) { v += a * vnoise(x * f, y * f, s + o * 17); f *= 2.03; a *= .5; } return v / .9375; }

        if (vType > .5) { // flagellum: a travelling wave, tapering to a thread
          float yc = sin(x * 7. - ph * 2.2) * .55 * x * (.4 + vC.w);
          float w = mix(.32, .05, pow(x, .7)); float dist = abs(y - yc);
          a = smoothstep(w, w * .35, dist) * smoothstep(1., .85, x) * .85; col = base * 1.25 * lit + .05; }
        else { // a fin: a translucent fan with rays
          float sd = vC.w; float yy = y * sd; float prof = sin(3.14159 * pow(x, .75)) * (.55 + .45 * x);
          float inside = smoothstep(prof + .04, prof - .04, yy) * smoothstep(-.18 - .04, -.18 + .04, yy);
          float rays = .65 + .35 * smoothstep(.2, .9, abs(sin(atan(yy + .18, x) * 18.)));
          float edgeL = smoothstep(.12, 0., abs(yy - prof)) * step(0., prof);
          a = inside * .42 * rays + edgeL * .35 * inside; col = mix(base * 1.2 + .08, vec3(.95, .98, 1.), edgeL * .5) * lit; }
        if (a < .004) discard; gl_FragColor = vec4(col, a * vB.w); }`;
  const apps = { stride: APP, buf: new Float32Array(APP * 4096) };
  const appQ = quad(apps, [['iA', 4, 0], ['iB', 4, 4], ['iC', 4, 8]], mk(appVS, appFS), 3);
  const bodyQ = quad(segs, segLayout, bodyMat, 4);
  // ---------------------------------------------------------- bioluminescent and selection glow (additive)
  const haloMat = mk(`attribute vec2 corner; attribute vec4 iA, iB; varying vec2 vQ; varying vec4 vB; varying float vI;
      void main(){ vQ = corner; vB = iB; vI = iA.w; gl_Position = projectionMatrix * modelViewMatrix * vec4(iA.xy + corner * iA.z, 0., 1.); }`,
    `precision mediump float; varying vec2 vQ; varying vec4 vB; varying float vI; void main(){ float d = length(vQ); if (d > 1.) discard; float a = pow(1. - d, 2.2) * vI * .55; gl_FragColor = vec4(vB.rgb * a, a); }`, { blend: THREE.AdditiveBlending });
  const halos = { stride: HALO, buf: new Float32Array(HALO * 1024) };
  const haloQ = quad(halos, [['iA', 4, 0], ['iB', 4, 4]], haloMat, 5);
  // ---------------------------------------------------------- glass dividers
  const wallMat = mk(`attribute vec2 corner; attribute vec4 iA; varying vec2 vQ; uniform float uK; void main(){ vQ = iA.z > .5 ? corner : corner.yx; vec2 p = iA.z > .5 ? vec2(iA.x + corner.x * (5. + 2. / uK), iA.y * .5 + corner.y * iA.y * .5) : vec2(iA.x * .5 + corner.x * iA.x * .5, iA.y + corner.y * (5. + 2. / uK)); gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 0., 1.); }`,
    `precision mediump float; varying vec2 vQ; uniform float uTime, uLight; void main(){ float x = abs(vQ.x) , y = abs(vQ.y); float v = max(x, 0.); float k = max(abs(vQ.x), 0.);
       float edge = smoothstep(.75, .95, k) * (1. - smoothstep(.95, 1., k)); float body = (1. - k) * .18; float shimmer = .5 + .5 * sin(vQ.y * 40. + uTime * 1.5);
       float a = edge * .75 + body + shimmer * .04; gl_FragColor = vec4(mix(vec3(.6, .85, .85), vec3(1.), edge) * (.5 + .5 * uLight), a); }`);
  const walls = { stride: 4, buf: new Float32Array(4 * 8) };
  const wallQ = quad(walls, [['iA', 4, 0]], wallMat, 6);
  // ---------------------------------------------------------- the interface the page uses
  let W = 1, H = 1, cw = 1, ch = 1, dp = 1;
  const upload = (Q, inst, src, n, stride) => { if (inst.buf.length < n * stride) { inst.buf = new Float32Array(n * stride * 1.5 | 0); const ib = new THREE.InstancedInterleavedBuffer(inst.buf, stride, 1); ib.setUsage(THREE.DynamicDrawUsage);
      for (const [name, a] of Object.entries(Q.g.attributes)) if (a.isInterleavedBufferAttribute) Q.g.setAttribute(name, new THREE.InterleavedBufferAttribute(ib, a.itemSize, a.offset)); Q.ib = ib; }
    inst.buf.set(src.subarray(0, n * stride)); Q.ib.array = inst.buf; Q.ib.needsUpdate = true; if (Q.ib.clearUpdateRanges) { Q.ib.clearUpdateRanges(); Q.ib.addUpdateRange(0, Math.max(1, n * stride)); } Q.g.instanceCount = n; };
  const self = {
    kind: 'gl', renderer, camera, scene,
    setFloor(f, w, h) { W = w; H = h; const a = new Uint8Array(f.w * f.h); for (let i = 0; i < a.length; i++) a[i] = Math.max(0, Math.min(255, f.a[i] * 255)); toneTex.image = { data: a, width: f.w, height: f.h }; toneTex.needsUpdate = true;
      floor.geometry.dispose(); floor.geometry = new THREE.PlaneGeometry(w * 3, h * 3); floor.position.set(w / 2, h / 2, 0); floorMat.uniforms.uSize.value.set(w, h); },
    setPlank(p, pw, ph) { const a = new Uint8Array(pw * ph); for (let i = 0; i < a.length; i++) a[i] = Math.max(0, Math.min(255, p[i] * 255)); plankTex.image = { data: a, width: pw, height: ph }; plankTex.needsUpdate = true; },
    resize(w, h, d) { cw = w; ch = h; dp = d; renderer.setPixelRatio(d); renderer.setSize(w, h, false); },
    draw(env, cam, time) {
      const V = App.view, B = App.bodies;
      camera.left = -cam.x / cam.k; camera.right = (cw - cam.x) / cam.k; camera.top = -cam.y / cam.k; camera.bottom = (ch - cam.y) / cam.k; camera.updateProjectionMatrix();
      uni.uTime.value = time; uni.uLight.value = env.light; uni.uNight.value = env.night; uni.uK.value = cam.k; floorMat.uniforms.uWarm.value = Math.max(-1, Math.min(1, ((env.T || 18) - 18) / 10));
      upload(foodQ, food, V.fb, V.nf, 3);
      upload(shadowQ, segs, B.seg, B.ns, SEG); bodyQ.g.instanceCount = B.ns;
      if (bodyQ.ib !== shadowQ.ib) { for (const [name, a] of Object.entries(bodyQ.g.attributes)) if (a.isInterleavedBufferAttribute) bodyQ.g.setAttribute(name, new THREE.InterleavedBufferAttribute(shadowQ.ib, a.itemSize, a.offset)); bodyQ.ib = shadowQ.ib; }
      upload(appQ, apps, B.app, B.na, APP); upload(haloQ, halos, B.halo, B.nh, HALO);
      const ws = (V.sum && V.sum.walls) || []; const wb = new Float32Array(Math.max(1, ws.length) * 4); ws.forEach((w, i) => { if (w.ax === 'v') { wb[i * 4] = w.p; wb[i * 4 + 1] = H; wb[i * 4 + 2] = 1; } else { wb[i * 4] = W; wb[i * 4 + 1] = w.p; wb[i * 4 + 2] = 0; } }); upload(wallQ, walls, wb, ws.length, 4);
      renderer.render(scene, camera);
    },
  };
  return self;
}
App.boot(GLRenderer);
