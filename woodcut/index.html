<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reduction Woodcut</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Spectral:ital,wght@0,400;0,600;1,400&family=Spectral+SC:wght@600&display=swap" rel="stylesheet">
<style>
  /* the printmaker's studio: chrome is washi paper pinned to a wooden bench, tools hang on a carved rack,
     inks are little tins, the pull button is a brayer handle, notes are slips of proof paper */
  :root{--washi:#f1e7d2;--washi2:#e6d8bb;--ink:#2a1d12;--sumi:#1c140d;--wood:#6d4526;--wood2:#3f2614;--ver:#b3261e;--muted:#6d5a44}
  html,body{height:100%;overflow:hidden;background:#140f0b;font-family:Spectral,Georgia,serif;color:var(--ink)}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .chip{position:fixed;border-radius:2px;color:var(--ink);
    background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.55),transparent 55%),repeating-linear-gradient(83deg,rgba(120,90,50,.05) 0 1px,transparent 1px 5px),repeating-linear-gradient(-7deg,rgba(120,90,50,.035) 0 1px,transparent 1px 9px),linear-gradient(var(--washi),var(--washi2));
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 14px 28px -14px #000,0 2px 6px rgba(0,0,0,.35)}
  /* a brass pin at the top of the sheet */
  #hud::before{content:"";position:absolute;top:-6px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fbe7a6,#b9893a 55%,#6b4a1a);box-shadow:0 2px 3px #0008}
  #hud{top:16px;left:16px;padding:14px 18px;width:300px;transform:rotate(-.4deg)}
  #hud .home{color:var(--muted);font-size:12.5px;text-decoration:none;font-style:italic}
  #hud .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  #gal{font:600 13px "Spectral SC",Georgia,serif;color:var(--ver);cursor:pointer;background:none;border:0;padding:0;letter-spacing:.04em}
  #hud h1{font-family:Fraunces,Georgia,serif;margin:4px 0 2px;font-size:26px;letter-spacing:-.01em;color:var(--sumi)}
  #lvSel{width:100%;margin:4px 0 6px;font:inherit;font-size:14px;background:#fbf6ea;color:var(--ink);border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:4px 6px}
  #lvSel:focus-visible,.tb:focus-visible,#gal:focus-visible{outline:3px solid var(--ver);outline-offset:2px}
  #story{font-size:14.5px;line-height:1.45;color:#3d2c1c}
  #story b{color:var(--ver)}
  #meter{margin-top:9px;display:flex;align-items:center;gap:8px;font:600 12px "Spectral SC",Georgia,serif;color:var(--muted)}
  #meter .bar{flex:1;height:9px;background:rgba(60,40,20,.12);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(42,29,18,.35)}
  #meter .bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(100deg,var(--sumi) 0 3px,#3b2a1c 3px 4px);transition:width .5s cubic-bezier(.2,.9,.3,1)}
  #meter .bar b{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ver)}
  #mTxt{font:600 15px "Spectral SC",Georgia,serif;color:var(--sumi);min-width:44px;text-align:right}
  #stats{margin-top:5px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  #step{margin-top:8px;padding:6px 10px;font-size:13.5px;line-height:1.4;background:rgba(179,38,30,.07);border-left:3px solid var(--ver)}
  #step b{color:var(--ver)}
  /* the tool rack: an oiled board with tools, tins and the brayer */
  #tray{bottom:14px;left:50%;transform:translateX(-50%);padding:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 24px);border-radius:3px;
    background:repeating-linear-gradient(88deg,rgba(0,0,0,.12) 0 2px,transparent 2px 9px,rgba(255,220,170,.05) 9px 11px,transparent 11px 17px),linear-gradient(#7a4e2c,#4a2c16);box-shadow:inset 0 1px 0 rgba(255,220,170,.25),0 14px 28px -12px #000}
  .grp{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}
  .sep{width:2px;align-self:stretch;background:linear-gradient(#2b190c,#5c3a20)}
  .tb{border:0;color:var(--ink);font:600 13px Spectral,Georgia,serif;border-radius:2px;padding:6px 10px;cursor:pointer;display:flex;gap:6px;align-items:center;white-space:nowrap;
    background:linear-gradient(#f4ecda,#e2d3b4);box-shadow:0 2px 0 #2b190c,inset 0 0 0 1px rgba(42,29,18,.25)}
  .tb:hover{background:linear-gradient(#fbf5e6,#ebdfc4)}
  .tb:active{transform:translateY(2px);box-shadow:inset 0 0 0 1px rgba(42,29,18,.25)}
  .tb.on{background:var(--sumi);color:var(--washi);box-shadow:0 2px 0 #000,inset 0 0 0 1px #000}
  .tb.used{opacity:.4;text-decoration:line-through}
  .tb .ic{font-size:15px;line-height:1}
  .tb .cnt{font:600 11px "Spectral SC",Georgia,serif;color:var(--ver)}
  .tb.on .cnt{color:#ffb4a6}
  .tb .k{font-size:10px;opacity:.5}
  .sw{width:26px;height:18px;border-radius:50%/40%;box-shadow:inset 0 0 0 2px #8d8d88,inset 0 0 0 3px #555,0 1px 1px #0006;flex:none}
  .md{font:600 9.5px "Spectral SC",Georgia,serif;padding:0 4px;background:var(--sumi);color:var(--washi)}
  .md.t{background:transparent;color:var(--ink);border:1px dashed var(--ink)}
  .tb.on .md.t{color:var(--washi);border-color:var(--washi)}
  /* the brayer: a black rubber roller on a turned wooden handle */
  .tb.pull{background:linear-gradient(#2a2420,#0f0c0a);color:#f4ecda;font-family:"Spectral SC",Georgia,serif;letter-spacing:.06em;padding:7px 14px 7px 12px;box-shadow:0 2px 0 #000,inset 0 1px 0 rgba(255,255,255,.18),6px 0 0 -2px #a8743a,12px 0 0 -4px #7a4e2c}
  .tb.pull.confirm{background:linear-gradient(#c0392b,#7a1d13);animation:pulse .7s ease-in-out infinite alternate}
  .tb:disabled{opacity:.4;cursor:default}
  @keyframes pulse{to{box-shadow:0 2px 0 #000,0 0 0 5px rgba(179,38,30,.35)}}
  #toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-12px) rotate(.3deg);opacity:0;visibility:hidden;font:700 21px Fraunces,Georgia,serif;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1),visibility 0s .3s;text-align:center;width:min(560px,calc(100vw - 24px));padding:14px 36px 14px 20px;z-index:10;color:var(--sumi)}
  #toast.on{opacity:1;visibility:visible;transform:translate(-50%,0) rotate(.3deg);transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
  #toast small{display:block;font:400 14.5px/1.45 Spectral,Georgia,serif;color:#3d2c1c;margin-top:6px}
  #toast small b{color:var(--ver)}
  #toast .x{position:absolute;top:8px;right:12px;font-size:15px;color:var(--muted);cursor:pointer}
  #toast .btns{display:flex;gap:6px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  #toast .stars{color:var(--ver);letter-spacing:.1em}
  .modal{background:linear-gradient(var(--washi),var(--washi2));color:var(--ink);font-family:Spectral,Georgia,serif;border:0;border-radius:2px;box-shadow:0 30px 60px -20px #000}
  .modal h2{font-family:Fraunces,Georgia,serif;color:var(--sumi)} .modal .dim{color:var(--muted)}
  .modal button{background:var(--sumi);color:var(--washi);border:0;border-radius:2px;font:600 14px "Spectral SC",Georgia,serif}
  .gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .gal figure{margin:0;font-size:12px;color:var(--muted);text-align:center}
  .gal img{width:100%;display:block;margin-bottom:4px;padding:6px;background:#fbf6ea;box-shadow:0 4px 12px rgba(0,0,0,.35)}
  /* signature: the red hanko seal stamped onto the print, with an inky squash */
  #seal{position:fixed;width:120px;height:120px;pointer-events:none;z-index:9;opacity:0;transform:scale(2.2) rotate(-14deg)}
  #seal.on{animation:stamp 1.6s cubic-bezier(.2,.9,.25,1) forwards}
  #seal svg{width:100%;height:100%;filter:url(#inky)}
  @keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-14deg)}28%{opacity:1;transform:scale(.92) rotate(-6deg)}38%{transform:scale(1.02) rotate(-6deg)}100%{opacity:.95;transform:scale(1) rotate(-6deg)}}
  @media (max-width:900px){
    #hud{top:6px;left:6px;right:6px;width:auto;padding:8px 12px;transform:none}
    #hud h1{font-size:19px;margin:1px 0}
    #hud .home{font-size:11px}
    #story{display:none}
    #lvSel{margin:2px 0 4px;padding:3px 6px}
    #meter{margin-top:3px}
    #stats{margin-top:2px;font-size:11.5px}
    #step{margin-top:4px;padding:4px 8px;font-size:12px}
    #tray{left:6px;right:6px;bottom:6px;transform:none;max-width:none;gap:5px;padding:6px}
    .sep{display:none}
    .tb{padding:6px 7px;font-size:12px}
    .tb .lbl,.tb .k{display:none}
    .tb.pull .lbl{display:inline}
    #inks .tb .lbl{display:inline;font-size:10.5px;max-width:58px;overflow:hidden;text-overflow:ellipsis}
    #inks .tb{gap:4px;padding:5px 6px}
    #toast.res{top:auto}
    .sw{width:22px;height:16px}
    #toast{top:6px;font-size:17px}
    #seal{width:84px;height:84px}
    /* phones: a compact pinned slip on top, and the rack flattened into two rows of finger-sized tools */
    #hud h1{display:none}
    #hud .top{gap:6px} #hud .home{font-size:12px}
    #gal{min-height:32px;padding:0 4px}
    #lvSel{min-height:34px;font-size:14px}
    #stats{display:none}
    #step{font-size:12px;line-height:1.3;margin-top:3px}
    #tray .grp{display:contents}
    #tray{gap:5px;padding:6px;justify-content:center}
    .tb{min-height:42px;min-width:42px;justify-content:center;padding:4px 8px}
    #tools .tb{order:1} #acts .tb{order:2} #inks .tb{order:3} #acts .tb.pull{order:4}
    #inks .tb .lbl{display:none}
    #toast{font-size:16px;padding:10px 30px 10px 14px} #toast small{font-size:13px}
  }
  /* landscape phones: the slip becomes a column on the left, the rack a strip along the bottom */
  @media (max-width:900px) and (max-height:520px) and (orientation:landscape){
    #hud{right:auto;width:196px;top:6px;bottom:62px;overflow:auto;padding:8px 10px}
    #story{display:block;font-size:12.5px;line-height:1.35;margin:2px 0 4px}
    #hud .top{flex-wrap:wrap;row-gap:0} #hud .home{white-space:nowrap;font-size:11.5px}
    #step{font-size:11.5px}
    #tray{left:6px;right:6px;bottom:6px;flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:4px 6px;gap:4px}
    .tb{min-height:42px;flex:0 0 auto}
    #toast{width:min(380px,52vw);left:auto;right:8px;transform:none}
    #toast.on{transform:none}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip">
  <div class="top"><a class="home" href="../index.html">← Rabbit Holes</a><button id="gal">Gallery</button></div>
  <h1 id="title">Reduction Woodcut</h1>
  <select id="lvSel" aria-label="Level"></select>
  <div id="story"></div>
  <div id="meter"><span>Likeness</span><div class="bar"><i id="mBar"></i><b style="left:85%"></b></div><span id="mTxt">0%</span></div>
  <div id="stats"></div>
  <div id="step"></div>
</div>
<div id="tray" class="chip"><div class="grp" id="tools"></div><div class="sep"></div><div class="grp" id="inks"></div><div class="sep"></div><div class="grp" id="acts"></div></div>
<div id="toast" class="chip" role="status"></div>
<div id="seal" aria-hidden="true"><svg viewBox="0 0 100 100"><defs><filter id="inky"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5"/></filter></defs>
<rect x="6" y="6" width="88" height="88" rx="6" fill="#b3261e"/><rect x="12" y="12" width="76" height="76" rx="3" fill="none" stroke="#f1e7d2" stroke-width="3"/>
<g stroke="#f1e7d2" stroke-width="7" stroke-linecap="square" fill="none"><path d="M22 40 H78 M50 20 V84 M50 44 L24 74 M50 44 L76 74"/></g></svg></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
// ======================================================================
//  Reduction woodcut: one block, carved a little more before every colour.
//  Block, print and target live at a fixed R×R internal resolution.
// ======================================================================
const R = 320, SC = R / 256, N = R * R, PASS = .85;
const $ = id => document.getElementById(id);
{ const base = FX.sfx, T = FX.tone, V = { click: () => T({ f: 520, f2: 380, type: 'triangle', dur: .05, vol: .12 }), pop: () => T({ noise: 1, f: 1800, q: 1.2, dur: .07, vol: .1 }),
    tick: () => T({ f: 700, type: 'triangle', dur: .03, vol: .07 }), whoosh: () => T({ noise: 1, f: 1200, q: .4, dur: .4, vol: .08, attack: .15 }),
    place: () => { T({ f: 110, f2: 70, type: 'sine', dur: .14, vol: .3 }); T({ noise: 1, f: 900, q: .6, dur: .06, vol: .1 }); },
    win: () => [1, 2.76, 5.4].forEach((m, i) => T({ f: 392 * m, type: 'sine', dur: 2.2 / (1 + i), vol: .14 / (1 + i * 1.5), delay: .45 })) };
  FX.sfx = (n, ...a) => { try { (V[n] || (() => base(n, ...a)))(...a); } catch (e) {} }; }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;

// ---------------- colour (linear RGB; transparent inks multiply) ----------------
const s2l = v => v <= .04045 ? v / 12.92 : Math.pow((v + .055) / 1.055, 2.4);
const l2s = v => v <= .0031308 ? v * 12.92 : 1.055 * Math.pow(v, 1 / 2.4) - .055;
const LUT = new Uint8Array(4097); for (let i = 0; i <= 4096; i++) LUT[i] = Math.round(clamp(l2s(i / 4096), 0, 1) * 255);
const to8 = v => LUT[clamp(v * 4096 | 0, 0, 4096)];
const lin = h => [1, 3, 5].map(i => s2l(parseInt(h.substr(i, 2), 16) / 255));
const css = c => `rgb(${to8(c[0])},${to8(c[1])},${to8(c[2])})`;
const fLab = t => t > .008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116;
function lab(r, g, b, o, j) {
  const fx = fLab((.4124 * r + .3576 * g + .1805 * b) / .95047), fy = fLab(.2126 * r + .7152 * g + .0722 * b), fz = fLab((.0193 * r + .1192 * g + .9505 * b) / 1.08883);
  o[j] = 116 * fy - 16; o[j + 1] = 500 * (fx - fy); o[j + 2] = 200 * (fy - fz);
}
const LB = new Float32Array(6);
function dE(a, b) { lab(a[0], a[1], a[2], LB, 0); lab(b[0], b[1], b[2], LB, 3); return Math.hypot(LB[0] - LB[3], LB[1] - LB[4], LB[2] - LB[5]); }
const lum = c => .2126 * c[0] + .7152 * c[1] + .0722 * c[2];

// ink: n name, c colour, m 'o' opaque | 't' transparent, c2 = split-fountain second colour (left→right)
const I = (n, c, m = 'o', c2) => ({ n, hex: c, m, c: lin(c), c2: c2 ? lin(c2) : null, hex2: c2 });
const ftT = x => { const t = clamp((x / (R - 1) - .1) / .8, 0, 1); return t * t * (3 - 2 * t); };
function inkAt(ink, x, o) { if (!ink.c2) { o[0] = ink.c[0]; o[1] = ink.c[1]; o[2] = ink.c[2]; return o; } const t = ftT(x); for (let k = 0; k < 3; k++) o[k] = ink.c[k] + (ink.c2[k] - ink.c[k]) * t; return o; }
// Opaque ink is not perfectly opaque: dark over light covers, but a LIGHT ink over a DARK ground lets
// the dark ghost through (cover drops with the lightness gap). This is why light→dark is the real rule.
const OPQ = .8, cover = (bl, il, dense) => { const d = Math.cbrt(il) - Math.cbrt(bl); return d > 0 && !dense ? 1 - OPQ * d : 1; };
const OVS = [0, 0, 0];
function over(base, ink, x, o) { const ic = inkAt(ink, x, OVS);
  if (ink.m === 't') { for (let k = 0; k < 3; k++) o[k] = base[k] * ic[k]; return o; }
  const cv = cover(lum(base), lum(ic), ink.dense); for (let k = 0; k < 3; k++) o[k] = base[k] + (ic[k] - base[k]) * cv; return o; }
const inkCss = (ink, base) => ink.c2 ? `linear-gradient(90deg,${css(over(base, ink, 0, []))},${css(over(base, ink, R - 1, []))})` : css(over(base, ink, R / 2, []));

// ---------------- shape helpers for targets (256-unit coordinates) ----------------
const C = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, 7); c.fill(); };
const E = (c, x, y, rx, ry, a = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, a, 0, 7); c.fill(); };
const Q = (c, x, y, w, h) => c.fillRect(x, y, w, h);
const P = (c, d) => c.fill(new Path2D(d));
const S = (c, d, w) => { c.lineWidth = w; c.stroke(new Path2D(d)); };
const ALL = c => c.fillRect(-2, -2, 260, 260);
const CREAM = '#f2eadb', KRAFT = '#d3bf98';

// Levels: inks are listed in the INTENDED print order. Each layer = [state, draw]: state s means
// "this area receives the first s inks, then is carved away" (0 = bare paper). So every target is
// solvable by construction; the palette is shown to the player sorted light→dark, not in this order.
const LV = [
  { n: 'Cherries', paper: CREAM, inks: [I('Cherry red', '#c63a3f'), I('Leaf green', '#2f5e3c')],
    story: 'One block, two colours. Anything you <b>carve away</b> keeps the colour it has <i>now</i>. So first carve everything that should stay <b>paper</b>, then pull red.',
    fact: 'That is the whole trick of a reduction print: you never add wood back. Picasso called it the method that "destroys the block as you go".',
    layers: [[0, ALL], [1, c => { C(c, 92, 172, 42); C(c, 172, 182, 40); }], [0, c => { E(c, 76, 154, 9, 13, -.5); E(c, 157, 165, 8, 12, -.5); }],
      [2, c => { S(c, 'M92 132 Q104 76 150 46', 5); S(c, 'M172 144 Q162 92 150 46', 5); P(c, 'M150 46 Q186 18 226 38 Q192 68 150 46Z'); }]] },
  { n: 'Moon over Sea', paper: CREAM, inks: [I('Moon gold', '#e8c25a'), I('Night navy', '#23365c')],
    story: 'Stars stay paper. The moon and its reflection are gold. Everything else goes navy on the last pass.',
    fact: 'Tiny marks like stars are carved first: once the block is inked, a slip there can never be undone.',
    layers: [[2, ALL], [0, c => { for (const [x, y] of [[36, 40], [70, 92], [118, 28], [228, 132], [26, 126], [96, 60], [210, 20]]) C(c, x, y, 3); S(c, 'M0 146 L256 146', 2.5); }],
      [1, c => { C(c, 176, 78, 30); Q(c, 146, 156, 60, 6); Q(c, 154, 174, 44, 6); Q(c, 162, 192, 28, 5); Q(c, 168, 210, 16, 5); }]] },
  { n: 'Mushroom', paper: CREAM, inks: [I('Stem tan', '#d6a66a'), I('Cap red', '#b5322c'), I('Umber', '#4a3526')],
    story: 'Three inks. The stem is the first colour, so it gets carved <b>after</b> the first pull and before the second.',
    fact: 'Printers usually go light to dark, because a dark ink covers a light one but not the other way round.',
    layers: [[0, ALL], [3, c => { P(c, 'M0 208 Q128 188 256 208 L256 256 L0 256Z'); for (const x of [30, 52, 200, 226]) S(c, `M${x} 206 L${x + 6} 184`, 3); }],
      [1, c => P(c, 'M108 118 Q100 190 96 214 Q128 222 160 214 Q156 190 148 118Z')],
      [2, c => P(c, 'M42 128 Q58 40 128 38 Q198 40 214 128 Q128 142 42 128Z')],
      [0, c => { C(c, 92, 88, 10); C(c, 140, 66, 12); C(c, 178, 102, 9); C(c, 116, 112, 7); }], [3, c => S(c, 'M66 132 Q128 146 190 132', 3)]] },
  { n: 'Red Barn in Snow', paper: CREAM, inks: [I('Winter sky', '#a9c8d8'), I('Barn red', '#a8392c'), I('Soot', '#2d2a2c')],
    story: 'The trap: snow and trim stay paper, so carve them <b>first</b>. But don\'t touch the barn until red has been printed, or the red never lands.',
    fact: 'Carving too early is the classic reduction mistake. Wood you remove before a pass never receives that ink.',
    layers: [[1, ALL], [0, c => P(c, 'M0 190 Q90 170 256 186 L256 256 L0 256Z')], [2, c => P(c, 'M60 202 L60 120 L128 78 L196 120 L196 202Z')],
      [3, c => { P(c, 'M48 126 L128 68 L208 126 L198 132 L128 84 L58 132Z'); P(c, 'M22 198 L36 128 L50 198Z'); }],
      [0, c => { Q(c, 100, 140, 56, 62); Q(c, 114, 98, 28, 24); }], [3, c => { Q(c, 106, 146, 44, 56); Q(c, 119, 103, 18, 14); }],
      [0, c => { S(c, 'M106 146 L150 202', 4); S(c, 'M150 146 L106 202', 4); }]] },
  { n: 'Koi', paper: CREAM, inks: [I('Koi orange', '#e7843b'), I('Pond teal', '#3e7c84'), I('Ink', '#262b36')],

// ---------------- procedural wood grain ----------------
const grain = new Float32Array(N);
(() => {
  const rnd = RH.rng(11), G = 32, nz = new Float32Array(G * G); for (let i = 0; i < G * G; i++) nz[i] = rnd();
  const vn = (x, y) => { const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, a0 = ((xi % G) + G) % G, a1 = (a0 + 1) % G, b0 = ((yi % G) + G) % G, b1 = (b0 + 1) % G;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), a = nz[b0 * G + a0], b = nz[b0 * G + a1], c = nz[b1 * G + a0], d = nz[b1 * G + a1]; return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v; };
  for (let y = 0; y < R; y++) for (let x = 0; x < R; x++) {
    const w = y + 26 * vn(x / 90, y / 70) + 5 * vn(x / 14, y / 40), rings = .5 + .5 * Math.sin(w * .42);
    grain[y * R + x] = clamp(.55 * Math.pow(rings, 3) + .25 * vn(x / 3, y / 22) + .2 * vn(x / 40, y / 8), 0, 1);
  }
})();
