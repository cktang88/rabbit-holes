<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polarizer</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;overflow:hidden;background:#05060c;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;color:#eef0ff}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .chip{position:fixed;background:rgba(14,16,32,.9);border:1px solid rgba(160,170,255,.14);border-radius:18px;box-shadow:0 16px 40px -18px rgba(0,0,0,.8)}
  #hud{top:16px;left:16px;padding:14px 18px;width:340px}
  #hud .home{color:#8f95c0;font-size:12px;text-decoration:none}
  #hud h1{margin:4px 0;font-size:24px;letter-spacing:-.02em}
  #story{font-size:14px;line-height:1.5;color:#c8cbea}
  #story b{color:#fff}
  #goal{margin-top:10px;padding:9px 12px;border-radius:12px;background:rgba(150,160,255,.07);border:1px solid rgba(150,160,255,.22);font-size:13px;line-height:1.45}
  #goal.ok{border-color:#5fd38d;background:rgba(95,211,141,.12)}
  #goal.hold{border-color:#ffd27a}
  #goal.hold::after{content:'Hold it there…';display:block;margin-top:6px;color:#ffd27a;font-size:12px;animation:hp .5s ease-in-out infinite alternate}
  @keyframes hp{to{opacity:.45}}
  #goal .b{margin-top:8px}
  #levels{top:16px;right:16px;padding:8px;width:220px}
  #levels h4{margin:4px 8px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8f95c0}
  .lv{padding:6px 10px;border-radius:9px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between}
  .lv:hover{background:rgba(255,255,255,.06)} .lv.cur{background:rgba(150,160,255,.2)} .lv.lock{opacity:.3;pointer-events:none}
  #lvSel{display:none;margin:6px 0 2px;width:100%;font:inherit;font-size:13px;background:#1a1d36;color:#eef0ff;border:1px solid rgba(160,170,255,.3);border-radius:9px;padding:6px 8px}
  #tray{bottom:16px;left:50%;transform:translateX(-50%);padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px)}
  .pc{border:1px solid transparent;background:rgba(255,255,255,.06);color:#eef0ff;font:inherit;font-size:12px;border-radius:10px;padding:7px 10px;cursor:grab;display:flex;gap:6px;align-items:center}
  .pc.on{border-color:#a9b0ff;background:rgba(169,176,255,.18)}
  .pc i{font-style:normal;background:#a9b0ff;color:#0b0d20;border-radius:7px;padding:0 5px;font-weight:700}
  .b{border:0;background:#a9b0ff;color:#0b0d20;font:inherit;font-weight:700;font-size:13px;border-radius:10px;padding:8px 12px;cursor:pointer}
  .b.ghost{background:rgba(255,255,255,.08);color:#eef0ff;font-weight:500}
  #sel{bottom:84px;left:50%;transform:translateX(-50%);padding:10px 14px;display:none;align-items:center;gap:10px;font-size:13px;flex-wrap:wrap;justify-content:center}
  #sel input[type=range]{width:200px;accent-color:#a9b0ff}
  #selN{width:58px;font:inherit;background:#1a1d36;color:#eef0ff;border:1px solid rgba(160,170,255,.3);border-radius:8px;padding:4px 6px}
  #toast{position:fixed;top:16px;left:50%;transform:translate(-50%,-12px);opacity:0;visibility:hidden;font-size:22px;font-weight:700;letter-spacing:-.01em;transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1),visibility 0s .3s;text-align:center;width:min(620px,calc(100vw - 32px));padding:12px 36px 12px 18px;cursor:pointer;z-index:10}
  #toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .3s,transform .4s cubic-bezier(.3,1.6,.5,1)}
  #toast small{display:block;font-size:14px;font-weight:400;color:#c8cbea;margin-top:6px;line-height:1.45}
  #toast .x{position:absolute;top:8px;right:12px;font-size:16px;color:#8f95c0}
  #toast .b{margin-top:10px}
  @media (max-width:900px){
    #levels{display:none}
    #lvSel{display:block}
    #hud{top:8px;left:8px;width:auto;right:8px;padding:10px 12px;max-height:36vh;overflow:auto}
    #hud h1{font-size:19px;margin:2px 0}
    #story{font-size:13px}
    #goal{margin-top:6px;padding:7px 10px;font-size:12px}
    #tray{left:8px;right:8px;bottom:8px;transform:none;max-width:none;gap:5px;padding:6px}
    .pc,.b{font-size:12px;padding:7px 9px}
    #sel{left:8px;right:8px;transform:none;padding:8px 10px;gap:8px}
    #sel input[type=range]{flex:1;min-width:120px;width:auto}
    #toast{top:8px;font-size:18px}
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip"><a class="home" href="../index.html">← Rabbit Holes</a><h1 id="title">Polarizer</h1><select id="lvSel" aria-label="Experiment"></select><div id="story"></div><div id="goal"></div></div>
<div id="levels" class="chip"></div>
<div id="tray" class="chip"></div>
<div id="sel" class="chip"><span id="selName"></span><input type="range" id="selR" min="0" max="180" step="5" aria-label="Angle"><input type="number" id="selN" min="0" max="180" step="1" aria-label="Angle in degrees"><b id="selV">°</b><button class="b ghost" id="selDel">Remove</button></div>
<div id="toast" class="chip" role="status"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
// ================= quantum optics on a grid =================
// A photon's state = complex amplitude on every beam segment, for each of two polarisations (H, V).
// Probabilities are |amplitude|². Splitters make superpositions, and paths that meet again interfere.
const GW = 15, GH = 9, DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]]; // right, down, left, up
const cadd = (a, b) => [a[0] + b[0], a[1] + b[1]], cmul = (a, b) => [a[0] * b[0] - a[1] * b[1], a[0] * b[1] + a[1] * b[0]], csc = (a, s) => [a[0] * s, a[1] * s], cabs2 = a => a[0] * a[0] + a[1] * a[1];
const I = [0, 1], R = s => [s, 0];
// mirror orientation '/' (m=0) or '\' (m=1)
const reflect = (d, m) => m === 0 ? [3, 2, 1, 0][d] : [1, 0, 3, 2][d];
function simulate(lv, parts) {
  const at = {}; for (const p of lv.fixed) at[p.x + ',' + p.y] = p; for (const p of parts) at[p.x + ',' + p.y] = p;
  const hits = {}, segs = [];
  // queue of beams: position, direction, polarisation amplitudes [H, V], and the segment that led here (pi)
  let q = lv.sources.map(s => ({ x: s.x, y: s.y, d: s.d, h: R(Math.cos(s.pol * Math.PI / 180)), v: R(Math.sin(s.pol * Math.PI / 180)), pi: -1 }));
  let guard = 0;
  while (q.length && guard++ < 4000) {
    const nq = [];
    for (const b of q) {
      const p2 = cabs2(b.h) + cabs2(b.v); if (p2 < 1e-6) continue;
      const x = b.x + DIRS[b.d][0], y = b.y + DIRS[b.d][1], si = segs.length;
      segs.push({ x0: b.x, y0: b.y, x1: x, y1: y, h: b.h, v: b.v, p: p2, par: b.pi });
      if (x < 0 || y < 0 || x >= GW || y >= GH) continue;
      const c = at[x + ',' + y];
      const go = (d, h, v) => nq.push({ x, y, d, h, v, pi: si });
      if (!c) { go(b.d, b.h, b.v); continue; }
      const t = c.t;
      if (t === 'mirror') go(reflect(b.d, c.m), csc(b.h, -1), csc(b.v, -1));
      else if (t === 'bs') { const s = Math.SQRT1_2; go(b.d, csc(b.h, s), csc(b.v, s)); go(reflect(b.d, c.m), csc(cmul(b.h, I), s), csc(cmul(b.v, I), s)); }
      else if (t === 'pbs') { go(b.d, b.h, [0, 0]); go(reflect(b.d, c.m), [0, 0], b.v); } // H passes, V reflects
      else if (t === 'pol') { const a = c.a * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a), proj = cadd(csc(b.h, cs), csc(b.v, sn)); go(b.d, csc(proj, cs), csc(proj, sn)); }
      else if (t === 'hwp') { const a = 2 * c.a * Math.PI / 180, cs = Math.cos(a), sn = Math.sin(a); go(b.d, cadd(csc(b.h, cs), csc(b.v, sn)), cadd(csc(b.h, sn), csc(b.v, -cs))); }
      else if (t === 'phase') { const ph = c.a * Math.PI / 180, e = [Math.cos(ph), Math.sin(ph)]; go(b.d, cmul(b.h, e), cmul(b.v, e)); }
      else if (t === 'det' || t === 'bomb') {
        const k = c.id || (x + ',' + y), e = (hits[k] ||= { h: [0, 0], v: [0, 0], c, segs: [] });
        e.h = cadd(e.h, b.h); e.v = cadd(e.v, b.v); e.segs.push(si); // amplitudes arriving at the same detector add up (they interfere)
      } else go(b.d, b.h, b.v);
    }
    q = nq;
  }
  const out = {}; for (const k in hits) out[k] = { p: cabs2(hits[k].h) + cabs2(hits[k].v), c: hits[k].c, segs: hits[k].segs };
  return { segs, hits: out };
}

// ================= levels =================
const S0 = (x, y, pol = 0, d = 0) => ({ x, y, d, pol });
const P = (t, x, y, a = 0, m = 0, o = {}) => ({ t, x, y, a, m, ...o });
const LV = [
  { n: 'Crossed Filters', sources: [S0(1, 4)], fixed: [P('pol', 4, 4, 0, 0, { lock: 1 }), P('pol', 10, 4, 90, 0, { lock: 1 }), P('det', 13, 4, 0, 0, { id: 'D' })], tray: { pol: 1 },
    story: 'A polarising filter only lets through light vibrating along its axis. Two filters at 90° block <b>everything</b>. So adding a <b>third</b> filter can only make it darker. Right?',
    goal: 'Get at least <b>20%</b> of the photons to the detector by adding one filter.', test: H => (H.D || 0) >= .2,
    lesson: 'A filter doesn\'t just block: it <b>re-prepares</b> the photon at its own angle. At 45° half get through, then half of those get through the last filter: 25%. Quantum measurement changes what it measures.' },
  { n: 'The Staircase', sources: [S0(1, 4)], fixed: [P('pol', 12, 4, 90, 0, { lock: 1 }), P('det', 13, 4, 0, 0, { id: 'D' })], tray: { pol: 5 },
    story: 'Horizontal light, a vertical filter. Each extra filter is a chance to lose photons, but each one also turns the polarisation a little.',
    goal: 'Get at least <b>60%</b> of the light through the vertical filter, using up to 5 filters. (Angles snap to 5°; type a number for exact values.)', test: H => (H.D || 0) >= .6,
    lesson: 'With N filters each turning 90°/N, the light that gets through approaches 100% as N grows. Watching a photon often enough drags it along: this is the idea behind the quantum Zeno effect.' },
  { n: 'A Better Way', sources: [S0(1, 4)], fixed: [P('pol', 12, 4, 90, 0, { lock: 1 }), P('det', 13, 4, 0, 0, { id: 'D' })], tray: { hwp: 1 },
    story: 'A <b>half-wave plate</b> is a crystal that rotates polarisation without absorbing anything. Rotate its axis to θ and light polarised at 0° comes out at 2θ.',
    goal: 'Get at least <b>95%</b> of the light through.', test: H => (H.D || 0) >= .95,
    lesson: 'Absorbing filters measure. Wave plates transform. The second kind is the one quantum computers use.' },
  { n: 'Sorting Hat', sources: [S0(1, 4, 45)], fixed: [P('det', 13, 4, 0, 0, { id: 'H' }), P('det', 7, 8, 0, 0, { id: 'V' })], tray: { pbs: 1 },
    story: 'These photons are polarised at 45°. A <b>polarising beam splitter</b> sends horizontal light straight on and reflects vertical light sideways. Which way does a 45° photon go?',
    goal: 'Split the beam so <b>both</b> detectors get at least 40%.', test: H => (H.H || 0) >= .4 && (H.V || 0) >= .4,
    lesson: 'Each single photon goes one way or the other, completely at random, 50:50. Fire photons to watch the dice roll.' },
  { n: 'Interferometer', sources: [S0(1, 2)], fixed: [P('bs', 3, 2, 0, 1, { lock: 1 }), P('mirror', 3, 6, 0, 1, { lock: 1 }), P('mirror', 10, 2, 0, 1, { lock: 1 }), P('bs', 10, 6, 0, 1, { lock: 1 }), P('det', 13, 6, 0, 0, { id: 'D1' }), P('det', 10, 8, 0, 0, { id: 'D2' })], tray: { phase: 1 },
    story: 'A <b>Mach–Zehnder interferometer</b>: the first half-mirror splits each photon into two paths, and the second recombines them. Detector D2 never clicks: the two paths cancel there. A <b>phase plate</b> delays one path.',
    goal: 'Send <b>every</b> photon to D2 instead (at least 95%).', test: H => (H.D2 || 0) >= .95,
    lesson: 'A single photon takes both paths and interferes with itself. Shift one path by half a wavelength and it switches exit.' },
  { n: 'Which Path?', sources: [S0(1, 2)], fixed: [P('bs', 3, 2, 0, 1, { lock: 1 }), P('mirror', 3, 6, 0, 1, { lock: 1 }), P('mirror', 10, 2, 0, 1, { lock: 1 }), P('bs', 10, 6, 0, 1, { lock: 1 }), P('det', 13, 6, 0, 0, { id: 'D1' }), P('det', 10, 8, 0, 0, { id: 'D2' })], tray: { hwp: 1 },
    story: 'Again D2 is dark. Now <b>label</b> one path by turning its photons\' polarisation vertical. Nothing is blocked, and nobody looks at the label.',
    goal: 'Get at least <b>45%</b> to D2 without blocking either path.', test: H => (H.D2 || 0) >= .45,
    lesson: 'If the two paths are distinguishable even in principle, they cannot interfere. The information alone changes the outcome.' },
  { n: 'Quantum Eraser', sources: [S0(1, 2)], fixed: [P('bs', 3, 2, 0, 1, { lock: 1 }), P('mirror', 3, 6, 0, 1, { lock: 1 }), P('mirror', 10, 2, 0, 1, { lock: 1 }), P('hwp', 6, 2, 45, 0, { lock: 1 }), P('bs', 10, 6, 0, 1, { lock: 1 }), P('det', 13, 6, 0, 0, { id: 'D1' }), P('det', 10, 8, 0, 0, { id: 'D2' })], tray: { pol: 2 },
    story: 'One path is labelled vertical and the other horizontal, so there\'s no interference: both detectors get 50%. Can you <b>erase</b> the label after the beams recombine?',
    goal: 'Make <b>D2 dark</b> again (≤ 3%) while D1 still gets at least 20%.', test: H => (H.D2 || 0) <= .03 && (H.D1 || 0) >= .2,
    lesson: 'A diagonal filter scrambles the labels. Among the photons that pass it, which-path information is gone, and interference comes back.' },
  { n: 'The Bomb Tester', sources: [S0(1, 2)], fixed: [P('bs', 3, 2, 0, 1, { lock: 1 }), P('mirror', 3, 6, 0, 1, { lock: 1 }), P('mirror', 10, 2, 0, 1, { lock: 1 }), P('bs', 10, 6, 0, 1, { lock: 1 }), P('det', 13, 6, 0, 0, { id: 'D1' }), P('det', 10, 8, 0, 0, { id: 'D2' })], tray: { bomb: 1 }, fire: 1,
    story: 'A bomb triggers if a single photon touches it. Put it in one arm of the interferometer. When D2 clicks, you <b>know the bomb is there</b>, yet no photon touched it. (Elitzur & Vaidman, 1993.)',
    goal: 'Place the bomb in an arm, then fire photons. Get <b>10 D2 clicks</b> (bombs detected without being touched) before <b>40</b> bombs go off. ★★★ with ≤20 explosions, ★★ with ≤30.', test: (H, F) => (F.D2 || 0) >= 10, boomBudget: 40,
    lesson: 'Interaction-free measurement: the bomb is detected by the photon that <b>didn\'t</b> go its way. With quantum Zeno tricks, the success rate can approach 100%.' },
  { n: 'Lab Sandbox', sources: [S0(1, 4)], fixed: [P('det', 13, 4, 0, 0, { id: 'D1' }), P('det', 13, 7, 0, 0, { id: 'D2' }), P('det', 7, 8, 0, 0, { id: 'D3' })], tray: { pol: 4, hwp: 3, bs: 2, pbs: 2, mirror: 6, phase: 2, bomb: 1 }, free: 1, fire: 1,
    story: 'Everything in the drawer. Build your own experiments.', goal: 'No goal.', test: () => false, lesson: '' },
];

// ================= state =================
const obj = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
const SAVE = obj(RH.load('polarizer', {})); SAVE.done = obj(SAVE.done); SAVE.stars = obj(SAVE.stars); // tolerate corrupted / hand-edited saves
for (const k in SAVE.done) if (!(+k >= 0 && +k < LV.length - 1)) delete SAVE.done[k];
const persist = () => { RH.save('polarizer', SAVE); RH.progress('polarizer', Object.keys(SAVE.done).length / (LV.length - 1)); };
const maxOpen = () => { let m = 0; while (m < LV.length - 1 && SAVE.done[m]) m++; return m; };
const isOpen = i => Number.isInteger(i) && i >= 0 && i < LV.length && (i <= maxOpen() || SAVE.done[i] || LV[i].free);
let L, parts = [], sel = null, tool = null, Rz, fires = {}, flashes = [], photons = [], won = false, need = true;
const timers = new Set();
const $ = id => document.getElementById(id);
const later = (fn, ms) => { const h = setTimeout(() => { timers.delete(h); fn(); }, ms); timers.add(h); };
const cancelShots = () => { timers.forEach(clearTimeout); timers.clear(); };
function load(i) {
  if (!isOpen(i)) i = maxOpen();
  cancelShots(); hideToast(); clearTimeout(settleH); settleH = 0; holding = false;
  SAVE.cur = i; persist(); L = LV[i]; parts = []; sel = null; tool = null; fires = {}; flashes = []; photons = []; won = false;
  $('title').textContent = L.n; $('story').innerHTML = L.story; renderGoal(); renderLevels(); renderTray(); showSel(); recompute();
}
function recompute() { Rz = simulate(L, parts); need = true; }
const used = t => parts.filter(p => p.t === t).length;

// ================= drawing =================
const cv = $('cv'), g = cv.getContext('2d'); let W = 1, H = 1, dpr = 1, cell = 50, ox = 0, oy = 0;
const bgC = document.createElement('canvas'), bgg = bgC.getContext('2d');
const narrow = () => innerWidth <= 900;
// lay the table out in the space the HUD and tray leave free (measured, so it follows wrapping on phones)
function fit() {
  dpr = FX.fit(cv, 2); W = cv.width; H = cv.height;
  const tray = $('tray').getBoundingClientRect(), hud = $('hud').getBoundingClientRect();
  let l, r, t, b;
  if (narrow()) { l = 6; r = innerWidth - 6; t = hud.bottom + 6; b = tray.top - 62; } // keep room for the angle panel above the tray
  else { l = 380; r = innerWidth - 250; t = 30; b = Math.min(innerHeight - 150, tray.top - 70); }
  cell = Math.max(8, Math.min((r - l) / GW, (b - t) / GH)) * dpr; ox = (l + r) / 2 * dpr - cell * GW / 2; oy = (t + b) / 2 * dpr - cell * GH / 2;
  // background and table holes are static: bake them once per layout
  bgC.width = W; bgC.height = H;
  const bg = bgg.createRadialGradient(W * .55, H * .45, 0, W * .55, H * .45, Math.max(W, H) * .7); bg.addColorStop(0, '#11142a'); bg.addColorStop(1, '#03040a'); bgg.fillStyle = bg; bgg.fillRect(0, 0, W, H);
  bgg.fillStyle = 'rgba(160,170,255,.09)'; bgg.beginPath(); for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { const [px, py] = C(x, y); bgg.moveTo(px + 1.6 * dpr, py); bgg.arc(px, py, 1.6 * dpr, 0, 7); } bgg.fill();
  $('sel').style.bottom = (innerHeight - tray.top + 8) + 'px';
  need = true;
}
addEventListener('resize', () => L && fit());
const C = (x, y) => [ox + (x + .5) * cell, oy + (y + .5) * cell];
function polHue(h, v) { // orientation of the polarisation ellipse → hue (0° red … 90° cyan)
  const a = .5 * Math.atan2(2 * (h[0] * v[0] + h[1] * v[1]), cabs2(h) - cabs2(v)); return ((a * 180 / Math.PI + 180) % 180) * 2; }
function drawPart(p, now) {
  const [x, y] = C(p.x, p.y), s = cell * .38;
  g.save(); g.translate(x, y); g.lineCap = 'round';
  const glow = (col, w = 3) => { g.strokeStyle = col; g.lineWidth = w * dpr; g.shadowColor = col; g.shadowBlur = 10 * dpr; };
  if (p.t === 'mirror' || p.t === 'bs' || p.t === 'pbs') { g.rotate(p.m === 0 ? -Math.PI / 4 : Math.PI / 4); glow(p.t === 'mirror' ? '#dfe6ff' : p.t === 'bs' ? 'rgba(200,215,255,.7)' : '#ffb3f0', p.t === 'mirror' ? 5 : 3); if (p.t !== 'mirror') g.setLineDash([5 * dpr, 4 * dpr]); g.beginPath(); g.moveTo(-s * 1.1, 0); g.lineTo(s * 1.1, 0); g.stroke(); if (p.t === 'pbs') { g.setLineDash([]); g.strokeStyle = 'rgba(255,179,240,.35)'; g.strokeRect(-s * .8, -s * .8, s * 1.6, s * 1.6); } }
  else if (p.t === 'pol' || p.t === 'hwp') {
    g.fillStyle = p.t === 'pol' ? 'rgba(120,130,170,.25)' : 'rgba(255,210,122,.18)'; g.strokeStyle = p.t === 'pol' ? '#9aa3d6' : '#ffd27a'; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(0, 0, s, 0, 7); g.fill(); g.stroke();
    g.rotate(-p.a * Math.PI / 180); glow(p.t === 'pol' ? '#e8ebff' : '#ffd27a', 2.5); g.beginPath(); g.moveTo(-s * .8, 0); g.lineTo(s * .8, 0); g.stroke(); if (p.t === 'pol') for (const k of [-.5, 0, .5]) { g.lineWidth = 1 * dpr; g.beginPath(); g.moveTo(-s * .6, k * s * .6); g.lineTo(s * .6, k * s * .6); g.stroke(); }
  } else if (p.t === 'phase') { g.fillStyle = 'rgba(130,255,200,.18)'; g.strokeStyle = '#82ffc8'; g.lineWidth = 2 * dpr; g.fillRect(-s * .4, -s, s * .8, s * 2); g.strokeRect(-s * .4, -s, s * .8, s * 2); g.fillStyle = '#82ffc8'; g.font = `${10 * dpr}px JetBrains Mono`; g.textAlign = 'center'; g.fillText(p.a + '°', 0, s + 12 * dpr); }
  else if (p.t === 'det') { const hit = Rz.hits[p.id]?.p || 0, pulse = flashes.some(f => f.id === p.id && now - f.t < 250); g.fillStyle = pulse ? '#fff' : `rgba(255,${120 + 135 * hit},${80 + 100 * hit},${.35 + hit * .65})`; g.shadowColor = '#ffb26b'; g.shadowBlur = (8 + hit * 30) * dpr; g.beginPath(); g.roundRect(-s, -s, s * 2, s * 2, 6 * dpr); g.fill(); g.shadowBlur = 0; g.fillStyle = '#0b0d20'; g.font = `700 ${11 * dpr}px Space Grotesk`; g.textAlign = 'center'; g.fillText(p.id, 0, -2 * dpr); g.font = `${10 * dpr}px JetBrains Mono`; g.fillText(Math.round(hit * 100) + '%', 0, 11 * dpr); if (fires[p.id]) { g.fillStyle = '#fff'; g.fillText('×' + fires[p.id], 0, s + 12 * dpr); } }
  else if (p.t === 'bomb') { g.fillStyle = '#2a1a1a'; g.strokeStyle = '#ff5a5a'; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(0, 0, s * .9, 0, 7); g.fill(); g.stroke(); g.fillStyle = '#ff5a5a'; g.font = `${s}px sans-serif`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('💣', 0, 1); if (fires.boom) { g.fillStyle = '#fff'; g.font = `${10 * dpr}px JetBrains Mono`; g.fillText('💥×' + fires.boom + (L.boomBudget && !won ? '/' + L.boomBudget : ''), 0, s + 12 * dpr); } }
  if (sel === p) { g.shadowBlur = 0; g.setLineDash([4 * dpr, 4 * dpr]); g.strokeStyle = '#a9b0ff'; g.lineWidth = 1.5 * dpr; g.strokeRect(-cell * .48, -cell * .48, cell * .96, cell * .96); }

function draw(now) {

    g.strokeStyle = `hsla(${hue},100%,85%,${Math.min(1, p * 1.3) * .92})`; g.lineWidth = (1 + 2.2 * p) * dpr; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();

const particles = FX.particles();

// ================= input =================
const cellAt = e => { const r = cv.getBoundingClientRect(), x = ((e.clientX - r.left) * dpr - ox) / cell, y = ((e.clientY - r.top) * dpr - oy) / cell; return [Math.floor(x), Math.floor(y)]; };
const occupied = (x, y) => L.fixed.find(p => p.x === x && p.y === y) || parts.find(p => p.x === x && p.y === y) || L.sources.find(s => s.x === x && s.y === y);
cv.addEventListener('pointerdown', e => {
  const [x, y] = cellAt(e); if (x < 0 || y < 0 || x >= GW || y >= GH) return;
  const hit = occupied(x, y);
  if (hit && parts.includes(hit)) {
    if (sel === hit && (hit.t === 'mirror' || hit.t === 'bs' || hit.t === 'pbs')) { hit.m ^= 1; FX.sfx('click'); recompute(); check(); } // tap again to flip
    sel = hit; showSel(); return;
  }
  if (hit) { sel = null; showSel(); return; }
  if (tool) {
    const max = L.tray[tool] || 0; if (used(tool) >= max) { FX.sfx('fail'); return; }
    const p = P(tool, x, y, tool === 'phase' ? 90 : 0, 1); // filters and wave plates start at 0°: no free solutions
    parts.push(p); sel = p; FX.sfx('place'); FX.shake(.08); recompute(); renderTray(); showSel(); check(); return;
  }
  sel = null; showSel();
});
function showSel() {
  const el = $('sel'); need = true;
  if (!sel) { el.style.display = 'none'; return; }
  el.style.display = 'flex';
  const angled = sel.t === 'pol' || sel.t === 'hwp' || sel.t === 'phase';
  $('selName').textContent = { pol: 'Polariser axis', hwp: 'Wave-plate axis', phase: 'Phase delay', mirror: 'Mirror: tap it again to flip', bs: 'Half mirror: tap again to flip', pbs: 'Polarising splitter: tap again to flip', bomb: 'Bomb' }[sel.t];
  for (const id of ['selR', 'selN', 'selV']) $(id).style.display = angled ? '' : 'none';
  const mx = sel.t === 'phase' ? 360 : 180; $('selR').max = $('selN').max = mx; $('selR').value = sel.a; if (document.activeElement !== $('selN')) $('selN').value = sel.a;
}
function setAngle(a) { if (!sel || !isFinite(a)) return; a = Math.max(0, Math.min(+$('selR').max, Math.round(a))); if (a === sel.a) return; sel.a = a; if (a % 15 === 0) FX.sfx('tick'); showSel(); recompute(); settle(); }
// An angle only counts once it is HELD: unchanged for a second with the slider released. Sweeping the dial
// past the answer (or typing digits on the way to another number) never wins by accident.
const SETTLE = 1000; let settleH = 0, holding = false, sliding = false;
const hitsNow = () => { const H = {}; for (const k in Rz.hits) H[k] = Rz.hits[k].p; return H; };
function settle() {
  clearTimeout(settleH); settleH = 0;
  const pass = !won && !L.free && L.test(hitsNow(), fires);
  if (pass !== holding) { holding = pass; $('goal').classList.toggle('hold', pass); }
  if (pass) settleH = setTimeout(() => { settleH = 0; if (!sliding) { holding = false; $('goal').classList.remove('hold'); check(); } }, SETTLE);
}
$('selR').addEventListener('pointerdown', () => { sliding = true; });
addEventListener('pointerup', () => { if (sliding) { sliding = false; settle(); } });
addEventListener('pointercancel', () => { if (sliding) { sliding = false; settle(); } });
$('selR').oninput = () => setAngle(+$('selR').value);
$('selN').oninput = () => { if ($('selN').value !== '') setAngle(+$('selN').value); };
$('selN').onchange = () => { $('selN').value = sel ? sel.a : 0; };
$('selDel').onclick = () => { parts = parts.filter(p => p !== sel); sel = null; showSel(); FX.sfx('pop'); recompute(); renderTray(); settle(); };
addEventListener('keydown', e => {
  if (!sel || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return; const st = e.shiftKey ? 1 : 5;
  if (e.key === 'ArrowRight' || e.key === 'ArrowUp') setAngle((Math.floor(sel.a / st) + 1) * st);
  else if (e.key === 'ArrowLeft' || e.key === 'ArrowDown') setAngle((Math.ceil(sel.a / st) - 1) * st);
  else if (e.key === 'Delete' || e.key === 'Backspace') $('selDel').onclick();
  else return; e.preventDefault();
});

// ================= firing single photons =================
// one beam path that ends in hit k: a segment arriving there (weighted by its probability), traced back to the source
function pathTo(hit) {
  let tot = 0; for (const i of hit.segs) tot += Rz.segs[i].p;
  let r = Math.random() * tot, si = hit.segs[hit.segs.length - 1]; for (const i of hit.segs) { r -= Rz.segs[i].p; if (r <= 0) { si = i; break; } }
  const path = []; for (let s = Rz.segs[si]; ; s = Rz.segs[s.par]) { path.push([s.x1, s.y1]); if (s.par < 0) { path.push([s.x0, s.y0]); break; } }
  return path.reverse();
}
function fire(n) {
  for (let i = 0; i < n; i++) later(() => {
    const outs = Object.entries(Rz.hits).map(([k, v]) => [k, v.p, v.c, v]); // the table as it is now, not when the button was pressed
    let r = Math.random(), res = null; for (const o of outs) { r -= o[1]; if (r <= 0) { res = o; break; } }
    if (!res) { FX.sfx('tick'); return; } // absorbed by a filter or lost off the table
    const [k, , c, hit] = res, path = pathTo(hit), now = performance.now();
    photons.push({ path, t: now, dur: Math.max(300, path.length * 28) });
    // the click / boom happens when the photon arrives
    later(() => {
      if (c.t === 'bomb') {
        fires.boom = (fires.boom || 0) + 1; FX.sfx('boom'); FX.shake(.5); const [x, y] = C(c.x, c.y); particles.burst(x, y, { n: 60, color: ['#ff5a5a', '#ffb26b', '#fff'], speed: 380 * dpr, life: .8 });
        if (L.boomBudget && !won && fires.boom >= L.boomBudget) { cancelShots(); fires = {}; FX.sfx('fail'); toast('💥 Lab destroyed', `${L.boomBudget} bombs went off before you got 10 clean detections. Counters reset: try again.`, 6000); }
      } else { fires[k] = (fires[k] || 0) + 1; flashes.push({ id: k, t: performance.now() }); FX.sfx('chime', k.charCodeAt(k.length - 1)); }
      need = true; check();
    }, Math.max(300, path.length * 28));
  }, (i + 1) * 90);
}

// ================= UI =================
const NAMES = { pol: '⊘ Polariser', hwp: '◐ Wave plate', bs: '⟋ Half mirror', pbs: '⧄ Polarising splitter', mirror: '╱ Mirror', phase: '▯ Phase plate', bomb: '💣 Bomb' };
function renderTray() {
  $('tray').innerHTML = Object.entries(L.tray).map(([t, n]) => `<button class="pc ${tool === t ? 'on' : ''}" data-t="${t}">${NAMES[t]} <i>${n - used(t)}</i></button>`).join('') +
    (L.fire ? `<button class="b" id="f1">Fire 1 photon</button><button class="b" id="f20">Fire 20</button>` : `<button class="b ghost" id="f20">Fire 20 photons</button>`) + `<button class="b ghost" id="rst">Reset</button>`;
  $('tray').querySelectorAll('[data-t]').forEach(b => b.onclick = () => { tool = tool === b.dataset.t ? null : b.dataset.t; FX.sfx('click'); renderTray(); renderGoal(); });
  if ($('f1')) $('f1').onclick = () => fire(1);
  $('f20').onclick = () => fire(20);
  $('rst').onclick = () => { load(SAVE.cur); FX.sfx('pop'); };
  fit();
}
const stars = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const nextBtn = () => SAVE.cur < LV.length - 1 && SAVE.done[SAVE.cur] ? `<button class="b" data-next>Next experiment →</button>` : '';
const goNext = () => { FX.sfx('click'); load(SAVE.cur + 1); };
function renderGoal() {
  const ok = SAVE.done[SAVE.cur], st = SAVE.stars[SAVE.cur];
  $('goal').className = (ok ? 'ok' : '') + (holding ? ' hold' : '');
  $('goal').innerHTML = (ok ? '✓ ' : '🎯 ') + L.goal + (st ? ` <span style="color:#ffd27a">${stars(st)}</span>` : '') + (tool || ok ? '' : '<br><span style="color:#8f95c0;font-size:12px">Pick a part below, then click an empty spot on the table. Click a part to adjust it.</span>') + (nextBtn() ? '<br>' + nextBtn() : '');
  $('goal').querySelectorAll('[data-next]').forEach(b => b.onclick = goNext);
  if (L) fit();
}
function renderLevels() {
  const locked = i => !isOpen(i);
  $('levels').innerHTML = '<h4>Experiments</h4>' + LV.map((l, i) => `<div class="lv ${i === SAVE.cur ? 'cur' : ''} ${locked(i) ? 'lock' : ''}" data-i="${i}"><span>${i + 1}. ${l.n}</span><span>${SAVE.done[i] ? '✓' : ''}</span></div>`).join('');
  $('levels').querySelectorAll('.lv').forEach(el => el.onclick = () => { FX.sfx('click'); load(+el.dataset.i); });
  $('lvSel').innerHTML = LV.map((l, i) => `<option value="${i}" ${i === SAVE.cur ? 'selected' : ''} ${locked(i) ? 'disabled' : ''}>${i + 1}. ${l.n}${SAVE.done[i] ? ' ✓' : locked(i) ? ' 🔒' : ''}</option>`).join('');
}
$('lvSel').onchange = () => { FX.sfx('click'); load(+$('lvSel').value); };
function hideToast() { clearTimeout(toast.h); $('toast').classList.remove('on'); }
function toast(big, small, ms = 9000, extra = '') {
  const t = $('toast'); t.innerHTML = `<span class="x" aria-label="Dismiss">✕</span>` + big + (small ? `<small>${small}</small>` : '') + extra; t.classList.add('on');
  t.querySelectorAll('[data-next]').forEach(b => b.onclick = e => { e.stopPropagation(); goNext(); });
  clearTimeout(toast.h); toast.h = setTimeout(hideToast, ms);
}
$('toast').onclick = hideToast;
function check() {
  if (won || L.free) return;
  const H = {}; for (const k in Rz.hits) H[k] = Rz.hits[k].p;
  if (L.test(H, fires)) {
    won = true; SAVE.done[SAVE.cur] = 1;
    let st = '';
    if (L.boomBudget) { const b = fires.boom || 0, n = b <= 20 ? 3 : b <= 30 ? 2 : 1; SAVE.stars[SAVE.cur] = Math.max(SAVE.stars[SAVE.cur] || 0, n); st = ` <span style="color:#ffd27a">${stars(n)}</span>`; }
    persist(); FX.sfx('win'); FX.shake(.25); particles.burst(cv.width / 2, cv.height / 2, { n: 120, color: ['#a9b0ff', '#ffffff', '#ffb3f0'], speed: 460 * dpr, life: 1 });
    toast('✓ ' + L.n + st, L.lesson, 12000, nextBtn() ? '<div>' + nextBtn() + '</div>' : ''); renderGoal(); renderLevels();

}
// render only when something changed or is animating; nothing at all while the tab is hidden
let raf = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  if (need || photons.length || flashes.length || particles.list.length) { need = false; draw(now); }
}
document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else if (!raf) { need = true; raf = requestAnimationFrame(frame); } });
load(+SAVE.cur || 0);
raf = requestAnimationFrame(frame);
window.__pz = { LV, load, simulate, addPart: (t, x, y, a = 0, m = 1) => { if (occupied(x, y)) return null; const p = P(t, x, y, a, m); parts.push(p); recompute(); renderTray(); check(); return p; }, setAngle: (p, a) => { p.a = a; recompute(); check(); }, hits: () => Rz.hits, fire, get fires() { return fires; }, get parts() { return parts; }, get won() { return won; }, select: p => { sel = p; showSel(); }, setAngleUI: a => setAngle(a), get holding() { return holding; }, SAVE };
