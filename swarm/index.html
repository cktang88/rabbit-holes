<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Swarm Season</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#f3e6cc;--dim:#b9a27e;--honey:#f2b544;--good:#9bd06b;--bad:#e8684a;--chip:rgba(38,24,12,.86);--edge:rgba(255,214,150,.16)}
  html,body{height:100%;overflow:hidden;background:#1d130b;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;color:var(--ink)}
  #cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:default}
  .chip{position:fixed;background:var(--chip);border:1px solid var(--edge);border-radius:16px;box-shadow:0 16px 40px -18px rgba(0,0,0,.8);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
  .fell{font-family:"IM Fell English",Georgia,serif}
  #hud{top:14px;left:14px;width:330px;padding:12px 16px;max-height:calc(100vh - 160px);overflow:auto}
  #hud .home{color:var(--dim);font-size:12px;text-decoration:none}
  #hud h1{margin:2px 0 0;font:400 26px "IM Fell English SC",Georgia,serif;letter-spacing:.02em;color:#fbe7b8}
  #sub{font-size:12px;color:var(--dim);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  #scSel{margin:6px 0 2px;width:100%;font:inherit;font-size:13px;background:#2b1b0d;color:var(--ink);border:1px solid var(--edge);border-radius:9px;padding:6px 8px}
  #date{margin-top:6px;font:400 17px "IM Fell English",Georgia,serif;color:#fbe7b8}
  #date small{font-family:"Space Grotesk",sans-serif;font-size:12px;color:var(--dim);margin-left:6px}
  #goal{margin-top:8px;padding:8px 11px;border-radius:12px;background:rgba(242,181,68,.08);border:1px solid rgba(242,181,68,.28);font-size:13px;line-height:1.45}
  #goal.ok{border-color:var(--good);background:rgba(155,208,107,.12)}
  #goal ul{margin:6px 0 0;padding-left:0;list-style:none;columns:2;font-size:12px}
  #goal li{margin:2px 0}#goal li.done{color:var(--good)}#goal li.done::before{content:'✓ '}#goal li:not(.done)::before{content:'○ ';color:var(--dim)}
  #pips{margin-top:8px;font-size:12px;color:var(--dim);display:flex;align-items:center;gap:6px}
  #pips i{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--honey);box-shadow:0 0 8px rgba(242,181,68,.6)}
  #pips i.used{background:rgba(255,255,255,.12);box-shadow:none}
  #notes{top:14px;right:14px;width:300px;padding:12px 16px;max-height:calc(100vh - 170px);overflow:auto}
  #notes .mast{font:400 12px "IM Fell English SC",Georgia,serif;letter-spacing:.14em;color:var(--dim);border-bottom:1px solid var(--edge);padding-bottom:5px;margin-bottom:8px;text-align:center}
  #notesBody{font:400 15px/1.45 "IM Fell English",Georgia,serif;color:#ecdcbc}
  #notesBody b{color:#fbe7b8}#notesBody .wk{border-top:1px dashed var(--edge);margin-top:8px;padding-top:7px;font-size:14px}
  #notesBody .warn{color:#f4c27a}#notesBody .badn{color:#f19a7e}
  #tray{bottom:14px;left:50%;transform:translateX(-50%);padding:8px;display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 28px)}
  #acts{bottom:76px;left:50%;transform:translateX(-50%);padding:8px;display:none;gap:5px;flex-wrap:wrap;justify-content:center;max-width:min(860px,calc(100vw - 28px))}
  .b{border:0;background:var(--honey);color:#2a1806;font:inherit;font-weight:700;font-size:13px;border-radius:11px;padding:9px 13px;cursor:pointer;transition:transform .08s,filter .15s;white-space:nowrap;touch-action:manipulation}
  .b:active{transform:scale(.94)}.b:disabled{opacity:.35;cursor:default;transform:none}
  .b.ghost{background:rgba(255,236,200,.08);color:var(--ink);font-weight:500}
  .b.ghost.on{background:rgba(242,181,68,.25)}
  .b.act{background:rgba(255,236,200,.07);color:var(--ink);font-weight:500;display:flex;gap:6px;align-items:center;border:1px solid transparent}
  .b.act:hover:not(:disabled){border-color:rgba(242,181,68,.5)}
  .b.act i{font-style:normal;color:var(--honey);font-size:15px;width:16px;text-align:center}
  .b.pulse{animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 6px rgba(242,181,68,.25),0 0 22px rgba(242,181,68,.5)}}
  #banner{position:fixed;top:40%;left:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;text-align:center;font:400 44px "IM Fell English SC",Georgia,serif;color:#fbe7b8;text-shadow:0 6px 40px rgba(0,0,0,.7);transition:opacity .3s,transform .5s cubic-bezier(.3,1.6,.5,1);width:90vw}
  #banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #banner small{display:block;font:400 17px "IM Fell English",Georgia,serif;color:#ecdcbc;margin-top:6px}
  #result{top:50%;left:50%;transform:translate(-50%,-50%);width:min(520px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;padding:18px 20px;display:none;z-index:20}
  #result h2{margin:0;font:400 30px "IM Fell English SC",Georgia,serif;color:#fbe7b8}
  #result .stars{font-size:34px;letter-spacing:6px;color:var(--honey);margin:4px 0}
  #result .stars s{color:rgba(255,255,255,.15);text-decoration:none}
  #result .msg{font:400 17px/1.4 "IM Fell English",Georgia,serif}
  #result .tl{margin-top:10px;font-size:12px;line-height:1.5;max-height:200px;overflow:auto;border-top:1px solid var(--edge);padding-top:8px;font-family:ui-monospace,Menlo,monospace}
  #result .tl div{padding:1px 0}#result .tl .warn{color:#f4c27a}#result .tl .bad,#result .tl .swarm{color:#f19a7e}#result .tl .good{color:#b7e08f}
  #result .row{margin-top:12px;justify-content:flex-end}
  #simbar{top:14px;left:50%;transform:translateX(-50%);padding:6px 8px;display:none;gap:6px;align-items:center;font-size:13px}
  #toastS{position:fixed;left:50%;top:76px;transform:translateX(-50%);z-index:30;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,calc(100vw - 24px))}
  .tst{background:rgba(38,24,12,.94);border:1px solid rgba(242,181,68,.45);border-radius:12px;padding:8px 14px;font:400 15px/1.35 "IM Fell English",Georgia,serif;color:#f3e6cc;animation:tin .25s ease-out;box-shadow:0 10px 30px -10px #000;text-align:center}
  .tst.bad{border-color:rgba(232,104,74,.7)}
  #notesBtn{display:none}
  body.insp #notes{display:none}
  body.insp #hud{width:280px}
  body.insp #story,body.insp #scSel{display:none}
  @media (max-width:860px){
    #hud{top:6px;left:6px;right:6px;width:auto;padding:8px 12px;max-height:34vh}
    body.insp #hud{width:auto}
    #hud h1{font-size:20px;display:inline}
    #sub{display:none}
    #goal ul{font-size:11px;margin-top:3px}#goal li{margin:0}
    body.insp #goal>b{display:none}
    body.insp #hud .home,body.insp #hud h1{display:none}
    #tray{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start}
    #tray .b{flex:0 0 auto}
    #hud .home{margin-right:6px}
    #date{font-size:15px;margin-top:3px}
    #goal{margin-top:5px;padding:6px 9px;font-size:12px}
    #notes{top:auto;bottom:66px;left:6px;right:6px;width:auto;max-height:40vh;display:none;z-index:15}
    #notes.open{display:block}
    body.insp #notes.open{display:block}
    #notesBtn{display:inline-block}
    #tray{left:6px;right:6px;bottom:6px;transform:none;max-width:none;padding:6px;gap:5px}
    #acts{left:6px;right:6px;bottom:58px;transform:none;max-width:none;padding:6px;gap:4px;max-height:30vh;overflow:auto}
    .b{font-size:12px;padding:8px 10px}
    .b.act{padding:7px 8px}
    #simbar{top:auto;bottom:58px}
    #banner{font-size:30px}
    #toastS{top:auto;bottom:150px}
  }
</style>

<body>
<canvas id="cv"></canvas>
<div id="hud" class="chip">
  <a class="home" href="../index.html">← Rabbit Holes</a>
  <h1>Swarm Season</h1>
  <div id="sub" class="fell"><i>Being Notes from The N.Z. Beekeeper, 1914</i></div>
  <select id="scSel" aria-label="Scenario"></select>
  <div id="date"></div>
  <div id="goal"></div>
  <div id="pips"></div>
</div>
<div id="notes" class="chip"><div class="mast">The N.Z. Beekeeper · Notes for the Month</div><div id="notesBody"></div></div>
<div id="acts" class="chip"></div>
<div id="tray" class="chip"></div>
<div id="simbar" class="chip"></div>
<div id="result" class="chip"></div>
<div id="banner"></div>
<div id="toastS"></div>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script>
'use strict';
//#MODEL-START
// ===================== THE COLONY MODEL =====================
// Weekly turns, daily substeps. Cohort arrays for brood (by day since egg) and adults (by day since emergence).
// Calendar: day 0 = 1 Jan 1914. Southern hemisphere: spring Sep–Nov, flow Dec–Jan, winter Jun–Aug.
const M = {
  BB_CELLS: 70000, SUPER_CELLS: 50000, HONEY_G: 0.43, NECTAR_G: 0.35, LMAX: 1600, RIPEN: 0.45,
  A_LEN: 50, WB_LEN: 21, DB_LEN: 24,
};
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS_L = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const LAY_T = [.85,.65,.4,.2,.06,0,.06,.35,.7,.95,1,1];          // queen laying vs. season
const FLOW_T = [.30,.12,.06,.025,.008,0,.003,.04,.12,.19,.24,.32]; // g nectar / forager / day at mid-month
const SWARM_T = [.35,.1,0,0,0,0,0,.15,.55,.9,1,.85];               // seasonal swarm readiness
const WB_FR = [0,.12,.55,.95,1,1,.85,.3,0,0,0,0];                 // fraction of emerging bees that are long-lived winter bees
const MATE_T = [.92,.88,.75,.5,.2,.1,.15,.35,.75,.9,.95,.95];      // mating success
const doyOf = d => ((d % 365) + 365) % 365;
const monthF = d => doyOf(d) / 365 * 12;
function seasonal(T, d) { const m = monthF(d) - .5, i = Math.floor(m), f = m - i; const a = T[(i + 12) % 12], b = T[(i + 13) % 12]; return a + (b - a) * f; }
function dateStr(d, long) { const dt = new Date(Date.UTC(1914, 0, 1) + d * 864e5); return dt.getUTCDate() + ' ' + (long ? MONTHS_L : MONTHS)[dt.getUTCMonth()] + ' ' + dt.getUTCFullYear(); }
function monthOf(d) { return new Date(Date.UTC(1914, 0, 1) + d * 864e5).getUTCMonth(); }
function seasonName(d) { const m = monthOf(d); return m >= 8 && m <= 10 ? 'Spring' : m === 11 || m <= 1 ? 'Summer' : m <= 4 ? 'Autumn' : 'Winter'; }
const clamp = (x, a, b) => x < a ? a : x > b ? b : x;
const sum = (a, i0 = 0, i1 = a.length) => { let s = 0; for (let i = i0; i < i1; i++) s += a[i]; return s; };

// tiny serialisable RNG (mulberry32 state lives in the world)
function wrand(w) { let a = w.rs = (w.rs + 0x6D2B79F5) | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }

function mkHive(o = {}) {
  const lay = o.lay ?? 1000, h = {
    name: o.name || 'Hive A', alive: true, A: new Array(M.A_LEN).fill(0), W: o.winter || 0,
    WB: new Array(M.WB_LEN).fill(0), DB: new Array(M.DB_LEN).fill(0), drones: o.drones ?? 800,
    q: { st: o.qst || 'laying', age: (o.qAge ?? 1) * 365, qual: o.qual ?? .9, t: o.qt || 0 },
    qc: (o.cells || []).map(a => ({ age: a, type: 'swarm' })), cups: o.cups || 0, imp: o.imp || 0,
    bbH: (o.honey ?? 6) * 1000, bbN: (o.nectar ?? 1) * 1000, sH: (o.superHoney || 0) * 1000, sN: 0,
    supers: o.supers || 0, boxes: 1, pollen: o.pollen ?? 3000,
    Mp: 0, Mw: 0, Md: 0, trap: 0, taint: 0, oaTaint: 0, feedT: 0, checkT: 0, demT: 0, noneDays: o.noneDays || 0,
    swarms: 0, harvested: 0, hist: [], log: [], lastWash: null, oaKills: [], queenSeen: -99, cause: '',
  };
  // brood at a steady laying rate
  for (let i = 0; i < M.WB_LEN; i++) h.WB[i] = (o.broodless ? 0 : lay) * Math.pow(.995, i) * (o.patch ?? 1);
  const dfr = o.droneFr ?? .03;
  if (o.broodFrom) for (let i = 0; i < o.broodFrom; i++) h.WB[i] = 0;
  for (let i = 0; i < M.DB_LEN; i++) h.DB[i] = o.broodless ? 0 : lay * dfr;
  // adults: steady emergence, normalised to the requested count
  const sh = []; let s = 1, tot = 0;
  for (let i = 0; i < M.A_LEN; i++) { sh.push(s); tot += s; s *= i < 20 ? .996 : .935; }
  const adults = o.adults ?? 20000;
  for (let i = 0; i < M.A_LEN; i++) h.A[i] = adults * sh[i] / tot;
  if (o.youngOnly) for (let i = 0; i < M.A_LEN; i++) if (i > 30) h.A[i] *= .3;
  const mites = o.mites ?? 200, cappedW = sum(h.WB, 9), cappedD = sum(h.DB, 9);
  const inB = (cappedW + 6 * cappedD) / (cappedW + 6 * cappedD + .4 * (adults + h.W) + 1);
  h.Mp = mites * (1 - inB); h.Mw = mites * inB * cappedW / (cappedW + 6 * cappedD + 1); h.Md = mites * inB - h.Mw;
  return h;
}

const adultsOf = h => sum(h.A) + h.W;
const mitesOf = h => h.Mp + h.Mw + h.Md;
const loadOf = h => 100 * h.Mp / Math.max(200, adultsOf(h)); // phoretic mites per 100 bees ≈ alcohol wash
const storesKg = h => (h.bbH + h.sH + (h.bbN + h.sN) / 3) / 1000;

function nurseAgeOf(h) {
  const a = adultsOf(h); if (a < 1) return 20;
  const old = sum(h.A, 20) / a;
  return old < .3 ? Math.max(10, 20 - (.3 - old) * 45) : 20; // forager shortage → nurses graduate early
}
function castes(h, d) {
  const na = Math.round(nurseAgeOf(h)), fl = seasonal(FLOW_T, d), fw = fl > .01 ? .55 : .2;
  let nurses = sum(h.A, 0, na) + h.W * (1 - fw), foragers = sum(h.A, na) + h.W * fw;
  const tot = nurses + foragers;
  if (nurses < .3 * tot) { nurses = .3 * tot; foragers = .7 * tot; } // foragers revert to nursing when there are no young bees
  return { na, nurses, foragers };
}
function cellsOf(h) {
  const brood = sum(h.WB) + 1.3 * sum(h.DB), nectar = h.bbN / M.NECTAR_G, honey = h.bbH / M.HONEY_G;
  const cap = M.BB_CELLS * h.boxes;
  return { brood, nectar, honey, pollen: h.pollen, cap, free: cap - brood - nectar - honey - h.pollen };
}
function superFree(h) { return M.SUPER_CELLS * h.supers - h.sH / M.HONEY_G - h.sN / M.NECTAR_G; }
// bees only occupy the supers they have started on plus one more: a tower of empty boxes is not "room" to them
const effSupers = h => Math.min(h.supers, (h.sH / M.HONEY_G + h.sN / M.NECTAR_G) / M.SUPER_CELLS + 1);
function congestion(h) {
  const c = cellsOf(h), bbFill = (c.brood + c.nectar + c.honey + c.pollen) / c.cap;
  const space = 27000 * h.boxes + 17000 * effSupers(h), beeFill = adultsOf(h) / space;
  return { cong: .6 * clamp(bbFill, 0, 1.2) + .4 * clamp(beeFill, 0, 1.5), bbFill, beeFill };
}

function logEv(h, w, txt, kind = 'info') { h.log.push({ d: w.day, wk: w.week, txt, kind }); if (w.onEvent) w.onEvent(h, txt, kind); }
const f2 = x => (Math.round(x * 100) / 100).toFixed(2);

// ---------- one day ----------
function stepDay(w, h) {
  if (!h.alive) return;
  const d = w.day, wx = w.weather, S = seasonal(LAY_T, d), F = seasonal(FLOW_T, d) * wx;
  const adults = adultsOf(h), { na, nurses, foragers } = castes(h, d);
  const c = cellsOf(h), totalBrood = sum(h.WB) + sum(h.DB);
  const load = loadOf(h), dwv = 1 + 2 * clamp((load - 2) / 9, 0, 1);
  const mo = monthOf(d);
  // ---- queen laying ----
  let layW = 0, layD = 0;
  if (h.q.st === 'laying') {
    const qa = h.q.age / 365, qual = clamp(h.q.qual - Math.max(0, qa - 1.3) * .3, .15, 1);
    h.q.eff = qual;
    let L = M.LMAX * S * qual * (h.feedT > 0 && S < .9 ? 1.15 : 1);
    const space = 27000 * h.boxes + 17000 * h.supers;
    if (mo >= 6 && mo <= 9 && adults / space < .4) L *= .65;          // cold, oversized box: can't keep brood warm
    if (h.pollen < 300) L *= .5;
    if (storesKg(h) < 1.5) L *= .3;
    if (h.qc.some(q => q.type === 'swarm' && q.age >= 6)) L *= .35; // workers slim the queen down before a swarm
    L = Math.min(L, Math.max(0, c.free) * .3, Math.max(0, 3 * nurses - totalBrood) / 4);
    const df = (mo >= 8 && mo <= 11 ? .04 : mo <= 0 ? .015 : 0) + (h.trap && S > .3 ? .07 : 0);
    layW = L * (1 - df); layD = L * df;
  } else if (h.q.st === 'lw') { layD = Math.min(150, adults * .01); }
  // ---- brood development ----
  const cW = sum(h.WB, 9) + 1, emW = h.WB[M.WB_LEN - 1] * .97 * (1 - clamp(h.Mw / cW * .35, 0, .7)), emD = h.DB[M.DB_LEN - 1] * .95;
  const capW = h.WB[8], capD = h.DB[9];
  for (let i = M.WB_LEN - 1; i > 0; i--) h.WB[i] = h.WB[i - 1] * (i < 9 && nurses < 1500 ? .9 : .997);
  h.WB[0] = layW;
  for (let i = M.DB_LEN - 1; i > 0; i--) h.DB[i] = h.DB[i - 1] * .995;
  h.DB[0] = layD;
  h.drones = h.drones * (mo >= 2 && mo <= 7 ? .85 : .965) + emD;
  // ---- mites: phoretic → capping cells → reproduce → emerge ----
  const inv = h.Mp * Math.min(.5, .85e-4 * capW + 7e-4 * capD);
  const outW = h.Mw / 12, outD = h.Md / 14;
  h.Mp += -inv + outW * 1.55 + outD * 2.3;
  h.Mw += inv * capW / (capW + 8 * capD + 1e-9) - outW;
  h.Md += inv * 8 * capD / (capW + 8 * capD + 1e-9) - outD;
  const mm = .994; h.Mp *= mm; h.Mw *= mm; h.Md *= mm;
  if (sum(h.WB, 9) < 1) { h.Mp += h.Mw; h.Mw = 0; }
  if (sum(h.DB, 9) < 1) { h.Mp += h.Md; h.Md = 0; }
  // ---- adults ----
  const pW = seasonal(WB_FR, d);
  const fl = seasonal(FLOW_T, d), active = fl > .01;
  const fm = .018 + .037 * clamp(fl / .15, 0, 1);
  for (let i = M.A_LEN - 1; i > 0; i--) {
    const m = (i - 1 < na ? .004 : fm) * dwv;
    h.A[i] = h.A[i - 1] * (1 - m);
  }
  h.A[0] = emW * (1 - pW);
  const wm = (mo >= 2 && mo <= 6) ? 1 / 170 : mo === 7 ? .012 : mo === 8 ? .03 : .06;
  h.W = h.W * (1 - wm * (1 + 3 * clamp((load - 2) / 8, 0, 1))) + emW * pW;
  // ---- forage & stores ----
  const nectarIn = foragers * F * (h.disturbed ? .7 : 1);
  let toS = 0;
  const sf = superFree(h);
  if (h.supers > 0 && sf > 0) toS = Math.min(nectarIn * .88, sf * M.NECTAR_G);
  let toB = Math.min(nectarIn - toS, Math.max(0, c.free * .5) * M.NECTAR_G);
  h.sN += toS; h.bbN += toB;
  if (h.feedSyrup > 0) { const x = Math.min(h.feedSyrup, 1500); h.feedSyrup -= x; const xs = h.supers && sf > 0 && F > .02 ? x * .45 : 0; h.sH += xs * .8; h.taint += xs * .8; h.bbH += (x - xs) * .8; }
  // ripen 3:1
  const rb = h.bbN * M.RIPEN, rs = h.sN * M.RIPEN;
  h.bbN -= rb; h.bbH += rb / 3; h.sN -= rs; h.sH += rs / 3;
  // bees move brood-box honey up into supers during flow when there's room
  if (h.supers && F > .05 && superFree(h) > 2000 && h.bbH > 7000) { const mv = (h.bbH - 7000) * .008; h.bbH -= mv; h.sH += mv; }
  // pollen
  h.pollen = clamp(h.pollen + foragers * F * .6 - sum(h.WB, 3, 9) * .05, 0, 9000);
  // consumption (honey-equivalent grams)
  let cons = .0065 * (.6 + .4 * S) * adults + (active ? .008 * foragers : 0) + .025 * sum(h.WB, 3, 9) + .015 * h.drones;
  const fromN = Math.min(h.bbN / 3, cons); h.bbN -= fromN * 3; cons -= fromN;
  const fromSN = Math.min(h.sN / 3, cons); h.sN -= fromSN * 3; cons -= fromSN;
  const fromB = Math.min(h.bbH, cons); h.bbH -= fromB; cons -= fromB;

function doSwarm(w, h) {

    const na = Math.PI + clamp(kg / 80, 0, 1) * Math.PI; ctx.strokeStyle = '#a02a10'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx, cy + jh / 2 + 38); ctx.lineTo(cx + Math.cos(na) * 20, cy + jh / 2 + 38 + Math.sin(na) * 20); ctx.stroke();
    ctx.fillStyle = '#fbe7b8'; ctx.font = '400 30px "IM Fell English SC",Georgia,serif'; ctx.textAlign = 'center'; ctx.fillText(kg.toFixed(1) + ' kg', cx, cy - jh / 2 - 30);
    if (k < 1 && Math.random() < .3) FX.sfx('tick');
  }
}

// ---------- fast-forward a week ----------
function nextWeek(n = 1) {
  if (!W || ff || view === 'end') return;
  if (view === 'inspect') closeHive(1);
  ff = { left: n, day: 0, acc: 0, dayDur: n > 1 ? .07 : .2, pause: 0 };
  beginWeek(W); FX.sfx('whoosh'); renderUI();
}
function tickFF(dt) {
  if (!ff) return;
  if (ff.pause > 0) { ff.pause -= dt; return; }
  ff.acc += dt;
  while (ff && ff.acc >= ff.dayDur) {
    ff.acc -= ff.dayDur; dayTick(W); ff.day++;
    if (W.swarmEvents.length) { const h = W.swarmEvents.shift(); launchSwarm(h); ff.pause = 4.2; W.swarmEvents.length = 0; }
    if (ff.day % 7 === 0) {
      endWeek(W); weeklyNote(); autosave();
      if (W.sc.free && monthOf(W.day) === 8 && W.day % 365 < 250 + 7 && W.day % 365 >= 243) yearLedger();
      if (checkEnd()) { ff = null; return; }
      if (--ff.left <= 0) { ff = null; FX.sfx('chime', 2); renderUI(); return; }
      beginWeek(W);
    }
    if (ff && ff.pause > 0) break;
  }
  updateHud();
}
function yearLedger() { const kg = cleanKg(W); banner('1 September', `Year ${Math.round((W.day - SC.start) / 365)}: ${alive(W).length} colonies, ${kg.toFixed(0)} kg of honey all told`, 3200); }
// floats are rounded to 5 significant figures: the run save stays well under the localStorage quota
const saveNum = (k, v) => typeof v === 'number' && !Number.isInteger(v) ? +v.toPrecision(5) : v;
function autosave() { try { const o = { sc: SC.id, w: { ...W, sc: null, onEvent: null, swarmEvents: [] } }; localStorage.setItem('rh:swarm-run', JSON.stringify(o, saveNum)); } catch (e) {} }
function resume() {
  try { const o = JSON.parse(localStorage.getItem('rh:swarm-run') || 'null'); if (!o) return false; const i = SCEN.findIndex(s => s.id === o.sc); if (i < 0) return false;
    startScenario.resuming = 1; startScenario(i); startScenario.resuming = 0; Object.assign(W, o.w); W.sc = SCEN[i]; W.onEvent = onModelEvent; if (SC.tutorial) W.tut = W.tut || { found: {}, wrong: 0, driven: 0 }; notes.push({ html: `<i>Resumed at week ${W.week}.</i>` }); renderUI(); return true; } catch (e) { return false; }
}

// ---------- particles (UI bursts) ----------
const ps = FX.particles(600);
function burst(x, y, n, color) { ps.burst(x, y, { n, color, speed: 260, life: .8, size: 3, gravity: 160 }); }

// ---------- DOM UI ----------
function updateHud() {
  if (!W) return;
  const wk = Math.min(W.week + 1, SC.weeks);
  $('date').innerHTML = `${dateStr(W.day, 1)}<small>${seasonName(W.day)} · week ${wk}${SC.weeks < 999 ? ' of ' + SC.weeks : ''}</small>`;
  $('pips').innerHTML = view === 'end' ? '' : `Time this week ${Array.from({ length: W.actsPerWeek }, (_, k) => `<i class="${k < W.actsLeft ? '' : 'used'}"></i>`).join('')}`;
}
function renderUI() {
  if (!W) return;
  const sel = $('scSel'), u = unlockedUpTo();
  sel.innerHTML = SCEN.map((s, i) => `<option value="${i}" ${i > u ? 'disabled' : ''} ${i === SCI ? 'selected' : ''}>${s.free ? '∞' : i + 1}. ${s.n}${SAVE.done[s.id] ? ' ' + '★'.repeat(SAVE.done[s.id]) : i > u ? ' 🔒' : ''}</option>`).join('');
  let goal = `<b>${SC.n}.</b> ${SC.goal}`;
  if (W.tut) goal += `<ul>${TUT_TARGETS.map(t => `<li class="${W.tut.found[t] ? 'done' : ''}">${TUT_NAMES[t]}</li>`).join('')}</ul>`;
  $('goal').innerHTML = goal; $('goal').className = result && result.won ? 'ok' : '';
  $('notesBody').innerHTML = notes.slice().reverse().map(n => `<div class="${n.wk ? 'wk' : ''}">${n.html}</div>`).join('');
  updateHud();
  // tray
  const tr = $('tray'); let html = '';
  if (view === 'inspect') {
    html += `<button class="b ghost ${insp && insp.hint ? 'pulse' : ''}" id="tSmoke" title="Smoke (S)">💨 Smoke</button><button class="b ghost" id="tPrev" title="Previous frame (←)">◂</button><button class="b ghost" id="tFlip" title="Turn frame over (F)">⟲ Turn</button><button class="b ghost" id="tNext" title="Next frame (→)">▸</button><button class="b" id="tClose">Close up</button>`;
  } else if (view === 'apiary') {
    const al = W.hives.map((h, i) => [h, i]).filter(x => x[0].alive);
    html += al.length <= 4 ? al.map(([h, i]) => `<button class="b ghost" data-open="${i}">Open ${h.name}</button>`).join('') : `<span class="fell" style="font-size:14px;padding:0 6px">Tap a hive to open it</span>`;
    html += `<button class="b ${W.actsLeft === 0 ? 'pulse' : ''}" id="tWeek" ${ff ? 'disabled' : ''}>Next week ▸</button>`;
    if (SC.long || SC.weeks >= 20) html += `<button class="b ghost" id="tSkip" ${ff ? 'disabled' : ''} title="Four weeks at once">▸▸ 4 weeks</button>`;
  } else html += `<button class="b ghost" id="tRetry">Try again</button>` + (simOn ? '' : '');
  html += `<button class="b ghost ${simOn ? 'on' : ''}" id="tSim" title="Model curves (V)">Sim view</button><button class="b ghost" id="notesBtn">Notes</button>`;
  tr.innerHTML = html;
  tr.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openHive(+b.dataset.open));
  const on = (id, f) => { const e = $(id); if (e) e.onclick = f; };
  on('tSmoke', smokePuff); on('tPrev', () => changeFrame(-1)); on('tNext', () => changeFrame(1)); on('tFlip', () => changeFrame(0, 1)); on('tClose', () => closeHive());
  on('tWeek', () => nextWeek(1)); on('tSkip', () => nextWeek(4)); on('tRetry', () => startScenario(SCI));
  on('tSim', () => { simOn = !simOn; renderUI(); }); on('notesBtn', () => $('notes').classList.toggle('open'));
  // interventions
  const ac = $('acts');
  if (view === 'inspect' && SC.allowed.length) {
    const h = hive();
    ac.style.display = 'flex';
    ac.innerHTML = SC.allowed.map(id => { const a = ACT[id], ok = a.ok(h, W); const dis = W.actsLeft <= 0 || ok !== true; return `<button class="b act" data-act="${id}" ${dis ? 'disabled' : ''} title="${(ok === true ? a.tip : ok).replace(/"/g, '&quot;')}"><i>${a.ic}</i>${id === 'drone' && h.trap ? 'Cut drone comb' : a.n}</button>`; }).join('');
    ac.querySelectorAll('[data-act]').forEach(b => b.onclick = () => doAct(b.dataset.act));
  } else ac.style.display = 'none';
  // sim bar: hive switch
  const sb = $('simbar');
  if (simOn && W.hives.length > 1) { sb.style.display = 'flex'; sb.innerHTML = W.hives.map((h, i) => `<button class="b ghost ${i === curHive ? 'on' : ''}" data-h="${i}">${h.name}${h.alive ? '' : ' †'}</button>`).join(''); sb.querySelectorAll('[data-h]').forEach(b => b.onclick = () => { if (view !== 'inspect') { curHive = +b.dataset.h; renderUI(); } }); }
  else sb.style.display = 'none';
  $('result').style.display = view === 'end' && !simOn ? 'block' : 'none';
  requestAnimationFrame(measurePads);
}
$('scSel').onchange = e => startScenario(+e.target.value);

// ---------- main loop ----------
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (document.hidden) return;
  if (FX.frozen()) dt = 0;
  T += dt;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [sx, sy] = FX.shakeOffset(10);
  ctx.translate(sx, sy);
  if (!W) return;
  tickFF(dt);
  if (view === 'inspect' && insp) drawInspect(dt);
  else if (view === 'end') drawEnd(dt);
  else drawApiary(dt);
  if (simOn) drawSim();
  ps.update(dt); ps.draw(ctx);
  // vignette
  ctx.fillStyle = grad('vg' + VW + 'x' + VH, () => { const vg = ctx.createRadialGradient(VW / 2, VH / 2, Math.min(VW, VH) * .35, VW / 2, VH / 2, Math.max(VW, VH) * .75); vg.addColorStop(0, 'rgba(20,10,0,0)'); vg.addColorStop(1, 'rgba(20,10,0,.45)'); return vg; }); ctx.fillRect(-20, -20, VW + 40, VH + 40);
}

// ---------- debug / test handle ----------
function summary(i = 0) {
  const h = W.hives[i]; if (!h) return null; const c = castes(h, W.day), cg = congestion(h);
  return { name: h.name, alive: h.alive, day: W.day, date: dateStr(W.day), week: W.week, adults: Math.round(adultsOf(h)), nurses: Math.round(c.nurses), foragers: Math.round(c.foragers), winterBees: Math.round(h.W), brood: Math.round(sum(h.WB)), droneBrood: Math.round(sum(h.DB)),
    honeyKg: +(h.bbH / 1000).toFixed(2), superHoneyKg: +(h.sH / 1000).toFixed(2), nectarKg: +((h.bbN + h.sN) / 1000).toFixed(2), storesKg: +storesKg(h).toFixed(2), harvestedKg: +(h.harvested / 1000).toFixed(2), supers: h.supers,
    mites: Math.round(mitesOf(h)), load: +loadOf(h).toFixed(2), impulse: +h.imp.toFixed(3), congestion: +cg.cong.toFixed(3), queen: { ...h.q }, cells: h.qc.length, cups: h.cups, swarms: h.swarms, oaKills: h.oaKills.map(k => +k.pct.toFixed(1)), log: h.log.map(e => `wk${e.wk + 1} ${e.txt}`) };
}
window.__bee = {
  scenarios: SCEN.map(s => s.id),
  load(i) { if (typeof i === 'string') i = SCEN.findIndex(s => s.id === i); startScenario(i); return summary(); },
  step(n = 1) { for (let k = 0; k < n && !result; k++) { if (view === 'inspect') closeHive(1); stepWeek(W); weeklyNote(); if (checkEnd()) break; } renderUI(); return summary(); },
  act(id, hi = 0) { curHive = hi; try { return applyAct(W, W.hives[hi], id); } catch (e) { return 'ERR ' + e.message; } finally { renderUI(); checkEnd(); } },
  state: (i = 0) => summary(i), hives: () => W.hives.map((h, i) => summary(i)), world: () => W, result: () => result, view: () => view,
  open(i = 0) { openHive(i); return view; }, close() { closeHive(); }, frame(f, side = 0, box = 0) { if (!insp) return; insp.box = box; insp.frame = f; insp.side = side; insp.pull = 1; spawnBees(); }, smoke: smokePuff,
  sim(on = true) { simOn = on; renderUI(); }, next: nextWeek, identify(t) { tutHit(t); return W.tut; },
  cellAt(f, side, r, c, box = 0) { if (!insp) openHive(curHive); const b = insp.boxes[box]; const i = (f * 2 + side) * PER + r * COLS + c; return b.type[i]; },
  cellScreen(r, c) { const fg = insp.fg || frameGeom(); return toScreen(cellX(c, r), cellY(r), fg); },
  queenScreen() { if (!insp || !insp.queen) return null; const fg = insp.fg || frameGeom(); return toScreen(insp.queen.x, insp.queen.y, fg); },
  findCell(t) { if (!insp) return null; const b = curB(), si = sideIdx(); for (let j = 0; j < PER; j++) if (b.type[si * PER + j] === t) return { r: j / COLS | 0, c: j % COLS }; return null; },
  insp: () => insp && { frame: insp.frame, side: insp.side, box: insp.box, agit: insp.agit, queenHere: !!insp.queen, bees: insp.bees.length },
  counts(box = 0) { if (!insp) return null; const b = insp.boxes[box], n = {}; for (const t of b.type) n[t] = (n[t] || 0) + 1; return n; },
};

// ---------- boot ----------
resize();
if (!resume()) startScenario(Math.min(SAVE.cur || 0, Math.max(0, unlockedUpTo())));
requestAnimationFrame(frame);
</script>
