<script>
'use strict';
// ================= the physics: Nakaya's morphology diagram =================
// After Nakaya (1954) and the Kobayashi/Libbrecht morphology diagram. The axes are the two things a cloud sets: air temperature
// and the excess vapour density over ice (g/m³; 0 = ice saturation). Temperature decides plates or columns: plates from 0 to
// −4 °C, columns and needles from −4 to −10 °C (needles near −5 °C), plates again from −10 to −22 °C (stellar dendrites and
// fernlike stars near −15 °C), and mixed plates and columns below about −22 °C. Supersaturation decides how branched: near ice
// saturation the crystal grows slowly into faceted prisms; well above it, the corners outrun the faces and branch.
// Below ice saturation nothing grows: the crystal sublimates and its corners round off. Above water saturation the air holds
// supercooled droplets, which freeze onto the crystal (riming) and, given long enough, bury it as graupel.
const TMIN = -30, TMAX = 0, DMIN = -.06, DMAX = .32;
const esW = T => 6.1121 * Math.exp(17.62 * T / (243.12 + T)), esI = T => 6.1121 * Math.exp(22.46 * T / (272.62 + T)); // hPa, Magnus fits (WMO)
const rhoV = (e, T) => e * 1e5 / (461.5 * (T + 273.15)); // vapour density, g/m³
const rhoI = T => rhoV(esI(T), T), waterLine = T => rhoV(esW(T), T) - rhoI(T); // the excess at water saturation: Nakaya's curve
const sigmaI = (T, r) => r / rhoI(T) * 100; // supersaturation over ice, %
const fmtV = (T, r) => `${r >= 0 ? '+' : '−'}${Math.abs(r).toFixed(2)} g/m³ (${Math.abs(sigmaI(T, r)) < 10 ? sigmaI(T, r).toFixed(1) : Math.round(sigmaI(T, r))}% over ice)`;
const fmtT = T => (T < 0 ? '−' : '') + Math.abs(T).toFixed(1) + ' °C';
function habit(T, r) {
  if (T > -4) return r < .05 ? 'plate' : 'sector';
  if (T > -10) return r < .04 ? 'column' : (T <= -4 && T >= -6.5 && r >= .11) ? 'needle' : 'hollow';
  if (T > -22) return r < .04 ? 'plate' : r < .1 ? 'sector' : (T <= -13 && T >= -17 && r >= .15) ? 'dendrite' : 'stellar';
  return r < .06 ? 'plate' : 'column';
}
const isRime = l => l.s > waterLine(l.T) + .005, isSub = l => l.s < 0;
const PLATE = new Set(['plate', 'sector', 'stellar', 'dendrite']), KINDS = ['plate', 'sector', 'stellar', 'dendrite', 'column', 'hollow', 'needle'];
const KNAME = { plate: 'hexagonal plate', sector: 'sectored plate', stellar: 'stellar arms', dendrite: 'fern-like dendrite', column: 'solid column', hollow: 'hollow column', needle: 'needle' };
// relative growth speed of each habit per unit of excess vapour: branched tips outrun faceted faces (Libbrecht 2005)
const RATE = { plate: .7, sector: 1, stellar: 1.3, dendrite: 1.6, column: .8, hollow: 1.1, needle: 1.8 };
// Grow through a sounding: layers [{T, s, d}] top to bottom, s = excess vapour over ice (g/m³), d = time spent there.
// Growth speed is proportional to the excess (diffusion-limited), so size scales with time and supersaturation. Above water
// saturation the droplets hold the vapour at the water line (the excess goes into rime); below ice saturation the crystal
// shrinks. The flake keeps a radial record (plate growth, centre outwards) and an axial record (column growth, middle to ends).
function grow(layers) {
  let a = .25, c = .25, amax = a, rime = 0, sub = 0; const rad = [], ax = [], marks = [];
  for (const L of layers) {
    if (L.s < 0) { const v = L.d * -L.s / .1 * .8; a = Math.max(.12, a - v); c = Math.max(.12, c - v); sub += v;
      for (const g of rad) g.r1 = Math.min(g.r1, a); for (const g of ax) g.c1 = Math.min(g.c1, c);
      marks.push({ a, kind: 'sub', s: L.s, v }); continue; }

    const r = Math.min(L.s, waterLine(L.T)), k = habit(L.T, r), v = L.d * RATE[k] * r / .1;
    // plate growth after a column has grown sits on the column's ends as caps; before it, in the middle
    if (PLATE.has(k)) { rad.push({ r0: a, r1: a + v, kind: k, cap: ax.length > 0 }); a += v; c += L.d * .04 * r / .1; }
    else { ax.push({ c0: c, c1: c + v, kind: k, a }); c += v; a += L.d * .04 * r / .1; }
    amax = Math.max(amax, a); marks.push({ a, kind: k, s: r }); }

  for (let i = ax.length - 1; i >= 0; i--) if (ax[i].c1 <= ax[i].c0) ax.splice(i, 1);
  return { a, c, amax, rad, ax, marks, rime, sub, caps: rad.some(s => s.cap) };
}
// Compare two crystals by what an observer can see: the kind of growth at each distance from the centre (top view) and along
// the axis (side view), sampled in 24 steps over the larger of the two. 1 = identical in kind and proportion.
// Compare two crystals by what an observer can measure: their rings from the centre out (plates grown first, then the column,
// then caps), each with its habit and its width. Ring by ring, a wrong habit scores nothing and a right one scores the ratio of the
// widths, weighted by how big the ring is. So the score rises steadily as a guess gets closer, and two different growth orders never match.
const rings = cr => { const out = []; for (const g of [...cr.rad.filter(g => !g.cap), ...cr.ax, ...cr.rad.filter(g => g.cap)]) { const e = (g.r1 ?? g.c1) - (g.r0 ?? g.c0), k = g.kind + (g.cap ? '^' : ''); if (e <= 0) continue; if (out.length && out.at(-1).k === k) out.at(-1).e += e; else out.push({ k, e }); } return out; };
function similarity(A, B) { const a = rings(A), b = rings(B), n = Math.max(a.length, b.length); let num = 0, den = 0;
  for (let i = 0; i < n; i++) { const x = a[i], y = b[i], w = Math.max(x?.e || 0, y?.e || 0); den += w; if (x && y && x.k === y.k) num += w * Math.min(x.e, y.e) / Math.max(x.e, y.e); }
  return den ? num / den : 1; }
function ringReport(T, M) { // what a microscopist would tell you, ring by ring
  const a = rings(T), b = rings(M), nm = k => (k.endsWith('^') ? 'caps of ' : '') + KNAME[k.replace('^', '')], out = [];
  for (let i = 0; i < Math.max(a.length, b.length); i++) { const x = a[i], y = b[i], where = i === 0 ? 'centre' : i === a.length - 1 ? 'outermost' : 'ring ' + (i + 1);
    if (!x) out.push(`✗ ${where}: yours grew an extra ring (${nm(y.k)})`); else if (!y) out.push(`✗ ${where}: the specimen has ${nm(x.k)} here; yours stopped`);
    else if (x.k !== y.k) out.push(`✗ ${where}: specimen ${nm(x.k)}, yours ${nm(y.k)}`);
    else { const r = y.e / x.e; out.push(`✓ ${where}: ${nm(x.k)}, ${Math.abs(r - 1) < .1 ? 'the right width' : r > 1 ? `yours ${Math.round((r - 1) * 100)}% wider (less time, or drier air)` : `yours ${Math.round((1 - r) * 100)}% narrower (more time, or more vapour)`}`); } }
  return out; }
const MATCH = .9;
// ================= Reiter's hexagonal automaton: what the crystal looks like =================
// The picture is grown, not drawn: Clifford Reiter's (2005) cellular model of vapour diffusing onto a hexagonal lattice.
// Each cloud layer sets the model's background vapour (beta) and vapour supply (gamma) and runs until the crystal reaches
// the size that layer's growth gives it, so every layer leaves a visible ring: solid plates, sectors, broad arms or ferns.
const N = 181, CC = N >> 1, NN = N * N, RMAX = CC - 8, NB = [1, -1, N, -N, N - 1, -N + 1], DIST = new Float32Array(NN);
for (let k = 0; k < NN; k++) { const q = k % N - CC, r = (k / N | 0) - CC; DIST[k] = (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2; }
// vapour supply γ per habit (log scale from 0.0001 to 0.4): Reiter's own phase diagram gives solid hexagons near γ ≈ 0.4,
// sectored plates near 0.05, broad stars near 0.005 and ferns below 0.001
const BMIN = .3, BMAX = .55, GMIN = .0001, GMAX = .4, LOOK = { plate: 1, sector: .75, stellar: .47, dendrite: .13, column: 1, hollow: 1, needle: 1 };
const reiterOf = (kind, r) => [BMIN + (BMAX - BMIN) * (.15 + .7 * Math.max(0, Math.min(1, r / .22))), Math.exp(Math.log(GMIN) + (Math.log(GMAX) - Math.log(GMIN)) * LOOK[kind])];
function Sim() { return { nz: new Float32Array(NN).fill(1), s: new Float32Array(NN), u: new Float32Array(NN), v: new Float32Array(NN), un: new Float32Array(NN), fr: new Uint8Array(NN), born: new Uint16Array(NN), R: 0, steps: 0, beta: .4, gamma: .001 }; }
function seedSim(o, b, gm) { o.beta = b; o.gamma = gm; o.s.fill(b); o.fr.fill(0); o.born.fill(0); o.R = 0; o.steps = 0; const c = CC * N + CC; o.s[c] = 1; o.fr[c] = 1; }
function stepSim(o) {
  const { s, u, v, un, fr, born } = o, beta = o.beta, gamma = o.gamma, lim = Math.min(CC - 1, o.R + 14);
  for (let y = CC - lim; y <= CC + lim; y++) for (let x = CC - lim, k = y * N + x; x <= CC + lim; x++, k++) { if (DIST[k] > lim) continue;
    let rec = fr[k]; if (!rec) for (let d = 0; d < 6; d++) if (fr[k + NB[d]]) { rec = 1; break; }
    if (rec) { u[k] = 0; v[k] = s[k] + gamma * o.nz[k]; } else { u[k] = s[k]; v[k] = 0; } }
  for (let y = CC - lim; y <= CC + lim; y++) for (let x = CC - lim, k = y * N + x; x <= CC + lim; x++, k++) { if (DIST[k] > lim) continue;
    if (DIST[k] > lim - 1) { un[k] = beta; continue; } const a = u[k + 1] + u[k - 1] + u[k + N] + u[k - N] + u[k + N - 1] + u[k - N + 1]; un[k] = u[k] + .5 * (a / 6 - u[k]); }
  for (let y = CC - lim; y <= CC + lim; y++) for (let x = CC - lim, k = y * N + x; x <= CC + lim; x++, k++) { if (DIST[k] > lim) continue;
    s[k] = un[k] + v[k]; if (!fr[k] && s[k] >= 1) { fr[k] = 1; born[k] = o.steps; if (DIST[k] > o.R) o.R = DIST[k]; } }
  o.steps++;
}
const OS = 300, PX = (() => { const P = new Int32Array(OS * OS), sc = OS / (N * .95); for (let py = 0; py < OS; py++) for (let px = 0; px < OS; px++) { const x = (px - OS / 2) / sc, y = (py - OS / 2) / sc, r = y / (Math.sqrt(3) / 2), q = x - r / 2, rq = Math.round(q) + CC, rr = Math.round(r) + CC; P[py * OS + px] = rr >= 0 && rr < N && rq >= 0 && rq < N ? rr * N + rq : -1; } return P; })();
function erodeSim(o, passes, rnd) { // sublimation: boundary cells with few frozen neighbours (tips, corners) go first
  const c0 = CC * N + CC;
  for (let p = 0; p < passes; p++) { const lim = Math.min(CC - 1, o.R + 2), kill = [];
    for (let y = CC - lim; y <= CC + lim; y++) for (let x = CC - lim, k = y * N + x; x <= CC + lim; x++, k++) { if (!o.fr[k] || k === c0) continue;
      let n = 0; for (let d = 0; d < 6; d++) n += o.fr[k + NB[d]]; if (n < 6 && (n <= 3 || (n === 4 && rnd() < .35))) kill.push(k); }
    if (!kill.length) break; for (const k of kill) { o.fr[k] = 0; o.s[k] = o.beta; } }
  let R = 0; for (let k = 0; k < NN; k++) if (o.fr[k] && DIST[k] > R) R = DIST[k]; o.R = R;
}
const crystals = new Map(); // sounding -> its growing automaton and picture
function crystalFor(layers) {
  const key = JSON.stringify(layers.map(l => [l.T, l.s, l.d])); if (crystals.has(key)) return crystals.get(key);
  // every layer is a phase: grow until the radius that layer's growth reaches (all six arms share it, so they stay in step),
