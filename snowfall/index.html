<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snowfall</title>
<link rel="stylesheet" href="../shared/common.css">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html,body{height:100%;overflow:hidden;background:#060b18;font-family:"Space Grotesk",ui-sans-serif,system-ui,sans-serif;color:#e8f1ff}
  #sky{position:fixed;inset:0;width:100%;height:100%}
  .chip{position:fixed;background:rgba(14,24,48,.6);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(160,200,255,.12);border-radius:18px;box-shadow:0 16px 40px -18px rgba(0,0,0,.8)}
  #hud{top:16px;left:16px;padding:14px 18px;width:330px}
  #hud .home{color:#8ea3c4;font-size:12px;text-decoration:none}
  #hud h1{font-family:Fraunces,Georgia,serif;font-weight:700;margin:4px 0;font-size:28px;letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
  #storyT{display:none;border:0;background:rgba(255,255,255,.08);color:#cfe6ff;border-radius:50%;width:26px;height:26px;font:inherit;font-size:14px;cursor:pointer;margin-left:auto}
  #story{font-size:14px;line-height:1.5;color:#bcd0ee}
  #story b{color:#fff}
  .btn{border:0;background:#cfe6ff;color:#0b1a33;font:inherit;font-weight:700;border-radius:12px;padding:10px 16px;cursor:pointer;transition:transform .08s,opacity .2s}
  .btn:active{transform:scale(.95)} .btn.ghost{background:rgba(255,255,255,.08);color:#e8f1ff;font-weight:500}
  .btn.ghost.on{background:rgba(207,230,255,.22);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;margin-top:10px;align-items:center}
  #rel{flex:1;white-space:nowrap}
  #padBox{right:16px;bottom:16px;padding:12px;width:284px;box-sizing:border-box}
  #pad{width:100%;height:200px;border-radius:12px;display:block;cursor:crosshair;touch-action:none}
  .padLbl{display:flex;justify-content:space-between;font-size:11px;color:#8ea3c4;margin-top:6px}
  #status{font-size:13px;color:#bcd0ee;margin:0 2px 8px;min-height:36px;line-height:1.35}
  #status b{color:#fff;font-size:15px}
  #status .btn{padding:3px 10px;font-size:12px;margin-left:4px}
  #bar{height:4px;border-radius:2px;background:rgba(255,255,255,.08);margin:0 2px 10px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#9fd0ff,#fff);border-radius:2px}
  #mode{top:16px;right:16px;padding:6px;display:flex;gap:4px}
  #mode button{border:0;background:transparent;color:#bcd0ee;font:inherit;font-size:13px;padding:8px 12px;border-radius:10px;cursor:pointer}
  #mode button.on{background:rgba(207,230,255,.18);color:#fff}
  body.busy #mode button,body.busy .tg{opacity:.45;pointer-events:none}
  #side{top:70px;right:16px;padding:12px;width:284px;box-sizing:border-box;max-height:calc(100vh - 460px);min-height:120px;overflow:auto}
  #side h4{margin:2px 4px 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8ea3c4;font-weight:600;display:flex;justify-content:space-between;align-items:center}
  #side h4 button{display:none;border:0;background:rgba(255,255,255,.08);color:#e8f1ff;border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;letter-spacing:0;text-transform:none;cursor:pointer}
  .cat{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;font-size:13px}
  .cat img,.cat .sil{width:44px;height:44px;border-radius:8px;background:#0b1530;flex:0 0 auto}
  .cat .sil{display:flex;align-items:center;justify-content:center;color:#3a4d73;font-size:22px}
  .cat.got{background:rgba(207,230,255,.06)}
  .cat small{display:block;color:#8ea3c4;font-size:11px;line-height:1.35}
  .tg{display:flex;gap:8px;align-items:center;padding:6px;border-radius:10px;cursor:pointer;font-size:13px}
  .tg:hover{background:rgba(255,255,255,.06)} .tg.cur{background:rgba(207,230,255,.16)} .tg.lock{opacity:.35;pointer-events:none}
  .tg img,.tg .sil{width:40px;height:40px;border-radius:8px;background:#0b1530;flex:0 0 auto}
  .tg small{color:#8ea3c4;font-size:11px}
  .gal{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .gal img,.gal .sil{width:100%;aspect-ratio:1;border-radius:8px;background:#0b1530;display:block}
  img.pending{opacity:.25}
  .stars{color:#ffd27a}
  #toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(.85);opacity:0;font-family:Fraunces,Georgia,serif;font-size:36px;font-weight:700;pointer-events:none;transition:opacity .35s,transform .6s cubic-bezier(.3,1.6,.5,1);text-align:center;background:rgba(6,12,28,.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(160,200,255,.18);border-radius:18px;padding:16px 24px;width:max-content;max-width:min(440px,calc(100vw - 48px));box-sizing:border-box;z-index:10;box-shadow:0 20px 60px -20px #000}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
  #toast small{display:block;font-family:"Space Grotesk",sans-serif;font-size:15px;font-weight:400;color:#cfe0f8;margin-top:6px;line-height:1.4}
  #sideT{display:none}
  @media (max-width:860px){
    #hud{top:8px;left:8px;right:8px;width:auto;padding:8px 12px;z-index:3}
    #hud h1{font-size:20px;margin:2px 0 0}
    #storyT{display:block}
    #story{display:none;font-size:13px;margin-top:6px}
    body.story #story{display:block}
    #mode{top:72px;left:8px;right:8px;justify-content:center;padding:4px}
    #mode button{padding:6px 10px;flex:1}
    #padBox{left:8px;right:8px;bottom:8px;width:auto;padding:10px}
    #pad{height:118px}
    #status{min-height:0;margin-bottom:6px}
    .row{margin-top:8px}
    #sideT{display:inline-block}
    #side{display:none;top:auto;left:8px;right:8px;bottom:8px;width:auto;max-height:62vh;z-index:6;background:rgba(10,18,38,.94)}
    body.sheet #side{display:block}
    #side h4 button{display:inline-block}
    #toast{font-size:28px}
  }
</style>
</head>

<canvas id="sky"></canvas>
<div id="hud" class="chip"><a class="home" href="../index.html">← Rabbit Holes</a><h1>❄️ Snowfall <button id="storyT" aria-label="How it works">?</button></h1><div id="story"></div></div>

<script>
'use strict';
/*SIM-BEGIN*/
// ================= Reiter's snow crystal model (2005) =================
// Hexagonal cells hold water. Cells that are ice, or touch ice, are "receptive": they keep their water and gain gamma each step.
// Elsewhere water diffuses. A cell freezes when its water reaches 1. Two numbers decide the shape:
//   beta  = background vapour density, gamma = vapour added at the crystal surface.
const N = 181, C = N >> 1, NN = N * N, RMAX = C - 8;
const NB = [1, -1, N, -N, N - 1, -N + 1];
const DIST = new Float32Array(NN), OFF = new Float32Array(NN); // hex distance from centre; angular distance from the nearest arm axis (0..0.5)
for (let k = 0; k < NN; k++) { const q = k % N - C, r = (k / N | 0) - C, d = (Math.abs(q) + Math.abs(r) + Math.abs(q + r)) / 2; DIST[k] = d; OFF[k] = d ? Math.min(Math.abs(q), Math.abs(r), Math.abs(q + r)) / d : 0; }
// the conditions pad: x = vapour density (beta), y = freezing rate (gamma, log scale)
const BMIN = .3, BMAX = .55, GMIN = .0001, GMAX = .05, PADQ = 200;
const ptToParams = p => [BMIN + (BMAX - BMIN) * p.x, Math.exp(Math.log(GMIN) + (Math.log(GMAX) - Math.log(GMIN)) * p.y)];
// a simulation instance owns all of its buffers, so a background replay never touches the falling crystal
function Sim() { return { s: new Float32Array(NN), u: new Float32Array(NN), v: new Float32Array(NN), un: new Float32Array(NN), fr: new Uint8Array(NN), born: new Uint16Array(NN), R: 0, steps: 0, beta: .4, gamma: .001 }; }
function seed(o, b, g) { o.beta = b; o.gamma = g; o.s.fill(b); o.fr.fill(0); o.born.fill(0); o.R = 0; o.steps = 0; const c = C * N + C; o.s[c] = 1; o.fr[c] = 1; }
function step(o) {
  const { s, u, v, un, fr, born } = o, beta = o.beta, gamma = o.gamma;
  // only work inside the active disc: everything beyond R+14 is untouched background
  const lim = Math.min(C - 1, o.R + 14);
  for (let y = C - lim; y <= C + lim; y++) for (let x = C - lim, k = y * N + x; x <= C + lim; x++, k++) {
    if (DIST[k] > lim) continue;
    let rec = fr[k]; if (!rec) for (let d = 0; d < 6; d++) if (fr[k + NB[d]]) { rec = 1; break; }
    if (rec) { u[k] = 0; v[k] = s[k] + gamma; } else { u[k] = s[k]; v[k] = 0; }
  }
  for (let y = C - lim; y <= C + lim; y++) for (let x = C - lim, k = y * N + x; x <= C + lim; x++, k++) {
    if (DIST[k] > lim) continue;
    if (DIST[k] > lim - 1) { un[k] = beta; continue; }
    const a = u[k + 1] + u[k - 1] + u[k + N] + u[k - N] + u[k + N - 1] + u[k - N + 1];
    un[k] = u[k] + .5 * (a / 6 - u[k]);
  }
  for (let y = C - lim; y <= C + lim; y++) for (let x = C - lim, k = y * N + x; x <= C + lim; x++, k++) {
    if (DIST[k] > lim) continue;
    s[k] = un[k] + v[k];
    if (!fr[k] && s[k] >= 1) { fr[k] = 1; born[k] = o.steps; if (DIST[k] > o.R) o.R = DIST[k]; }
  }
  o.steps++;
}
// Schedules. kind 'frac': [[growthFraction, padX, padY], ...] switch when R reaches that fraction of full size (puzzles, prototypes).
// kind 'pad': [[step, padXq, padYq], ...] quantised pad points, recorded during a real fall; kind 'raw': [[step, beta, gamma], ...] (old saves).
// Replaying a 'pad' or 'raw' schedule reproduces the flake exactly.
function toParams(sc, kind) { return kind === 'pad' ? sc.map(([t, x, y]) => [t, ...ptToParams({ x: x / PADQ, y: y / PADQ })]) : kind === 'frac' ? sc.map(([f, x, y]) => [f, ...ptToParams({ x, y })]) : sc; }
function Runner(o, sc, kind) {
  const P = toParams(sc, kind); seed(o, P[0][1], P[0][2]); let i = 0;
  return { o, done: false, run(maxSteps) {
    for (let n = 0; n < maxSteps; n++) {
      if (o.R >= RMAX || o.steps >= 9000) { this.done = true; return true; }
      while (i + 1 < P.length && (kind === 'frac' ? o.R >= P[i + 1][0] * RMAX : o.steps >= P[i + 1][0])) { i++; o.beta = P[i][1]; o.gamma = P[i][2]; }
      step(o);
    }
    return false;
  } };
}
// ================= shape descriptor =================
// Fold the crystal into rings (finer towards the tips) x 4 angular bands (on the arm axis ... midway between arms) and take the
// ice fraction in each cell. Tolerant to small shifts in timing or conditions, sensitive to where the ice is.
const DR = 12, DA = [.06, .15, .28], DB = DA.length + 1, DLEN = DR * DB, DBIN = new Int16Array(NN).fill(-1), DTOT = new Float32Array(DLEN);
for (let k = 0; k < NN; k++) { const d = DIST[k]; if (d > RMAX + 1) continue; const b = Math.min(DR - 1, Math.pow(d / (RMAX + 1), 2) * DR | 0); let a = 0; while (a < DA.length && OFF[k] >= DA[a]) a++; DBIN[k] = b * DB + a; DTOT[b * DB + a]++; }
function desc(mask) { const c = new Float32Array(DLEN); for (let k = 0; k < NN; k++) if (mask[k] && DBIN[k] >= 0) c[DBIN[k]]++; for (let i = 0; i < DLEN; i++) c[i] = Math.round(c[i] / Math.max(1, DTOT[i]) * 1000) / 1000; return c; }
function ddist(a, b) { let s = 0; for (let i = 0; i < DLEN; i++) s += Math.abs(a[i] - b[i]); return s / DLEN; }
// ================= catalogue =================
const FORMS = [
  { id: 'plate', n: 'Hexagonal plate', d: 'A solid six-sided plate. Grows when ice freezes fast: the top of the pad.' },
  { id: 'broad', n: 'Broad branches', d: 'Six wide, flat arms. Just below the plates on the pad.' },
  { id: 'stellar', n: 'Stellar dendrite', d: 'The classic snowflake: six arms with side branches. The middle of the pad.' },
  { id: 'fern', n: 'Fernlike dendrite', d: 'Thin, feathery arms dense with side branches. Slow freezing: the bottom of the pad.' },
  { id: 'platearms', n: 'Plate with arms', d: 'Needs a change mid-fall: grow a plate, then about halfway down drag to stars or ferns and arms shoot out of the corners.', combo: 1 },
  { id: 'tips', n: 'Dendrite with plate tips', d: 'Needs a late change: grow ferns almost all the way, then flick to plates in the last moments (around 80–85%).', combo: 1 },
  { id: 'seasons', n: 'Three seasons', d: 'Two changes: ferns, then plates at about 25–30% grown, then ferns again at about 60–65%.', combo: 1 },

// ================= copy puzzles (growth-fraction schedules in pad coordinates) =================
// (v2 saves had two more steady-weather targets, Fern and Broad branches, at indices 2 and 3: four "put the dot on the label"

const TARGETS = [
  { n: 'Steady star', f: 'stellar', sc: [[0, .3, .5]], hint: 'The middle of the pad, the whole way down.' },
  { n: 'Fat plate', f: 'plate', sc: [[0, .3, 1]], hint: 'The very top of the pad: the fastest freezing.' },
  { n: 'Plate, then arms', f: 'platearms', sc: [[0, .3, 1], [.45, .1, .1]], hint: 'Start among the plates; at about 45% grown, drop to the ferns.' },
  { n: 'Plate, then star', f: 'platearms', sc: [[0, .3, 1], [.45, .3, .5]], hint: 'Start among the plates; at about 45% grown, move to the stars.' },
  { n: 'Fern with plate tips', f: 'tips', sc: [[0, .1, .1], [.8, .3, 1]], hint: 'Ferns nearly all the way; flick up to the plates at about 80%.' },

];
/*SIM-END*/
// Precomputed by replaying every prototype, target and an 11x11 grid of pad points with the code above (see __snow.selfCheck()).

// ================= classification and scoring =================
const formById = id => FORMS.find(f => f.id === id);
function nearest(dv, allowCombo = true, comboBias = 0) {
  let best = null, bd = 9;
  TABLES.protos.forEach((p, i) => { const combo = formById(PROTOS[i][0]).combo; if (!allowCombo && combo) return; const v = ddist(dv, p) - (combo ? comboBias : 0); if (v < bd) { bd = v; best = PROTOS[i][0]; } });
  return { id: best, d: bd };
}
// a flake grown under one condition can only be a pure form; switching opens up the two-personality forms
// (when the conditions did change, the two-personality forms get a small head start)
function classify(mask, switched) { const dv = desc(mask), r = nearest(dv, switched, .02); return r.d < .13 ? formById(r.id) : null; }
function scoreCopy(mask, ti) {
  const dv = desc(mask), d = ddist(dv, TABLES.targets[ti]), near = nearest(dv), tf = TARGETS[ti].f;
  // other puzzles count as decoys too, so a different two-step recipe can't sneak a good score
  let decoy = near; TABLES.targets.forEach((t, j) => { if (j !== ti && TARGETS[j].f !== tf) { const v = ddist(dv, t); if (v < decoy.d) decoy = { id: TARGETS[j].f, d: v }; } });
  const wrong = decoy.id !== tf && decoy.d < d - .005;
  const stars = wrong ? 0 : d < .04 ? 3 : d < .085 ? 2 : d < .12 ? 1 : 0;
  return { stars, d, match: Math.max(0, Math.round((1 - d / .2) * 100)), looks: wrong ? formById(decoy.id) : null };
}

// Scribbling all over the pad can stumble onto a two-step shape. A copy only counts (2+ stars) if the pad travelled about
// as far as the recipe needs: up to ~1.5 pad-widths per change of weather, plus a little slack for aiming.
const padTravel = (sc, kind = 'pad') => { const s = kind === 'pad' ? PADQ : 1; let d = 0; for (let i = 1; i < sc.length; i++) d += Math.hypot(sc[i][1] - sc[i - 1][1], sc[i][2] - sc[i - 1][2]) / s; return d; };
const travelAllowance = ti => .6 + 1.5 * (TARGETS[ti].sc.length - 1);
function judgeCopy(mask, sc, ti, kind = 'pad') { const r = scoreCopy(mask, ti); r.travel = padTravel(sc, kind); if (r.stars > 1 && r.travel > travelAllowance(ti)) { r.stars = 1; r.fidget = true; } return r; }

// ================= state & saves =================
// Saves are sanitised on load: anything malformed (a corrupted or hand-edited save, an old version) is dropped rather than
// crashing the page, inflating progress or feeding a broken schedule to the thumbnail replays.
const okSc = (sc, kind) => Array.isArray(sc) && sc.length > 0 && sc.length <= 4000 && sc.every((e, i) => Array.isArray(e) && e.length === 3 && e.every(Number.isFinite) && e[0] >= 0 && (i || e[0] === 0) &&
  (kind === 'pad' ? e[1] >= 0 && e[1] <= PADQ && e[2] >= 0 && e[2] <= PADQ : e[1] > 0 && e[1] < 1 && e[2] > 0 && e[2] < 1));
const cleanName = n => typeof n === 'string' ? n.replace(/[<>"&]/g, '').slice(0, 60) || 'Crystal' : 'Crystal';
function cleanSave(raw) {
  let S = raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
  const obj = o => o && typeof o === 'object' && !Array.isArray(o) ? o : {};
  const out = { v: 3, got: {}, gallery: [], copies: {}, tried: {}, mode: ['free', 'copy', 'gallery'].includes(S.mode) ? S.mode : 'free', slow: S.slow ? 1 : 0 };
  const v1 = S.v !== 2 && S.v !== 3, v2 = S.v === 2, map = i => !v2 ? i : i < 2 ? i : i < 4 ? -1 : i - 2; // v1 stored PNG thumbnails (~1MB). Keep the schedules (they replay exactly) and re-render thumbnails on demand.
  const got = obj(S.got); for (const f of FORMS) if (got[f.id]) out.got[f.id] = !v1 && got[f.id].sc && okSc(got[f.id].sc, 'pad') ? { sc: got[f.id].sc } : 1;
