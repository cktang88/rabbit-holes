<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Gentle Machine</title>
<link rel="stylesheet" href="../shared/common.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* A Victorian toymaker's bench: walnut, beech and maple, brass fittings, cards printed in two inks. */
  :root{--ink:#2b1d12;--ink2:#6a5236;--red:#a8321f;--brass:#c7983c;--brass2:#7d5c1e;--green:#2f6b4a}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:"Libre Baskerville",Georgia,serif;color:#f1e6cc;display:flex;flex-direction:column;height:100dvh;
    background:radial-gradient(ellipse at 50% 25%,rgba(255,200,120,.12),transparent 60%),repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 3px,transparent 3px 11px),linear-gradient(#3e2817,#21140b)}
  header{display:flex;align-items:center;gap:10px;padding:6px 12px}
  header a.home{color:#dcc69b;text-decoration:none;font-size:13px}
  h1{font:400 25px/1 "Fredericka the Great",serif;margin:0;color:#f0d28a;letter-spacing:.03em;text-shadow:0 1px 0 #000;white-space:nowrap}
  .sp{flex:1}
  button{font:700 14px "Libre Baskerville",Georgia,serif;color:var(--ink);background:linear-gradient(#f4e8cd,#dcc79c);border:1px solid #6b4a22;border-radius:3px;padding:6px 12px;min-height:36px;cursor:pointer;box-shadow:0 2px 0 #4a3015,inset 0 1px 0 #fff8}
  button:active{transform:translateY(1px);box-shadow:0 1px 0 #4a3015}
  button.go{color:#fff6e0;background:linear-gradient(#3f8a5f,#235a3c);border-color:#123222;min-width:92px} button.go.stop{background:linear-gradient(#b8452c,#7d2414);border-color:#4a1208}
  button:disabled{opacity:.45}
  #card{margin:0 12px 6px;padding:5px 12px;color:var(--ink);background:linear-gradient(#f4ead2,#e4d4ae);border:1px solid #7a5a2a;box-shadow:0 3px 10px #0008;display:flex;gap:10px;align-items:center;font-size:14px;line-height:1.3;min-height:40px}
  #card .n{font:400 19px "Fredericka the Great",serif;color:var(--red);white-space:nowrap}
  #card .t{flex:1;min-width:0}
  #strip{display:flex;gap:3px;align-items:center;cursor:pointer;flex:none}
  #strip i{width:13px;height:17px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#d8ccb0;border:1px solid #9a8466;display:block;position:relative}
  #strip i.ok{background:radial-gradient(circle at 35% 30%,#fffaf0,#efe0c0);border-color:#7a5a2a}
  #strip i.bad{background:#f3c64a;border-color:#a8321f;border-radius:40%;transform:scaleX(1.3) scaleY(.7)}
  #strip i.run{animation:pulse .8s infinite alternate} #strip i.cur{outline:2px solid var(--red);outline-offset:1px}
  @keyframes pulse{to{opacity:.4}}
  #card .c{white-space:nowrap;font-weight:700;color:var(--ink2);font-size:12.5px;text-align:right;flex:none}
  #stage{flex:1;min-height:0;position:relative;margin:0 8px}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #pop{position:absolute;display:none;gap:4px;z-index:6;background:#2b1d12cc;padding:4px;border-radius:4px;border:1px solid var(--brass2)}
  #pop.on{display:flex} #pop button{min-width:40px;min-height:40px;padding:0;font-size:18px}
  #tell{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:5;color:var(--ink);background:#f4ead2ee;border:1px solid #7a5a2a;padding:4px 12px;font-size:13.5px;font-style:italic;display:none;max-width:90%;text-align:center;pointer-events:none}
  #tell.on{display:block}
  #bin{display:flex;gap:6px;justify-content:center;align-items:flex-end;padding:6px 8px 8px;flex:none;overflow-x:auto}
  .part{position:relative;width:62px;height:60px;padding:0;background:radial-gradient(circle at 40% 30%,#5a3c22,#2e1d0f);border:1px solid #1a0f06;border-radius:4px;box-shadow:inset 0 0 8px #000a,0 2px 0 #120a04;touch-action:none;color:#f0d28a;flex:none}
  .part canvas{display:block;width:60px;height:44px;pointer-events:none}
  .part .q{position:absolute;right:3px;top:1px;font-size:12px;font-weight:700;color:#f0d28a;text-shadow:0 1px 0 #000;pointer-events:none}
  .part .l{display:block;font:italic 400 10px/1 "Libre Baskerville",serif;color:#dcc69b;pointer-events:none;margin-top:-1px}
  .part.new{box-shadow:0 0 0 2px var(--brass),0 0 14px var(--brass)}
  .part[disabled]{opacity:.35}
  .pz-bar{right:6px;top:6px;bottom:auto} .pz-bar button{min-width:36px;min-height:36px;padding:0;font-size:18px;opacity:.9}
  #ghost{position:fixed;pointer-events:none;z-index:40;display:none;transform:translate(-50%,-50%);width:90px;height:66px}
  #book{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center}
  #book.on{display:flex}
  #leaf{width:min(820px,96vw);max-height:92dvh;overflow:auto;color:var(--ink);padding:14px 20px 20px;background:linear-gradient(#f4ead2,#e3d2aa);border:1px solid #6b4a22;box-shadow:0 20px 50px #000;box-sizing:border-box}
  #leaf h2{font:400 27px "Fredericka the Great",serif;color:var(--red);margin:0 0 4px} #leaf h3{font:400 19px "Fredericka the Great",serif;color:var(--green);margin:12px 0 4px}
  #tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0} #tabs button{padding:4px 10px;font-size:13px} #tabs button.on{background:linear-gradient(#b8452c,#7d2414);color:#fff3df}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
  .pz{background:#fffaf0aa;border:1px solid #8a6a3a;padding:6px 8px;text-align:left;font-weight:400;min-height:0;box-shadow:none;color:var(--ink)}
  .pz b{display:block;font-size:13.5px} .pz small{color:var(--ink2);font-size:12px} .pz.done{border-color:var(--green);background:#e6f0e0} .pz:disabled{opacity:.5}
  .mech{display:grid;grid-template-columns:44px 1fr;gap:2px 10px;padding:6px 0;border-bottom:1px dotted #8a6a3a88;font-size:14px}
  .mech .g{font-size:22px;text-align:center;color:var(--brass2)} .mech.unk{color:#8f7a5c} .mech small{display:block;color:var(--ink2);font-style:italic;font-size:12.5px}
  .note{font-style:italic;color:var(--ink2);font-size:14px}
  .hist{display:flex;align-items:flex-end;gap:2px;height:56px;margin:4px 0 0;border-bottom:1px solid #6b4a22}
  .hist i{flex:1;background:#b49a6a;min-height:2px;position:relative} .hist i.me{background:var(--red)}
  .hl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);font-style:italic;margin-bottom:6px}
  .axes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
  .axes div{text-align:center;font-size:12.5px;color:var(--ink2)} .axes b{display:block;font:400 26px "Fredericka the Great",serif;color:var(--ink)}
  textarea{width:100%;box-sizing:border-box;font:12px monospace;height:70px;background:#fffaf0;border:1px solid #8a6a3a}
  .chap{font:400 17px "Fredericka the Great",serif;color:var(--green);margin:10px 0 4px;display:flex;align-items:center;gap:8px}
  .chap canvas{width:30px;height:30px}
  .toast-wrap{bottom:auto;top:84px} .toast{background:linear-gradient(#f4ead2,#e3d2aa);color:var(--ink);border:1px solid #6b4a22;border-radius:2px;font:14.5px "Libre Baskerville",serif}
  .toast b{color:var(--red)}
  .modal{background:linear-gradient(#f4ead2,#e3d2aa);color:var(--ink);border:1px solid #6b4a22;border-radius:2px;font:15px/1.45 "Libre Baskerville",serif}
  .modal h2{font:400 27px "Fredericka the Great",serif;color:var(--red)} .modal .modal-actions{background:#e8d9b5}
  #stamp{position:fixed;left:50%;top:45%;width:180px;height:180px;margin:-90px 0 0 -90px;pointer-events:none;opacity:0;z-index:30}
  #stamp.on{animation:stamp 2.2s ease-out forwards}
  @keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-40deg)}20%{opacity:1;transform:scale(.95) rotate(-10deg)}28%{transform:scale(1.03) rotate(-10deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-10deg)}}
  main{flex:1;min-height:0;display:flex;flex-direction:column}
  @media (max-width:640px){
    header{padding:4px 8px;gap:6px} h1{font-size:18px} header a.home{font-size:0} header a.home::before{content:"←";font-size:18px} header button{padding:4px 8px;font-size:13px}
    #card{margin:0 6px 4px;font-size:12.5px;padding:4px 8px;flex-wrap:wrap;gap:4px 8px} #card .n{font-size:15px} #card .t{flex-basis:100%;order:3}
    #strip i{width:11px;height:14px}
    #bin{gap:4px;justify-content:flex-start} .part{width:48px;height:54px} .part canvas{width:46px;height:36px}
    #stage{margin:0 4px}
  }
</style>
</head>
<body>
<header>
  <a class="home" href="../index.html">← Rabbit Holes</a>
  <h1>The Gentle Machine</h1>
  <span class="sp"></span>
  <button id="runBtn" class="go">▶ Run</button>
  <button id="bookBtn">Book</button>
</header>
<div id="card" aria-live="polite"><span class="n" id="pzN"></span><span class="t" id="pzT"></span><span id="strip" title="The ten tomorrows: tap one to watch it" role="button" aria-label="The ten tomorrows"></span><span class="c" id="pzC"></span></div>
<main>
  <div id="stage" data-play><canvas id="cv" aria-label="The bench"></canvas><div id="tell"></div>
    <div id="pop" role="toolbar" aria-label="Part"><button data-a="l" aria-label="Turn left">⟲</button><button data-a="r" aria-label="Turn right">⟳</button><button data-a="x" aria-label="Put back in the box">✕</button></div>
  </div>
  <div id="bin" role="toolbar" aria-label="Parts box"></div>
</main>
<canvas id="ghost" width="180" height="132"></canvas>
<div id="book" role="dialog" aria-label="The book"><div id="leaf"></div></div>
<svg id="stamp" viewBox="0 0 180 180" aria-hidden="true"><defs><radialGradient id="br" cx=".4" cy=".35"><stop offset="0" stop-color="#f6dc8e"/><stop offset=".6" stop-color="#c7983c"/><stop offset="1" stop-color="#7d5c1e"/></radialGradient></defs>
  <g transform="translate(90 90)"><path id="gear" fill="url(#br)" stroke="#5a3d12" stroke-width="2"/><circle r="50" fill="none" stroke="#5a3d12" stroke-width="2"/>
  <text y="-8" text-anchor="middle" font-family="Fredericka the Great" font-size="19" fill="#3a250c">DELIVERED</text><text y="18" text-anchor="middle" font-family="Fredericka the Great" font-size="19" fill="#3a250c">WHOLE</text></g></svg>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script src="../shared/vendor/planck/planck-1.5.0.min.js"></script>
<script src="sim.js"></script>
<script>
'use strict';
const {BW,BH,DT,TMAX,FUTURES,CARGO,CARGO_ORDER,PARTS,PTYPES,BENCHES,MECHS,Sim,runAll,futureParams,costOf}=GM;
const SC=40;
const pById=Object.fromEntries(BENCHES.map(b=>[b.id,b]));
const today=()=>new Date().toISOString().slice(0,10);
const OKS={egg:'🥚',goose:'🥚',bubble:'🫧',watch:'⌚',jelly:'🟧'}, BADS={egg:'🍳',goose:'🍳',bubble:'💦',watch:'💥',jelly:'💔'};

// ===================== Save: autosaved on every change; exportable as text =====================
function cleanSave(s){ const o={v:1, best:{}, mech:{}, daily:{}, builds:{}, seen:{}};
  if (!s || typeof s!=='object') return o;
  const num=(v,lo,hi)=>Math.max(lo,Math.min(hi,+v|0));
  if (s.best && typeof s.best==='object') for (const [k,v] of Object.entries(s.best)) if ((pById[k]||/^daily:\d{4}-\d\d-\d\d$/.test(k)) && v && typeof v==='object') o.best[k]={saved:num(v.saved,0,10), gentle:num(v.gentle,0,999), cost:num(v.cost,0,999), lean:num(v.lean??v.cost,0,999), soft:num(v.soft??v.gentle,0,999)};
  if (s.mech && typeof s.mech==='object') for (const [k,v] of Object.entries(s.mech)) if (MECHS.some(m=>m[0]===k)) o.mech[k]=String(v).slice(0,10);
  if (s.daily && typeof s.daily==='object') for (const [k,v] of Object.entries(s.daily).slice(-60)) if (/^\d{4}-\d\d-\d\d$/.test(k)) o.daily[k]=String(v).slice(0,40);
  if (s.builds && typeof s.builds==='object') for (const [k,v] of Object.entries(s.builds).slice(-80)) if (Array.isArray(v)) o.builds[k]=cleanParts(v);
  if (s.seen && typeof s.seen==='object') for (const k of Object.keys(s.seen)) if (PARTS[k]||CARGO[k]) o.seen[k]=1;
  return o; }
function cleanParts(v){ return (Array.isArray(v)?v:[]).slice(0,200).filter(q=>Array.isArray(q)&&PARTS[q[0]]).map(q=>[q[0], Math.max(.3,Math.min(BW-.3,Math.round(+q[1]*4)/4||.3)), Math.max(.3,Math.min(BH-.3,Math.round(+q[2]*4)/4||.3)), Math.max(-12,Math.min(12,q[3]|0))]); }
let SAVE=cleanSave(RH.load('gentle',null));
const passed=(id)=>{ const b=SAVE.best[id]; return !!b && b.saved>=(pById[id]?.pass||7); };
const persist=()=>{ RH.save('gentle',SAVE); RH.progress('contraption', BENCHES.filter(b=>passed(b.id)).length/BENCHES.length); };
const benchOpen=(i)=> i===0 || passed(BENCHES[i-1].id) || passed(BENCHES[i].id) || (i>1 && passed(BENCHES[i-2].id) && passed(BENCHES[i-2].id));
// parts and cargo met so far: the sandbox offers only these
function unlocked(){ const parts=new Set(), cargo=new Set(); BENCHES.forEach((b,i)=>{ if (benchOpen(i)){ Object.keys(b.bin).forEach(t=>parts.add(t)); cargo.add(b.cargo); } }); return {parts:[...parts], cargo:CARGO_ORDER.filter(c=>cargo.has(c))}; }

// ===================== Daily: a bench built from the date, kept only if a template machine gets most eggs through =====================
function dailyBench(key){ const r=GM.rng('gentle-daily:'+key); const cargos=['egg','goose','watch','jelly','egg'];
  for (let tries=0; tries<30; tries++){
    const h=3+Math.floor(r()*5), x0=1.5+r()*3, n=Math.max(2,Math.ceil((h-1)/1.05)), dir=1, sol=[]; let x=x0+1, y=h-.5;
    for (let k=0;k<n && y>1.2;k++){ sol.push(['plank', +(Math.round(x*4)/4).toFixed(2), +(Math.round(y*4)/4).toFixed(2), -1]); x+=3; y-=1.05; }
    const last=sol[sol.length-1], bx=last[1]+2.1; if (bx>22.5) continue;
    const cargo=cargos[Math.floor(r()*cargos.length)];
    const fixed=[]; const fx=x0+3+r()*(bx-x0-4), top=h-2-r()*2; if (top>1.5) fixed.push([+fx.toFixed(2), +(top+1.6).toFixed(2), .12, .4+r()*.6, 0]);
    const B={id:'daily:'+key, seed:'daily:'+key, n:'Daily bench', t:'Today\'s bench, the same for everyone. Ten tomorrows; lowest cost wins the day.', cargo, drop:[+x0.toFixed(2),h], basket:[+bx.toFixed(2),0], fixed, bin:{plank:5, cushion:2, hammock:1, seesaw:1, block:2, weight:1, balloon:1}, pass:7, daily:true};
    // the obstacle must not sit on the template's path
    if (fixed.length && sol.some(p=>Math.abs(p[1]-fixed[0][0])<1.7 && Math.abs(p[2]-fixed[0][1])<1.4)) fixed.length=0;
    const R=runAll(B,sol); if (R.saved>=7){ B.sol=sol; return B; } }
  const B={...BENCHES[0], id:'daily:'+key, seed:'daily:'+key, n:'Daily bench', daily:true}; return B; }
function sandboxBench(cargo){ const u=unlocked(); return {id:'sandbox', n:'Sandbox', t:'Every part you have met, no goal but your own. Book → Sandbox to share it.', cargo:cargo||'egg', drop:[3,12], basket:[20,0], fixed:[], bin:Object.fromEntries(u.parts.map(t=>[t,99])), pass:0, sandbox:true}; }

// ===================== State =====================
let B=BENCHES[0], parts=[], mode='build', sel=-1, view=null, live=null, results=[], queue=[], bg=null, autoplay=null, post=0;
const binLeft=(t)=> B.sandbox? 99 : (B.bin[t]||0)-parts.filter(p=>p[0]===t).length;
const saveBuild=()=>{ SAVE.builds[B.id]=parts.map(p=>p.slice()); persist(); };
function openBench(b, ps){ B=b; parts=cleanParts(ps ?? SAVE.builds[b.id] ?? []); mode='build'; sel=-1; results=[]; queue=[]; bg=null; live=null; autoplay=null;
  view=new Sim(B, parts, 0); hidePop(); renderAll(); cam.fit(false); tell('');
  const fresh=Object.keys(B.bin).filter(t=>!SAVE.seen[t]); if (!SAVE.seen[B.cargo]) fresh.push(B.cargo);
  if (fresh.length && !B.sandbox){ setTimeout(()=>{ for (const t of fresh){ SAVE.seen[t]=1; const D=PARTS[t]||CARGO[t]; RH.toast(`New: <b>${D.n}</b>. ${D.d}`, 4200); } persist(); }, 400); }
  newParts=fresh; }
let newParts=[];
function rebuild(){ view=new Sim(B, parts, 0); saveBuild(); renderAll(); }
function renderAll(){ renderBin(); renderCard(); }

// ===================== Drawing =====================
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let dragging=null;
const cam=PanZoom(cv,{ world:()=>({x:-10,y:-10,w:BW*SC+20,h:BH*SC+20}), pad:4, min:.7, max:6, canPanFrom:e=> e.button===1 || (!dragging && hitPart(...toM(e.clientX,e.clientY))<0) });
const toM=(cx,cy)=>{ const [u,v]=cam.toWorld(cx,cy); return [u/SC, BH-v/SC]; };
const toScreenM=(x,y)=>cam.toScreen(x*SC,(BH-y)*SC);
function grain(base, dark, seed){ const c=document.createElement('canvas'); c.width=64; c.height=16; const g=c.getContext('2d'); g.fillStyle=base; g.fillRect(0,0,64,16); const r=RH.rng(seed);
  for (let k=0;k<14;k++){ g.strokeStyle=dark; g.globalAlpha=.15+r()*.25; g.lineWidth=.6+r(); g.beginPath(); let y=r()*16; g.moveTo(0,y); for (let x=0;x<=64;x+=8){ y+=(r()-.5)*1.5; g.lineTo(x,y); } g.stroke(); } return c; }
let PAT=null;
function pats(){ if (PAT) return PAT; const mk=(c)=>{ const p=ctx.createPattern(c,'repeat'); p.setTransform && p.setTransform(new DOMMatrix().scale(1/40)); return p; };
  PAT={ beech:mk(grain('#d9b27a','#7a4c22',1)), maple:mk(grain('#e8cc98','#9a6a32',2)), walnut:mk(grain('#6b4426','#2a170a',3)), board:ctx.createPattern(grain('#efe3c4','#b49a6a',4),'repeat') }; return PAT; }
function sceneSim(){ return live || view; }
function draw(){
  const d=Math.min(2,devicePixelRatio||1), w=Math.round(cv.clientWidth*d), h=Math.round(cv.clientHeight*d);
  if (cv.width!==w||cv.height!==h){ cv.width=w; cv.height=h; PAT=null; }
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,w,h);
  ctx.setTransform(d*cam.k,0,0,d*cam.k,d*cam.x,d*cam.y); const pt=pats(), S=sceneSim(); if (!S) return;
  ctx.fillStyle=pt.board; ctx.fillRect(0,0,BW*SC,BH*SC); ctx.strokeStyle='rgba(120,90,50,.16)'; ctx.lineWidth=1;
  for (let x=0;x<=BW;x++){ ctx.beginPath(); ctx.moveTo(x*SC,0); ctx.lineTo(x*SC,BH*SC); ctx.stroke(); } for (let y=0;y<=BH;y++){ ctx.beginPath(); ctx.moveTo(0,y*SC); ctx.lineTo(BW*SC,y*SC); ctx.stroke(); }
  ctx.strokeStyle='#3a2515'; ctx.lineWidth=6; ctx.strokeRect(-3,-3,BW*SC+6,BH*SC+6);
  ctx.save(); ctx.transform(SC,0,0,-SC,0,BH*SC); // metres, y up
  drawHopper(); drawBasket();
  for (const o of S.bodies) drawBody(o, pt, S);
  drawCargo(S);
  if (mode==='build' && sel>=0 && parts[sel]){ const p=parts[sel]; ctx.strokeStyle='#a8321f'; ctx.lineWidth=.05; ctx.setLineDash([.15,.1]); ctx.beginPath(); ctx.arc(p[1],p[2],p[0]==='plank'||p[0]==='seesaw'||p[0]==='hammock'?1.9:1,0,7); ctx.stroke(); ctx.setLineDash([]); }
  if (mode==='build' && !parts.length && BENCHES.indexOf(B)===0) drawHint();
  ctx.restore();
  if (S.fp && S.fp.gust && S.t>=S.fp.g0 && S.t<S.fp.g1) drawDraught(S);
}
function drawHopper(){ const [x,y]=B.drop; const ang=(B.drop[2]||0)>0? -.3 : 0; ctx.save(); ctx.translate(x,y+.55); ctx.rotate(ang);
  const g=ctx.createLinearGradient(-.6,0,.6,0); g.addColorStop(0,'#7d5c1e'); g.addColorStop(.45,'#f6dc8e'); g.addColorStop(1,'#7d5c1e'); ctx.fillStyle=g;
  ctx.beginPath(); ctx.moveTo(-.7,.9); ctx.lineTo(.7,.9); ctx.lineTo(.42,.05); ctx.lineTo(-.42,.05); ctx.closePath(); ctx.fill(); ctx.strokeStyle='#5a3d12'; ctx.lineWidth=.04; ctx.stroke(); ctx.restore(); }
function drawBasket(){ const [x,y]=B.basket; ctx.save(); ctx.translate(x,y);
  ctx.fillStyle='#3f6b4a'; ctx.fillRect(-.74,.04,1.48,.1);
  ctx.strokeStyle='#7a4c22'; ctx.lineWidth=.07; for (let k=0;k<=5;k++){ ctx.beginPath(); ctx.moveTo(-.86,k*.18); ctx.quadraticCurveTo(0,k*.18-.08,.86,k*.18); ctx.stroke(); }

// ===================== Building: drag from the box, drag to move, tap to turn =====================
function hitPart(x,y){ if (mode!=='build') return -1; let best=-1, bd=9; parts.forEach((p,i)=>{ const long=p[0]==='plank'||p[0]==='seesaw'||p[0]==='hammock';
    const a=(p[3]||0)*15*Math.PI/180, dx=x-p[1], dy=y-p[2], u=dx*Math.cos(a)+dy*Math.sin(a), v=-dx*Math.sin(a)+dy*Math.cos(a);

let down=null;
cv.addEventListener('pointerdown', e=>{ if (cam.gesturing || mode!=='build' || e.button===1) return; const [x,y]=toM(e.clientX,e.clientY); const i=hitPart(x,y); if (i<0){ if (sel>=0){ sel=-1; hidePop(); } return; }
  dragging={i, dx:parts[i][1]-x, dy:parts[i][2]-y, sx:e.clientX, sy:e.clientY, moved:false, id:e.pointerId}; });
cv.addEventListener('pointermove', e=>{ if (!dragging || e.pointerId!==dragging.id) return; if (cam.gesturing){ dragging=null; return; } if (Math.hypot(e.clientX-dragging.sx,e.clientY-dragging.sy)>6) dragging.moved=true; if (!dragging.moved) return;
  const [x,y]=toM(e.clientX,e.clientY); const p=parts[dragging.i]; p[1]=snap(x+dragging.dx,.3,BW-.3); p[2]=snap(y+dragging.dy,.3,BH-.3); hidePop(); view=new Sim(B,parts,0); });

const snap=(v,lo,hi)=>Math.round(Math.max(lo,Math.min(hi,v))*4)/4;

  if (a==='l') p[3]=Math.min(12,(p[3]||0)+1); if (a==='r') p[3]=Math.max(-12,(p[3]||0)-1); if (a==='x'){ parts.splice(sel,1); sel=-1; hidePop(); }

// ===================== Running: tomorrow 1 plays live while the other nine run quietly behind it =====================
$('runBtn').onclick=()=>{ if (mode==='build') startRun(); else stopRun(); };
function startRun(){ mode='run'; sel=-1; hidePop(); results=new Array(FUTURES).fill(null); live=new Sim(B, parts, 0); post=0; queue=[]; for (let k=1;k<FUTURES;k++) queue.push(k); bg=null; autoplay=null; acc=0; tell(''); renderAll(); FX.sfx('tick'); }
function stopRun(){ mode='build'; live=null; queue=[]; bg=null; autoplay=null; view=new Sim(B,parts,0); tell(''); renderAll(); }
function watchFuture(k){ if (mode==='build' || !results[k]) return; live=new Sim(B, parts, k); post=0; acc=0; autoplay={k, replay:true}; tell(`Tomorrow ${k+1}: ${live.fp.why}.`); renderStrip(); }
$('strip').addEventListener('click', e=>{ const i=e.target.closest('i'); if (i) watchFuture(+i.dataset.k); });
let acc=0, last=performance.now();
function frame(now){ requestAnimationFrame(frame); const dt=Math.min(.1,(now-last)/1000); last=now; const open=$('book').classList.contains('on');
  if (mode==='run' && live && !open){
    if (!live.done){ acc+=dt*(autoplay&&autoplay.fast?1.6:1); let n=0; while (acc>=DT && n<5 && !live.done){ acc-=DT; n++; live.step(); } if (n===5) acc=0;
      if (live.done){ onLiveDone(); } else noteMechs(live.found); }
    else if (post<50){ post++; live.world.step(DT,8,3); }
    // the other tomorrows, a few milliseconds a frame
    const t0=performance.now(); while (queue.length && performance.now()-t0<6){ if (!bg) bg=new Sim(B, parts, queue[0]); for (let i=0;i<40 && !bg.done;i++) bg.step(); if (bg.done){ results[bg.k]=bg.result; noteMechs(bg.found, true); queue.shift(); bg=null; renderStrip(); if (!queue.length && results[0]) allDone(); } }
  }
  draw(); }
function onLiveDone(){ const r=live.result; noteMechs(live.found); if (!autoplay){ results[0]=r; renderStrip(); }
  const C=CARGO[live.ctype]; FX.sfx(r.ok? 'chime' : r.why==='stuck'? 'tick' : 'crash'); if (!r.ok && r.why!=='stuck') FX.shake && FX.shake(6);
  tell(r.ok? `Tomorrow ${live.k+1}: safe. Hardest bump ${r.gentle}% of what it can take.` : `Tomorrow ${live.k+1}: ${r.why==='stuck'?'it got stuck':r.why==='lost'?'it fell off the bench':r.why}${live.fp.k? ' ('+live.fp.why+')' : ''}.`);
  if (!queue.length && !autoplay) allDone(); else if (autoplay && autoplay.replay && !autoplay.summary){ /* a replay the player asked for */ }
  else if (autoplay && autoplay.summary) setTimeout(()=>{ if (mode==='run' && autoplay) summary(); }, 900); }
function allDone(){ if (autoplay) return; const saved=results.filter(r=>r&&r.ok).length;
  // replay the most dramatic tomorrow that went differently from the first one
  const worst=results.findIndex((r,k)=>k>0 && r && r.ok!==results[0].ok);
  if (worst>0){ setTimeout(()=>{ if (mode!=='run' || autoplay) return; live=new Sim(B, parts, worst); post=0; acc=0; autoplay={k:worst, fast:true, summary:true}; tell(`Tomorrow ${worst+1}: ${live.fp.why}…`); renderStrip(); }, 1100); }
  else setTimeout(()=>{ if (mode==='run') summary(); }, 900); }
function noteMechs(found, quiet){ for (const m of found){ if (SAVE.mech[m]) continue; SAVE.mech[m]=today(); persist(); const M=MECHS.find(x=>x[0]===m); if (M) RH.toast(`${M[0]==='freefall'||M[1].startsWith('Lesson')?'':'Recorded in the Book: '}<b>${M[1]}</b>. ${M[3]}`, 4200); } }
function summary(){ if (B.sandbox){ const saved=results.filter(r=>r&&r.ok).length; tell(`${saved} of 10 tomorrows came through.`); return; }
  const saved=results.filter(r=>r.ok).length, R={saved, gentle:GM.score(results), cost:costOf(parts)}, pass=B.pass||7, ok=saved>=pass;
  if (saved===FUTURES && !SAVE.mech.tenfold){ noteMechs(['tenfold']); }
  const prev=SAVE.best[B.id]; let better=false;
  if (!prev){ SAVE.best[B.id]={...R, lean: ok? R.cost : 999, soft: ok? R.gentle : 999}; better=ok; }
  else { const b=prev; if (saved>b.saved || (saved===b.saved && (R.gentle<b.gentle || R.cost<b.cost))){ b.saved=saved; b.gentle=R.gentle; b.cost=R.cost; better=true; } if (ok && R.cost<b.lean){ b.lean=R.cost; better=true; } if (ok && R.gentle<b.soft){ b.soft=R.gentle; better=true; } }
  if (B.daily){ const k=B.id.slice(6); if (ok) SAVE.daily[k]=shareStrip(); }
  persist(); renderCard();
  if (!ok){ tell(`${saved} of 10 came through; this bench needs ${pass}. Reset keeps your machine.`); return; }
  FX.sfx('win'); const s=$('stamp'); s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');
  const H=(GM.HIST||{})[B.id];
  setTimeout(()=>RH.modal(`<h2>Delivered whole</h2><p style="font-size:20px;letter-spacing:2px;margin:4px 0">${shareStrip()}</p>
    <div class="axes"><div><b>${saved}/10</b>tomorrows</div><div><b>${R.gentle}%</b>hardest bump</div><div><b>${R.cost}</b>cost</div></div>
    ${H? `<p class="note" style="margin:4px 0">Where your machine sits among the machines the workshop's solver found for this bench:</p>${histHTML(H.cost,R.cost,'cost')}${histHTML(H.gentle,R.gentle,'hardest bump %')}` : ''}
    <p class="note">Cheaper, gentler and surer pull against each other. ${better?'A new best for this bench.':''}</p>`,
    [{label:'Improve it'},{label:'Copy result'},{label: BENCHES.indexOf(B)<BENCHES.length-1 && !B.daily? 'Next bench' : 'The Book'}]).then(l=>{
      if (l==='Copy result'){ copyText(shareText()); RH.toast('Copied: the strip and a link to your machine.'); stopRun(); }
      else if (l==='Next bench'){ openBench(BENCHES[BENCHES.indexOf(B)+1]); setHash(); }
      else if (l==='The Book') openBook('benches'); else stopRun(); }), 1200); }
function histHTML(h, mine, label){ const max=Math.max(...h.map(x=>x[1])); let placed=false;
  const bars=h.map(([v,n],i)=>{ const me=!placed && (mine<=v || i===h.length-1); if (me) placed=true; return `<i class="${me?'me':''}" style="height:${Math.max(4,n/max*100)}%" title="${label} ${v}: ${n}"></i>`; }).join('');
  return `<div class="hist">${bars}</div><div class="hl"><span>${label} ${h[0][0]}</span><span>${h[h.length-1][0]}</span></div>`; }
function shareStrip(){ const c=B.cargo; return results.map(r=>r&&r.ok? OKS[c] : BADS[c]).join(''); }
function shareText(){ const saved=results.filter(r=>r&&r.ok).length; return `The Gentle Machine · ${B.daily? 'daily '+B.id.slice(6) : B.n}\n${shareStrip()} ${saved}/10 · cost ${costOf(parts)}\n${location.origin+location.pathname}#m=${encodeMachine()}`; }
function copyText(s){ try{ navigator.clipboard.writeText(s); }catch(_){} }

// ===================== The Book =====================
let tab='benches';
function openBook(t){ tab=t||tab; $('book').classList.add('on'); drawBook(); }
function closeBook(){ $('book').classList.remove('on'); }
$('bookBtn').onclick=()=>openBook(); $('book').addEventListener('click', e=>{ if (e.target.id==='book') closeBook(); });
function drawBook(){ const nm=MECHS.filter(m=>SAVE.mech[m[0]]).length;
  let h=`<div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">The Porter's Book</h2><button id="bkClose">Close</button></div>
    <div id="tabs">${[['benches','Benches'],['mech','Braking · '+nm+'/'+MECHS.length],['daily','Daily'],['sandbox','Sandbox'],['save','Save']].map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</div>`;
  if (tab==='benches'){ h+=`<p class="note">Every machine is run against ten tomorrows: the drop a little off, the table tilted, a draught. A bench passes when enough come through whole. Then it is about cost and the hardest bump.</p>`;
    let lastC=null; BENCHES.forEach((b,i)=>{ const op=benchOpen(i);
      if (b.cargo!==lastC){ if (lastC) h+='</div>'; lastC=b.cargo; const seen=op||SAVE.seen[b.cargo]; h+=`<div class="chap"><canvas width="60" height="60" data-icon="${seen?b.cargo:''}"></canvas>${seen? CARGO[b.cargo].n : 'Something else will come down the hopper…'}</div><div class="grid">`; }
      const bs=SAVE.best[b.id]; h+=`<button class="pz ${passed(b.id)?'done':''}" data-p="${b.id}" ${op?'':'disabled'}><b>${i+1}. ${op?b.n:'· · ·'}</b><small>${bs? `${bs.saved}/10 · bump ${bs.soft<999?bs.soft:bs.gentle}% · cost ${bs.lean<999?bs.lean:bs.cost}` : op? 'not yet tried' : 'locked'}</small></button>`; });
    h+='</div>'; }
  else if (tab==='mech'){ h+=`<p class="note">Recorded from what your machines actually do while they run, in any of the ten tomorrows.</p>`+MECHS.map(m=>SAVE.mech[m[0]]? `<div class="mech"><span class="g">${m[2]}</span><div><b>${m[1]}</b> <small>first seen ${SAVE.mech[m[0]]}: ${m[3]}</small><small>${m[4]}</small></div></div>` : `<div class="mech unk"><span class="g">?</span><div><b>${m[1].startsWith('Lesson')?'A lesson not yet learned':'Not yet seen'}</b><small>${m[3]}</small></div></div>`).join(''); }
  else if (tab==='daily'){ const k=today(); h+=`<p class="note">One bench a day, the same for everyone, built from the date. Pass it and share your strip of ten without giving the machine away.</p><p>Today: <b>${SAVE.daily[k]||'not yet passed'}</b></p><p><button data-daily="${k}">Open today's bench</button></p>`;
    const days=Object.entries(SAVE.daily).slice(-10).reverse(); if (days.length) h+='<h3>Past days</h3>'+days.map(([d,s])=>`<div class="note">${d}: ${s}</div>`).join(''); }
  else if (tab==='sandbox'){ const u=unlocked(); h+=`<p class="note">Every part you have met, no goal but your own. A link carries your machine exactly: whoever opens it sees the same ten tomorrows.</p><p>${u.cargo.map(c=>`<button data-sandbox="${c}">${CARGO[c].n}</button>`).join(' ')}</p><p><button id="shareBtn">Copy a link to the machine on the bench</button></p><p class="note" id="shareOut"></p>`; }
  else { h+=`<p class="note">Your book lives in this browser. Copy this text somewhere safe; paste it back here to restore it, on this or any device.</p><textarea id="saveTxt" spellcheck="false">${btoa(unescape(encodeURIComponent(JSON.stringify(SAVE))))}</textarea><p><button id="saveCopy">Copy</button> <button id="saveLoad">Restore from the text above</button></p><p class="note" id="saveOut"></p>`; }
  $('leaf').innerHTML=h; $('leaf').querySelectorAll('canvas[data-icon]').forEach(c=>{ if (c.dataset.icon) drawIcon(c,c.dataset.icon); }); }
$('leaf').addEventListener('click', e=>{ const b=e.target.closest('button'); if (!b) return;
  if (b.id==='bkClose') return closeBook(); if (b.dataset.tab){ tab=b.dataset.tab; drawBook(); return; }
  if (b.dataset.p){ openBench(pById[b.dataset.p]); setHash(); closeBook(); return; }
  if (b.dataset.daily){ openBench(dailyBench(b.dataset.daily)); setHash(); closeBook(); return; }
  if (b.dataset.sandbox){ openBench(sandboxBench(b.dataset.sandbox)); setHash(); closeBook(); return; }
  if (b.id==='shareBtn'){ const url=location.origin+location.pathname+'#m='+encodeMachine(); history.replaceState(null,'',url); copyText(url); $('shareOut').textContent='Link copied; it is also in the address bar.'; }
  if (b.id==='saveCopy'){ copyText($('saveTxt').value); $('saveOut').textContent='Copied.'; }
  if (b.id==='saveLoad'){ try{ const o=JSON.parse(decodeURIComponent(escape(atob($('saveTxt').value.trim())))); SAVE=cleanSave(o); persist(); $('saveOut').textContent='Restored.'; renderAll(); } catch(_){ $('saveOut').textContent='That text is not a saved book.'; } } });
// ===================== Links: the bench and every part, exactly =====================
function encodeMachine(){ const o={p:B.sandbox?'sandbox':B.id, c:B.sandbox?B.cargo:undefined, s:parts.map(p=>[PTYPES.indexOf(p[0]),Math.round(p[1]*4),Math.round(p[2]*4),p[3]|0])}; return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function decodeMachine(s){ try{ const o=JSON.parse(atob(s.replace(/-/g,'+').replace(/_/g,'/'))); const ps=cleanParts((o.s||[]).filter(q=>Array.isArray(q)&&PTYPES[q[0]]).map(q=>[PTYPES[q[0]], q[1]/4, q[2]/4, q[3]]));
  const id=String(o.p); const b= id==='sandbox'? sandboxBench(CARGO[o.c]? o.c : 'egg') : id.startsWith('daily:')&&/^daily:\d{4}-\d\d-\d\d$/.test(id)? dailyBench(id.slice(6)) : pById[id]; if (!b) return null; return {b, ps}; } catch(e){ return null; } }
// the design lives in the address bar too, so a reload or a bookmark keeps it
let hashT=0; function setHash(){ clearTimeout(hashT); hashT=setTimeout(()=>{ try{ history.replaceState(null,'',location.pathname+'#m='+encodeMachine()); }catch(_){} }, 300); }
const _rebuild=rebuild; rebuild=function(){ _rebuild(); setHash(); };

// ===================== Start =====================
(function boot(){ const h=decodeURIComponent(location.hash.slice(1)); let done=false;
  if (h.startsWith('m=')){ const m=decodeMachine(h.slice(2)); if (m){ openBench(m.b, m.ps); done=true; } }
  if (!done && h.startsWith('daily=') && /^\d{4}-\d\d-\d\d$/.test(h.slice(6))){ openBench(dailyBench(h.slice(6))); done=true; }
  if (!done){ const i=BENCHES.findIndex((b,i)=>!passed(b.id) && benchOpen(i)); openBench(BENCHES[Math.max(0,i)]); }
  requestAnimationFrame(()=>{ cam.fit(false); requestAnimationFrame(frame); });
  const gp=[]; for (let k=0;k<24;k++){ const a=k/24*Math.PI*2, r=k%2? 76:86; gp.push((k?'L':'M')+(Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1)); } $('gear').setAttribute('d',gp.join(' ')+'Z');
})();
window.__gm={ GM, get B(){ return B; }, get parts(){ return parts; }, set parts(v){ parts=v; rebuild(); }, get mode(){ return mode; }, get live(){ return live; }, get view(){ return view; }, get results(){ return results; }, get SAVE(){ return SAVE; }, get sel(){ return sel; },
  cam, toM, toScreenM, openBench, dailyBench, sandboxBench, encodeMachine, decodeMachine, cleanSave, startRun, stopRun, summary, shareText, benchOpen, unlocked, pById, draw, queueLeft:()=>queue.length };
</script>
