<link rel="stylesheet" href="../shared/common.css">

<link href="https://fonts.googleapis.com/css2?family=Fredericka+the+Great&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  /* A Victorian toymaker's workbench: a walnut bench, beech and maple blocks, brass fittings, puzzle cards printed in two inks. */
  :root{--card:#f1e6cc;--card2:#e2d1a8;--ink:#2b1d12;--ink2:#6a5236;--red:#a8321f;--brass:#c7983c;--brass2:#7d5c1e;--wal:#3a2515;--wal2:#24160c;--green:#2f6b4a}
  html,body{height:100%;margin:0;overflow:hidden}
  body{font-family:"Libre Baskerville",Georgia,serif;color:var(--card);display:flex;flex-direction:column;height:100dvh;
    background:radial-gradient(ellipse at 50% 25%,rgba(255,200,120,.12),transparent 60%),repeating-linear-gradient(90deg,rgba(0,0,0,.16) 0 3px,transparent 3px 11px),linear-gradient(#3e2817,#21140b)}
  header{display:flex;align-items:center;gap:10px;padding:6px 12px}
  header a.home{color:#dcc69b;text-decoration:none;font-size:13px}
  h1{font:400 26px/1 "Fredericka the Great",serif;margin:0;color:#f0d28a;letter-spacing:.03em;text-shadow:0 1px 0 #000}
  .sp{flex:1}
  button{font:700 14px "Libre Baskerville",Georgia,serif;color:var(--ink);background:linear-gradient(#f4e8cd,#dcc79c);border:1px solid #6b4a22;border-radius:3px;padding:6px 12px;min-height:36px;cursor:pointer;box-shadow:0 2px 0 #4a3015,inset 0 1px 0 #fff8}
  button:active{transform:translateY(1px);box-shadow:0 1px 0 #4a3015}
  button.go{color:#fff6e0;background:linear-gradient(#3f8a5f,#235a3c);border-color:#123222} button.go.stop{background:linear-gradient(#b8452c,#7d2414);border-color:#4a1208}
  button:disabled{opacity:.45}
  #card{margin:0 12px 6px;padding:6px 12px;color:var(--ink);background:linear-gradient(#f4ead2,#e4d4ae);border:1px solid #7a5a2a;box-shadow:0 3px 10px #0008;display:flex;gap:10px;align-items:center;font-size:14.5px;line-height:1.3}
  #card .n{font:400 20px "Fredericka the Great",serif;color:var(--red);white-space:nowrap}
  #card .t{flex:1} #card .c{white-space:nowrap;font-weight:700;color:var(--ink2);font-size:13px;text-align:right}
  #stage{flex:1;min-height:0;position:relative;margin:0 8px}
  #cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #pop{position:absolute;display:none;gap:4px;z-index:6;background:#2b1d12cc;padding:4px;border-radius:4px;border:1px solid var(--brass2)}
  #pop.on{display:flex} #pop button{min-width:40px;min-height:40px;padding:0;font-size:18px}
  #bin{display:flex;gap:6px;justify-content:center;align-items:flex-end;padding:6px 8px 8px;flex:none;flex-wrap:nowrap;overflow-x:auto}
  .part{position:relative;width:58px;height:58px;padding:0;background:radial-gradient(circle at 40% 30%,#5a3c22,#2e1d0f);border:1px solid #1a0f06;border-radius:4px;box-shadow:inset 0 0 8px #000a,0 2px 0 #120a04;touch-action:none;color:#f0d28a;flex:none}
  .part canvas{display:block;width:56px;height:44px;pointer-events:none}
  .part .q{position:absolute;right:2px;top:1px;font-size:12px;font-weight:700;color:#f0d28a;text-shadow:0 1px 0 #000;pointer-events:none}
  .part .l{display:block;font:italic 400 10px/1 "Libre Baskerville",serif;color:#dcc69b;pointer-events:none;margin-top:-2px}
  .part[disabled]{opacity:.35}
  .pz-bar{right:6px;top:6px;bottom:auto} .pz-bar button{min-width:36px;min-height:36px;padding:0;font-size:18px;opacity:.9}
  #ghost{position:fixed;pointer-events:none;z-index:40;display:none;transform:translate(-50%,-50%)}
  #book{position:fixed;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center}
  #book.on{display:flex}
  #leaf{width:min(820px,96vw);max-height:92dvh;overflow:auto;color:var(--ink);padding:16px 22px 20px;background:linear-gradient(#f4ead2,#e3d2aa);border:1px solid #6b4a22;box-shadow:0 20px 50px #000}
  #leaf h2{font:400 28px "Fredericka the Great",serif;color:var(--red);margin:0 0 4px} #leaf h3{font:400 19px "Fredericka the Great",serif;color:var(--green);margin:12px 0 4px}
  #tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0} #tabs button.on{background:linear-gradient(#b8452c,#7d2414);color:#fff3df}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
  .pz{background:#fffaf0aa;border:1px solid #8a6a3a;padding:6px 8px;text-align:left;font-weight:400;min-height:0;box-shadow:none;color:var(--ink)}
  .pz b{display:block;font-size:13.5px} .pz small{color:var(--ink2);font-size:12px} .pz.done{border-color:var(--green);background:#e6f0e0} .pz:disabled{opacity:.45}
  .mech{display:grid;grid-template-columns:38px 1fr;gap:2px 10px;padding:6px 0;border-bottom:1px dotted #8a6a3a88;font-size:14px}
  .mech .g{font-size:26px;text-align:center;color:var(--brass2)} .mech.unk{color:#8f7a5c} .mech small{display:block;color:var(--ink2);font-style:italic;font-size:12.5px}
  .note{font-style:italic;color:var(--ink2);font-size:14px}
  .hist{display:flex;align-items:flex-end;gap:2px;height:70px;margin:8px 0 2px;border-bottom:1px solid #6b4a22}
  .hist i{flex:1;background:#8a6a3a;min-height:2px} .hist i.me{background:var(--red)}
  .toast-wrap{bottom:auto;top:80px} .toast{background:linear-gradient(#f4ead2,#e3d2aa);color:var(--ink);border:1px solid #6b4a22;border-radius:2px;font:15px "Libre Baskerville",serif}
  .toast b{color:var(--red)}
  .modal{background:linear-gradient(#f4ead2,#e3d2aa);color:var(--ink);border:1px solid #6b4a22;border-radius:2px;font:15px/1.45 "Libre Baskerville",serif}
  .modal h2{font:400 28px "Fredericka the Great",serif;color:var(--red)} .modal .modal-actions{background:#e8d9b5}
  #stamp{position:fixed;left:50%;top:45%;width:180px;height:180px;margin:-90px 0 0 -90px;pointer-events:none;opacity:0;z-index:30}
  #stamp.on{animation:stamp 2.4s ease-out forwards}
  @keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-40deg)}20%{opacity:1;transform:scale(.95) rotate(-10deg)}28%{transform:scale(1.03) rotate(-10deg)}80%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-10deg)}}
  @media (max-width:640px){
    header{padding:4px 8px;gap:6px} h1{font-size:21px} header button{padding:4px 8px;font-size:13px}
    #card{margin:0 6px 4px;font-size:13px;padding:4px 8px} #card .n{font-size:16px}
    #bin{gap:4px;justify-content:flex-start} .part{width:44px;height:52px} .part canvas{width:42px;height:36px}
    #stage{margin:0 4px}
  }
  @media (max-height:500px) and (min-width:560px){
    header{padding:2px 8px} h1{font-size:19px} #card{margin:0 8px 2px;padding:2px 8px;font-size:12.5px}
    main{flex-direction:row} #bin{flex-direction:column;flex-wrap:wrap;width:110px;overflow-y:auto;justify-content:flex-start;align-content:flex-start}
    .part{width:48px;height:50px} .part canvas{width:46px;height:34px}
  }
  main{flex:1;min-height:0;display:flex;flex-direction:column}
</style>
</head>
<body>
<header>
  <a class="home" href="../index.html">← Rabbit Holes</a>
  <h1>Contraption</h1>
  <span class="sp"></span>
  <button id="runBtn" class="go">▶ Run</button>
  <button id="bookBtn">Book</button>
</header>
<div id="card" aria-live="polite"><span class="n" id="pzN"></span><span class="t" id="pzT"></span><span class="c" id="pzC"></span></div>
<main>
  <div id="stage" data-play><canvas id="cv" aria-label="The workbench"></canvas>
    <div id="pop" role="toolbar" aria-label="Part"><button data-a="l" aria-label="Turn left">⟲</button><button data-a="r" aria-label="Turn right">⟳</button><button data-a="x" aria-label="Put back in the box">✕</button></div>
  </div>
  <div id="bin" role="toolbar" aria-label="Parts box"></div>
</main>
<canvas id="ghost" width="120" height="120"></canvas>
<div id="book" role="dialog" aria-label="The book"><div id="leaf"></div></div>
<svg id="stamp" viewBox="0 0 180 180" aria-hidden="true"><defs><radialGradient id="br" cx=".4" cy=".35"><stop offset="0" stop-color="#f6dc8e"/><stop offset=".6" stop-color="#c7983c"/><stop offset="1" stop-color="#7d5c1e"/></radialGradient></defs>
  <g transform="translate(90 90)"><path id="gear" fill="url(#br)" stroke="#5a3d12" stroke-width="2"/><circle r="50" fill="none" stroke="#5a3d12" stroke-width="2"/>
  <text y="-8" text-anchor="middle" font-family="Fredericka the Great" font-size="20" fill="#3a250c">PATENT</text><text y="18" text-anchor="middle" font-family="Fredericka the Great" font-size="20" fill="#3a250c">GRANTED</text></g></svg>
<script src="../shared/common.js"></script>
<script src="../shared/fx.js"></script>
<script src="../shared/panzoom.js"></script>
<script src="../shared/vendor/planck/planck-1.5.0.min.js"></script>
<script>
'use strict';
const pl=planck;
// ===================== The bench: 24 × 14 m, y up. Drawn at SC px per metre. =====================
const BW=24, BH=14, SC=40, DT=1/60, TMAX=20*60;
// Parts in the box. cost: what a part costs on the patent drawing; the score is the total.
const PARTS={
  plank:{n:'Plank', cost:1, d:'A fixed beech plank. Turn it into a ramp or a shelf.'},
  spring:{n:'Spring', cost:2, d:'A fixed sprung board: whatever lands on it bounces back.'},
  domino:{n:'Domino', cost:1, d:'A tall thin block that topples.'},
  crate:{n:'Block', cost:1, d:'A maple block.'},
  ball:{n:'Iron ball', cost:2, d:'Heavy. It rolls and it hits hard.'},
  seesaw:{n:'Seesaw', cost:3, d:'A board on a pivot: a lever, or a catapult.'},
  balloon:{n:'Balloon', cost:2, d:'Lighter than air: it rises and pushes up whatever is above it.'},
  pendulum:{n:'Pendulum', cost:3, d:'A bob on a rod from a fixed pin. Turn it to pull the bob back.'},
};
const PTYPES=Object.keys(PARTS);
// ===================== Puzzles =====================
// fixed: static boxes [x,y,halfW,halfH,angleDeg]. marble: the red glass marble's start. goal: cup [x,y] | bell [x,y] | lift {box:[x,y], line} | topple {vase:[x,y], line}
const PUZZLES=[
 {id:'roll', n:'The first roll', t:'Get the red marble into the cup. Drag parts from the box; tap one to turn it.', marble:[2.2,9.4], fixed:[[2.5,9,2.4,.12,-8]], goal:{cup:[17,0]}, bin:{plank:3}},
 {id:'gap', n:'Mind the gap', t:'The marble must cross the gap to the cup on the far shelf.', marble:[1.6,7.4], fixed:[[2.5,7,2.2,.12,-10],[19,5,4,.15,0]], goal:{cup:[19.5,5.15]}, bin:{plank:2,spring:1}},
 {id:'bell', n:'Ring the bell', t:'Make anything strike the brass bell hard.', marble:[2,11.4], fixed:[[2.5,11,2,.12,-12]], goal:{bell:[20,7]}, bin:{plank:2,spring:1,ball:1}},
 {id:'domino', n:'A row of dominoes', t:'Topple the vase off its shelf. You may not touch it with the marble directly.', marble:[1.5,4.4], fixed:[[2,4,1.6,.12,-10],[21,3,2.2,.12,0]], goal:{topple:[21.6,3.12], line:2.2}, bin:{domino:8,plank:1}},
 {id:'lever', n:'The lever', t:'Lift the heavy block above the dotted line.', marble:[3,12.4], fixed:[[3.5,12,2,.12,-12]], goal:{lift:[16,0.5], line:4.5}, bin:{seesaw:1,ball:2,plank:1}},
 {id:'catapult', n:'Catapult', t:'Get the marble up onto the high shelf and into the cup.', marble:[4,0.31], fixed:[[19,7,4,.15,0]], goal:{cup:[19,7.15]}, bin:{seesaw:1,ball:2,plank:2}},
 {id:'balloon', n:'Lighter than air', t:'The marble sits in a pit. Get it out and into the cup.', marble:[6,1.3], fixed:[[3.5,1.5,.15,1.5,0],[8.5,1.5,.15,1.5,0],[6,.08,2.6,.08,0]], goal:{cup:[16,6.15]}, fixedExtra:[[16,6,2.2,.15,0]], bin:{balloon:2,plank:2,crate:1}},
 {id:'pendulum', n:'The pendulum', t:'Knock the marble off its perch and into the cup below.', marble:[12,6.45], fixed:[[12,6,.8,.12,0]], goal:{cup:[19,0]}, bin:{pendulum:1,plank:2}},
 {id:'chain', n:'Chain reaction', t:'Ring the bell, high on the right. Start with the marble.', marble:[1.5,12.4], fixed:[[2,12,1.6,.12,-10],[8,6,3,.12,0]], goal:{bell:[21,10]}, bin:{domino:6,seesaw:1,ball:1,plank:2,spring:1}},
 {id:'lift2', n:'Counterweight', t:'Raise the block onto the high ledge line.', marble:[1.5,13], fixed:[[2,12.6,1.6,.12,-10]], goal:{lift:[18,0.5], line:6}, bin:{seesaw:1,ball:3,plank:3,balloon:1}},
 {id:'twocup', n:'Over the wall', t:'A wall stands between the marble and the cup.', marble:[2,6.4], fixed:[[2.5,6,2,.12,-10],[12,3,.2,3,0]], goal:{cup:[18,0]}, bin:{plank:2,spring:2,balloon:1,seesaw:1}},
 {id:'grand', n:'The grand machine', t:'Ring the bell using as few parts as you can.', marble:[22,12.4], fixed:[[22,12,1.6,.12,8],[6,8,3,.12,0],[14,4,3,.12,0]], goal:{bell:[2,2]}, bin:{plank:4,domino:6,seesaw:1,ball:2,spring:2,balloon:1,pendulum:1}},
];
const pById=Object.fromEntries(PUZZLES.map(p=>[p.id,p]));
// ===================== Daily: a seeded bench built from a template, kept only if its template machine works =====================
function dailyPuzzle(key){
  const r=RH.rng('contraption:'+key);
  for (let tries=0; tries<40; tries++){
    const mx=1.5+r()*2, my=7+r()*5, cx=14+r()*7, cy=r()<.5? 0 : 2+r()*3, wallX=9+r()*3, wallH=1+r()*3;
    const P={id:'daily:'+key, n:'Daily bench '+key, t:'Get the marble into the cup. Fewest parts by cost wins the day.', marble:[mx,my+.4], fixed:[[mx+.5,my,1.5,.12,-10],[wallX,wallH/2,.2,wallH/2,0]], goal:{cup:[cx,cy]},
      bin:{plank:3,spring:1,ball:1,seesaw:1,balloon:1}, daily:true};
    if (cy>0) P.fixed.push([cx,cy-.15,1.6,.15,0]);
    // the template machine: a plank under the shelf's lip, a spring at the foot of its fall, a plank down to the cup
    if (solvable(P, r)) return P;
  }
  return {...PUZZLES[0], id:'daily:'+key, n:'Daily bench '+key, daily:true};
}
// a quick random search for a working machine (used to vet daily benches): true if any of a few seeded tries wins
function solvable(P, r){ for (let k=0;k<160;k++){ const parts=randomParts(P, r, 3); if (simulate(P, parts).won){ P.sol=parts; return true; } } return false; }
function randomParts(P, r, maxN){ const out=[]; const bin=Object.entries(P.bin); const n=1+Math.floor(r()*maxN);
  for (let k=0;k<n;k++){ const [t,c]=bin[Math.floor(r()*bin.length)]; if (out.filter(p=>p[0]===t).length>=c) continue; out.push([t, Math.round((1+r()*22)*4)/4, Math.round((.5+r()*12)*4)/4, Math.round(r()*24)-12]); }
  return out; }

// ===================== Physics: one world per run, fixed step, the same order every time =====================
let world=null, bodies=[], marble=null, goalBody=null, track=null;
const FR=(o)=>Object.assign({friction:.5, restitution:.1, density:1}, o);
function boxBody(type,x,y,hw,hh,deg,fix){ const b=world.createBody({type, position:pl.Vec2(x,y), angle:deg*Math.PI/180}); b.createFixture(pl.Box(hw,hh), FR(fix)); return b; }
function ballBody(x,y,r,fix,type='dynamic'){ const b=world.createBody({type, position:pl.Vec2(x,y), bullet:true}); b.createFixture(pl.Circle(r), FR(fix)); return b; }
function build(P, parts){
  world=new pl.World({gravity:pl.Vec2(0,-10)}); bodies=[];
  const ground=world.createBody(); ground.createFixture(pl.Box(BW/2+1,.5,pl.Vec2(BW/2,-.5),0),FR({friction:.6})); ground.createFixture(pl.Box(.5,BH,pl.Vec2(-.5,BH/2),0)); ground.createFixture(pl.Box(.5,BH,pl.Vec2(BW+.5,BH/2),0));
  for (const f of [...P.fixed, ...(P.fixedExtra||[])]){ const b=boxBody('static',f[0],f[1],f[2],f[3],f[4]||0,{friction:.4}); bodies.push({kind:'fixed', b, hw:f[2], hh:f[3]}); }
  const g=P.goal; goalBody=null;
  if (g.cup){ const [cx,cy]=g.cup, b=world.createBody({type:'static', position:pl.Vec2(cx,cy)}); b.createFixture(pl.Box(.85,.08,pl.Vec2(0,.08),0),FR()); b.createFixture(pl.Box(.07,.65,pl.Vec2(-.85,.65),0),FR()); b.createFixture(pl.Box(.07,.65,pl.Vec2(.85,.65),0),FR()); bodies.push({kind:'cup', b}); }
  if (g.bell){ const [bx,by]=g.bell; goalBody=ballBody(bx,by,.55,{restitution:.3},'static'); bodies.push({kind:'bell', b:goalBody}); }
  if (g.lift){ goalBody=boxBody('dynamic',g.lift[0],g.lift[1],.6,.5,0,{density:3}); bodies.push({kind:'weight', b:goalBody, hw:.6, hh:.5}); }
  if (g.topple){ goalBody=boxBody('dynamic',g.topple[0],g.topple[1]+.6,.22,.6,0,{density:.6}); bodies.push({kind:'vase', b:goalBody, hw:.22, hh:.6}); }
  marble=ballBody(P.marble[0],P.marble[1],.3,{density:2,restitution:.35,friction:.3}); bodies.push({kind:'marble', b:marble});
  parts.forEach((p,i)=>{ for (const o of makePart(p)) bodies.push({...o, part:i, ptype:p[0]}); });
  track=newTrack();
  world.on('begin-contact', c=>contact(c));
}
// a placed part: [type, x, y, turn] (turn in 15° steps; for a pendulum, how far the bob is pulled back)
function makePart([t,x,y,turn]){ const a=(turn||0)*15;
  switch(t){
    case 'plank': return [{kind:'plank', b:boxBody('static',x,y,1.5,.12,a,{friction:.35}), hw:1.5, hh:.12}];
    case 'spring': return [{kind:'spring', b:boxBody('static',x,y,1,.15,a,{restitution:.95,friction:.2}), hw:1, hh:.15}];
    case 'domino': return [{kind:'domino', b:boxBody('dynamic',x,y,.12,.6,a,{density:1,friction:.5}), hw:.12, hh:.6}];
    case 'crate': return [{kind:'crate', b:boxBody('dynamic',x,y,.4,.4,a,{density:1}), hw:.4, hh:.4}];
    case 'ball': return [{kind:'ball', b:ballBody(x,y,.35,{density:6,restitution:.2,friction:.4})}];
    case 'balloon': { const b=ballBody(x,y,.5,{density:.15,restitution:.4}); b.setLinearDamping(.6); return [{kind:'balloon', b}]; }
    case 'seesaw': { const pv=world.createBody({type:'static', position:pl.Vec2(x,y)}); pv.createFixture(pl.Polygon([pl.Vec2(-.4,-.6),pl.Vec2(.4,-.6),pl.Vec2(0,0)]),FR());
      const bd=boxBody('dynamic',x,y+.12,2,.1,a,{density:1,friction:.6}); world.createJoint(pl.RevoluteJoint({}, pv, bd, pl.Vec2(x,y+.05)));
      return [{kind:'pivot', b:pv}, {kind:'seesaw', b:bd, hw:2, hh:.1}]; }
    case 'pendulum': { const pin=world.createBody({type:'static', position:pl.Vec2(x,y)}); pin.createFixture(pl.Circle(.12),FR({isSensor:true}));
      const ang=-Math.PI/2+a*Math.PI/180, L=2.2, bob=ballBody(x+Math.cos(ang)*L, y+Math.sin(ang)*L, .38, {density:5,restitution:.2});
      world.createJoint(pl.DistanceJoint({frequencyHz:0, dampingRatio:0}, pin, bob, pl.Vec2(x,y), bob.getPosition()));
      return [{kind:'pin', b:pin}, {kind:'bob', b:bob, pin:[x,y]}]; }
  }
  return [];
}
// ===================== Goals =====================
function goalState(P){ const g=P.goal, m=marble.getPosition();
  if (g.cup){ const [cx,cy]=g.cup; return Math.abs(m.x-cx)<.75 && m.y>cy && m.y<cy+1.3; }
  if (g.bell) return track.bellHit;
  if (g.lift) return goalBody.getPosition().y-.5>g.line;
  if (g.topple) return goalBody.getPosition().y<g.line;
  return false; }
function step(P){ for (const o of bodies) if (o.kind==='balloon'){ const b=o.b; b.applyForceToCenter(pl.Vec2(0, b.getMass()*10*2.6), true); }
  world.step(DT, 8, 3); track.t++; observe(); const ok=goalState(P); track.hold= ok? track.hold+1 : 0; return track.hold>=45; }
// run a whole machine without drawing: for tests, the daily vetting and the solver histograms
function simulate(P, parts, steps=TMAX){ build(P, parts); let won=false, t=0; for (; t<steps && !won; t++) won=step(P); return {won, t, mech:[...track.found]}; }

// ===================== Mechanisms recognised from behaviour (the codex) =====================
const MECHS=[
 ['incline','Inclined plane','◢','A ball sped up rolling down a sloping plank.','The first of the six simple machines of Renaissance mechanics: a slope trades distance for force.'],
 ['projectile','Projectile','⌒','Something flew free through the air for most of a second.','Galileo showed the path is a parabola: steady sideways, ever faster downwards.'],
 ['rebound','Spring rebound','≋','Something bounced off a spring and flew back up fast.','Hooke, 1678: ut tensio, sic vis. As the stretch, so the force.'],
 ['dominoes','Domino run','▮▮▮','Five dominoes fell one after another.','A falling domino can topple one half again as big: a chain grows its own power.'],
 ['lever','Lever','⚖','A seesaw tipped and lifted something on its other end.','Archimedes: give me a place to stand and I will move the earth.'],
 ['catapult','Catapult','➶','A seesaw flung something upward.','The siege engine of the Middle Ages is a lever swung fast.'],
 ['counterweight','Counterweight','⚓','A heavy load went down while a lighter one went up on the same lever.','The trebuchet and the lift both lean on a falling weight.'],

function newTrack(){ return {t:0, hold:0, found:new Set(), bellHit:false, air:new Map(), started:new Set(), chainOrder:[], fallen:[], swing:0, lastSide:0, minY:new Map(), firstY:new Map()}; }

function contact(c){ const A=bodyInfo(c.getFixtureA().getBody()), B=bodyInfo(c.getFixtureB().getBody()); if (!A||!B) return;

}

  if (mode==='run' && !won && track.t<TMAX && !$('book').classList.contains('on')){ acc+=dt; let n=0; while (acc>=DT && n<4){ acc-=DT; n++; if (step(P)){ won=true; onWin(); break; } } if (n===4) acc=0; noteMechs(); }
  draw(); }
function noteMechs(){ for (const m of track.found){ if (SAVE.mech[m]) continue; SAVE.mech[m]=today(); persist(); const M=MECHS.find(x=>x[0]===m); RH.toast(`Discovered: <b>${M[1]}</b>. ${M[3]}`, 3800); FX.sfx('chime', MECHS.indexOf(M)); } }
function onWin(){ if (sandbox) return; const c=costOf(parts); FX.sfx('win'); const s=$('stamp'); s.classList.remove('on'); void s.offsetWidth; s.classList.add('on');
  let first=false; if (P.daily){ const k=P.id.slice(6); if (SAVE.daily[k]==null || c<SAVE.daily[k]){ SAVE.daily[k]=c; } } else { first=SAVE.best[P.id]==null; if (first || c<SAVE.best[P.id]) SAVE.best[P.id]=c; } persist(); renderCard();
  setTimeout(()=>{ const h=HIST[P.id]; const bars= h? histHTML(h,c) : '';
    RH.modal(`<h2>It works!</h2><p>Your machine cost <b>${c}</b>${P.par?` (par ${P.par})`:''}. ${h?'Here is how it compares with the machines a solver found for this bench:':''}</p>${bars}<p class="note">A cheaper machine may exist. Rebuild it, or go on.</p>`,[{label:'Improve it'},{label:'Next bench'}]).then(l=>{ if (l==='Next bench'){ const i=PUZZLES.indexOf(P); if (i>=0 && i<PUZZLES.length-1) openPuzzle(PUZZLES[i+1]); else openBook('benches'); } else { mode='build'; build(P,parts); renderCard(); renderBin(); } }); }, 1300); }
function histHTML(h,c){ const max=Math.max(...h.map(x=>x[1])); return `<div class="hist">${h.map(([cost,n])=>`<i class="${cost===c?'me':''}" style="height:${Math.max(3,n/max*100)}%" title="cost ${cost}: ${n}"></i>`).join('')}</div><div class="note" style="display:flex;justify-content:space-between"><span>cost ${h[0][0]}</span><span>cost ${h[h.length-1][0]}</span></div>`; }

// ===================== The Book: benches, mechanisms, daily, sandbox =====================
let tab='benches';
function openBook(t){ tab=t||tab; $('book').classList.add('on'); drawBook(); }
function closeBook(){ $('book').classList.remove('on'); }
$('bookBtn').onclick=()=>openBook(); $('book').addEventListener('click', e=>{ if (e.target.id==='book') closeBook(); });
function drawBook(){ const nm=Object.keys(SAVE.mech).length;
  let h=`<div style="display:flex;align-items:center;gap:8px"><h2 style="flex:1">The Toymaker's Book</h2><button id="bkClose">Close</button></div>
    <div id="tabs">${[['benches','Benches'],['mech','Mechanisms · '+nm+'/'+MECHS.length],['daily','Daily bench'],['sandbox','Sandbox']].map(([k,n])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${n}</button>`).join('')}</div>`;
  if (tab==='benches'){ h+=`<p class="note">Any machine that works passes. The cost of its parts is its score: lower is better, and the solver's histogram shows how yours compares.</p><div class="grid">`+PUZZLES.map((p,i)=>`<button class="pz ${SAVE.best[p.id]!=null?'done':''}" data-p="${p.id}" ${puzzleOpen(i)?'':'disabled'}><b>${i+1}. ${p.n}</b><small>${SAVE.best[p.id]!=null? 'best cost '+SAVE.best[p.id] : puzzleOpen(i)? 'unsolved' : 'locked'}</small></button>`).join('')+'</div>'; }
  else if (tab==='mech'){ h+=`<p class="note">Mechanisms are recognised from what your machines actually do while they run. ${nm} of ${MECHS.length} found.</p>`+MECHS.map(m=>SAVE.mech[m[0]]? `<div class="mech"><span class="g">${m[2]}</span><div><b>${m[1]}</b> <small>first seen ${SAVE.mech[m[0]]}: ${m[3]}</small><small>${m[4]}</small></div></div>` : `<div class="mech unk"><span class="g">?</span><div><b>Undiscovered</b><small>${m[3]}</small></div></div>`).join(''); }
  else if (tab==='daily'){ const k=today(); h+=`<p class="note">One bench a day, the same for everyone, built from the date. Lowest cost wins the day.</p><p>Today's best: <b>${SAVE.daily[k]??'none yet'}</b>. <button data-daily="${k}">Open today's bench</button></p>`; }
  else h+=`<p class="note">Every part, no goal. Build, run, rebuild. Copy a link and whoever opens it sees exactly your machine run exactly as it did for you.</p><p><button data-sandbox="1">Open the sandbox</button> <button id="shareBtn">Copy a link to this machine</button></p><p class="note" id="shareOut"></p>`;
  $('leaf').innerHTML=h; }
$('leaf').addEventListener('click', e=>{ const b=e.target.closest('button'); if (!b) return;
  if (b.id==='bkClose') return closeBook(); if (b.dataset.tab){ tab=b.dataset.tab; drawBook(); return; }
  if (b.dataset.p){ openPuzzle(pById[b.dataset.p]); history.replaceState(null,'',location.pathname); closeBook(); return; }
  if (b.dataset.daily){ openPuzzle(dailyPuzzle(b.dataset.daily)); history.replaceState(null,'',location.pathname+'#daily='+b.dataset.daily); closeBook(); return; }
  if (b.dataset.sandbox){ openPuzzle(sandboxPuzzle()); closeBook(); return; }
  if (b.id==='shareBtn'){ const url=location.origin+location.pathname+'#m='+encodeMachine(); history.replaceState(null,'',url); try{ navigator.clipboard.writeText(url); }catch(_){} $('shareOut').textContent='Link copied; it is also in the address bar.'; } });
// share links: the bench and every part, exactly
function encodeMachine(){ const o={p:P.sandbox?'sandbox':P.id, s:parts.map(p=>[PTYPES.indexOf(p[0]),Math.round(p[1]*4),Math.round(p[2]*4),p[3]|0])}; return btoa(JSON.stringify(o)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function decodeMachine(s){ try{ const o=JSON.parse(atob(s.replace(/-/g,'+').replace(/_/g,'/'))); const ps=(o.s||[]).slice(0,200).filter(q=>Array.isArray(q)&&PTYPES[q[0]]).map(q=>[PTYPES[q[0]], Math.max(.3,Math.min(BW-.3,q[1]/4)), Math.max(.3,Math.min(BH-.3,q[2]/4)), Math.max(-12,Math.min(12,q[3]|0))]);
  const p= o.p==='sandbox'? sandboxPuzzle() : String(o.p).startsWith('daily:')? dailyPuzzle(String(o.p).slice(6,16)) : pById[o.p]; if (!p) return null; return {p, ps}; } catch(e){ return null; } }

// ===================== Start =====================
(function boot(){ const h=decodeURIComponent(location.hash.slice(1)); let done=false;
  if (h.startsWith('m=')){ const m=decodeMachine(h.slice(2)); if (m){ openPuzzle(m.p, m.ps); done=true; } }
  if (!done && h.startsWith('daily=') && /^\d{4}-\d\d-\d\d$/.test(h.slice(6))){ openPuzzle(dailyPuzzle(h.slice(6))); done=true; }
  if (!done){ const i=PUZZLES.findIndex((p,i)=>SAVE.best[p.id]==null && puzzleOpen(i)); openPuzzle(PUZZLES[Math.max(0,i)]); }
  requestAnimationFrame(()=>{ cam.fit(false); requestAnimationFrame(frame); });
  const gp=[]; for (let k=0;k<24;k++){ const a=k/24*Math.PI*2, r=k%2? 76:86; gp.push((k?'L':'M')+(Math.cos(a)*r).toFixed(1)+' '+(Math.sin(a)*r).toFixed(1)); } $('gear').setAttribute('d',gp.join(' ')+'Z');
  if (!SAVE.intro){ SAVE.intro=1; persist(); RH.modal(`<h2>Contraption</h2><p>A toymaker's bench. Each card asks for one thing: a marble in a cup, a bell rung, a block lifted.</p><p><b>Drag parts from the box onto the board, tap a part to turn it, then press Run.</b> Any machine that works passes; cheaper machines score better.</p>`,[{label:'To the bench'}]); }
})();
window.__con={ PUZZLES, PARTS, PTYPES, MECHS, HIST, pl, get world(){ return world; }, get bodies(){ return bodies; }, get marble(){ return marble; }, get track(){ return track; }, get parts(){ return parts; }, set parts(v){ parts=v; },
  get P(){ return P; }, get mode(){ return mode; }, get SAVE(){ return SAVE; }, get sel(){ return sel; }, cam, toM, toScreenM, build, step, simulate, goalState, openPuzzle, dailyPuzzle, randomParts, solvable, encodeMachine, decodeMachine, cleanSave, costOf, sandboxPuzzle, rebuild, draw, noteMechs, puzzleOpen, pById };
</script>
