addEventListener('keyup', e => { if (e.key === ' ' && MECH && MECH.sat) setHold(false); });
$('lvbtn').onclick = () => { FX.sfx('click'); $('levels').classList.toggle('open'); };
$('lens').onclick = () => coda();

// ======================================================================
// Waiter, mechanisms, glitch
// ======================================================================
let meterT = 0; const meterDue = () => { const n = performance.now(); if (n - meterT < 90) return false; meterT = n; return true; };
const Y_UP = [0, 1, 0], wUp = [0, 0, 0], wAx = [0, 0, 0];
function stepWaiter(dt) {
  const w = waiter, o = OBJ[0]; if (!w || won) return;
  RIB[0].relaxIter(6, RIB[0].length() - RIB[0].dmin() > .4 ? 1e-3 : 0); // the arm is a muscle: it relaxes continuously
  if (!w.started) return; w.t += dt;

  w.bumpT -= dt; if (w.bumpT <= 0) { const hard = L.time ? 1.5 : 1; w.bumpT = (1.4 + Math.random() * 1.4) / hard; const a = Math.random() * TAU; w.bump = { ax: [Math.cos(a), 0, Math.sin(a)], ang: (5 + Math.random() * 7) * hard * D2R, t: 0 }; if (!window.__belt.calm) FX.sfx('place'); else w.bump = null; }
  if (w.bump) { const b = w.bump, k0 = b.t; b.t = Math.min(1, b.t + dt / .25); rotateBy(o, b.ax, b.ang * (FX.ease.outCubic(b.t) - FX.ease.outCubic(k0))); if (b.t >= 1) w.bump = null; }

  const up = qrot(o.q, Y_UP, wUp); let tilt = Math.acos(FX.clamp(up[1], -1, 1)) / D2R;
  if (tilt > .3 && !(drag.on && w.tilting)) { wAx[0] = -up[2]; wAx[1] = 0; wAx[2] = up[0]; rotateBy(o, wAx, tilt * D2R * (1 - Math.exp(-.7 * dt))); qrot(o.q, Y_UP, up); tilt = Math.acos(FX.clamp(up[1], -1, 1)) / D2R; }

  else w.snapped = false;
  if (!meterDue()) return; $('meter').style.display = 'block';
  $('meter').innerHTML = `turned <b>${turned.toFixed(0)}°</b> / 720° ${L.time ? ` · ⏱ ${Math.max(0, L.time - w.t).toFixed(1)} s` : ''}<div class="bar"><i style="width:${Math.min(100, turned / 7.2)}%"></i></div>spill<div class="bar"><i style="width:${Math.min(100, w.spill)}%"></i></div>tilt ${tilt.toFixed(0)}°`;

function stepMech(dt) {

const jitQ = new THREE.Quaternion(), tq = new THREE.Quaternion(), jitE = new THREE.Euler(), invQ = new THREE.Quaternion();

  for (const o of OBJ) {

    let g = 0; if (glitchT > 0) g = glitchT; else if (glitchy) g = .12 + (Math.sin(now * .013) > .93 ? .5 : 0);
    if (g > 0) { const a = g * .06; jitQ.setFromEuler(jitE.set((Math.random() - .5) * a, (Math.random() - .5) * a, (Math.random() - .5) * a)); tq.multiply(jitQ); }

// ======================================================================
// Spinor lamp + S³ lens (2D chips)
// ======================================================================
const lc = $('lampc').getContext('2d'), lampT = $('lampt'); let lampKey = '';
function drawLamp() { // redraws only when the shown value changes (or every frame while the −1 glitch shakes)
  if (!RIB.length) return; const hidden = hideSign(); let v = 1; for (const r of RIB) v = Math.min(v, r.endDot());
  const neg = !hidden && v < -.97, key = hidden ? 'h' : neg ? 'n' : v.toFixed(2); if (key === lampKey && !neg) return; lampKey = key;
  const x = (v + 1) / 2, col = hidden ? '#8a80a0' : `hsl(${x * 140}, 85%, ${55 + (neg ? Math.random() * 15 : 0)}%)`;
  lc.clearRect(0, 0, 88, 88); const ox = neg ? (Math.random() - .5) * 6 : 0;
  const gr = lc.createRadialGradient(44 + ox, 44, 4, 44, 44, 42); gr.addColorStop(0, hidden ? '#cfc6dd' : '#fff'); gr.addColorStop(.25, col); gr.addColorStop(1, 'rgba(0,0,0,0)'); lc.fillStyle = gr; lc.beginPath(); lc.arc(44, 44, 42, 0, TAU); lc.fill();
  if (neg) { lc.fillStyle = 'rgba(255,40,80,.5)'; lc.fillRect(0, Math.random() * 80, 88, 3); lc.fillStyle = 'rgba(80,200,255,.4)'; lc.fillRect(0, Math.random() * 80, 88, 2); }
  const txt = hidden ? '?' : (v > .97 ? '+1' : neg ? '−1' : (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2));
  if (lampT.textContent !== txt) lampT.textContent = txt; lampT.style.color = neg ? '#ff9a9a' : v > .97 && !hidden ? '#9af0c0' : '#f1ebe0';
  lampT.style.transform = neg ? `translateX(${(Math.random() - .5) * 3}px)` : '';
}
const lens = $('lens'), lx = lens.getContext('2d');
function drawLens(now) {
  if (lens.style.display === 'none' || MOBILE || !RIB.length) return;
  const W = 340, H = 380, cx = W / 2, cy = 200, R = 140, yaw = now * .00025, ct = Math.cos(yaw), st = Math.sin(yaw), tilt = .35;
  lx.clearRect(0, 0, W, H); lx.fillStyle = '#c9bcd6'; lx.font = '22px Space Grotesk, sans-serif'; lx.textAlign = 'center'; lx.fillText('rotation space · lens', cx, 34);
  const gr = lx.createRadialGradient(cx - 40, cy - 40, 10, cx, cy, R); gr.addColorStop(0, 'rgba(120,100,200,.25)'); gr.addColorStop(1, 'rgba(60,40,110,.1)'); lx.fillStyle = gr; lx.beginPath(); lx.arc(cx, cy, R, 0, TAU); lx.fill();
  lx.strokeStyle = 'rgba(255,220,180,.3)'; lx.lineWidth = 2; lx.stroke();
  const P = (v) => { const x = v[0] * ct + v[2] * st, z = -v[0] * st + v[2] * ct, y = v[1] * Math.cos(tilt) - z * Math.sin(tilt), zz = v[1] * Math.sin(tilt) + z * Math.cos(tilt); return [cx + x * R, cy - y * R, zz]; };
  if (hideSign()) { lx.fillStyle = '#c9bcd6'; lx.font = '64px Fraunces, Georgia, serif'; lx.fillText('?', cx, cy + 22); lx.font = '22px Space Grotesk, sans-serif'; lx.fillText('hidden while you bet', cx, H - 14); return; }
  const r = RIB[0], g = r.g, N = r.N; let prev = null, prevSign = 0;
  const toBall = (o, sgn) => { const w = g[o] * sgn, vx = g[o + 1] * sgn, vy = g[o + 2] * sgn, vz = g[o + 3] * sgn, vn = Math.hypot(vx, vy, vz); if (vn < 1e-9) return [0, 0, 0]; const th = 2 * Math.atan2(vn, w) / TAU * 2; return [vx / vn * th, vy / vn * th, vz / vn * th]; };

        lx.fillStyle = '#ff7a7a'; lx.beginPath(); lx.arc(q[0], q[1], 7, 0, TAU); lx.fill(); lx.beginPath(); lx.arc(p[0], p[1], 7, 0, TAU); lx.fill(); }
      else { lx.strokeStyle = `hsl(${20 + i / N * 30},90%,${60 + p[2] * 15}%)`; lx.beginPath(); lx.moveTo(prev[0], prev[1]); lx.lineTo(p[0], p[1]); lx.stroke(); } }
    prev = p; prevSign = sgn; }

  const v = r.endDot(); lx.fillStyle = v > .97 ? '#9af0c0' : v < -.97 ? '#ff9a9a' : '#c9bcd6'; lx.fillText(v > .97 ? 'loop shrinks: free' : v < -.97 ? 'one antipodal jump: stuck' : 'the ribbon\'s path', cx, H - 14);
}
function coda() {
  RH.modal(`<h2>Why 720° but not 360°?</h2>
  <p>Each slice of the ribbon has an orientation, so the whole ribbon is a <b>path through the space of rotations</b>, from the wall's to the cube's. RELAX shortens that path. It goes flat only if the path can shrink to nothing.</p>
  <p>The space of rotations is a ball: direction is the axis, distance from the centre is the angle, up to 180°. A 180° turn one way equals 180° the other way, so <b>opposite points on the surface are glued</b>. A 360° turn runs out to the surface and reappears on the opposite side: a loop that can't shrink. Run it twice and the two jumps can be slid together and cancelled. That's the lens in the corner.</p>
  <p>Algebraically, each rotation has two names in <b>SU(2)</b> (unit quaternions on the 3-sphere S³): q and −q. Turning continuously moves the name smoothly; 360° carries +1 to −1, 720° back to +1. The game tracks this lifted q exactly, and the lamp shows its sign. The ribbon relaxes flat only at +1.</p>
  <p>Electrons are <b>spinors</b>: rotate one by 360° and its quantum state picks up exactly this −1. Neutron interferometers measured it in 1975.</p>`, [{ label: 'Lovely' }]);
}

// ======================================================================
// Loop (render on demand)
// ======================================================================
// The rAF loop only runs while something moves; wake() restarts it. Hidden tabs stop it entirely.
let activeUntil = 0, rafOn = false, last = 0, glitchSkip = 0;
function wake(ms = 300) { activeUntil = Math.max(activeUntil, performance.now() + ms); if (!rafOn && !document.hidden) { rafOn = true; last = performance.now(); requestAnimationFrame(frame); } }
document.addEventListener('visibilitychange', () => { if (!document.hidden) wake(300); });
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); if (composer) { composer.setSize(w, h); bloom.resolution.set(w * .6, h * .6); } camera.aspect = w / h; camera.updateProjectionMatrix(); if (L) placeCamera(SETUPS_CAM()); wake(300); }
const SETUPS_CAM = () => CAMS[L.setup];
addEventListener('resize', resize);
let nFrames = 0, nRenders = 0;
const render = () => { nRenders++; composer ? composer.render() : renderer.render(scene, camera); };
function frame(now) {
  if (document.hidden) { rafOn = false; return; }
  nFrames++;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (FX.frozen()) { requestAnimationFrame(frame); return; }
  stepQueue(dt); stepSnaps(dt); stepPlayback();
  if (relax.on) stepRelax(dt);
  if (waiter) stepWaiter(dt);
  if (MECH) stepMech(dt);
  if (glitchT > 0) glitchT = Math.max(0, glitchT - dt);
  let flashing = false;
  for (const r of RIB) { if (r.flash > 0) { r.flash = Math.max(0, r.flash - dt * 1.5); r.dirty = flashing = true; } r.update(); }
  stepParticles(dt);
  const glitchy = syncMeshes(now), so = FX.shakeOffset(10), shaking = so[0] !== 0 || so[1] !== 0;
  const busyNow = relax.on || cur || queue.length || snaps.length || drag.on || pAlive || (waiter && waiter.started && !won) || (MECH && (MECH.running || MECH.hold)) || glitchT > 0 || playback || flashing || shaking;
  drawLamp(); if ((now / 50 | 0) !== frame.lt) { frame.lt = now / 50 | 0; drawLens(now); }
  controls.update();
  const live = busyNow || now < activeUntil;
  if (live || (glitchy && ++glitchSkip % 3 === 0)) { // an idle stuck cube only needs ~20 fps for its glitch
    const t = shaking ? `translate(${so[0]}px,${so[1]}px)` : ''; if (canvas.style.transform !== t) canvas.style.transform = t;
    render();
  }

}

// ======================================================================
// Scripted-test hooks
// ======================================================================
window.__belt = {
  LV, G48, bfsPar, seqQ,
  solve(start, gens, goal = [1, 0, 0, 0]) { const gq = gens.map(tokQ), gk = qkey(goal), prev = new Map([[qkey(start), null]]); let fr = [start]; if (qkey(start) === gk) return [];
    while (fr.length) { const nf = []; for (const q of fr) for (let i = 0; i < gq.length; i++) { const r = qnorm(qmul(gq[i], q)), k = qkey(r); if (prev.has(k)) continue; prev.set(k, [qkey(q), gens[i]]); nf.push(r);
      if (k === gk) { const path = []; let c = k; while (prev.get(c)) { path.unshift(prev.get(c)[1]); c = prev.get(c)[0]; } return path; } } fr = nf; } return null; },
  level: i => { loadLevel(i); flushQueue(); },
  rotate: (axis, deg, obj = 0) => { rotateBy(OBJ[obj], axis, deg * D2R); },
  move: tok => { userMove(tok); flushQueue(); check('move'); },
  relax: () => { relaxNow(); return RIB.map(r => r.length()); },
  snap: () => { OBJ.forEach(o => snapObj(o)); for (let i = 0; i < 20; i++) stepSnaps(.05); },
  q: (i = 0) => [...OBJ[i].q], sign: (i = 0) => Math.sign(OBJ[i].q[0]) || 0,

  get busy() { return busy() || snaps.length > 0 || !!(bet && bet.phase === "watch"); }, get won() { return won; }, get level_() { return LI; }, get par() { return L.par; }, get golf() { return golf; }, get bet() { return bet; }, get mech() { return MECH; }, get waiter() { return waiter; }, get yaw() { return yawAcc / D2R; },

// boot

const hash = /#seq=([xyz234\-]+)/.exec(location.hash);
